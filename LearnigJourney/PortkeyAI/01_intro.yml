{
  "strategy": {
    "mode": "fallback",
    "on_status_codes": [246, 446]  // Trigger on guardrail fails
  },
  "targets": [
    {"provider": "@openai-gpt"},
    {"provider": "@anthropic-claude"}  // Backup
  ],
  "input_guardrails": ["gr-injection-check"]
}

Limitations:
 Per-guardrail: INPUT or OUTPUT, not both.
 Async results? Logs only (no response JSON).
 Enterprise for customs; basics free.
 No full-convo history scanning yet.
 
Exploring JSON Schema Checks in Portkey Guardrails:
 JSON Schema validation—a killer feature for ensuring your LLM outputs are structured and reliable.
 JSON Schema Checks are a cornerstone of Portkey's deterministic guardrails, letting you enforce structured output formats (e.g., ensuring a response is a valid JSON object with specific fields.
 
 Step 1: What Are JSON Schema Checks and Why Use Them?
  A JSON Schema Check in Portkey validates that an LLM's output (or input) matches a predefined JSON schema—a blueprint for your data's structure. Think of it as a contract: "Hey, LLM, your response must look like this, or it's getting rejected." This is crucial for production apps where downstream systems expect consistent formats.
  Why It’s Awesome for You:
   Reliability: Forces LLMs to output structured JSON (e.g., {"title": "string", "score": number}) instead of freeform text.
   Error Prevention: Catches malformed outputs early (e.g., missing fields, wrong types).
   Use Cases: Perfect for API responses, database inserts, or eval datasets for your ML coursework.
  How It Works:
   You define a JSON Schema (standard format, see json-schema.org).
   Portkey runs it as a guardrail check on INPUT (prompt) or OUTPUT (response).
   If the JSON doesn’t match, you can deny (HTTP 446), warn (246), log, or trigger fallbacks.
  Example Use Case: You’re building a study app that generates quiz questions. You want every response to be a JSON like {"question": "string", "answer": "string"}. A JSON Schema Check ensures no rogue text slips through
  
 Step 2: Setting Up a JSON Schema Check in Portkey
  You can configure this in the Portkey Dashboard or inline in code. Let’s start with the dashboard for clarity, then show inline configs.
   Log into Portkey Dashboard: .
    Go to Guardrails tab > Create Guardrail.
    Select Check Type: json_schema.
    Pick Side: OUTPUT (most common for response validation; INPUT for prompts).
   Define the Schema in JSON. Example for a quiz app: 
      {
      "type": "object",
      "properties": {
        "question": { "type": "string", "minLength": 5 },
        "answer": { "type": "string", "minLength": 1 }
      },
      "required": ["question", "answer"],
      "additionalProperties": false
    } 
   This enforces: JSON object with question and answer as strings, no extra fields.
   Set Action: Deny (block on fail), Log Only (monitor), or Feedback (build eval datasets).
   Save—get a $GUARDRAIL_ID (e.g., gr-json-quiz).
   Create a Config in the Configs tab
    {
    "output_guardrails": ["gr-json-quiz"],
    "retry": { "attempts": 2 }
    }
    Save for a $CONFIG_ID (e.g., pc-quiz-check).
  Async vs. Sync:
   Async (default): Checks run in parallel, logged to dashboard (no latency hit).
   Sync: Blocks request until validated (adds ~10ms). Use for strict enforcement.
    
   