Crew AI is not compatiable with 3.13, compatiable with 3.12:
CrewAI is an an open-source Python framework designed to orchestrate multi-agent systems ,It serves as a middleware platform that integrates Large Language Models (LLMs) into structured, role-based teams (or "crews") to automate tasks requiring specialized expertise, iterative reasoning, and coordinated execution.

Core Components:
 Agents :
  Autonomous entities with defined roles (e.g., Researcher, Analyst, Strategist).
  Each agent is equipped with domain-specific skills, memory, and access to tools (e.g., APIs, databases, web search).
  Operates using goal-driven logic, self-reflection, and dynamic decision-making.

Tasks :
 Modular, actionable units assigned to agents (e.g., "Generate a market analysis report" or "Optimize supply chain logistics").
 Tasks are prioritized, delegated, and executed collaboratively, with dependencies managed automatically.
Process :
 Structured workflows (e.g., sequential, hierarchical, or concurrent) to ensure logical task progression.
 Includes feedback loops for iterative refinement and quality assurance.
Tools :
 Integrations with external systems (e.g., Python libraries, REST APIs, document parsers) to extend agent capabilities.
