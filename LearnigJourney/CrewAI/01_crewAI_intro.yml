How crewai run Works:   
 Step 1: You Run the Command (The Starting Line)
  What happens? You type crewai run in your terminal from the project folder (e.g., cd crewai_learning && crewai run).
  Friendly explanation: This is like pressing "play" on a video. The CrewAI CLI (command-line tool) wakes up and checks for any extra instructions you gave, like --verbose 2 (for detailed logs) or --task "My custom research question".
  Example: If you run crewai run --task "Research top AI trends in 2026", it notes the override and gets ready to use it.
  Why this step? It makes sure everything is personalized before diving in.

 Step 2: Load the Project Config (Reading the Blueprint)  
 What happens? CrewAI loads your pyproject.toml file (the project's "blueprint" in the root folder).
 Friendly explanation: This file tells CrewAI what dependencies (like libraries) are needed and basic project info. It's like checking a recipe for ingredients before cooking.
 Example: In pyproject.toml, it might see [tool.poetry.dependencies] crewai = "^0.102.0"—so it knows to use the latest CrewAI version. If something's missing, it might auto-sync with uv (like running uv sync quietly).
 Why this step? Ensures the environment is set up right—no surprises like missing tools.
 
 Step 3: Find and Load the Main Entry Point (Picking the Right Door)
 What happens? CrewAI looks for src/crewai_learning/main.py (or your custom entry file) and figures out which method to call—usually crew.kickoff().
 Friendly explanation:main.py is the "front door" script that runs your crew. CrewAI scans it to see the key method (like kickoff()) that starts the agents. It's like finding the "start engine" button in a car.
 Example: In a default main.py, it spots code like crew = CrewAICompanyCrew(); result = crew.kickoff(inputs=inputs). So, it knows to call kickoff() with any inputs you provided.
 Why this step? Tells the system exactly where to begin executing your custom logic.
 
 Step 4: Load Environment Variables (Grabbing the Secret Keys)
 What happens? CrewAI loads your .env file using a library like python-dotenv.
 Friendly explanation: This pulls in secret stuff like API keys for LLMs (language models like GPT-4o) or tools (e.g., search APIs). It's like unlocking a safe before using the valuables inside.
 Example: From .env, it grabs OPENAI_API_KEY=sk-... to connect to OpenAI's LLM, or SERPER_API_KEY=... for web searches. Without this, agents couldn't "think" or "act."
 Why this step? Security first—keeps keys out of code. If missing, it might error with "No API key found."
 
 Step 5: Load Agents and Tasks from Configs (Assembling the Team)
 What happens? CrewAI reads config/agents.yaml and config/tasks.yaml (or code in crew.py).
 Friendly explanation: YAML files are like team rosters and job lists. Agents get their "personalities" (role, goal, backstory), and tasks get instructions (what to do, expected output).
 Example: From agents.yaml: role: Researcher, goal: Find facts—creates a smart "researcher" agent. From tasks.yaml: description: Search for AI trends—sets the job. Then, crew.py combines them into a Crew object.
 Why this step? Builds the AI team dynamically. Overrides (from command flags) apply here, like changing a task description.
 
 Step 6: Set Up the LLM and Tools (Powering Up the Brains and Hands)
 What happens? Connects to the LLM (e.g., OpenAI) and loads tools (e.g., search or scrape).
 Friendly explanation: The LLM is the "brain" that lets agents think and decide. Tools are their "hands" for actions like googling. CrewAI wires them up based on your configs.
 Example: Using the key from Step 4, it sets llm=ChatOpenAI(model="gpt-4o"). For tools, it might load SerperDevTool() if SERPER_API_KEY is set.
 Why this step? Without brains and hands, agents are just ideas— this makes them functional.
 
 Step 7: Execute the Crew (The Action Happens!)
 What happens? Calls crew.kickoff() to start the agentic loop.
 Friendly explanation: Agents take turns: Think (reason with LLM), Act (use tools if needed), Observe (get results), and Repeat until done. Tasks chain together (output of one feeds the next).
 Example: Researcher agent: "Thought: I need data on AI trends. Action: Search 'AI trends 2026'." Gets results, then Writer agent polishes it into a report.
 Why this step? This is the fun part—where AI collaboration happens. Logs show everything (set verbose=2 for details).
 
 Step 8: Collect and Display Results (The Finish Line)
 What happens? Gathers the final output and prints it (plus saves if configured).
 Friendly explanation: Like getting your cooked meal— the last task's result (e.g., a report) shows in the terminal.
 Example: "Final Result: Here's your 300-word summary on AI trends..." with any files saved (e.g., to output.md).
 Why this step? Gives you the payoff. If errors, it logs them clearly.
 
 Step 9: Cleanup and Exit (Tidy Up)
 What happens? Closes connections (e.g., API sessions) and exits.
 Friendly explanation: Shuts things down neatly, like turning off the lights after a party.
 Example: Frees up memory and logs "Crew completed in 45 seconds."
 Why this step? Keeps your system clean for the next run.
 
How CrewAI Parses Your YAML Configs:
 When you run crewai run, CrewAI doesn’t hard-code your agents and tasks in Python.
 Instead, it reads two YAML files and magically turns them into real, working AI agents and tasks.
 The Two YAML Files (Your Team Blueprint)
 Inside your project → config/ folder: 
    config/
    ├── agents.yaml     ← Who is on the team?
    └── tasks.yaml      ← What should they do?

   config/agents.yaml:
    researcher:
      role: "Senior Technology Researcher"
      goal: "Discover cutting-edge developments in AI"
      backstory: "A brilliant researcher with 15 years of experience..."
      allow_delegation: false
      verbose: true

    writer:
      role: "Professional Tech Writer"
      goal: "Write engaging and accurate content"
      backstory: "Former editor at TechCrunch..."
      verbose: true
      
   config/tasks.yaml:   
    research_task:
      description: "Research the top 5 AI agent frameworks in 2025"
      expected_output: "A bullet list with name, strength, and one example"
      agent: researcher

    writing_task:
     description: "Write a 300-word LinkedIn post about the findings"
     expected_output: "Ready-to-post LinkedIn text with emojis"
     agent: writer
     context:
     - research_task   # ← This links the two tasks!
     
 When you run crewai run →
  CrewAI automatically:
  Creates a real researcher agent
  Creates a real writer agent
  Gives the first task to the researcher
  Gives the second task to the writer AND automatically passes the research result as context
 You don’t write any of this in Python — just edit the YAML and re-run!   
 
Example:
 Code Reviewer + Fixer Crew:
 # agents.yaml
    senior_dev:
      role: "10x Senior Engineer"
      goal: "Spot bugs and bad patterns instantly"
      backstory: "Ex-Staff engineer at Google"

    security_expert:
      role: "Security & Performance Auditor"
      goal: "Find vulnerabilities and slow code"
      backstory: "Red team specialist"

    refactor_master:
      role: "Clean Code Architect"
      goal: "Make code beautiful and maintainable"
      backstory: "Wrote 'Clean Code' fan club president"
      
 # tasks.yaml
    review_code:
      description: "Review this Python file for bugs, style, and best practices"
      expected_output: "Line-by-line feedback with severity levels"
      agent: senior_dev

    security_scan:
      description: "Check for SQL injection, XSS, secrets in code, etc."
      expected_output: "Security report with risk levels"
      agent: security_expert
      async_execution: true  # Runs at the same time 

    final_fixes:
      description: "Rewrite the code with all fixes and improvements"
      expected_output: "Fully refactored, clean, commented code"
      agent: refactor_master
      context: [review_code, security_scan]
      output_file: "fixed_code.py"     
  
