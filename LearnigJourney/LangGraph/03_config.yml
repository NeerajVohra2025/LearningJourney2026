“If main.py is for local execution, why do we need remote calls at all?”:
            | Term             | Meaning                                |
            | ---------------- | -------------------------------------- |
            | Local execution  | Running an agent graph in this process |
            | Local entrypoint | Running code from CLI / terminal       |
        main.py is an orchestration client, not an agent implementation.:
        main.py exists to support three enterprise scenarios:
    Scenario A — Single Agent (Today):
        main.py → executor → graph
        No registry, no remote calls.:
    Scenario B — Multi-Agent (Tomorrow):    
        main.py → registry → remote agent
    Scenario C — Hybrid (Enterprise Reality):
        main.py
         ├─ local agent (fast)
         └─ remote agent (specialized)
        Same main.py. Different routing. 
        
Why NOT Put Remote Calls Somewhere Else?:
    You might think:
        “Remote calls should be in app.py or executor”:   
        ❌ That would be wrong.
        Why?      
        | File          | Responsibility                           |
        | ------------- | ---------------------------------------- |
        | `executor.py` | Run a graph                              |
        | `agent.py`    | Wrap LangGraph                           |
        | `app.py`      | Expose HTTP                              |
        | **`main.py`** | **Decide WHO should handle the request** |
        
    Clean Mental Model (Lock This):
        main.py
          = CLI / Orchestrator / Client

        executor
          = Local agent runtime

        app.py
          = HTTP server

        server.py
          = Process bootstrap
      So:
        Local vs Remote is a runtime decision, not a file decision.    
