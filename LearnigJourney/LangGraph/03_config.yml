❓ Is app.py different from main.py?
    ✅ YES — they serve completely different purposes
            | File        | Purpose                            | Audience                    |
            | ----------- | ---------------------------------- | --------------------------- |
            | `main.py`   | CLI / local interactive runner     | Developers                  |
            | `app.py`    | FastAPI **application definition** | Services, UIs, other agents |
            | `server.py` | HTTP server **runtime entrypoint** | Docker / K8s / Ops          |
               
        Mental Model:
            main.py → “Run the agent from my terminal”
            app.py → “Expose the agent as a secure service”
            server.py → “How the service is started in prod”
         👉 In enterprise systems:
            CLI ≠ API ≠ Server runtime
            
How Everything Fits Together (Final Mental Model):
            main.py      → CLI testing
            app.py       → Secure A2A API (JWT, HITL)
            server.py    → HTTP runtime
            executor.py  → orchestration
            agent.py     → LangGraph wrapper
            graph.py     → workflow
            nodes.py     → reasoning

Common Postman Errors (and Fixes):
    Headers Tab:
        | Key           | Value                                  |
        | ------------- | -------------------------------------- |
        | Authorization | `Bearer super-secret-enterprise-token` |
        | Content-Type  | `application/json`                     |
   
        | Error               | Cause                        |
        | ------------------- | ---------------------------- |
        | 401 Unauthorized    | Missing Authorization header |
        | 401 Invalid token   | Token mismatch in `.env`     |
        | Header(... missing) | Header key misspelled        |
        | 422 error           | Body not valid JSON          |

