            The AgentCard class would need fields matching these keys.
            
        Step 5: Extract Behavior Configuration
                agent_behavior = cfg.get("behavior", {})
            This retrieves the entire behavior section:
                agent_behavior = {
                    "system_prompt": "You are an Advanced Research Assistant...",
                    "llm": {
