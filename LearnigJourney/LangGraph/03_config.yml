    Correct Architecture Pattern:
        This is a classic Service Registry / Discovery pattern (Netflix Eureka, Consul, Kubernetes, etc.)
                | When             | How                 |
                | ---------------- | ------------------- |
                | Agent starts     | Auto-register       |
                | Agent restarts   | Re-register         |
                | Agent heartbeat  | Update `last_seen`  |
                | Agent shuts down | Optional deregister |

                | Environment          | Registry URL                 |
                | -------------------- | ---------------------------- |
