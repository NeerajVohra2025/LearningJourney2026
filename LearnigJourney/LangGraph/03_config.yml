        Step 4: Create AgentCard Object
                agent_card = AgentCard(**cfg["metadata"])  
            This extracts cfg["metadata"] and unpacks it:
                    # Equivalent to:
                    agent_card = AgentCard(
                        agent_id="advanced-langgraph-agent",
