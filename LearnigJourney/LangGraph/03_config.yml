explain step by step """"
    agents_toml = Path("agents.toml")
        with open(agents_toml, "rb") as f:
            cfg = tomllib.load(f)

        agent_card = AgentCard(**cfg["metadata"])
        agent_behavior = cfg.get("behavior", {})

        return agent_card, agent_behavior"""
    
    Step 1: Create a Path object
               agents_toml = Path("agents.toml")
            Creates a Path object pointing to a file named "agents.toml"
            Path is from Python's pathlib module
            This represents the file path in an object-oriented way
            
            Why it matters (Enterprise Lens):
                Uses pathlib (Python's modern path handling) for cross-platform safety (Windows/Linux/macOS).
                Avoids hardcoded paths → works in containers, cloud environments, and developer laptops.
                Architect Tip: In production, this path would be overridden via environment variable (e.g., AGENT_CONFIG_PATH=/etc/app/agents.toml).    
     
    Step 2: Open the file in binary read mode
            with open(agents_toml, "rb") as f:
                Opens the file using a context manager (with statement)
                "rb" means "read binary" mode
                The file handle is assigned to variable f
            The file will automatically close when the with block ends
    
    Step 3: Parse the TOML file
                cfg = tomllib.load(f)
                    Uses tomllib (Python's built-in TOML parser, available in Python 3.11+)
                    Reads the binary file content and parses it as TOML format
                    Returns a dictionary containing the parsed configuration
                    Stores this dictionary in variable cfg        
                    
    Step 4: Extract and create AgentCard object
            agent_card = AgentCard(**cfg["metadata"])
                Accesses the "metadata" key from the cfg dictionary
                **cfg["metadata"] unpacks the metadata dictionary as keyword arguments
                Passes these unpacked arguments to the AgentCard constructor
            Creates an AgentCard instance with the metadata values
            
            
    Step 5: Extract behavior configuration (with fallback)
                agent_behavior = cfg.get("behavior", {})
                    Uses .get() method to safely retrieve the "behavior" key
                    If "behavior" key doesn't exist, returns an empty dictionary {} as default
                    Stores the result in agent_behavior
                
    Step 6: Return both values
            return agent_card, agent_behavior
            Returns a tuple containing both the agent_card object and agent_behavior dictionary
            The caller can unpack these: card, behavior = function_name()
            
        Summary: This code reads a TOML configuration file, extracts metadata to create an AgentCard object, retrieves optional behavior settings, and returns both pieces of information.
        
        
        The TOML File Structure:
                # ==========================================
                # INTERNAL BEHAVIOR (The "Soul" of the Agent)
                # Role: Defines how the agent thinks and acts.
                # ==========================================
                [behavior]
                system_prompt = """You are an Advanced Research Assistant.
                    
                ## Guidelines for Tool Usage
                1. **Primary Tool**: If asked to send an email, strictly use 'send_email'. 
                2. **Missing Info**: If you do not have the recipient's email address, DO NOT search Wikipedia or Arxiv. Simply ASK the user for the email address.
                3. **General Greeting**: If user says "Hi" or "Hello", answer directly without tools.
                4. **No JSON Hallucination**: Do not write JSON code in your response. Only call tools through the official tool-calling interface.

                ## Tools Available:
                - Academic papers: 'arxiv_tool'
                - General facts: 'wikipedia'
                - Web search: 'tavily_search_results_json'
                - Math: 'calculate_math'
                - Email: 'send_email'
                """

                [behavior.llm]
                temperature = 0.1
                max_tokens = 1000

                [behavior.safety]
                sensitive_tools = ["send_email"]
                require_human_approval = true

                # ==========================================
                # PUBLIC METADATA (The "Passport" of the Agent)
                # Role: Discovery and A2A interoperability.
                # ==========================================
                [metadata]
                agent_id = "advanced-langgraph-agent"
                name = "Advanced LangGraph Agent"
                description = "A versatile agent powered by LangGraph with human-in-the-loop capabilities and sensitive tool gatekeeping."
                version = "1.0.0"
                framework = "langgraph"
                endpoint = "http://localhost:8000/a2a"
                skills = ["web_search", "academic_research", "math", "email_dispatch"]

                [metadata.capabilities]
                streaming = true
                human_in_the_loop = true
                interruptible = true

                [[metadata.skill_details]]
                id = "web_search"
                name = "Tavily & Wikipedia Search"
                description = "Search the web and Wikipedia for real-time and general information"

                [[metadata.skill_details]]
                id = "academic_research"
                name = "Arxiv Search"
                description = "Search for academic papers and research documents"

                [[metadata.skill_details]]
                id = "math"
                name = "Calculations"
                description = "Perform mathematical and logical calculations"

                [[metadata.skill_details]]
                id = "email_dispatch"
                name = "Sensitive Email Dispatch"
                description = "Send emails (requires human approval)"
            Your file has two main sections:
            [behavior] - The agent's internal configuration ("soul")
            [metadata] - The agent's public information ("passport")
            
        Step 1-3: Read and Parse the File:
                agents_toml = Path("agents.toml")
                with open(agents_toml, "rb") as f:
                    cfg = tomllib.load(f)        
        
