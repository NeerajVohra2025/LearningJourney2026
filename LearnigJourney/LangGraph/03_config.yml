## Key Architectural Principles

### 1. **Layered Architecture**
- **Config Layer**: All configuration in one place
- **Core Layer**: Business logic & domain models
- **Infrastructure Layer**: Technical implementations
- **Application Layer**: Orchestration & workflows
- **Interface Layer**: External communication (API/CLI)

### 2. **Separation of Concerns**
Each module has a single, well-defined responsibility

### 3. **Dependency Direction**
```
Interfaces → Application → Core ← Infrastructure
                ↓
             Config
```

### 4. **Configuration First**
All settings, tools, and behaviors defined before implementation

### 5. **Testability**
Each layer can be tested independently with mocks    
    
    
    
    
    
