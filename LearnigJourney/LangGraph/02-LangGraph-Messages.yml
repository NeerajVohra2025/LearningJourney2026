📩 Step 1: What Are Messages?
    Think of messages as the chat history between you and your AI helper—like text messages in a group chat!
    Every time someone (you or the AI) says something, it gets added to a list called the message history. This list lives in the shared backpack (the “state”) so everyone can see what’s been said.
    Messages are the conversation memory of the agent.
    They represent who said what:
        User
        AI (LLM)
        Tool
        Human reviewer
    Think of messages as a chat transcript stored inside the graph state.
    

🔹 Step 2: Types of Messages    
    | Message Type    | Who sends it | Example                        |
    | --------------- | ------------ | ------------------------------ |
    | `HumanMessage`  | User / Human | “What is my order status?”     |
    | `AIMessage`     | LLM          | “Let me check your order.”     |
    | `ToolMessage`   | Tool         | “Order shipped on Sept 10”     |
    | `SystemMessage` | System       | “You are a helpful assistant.” |
    👉 These messages are not strings — they are structured objects.    
    
    
   

🔹 Step 3: System Message vs Prompt (Common Confusion ❗)
    | Item        | System Message        | Prompt (User) |
    | ----------- | --------------------- | ------------- |
    | Who sets it | Developer / Architect | End user      |
    | Purpose     | Control behavior      | Ask questions |
    | Priority    | Highest               | Lower         |
    | Visibility  | Hidden from user      | Visible       |
    👉 System Message = control plane
    👉 User Prompt = data plane 


🔍 What Each Message Is Used For:
    🧑‍✈️ SystemMessage (Behavior Controller)
    Use for:
    Role (“You are a banking assistant”)
    Rules (“Always ask for approval before sending email”)
    Safety (“Do not give medical advice”)
    Format (“Respond only in JSON”)

    ❌ Don’t put user data here
    ❌ Don’t change frequently


    👤 HumanMessage (Input + Approval)
    Use for:
    User questions
    Human-in-the-loop approvals
    Corrections and feedback
    Example:    
    "Approved. You may send the email."


    🤖 AIMessage (Thinking + Decisions)
    Use for:
    Draft answers
    Plans
    Tool requests
    Intermediate reasoning
    Example:
    "I need to call the order status API."


    🔧 ToolMessage (Facts from Tools)
    Use for:
    API responses
    DB results
    RAG retrieval output
    Example:
    "Order shipped on Sept 10."


🔄 Standard Message Flow (90% of Use Cases)
    SystemMessage
    ↓
    HumanMessage
    ↓
    AIMessage (requests tool?)
    ↓
    ToolMessage
    ↓
    AIMessage (final answer)



🛑 Human-in-the-Loop with Messages
    interrupt_after (Review Output):
    AIMessage (Draft)
    ↓
    PAUSE
    ↓
    HumanMessage (Approve / Edit)
    ↓
    AIMessage (Continue)


    interrupt_before (Approve Action):
    PAUSE
    ↓
    HumanMessage (Approve)
    ↓
    Tool / Action
    👉 Human input is always added as a HumanMessage


🧠 How Messages Enable Agent Memory
    Messages are stored in state
    Passed to every node
    Saved in checkpoints
    Restored on resume
    👉 Messages = reasoning continuity


🏗️ Architect Golden Rules (Never Forget):
    1️⃣ Put rules in system messages
    2️⃣ Put questions in user messages
    3️⃣ Put reasoning/results in AI messages
    4️⃣ Put actions/results in tool messages

🧩 Message Types (What goes into state.messages):
    | Message Type      | Who creates it        | Purpose                                  | Priority        |
    | ----------------- | --------------------- | ---------------------------------------- | --------------- |
    | **SystemMessage** | Developer / Architect | Sets role, rules, safety, format         | ⭐⭐⭐⭐⭐ (Highest) |
    | **HumanMessage**  | User / Human reviewer | Questions, approvals, corrections        | ⭐⭐⭐⭐            |
    | **AIMessage**     | LLM                   | Reasoning, plans, answers, tool requests | ⭐⭐⭐             |
    | **ToolMessage**   | Tool / API            | Results from tool execution              | ⭐⭐              |

⚠️ Common Mistakes (Exam Traps)
    ❌ Putting rules in HumanMessage
    ❌ Mixing tool output into AIMessage
    ❌ Changing system message dynamically
    ❌ Treating messages as plain strings

🏗️ Architect Golden Rules (Burn into Memory)
    1️⃣ Rules → SystemMessage
    2️⃣ Questions / Approval → HumanMessage
    3️⃣ Reasoning / Planning → AIMessage
    4️⃣ Facts from tools → ToolMessage
    5️⃣ If a human must see it → make it a message

🧠 One-Line Memory Hook (Exam Gold 🏆)
    Messages are the agent’s conversation memory — System sets the law, Human gives input, AI reasons, Tools provide facts.

👩‍💻 Step 2: What Is Human-in-the-Loop?
    Sometimes, the AI wants to pause and ask you before doing something important—like sending an email, spending money, or giving medical advice.
    That’s Human-in-the-Loop:
    The AI stops, shows you what it plans to do, and waits for your OK before continuing.
    It’s like your robot saying:
    “I think I should book this flight. Want me to do it?” 
    
    
    