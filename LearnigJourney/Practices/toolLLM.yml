✅ STEP 3 — VERIFY REGISTRATION:
Now check registry.

Option A — If you have /services endpoint:
GET http://localhost:8500/services

Expected response should include:

[
  {
    "service": {
      "name": "tool-llm",
      "version": "1.0.0",
      "type": "tool"
    },
    "capabilities": {
      "list": ["llm.generate"]
    },
    "network": {
      "endpoint": "http://localhost:9101/a2a"
    }
  }
]

This confirms:

✔ Self-registration
✔ Capability metadata stored
✔ Endpoint registered


