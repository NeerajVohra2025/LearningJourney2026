Single startup file required for containerized deployments.




🔹 2️⃣ app_factory.py:
🎯 Purpose: Application Configuration Layer
def create_app():
    app = FastAPI(...)
    app.include_router(router)
What it does:
Creates FastAPI instance
Registers API routes
Configures metadata
Why it exists:
Separation of concerns.
If tomorrow:
You add middleware
Add logging
Add monitoring
Add CORS
Add versioning
You update this file — not main.py.
Enterprise principle:
Configuration must be isolated from execution.


Creates FastAPI instance.
