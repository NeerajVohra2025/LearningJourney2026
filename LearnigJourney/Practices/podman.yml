💡 Important Enterprise Tip:
When using Podman on Windows, always remember:
Podman Desktop
   └── manages Podman CLI
   └── manages Podman Machine (WSL VM)
   └── manages Compose
   
Never install Podman CLI separately, otherwise upgrade conflicts occur (like the one you faced).:


