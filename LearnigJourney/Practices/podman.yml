Write-Host "=== Podman Cache Cleanup ==="

# Kill Explorer to release cache files
Stop-Process -Name explorer -Force
Write-Host "Explorer stopped..."

# Paths to clear
$cachePaths = @(
    "$env:LOCALAPPDATA\Microsoft\Windows\Explorer\iconcache*",
    "$env:LOCALAPPDATA\Microsoft\Windows\Explorer\thumbcache*",
    "$env:LOCALAPPDATA\TileDataLayer"
)

foreach ($path in $cachePaths) {
    if (Test-Path $path) {
        Write-Host ">>> Deleting cache: $path"
        Remove-Item $path -Recurse -Force -ErrorAction SilentlyContinue
    }
}

# Restart Explorer
Start-Process explorer.exe
Write-Host "Explorer restarted."

