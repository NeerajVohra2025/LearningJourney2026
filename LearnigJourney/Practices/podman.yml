STEP 1 — Verify WSL2:
wsl --status
If WSL not installed:
wsl --install

STEP 2 — Install Podman desktop:
https://podman-desktop.io/downloads

Step 1 — Verify Podman Installation:
Check podman:
podman --version
Check podman machine:
podman machine list
Start machine if not running:
podman machine start
Test container runtime:
podman run hello-world

Step 2 — Verify Compose Support:
podman-compose --version

Step 3 — Create Test Project:
mkdir podman-compose-demo
cd podman-compose-demo

Step 4 — Create container-compose.yml:
version: "3.9"

services:

  nginx:
    image: docker.io/library/nginx:latest
    container_name: podman-nginx

    ports:
      - "8080:80"

    restart: always
    

Step 5 — Start Containers:
podman compose -f container-compose.yml up

Step 6 — Verify Container:
podman ps

Step 7 — Test Application:
http://localhost:8080

Step 8 — Check Logs:
podman logs podman-nginx
or
podman compose -f container-compose.yml logs

Step 9 — Stop Containers:
podman compose -f container-compose.yml down


Step 11 — Validate Network:
Check network created by compose
podman network ls

Inspect:
podman network inspect podman-compose-demo_default

Step 12 — Clean Environment:
Remove everything.
podman compose -f container-compose.yml down --volumes

Remove images:
podman rmi nginx


