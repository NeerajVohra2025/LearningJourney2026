What Gets Installed When You Install Podman Desktop:
| Component         | Installed |
| ----------------- | --------- |
| Podman CLI        | ✅         |
| Podman Machine    | ✅         |
| WSL integration   | ✅         |
| Container runtime | ✅         |


Initialize Podman Machine (Required Step):
podman machine init
Then start it:
podman machine start
Verify:
podman info
Test Podman Build:
Test with a simple container:
podman run hello-world
Expected output:
Hello from Podman!
Install Podman Compose (Not Included):
Unlike Docker, compose is not bundled.
Install manually:
pip install podman-compose
Verify:
podman-compose --version

Verify Everything Before Pipeline
Run these commands:

podman info
podman build .
podman run -p 8000:8000 image-name
podman-compose up
podman build
podman run
podman push
podman-compose

Enterprise CI/CD Pipeline Behavior:
In your GitLab CI, Podman CLI runs inside the runner image:
image: quay.io/podman/stable   # quay.io free contianer registry
So the runner already contains Podman CLI.

| Question                       | Answer |
| ------------------------------ | ------ |
| Do we need Podman CLI?         | ✅ Yes  |
| Installed with Podman Desktop? | ✅ Yes  |
| Need to install separately?    | ❌ No   |
| Need Podman Machine?           | ✅ Yes  |
| Need podman-compose?           | ✅ Yes  |






Enterprise Container Toolchain:
| Tool          | Purpose                |
| ------------- | ---------------------- |
| **Podman**    | Container runtime      |
| **Buildah**   | Secure image building  |
| **Skopeo**    | Registry copy          |
| **Trivy**     | Vulnerability scanning |
| **Cosign**    | Image signing          |
| **GitLab CI** | Pipeline automation    |


This is called:
Secure Container Supply Chain

