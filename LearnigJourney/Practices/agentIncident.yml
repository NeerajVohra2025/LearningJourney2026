🏛 AGENT LAYER ROLE IN ARCHITECTURE:
In Level-5 architecture:
Agent is NOT:
A tool ❌
A simple API wrapper ❌
Hardcoded integration ❌

Agent IS:
A domain intelligence unit
Orchestrates tool usage
Makes decisions
Discovers tools dynamically
Communicates via A2A only

Self-registers
🔷 WHAT agent-incident WILL DO

Flow:
Receives A2A request from orchestrator
Discover tool via registry

Calls:
tool-servicenow
tool-llm (optional)
Aggregates result
Returns structured A2A response

