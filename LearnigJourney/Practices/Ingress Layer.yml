External System (ServiceNow / UI / Batch / API)
                ↓
         Ingress Gateway
                ↓
     Control-Orchestrator (A2A)
                ↓
             Agents
                ↓
              Tools
             
Ingress does NOT:
Contain workflow logic ❌
Call agents directly ❌
Know tool structure ❌
It only forwards to orchestrator.     

Ingress responsibilities:
Authenticate
Validate schema
Select adapter dynamically
Normalize payload
Generate correlation ID
Forward to orchestrator (A2A)
Return mapped response



