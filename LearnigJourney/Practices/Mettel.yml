    2. High-Level Architecture Design:
            [Grafana Alert]
                 ↓ (webhook)
            [ServiceNow P3 Incident Created]
                 ↓ (Event via ServiceNow IntegrationHub / MID Server / Webhook)
            [GenAI Orchestration Layer] ← triggers AI agent
                 ├── Fetch Context: Alert metadata + SNOW fields
                 ├── Enrich: Pull logs/metrics from GCP Observability (via API)
                 ├── Augment: Retrieve similar past incidents + KEDs (vector DB)
                 ├── Analyze: LLM + rules engine → Preliminary RCA
                 ├── Decide: Is this a known pattern with approved automation?
                 │    ├── YES → Execute via Secure Automation Orchestrator
                 │    └── NO  → Assign to resolver group + post insights
                 ↓
            [Update ServiceNow Ticket: RCA + Action Taken/Recommended]    
            
     3. Core Components (Enterprise-Grade):
        A. Event Ingestion & Triggering
        Use ServiceNow IntegrationHub or custom webhook endpoint (secured via mTLS/API key) to listen for new P3 incidents.
        Validate payload schema; reject malformed events.
        Log all triggers in audit trail (e.g., Cloud Logging or Splunk).
        B. Context Enrichment Layer
        GCP Observability Client: Use GCP Monitoring & Logging APIs with scoped service accounts (least privilege).
        Historical Incident Retrieval:
        Build a vector index (e.g., Vertex AI Matching Engine, Pinecone, or GCP Firestore + embeddings) over past resolved tickets.
        Embed description, work_notes, error_signature using a domain-tuned embedding model.
        KED Integration: If KEDs are structured, include them in retrieval-augmented generation (RAG) context.
        C. AI Reasoning Engine
        Hybrid Approach:
        Rule-based pre-filter: Match known error patterns (regex, error codes) → fast path to automation.
        LLM-based analysis (for novel cases):
        Use retrieval-augmented generation (RAG) with enriched context.
        Prompt engineering: Structured output (JSON) with fields: probable_cause, impacted_components, supporting_evidence.
        Model choice: Vertex AI PaLM 2 / Gemini Pro (enterprise-managed, VPC-SC compliant) or Azure OpenAI if Azure-native.
        Guardrails:
        Output validation (schema enforcement)
        Hallucination mitigation: constrain to retrieved evidence
        PII/credential redaction in logs before LLM ingestion
        D. Automation Execution Layer
        Orchestrator: Use HashiCorp Nomad, Airflow, or ServiceNow Flow Designer (if within SNOW ecosystem).
        Automation Registry: Central catalog of:
        Issue signature → Runbook ID
        Required approvals, rollback procedure, owner
        Execution Policy:
        Only execute if:
        Pattern confidence > threshold (e.g., 95%)
        Automation exists and is approved
        Environment is non-production OR change window is open (for prod)
        Audit: Log all actions in ServiceNow + SIEM
        E. Human-in-the-Loop & Feedback
        Always allow L2 engineer to:
        Override AI recommendation
        Provide feedback (“Was this RCA helpful?”)
        Capture feedback to retrain/fine-tune models or improve RAG corpus
        Never auto-close tickets — require human confirmation
        
        4. Non-Functional Requirements (NFRs):
        Category                                        Requirement
        Security:                                       - All data in transit encrypted (TLS 1.3+)
                                                        - Service accounts with least privilege
                                                        - No PII in prompts/logs       
        Compliance:                                     - Audit trail for all AI decisions
                                                        - SOC 2 / ISO 27001 alignment 
                                                        
        Observability:                                  - Track: trigger rate, RCA accuracy, automation success rate
                                                        - Dashboards in Grafana
        
        Reliability:                                    - Retry with backoff on GCP/SNOW API failures
                                                        - Circuit breaker for LLM calls
                                                        
        Scalability:                                    - Stateless agent design
                                                        - Queue-based ingestion (Pub/Sub or Kafka)
        

