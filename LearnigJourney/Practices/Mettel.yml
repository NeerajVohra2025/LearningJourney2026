                    Incident payload must be structured (JSON, not free text)
     
            Step 2: AI Agent Activation
                Triggered by:
                    ServiceNow webhook
                    Event Bridge / PubSub
                    ITSM integration layer
                AI receives:
                    Incident metadata
                    Service context
                    Severity
                    Initial alert signals
                ➡️ Key design decision:
                    AI is event-driven, not polling.

         Step 3: Observability Data Collection
