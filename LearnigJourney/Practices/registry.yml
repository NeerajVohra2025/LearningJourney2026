}

Still valid AgentCard.

🟢 STEP 3 — Register Ingress
{
  "name": "ingress-gateway",
  "version": "1.0.0",
  "description": "External event ingress",
  "capabilities": ["event.ingest"],
  "tools": [],
  "endpoint": "http://localhost:8000/api/v1/events",
