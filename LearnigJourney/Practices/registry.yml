    "role": "ingress"
  }
}


🟢 STEP 4 — Enhance Discovery WITHOUT Changing Model

Your current:
def discover(self, capability: str)

Already works for:
agent capabilities
skill alignment
Now we enhance orchestrator logic — NOT registry.

Example:
tools = registry.discover("llm.generate")

If you want only tools:
Filter:
[t for t in tools if "tool" in (t.tags or [])]

