What is Google Cloud Logging?
Google Cloud Logging (formerly Stackdriver Logging) is Google's fully managed service for ingesting, storing, searching, analyzing, and alerting on log data from your cloud infrastructure, applications, and services. It's the nerve center for observability in GenAI systems — whether you're monitoring LLM API calls, vector database queries, or inference latencies.

Step 1 — Enable Google Cloud Logging:
Before you can analyze anything, make sure logging is enabled for your project.
In the Google Cloud Console:

Go to APIs & Services → Library
Search for Cloud Logging API and click Enable
Assign the right IAM role to your account: roles/logging.viewer for read-only access, or roles/logging.admin for full control

From the CLI:
gcloud services enable logging.googleapis.com
gcloud projects add-iam-policy-binding YOUR_PROJECT_ID \
  --member="user:you@example.com" \
  --role="roles/logging.viewer"
  
Step 2 — Ingest Logs Into Cloud Logging:  
Option A — Automatic (GKE, Cloud Run, App Engine):
These services automatically send stdout/stderr to Cloud Logging. No code changes required.
Option B — Python SDK (for custom GenAI apps):
from google.cloud import logging as gcloud_logging

client = gcloud_logging.Client()
logger = client.logger("genai-inference-logs")

logger.log_struct({
    "model": "gemini-1.5-pro",
    "prompt_tokens": 512,
    "completion_tokens": 128,
    "latency_ms": 340,
    "user_id": "u-9821"
}, severity="INFO")


Option C — Structured JSON via stdout (recommended for containers):
import json, sys

log = {
    "severity": "WARNING",
    "message": "LLM latency spike detected",
    "latency_ms": 2100,
    "model": "text-bison",
    "labels": {"env": "production", "region": "us-central1"}
}
print(json.dumps(log))  # Cloud Logging auto-parses this



Step 3 — Explore Logs in the Log Explorer:
This is your day-to-day interface for querying and debugging.
Open the Cloud Console → Navigation menu → Logging → Log Explorer
Use the query bar at the top to filter logs using the Logging Query Language (LQL)
Essential LQL queries for GenAI workloads:
# All ERROR logs in the last hour
severity=ERROR AND timestamp>="2025-04-13T00:00:00Z"

# Logs from a specific service
resource.type="cloud_run_revision"
resource.labels.service_name="genai-inference-api"

# Latency above threshold (for GenAI performance monitoring)
jsonPayload.latency_ms > 1000

# Logs containing a specific model name
jsonPayload.model="gemini-1.5-pro"

Step 4 — Create Log-Based Metrics:
Log-based metrics let you turn log patterns into measurable numbers — perfect for tracking LLM call rates, error frequencies, and latency distributions.
In the Console: Go to Logging → Log-based Metrics → Create Metric
Via CLI:
gcloud logging metrics create genai_error_rate \
  --description="Count of GenAI inference errors" \
  --log-filter='severity=ERROR AND resource.type="cloud_run_revision"'
  
Two types of metrics you can create:
Type                    Usecase                                         Example  
Counter                 How many times did X happen?                    LLM API errors per minute
Distribution            What is the distribution of X?                  Inference latency histogram

Step 5 — Route Logs to BigQuery for Deep Analytics:
For advanced analytics — trend analysis, cost attribution, compliance auditing — route your logs to BigQuery.
Create a Log Sink to BigQuery:
# 1. Create BigQuery dataset
bq --location=US mk --dataset myproject:genai_logs

# 2. Create the log sink
gcloud logging sinks create genai-bq-sink \
  bigquery.googleapis.com/projects/myproject/datasets/genai_logs \
  --log-filter='jsonPayload.model!=""'

# 3. Grant the sink's service account BigQuery write permissions
# (shown in the output of the above command)


Analyze in BigQuery with SQL:
-- Average inference latency per model, last 7 days
SELECT
  JSON_EXTRACT_SCALAR(jsonPayload, '$.model') AS model,
  ROUND(AVG(CAST(JSON_EXTRACT_SCALAR(jsonPayload, '$.latency_ms') AS FLOAT64)), 1) AS avg_latency_ms,
  COUNT(*) AS total_calls
FROM `myproject.genai_logs.inference`
WHERE timestamp >= TIMESTAMP_SUB(CURRENT_TIMESTAMP(), INTERVAL 7 DAY)
GROUP BY model
ORDER BY avg_latency_ms DESC;


Step 6 — Set Up Alerts:
Never miss a production issue. Connect log-based metrics to Cloud Monitoring for real-time alerts.

Go to Monitoring → Alerting → Create Policy
Under Metric, select your log-based metric (e.g., genai_error_rate)
Set a threshold (e.g., trigger when error rate > 10 per minute)
Choose a notification channel: Email, Slack, PagerDuty, or Pub/Sub webhook

Or via CLI:
gcloud alpha monitoring policies create \
  --notification-channels=CHANNEL_ID \
  --display-name="GenAI High Error Rate" \
  --condition-display-name="Error rate > 10/min" \
  --condition-filter='metric.type="logging.googleapis.com/user/genai_error_rate"' \
  --condition-threshold-value=10 \
  --condition-threshold-comparison=COMPARISON_GT \
  --condition-aggregation-period=60s
  
  
Step 7 — Build Dashboards:
Combine your log-based metrics into an operational dashboard.
Go to Monitoring → Dashboards → Create Dashboard
Add chart widgets using your log-based metrics
For richer analytics: connect BigQuery to Looker Studio (free) for a visual BI layer  


GenAI-Specific Best Practices
As a Principal GenAI Architect, here are the patterns I recommend embedding from day one:
Always log structured JSON — plain text logs are nearly impossible to query at scale. Every GenAI inference call should emit a structured payload with model, prompt_tokens, completion_tokens, latency_ms, user_id, and request_id.

Trace across services — add a trace field tied to X-Cloud-Trace-Context headers so you can correlate a single user request across your API gateway, orchestration layer, and LLM inference service.

Use severity levels intentionally — DEBUG for token-level tracing (disable in prod), INFO for every inference call, WARNING for latency spikes or token limit approaches, ERROR for failed calls, CRITICAL for safety filter triggers.

Separate your log sinks — one sink for raw operational logs (Cloud Storage, cheap long-term), one for analytics (BigQuery, queryable), and one for real-time monitoring (Pub/Sub → your SIEM or custom consumer).

Set retention policies — Cloud Logging default retention is 30 days (_Default bucket). For compliance-heavy GenAI deployments, create a custom bucket with a longer retention period using gcloud logging buckets update.

