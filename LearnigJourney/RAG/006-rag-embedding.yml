Step 17 – Enterprise Best Practices:
Always use the same embedding model

If documents are embedded using

nomic-embed-text

then queries should also use

nomic-embed-text

Changing the model later usually requires re-embedding all stored documents because vectors from different embedding models are generally not comparable.


Choose an embedding model for retrieval:

Don't use a chat model

for embeddings.

Use
nomic-embed-text

bge

mxbai

OpenAI Embeddings

Vertex AI Embeddings


Batch document embeddings:

Instead of embedding

one chunk

at a time

batch

100

or

1000

chunks

for better throughput

(depending on the model and available memory).


