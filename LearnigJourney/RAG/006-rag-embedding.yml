Interview Questions:
Q1. Why can not we store plain text in a Vector Database?:

Because a vector database indexes and compares numerical vectors, not natural language. Embeddings transform text into dense numerical representations so semantic similarity can be computed efficiently.

Q2. Why are embed_documents() and embed_query() different?:

They represent two different workflows. During ingestion, documents are embedded with embed_documents(). During retrieval, the user's question is embedded with embed_query(). Some embedding models optimize these two operations differently.

Q3. Can I use different embedding models for ingestion and query?:

Technically you can, but it is generally not recommended. The document vectors and query vectors should be generated by the same embedding model so they occupy the same vector space and similarity scores remain meaningful.