Therefore

we must convert

Human Language

↓

Numbers

This process is called

Embedding.


Step 2 – What is an Embedding?:

Suppose we have

Employees are entitled to 20 days leave.

Embedding Model converts it into

[0.234,
-0.871,
0.192,
...
0.721]

Question

