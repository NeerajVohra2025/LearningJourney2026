Step 18 – Vector Store vs Vector Database:
People often use the terms interchangeably, but they refer to different layers.

Vector Database

The actual storage engine.

Examples:

ChromaDB
Pinecone
Milvus
Qdrant

It stores vectors, metadata, and indexes.



Vector Store (LangChain)

A Python wrapper that provides a common interface.

vector_store = Chroma(...)

This object exposes methods like:

add_documents()
similarity_search()
delete()
as_retriever()

It hides the implementation details of the underlying database.

Think of it like:

Java Application
        │
        ▼
JDBC Driver
        │
        ▼
Oracle Database

Similarly:

LangChain Application
        │
        ▼
Vector Store
        │
        ▼
ChromaDB                  


Interview Questions:
Q1. Why not use MySQL for vector search?:

Relational databases are optimized for exact matching and relational queries. Semantic search requires efficient nearest-neighbor search in high-dimensional vector space, which vector databases are specifically designed for.

Q2. Why does Chroma need the embedding model?:

When a user submits a query, the query must first be converted into an embedding before similarity search can be performed. The vector store uses the configured embedding function to generate that query vector.

Q3. What does persist_directory do?:

It stores the collection, vectors, metadata, and indexes on disk so that data survives application restarts. Without persistence, you'd need to regenerate embeddings every time the application starts


Q4. What is the difference between similarity_search() and similarity_search_with_score()?:
similarity_search() returns only the matching Document objects.
similarity_search_with_score() returns both the Document and its similarity score, which is useful for debugging, thresholding, and evaluating retrieval quality.