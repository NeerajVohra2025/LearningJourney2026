Step 16 – Retriever vs Vector Store:

This confuses almost everyone.      
| Vector Store                | Retriever                                |
| --------------------------- | ---------------------------------------- |
| Stores vectors              | Retrieves documents                      |
| Knows database APIs         | Knows retrieval strategy                 |
| add_documents()             | invoke()                                 |
| similarity_search()         | invoke(), batch(), stream()              |
| Responsible for persistence | Responsible for finding relevant context |

Think of it like:

Restaurant

Kitchen

↓

Cooks Food

--------------------

Waiter

↓

Brings Food

Kitchen

=

Vector Store

Waiter

=

Retriever

Application

talks

to Waiter.

Not Kitchen.


Step 17 – Interview Questions:
Q1. Why do we need a Retriever if Vector Store already supports similarity search?:

Answer:

A Retriever provides a database-independent abstraction for retrieving relevant documents. It hides vector store implementation details and allows applications to switch retrieval strategies (similarity, MMR, hybrid, metadata filtering, etc.) without changing business logic.

Q2. Does the Retriever call the LLM?:

No.

Its responsibility ends after returning the relevant Document objects.


Q3. Why use as_retriever()?:

Because LangChain chains, agents, and RAG pipelines are designed to work with the generic BaseRetriever interface instead of a specific vector database implementation.

Q4. When should we use MMR instead of similarity search?:

When you want diverse results instead of several nearly identical chunks—for example, summarization, research assistants, or broad information gathering.
