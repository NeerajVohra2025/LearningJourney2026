Chapter 10 – Retriever:
Step 1 – What is a Retriever?:

Let's start with a question.

Suppose we already have

ChromaDB

↓

1 Million Chunks

User asks

How many casual leaves are allowed?

Question

Should we send

all

1 Million chunks

to the LLM?

No.

Question

Should the LLM search

the Vector Database?

No.

Instead

someone else searches

the Vector Database

and returns

only the relevant chunks.

That component is called

Retriever


