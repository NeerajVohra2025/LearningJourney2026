Parameter 2 – chunk_overlap:

This is probably

the most misunderstood parameter.

Example

chunk_overlap=200

Question

Why duplicate text?

Suppose

Chunk 1 ends:
Employees are entitled
Chunk 2 starts:

to 20 days annual leave

The sentence breaks.

Meaning is lost.

Instead

Chunk 2 starts:

earlier.

Visual

Without overlap:

Chunk 1

Employees are entitled

----------------------

Chunk 2

to 20 days annual leave
Bad.

With overlap:
Chunk 1

Employees are entitled to 20 days

----------------------------

Chunk 2

entitled to 20 days annual leave...

Now

meaning is preserved.

Interview Question

Should overlap always exist?:

Almost always

Yes.

Typical values
10%

15%

20%

25%


