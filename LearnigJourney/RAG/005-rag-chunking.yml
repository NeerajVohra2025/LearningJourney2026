Interview Questions:
Q1. Why not send the whole PDF to the LLM?:

Because of context window limits, higher cost, slower inference, and reduced relevance. RAG retrieves only the chunks most relevant to the user's question.


Q2. Why is RecursiveCharacterTextSplitter the default recommendation?:

It tries to preserve semantic structure by splitting on paragraphs first, then sentences, then words, and finally characters only if necessary. This usually produces higher-quality chunks than fixed-size splitting.


Q3. Why is chunk_overlap important?:

It preserves context across chunk boundaries. Without overlap, a sentence or concept may be split across two chunks, reducing retrieval quality.

