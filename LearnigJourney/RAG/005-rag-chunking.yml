Step 11 – What Happens to Metadata?:

Original

{
  "page":10,
  "source":"HR.pdf"
}

Every chunk inherits it.

Example

Chunk 1

{
 "page":10,
 "source":"HR.pdf"
}

Chunk 2

{
 "page":10,
 "source":"HR.pdf"
}

This is extremely important because later

the retriever can tell you

which page

the answer came from.


Step 12 – Types of Chunking:

Enterprise RAG doesn't always use the same splitter.

1. Fixed Character Chunking:
1000 Characters

↓

1000

↓

1000

↓

1000
Simple

Fast

Poor semantic quality.


2. Recursive Chunking (Recommended):
Paragraph

↓

Sentence

↓

Word

↓

Character
Best general-purpose choice.


3. Token Chunking:
512 Tokens

↓

512 Tokens

↓

512 Tokens
Useful

for OpenAI,

Llama,

Gemini,

Claude.


4. Semantic Chunking:

Instead of

counting

characters,

it groups

sentences

by meaning.

Example
Leave Policy

↓

One Chunk

Medical Policy

↓

Another Chunk

Excellent retrieval.

More expensive.


5. Document-Aware Chunking:

Uses

document structure.

Heading

↓

Sub Heading

↓

Content

Perfect

for

manuals

contracts

technical documents.


6. Sliding Window Chunking:

Chunk 1

1–1000

Chunk 2

800–1800

Chunk 3

1600–2600

Notice

overlap.

Very common

in production.



