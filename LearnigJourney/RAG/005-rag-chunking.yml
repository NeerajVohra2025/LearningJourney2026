Step 7 – Most Important Splitter:
RecursiveCharacterTextSplitter

This is the default choice for enterprise RAG.

Create
from langchain_text_splitters import RecursiveCharacterTextSplitter

splitter = RecursiveCharacterTextSplitter(
    chunk_size=1000,
    chunk_overlap=200
)

Question

Did it split anything?

No.:

Like
loader = PyPDFLoader(...)
it only creates

a Splitter object.


