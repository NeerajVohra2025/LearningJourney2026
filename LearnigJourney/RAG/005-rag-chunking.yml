Chapter 7 – Text Splitters (Chunking):
Step 1 – Why do we need Chunking?:

Suppose HR gives us a PDF.
HRPolicy.pdf

↓

500 Pages

↓

5 MB

Question:

Can we send the entire PDF to the LLM?

HRPolicy.pdf

↓

LLM

Answer

No.

Why?

Every LLM has a context window.

Example
Llama 3

↓

128K Tokens

---------------------

GPT-4.1

↓

Large Context

---------------------

Gemini

↓

Very Large Context


Even if the context window is large,:

sending the whole document is:

Slow
Expensive
Mostly irrelevant

Suppose user asks

"How many casual leaves are allowed?"

Should we send

Salary Policy

Travel Policy

IT Policy

Medical Policy

Leave Policy

Holiday Calendar

No.

Only the relevant part.


Step 2 – What is Chunking?:

Chunking simply means
Large Document

↓

Small Pieces

Example:
500 Pages

↓

Page 1

↓

Page 2

↓

Page 3


Not exactly.

We usually split by meaning, not pages.

Example

HR Policy

↓

Leave Policy

↓

Medical Policy

↓

Work From Home Policy

↓

Travel Policy

Each becomes a chunk.


