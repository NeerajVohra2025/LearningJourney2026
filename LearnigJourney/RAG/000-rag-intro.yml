Chapter 1 – Why RAG?:
Before understanding RAG,

let's understand why it was invented.

Suppose we ask ChatGPT:

What is our company's leave policy?

Question:

How does ChatGPT know your company's HR policy?

Answer

It doesn't.

Because
LLM

↓

Only knows

Training Data

It has never seen
Company Policy.pdf

stored inside your company.

Suppose we ask:

What is the balance in my SBI account?

Can GPT answer?

No.

Because

it cannot directly access
Database

SAP

SharePoint

PDF

ServiceNow

Confluence

This is the biggest limitation of LLMs.


Chapter 2 – Problems with LLMs:

LLMs suffer from several limitations.
1. Knowledge Cutoff:

Example

Ask

What happened yesterday?

LLM doesn't know.


2. Private Data:

LLM doesn't know
Your Company Wiki

↓

HR Policy

↓

Invoices

↓

Contracts

↓

Medical Records


3. Hallucination:

Sometimes

LLM invents answers.
Example

Company policy allows 90 days leave.

Reality

Only 20 days.

Business impact

Wrong decisions.


Chapter 3 – Solution:

How can we give
LLM

access to

company documents?

Option 1:

Train LLM again.

Impossible.

Very expensive.

Option 2:

Before asking LLM,

search

company documents,

retrieve

relevant information,

then send it to the LLM.

Exactly

this is

RAG.


Chapter 4 – What is RAG?:

RAG

stands for

Retrieval-Augmented Generation

Break it down.

Retrieval:

Find relevant documents.


Augmented:

Add them to the prompt.


Generation:

LLM generates

the answer.

Architecture:
Question

↓

Retrieve

↓

Relevant Documents

↓

Prompt

↓

LLM

↓

Answer


Notice

LLM

is no longer

guessing.



Chapter 5 – Complete RAG Lifecycle:
                Documents

                    │

          Ingestion Phase

                    │

       Chunking

                    │

       Embedding

                    │

      Vector Database

────────────────────────────────────

                User Query

                    │

           Query Embedding

                    │

          Similarity Search

                    │

        Top K Documents

                    │

          Prompt Builder

                    │

               LLM

                    │

               Answer
               
This is the complete pipeline.




Part 2 – Ingestion Phase:

This is where many beginners start.

But now

you know

WHY.
               
Chapter 6 – What is Ingestion?:
Think of a library.
Suppose
you buy
1000 books.

Question:
Can people search them immediately?
No.
First
the librarian
must
read title
classify
assign shelf
create catalogue

Only then
people can search.
Exactly
the same.               


Documents

↓

Need preparation.

This preparation

is called

Ingestion.


Ingestion Pipeline:
Raw Documents

↓

Load

↓

Parse

↓

Clean

↓

Chunk

↓

Embedding

↓

Metadata

↓

Vector DB

After this

documents

are searchable.



