Chapter 8 – Parsing:
Suppose
PDF contains

Header

Footer

Page Number

Images

Tables


Parser extracts:

actual content.

Example:
Page 10

↓

Remove Header

↓

Remove Footer

↓

Extract Text



Chapter 9 – Cleaning:
Raw text
contains
Extra Spaces

HTML

Tabs

Noise

Duplicate Lines

Cleaning removes them.


Chapter 10 – Chunking (One of the Most Important Chapters):
Question
Why can't we send

a 500-page PDF

directly to the LLM?

Because

context window

is limited.

So we split the document.

This is called

Chunking:

Types of Chunking:
1. Fixed-size Chunking:
1000 characters

↓

1000

↓

1000

↓

1000

Simple

but may break sentences.


2. Recursive Chunking:

Splits using
Paragraph

↓

Sentence

↓

Word

3. Semantic Chunking:

Uses

meaning

instead of size.

Example

Keep

one topic

inside one chunk.

Much better

for RAG.


4. Token Chunking:

Split by

LLM Tokens

instead of characters.



5. Document-aware Chunking:

Keep

Heading

↓

Subheading

↓

Content

Together.

Excellent

for enterprise documents.




6. Sliding Window Chunking:
Chunk 1

1–500

Chunk 2

400–900

Overlap

100 Tokens

Prevents

context loss.



Chapter 11 – Embedding:

Suppose

Sentence

I love dogs.

Question

Can Vector DB understand English?:

No.

It understands

numbers.

Embedding converts


"I love dogs"

↓

[0.25, -0.73, 0.91...]
This numeric representation

captures

meaning.


Chapter 12 – Vector Store:

Question

Where do we store embeddings?

Answer

Vector Database.

Examples

Pinecone

Milvus

Qdrant

Weaviate

ChromaDB

FAISS


Stored:

Embedding

+

Metadata

+

Original Text


Chapter 13 – Metadata:
Every chunk

stores metadata.

Example
Document

HR Policy.pdf

Page

15

Department

HR

Version

3.2
Useful

for filtering.


Chapter 14 – Indexing:
Question

Can Vector DB compare

10 million vectors

one by one?

Very slow.

Instead

it creates

Approximate Nearest Neighbor (ANN)

indexes.

Examples

HNSW

IVF

PQ

DiskANN

These make similarity search scalable.



Part 3 – Query Phase:

User asks

"What is maternity leave policy?"


Chapter 15 – Query Processing:

Query

↓

Clean

↓

Rewrite

↓

Expand

↓

Embed



Chapter 16 – Query Embedding:

Exactly same embedding model.

Question

↓

Vector



Chapter 17 – Search:

This deserves several chapters.

Semantic Search:

Meaning

not keywords.



Keyword Search (Lexical):

Uses

BM25

TF-IDF

Exact words.


Hybrid Search:

Semantic

Keyword

Best

for enterprise.


Metadata Filtering:

Example

Only search

Department = HR



Multi-vector Search:

Use

multiple embeddings

for better retrieval.

Dense Search:

Embedding vectors.

Sparse Search:

Keyword-based vectors.


ANN Search:

Fast approximate search.



Chapter 18 – Retrieval:

Top K

documents.

Example

Top 5

Most Similar Chunks



Chapter 19 – Re-ranking:

Sometimes

Top 5

aren't in the ideal order.

A reranker (often a cross-encoder model)

re-scores them.

Better relevance.


Chapter 20 – Augmentation:

Now

Prompt Builder

creates

Question

+

Retrieved Chunks

+

Instructions

↓

LLM

This is

Augmentation.


Chapter 21 – Generation:
LLM

reads

only

retrieved context.

Produces

grounded answer.


