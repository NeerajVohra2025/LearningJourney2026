Chapter 1 – Why Was RAG Invented?:
Goal of this chapter: Understand the business problem that Retrieval-Augmented Generation (RAG) was created to solve.
Imagine This Scenario:
It's your first day at a new company.
You have just received your laptop and completed the onboarding process.
A colleague walks up to you and asks:
"Can you tell me what our company's maternity leave policy is?"
Can you answer?
No.
Not because you're inexperienced or incapable, but because you don't have the information yet.
You haven't read:
The HR Policy
The Employee Handbook
Internal Guidelines
Company Wiki
SharePoint Documents
You simply don't have access to the organization's knowledge.
Now replace yourself with an LLM (Large Language Model) like ChatGPT or Gemini.
The situation is exactly the same.

What Does an LLM Actually Know?:
Many people believe ChatGPT "knows everything."
It doesn't.
An LLM knows only what it has learned during training.
Think of it like this:
                Internet Data
                     │
Books ───────────────┤
Wikipedia ───────────┤
Research Papers ─────┤
Public Websites ─────┤
Open Source Code ────┤
                     ▼
             Large Language Model
             
             
The model is trained on a massive collection of publicly available information. It does not automatically know anything that exists inside your company.             

Enterprise Example:
Suppose your company has a document called:
HR_Leave_Policy_2026.pdf
Inside that document, it says:
Employees receive 20 days of annual leave.
Now ask the LLM:
"How many annual leave days does our company provide?"
Can it answer?
No.
Why?
Because that PDF was never part of its training data.
The LLM has never seen it.

Banking Example:
Suppose you ask:
"What is the balance of my SBI account?"
Can ChatGPT answer?
No.
Why?
Because your account balance is stored in:
Core Banking System
Database
APIs
—not inside the model.

The model has no direct connection to your bank.

Enterprise Systems Are Invisible to an LLM:
An LLM cannot automatically access:
SharePoint
Confluence
ServiceNow
Jira
SAP
Oracle
SQL Databases
Google Drive
S3 Buckets
Internal APIs
Company PDFs
These systems contain your organization's knowledge, but they are separate from the model.


The Three Biggest Limitations of LLMs:
1. Knowledge Cutoff:
An LLM only knows information available up to the point when it was trained (or last updated).
Example:

"What happened in our production environment yesterday?" The model cannot know unless you provide that information.


2. Private Enterprise Data:
Organizations store valuable information in private systems:
HR policies
Financial reports
Customer contracts
Product documentation
Incident reports
Medical records
Insurance claims
These documents are protected and are not part of public training data.



3. Hallucinations:
This is the most dangerous limitation.
When the model lacks information, it may generate an answer that sounds convincing but is incorrect.
Example:
Question:
"How many leave days does our company provide?"
The model replies:
"Most companies provide 30 days of annual leave."
It sounds reasonable.
But your actual HR policy states:
20 days
The model did not retrieve the company policy—it guessed based on patterns in its training data.


Why Is Hallucination a Serious Business Problem?:
Imagine these scenarios:

Banking:
Customer:
"What is my loan interest rate?"
The AI invents an incorrect value.
This could lead to financial disputes.


Healthcare:
Doctor:
"What dosage does this patient require?"
The AI guesses.
An incorrect recommendation could directly affect patient safety.


Insurance:
Customer:
"Does my policy cover flood damage?"
The AI hallucinates and says:
"Yes."
The actual policy excludes floods.
This could result in legal and financial consequences.


The Core Problem:
Let's summarize what we've learned.
The LLM is intelligent.
The LLM understands language.
The LLM can reason.
But it does not have access to your organization's knowledge.


Without access to trusted enterprise data, it has only two options:
Say "I don't know."
Guess.
Neither option is acceptable for enterprise applications.


Architect's Insight:
A common misconception is:
"LLMs fail because they are not smart enough."
That is not the problem.
The real problem is that the model lacks the right context.
As architects, we don't solve this by making the model "smarter."
We solve it by providing the right information at the right time.
This single idea is the foundation of Retrieval-Augmented Generation (RAG).


Common Mistakes:
❌ Assuming an LLM "knows everything."
❌ Believing fine-tuning is the first solution to enterprise knowledge.
❌ Trusting every AI-generated response without verifying its source.

