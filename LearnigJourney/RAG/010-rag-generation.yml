Step 19 – Responsibilities of Each Component:
| Component       | Responsibility                                                                                    |
| --------------- | ------------------------------------------------------------------------------------------------- |
| Loader          | Read documents from a source and create `Document` objects.                                       |
| Splitter        | Divide documents into manageable chunks while preserving context.                                 |
| Embedding Model | Convert text into vectors for semantic search.                                                    |
| Vector Store    | Persist vectors, metadata, and indexes for efficient retrieval.                                   |
| Retriever       | Find the most relevant chunks for a user's query.                                                 |
| Prompt Builder  | Combine retrieved context, system instructions, and the user's question into an augmented prompt. |
| LLM             | Read the augmented prompt and generate a natural-language answer token by token.                  |

Step 20 – Enterprise Best Practices:

✔ Use the same embedding model for document ingestion and query embedding.

✔ Choose a chunk size and overlap that match your document type and retrieval needs.

✔ Retrieve only the top few relevant chunks instead of flooding the prompt.

✔ Use a clear system prompt that instructs the model not to guess when the context is insufficient.

✔ Set temperature close to 0 for factual enterprise RAG applications.

✔ Log retrieved documents and similarity scores to help debug retrieval quality.


Interview Questions
Q1. Does the LLM perform semantic search?:

Answer: No. Semantic search happens before the LLM is called. The retriever uses embeddings and the vector store to find relevant documents. The LLM only receives the augmented prompt.

Q2. Why are there two kinds of embeddings in a RAG system?:

Answer: RAG uses an external embedding model to create vectors for retrieval. Separately, every LLM has its own internal embedding layer that converts input tokens into vectors for language understanding. These serve different purposes.

Q3. Does the LLM generate the whole answer at once?:

Answer: No. It predicts one token at a time. Streaming works because tokens are sent to the client as soon as they are generated.


Q4. Does RAG eliminate hallucinations?:

Answer: No. RAG significantly reduces hallucinations by grounding the model with retrieved context, but the LLM can still produce unsupported information if the prompt is weak, retrieval quality is poor, or the retrieved context is insufficient.


