Step 14 – Interview Questions:
Q1. Why do we need a Document Loader?:

Answer:

A Document Loader converts data from different sources (PDF, Word, HTML, CSV, SharePoint, Confluence, databases, etc.) into a common Document representation. This allows the rest of the RAG pipeline (splitters, embeddings, retrievers) to work independently of the original data source.


Q2. Does PyPDFLoader create embeddings?:

No.

Its responsibility ends here:

PDF

↓

Document Objects

Embedding happens later.


Q3. What is the difference between load() and lazy_load()?:
| load()                            | lazy_load()                       |
| --------------------------------- | --------------------------------- |
| Reads entire document into memory | Reads one document/page at a time |
| Faster for small files            | Better for large files            |
| Higher memory usage               | Lower memory usage                |


Q4. When should we use aload()?:

When working with asynchronous frameworks such as FastAPI, LangGraph, or other async ingestion pipelines, so document loading doesn't block other concurrent tasks.

