Step 14:

Interview Questions

Q1. Why does LangChain use a Document class?:

Answer:

To provide a common representation for content regardless of its original source (PDF, Word, HTML, CSV, database, etc.), allowing downstream components like splitters, embedding models, and retrievers to work with a consistent object.

Q2. Does ChromaDB store Document objects?:

Answer:

No.

ChromaDB stores:

Embedding vector
Original chunk text (usually from page_content)
Metadata
Optional document ID

The Document object exists in your application memory. Before storing data, LangChain extracts the relevant fields and sends them to the vector database.


Q3. Can Document store images?:

By default, page_content is textual. Images are typically processed by a multimodal pipeline (OCR, image captioning, or multimodal embeddings) before being represented as text or associated metadata in a Document.


