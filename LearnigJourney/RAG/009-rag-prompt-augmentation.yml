Step 16 – Complete Prompt:

The final prompt sent to the LLM is typically much larger than the user's original question.
------------------------------------------------

SYSTEM

You are an HR Assistant.

Only answer from supplied context.

If answer not found,

say "I don't know."

------------------------------------------------

CONTEXT

Employees receive

20 days annual leave.

Unused leave

can be carried forward.

Medical leave

requires manager approval.

------------------------------------------------

QUESTION

How many annual leaves are allowed?

------------------------------------------------
This is exactly what the LLM receives.


