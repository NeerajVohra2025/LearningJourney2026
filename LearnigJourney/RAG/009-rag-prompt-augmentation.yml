Chapter 11 – Prompt Augmentation:

Step 1 – What is Prompt Augmentation?

Suppose user asks

How many casual leaves are allowed?

Retriever returns

Chunk 1

Employees are entitled to 20 days annual leave.

-------------------------

Chunk 2

Casual leave may be carried forward.

-------------------------

Chunk 3

Medical leave requires approval.

Question

Can LLM understand

List<Document>

No.

LLM understands

Prompt

Therefore

someone has to convert

List<Document>

↓

Prompt

This process is called

Prompt Augmentation


