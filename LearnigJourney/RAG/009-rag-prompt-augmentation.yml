Step 21 – Enterprise Best Practices:

✔ Use a strong System Prompt to define the assistant's role and prevent unsupported answers.

✔ Insert only the most relevant retrieved chunks into the prompt to stay within the context window.

✔ Instruct the model to answer only from the supplied context and explicitly say when information is unavailable.

✔ Include document metadata (such as source or page number) when citations or traceability are required.

✔ Keep prompts concise—more context is not always better if it includes irrelevant information.


Interview Questions:
Q1. Why is Prompt Augmentation required?:

Because retrievers return Document objects, while LLMs require natural-language prompts. Prompt augmentation converts retrieved content and user input into a structured prompt that the LLM can understand.


Q2. Who performs Prompt Augmentation?:

The application or framework (for example, LangChain) performs prompt augmentation using prompt templates and document formatting. The retriever only retrieves documents; it does not build prompts.


Q3. What is the difference between Context and Prompt?:
Context is the retrieved knowledge (chunks from the vector store).
Prompt includes the context plus system instructions, the user's question, formatting guidance, and any other information sent to the LLM.


Q4. Does the LLM query the Vector Database?:

No.

The LLM never communicates directly with the vector database. It only receives the final augmented prompt created by the application.


