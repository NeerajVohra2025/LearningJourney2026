Step 4 – What is an Augmented Prompt?:

Suppose user asks

How many annual leaves are allowed?

Retriever returns

Employees are entitled to 20 days annual leave.

Prompt Builder creates

You are an HR Assistant.

Answer ONLY using the supplied context.

Context

Employees are entitled to 20 days annual leave.

Question

How many annual leaves are allowed?

This

is called

the

Augmented Prompt.

Notice

Original question

became

a much larger prompt.



