# Chapter 13 – Re-ranking: Selecting the Best Evidence Before Calling the LLM

## Goal of this Chapter
Understand **what Re-ranking is**, why it is needed even after retrieval, how re-ranking models work, the difference between bi-encoders and cross-encoders, and why re-ranking is a key component of production-grade RAG systems.

---

# Recap from Previous Chapters

In **Chapter 12**, we learned how the retrieval system:

* Converts the user query into an embedding.
* Searches the Vector Database.
* Calculates similarity scores.
* Retrieves the Top-K most relevant chunks.

Suppose the retrieved results are:

| Rank | Retrieved Chunk     | Similarity Score |
| ---- | ------------------- | ---------------: |
| 1    | Company Overview    |             0.92 |
| 2    | Leave Policy FAQ    |             0.91 |
| 3    | Annual Leave Policy |             0.89 |

Now imagine the user's question is:

> **"How many annual leave days do employees receive?"**

Which chunk actually contains the answer?

Clearly,

**Annual Leave Policy**

But it appears **third**.

This introduces a new problem.

> **Retrieval finds relevant documents, but it doesn't always rank them perfectly.**

This is where **Re-ranking** comes in.

---

# What is Re-ranking?

Re-ranking is the process of **re-evaluating the retrieved documents and arranging them in the best possible order before sending them to the LLM.**

Think of Retrieval as creating a shortlist.

Think of Re-ranking as selecting the best candidates from that shortlist.

---

# Real-Life Analogy

Imagine a company hiring a Solutions Architect.

HR receives:

* 5,000 resumes.

Can the hiring manager interview all 5,000?

No.

HR first shortlists:

* Top 20 resumes.

Then,

The Technical Panel reviews those 20 resumes carefully and rearranges them based on technical expertise.

Finally,

The best candidates are interviewed.

This is exactly how Retrieval and Re-ranking work.

| Recruitment Process                  | RAG Process                 |
| ------------------------------------ | --------------------------- |
| Receive 5,000 resumes                | Millions of document chunks |
| HR shortlists Top 20                 | Retriever selects Top-K     |
| Technical interview ranks candidates | Re-ranker reorders chunks   |
| Final interview                      | LLM generates answer        |

---

# Why Isn't Retrieval Enough?

Retrieval uses embeddings.

Embeddings are excellent at finding **similar meaning**.

However,

they compare:

* Query Vector
* Document Vector

independently.

They do **not** deeply analyze the relationship between the full question and the full document.

Sometimes,

a document appears semantically similar but is not the best answer.

---

# High-Level Workflow

```text
                  User Question
                        │
                        ▼
                 Query Embedding
                        │
                        ▼
                Vector Database
                        │
                        ▼
                 Top-10 Chunks
                        │
                        ▼
                 Re-ranking Model
                        │
                        ▼
                Best Top-3 Chunks
                        │
                        ▼
                 Prompt Builder
                        │
                        ▼
                       LLM
```

Notice something important.

The Vector Database returns:

> **Candidate Documents**

The Re-ranker decides:

> **Which candidates are actually the best.**

---

# Retrieval vs Re-ranking

| Retrieval                    | Re-ranking                         |
| ---------------------------- | ---------------------------------- |
| Fast                         | Slower                             |
| Searches millions of vectors | Evaluates only Top-K               |
| Uses embeddings              | Uses deeper semantic understanding |
| High recall                  | High precision                     |
| Returns candidates           | Returns best evidence              |

These two stages complement each other.

---

# Why Doesn't the Re-ranker Evaluate Every Document?

Imagine an enterprise with:

* 100 million document chunks.

Running a sophisticated re-ranking model on every chunk would be prohibitively slow and expensive.

Instead,

the workflow is:

```text
100 Million Chunks

↓

Retriever

↓

Top 20 Chunks

↓

Re-ranker

↓

Top 5 Chunks

↓

LLM
```

The Re-ranker only evaluates a **small shortlist**.

This provides high accuracy while maintaining low latency.

---

# Bi-Encoder vs Cross-Encoder

Understanding this difference is important for interviews.

---

## Bi-Encoder

During retrieval,

the query and document are encoded **independently**.

Example:

```text
Question

↓

Embedding

Question Vector

------------------------

Document

↓

Embedding

Document Vector
```

Similarity is calculated by comparing the two vectors.

Advantages:

* Extremely fast
* Scalable
* Suitable for millions of documents

Disadvantage:

* Limited interaction between the question and document.

---

## Cross-Encoder

A Cross-Encoder processes the **question and document together**.

Example:

```text
Question

+

Document

↓

Cross-Encoder

↓

Relevance Score
```

Instead of comparing vectors,

it directly learns how well the document answers the question.

Advantages:

* Much more accurate
* Better ranking

Disadvantages:

* Computationally expensive
* Not suitable for millions of documents

Therefore,

Cross-Encoders are primarily used for Re-ranking.

---

# Enterprise Example

Suppose the retrieved chunks are:

### Chunk 1

Company Leave Philosophy

---

### Chunk 2

Annual Leave Policy

Employees receive 20 working days of annual leave.

---

### Chunk 3

Holiday Calendar

The embedding model may rank:

| Chunk            | Rank |
| ---------------- | ---: |
| Leave Philosophy |    1 |
| Annual Leave     |    2 |
| Holiday Calendar |    3 |

The Cross-Encoder analyzes:

Question

*

Chunk

together.

New ranking becomes:

| Chunk               | New Rank |
| ------------------- | -------: |
| Annual Leave Policy |        1 |
| Holiday Calendar    |        2 |
| Leave Philosophy    |        3 |

Now the LLM receives the best evidence first.

---

# Re-ranking Scores

After retrieval:

| Chunk            | Similarity |
| ---------------- | ---------: |
| Leave Philosophy |       0.91 |
| Annual Leave     |       0.90 |
| Holiday Calendar |       0.88 |

After re-ranking:

| Chunk            | Relevance Score |
| ---------------- | --------------: |
| Annual Leave     |            0.99 |
| Holiday Calendar |            0.72 |
| Leave Philosophy |            0.48 |

Notice that the order changes significantly.

This improves answer quality.

---

# Reciprocal Rank Fusion (RRF)

Enterprise systems often combine results from multiple retrieval methods.

Example:

* Dense Search
* BM25 Search
* Metadata Search

Each produces a ranked list.

RRF combines these rankings into one final ranking.

```text
Dense Search

↓

Ranked List

+

BM25

↓

Ranked List

+

Metadata

↓

Ranked List

↓

Reciprocal Rank Fusion

↓

Unified Ranking
```

This improves robustness and reduces dependence on a single retrieval technique.

---

# Popular Re-ranking Models

Common production models include:

### Cohere

* Cohere Rerank

---

### OpenAI

* Responses API-based ranking workflows (application-managed)

---

### Google

* Vertex AI Ranking capabilities

---

### Open Source

* BGE Reranker
* Jina AI Reranker
* CrossEncoder (Sentence Transformers)

The choice depends on:

* Latency
* Cost
* Accuracy
* Deployment environment

---

# Enterprise Architecture

```text
User Question

↓

Embedding

↓

Vector Search

↓

Top-20 Chunks

↓

Metadata Filtering

↓

Cross-Encoder

↓

Top-5 Chunks

↓

Prompt Builder

↓

LLM

↓

Grounded Response
```

Notice that the LLM receives only the **highest-quality evidence**.

---

# Why Re-ranking Matters

Suppose the correct answer exists in:

Chunk 18.

Without re-ranking,

it may never reach the LLM.

With re-ranking,

Chunk 18 moves to Rank 1.

This significantly improves:

* Accuracy
* Faithfulness
* User satisfaction

Without changing the LLM at all.

---

# Architect's Insight

Many beginners focus exclusively on selecting a better LLM.

Experienced architects ask:

* Is retrieval good enough?
* Is re-ranking necessary?
* Should we retrieve Top-20 and send Top-5?
* Should different document types use different re-rankers?
* What is the latency budget?

In many enterprise projects, adding a high-quality re-ranker improves accuracy more than upgrading from one LLM to another.

A common principle is:

> **Better Retrieval + Better Re-ranking = Better RAG**

Not simply:

> Better LLM = Better RAG.

---

# Best Practices

✔ Retrieve more chunks than you plan to send to the LLM.

✔ Apply re-ranking before prompt construction.

✔ Use Cross-Encoders for re-ranking, not for large-scale retrieval.

✔ Benchmark retrieval and re-ranking separately.

✔ Balance accuracy with latency.

✔ Continuously evaluate ranking quality using real user questions.

---

# Key Takeaways

* Retrieval identifies candidate documents.
* Re-ranking reorders those candidates based on deeper semantic relevance.
* Bi-Encoders are optimized for fast retrieval.
* Cross-Encoders are optimized for accurate re-ranking.
* Re-ranking significantly improves answer quality without changing the LLM.
* Enterprise RAG systems commonly retrieve Top-20 and send only the best Top-3 to Top-5 chunks to the LLM.

---

# Interview Questions

### Q1. Why is Re-ranking needed if retrieval already returns relevant documents?

**Answer**

Retrieval prioritizes speed and recall, so the ranking is not always optimal. Re-ranking performs a deeper semantic evaluation of the retrieved candidates and orders them by true relevance before sending them to the LLM.

---

### Q2. What is the difference between a Bi-Encoder and a Cross-Encoder?

**Answer**

A Bi-Encoder encodes the query and document independently, making it fast and scalable for retrieval. A Cross-Encoder evaluates the query and document together, producing more accurate relevance scores but with higher computational cost, making it suitable for re-ranking.

---

### Q3. Why don't we use Cross-Encoders to search millions of documents?

**Answer**

Cross-Encoders process the query and document together, making them computationally expensive. Running them against millions of documents would result in unacceptable latency and cost. Instead, they are applied only to the Top-K documents retrieved by the Vector Database.

---

### Q4. What is Reciprocal Rank Fusion (RRF)?

**Answer**

RRF is a ranking technique that combines ranked results from multiple retrieval methods, such as Dense Retrieval and BM25, into a single unified ranking. It improves retrieval robustness and overall relevance.

---

# Common Mistakes

* Sending retrieval results directly to the LLM without re-ranking.
* Using Cross-Encoders for large-scale retrieval instead of re-ranking.
* Confusing retrieval scores with relevance scores.
* Retrieving too few documents, leaving the re-ranker with insufficient candidates.
* Optimizing only the LLM while ignoring retrieval and ranking quality.

---

# Next Chapter

We now have the **best-ranked evidence**.

The next question is:

> **How do we combine the retrieved context, system instructions, conversation history, and the user's question into a prompt that the LLM can understand?**

In **Chapter 14 – Prompt Augmentation & Context Construction**, we'll learn how enterprise RAG systems build high-quality prompts, manage context windows, handle citations, and prepare grounded inputs for the LLM.


