# Interview Questions

### Q1. What is Agentic RAG?

**Answer**

Agentic RAG combines Retrieval-Augmented Generation with AI agents that can reason, plan, use tools, maintain memory, and execute multi-step workflows. Unlike traditional RAG, it focuses on completing business tasks rather than only answering questions.

---

### Q2. How is Agentic RAG different from Traditional RAG?

**Answer**

Traditional RAG retrieves relevant documents and generates a single response. Agentic RAG adds planning, iterative reasoning, memory, tool calling, workflow execution, and the ability to collaborate with other agents to accomplish complex tasks.

---

### Q3. Why is planning important in an AI agent?

**Answer**

Planning allows the agent to break a complex goal into smaller executable steps, determine the required tools and information, and adapt its strategy as new information becomes available.

---

### Q4. Why do enterprise AI systems use multiple agents?

**Answer**

Different agents specialize in different domains or responsibilities. Multi-agent systems improve modularity, scalability, maintainability, and allow complex business workflows to be divided among specialized AI components.

---

# Common Mistakes

* Assuming Agentic AI replaces RAG instead of building upon it.
* Giving one agent too many unrelated responsibilities.
* Allowing unrestricted tool access without authorization.
* Treating memory as a replacement for retrieval.
* Omitting human approval for high-risk actions such as financial transactions or compliance decisions.

