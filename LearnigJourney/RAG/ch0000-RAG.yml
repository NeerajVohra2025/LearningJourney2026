# Key Takeaways

* Performance optimization spans the entire RAG pipeline.
* Caching reduces latency and operational cost.
* Sharding and horizontal scaling enable large-scale deployments.
* GPU acceleration improves LLM inference performance.
* Model routing balances quality and cost.
* Enterprise architects optimize for scalability, reliability, latency, and cost together.

---

# Interview Questions

### Q1. Why is caching important in a RAG system?

**Answer**

Caching reduces repeated computation by storing frequently used responses, embeddings, or retrieval results. This improves response time, lowers LLM usage, and reduces operational costs.

---

### Q2. What is sharding in a Vector Database?

**Answer**

Sharding is the process of partitioning vector data across multiple servers. It enables horizontal scalability, improves performance, and allows the system to manage very large datasets efficiently.

---

### Q3. Why do enterprise AI platforms use model routing?

**Answer**

Model routing directs different requests to different models based on complexity. Simpler requests can use smaller, faster, and less expensive models, while complex tasks are handled by more capable models.

---

### Q4. What is the difference between vertical and horizontal scaling?

**Answer**

Vertical scaling increases the resources of a single server, while horizontal scaling adds more servers behind a load balancer. Horizontal scaling generally provides better scalability and fault tolerance for enterprise AI platforms.

---

# Common Mistakes

* Scaling only the LLM while ignoring retrieval bottlenecks.
* Using a single model for every request.
* Ignoring cache invalidation after knowledge updates.
* Overly long prompts that increase latency and cost.
* Measuring latency without considering throughput and reliability.

