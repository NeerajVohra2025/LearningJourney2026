# Chapter 1 – Why Was RAG Invented?
## Goal of this Chapter
Understand the business problem that **Retrieval-Augmented Generation (RAG)** was created to solve.

---
# Imagine This Scenario
It's your **first day** at a new company.

You have just received your laptop and completed the onboarding process.

A colleague walks up to you and asks:

> **"Can you tell me what our company's maternity leave policy is?"**

Can you answer?

**No.**

Not because you're inexperienced or incapable, but because **you don't have the information yet**.

You haven't read:

* The HR Policy
* The Employee Handbook
* Internal Guidelines
* Company Wiki
* SharePoint Documents

You simply don't have access to the organization's knowledge.

Now replace **yourself** with an **LLM (Large Language Model)** like ChatGPT or Gemini.

The situation is exactly the same.

---
# What Does an LLM Actually Know?

Many people believe ChatGPT "knows everything."

It doesn't.

An LLM only knows what it learned during training.

```
                Internet Data
                     │
Books ───────────────┤
Wikipedia ───────────┤
Research Papers ─────┤
Public Websites ─────┤
Open Source Code ────┤
                     ▼
             Large Language Model
```

The model is trained using a massive collection of **publicly available information**.

It **does not automatically know** anything that exists inside your organization.

---

# Enterprise Example

Suppose your company has a document named:

```
HR_Leave_Policy_2025.pdf
```

Inside the document it states:

> Employees receive **20 days of annual leave**.

Now ask the LLM:

> **"How many annual leave days does our company provide?"**

Can it answer?

**No.**

Why?

Because that document was **never part of the model's training data**.

The LLM has never seen it.

---

# Banking Example

Suppose you ask:

> **"What is the balance of my SBI account?"**

Can ChatGPT answer?

**No.**

Why?

Because your account balance exists inside:

* Core Banking System
* Databases
* Banking APIs

—not inside the LLM.

The model has **no direct connection** to your bank.

---

# Enterprise Systems Are Invisible to an LLM

A Large Language Model cannot automatically access:

* SharePoint
* Confluence
* ServiceNow
* Jira
* SAP
* Oracle
* SQL Databases
* Google Drive
* Amazon S3
* Internal APIs
* Company PDFs

These systems contain valuable enterprise knowledge, but they are completely separate from the model.

---

# The Three Biggest Limitations of LLMs

## 1. Knowledge Cutoff

An LLM only knows information available up to the point when it was trained.

**Example**

> "What happened in our production environment yesterday?"

The model cannot know unless someone provides that information.

---

## 2. Private Enterprise Data

Organizations store critical information in private systems such as:

* HR Policies
* Financial Reports
* Customer Contracts
* Product Documentation
* Incident Reports
* Medical Records
* Insurance Claims

Since these documents are private, they are **not included in the model's training data**.

---

## 3. Hallucinations

This is one of the most serious limitations of Large Language Models.

When the model does not know the correct answer, it may generate a response that **sounds convincing but is actually incorrect**.

### Example

**Question**

> "How many annual leave days does our company provide?"

**LLM Response**

> "Most companies provide 30 days of annual leave."

The answer sounds reasonable.

However, the actual HR policy states:

> **20 days**

The model did not retrieve the company policy—it **guessed** based on patterns learned during training.

This behavior is called **Hallucination**.

---

# Why Is Hallucination a Serious Business Problem?

### Banking

**Customer**

> "What is my loan interest rate?"

If the AI invents an incorrect interest rate, it can lead to financial disputes and customer dissatisfaction.

---

### Healthcare

**Doctor**

> "What dosage should this patient receive?"

If the AI guesses the dosage, the consequences could directly impact patient safety.

---

### Insurance

**Customer**

> "Does my insurance policy cover flood damage?"

The AI replies:

> "Yes."

However, the policy actually excludes flood coverage.

This may result in legal, financial, and compliance issues.

---

# The Core Problem

Let's summarize.

A Large Language Model is:

* Intelligent
* Capable of understanding language
* Good at reasoning

But it **does not have access to your organization's private knowledge**.

Without trusted enterprise data, the model has only two choices:

1. Say **"I don't know."**
2. Guess.

Neither option is acceptable for enterprise AI applications.

---

# Architect's Insight

A common misconception is:

> "LLMs fail because they are not intelligent enough."

That is **not** the real problem.

The real problem is that **the model lacks the right context**.

As architects, our goal is **not to make the model smarter**.

Our goal is to provide **the right information at the right time**.

This fundamental idea led to the creation of **Retrieval-Augmented Generation (RAG).**

---

# Key Takeaways

* An LLM is **not** a live enterprise database.
* It cannot automatically access private organizational knowledge.
* Enterprise information resides in documents, databases, and business applications.
* Without access to trusted information, LLMs may hallucinate.
* Enterprise AI requires a mechanism to retrieve relevant information before the model generates an answer.

---

# Interview Questions

### Q1. Why was RAG invented?

**Answer**

RAG was introduced to overcome the limitations of Large Language Models by providing access to external, up-to-date, and private enterprise knowledge during inference. Instead of relying only on training data, RAG retrieves relevant information and uses it to generate grounded, accurate responses.

---

### Q2. Why can't an LLM answer questions about your company's HR policy?

**Answer**

Because the HR policy is private enterprise data and is not part of the model's training corpus. Unless the information is retrieved and provided at inference time, the model has no knowledge of it.

---

# Common Mistakes

* Believing an LLM knows everything.
* Assuming fine-tuning is the first solution for enterprise knowledge.
* Trusting AI-generated responses without validating their source.

---

# Next Chapter

Now that we understand **why LLMs alone are insufficient**, the next logical question is:

> **If an LLM doesn't know our company's private data, how can we securely provide that information without retraining the model?**

In **Chapter 2**, we'll answer this question by introducing **Retrieval-Augmented Generation (RAG)** and understanding how it solves this problem.


