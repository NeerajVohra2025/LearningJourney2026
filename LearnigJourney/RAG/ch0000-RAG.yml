# Chapter 3 – High-Level RAG Architecture
## Goal of this Chapter
Understand the **complete architecture of a Retrieval-Augmented Generation (RAG) system**, the role of each component, and how data flows from enterprise documents to the final AI response.
---
# Recap from Previous Chapters
In **Chapter 1**, we learned that an LLM cannot answer questions about private enterprise data because it has never seen that information during training.
In **Chapter 2**, we learned that instead of retraining the model, we can:

1. Retrieve relevant enterprise knowledge.
2. Add it to the prompt.
3. Allow the LLM to generate a grounded answer.
This raises the next question:
> **How does a RAG system actually work behind the scenes?**
To answer this, we need to understand the overall architecture.
---
# Think Like an Architect
Imagine you are building a digital library.
Your goal is simple:
* Store millions of documents.
* Allow users to ask questions.
* Return accurate answers within a few seconds.
Can the LLM do everything?

**No.**
Just like a company has different departments, a RAG system has different components, each with a specific responsibility.
A well-designed RAG system follows the principle of:
> **"Each component should perform one responsibility exceptionally well."**
---
# The Complete RAG Architecture
```text
                    Enterprise Documents
      ┌────────────────────────────────────────────┐
      │ PDF │ Word │ SharePoint │ Confluence │ API │
      └────────────────────────────────────────────┘
                        │
                        ▼
               Ingestion Pipeline
                        │
                        ▼
                Vector Database
=========================================================
                    User Question
                        │
                        ▼
                  Query Pipeline
                        │
                        ▼
                  Relevant Chunks
                        │
                        ▼
                 Prompt Builder
                        │
                        ▼
              Large Language Model
                        │
                        ▼
                 Grounded Response
```

This architecture can be divided into **two independent pipelines**.
---
# Pipeline 1 – Ingestion Pipeline
This pipeline runs **before any user asks a question**.
Its job is to prepare enterprise documents so they become searchable.
Think of it as preparing books before placing them in a library.
The Ingestion Pipeline performs tasks such as:
* Loading documents
* Parsing content
* Cleaning text
* Splitting into chunks
* Creating embeddings
* Storing vectors
Once this process is complete, the enterprise knowledge base is ready.
---
# Pipeline 2 – Query Pipeline
This pipeline starts **only when a user asks a question**.
Example:
> "What is our maternity leave policy?"
The Query Pipeline:
* Understands the question.
* Converts it into an embedding.
* Searches the Vector Database.
* Retrieves the most relevant chunks.
* Builds the prompt.
* Sends the prompt to the LLM.
* Returns a grounded answer.
Unlike the Ingestion Pipeline, this pipeline executes in real time.
---
# Why Are There Two Pipelines?
This is an important architectural decision.
Imagine an organization has:
* 5 million PDF files
* 10 million Confluence pages
* 20 million ServiceNow incidents
Would you process all of these every time a user asks a question?
Of course not.
That would be extremely slow and expensive.
Instead:
* Prepare the documents once (Ingestion Pipeline).
* Reuse the prepared knowledge for every future query (Query Pipeline).

This separation makes RAG systems scalable and efficient.
---
# Responsibilities of Each Component
## 1. Document Repository
Stores enterprise knowledge such as:
* PDFs
* Word documents
* SharePoint
* Confluence
* ServiceNow
* Databases
* APIs
* Cloud Storage

This is the organization's source of truth.
---
## 2. Ingestion Pipeline
Responsible for transforming raw documents into searchable knowledge.
It prepares documents by:
* Loading
* Parsing
* Cleaning
* Chunking
* Embedding
* Storing

Without ingestion, retrieval is impossible.
---
## 3. Vector Database
Stores:
* Embeddings
* Original text
* Metadata
Its job is to quickly find documents that are semantically similar to a user's question.

Examples include:
* Pinecone
* Qdrant
* Weaviate
* Milvus
* ChromaDB
* FAISS

---
## 4. Query Pipeline
Receives the user's question.
Then:
* Cleans the query
* Creates embeddings
* Searches the Vector Database
* Retrieves the most relevant chunks
This is the intelligence behind information retrieval.
---
## 5. Prompt Builder
The Prompt Builder combines:
* System Instructions
* Retrieved Context
* User Question

into a single prompt.

Example:
```text
System:
Answer only using the provided context.
Context:
Employees receive 20 days of annual leave.

Question:
How many leave days are provided?
```

The LLM never sees the entire document.
It only receives the relevant context.
---
## 6. Large Language Model (LLM)
The LLM does **not** search documents.
The LLM does **not** access SharePoint.
The LLM does **not** access databases.
Its only responsibility is:
* Read the prompt.
* Understand the context.
* Generate a natural language response.
This clear separation of responsibilities is fundamental to RAG architecture.
---
# Enterprise Example
Imagine an employee asks:
> "What is our travel reimbursement policy?"
### Step 1
The Query Pipeline searches the Vector Database.

### Step 2
The Vector Database returns:
* Travel Policy 2026
* Expense Guidelines
* Finance Handbook

### Step 3
The Prompt Builder creates:
```text
Context:
Travel expenses are reimbursed within 15 working days after approval.
Question:
What is our travel reimbursement policy?
```

### Step 4

The LLM generates:
> According to the Travel Policy 2026, approved travel expenses are reimbursed within **15 working days**.

Notice that the answer is based on retrieved evidence—not the model's memory.

---

# Architect's Insight
One of the biggest misconceptions is:
> "The LLM is the RAG system."
It isn't.
The LLM is **only one component**.

A production RAG system is actually a combination of:
* Document Management
* Information Retrieval
* Vector Search
* Prompt Engineering
* Large Language Models

Most of the engineering effort is spent **outside** the LLM.
This is why enterprise AI teams often invest more time building retrieval pipelines than selecting the model itself.
---

# Key Takeaways
* A RAG system consists of two major pipelines:
  * **Ingestion Pipeline**
  * **Query Pipeline**
* The Ingestion Pipeline prepares enterprise documents.
* The Query Pipeline retrieves relevant information for each user query.
* The LLM only generates responses—it does not perform document search.
* Separating responsibilities makes RAG systems scalable, maintainable, and production-ready.

---
# Interview Questions
### Q1. What are the two major pipelines in a RAG system?
**Answer**
The two major pipelines are the **Ingestion Pipeline**, which prepares and indexes enterprise documents, and the **Query Pipeline**, which retrieves relevant information and provides it to the LLM during inference.
---
### Q2. Why is the Ingestion Pipeline executed separately?
**Answer**
Because enterprise documents change much less frequently than user queries. Processing them once and storing searchable representations significantly improves performance, scalability, and cost efficiency.
---
### Q3. Does the LLM search the Vector Database?
**Answer**
No. The Query Pipeline retrieves relevant information from the Vector Database. The LLM only receives the retrieved context and generates the final response.
---
# Common Mistakes
* Thinking the LLM directly searches enterprise documents.
* Assuming the Vector Database replaces the LLM.
* Believing RAG is only about embeddings.
* Ignoring the importance of the Ingestion Pipeline.

---
Next Chapter

Now that we understand the overall architecture, the next logical question is:

How do raw enterprise documents become searchable?

In Chapter 4, we'll begin exploring the Ingestion Pipeline, starting with why document preparation is essential before any AI system can retrieve information.

