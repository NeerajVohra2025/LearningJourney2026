# Optimization Strategy 1 – Response Caching

Many users ask the same questions.

Example:

> How many annual leave days do employees receive?

Instead of generating the answer every time,

store the previous response.

```text id="q4b6na"
Question

↓

Cache

↓

Found?

↓

Yes

↓

Return Cached Response
```

No LLM call is needed.

---

## Benefits

* Lower latency
* Reduced LLM cost
* Better scalability

---

## Cache Invalidation

Suppose HR changes:

20 days

↓

25 days

The cached response becomes outdated.

The cache must be refreshed or invalidated after policy updates.

---

# Optimization Strategy 2 – Embedding Cache

Embedding generation also consumes time.

Suppose many users ask:

> Leave Policy

The query embedding can be cached.

```text id="j5v0qt"
Question

↓

Embedding Cache

↓

Vector Search
```

Repeated embedding generation is avoided.

---

# Optimization Strategy 3 – Vector Index Optimization

Searching millions of vectors efficiently requires optimized indexes.

Popular indexing techniques include:

* HNSW
* IVF
* Product Quantization (PQ)

Well-designed indexes reduce retrieval latency dramatically.

Example:

| Index       | Typical Characteristics                          |
| ----------- | ------------------------------------------------ |
| Brute Force | Highest accuracy, slowest                        |
| HNSW        | Excellent balance of speed and accuracy          |
| IVF         | Good for very large datasets                     |
| PQ          | Lower memory usage with some accuracy trade-offs |

---

# Optimization Strategy 4 – Metadata Filtering

Earlier chapters discussed metadata for security.

Metadata also improves performance.

Without filters:

```text id="n1y4sd"
Search

↓

100 Million Vectors
```

With filters:

```text id="7c2mpe"
Country = India

Department = HR

↓

Search

↓

500,000 Vectors
```

Searching a smaller subset is faster.

---

# Optimization Strategy 5 – Distributed Vector Databases

One server cannot store billions of vectors efficiently.

Enterprise systems distribute data.

```text id="5qz1uk"
Vector Database

        │

────────┼────────

│        │       │

Shard1  Shard2  Shard3
```

Each server stores only part of the data.

Queries execute across shards.

---

# What is Sharding?

Sharding means dividing data into smaller partitions.

Example:

| Shard   | Stores                |
| ------- | --------------------- |
| Shard 1 | HR Documents          |
| Shard 2 | Finance Documents     |
| Shard 3 | Engineering Documents |

Or

| Shard         | Stores    |
| ------------- | --------- |
| North America | Documents |
| Europe        | Documents |
| Asia          | Documents |

Benefits:

* Horizontal scalability
* Lower latency
* Higher availability

---

# Optimization Strategy 6 – Horizontal Scaling

Suppose one API server handles:

500 requests/second.

Traffic increases to:

5,000 requests/second.

Instead of buying one larger server,

add more servers.

```text id="v2s8fe"
API

↓

Server 1

Server 2

Server 3

Server 4
```

A Load Balancer distributes traffic.

This is called **Horizontal Scaling**.

---

# Vertical vs Horizontal Scaling

| Vertical Scaling | Horizontal Scaling           |
| ---------------- | ---------------------------- |
| Bigger server    | More servers                 |
| Limited growth   | Virtually unlimited growth   |
| Easier initially | Better long-term scalability |

Most enterprise AI systems favor horizontal scaling.

---

# Optimization Strategy 7 – GPU Acceleration

LLMs perform billions of mathematical operations.

CPUs can execute them,

but GPUs are designed for highly parallel computation.

Example:

```text id="r5n3cv"
CPU

↓

Sequential Processing

-------------------

GPU

↓

Thousands of Parallel Operations
```

This significantly reduces inference time for large models.

---

# Optimization Strategy 8 – Model Routing

Not every request needs the most powerful model.

Example:

| Request                 | Model      |
| ----------------------- | ---------- |
| Password Reset          | Small LLM  |
| HR FAQ                  | Medium LLM |
| Legal Contract Analysis | Large LLM  |

Routing requests to the appropriate model reduces cost while maintaining quality.

---

# Optimization Strategy 9 – Prompt Optimization

Long prompts increase:

* Token usage
* Cost
* Latency

Instead of sending:

20 retrieved chunks,

send:

Top 5.

Prompt optimization reduces inference time without sacrificing quality.

---

# Optimization Strategy 10 – Batch Processing

Suppose:

100 embedding requests arrive simultaneously.

Instead of processing them individually,

the system batches them.

```text id="f0y9we"
100 Requests

↓

Batch

↓

Embedding Model
```

Batching improves hardware utilization and throughput.

