Objective:
 Develop a RAG model
 Using LlamaIndex framework
 Using Huggingface embeddings
 Using Llama model access by GroQ cloud provider for LLMs
 Using FASIS vector database

Install Package: 
 llama-index
 llama-index-llms-groq (access the groq using llama index framework)
 llama-index-llms-ollama (access the llm using ollama as a local server)
 llama-index-vector-stores-faiss (for vector storage)
 llama-index-embeddings-huggingface (for convert into Embeddings)
 faiss-cpu 
 
GPTVectorIndex:

steps:
    LangChain                           llamaindex
 1- Load                                Very Easy
