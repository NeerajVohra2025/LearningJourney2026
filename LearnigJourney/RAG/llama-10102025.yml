 5- query                               query                                
 6- answer                              answer               
 
 
# Nodes:
  llama index divides documents into chunks
  this chunks called as Nodes
  each node have 
    id
    metadata
    embeddings
    text
    dir(index)===> index.index_struct.node_dict,index.index_struct.node_dict.keys()
    
   