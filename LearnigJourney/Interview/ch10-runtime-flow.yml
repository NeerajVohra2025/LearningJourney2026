The responsibilities are different
Google API Gateway (Infrastructure Layer):

This is not your application.

It handles:

API publishing
API Keys
OAuth/JWT validation
Rate limiting
Quotas
API Products
Request routing
CORS
WAF integration
Backend routing
Basic logging
Initial trace propagation (traceparent)
Forwarding headers to your backend

It does not know anything about:

RequestContext
BusinessContext
PolicyContext
AI Orchestrator
Agents
RAG
Enterprise AI


Enterprise AI Gateway (Application Layer):

Only after the request reaches your application does the Enterprise AI Gateway begin.

Its responsibilities are to:

Receive the normalized HTTP request from API Gateway
Read inbound headers (including traceparent, Authorization, X-Correlation-ID, etc.)
Extract or continue the distributed trace
Create the Root Application Span
Build the ObservabilityContext
Build the ExecutionContext
Build the SecurityContext
Resolve the PolicyContext
Build the BusinessContext
Assemble the immutable RequestContext
Validate the RequestContext
Forward it to the Responsible AI Pipeline

This distinction is one of the key principles of PD-HECA:

Google API Gateway is infrastructure. Enterprise AI Gateway is application.