genai-rca-platform/
├── config/           # External configuration (TOML files, environment overrides)
├── src/genai_rca/
│   ├── main.py       # Entry point (FastAPI app on Cloud Run)
│   ├── bootstrap.py  # Application assembly (Dependency Injection)
│   │
│   ├── core/         # Pure core (no cloud dependencies)
│   │   ├── application/   # Orchestrator, routing engine, use-case coordinators
