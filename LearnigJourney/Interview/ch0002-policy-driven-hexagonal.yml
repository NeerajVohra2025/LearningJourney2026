│   │   └── outbound/     # llm_port.py, logging_port.py, search_port.py, etc.
│   │
│   ├── adapters/     # Infrastructure implementations of ports
│   │   ├── inbound/      # FastAPI routes, middleware
│   │   └── outbound/     # GCP and external adapters:
│   │       ├── gcp/          
│   │       │   ├── vertex_ai/ (llm_adapter.py, eval_adapter.py, token_adapter.py)
│   │       │   ├── dlp_adapter.py
│   │       │   ├── model_armor_adapter.py
│   │       │   ├── logging_adapter.py
│   │       │   ├── bigquery_adapter.py
│   │       │   ├── search_adapter.py
│   │       │   └── secret_manager_adapter.py
│   │       ├── cache/ (redis_adapter.py)
│   │       └── external/ (servicenow_adapter.py)
│   │
│   ├── policy/       # Governance pipelines (input_policy_pipeline, output_policy_pipeline)
│   ├── observability/# Telemetry tools (tracing.py, metrics.py, logging.py wrappers)
│   ├── shared/       # Common utilities (constants.py, exceptions.py, utils.py)
│   └── tests/        # Unit and integration tests (core and adapters)
│
└── infra/           # Infrastructure as Code (Terraform for Cloud Run, IAM, Vertex, Monitoring)


Why This Architecture?:
| Capability           | Benefit                     |
| -------------------- | --------------------------- |
| Clean Architecture   | Business logic isolation    |
| Hexagonal            | Infrastructure independence |
| Dependency Injection | Easy testing                |
| Ports                | Technology abstraction      |
| Adapters             | Replaceable implementations |
| Policy Pipelines     | Enterprise AI Governance    |
| Evaluation           | Responsible AI              |
| Observability        | Production monitoring       |

Key Design Decisions:
| Decision                                | Rationale                               |
| --------------------------------------- | --------------------------------------- |
| Core has no GCP SDK                     | Maintain cloud independence             |
| Ports define contracts                  | Enable abstraction                      |
| Adapters implement infrastructure       | Improve replaceability                  |
| Bootstrap performs dependency injection | Centralized wiring                      |
| Policy layer outside core               | Separate governance from business logic |
| Evaluation after LLM                    | Ensure output quality                   |
| Observability as cross-cutting concern  | Full traceability                       |

