# 3. Step-by-Step Layer-by-Layer Explanation with GCP APIs and Methods

## 1. USER / EVENT LAYER

### Purpose

Trigger the system when something goes wrong.

### What Happens

- Monitoring detects an issue
- Incident is created

### APIs

#### ServiceNow

```http
POST /api/now/table/incident
```

#### Monitoring

- Grafana / Cloud Monitoring Alerts

> ✅ **No GCP GenAI APIs are used in this layer.**

---

## 2. FEDERATED IDENTITY & ZERO TRUST LAYER

### Purpose

Secure access without static credentials.

### Flow

#### Step 1 — Get JWT from IdP

```http
POST /oauth/token
```

#### Step 2 — Exchange JWT with GCP STS

```http
POST https://sts.googleapis.com/v1/token
```

### GCP API

**Security Token Service (STS)**

```text
sts.googleapis.com/v1/token
```

### Output

- ✅ Short-lived access token

---

---

## 3. EDGE / INBOUND LAYER

### Purpose

Entry point + Security + Tracing

### What Happens

- JWT validated
- Trace started
- Request passed to the system

### GCP / APIs

#### Apigee / API Gateway

#### Cloud Run (FastAPI)

### OpenTelemetry

```python
extract(headers)

tracer.start_as_current_span()

inject(headers)
```

---

# 4. INPUT POLICY PIPELINE (INPUT GOVERNANCE)

### Purpose

Make input safe before AI touches it.

### GCP APIs

#### 1. DLP (Sensitive Data Protection)

```python
from google.cloud import dlp_v2

client.inspect_content()
```

#### 2. Model Armor (Prompt Safety)

```http
POST ...:sanitizeUserPrompt
```

#### 3. Token Count (Cost Control)

```python
model.count_tokens(text)
```

#### 4. Context Cache (Vertex AI)

- Vertex AI Context Caching

### Output

- ✅ Safe, sanitized input

---

---

# 5. APPLICATION LAYER (CORE – FLOW CONTROL)

## Purpose

Control workflow (WHEN things happen)

### Components

- Orchestrator
- RoutingEngine

### APIs

- ❌ No GCP APIs
- ✅ Pure business logic

### Example

```python
logs = log_agent.analyze()

if routing.after_logs(logs) == "rca":
    rca = rca_agent.execute()
```

---

# 6. LOG ANALYZER AGENT

## Purpose

Fetch system logs

### GCP API

```python
from google.cloud import logging

logging.Client().list_entries()
```

### Or REST

```text
logging.googleapis.com/v2/entries:list
```

### Output

- ✅ Structured logs

---

---

# 7. RCA AGENT (DOMAIN – INTELLIGENCE PIPELINE)

> This is the heart of the system.

## 7.1 Evidence Layer

### Purpose

Collect all facts.

### GCP APIs

#### Cloud Logging *(for runtime logs)*

```python
logging.Client().list_entries()
```

#### Vertex AI Search *(for runbooks and documents)*

```python
search_client.search(query)
```

#### BigQuery *(for historical RCA)*

```python
bigquery.Client().query(sql)
```

### Output

```text
evidence = logs + docs + history
```

---

## 7.2 Grounding (PRE-LLM)

### Purpose

Prevent hallucination.

### What Happens

```text
prompt = "Use ONLY this evidence: {evidence}"
```

### APIs

- ❌ No GCP API
- ✅ Pure domain logic

---

## 7.3 LLM (VERTEX AI GEMINI)

### Purpose

Generate RCA.

### GCP API

```python
from vertexai.generative_models import GenerativeModel

model.generate_content(prompt)
```

### Output

- ❌ Raw LLM response

---

---

## 7.4 OUTPUT SAFETY PIPELINE (CRITICAL)

### Purpose

Make output safe.

### GCP APIs

#### Model Armor (Response)

```http
POST ...:sanitizeModelResponse
```

#### Optional DLP

```python
dlp.inspect_content()
```

### Output

- ✅ Safe response

---

## 7.5 CITATION

### Purpose

Attach evidence references.

Every output must reference **logs, documents, and history**. Citation makes the RCA explainable by attaching evidence.

### APIs

- ❌ No GCP API
- ✅ Domain logic

---

## 7.6 EVALUATION (VERTEX AI EVALTASK)

### Purpose

Validate correctness.

### Steps + APIs

#### Build Dataset

```python
pandas.DataFrame([...])
```

#### Define Metrics

```python
PointwiseMetric(...)
```

#### Run EvalTask

```python
from vertexai.evaluation import EvalTask

eval_task = EvalTask(dataset, metrics)
eval_task.evaluate()
```

### Output

```json
{
  "grounding_score": 0.9,
  "hallucination_risk": 0.1,
  "actionability_score": 0.85
}
```

---

