# ✅ CLEAN MAPPING

| Responsibility | GCP Service / Component |
|----------------|-------------------------|
| Input Safety | DLP + Model Armor |
| Reasoning | Vertex AI Gemini |
| Output Safety | Model Armor |
| Validation | EvalTask |
| Decision | RoutingEngine |
| Execution | Agents |

---

# Final Normalized Sequence (SSOT)

1. **User/Event**
   - Grafana / ServiceNow incident creation

2. **Identity**
   - JWT + GCP STS short-lived token

3. **Edge / Inbound**
   - API Gateway + Cloud Run Gateway

4. **Input Policy Pipeline**
   - DLP
   - `sanitizeUserPrompt`
   - `count_tokens`
   - Context Cache

5. **Orchestrator**
   - Start workflow

6. **RoutingEngine**
   - `after_logs()`

7. **LogAnalyzerAgent**
   - Cloud Logging

8. **RCAAgent**
   1. **Evidence**
      - Cloud Logging
      - Vertex AI Search
      - BigQuery
   2. **Grounding**
      - Build evidence-only prompt
   3. **LLM**
      - `generate_content()`
   4. **Output Safety**
      - `sanitizeModelResponse`
      - Optional DLP output scan
   5. **Citation**
      - Attach evidence sources
   6. **Evaluation**
      - `EvalTask.evaluate()`

9. **RoutingEngine**
   - `after_rca()`

10. **Execution**
    - ActionAgent
    - IncidentAgent
    - HITL Tool

11. **Observability + Audit**
    - Cloud Trace
    - Cloud Logging
    - Monitoring
    - BigQuery
    
    