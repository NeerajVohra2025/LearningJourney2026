External Systems
(ServiceNow, Web, Mobile, APIs)
              │
              ▼
──────────────────────────────────────────────
Infrastructure Boundary
──────────────────────────────────────────────

Google API Gateway
(Google Managed Service)

              │
              ▼

══════════════════════════════════════════════
Application Boundary
══════════════════════════════════════════════

Enterprise AI Gateway
(Enterprise Ingress Layer)

              │
              ▼

Responsible AI Input Pipeline

