AI Orchestrator

              │
              ▼

Agent Runtime

              │
              ▼

Vertex AI Adapter

              │
              ▼

Vertex AI

The most important transition occurs at the Application Boundary.:
Everything above the boundary belongs to platform infrastructure or external systems.
Everything below the boundary belongs to the Enterprise AI Platform.
The Enterprise AI Gateway is the bridge between these two worlds.

Why Is It Called the Enterprise Ingress Layer?:
The term ingress means the point where something enters a system.
In networking, ingress refers to packets entering a network.
In Kubernetes, an Ingress manages incoming traffic.
In PD-HECA, the Enterprise Ingress Layer represents the point where external requests first enter the enterprise application.
This layer is responsible for converting an external HTTP request into a standardized enterprise request.
It is not responsible for business processing or AI execution.

Enterprise AI Gateway vs Google API Gateway:
These two components are often confused because both receive incoming requests.
However, they solve completely different problems.
| Google API Gateway                | Enterprise AI Gateway                      |
| --------------------------------- | ------------------------------------------ |
| Infrastructure-managed service    | Application-owned component                |
| Receives external HTTP traffic    | Receives authenticated enterprise requests |
| Routing and API exposure          | Enterprise request initialization          |
| Authentication and API protection | Enterprise context creation                |
| Rate limiting and quotas          | Policy resolution                          |
| API key and OAuth validation      | Request standardization                    |
| Network boundary                  | Application boundary                       |


Principal Architect Rule:
Google API Gateway protects the platform. The Enterprise AI Gateway prepares the request for the platform.
These responsibilities complement each other rather than overlap.

What Does the Enterprise AI Gateway Produce?:
The gateway does not produce business results.
It produces a standardized Enterprise Request.
Conceptually, the transformation looks like this:
Incoming HTTP Request

        │

        ▼

Enterprise AI Gateway

        │

        ▼

Enterprise Request
(RequestContext)

        │

        ▼

Responsible AI Pipeline

Every downstream component receives the same trusted request format.
This consistency eliminates duplicated initialization logic across the platform.

