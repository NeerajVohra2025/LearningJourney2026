| Agent Runtime                 | Execute agents and tools                                     |
| Vertex AI Adapter             | Communicate with Vertex AI                                   |
| Domain Services               | Execute business logic                                       |
Each component has a unique purpose, reducing duplication and simplifying maintenance.

