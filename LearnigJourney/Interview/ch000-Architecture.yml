Google Vertex AI APIs and GCP Services:
| Architecture Component | Google Cloud Service / API                                                       |
| ---------------------- | -------------------------------------------------------------------------------- |
| Identity Federation    | Google Cloud Identity (optional), Workforce Identity Federation, or external IdP |
| API Gateway            | Apigee X or API Gateway                                                          |
| JWT Validation         | API Gateway / Apigee JWT policies                                                |
| Policy Engine          | Custom PDP, Open Policy Agent (OPA), or IAM Conditions                           |
| Prompt Protection      | Vertex AI Model Armor API                                                        |
| PII Detection          | Cloud DLP API                                                                    |
| Orchestrator           | LangGraph, Google ADK, or OpenAI Agents SDK running on Cloud Run / GKE           |
| Semantic Cache         | Memorystore (Redis) or Vertex AI Context Cache where applicable                  |
| Memory Store           | Redis, Firestore, AlloyDB, or Spanner                                            |
| Tool Layer             | MCP servers hosted on Cloud Run or GKE                                           |
| Log Retrieval          | Cloud Logging API                                                                |
| Trace Retrieval        | Cloud Trace API                                                                  |
| Metrics                | Cloud Monitoring API                                                             |
| Historical Data        | BigQuery API                                                                     |
| Knowledge Base         | Vertex AI Search / Vector Search                                                 |
| Grounding              | Vertex AI RAG Engine / Vertex AI Search                                          |
| Prompt Builder         | Custom application layer                                                         |
| LLM                    | Vertex AI Generative AI API (`generateContent`)                                  |
| Function Calling       | Gemini function calling / tool calling                                           |
| Output Protection      | Vertex AI Model Armor API                                                        |
| Sensitive Data Check   | Cloud DLP API                                                                    |
| Evaluation             | Vertex AI Evaluation service (or custom evaluation pipeline)                     |
| Incident Update        | ServiceNow REST Table API / Incident API                                         |
| Observability          | OpenTelemetry + Cloud Logging + Cloud Trace + Cloud Monitoring                   |
| Audit                  | Cloud Audit Logs                                                                 |
                  
                  
                  
