Create Root Context:
class TraceContext:

    def create_headers(
        self,
        correlation_id,
        incident_id,
    ):

        headers = {}

        inject(headers)

        headers["x-correlation-id"] = correlation_id

        headers["x-incident-id"] = incident_id

        return headers
        
