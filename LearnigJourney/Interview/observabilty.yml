Standard Span Attributes:

Every span should include a common set of attributes to ensure consistent analysis.
| Category     | Attributes                                                                                      |
| ------------ | ----------------------------------------------------------------------------------------------- |
| Business     | `incident_id`, `correlation_id`, `tenant_id`, `user_id`                                         |
| Architecture | `layer`, `component`, `agent`, `workflow`                                                       |
| AI           | `model`, `temperature`, `token_input`, `token_output`, `grounding_score`, `hallucination_score` |
| GCP          | `gcp.service`, `gcp.method`, `project_id`, `region`                                             |
| Performance  | `latency_ms`, `retry_count`, `cache_hit`                                                        |
| Security     | `policy_result`, `dlp_findings`, `model_armor_action`                                           |



       
