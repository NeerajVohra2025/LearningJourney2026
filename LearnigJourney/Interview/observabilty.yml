My Recommendation

I would not combine root-span creation, header injection, and child-span creation into a single utility. Instead, I would define two explicit responsibilities:

TraceContext: owns trace creation and propagation. It creates the root span context at the Logical Gateway, injects traceparent, tracestate, x-correlation-id, and x-incident-id into the outgoing headers, and is used only at service boundaries.
Observer: owns span lifecycle. It extracts the propagated context from headers, creates child spans, enriches them with attributes, records exceptions, and updates span status. It is injected into the Policy Pipeline, Application Layer, Domain Layer, Agents, and Adapters.