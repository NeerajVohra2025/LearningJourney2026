Chapter 3.16:
Runtime Step 11 – Forward Request to the Enterprise Application Layer:
Crossing the Boundary Between Infrastructure and Business Execution

Architecture Principle:

The Enterprise AI Gateway prepares the request but never executes business logic. Its final responsibility is to hand over a validated RequestContext to the Enterprise Application Layer.

This handoff represents one of the most important architectural boundaries in PD-HECA.

It marks the point where infrastructure preparation ends and business execution begins.

Introduction:

The Enterprise AI Gateway has completed all of its responsibilities.

It has:

Received the HTTP request.
Extracted the distributed trace.
Created the Root Application Span.
Built the enterprise contexts.
Aggregated the RequestContext.
Validated the RequestContext.

At this point, the request is ready for execution.

The gateway does not:

execute AI workflows,
invoke LLMs,
call vector databases,
execute agents,
perform RAG,
apply business rules.

Instead, it forwards the validated RequestContext to the Enterprise Application Layer.


Where Does the Gateway End?:

The Enterprise AI Gateway owns the Enterprise Ingress Layer.

Client
    │
Google API Gateway
    │
Cloud Run
    │
FastAPI
    │
Enterprise AI Gateway
────────────────────────────────────────
Application Boundary
────────────────────────────────────────
Responsible AI Pipeline
AI Orchestrator
Agent Runtime
RAG Engine
Tool Executor
Model Adapter

Everything above the boundary belongs to infrastructure preparation.

Everything below the boundary belongs to application execution.

What Is Actually Forwarded?:

Many architectures accidentally forward infrastructure objects.

For example:
HTTP Request

↓

JWT

↓

Headers

↓

FastAPI Request

↓

Cloud SDK Objects

PD-HECA does not forward any of these.:

Instead, only one object crosses the boundary.:
RequestContext
Nothing else.


Why Only the RequestContext?:

Because the application should never know:

which API framework received the request,
which cloud platform hosted the service,
how authentication was performed,
how traces were extracted,
how headers were propagated.

Those concerns belong to the Enterprise AI Gateway.

The application receives only enterprise concepts.


Runtime Sequence:
Enterprise AI Gateway

        │
        ▼

Validated RequestContext

        │
        ▼

Application Boundary

        │
        ▼

Responsible AI Pipeline

This is the only transition between the Enterprise Ingress Layer and the Enterprise Application Layer.

Why Doesn't the Gateway Call the LLM?:

Because that would violate separation of responsibilities.:

The Enterprise AI Gateway exists to prepare the request.

The AI Orchestrator exists to execute AI workflows.

The Model Adapter exists to invoke models.

The Prompt Service exists to build prompts.

The Responsible AI Pipeline exists to enforce AI governance.

Mixing these responsibilities produces an oversized gateway that becomes difficult to maintain and evolve.

Request Ownership:

An important architectural question is:

Who owns the RequestContext after it crosses the boundary?

The answer is:

The Enterprise Application Layer.

However:

Ownership of execution does not imply ownership of modification.

The RequestContext remains immutable.

Application components consume it but never change it.


Enterprise Boundary Contract:

The architectural contract can be summarized as follows.
Enterprise AI Gateway

INPUT

HTTP Request

OUTPUT

Validated RequestContext

──────────────────────────

Enterprise Application Layer

INPUT

Validated RequestContext

OUTPUT

Business Result

Neither side depends on the implementation details of the other.

This preserves loose coupling.


Runtime Flow:
Validate RequestContext

        │
        ▼

Freeze RequestContext

        │
        ▼

Forward RequestContext

        │
        ▼

Responsible AI Pipeline

        │
        ▼

Gateway Responsibilities Complete

At this point, the Enterprise AI Gateway becomes passive.

It waits for the application to return a response.

