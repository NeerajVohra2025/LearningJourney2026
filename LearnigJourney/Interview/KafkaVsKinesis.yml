    🧠 Kafka vs RabbitMQ — Step-by-Step    
        First: What Problem Do They Solve?
        Kafka and RabbitMQ both:
            Move data from Producer → Consumer
            Decouple systems
            Handle asynchronous communication
        But they are built for very different purposes. 
        
        Core Philosophy (Most Important Difference):
            | Aspect       | Kafka                           | RabbitMQ                                   |
            | ------------ | ------------------------------- | ------------------------------------------ |
            | Core idea    | **Distributed event streaming** | **Message broker / queue**                 |
            | Data mindset | **Data stream (log)**           | **Message delivery**                       |
            | Retention    | Messages are **stored**         | Messages are **deleted after consumption** |
            | Replay       | ✅ Yes                           | ❌ No (by default)                        |
            
            👉 Architect view:
                Kafka = data pipeline
                RabbitMQ = message delivery system
                
        Simple Analogy (Easy to Remember):
                Kafka:
                📺 YouTube
                    Videos stay available
                    Many people can watch later
                    You can replay anytime
 
                RabbitMQ:
                📬 Courier service
                    Message is delivered once
                    After delivery → gone        
                    
        Message Consumption Model:
                Kafka (Pull Model):
                    Consumer asks for messages
                    Controls speed
                    Can pause, rewind, replay

                RabbitMQ (Push Model):
                    Broker pushes messages
                    Consumer must keep up
                    Backpressure is harder

                👉 Kafka is safer for bursty traffic        
