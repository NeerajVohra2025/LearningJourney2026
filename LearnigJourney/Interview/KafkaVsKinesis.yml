    🧠 AWS SNS vs AWS SQS — Step-by-Step:
          First: What Problem Do They Solve?
          Both SNS and SQS help you:
            Decouple applications
            Send messages between systems
            Build scalable, reliable architectures
            But they solve different communication patterns.
            
          Core Philosophy (Biggest Difference):
            | Aspect          | SNS                             | SQS                                     |
            | --------------- | ------------------------------- | --------------------------------------- |
            | Core idea       | **Message broadcast (fan-out)** | **Message queue (work distribution)**   |
            | Communication   | **One-to-many**                 | **One-to-one / one-consumer-at-a-time** |
            | Delivery style  | Push                            | Pull                                    |
            | Message storage | Temporary                       | Durable until processed                 |
            
        👉 Architect view:
            SNS = Notification service
            SQS = Work queue    
            
        👉 Simple Analogy (Very Easy):  
            📢 SNS (Public Announcement System)
                Announcement is made once
                Everyone listening hears it
                Each listener acts independently       
            📥 SQS (Inbox / Task List)
                Message sits in a queue
                One worker picks it up
                After processing → message removed      

        👉 Architecture Difference (Step by Step):
            🧩 SNS Architecture
                        Publisher → SNS Topic → Subscribers
                    Subscribers can be:
                            SQS
                            Lambda
                            HTTP/HTTPS
                            Email / SMS 
                    📌 SNS does NOT wait for processing.        
            
            🧩 SQS Architecture
                    Producer → SQS Queue → Consumer
                        Message stays in queue
                        Consumer pulls message
                        Consumer deletes after success

        👉 Message Delivery Model:
            SNS (Push):
                SNS pushes message to subscribers
                Fast fan-out
                No backpressure control
            SQS (Pull):
                Consumers pull messages
                Consumer controls speed
                Handles spikes well    
                
        👉 Message Retention & Replay  :
                | Feature     | SNS                 | SQS                      |
                | ----------- | ------------------- | ------------------------ |
                | Retention   | Short (best-effort) | Up to 14 days            |
                | Replay      | ❌ No                | ✅ Yes (within retention) |
                | Persistence | Limited             | Strong                   |
                
            👉 If processing fails, SQS can retry.
            👉 SNS alone cannot.    
            
        👉 Fan-Out Pattern (Very Important): 
                SNS:
                    Native fan-out
                    One message → many subscribers
                SQS:
                    No native fan-out
                    Each queue receives messages independently        
                            
        👉 Failure Handling :
            SNS:
                If subscriber is down → message may be lost
                Retry policy exists, but limited      
            SQS:
                Message reappears if consumer fails
                Visibility timeout prevents duplicates
                Dead-Letter Queue (DLQ) support        
                
        👉 Throughput & Scale:
            SNS:
                Extremely high throughput
                Ideal for notifications

            SQS:
                Very high throughput
                Scales automatically
                FIFO has limits (lower throughput)        
                
        👉 SNS + SQS Together (Most Common Pattern)
            Architecture Pattern:
                        Producer
                           ↓
                         SNS Topic
                           ↓        ↓        ↓
                         SQS A    SQS B    Lambda
                         
            Why this is powerful:
                SNS broadcasts
                SQS ensures durability
                Each consumer processes independently
                Failures don’t affect others

            👉 This is the recommended enterprise pattern.             
        
        
        
        👉 Decision Matrix (Architect Cheat Sheet)
                
                | Requirement           | Choose    |
                | --------------------- | --------- |
                | Fan-out               | SNS       |
                | Guaranteed processing | SQS       |
                | Decouple workloads    | SQS       |
                | Notify many services  | SNS       |
                | Buffer traffic spikes | SQS       |
                | Event + reliability   | SNS + SQS |
                
                    
        🔹 Difference Between EventBridge, SNS, and SQS
                EventBridge → Event routing & orchestration
                SNS → Message broadcasting (fan-out)
                SQS → Reliable message processing (queue)
                
        🔹 Comparison Table (Interview Friendly)
                | Aspect          | EventBridge             | SNS           | SQS                   |
                | --------------- | ----------------------- | ------------- | --------------------- |
                | Core role       | Event bus               | Pub/Sub       | Queue                 |
                | Pattern         | Event-driven            | One-to-many   | One-to-one            |
                | Delivery        | Push                    | Push          | Pull                  |
                | Message storage | Short (24 hrs)          | No            | Yes (up to 14 days)   |
                | Replay          | ❌                       | ❌             | ✅                 |
                | Filtering       | Advanced (JSON rules)   | Basic         | ❌                    |
                | Fan-out         | ✅ (rule-based)          | ✅ (native)    | ❌                 |
                | Buffering       | ❌                       | ❌             | ✅                 |
                | Best for        | Routing & orchestration | Notifications | Background processing |

        🔹 When to Use What (Very Short)
                Use EventBridge → AWS events, orchestration, smart routing
                Use SNS → Alerts, notifications, broadcasting
                Use SQS → Reliable processing, buffering, retries
                
        🔹 Common Enterprise Pattern:        
        
                        Producer
                           ↓
                         EventBridge Bus
                           ↓ (rules + filters)
                         Lambda / Step Functions / API / SQS
                    EventBridge matches events to rules
                    Routes events automatically
                    No polling, no fan-out infra to manage
                    
                        EventBridge
                           ↓
                         SNS
                           ↓
                         SQS
                    