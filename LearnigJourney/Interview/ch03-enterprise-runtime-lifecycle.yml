Chapter 3.11:
Runtime Step 6 – Build SecurityContext
Establishing the Identity and Trust Model for Enterprise Requests

Architecture Principle:
Every enterprise request must have a verified security identity before authorization, policy evaluation, or business processing begins.

Authentication proves who the caller is.

The Enterprise AI Gateway transforms that identity into a reusable SecurityContext that every downstream component can trust.

Introduction:

When the request entered the Enterprise AI Platform, Google API Gateway had already performed infrastructure-level authentication.

Depending on the organization's security architecture, it may have validated:

OAuth 2.0
OpenID Connect (OIDC)
JWT Access Tokens
API Keys
Mutual TLS (mTLS)
Google Cloud IAM Identity Tokens

This means the request is authenticated.

However, authentication alone is not enough.

The Enterprise AI Platform still needs a standardized representation of the caller's identity.

Rather than forcing every downstream component to repeatedly inspect tokens and decode claims, the Enterprise AI Gateway creates a SecurityContext once and shares it throughout the request lifecycle.

Authentication vs Authorization:

One of the most common misunderstandings in enterprise architecture is confusing authentication with authorization.

They answer two different questions.

| Authentication                                      | Authorization                      |
| --------------------------------------------------- | ---------------------------------- |
| Who are you?                                        | What are you allowed to do?        |
| Identity verification                               | Permission evaluation              |
| Performed before application processing             | Performed using application rules  |
| Usually handled by Identity Provider or API Gateway | Usually handled by the application |


The Enterprise AI Gateway assumes authentication has already occurred.

Its responsibility is to establish the application's trusted security identity.


Why Build a SecurityContext?:

Imagine the following services:
Responsible AI Pipeline

↓

AI Orchestrator

↓

Agent Runtime

↓

Prompt Service

↓

Policy Engine

↓

Vertex AI Adapter

Without a SecurityContext, every service would need to:

Read the Authorization header.
Decode the JWT.
Validate token claims.
Extract user information.
Determine tenant information.
Determine user roles.
Determine scopes.

This creates duplicated security logic throughout the platform.

Instead, the Enterprise AI Gateway performs this work once.

Runtime Sequence:
Receive HTTP Request
        │
        ▼
Authentication Completed
(Google API Gateway)
        │
        ▼
Read Identity Information
        │
        ▼
Extract User Claims
        │
        ▼
Extract Tenant Information
        │
        ▼
Extract Roles & Permissions
        │
        ▼
Create SecurityContext

Notice that the gateway is not authenticating the user.:

It is transforming an authenticated identity into a reusable enterprise object.

What Information Does the SecurityContext Contain?

A typical SecurityContext contains:
Authenticated Principal
User Identifier
Subject (sub)
Organization
Tenant ID
Roles
Groups
Permissions (or Scopes)
Authentication Method
Token Issuer
Token Expiration
Trust Level

The exact fields depend on the organization's identity provider, but the goal is always the same:

Represent the authenticated caller in a consistent, platform-wide format.


SecurityContext Model:
SecurityContext
│
├── Principal
├── User ID
├── Subject
├── Tenant ID
├── Organization
├── Roles
├── Groups
├── Permissions
├── Authentication Method
├── Token Issuer
├── Token Expiration
└── Trust Level

This object becomes part of the final RequestContext
Why Doesn't Every Service Read the JWT?:

Because doing so creates several architectural problems:

Duplicate token parsing.
Inconsistent authorization logic.
Increased coupling to the identity provider.
Harder testing.
Greater security risk due to repeated token handling.

Instead, downstream components receive a trusted SecurityContext.

They no longer need to understand OAuth, JWT, or identity provider-specific details.

Technology Card:
| Category                | Technology                                           |
| ----------------------- | ---------------------------------------------------- |
| Identity Standard       | OAuth 2.0                                            |
| Authentication Protocol | OpenID Connect (OIDC)                                |
| Token Format            | JWT                                                  |
| Identity Provider       | Google Cloud IAM / Entra ID / Okta / Auth0 (example) |
| Security Library        | Google Auth / PyJWT (depending on implementation)    |
| Authorization Model     | RBAC / ABAC                                          |

The Enterprise AI Gateway abstracts these technologies behind a common SecurityContext, ensuring downstream components remain independent of any specific identity provider.

Runtime Card:
| Stage      | Description                                            |
| ---------- | ------------------------------------------------------ |
| Input      | Authenticated HTTP request                             |
| Processing | Extract identity claims and create the SecurityContext |
| Output     | Immutable SecurityContext                              |

Sequence Card:
Build ExecutionContext
        │
        ▼
Build SecurityContext
        │
        ▼
Resolve PolicyContext

The SecurityContext provides the identity information required for policy evaluation in the next runtime step.

Principal Architect Insight:

A common anti-pattern is allowing every microservice to parse JWTs independently. This leads to duplicated security logic, inconsistent role interpretation, and tight coupling to a particular identity provider.

The Enterprise AI Gateway avoids this by transforming the authenticated request into a normalized SecurityContext at the application boundary. From that point onward, downstream components work with a trusted identity model rather than raw authentication tokens.

This design also future-proofs the platform. If the organization migrates from one identity provider to another—for example, from Okta to Microsoft Entra ID—only the Enterprise AI Gateway requires modification. The rest of the platform continues to consume the same SecurityContext without change.

Chapter Summary:

In this chapter, we created the SecurityContext, the enterprise representation of the authenticated caller. We distinguished authentication from authorization and explained why the Enterprise AI Gateway centralizes identity extraction instead of allowing every downstream service to parse authentication tokens independently.

The SecurityContext now provides the trusted identity information required for the remainder of the request lifecycle.

At this stage, the Enterprise AI Gateway has established:

ObservabilityContext – How do we observe this request?
ExecutionContext – Where and how is this request executing?
SecurityContext – Who is making this request?

These three contexts form the foundation for the next stage: determining which enterprise policies apply.

