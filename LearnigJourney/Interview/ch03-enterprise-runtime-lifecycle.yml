Only after all validation stages succeed does the request proceed.

Validation Categories:
| Validation               | Purpose                                 |
| ------------------------ | --------------------------------------- |
| Structural Validation    | Verify required contexts exist          |
| Schema Validation        | Verify required fields                  |
| Cross-Context Validation | Verify contexts agree with each other   |
| Enterprise Validation    | Verify governance requirements          |
| Business Validation      | Verify supported business capability    |
| Runtime Validation       | Verify deployment/runtime compatibility |
Each category protects a different aspect of the platform.

Validation vs Business Rules:
This distinction is essential.
| RequestContext Validation                  | Business Validation                        |
| ------------------------------------------ | ------------------------------------------ |
| Ensures the execution contract is complete | Ensures the business request is acceptable |
| Performed by the Enterprise AI Gateway     | Performed by application services          |
| Validates enterprise contexts              | Validates business rules                   |
| Runs before application execution          | Runs during business execution             |


For example:

The gateway validates:

Tenant exists.
Workflow exists.
Required policy exists.

The application validates:

Customer account is active.
Incident exists.
Contract is eligible.
User may submit a reimbursement request.

These belong to different architectural layers.

Failure Handling:

If validation fails:
RequestContext

↓

Validation Failed

↓

Return Enterprise Error

↓

Do NOT enter Application Layer
The Responsible AI Pipeline, AI Orchestrator, Agent Runtime, and adapters never see an invalid RequestContext.

This protects the core application from incomplete or inconsistent requests.

