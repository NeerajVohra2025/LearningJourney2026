Chapter 3.10:
Runtime Step 5 – Build ExecutionContext:
Establishing the Runtime Environment for Enterprise Processing
Receive HTTP Request
        │
Extract Trace Context
        │
Create Root Span
        │
Build ObservabilityContext
        │
Build ExecutionContext
        │
Build SecurityContext
        │
Build PolicyContext
        │
Build BusinessContext
        │
Aggregate RequestContext


Architecture Principle:

Every enterprise request must execute within a well-defined runtime environment. The ExecutionContext captures where, how, and under which runtime conditions the request is being processed.

Unlike the ObservabilityContext, which focuses on monitoring and diagnostics, the ExecutionContext describes the runtime environment itself.

It provides downstream components with consistent execution metadata without requiring them to query the underlying infrastructure.


Introduction:

At this point in the request lifecycle, the Enterprise AI Gateway has already established the platform's observability foundation.

The platform now knows:

The request has entered the application.
The distributed Trace Context has been extracted.
A Root Application Span is active.
The ObservabilityContext has been created.

However, downstream components still lack information about where and how the request is executing.

For example:

Which environment is processing the request?
Which region is serving the request?
Which application version is running?
Which deployment instance received the request?
Which runtime generated this response?

These details are not part of observability; they describe the execution environment.

To provide this information consistently, the Enterprise AI Gateway creates an ExecutionContext.


What Is an ExecutionContext?:

The ExecutionContext is a reusable object that describes the runtime environment in which the current request is executing.

Unlike the ObservabilityContext, which helps engineers understand what happened, the ExecutionContext helps the application understand where and how it is running.

Every downstream component receives the same execution information without directly accessing platform-specific APIs.


Why Do We Need an ExecutionContext?:

Imagine the same AI platform is deployed in multiple environments.
Production
│
├── us-central1
├── europe-west1
└── asia-south1

Staging
│
└── us-central1

Development
│
└── Local Docker


A request processed in one environment may behave differently from a request processed in another.

Examples include:

Different feature flags.
Different model versions.
Different compliance requirements.
Different infrastructure resources.
Different deployment strategies.

Without a shared ExecutionContext, every service would independently determine its runtime environment, leading to duplicated logic and inconsistent behavior.


What Information Does the ExecutionContext Contain?:

A typical ExecutionContext includes:

Environment (Development, Test, Staging, Production)
Cloud Provider
Cloud Region
Deployment Platform
Service Name
Service Version
Deployment Revision
Runtime Instance Identifier
Processing Start Time
Runtime Configuration

These values describe the execution environment rather than the request itself.


Runtime Sequence:
Receive HTTP Request
        │
        ▼
Extract Trace Context
        │
        ▼
Create Root Span
        │
        ▼
Build ObservabilityContext
        │
        ▼
Read Runtime Configuration
        │
        ▼
Collect Deployment Metadata
        │
        ▼
Create ExecutionContext


The Enterprise AI Gateway reads runtime metadata from the hosting platform and configuration sources, then packages it into a reusable object.

ObservabilityContext vs ExecutionContext:

These two contexts are closely related but serve different purposes.

| ObservabilityContext                   | ExecutionContext                                       |
| -------------------------------------- | ------------------------------------------------------ |
| Focuses on monitoring and diagnostics. | Focuses on the runtime environment.                    |
| Contains Trace ID and Correlation ID.  | Contains environment and deployment metadata.          |
| Used for tracing and logging.          | Used for runtime behavior and configuration decisions. |
| Shared with monitoring systems.        | Shared with application components.                    |

Keeping these concerns separate results in a cleaner design and makes each context easier to evolve independently.

ExecutionContext Model

Conceptually, the ExecutionContext looks like this:
ExecutionContext
│
├── Environment
├── Cloud Provider
├── Region
├── Platform
├── Service Name
├── Service Version
├── Deployment Revision
├── Runtime Instance
├── Processing Timestamp
└── Runtime Configuration

This object becomes part of the final RequestContext.

Technology Card:
| Category                 | Technology                 |
| ------------------------ | -------------------------- |
| Runtime Platform         | Google Cloud Run           |
| Configuration            | Environment Variables      |
| Service Metadata         | Cloud Run Runtime Metadata |
| Configuration Management | Pydantic Settings          |
| Dependency Injection     | FastAPI Dependencies       |
The Enterprise AI Gateway should isolate platform-specific details within the ExecutionContext so that downstream services remain infrastructure-agnostic.

Runtime Card:
| Stage      | Description                              |
| ---------- | ---------------------------------------- |
| Input      | Active request and runtime configuration |
