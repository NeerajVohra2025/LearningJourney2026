Chapter 3.8:
Runtime Step 3 – Create Root Application Span:
Recording the Enterprise AI Gateway's Work


Architecture Principle:
Every application-owned component should record its work within a span so that the complete lifecycle of a request can be observed across the enterprise platform.

A distributed trace tells us which transaction is being processed.

A span tells us what work a specific component performed within that transaction.

After extracting the distributed Trace Context, the Enterprise AI Gateway becomes an active participant by creating its own application span.

Introduction:

In the previous runtime step, the Enterprise AI Gateway extracted the incoming Trace Context.

At this point, the gateway knows:

The Trace ID.
Whether the request belongs to an existing distributed transaction.
The Parent Span ID (if present).
Whether a new trace must be created.

However, the gateway has not yet recorded any work.

Observability systems know that a trace exists, but they do not yet know what the Enterprise AI Gateway is doing.

To record its work, the gateway creates its own Root Application Span.

This span measures everything performed inside the Enterprise AI Gateway and becomes the parent span for all internal operations executed during request processing.


What Is a Span?:

A Span represents a single unit of work performed by a component.

It records:

When the work started.
When the work finished.
How long it took.
Whether it succeeded or failed.
Important attributes describing the work.
Any errors or exceptions that occurred.

If a distributed trace is the entire journey, a span is one stop along that journey.


Trace vs Span:

A common source of confusion is the relationship between a Trace and a Span.
| Distributed Trace                           | Span                                             |
| ------------------------------------------- | ------------------------------------------------ |
| Represents the complete end-to-end request. | Represents one unit of work within that request. |
| Shared by all participating services.       | Owned by a single component or operation.        |
| Identified by a Trace ID.                   | Identified by a Span ID.                         |
| May contain many spans.                     | Belongs to exactly one trace.                    |


Think of it this way:
Distributed Trace
│
├── Google API Gateway Span
│
├── Enterprise AI Gateway Span
│      ├── Build Context Span
│      ├── Resolve Policy Span
│      └── Validate Request Span
│
├── Responsible AI Pipeline Span
│
├── AI Orchestrator Span
│
└── Vertex AI Adapter Span

One trace contains many spans, each describing the work performed by a specific component.


Why Create the Root Application Span?

The Enterprise AI Gateway performs several operations after receiving the request:

Build enterprise contexts.
Resolve policies.
Validate the request.
Initialize logging.
Propagate headers.
Forward the request.

Rather than creating unrelated spans, the gateway first creates a Root Application Span that represents the entire lifecycle of the gateway itself.

Every subsequent operation becomes a child of this root span.

This hierarchical structure makes traces easier to understand and analyze.


Runtime Sequence:
Receive HTTP Request
        │
        ▼
Extract Trace Context
        │
        ▼
Create Root Application Span
        │
        ▼
Enterprise AI Gateway Runtime
        │
        ├── Build ObservabilityContext
        ├── Build ExecutionContext
        ├── Build SecurityContext
        ├── Resolve PolicyContext
        ├── Build BusinessContext
        └── Build RequestContext
        
The Root Application Span remains active while the Enterprise AI Gateway performs its work.

When the gateway finishes processing the request, the span is closed, recording the total execution time.

What Information Does the Root Span Capture?:

The Root Application Span typically records:

Gateway name.
Service name.
Service version.
Deployment environment.
HTTP method.
HTTP route.
Request protocol.
Processing duration.
Response status.
Error information (if any).

This metadata helps engineers analyze performance and troubleshoot issues across the platform.        

Runtime Flow:
Extract Trace Context
        │
        ▼
Create Root Span
        │
        ▼
Activate Span
        │
        ▼
Execute Gateway Processing
        │
        ▼
Complete Span
The span is active throughout the gateway's processing lifecycle.
Technology Card:
| Category                | Technology                |
| ----------------------- | ------------------------- |
| Observability Framework | OpenTelemetry             |
| Python SDK              | OpenTelemetry Python SDK  |
| Tracer                  | `Tracer`                  |
| Runtime Object          | `Span`                    |
| Cloud Backend           | Google Cloud Trace        |
| Context Management      | OpenTelemetry Context API |

The Tracer is responsible for creating spans, while the Span represents the work performed by the Enterprise AI Gateway.
Runtime Card:
| Stage      | Description                                     |
| ---------- | ----------------------------------------------- |
| Input      | Extracted Trace Context                         |
| Processing | Create and activate the Root Application Span   |
| Output     | Active span associated with the current request |

Sequence Card:
Receive Request
        │
Extract Trace Context
        │
Create Root Span
        │
Build ObservabilityContext
The Root Application Span provides the observability foundation for all remaining runtime steps.

Principal Architect Insight

A common mistake is creating dozens of top-level spans for a single request. This produces fragmented traces that are difficult to interpret because there is no clear parent–child relationship.

The Enterprise AI Gateway should create one Root Application Span representing its entire lifecycle. Any finer-grained operations—such as policy resolution, request validation, or context creation—can be represented as child spans beneath it.

This hierarchy mirrors the architecture itself: the gateway owns the overall request preparation, while its internal components own specific tasks. The resulting trace becomes both a performance tool and a visual representation of the platform's design.

Chapter Summary:

In this chapter, the Enterprise AI Gateway became an active participant in the distributed trace by creating its Root Application Span. We distinguished between a Trace, which represents the complete end-to-end request, and a Span, which represents the work performed by a single component.

The Root Application Span now provides the observability boundary for all gateway processing that follows.

With tracing established, the gateway can begin creating the enterprise contexts required by downstream services.

