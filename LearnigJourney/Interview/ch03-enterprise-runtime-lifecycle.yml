| Property            | Description                                                 |
| ------------------- | ----------------------------------------------------------- |
| Runtime Trigger     | Authenticated HTTP request received from Google API Gateway |
| Execution Model     | Sequential request pipeline                                 |
| Processing Style    | Stateless per request                                       |
| Primary Output      | Standardized `RequestContext`                               |
| Downstream Consumer | Responsible AI Input Pipeline                               |
| Failure Strategy    | Fail fast before business or AI processing                  |

Chapter 3.6:
Runtime Step 1 – Receive HTTP Request:
Entering the Enterprise AI Platform

Architecture Principle:
Every enterprise request must enter the platform through a single, controlled application entry point before any business or AI processing begins.
The Enterprise AI Gateway is that entry point.
No downstream component should ever receive an external request directly.

Introduction:

Every interaction with the Enterprise AI Platform begins with an HTTP request.

That request may originate from:

ServiceNow
A Web Portal
A Mobile Application
Another Enterprise Application
REST APIs
Internal Microservices

Regardless of its origin, every request follows the same journey.
Client
      │
      ▼
Google API Gateway
      │
      ▼
Enterprise AI Gateway

At this stage, no business logic has been executed.:

No AI model has been invoked.

No agent has started.

The only objective is:

Safely receive the request and bring it under the control of the Enterprise AI Platform.

Why Is This Step Necessary?:
Although Google API Gateway has already authenticated and routed the request, the application has not yet taken ownership of it.
The request still exists as an HTTP message.
The Enterprise AI Gateway must convert this transport-level request into an application-level object that the platform can understand and process.
This transition marks the beginning of enterprise request processing.

Runtime Sequence:
External Client
        │
        ▼
Google API Gateway
        │
        ▼
Cloud Run
        │
        ▼
FastAPI Server
        │
        ▼
Enterprise AI Gateway
        │
        ▼
Request Receiver

At the end of this step:

The HTTP request has entered the application.
FastAPI has parsed the request.
Control has been transferred to the Enterprise AI Gateway.
No enterprise processing has started yet.


What Happens During This Step?:

The Request Receiver performs only the responsibilities required to accept the request.

It:

Accepts the incoming HTTP request.
Parses the request using FastAPI.
Reads request headers.
Reads path parameters.
Reads query parameters.
Reads the request body.
Creates the initial request object.
Passes control to the Enterprise Gateway pipeline.

Notice what it does not do.

It does not:

Validate business rules.
Resolve enterprise policies.
Initialize tracing.
Build contexts.
Call Vertex AI.
Execute AI agents.

Those responsibilities belong to later runtime steps.

Runtime Flow:
HTTP Request
      │
      ▼
Receive Request
      │
      ▼
Parse HTTP Message
      │
      ▼
Extract Headers
      │
      ▼
Extract Path Parameters
      │
      ▼
Extract Query Parameters
      │
      ▼
Extract Request Body
      │
      ▼
Create Initial Request
      │
      ▼
Next Runtime Step

At this point, the application has only received the request.

It has not yet interpreted or enriched it.

