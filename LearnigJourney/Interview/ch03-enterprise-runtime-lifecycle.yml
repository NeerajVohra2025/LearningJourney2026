Build PolicyContext
        │
        ▼
Parse Business Request
        │
        ▼
Determine Business Capability
        │
        ▼
Determine Workflow
        │
        ▼
Determine AI Use Case
        │
        ▼
Create BusinessContext


Once this step is complete, the Enterprise AI Gateway fully understands the business purpose of the request.
BusinessContext Model:
BusinessContext
│
├── Business Capability
├── Business Operation
├── AI Use Case
├── Workflow
├── Customer
├── Department
├── Line of Business
├── Conversation ID
├── Session ID
├── Request Classification
└── Business Priority
This context is added to the overall enterprise request model.


Why Doesn't the AI Orchestrator Build This?:

A common question is:

"Why can't the AI Orchestrator determine the business operation?:

Because that would violate separation of responsibilities.

The AI Orchestrator should focus on:

Selecting the execution strategy.
Coordinating agents.
Managing workflow execution.

It should not:

Parse HTTP payloads.
Interpret REST endpoints.
Read transport-layer metadata.
Extract business identifiers.

Those responsibilities belong to the Enterprise AI Gateway.

This keeps orchestration logic independent of APIs and transport protocols.

BusinessContext vs PolicyContext:

Although these contexts are related, they answer different questions.
| BusinessContext                             | PolicyContext                         |
| ------------------------------------------- | ------------------------------------- |
| What business operation is requested?       | What enterprise rules apply?          |
| Business intent                             | Governance intent                     |
| Describes the request                       | Governs the request                   |
| Used by orchestrators and business services | Used by policy enforcement components |


Keeping these concerns separate allows business capabilities to evolve independently of governance policies.
