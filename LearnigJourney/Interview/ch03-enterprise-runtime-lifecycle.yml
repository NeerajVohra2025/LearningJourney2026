Chapter 3.13:
Runtime Step 8 – Build BusinessContext:
Understanding the Business Intent Behind the Request

At this point we have answered:

How do we observe the request? → ObservabilityContext
Where is it executing? → ExecutionContext
Who is making the request? → SecurityContext
What governance rules apply? → PolicyContext

Now we answer the final enterprise question:

"What business operation is the caller trying to perform?"

Architecture Principle:

Business logic should operate on business intent, not on transport-layer details.

The Enterprise AI Gateway transforms an incoming HTTP request into a standardized BusinessContext that represents the business meaning of the request rather than its technical representation.

Introduction:

By this stage, the Enterprise AI Gateway understands:

How to observe the request.
Where the request is executing.
Who the caller is.
Which enterprise policies govern the request.

However, one essential piece of information is still missing.

The platform still does not know what business capability the caller wants to execute.

For example:

Is the caller asking an AI question?
Summarizing a document?
Performing semantic search?
Creating an incident?
Executing an autonomous workflow?
Invoking a multi-agent orchestration?
Running a compliance audit?

The HTTP request contains these details, but they are still embedded inside transport objects such as JSON payloads, query parameters, and HTTP headers.

The Enterprise AI Gateway extracts this information and converts it into a reusable BusinessContext.


Why Do We Need a BusinessContext?:

Without a BusinessContext, every downstream service must repeatedly inspect the HTTP request.

For example:
Responsible AI Pipeline

↓

AI Orchestrator

↓

Planner Agent

↓

Retriever

↓

Prompt Builder

↓

LLM Adapter


Each component would need to determine:

Which business capability is requested?
Which workflow should execute?
Which AI use case is involved?
Which customer owns the request?
Which business identifiers should be propagated?

This duplicates request parsing throughout the platform.

Instead, the Enterprise AI Gateway performs this work once.


Business Intent vs HTTP Request:

This distinction is extremely important.

The HTTP request is merely a transport mechanism.

The BusinessContext represents the meaning of the request.

For example:
POST /v1/chat

{
   "prompt":"Summarize this contract",
   "customer":"ABC",
   "department":"Legal"
}

The downstream platform should not need to understand HTTP.

Instead, it receives:
BusinessContext
│
├── Capability = Document Summarization
├── Domain = Legal
├── Customer = ABC
├── Business Operation = AI Chat
├── Workflow = Summarization

The business meaning is now separated from transport concerns.

What Information Does the BusinessContext Contain?:

A BusinessContext typically includes:

Business Capability
Business Operation
AI Use Case
Workflow Identifier
Customer
Department
Line of Business
Tenant Business Metadata
Conversation Identifier
Session Identifier
Request Classification
Business Priority

Unlike previous contexts, these values describe what the business wants to accomplish, not how the platform processes the request.

