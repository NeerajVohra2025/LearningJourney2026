        What is MDC and why It needed?:  
            🎯 Goal
                When a user places an order, you want to see all logs for that request in one place — even if they span multiple services (order-service → payment-service).
                That’s where MDC + Trace ID comes in.
            
                MDC = Mapped Diagnostic Context:
                    It’s a thread-local map in Logback (Java logging) that lets you attach context (like user ID, request ID, or trace ID) to every log statement — automatically.
                    💡 Think of MDC like a sticky note attached to a request as it moves through your code.
                    Every log line gets a copy of that sticky note.

            🧩 Why MDC Matters in Microservices
                    In a monolith, you can track a request by thread.
                    But in microservices:
                        One user action = multiple services
                        Each service runs on different servers/threads
                    Without MDC, you’d see disconnected logs:
                        [order-service] INFO - Order created for user C123
                        [payment-service] ERROR - Payment failed
                    → Are these related? You can’t tell!:    
                    
                With MDC + Trace ID, you get:
                    {"trace_id":"4bf92f3577b34da6a3ce929d0e0e4736", "message":"Order created"}
                    {"trace_id":"4bf92f3577b34da6a3ce929d0e0e4736", "message":"Payment failed"}      
                ✅ Now you know they’re part of the same user request!        

            🔄 How MDC + OpenTelemetry Work Together
                    Here’s the magic flow:
                        Incoming request hits order-service:
                        OpenTelemetry starts a trace and generates a trace_id
                        OTel automatically puts trace_id into MDC
                        Your logger (Logback) sees MDC and includes trace_id in every log:
                        Logs go to CloudWatch
                        You search by trace_id → see full request flow!
                    ✅ Zero code needed — thanks to opentelemetry-logback-appender (included in opentelemetry-spring-boot-starter).    

                📄 Step-by-Step in Your logback-spring.xml:
                            
                            <encoder class="net.logstash.logback.encoder.LoggingEventCompositeJsonEncoder">
                                  <providers>
                                    <timestamp/>
                                    <logLevel/>
                                    <loggerName/>
                                    <message/>
                                    <mdc/> <!-- 👈 THIS IS THE KEY -->
                                  </providers>
                            </encoder>
                            
                        What <mdc/> Does:
                            Tells Logback: “Include all MDC key-value pairs in the JSON log”
                            OpenTelemetry has already put this in MDC:
                            trace_id = 4bf92f3577b34da6a3ce929d0e0e4736
                            span_id = 6a093757d6f8a76d    
                        So your log becomes:
                            {
                              "@timestamp": "2025-12-19T10:30:00",
                              "level": "INFO",
                              "logger": "com.shopeasy.order.OrderController",
                              "message": "Order created",
                              "trace_id": "4bf92f3577b34da6a3ce929d0e0e4736",
                              "span_id": "6a093757d6f8a76d"
                            }
                            
            
            🌐 End-to-End Flow (ShopEasy Example):
            
            🌐 End-to-End Flow (ShopEasy Example)
                        User clicks “Buy Now” in web app
                        Request hits order-service
                        OpenTelemetry:
                        Creates trace → trace_id = ABC123
                        Puts ABC123 into MDC
                        Your code logs:
                            logger.info("Order created for user {}", userId);
                        Logback outputs JSON with "trace_id":"ABC123"
                        order-service calls payment-service
                        Trace context (including trace_id) is automatically propagated via HTTP headers (traceparent)
                        payment-service receives the trace, puts ABC123 into its own MDC
                        Its logs also include "trace_id":"ABC123"
                        ✅ Now both services’ logs share the same trace_id!
            
                                                
                    
                🔍 How to Use It in CloudWatch Logs
                        Go to CloudWatch → Log groups → /ecs/shopeasy-fargate
                        Run this query:
                            fields @timestamp, service.name, message, trace_id
|                           filter trace_id = '4bf92f3577b34da6a3ce929d0e0e4736'
|                           sort @timestamp asc
                        You’ll see:    
                        @timestamp      service.name            message                 trace_id
                        10:30:01:       order-service           Order created           4bf92f...
                        10:30:02:       payment-service         Charging card           4bf92f...
                        10:30:03:       payment-service         Payment failed           4bf92f...
                    🎯 One trace ID = full story of one user request!
                    
                💡 Bonus: Add Custom Context to MDC (Optional)
                            Want to add user_id or order_id to logs? :
                                // In your controller
                                    MDC.put("user_id", userId);
                                    MDC.put("order_id", orderId);
                                    try {
                                        logger.info("Processing order");
                                        // ... business logic
                                    } finally {
                                        MDC.clear(); // Clean up!
                                    }
                        Now logs include:
                        { "...", "user_id": "C123", "order_id": "ORD-789", "trace_id": "ABC123" }
                    ⚠️ Always use try/finally or try-with-resources to avoid leaking MDC to other requests!
        
                ✅ Summary: MDC in 3 Points
                
                    Concept                 Explanation
                    What:                   A thread-local context to attach request-level data to log
                    How:                    OpenTelemetry auto-fills MDC with trace_id → Logback includes it via <mdc/>
                    Why:                    Lets you correlate logs across services using a single trace_id
                
                🧠 Final Thought:
                    MDC + OpenTelemetry = Superpower for debugging microservices.
                    You don’t need to pass trace_id manually.
                    You don’t need to write custom logging code.
                    Just add two dependencies and one line in logback-spring.xml — and you get full request-level visibility.
                    
                    That’s the beauty of modern observability. 🚀
                
                
                
                
                
                
        
            🧩 PART 1: What Is MDC?  :
                        MDC = Mapped Diagnostic Context
                            👉 MDC is a small in-memory map attached to the current request.
                                    It stores extra context (key–value pairs) that automatically appears in logs.
                            Think of MDC like a backpack 🧳 carried by the request:
                                Request
                                 └── Backpack (MDC)
                                     ├── trace_id = abc123
                                     ├── span_id = xyz456
                                     └── userId = u101
                                Every log statement during that request can read from this backpack.
                                
            🧩 PART 2: Why MDC Is Needed  
                    Without MDC:
                        INFO Creating order
                        INFO Processing payment
                    
                    You cannot tell:
                        Which request?
                        Which service?
                        Which flow?    
                    
                    With MDC:    
                        INFO traceId=abc123 Creating order
                        INFO traceId=abc123 Processing payment
                        
                    ✔ Now logs can be correlated across services.    


            🧩 PART 3: Sequence of Events (IMPORTANT)
                            Let’s follow one request step by step. 
                                STEP 1️⃣: Request Enters Your Service
                                            Client → ALB → API Gateway (Spring Boot)
                                         At this moment:
                                            No logs yet
                                            No MDC yet   
                                           
                                STEP 2️⃣: OpenTelemetry Creates Trace & Span
                                        OpenTelemetry automatically:
                                            Creates a trace
                                            Creates a span
                                            Generates:     
                                               trace_id = abc123
                                               span_id  = xyz456
                                               
                                STEP 3️⃣: OpenTelemetry Puts Data Into MDC
                                            OpenTelemetry injects values into MDC:  
                                                MDC:
                                                  trace_id = abc123
                                                  span_id  = xyz456
                                            📌 You did NOT write this code.
                                                    OpenTelemetry does it for you.     

                                STEP 4️⃣: Your Application Writes Logs
                                            Your code:   
                                                log.info("Creating order 101");
                                            Logback checks MDC:
                                                %X{trace_id}
                                                %X{span_id}
                                            Log output:
                                                INFO traceId=abc123 spanId=xyz456 Creating order 101
                                            ✔ MDC → log correlation achieved.    

            🧩 PART 4: Where service.name Comes From (NOT MDC)
                    ⚠️ Important:
                            service.name is NOT from MDC.
                            It comes from OpenTelemetry Resource Attributes.
                            
                            STEP 5️⃣: You Define service.name
                                        In application.yml:
                                        otel:
                                          resource:
                                            attributes:
                                              service.name: order-service
                                        This defines the identity of the service.      

                            STEP 6️⃣: OpenTelemetry Attaches service.name to Telemetry
                                        Every log, trace, and metric sent by the app includes:
                                                {
                                                  "resource": {
                                                    "service.name": "order-service"
                                                  }
                                                }
                                        📌 This metadata travels with the telemetry payload, not in logs.  

            🧩 PART 5: App → OTel Sidecar Communication
                    Your app sends telemetry to the sidecar:
                        otel:
                          exporter:
                            otlp:
                              endpoint: http://localhost:4317
                              
                    Sidecar receives:
                            Log message
                            Trace data
                            Resource attributes    
                                
                        Example:
                            {
                              "resource": {
                                "service.name": "order-service"
                              },
                              "log": {
                                "body": "Creating order 101"
                              }
                            }

            🧩 PART 6: How {service.name} Is Picked at Runtime
                    Now comes the key line:
                        log_stream_name: "{service.name}"
                    What this means in plain English:
                        “Take the value of service.name from the incoming telemetry and use it as the log stream name.”

                        STEP 7️⃣: Collector Substitutes Value at Runtime
                                    | Service         | service.name    | Log Stream Created |
                                    | --------------- | --------------- | ------------------ |
                                    | API Gateway     | api-gateway     | api-gateway        |
                                    | Order Service   | order-service   | order-service      |
                                    | Payment Service | payment-service | payment-service    |
                                    
                                📌No hardcoding.
                                📌No environment-specific config.
                                📌All dynamic.    

      
            🧩 PART 7: Final Result in CloudWatch
                        Log Group: /ecs/shopeasy/logs
                         ├── api-gateway
                         ├── order-service
                         └── payment-service
                    Each stream:
                        Contains logs with traceId
                        Belongs to exactly one service 
        
        
        🧠 Important Difference (Very Common Confusion)    
                        | Concept          | Purpose              | Comes From              |
                        | ---------------- | -------------------- | ----------------------- |
                        | MDC              | Enrich log lines     | OpenTelemetry → Logback |
                        | service.name     | Identify service     | OpenTelemetry Resource  |
                        | `{service.name}` | Dynamic substitution | OTel Collector          |
                👉 MDC ≠ Resource Attributes
            
            🧪 Simple Analogy (Very Easy to Remember):
                    MDC = what is written inside the log message
                    service.name = label on the envelope carrying the log