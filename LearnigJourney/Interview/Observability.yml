   🧠 What is otel-collector-config.yaml?:    
            Think of the OpenTelemetry Collector as a traffic control center.
            Your Spring Boot apps generate:
                logs
                traces
                metrics
            The OTel Collector sidecar:
                receives them
                processes them
                sends them to AWS services
        📄 otel-collector-config.yaml tells the collector:
            What to receive, how to process, and where to send it
            
            🧩 Big Picture of This File:
                  RECEIVERS   →   PROCESSORS   →   EXPORTERS
                    Each type of data (logs, traces, metrics) has its own pipeline.:
            
            📄 Full otel-collector-config.yaml (ShopEasy)
                            receivers:
                              otlp:
                                protocols:
                                  grpc:
                                  http:

                            processors:
                              batch:

                            exporters:
                              awsxray:
                              awscloudwatchlogs:
                                log_group_name: /ecs/shopeasy/logs
                                log_stream_name: "{service.name}"
                              awsemf:
                                namespace: ShopEasy/ECS

                            service:
                              pipelines:
                                traces:
                                  receivers: [otlp]
                                  processors: [batch]
                                  exporters: [awsxray]

                                logs:
                                  receivers: [otlp]
                                  processors: [batch]
                                  exporters: [awscloudwatchlogs]

                                metrics:
                                  receivers: [otlp]
                                  processors: [batch]
                                  exporters: [awsemf]
                                        
                🧱 1️⃣ RECEIVERS (Where data comes FROM):
                        receivers:
                          otlp:
                            protocols:
                              grpc:
                              http:
                              
                        What this means:
                            The collector listens for telemetry data
                            It accepts OTLP protocol
                            Over:
                            gRPC (4317) → most common
                            HTTP (4318) → fallback

                            In your ECS Fargate setup
                            Spring Boot app sends telemetry to:     
                                  http://localhost:4317
                            Collector receives it here
                        📌 Why OTLP?:
                                Standard OpenTelemetry protocol
                                Vendor neutral
                                High performance   

                🧠 2️⃣ PROCESSORS (What to do with data):
                        processors:
                          batch:
                    What batch does:
                        Collects data in small batches
                        Sends them together
                        Improves performance
                        Reduces AWS API calls
                        Lowers cost
                        Example:
                            Instead of sending: 
                                1 log → AWS
                                1 trace → AWS
                            It sends:
                                50 logs → AWS
                                10 spans → AWS
                                
                        📌 Always use batch in production        


                📤 3️⃣ EXPORTERS (Where data goes TO):
                        Exporters send data out of the collector   
                            🔍 3️⃣1 awsxray – Traces:
                                    exporters:
                                        awsxray:
                                        
                                    What it does:
                                        Sends distributed traces to AWS X-Ray
                                        Result
                                        You see:    
                                            api-gateway → order-service → payment-service
                                          With:
                                            Latency
                                            Errors
                                            Dependency map
                                                
      
                                
                            🪵 3️⃣2 awscloudwatchlogs – Logs:
                                    awscloudwatchlogs:
                                          log_group_name: /ecs/shopeasy/logs
                                          log_stream_name: "{service.name}"
                                    What this means:
                                        All logs go to:    
                                           /ecs/shopeasy/logs
                                        Each service gets its own stream:   
                                            api-gateway
                                            order-service
                                            payment-service
                                    Why this is good:
                                        ✔ Central logs
                                        ✔ Easy filtering
                                        ✔ Clear separation per service        

                            
                            📊 3️⃣3 awsemf – Metrics:
                                    awsemf:
                                        namespace: ShopEasy/ECS
                                    What EMF means:
                                        EMF = Embedded Metric Format
                                        It:
                                            Converts OpenTelemetry metrics
                                            Into CloudWatch native metrics
                                            Metrics you get
                                            HTTP latency
                                            Error count
                                            JVM memory
                                            CPU usage
                                        Visible under:  
                                            CloudWatch → Metrics → ShopEasy/ECS
    
                            
                            🧩 4️⃣ SERVICE PIPELINES (MOST IMPORTANT PART):
                                    Pipelines connect:
                                        Receiver → Processor → Exporter
                                            🔗 4️⃣1 Trace Pipeline:
                                                    traces:
                                                      receivers: [otlp]
                                                      processors: [batch]
                                                      exporters: [awsxray]
                                                Plain English:
                                                    Receive traces → batch them → send to X-Ray  
                                            
                                            🔗 4️⃣2 Log Pipeline:      
                                                    logs:
                                                      receivers: [otlp]
                                                      processors: [batch]
                                                      exporters: [awscloudwatchlogs]
                                                Plain English:
                                                      Receive logs → batch them → send to CloudWatch Logs      
                                                      
                                            🔗 4️⃣3 Metric Pipeline:
                                                    metrics:
                                                      receivers: [otlp]
                                                      processors: [batch]
                                                      exporters: [awsemf]
                                                Plain English:
                                                    Receive metrics → batch them → send to CloudWatch Metrics      
                                            
                    
