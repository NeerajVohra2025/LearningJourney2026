        🎯 Goal
                Enable traces → AWS X-Ray, metrics → CloudWatch, logs → CloudWatch Logs using OpenTelemetry — with zero code changes beyond config.
                                
                                
                                
                🧱 Step 1: Add OpenTelemetry to Your Spring Boot Project    
                    📁 File: pom.xml (for both order-service and payment-service)
                            Add these dependencies inside <dependencies>:
                                
                
                    <!-- OpenTelemetry Auto-Instrumentation for Spring Boot -->:
                            <dependency>
                                <groupId>io.opentelemetry.instrumentation</groupId>
                                <artifactId>opentelemetry-spring-boot-starter</artifactId>:
                                <version>2.7.0</version>
                            </dependency>

                            <!-- Structured JSON Logging (includes trace ID) -->
                            <dependency>
                                <groupId>net.logstash.logback</groupId>
                                <artifactId>logstash-logback-encoder</artifactId>:
                                <version>7.4</version>
                            </dependency>
                    💡 This gives you:
                        Auto-tracing for HTTP, JDBC, Spring Web
                        Trace context in logs
                        No code changes needed!
                        ✔ Automatic trace creation
                        ✔ Automatic span propagation
                        ✔ Automatic metrics
                        ✔ Trace ID in logs (MDC)
                        
                🧱 Step 2: Configure application.yml
                            Example: order-service
                            
                            spring:
                              application:
                                name: order-service

                            otel:
                              exporter:
                                otlp:
                                  endpoint: http://localhost:4317   # OTel sidecar
                              resource:
                                attributes:
                                  service.name: order-service
                                  deployment.environment: prod
                                  cloud.provider: aws

                        📌 Same config for API Gateway & Payment Service (change service name).
                        
                📄 Step 3: Configure Logging with Trace ID
                            📁 File: src/main/resources/logback-spring.xml
                            Create this file (or replace existing):     
                                    <configuration>
                                      <appender name="STDOUT"
                                                class="ch.qos.logback.core.ConsoleAppender">
                                        <encoder>
                                          <pattern>
                                            %d{yyyy-MM-dd HH:mm:ss}
                                            %-5level
                                            service=%X{service.name}
                                            traceId=%X{trace_id}
                                            spanId=%X{span_id}
                                            %logger - %msg%n
                                          </pattern>
                                        </encoder>
                                      </appender>

                                      <root level="INFO">
                                        <appender-ref ref="STDOUT"/>
                                      </root>
                                    </configuration>
                                    
                                    
                                    <?xml version="1.0" encoding="UTF-8"?>
                                
                                            OR:
                                
                                <configuration>
                                  <appender name="STDOUT" class="ch.qos.logback.core.ConsoleAppender">
                                    <encoder class="net.logstash.logback.encoder.LoggingEventCompositeJsonEncoder">
                                      <providers>
                                        <timestamp/>
                                        <logLevel/>
                                        <loggerName/>
                                        <message/>
                                        <mdc/> <!-- includes trace_id, span_id -->
                                      </providers>
                                    </encoder>
                                  </appender>

                                  <root level="INFO">
                                    <appender-ref ref="STDOUT"/>
                                  </root>
                                </configuration>
                        ✅ This ensures every log contains "trace_id":"...".            
                                    
                        📌  Add Simple Logs in Code:
                                log.info("Processing order {}", orderId);
                        ✔ Logs now contain traceId automatically.
                        Example log:
                        {"@timestamp":"2025-12-19T10:00:00", "level":"INFO", "logger":"c.s.o.OrderController", "message":"Order created", "trace_id":"4bf92f3577b34da6a3ce929d0e0e4736"}
                        
                        
            📄 Step 4: OpenTelemetry Collector (Sidecar Container)   
                🎯 Goal:
                        Collect telemetry from the app and send it to AWS services.
                           Collector Configuration File:
                                otel-collector-config.yaml:
                                        receivers:
                                          otlp:
                                            protocols:
                                              grpc:
                                              http:

                                        processors:
                                          batch:

                                        exporters:
                                          awsxray:
                                          awscloudwatchlogs:
                                            log_group_name: /ecs/observability/logs
                                            log_stream_name: "{service.name}"
                                          awsemf:
                                            namespace: ECS/Observability

                                        service:
                                          pipelines:
                                            traces:
                                              receivers: [otlp]
                                              processors: [batch]
                                              exporters: [awsxray]

                                            logs:
                                              receivers: [otlp]
                                              processors: [batch]
                                              exporters: [awscloudwatchlogs]

                                            metrics:
                                              receivers: [otlp]
                                              processors: [batch]
                                              exporters: [awsemf]
                                💡 You can omit this file if using default ADOT behavior — but including it gives you control.
                                
            📄 Step 5: Docker & Build
                    📄 File: Dockerfile (per service)
                            FROM openjdk:17-slim
                            COPY target/order-service.jar app.jar
                            ENTRYPOINT ["java", "-jar", "/app.jar"]
                            
                    For payment-service, replace order-service.jar with payment-service.jar.  

            🔍 Step 6: Verify Observability/View Observability Data     
                        1. Traces → AWS X-Ray:
                                AWS Console → X-Ray → Service Map:
                                    You’ll see two nodes:
                                        order-service
                                        payment-service
                                    Click to see traces, latency, errors
                                    
                        2. Logs → CloudWatch Logs:
                                /ecs/observability/logs:
                                  ├─ api-gateway
                                  ├─ order-service
                                  └─ payment-service
                                Example log:
                                  INFO service=order-service traceId=abc123 Processing order 101
                                Run query:
                                    fields @timestamp, message, traceId
                                    | filter service.name = 'order-service'
                                    | limit 20
                        
                        3. Metrics → CloudWatch Metrics:
                                Namespace:  ECS/Observability
                                    Go to Metrics → OTel namespace
                                    Find metric: 
                                        http.server.duration
                                        http.server.errors
                                        jvm.memory.used
                                    Filter by service.name = order-service
                                    ✅ Trace-Log Correlation: Click a traceId in logs → “View in X-Ray”
                                    
                        4. CloudWatch Alarm (Threshold):
                                🎯 Goal
                                    Detect issues automatically.
                                Example Alarm:
                                    Metric: http.server.errors
                                    Threshold: ≥ 5 in 2 minutes
                                    Action: Notify SNS
                                    
                        5. SNS Topic:
                              ecs-observability-alerts
                                Alarm → SNS
                                
                        6. Lambda Function (SNS Trigger):
                              🎯 Goal
                                   Send alerts to Microsoft Teams.      

                        7. End-to-End Flow (One Request):
                                Request hits ECS service:
                                    Trace starts in application
                                    Logs include traceId
                                    OTel sidecar collects telemetry
                                    Traces → X-Ray
                                    Logs → CloudWatch
                                    Metrics → CloudWatch
                                        Alarm fires
                                            SNS notifies Lambda
                                                 Lambda posts to Teams
                            
                
        
