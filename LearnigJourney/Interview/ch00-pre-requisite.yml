Principal Architect Notes:

One refinement to your understanding:

Workload Identity Federation, Workload Identity Pool, OIDC Provider, and Service Account Mapping are platform configuration steps, not actions that happen on every request.
JWT validation and STS token exchange are part of the authentication flow.
After a successful exchange, downstream Google services operate using the Google service account identity, not the original external JWT.