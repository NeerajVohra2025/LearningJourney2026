What happens behind the scenes?:
Let's walk through it as if we were debugging the platform.

Step 1 — ServiceNow Needs an Identity:

Your webhook is not anonymous.

It first needs to prove:

"I am ServiceNow."

For that, ServiceNow requests a token from its Identity Provider.

ServiceNow

      │

      │ OAuth2 Client Credentials

      ▼

ServiceNow Identity Provider

      │

      │ Authenticate Client ID
      │ Authenticate Client Secret

      ▼

Generate Signed JWT
The JWT contains claims similar to:
{
  "iss": "https://idp.company.com",
  "sub": "servicenow-prod",
  "aud": "gcp-genai-platform",
  "exp": 1782323232,
  "iat": 1782322932
}

At this point, Google Cloud has not seen this token yet.

Step 2 — Google Must Trust That JWT:
Now the request reaches Google Cloud.
ServiceNow

↓

Signed JWT

↓

Google Security Token Service (STS)

The STS service checks:
✓ Is the signature valid?

✓ Is the issuer trusted?

✓ Is the audience correct?

✓ Has the token expired?

✓ Is the workload allowed?

✓ Does it map to a Google Service Account?


This validation happens because you configured:

Workload Identity Pool
OIDC Provider
Attribute Mapping
IAM Binding

during platform setup.


Step 3 — Identity Mapping:
Now Google says:
"I trust this ServiceNow identity."
It performs the mapping.
OIDC Identity

↓

Attribute Mapping

↓

Google Service Account

↓

genai-platform-sa

This is where IAM evaluates:
roles/iam.workloadIdentityUser


Step 4 — Google Issues a Google Access Token:
This is the part many architects miss.
The ServiceNow JWT is not used directly to call Vertex AI.
Instead, Google STS exchanges it for a Google OAuth Access Token that represents the mapped service account.
ServiceNow JWT

↓

Google STS

↓

Google OAuth Access Token

↓

genai-platform-sa
This token is what Google services (API Gateway, Cloud Run, Vertex AI, etc.) understand.


Step 5 — Runtime Begins:
Only now does the webhook send the business request.
ServiceNow

↓

HTTPS POST

Authorization:
Bearer <Google Access Token>

↓

Google API Gateway

Payload:
{
  "incidentNumber": "INC0012456",
  "priority": "P1",
  "shortDescription": "Payment API Timeout",
  "assignmentGroup": "Platform Support"
}

