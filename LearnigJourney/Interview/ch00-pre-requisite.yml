Chapter 1 — Platform Prerequisites:
Card 1 — ServiceNow Machine Identity (One-Time Setup):
Before any webhook can invoke the GenAI Platform, ServiceNow and Google Cloud must establish a Zero Trust relationship.
Think of this like issuing a company ID card before someone can enter a secure office.
No ID card → No Entry.
