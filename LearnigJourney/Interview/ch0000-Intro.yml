## Situation (Story Format)

"Let me walk you through the existing scenario."
Monitoring systems such as **Sumo Logic** and **Grafana** continuously monitored logs across multiple applications.

Whenever there was an anomaly—such as:

- CPU spike
- Sharp increase in error rates
- Slower response times
- Unexpected traffic spikes

Sumo Logic automatically generated an alert and created a ServiceNow incident.

The L1.5 support team monitored ServiceNow tickets, reviewed alert details, and attempted to understand the issue. Since the alerts did not provide sufficient context, most incidents were escalated to the L2 team.

The L2 engineers then logged into multiple systems, manually collected logs, analyzed the issue, identified the root cause, and updated the incident ticket.

This manual process typically required **6–8 hours** and created a significant dependency on the L2 team, even for repetitive incidents.

---

## Task

The primary objectives were:

- MTTR.
- Cost 
    -  reduce eliminate L1.5 
    - reduce L2
- Automate Root Cause Analysis (RCA).
- Improve the speed, accuracy, and consistency of incident resolution.

---

## Action

I designed and implemented a **GenAI-driven intelligent incident management platform** on top of the existing **Sumo Logic** and **ServiceNow** integration.

### The solution works as follows:
# Final Normalized Sequence (SSOT)

1. **User/Event**
   - Grafana / ServiceNow incident creation

2. **Identity**
   - JWT + GCP STS short-lived token

3. **Edge / Inbound**
   - API Gateway + Cloud Run Gateway

4. **Input Policy Pipeline**
   - DLP
   - `sanitizeUserPrompt`
   - `count_tokens`
   - Context Cache

5. **Orchestrator**
   - Start workflow

6. **RoutingEngine**
   - `after_logs()`

7. **LogAnalyzerAgent**
   - Cloud Logging

8. **RCAAgent**
   1. **Evidence**
      - Cloud Logging
      - Vertex AI Search
      - BigQuery
   2. **Grounding**
      - Build evidence-only prompt
   3. **LLM**
      - `generate_content()`
   4. **Output Safety**
      - `sanitizeModelResponse`
      - Optional DLP output scan
   5. **Citation**
      - Attach evidence sources
   6. **Evaluation**
      - `EvalTask.evaluate()`

9. **RoutingEngine**
   - `after_rca()`

10. **Execution**
    - ActionAgent
    - IncidentAgent
    - HITL Tool

11. **Observability + Audit**
    - Cloud Trace
    - Cloud Logging
    - Monitoring
    - BigQuery
