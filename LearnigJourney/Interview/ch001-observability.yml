# Enterprise Observability Framework
## Single Source of Truth (SSOT)

---

# Purpose

The Enterprise Observability Framework provides a reusable, cloud-native observability solution for enterprise applications built using:

- Python
- FastAPI
- Hexagonal Architecture
- Clean Architecture
- OpenTelemetry
- Google Cloud Operations Suite

The framework enables every request to be traced from the API Gateway to the final response without exposing OpenTelemetry or Google Cloud SDKs to the business layers.

---

# Design Principles

The framework is designed around the following principles:

- Single Responsibility Principle (SRP)
- Dependency Inversion Principle (DIP)
- Hexagonal Architecture (Ports & Adapters)
- Clean Architecture
- Dependency Injection
- Framework Independence
- Cloud Independence

Every class has one clear responsibility.

---

