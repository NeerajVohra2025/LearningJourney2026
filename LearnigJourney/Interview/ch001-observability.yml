# Framework Responsibilities

The framework consists of the following components.

---

## 1. ObservabilityContext

### Responsibility

Acts as the single entry point for all observability services.

Business components receive only one dependency.

It exposes:

- Observer
- Trace Manager
- Logger
- Metrics
- Events

The application never creates these objects directly.

---

## 2. Observer (Port)

### Responsibility

Defines the contract for observing work performed inside a service.

The Observer is responsible for:

- Creating child spans
- Recording span events
- Recording exceptions
- Updating span status
- Closing spans

The Observer is a business-facing interface.

It contains no OpenTelemetry implementation.

---

## 3. Trace Manager (Port)

### Responsibility

Defines the contract for distributed trace management.

The Trace Manager is responsible for:

- Creating the Root Span
- Starting a distributed trace
- Completing the Root Span

It does not create child spans.

---

## 4. Context Propagator

### Responsibility

Moves distributed trace context between services.

It is responsible for:

- Injecting trace headers
- Extracting trace headers
- Propagating distributed context

It never creates spans.

---

## 5. Correlation Manager

### Responsibility

Creates and manages business identifiers.

Examples:

- Correlation ID
- Request ID
- Incident ID
- Workflow ID

These identifiers allow business transactions to be tracked independently of OpenTelemetry.

---

## 6. Baggage Manager

### Responsibility

Propagates lightweight business context across services.

Examples:

- Tenant
- User
- Region
- Environment
- Workflow
- AI Model

This information travels with the request but is separate from span attributes.

---

## 7. Structured Logger

### Responsibility

Writes structured application logs.

Every log automatically includes:

- Trace ID
- Span ID
- Correlation ID
- Incident ID

Integrated with Google Cloud Logging.

---

## 8. Metrics Recorder

### Responsibility

Publishes custom metrics.

Examples:

- Request latency
- Token usage
- Cache hit ratio
- Retry count
- Evaluation score

Integrated with Google Cloud Monitoring.

---

## 9. Event Publisher

### Responsibility

Records important business events during request execution.

Examples:

- Prompt Received
- DLP Inspection Completed
- Prompt Sanitized
- Grounding Completed
- Gemini Request Started
- Gemini Response Received
- Evaluation Completed
- Incident Closed

Events are associated with the active span.

---

# Infrastructure Components

The infrastructure layer provides concrete implementations of the framework contracts.

Business code never imports these classes directly.

| Component | Implementation |
|----------|----------------|
| Observer | OpenTelemetry Observer |
| Trace Manager | OpenTelemetry Trace Manager |
| Logger | Cloud Logging |
| Metrics | Cloud Monitoring |
| Event Publisher | OpenTelemetry Events |

