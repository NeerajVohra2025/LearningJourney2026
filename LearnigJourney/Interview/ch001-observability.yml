# Bootstrap

The bootstrap module is the Composition Root of the framework.

Responsibilities:

- Create infrastructure implementations.
- Wire implementations to their interfaces.
- Create the ObservabilityContext.
- Inject the ObservabilityContext into the application.

No business component creates observability services directly.

---

# Summary

The Enterprise Observability Framework is composed of:

- **Ports (Interfaces)** that define the observability contracts.
- **Infrastructure implementations** that integrate with OpenTelemetry and Google Cloud.
- **ObservabilityContext**, which provides a single dependency for the application.
- **Bootstrap**, which wires the framework together using dependency injection.

This architecture ensures that the business application remains:

- Cloud independent
- Framework independent
- Easy to test
- Easy to maintain
- Aligned with Hexagonal Architecture
- Aligned with Clean Architecture
- Production ready       

Principal Architect Final Decision (Freeze)

This is the architecture I would freeze permanently.

One small but important change from previous iterations is that ContextPropagator, CorrelationManager, and BaggageManager are treated as internal infrastructure collaborators of the OpenTelemetry Trace Manager, rather than first-class services exposed to the application.

The business application only needs to know about:

ObservabilityContext
Observer (Port)
TraceManager (Port)
Logger (Port)
Metrics (Port)
EventPublisher (Port)

Everything else is an implementation detail hidden inside the infrastructure layer. This keeps the public API small, makes the framework easier to understand, and better adheres to the Dependency Inversion Principle. From this point onward, I would not make any further architectural changes—only implementation.