# Dependency Flow

Dependencies always point inward.

```text
Application Layer
        │
        ▼
ObservabilityContext
        │
        ▼
Interfaces (Ports)
        │
        ▼
Infrastructure Implementations
        │
        ▼
OpenTelemetry SDK
        │
        ▼
Google Cloud SDK
```

Business code never depends on OpenTelemetry.

Business code never depends on Google Cloud SDKs.

