    1️⃣ Application Architecture Evolution (Big Picture):
                Model 1: Client–Server
                    UI directly talks to server
                    Example: JSP + Servlet
                    ❌ Tight coupling
                    ❌ Hard to scale
                    
                Model 2: MVC (Model–View–Controller)
                    Separation of concerns:
                    Controller → request handling
                    Model → business/data
                    View → UI
                    Still mostly monolithic  ->single artifact for whole application (eCommerce) – .war
                    
                Front Controller Pattern:
                    Single entry point for all requests
                    Example: DispatcherServlet in Spring MVC
                    Enables:
                        Centralized security
                        Logging
                        Routing    
                
                Monolithic Architecture:
                    Single deployable unit (.war)
                    Entire eCommerce app packaged together
                    ❌ Slow deployments
                    ❌ Hard scaling
                    ❌ One bug affects entire system
                    
    2️⃣ Service & API Fundamentals:
                Service:
                    Independent component
                    Performs a single business capability
                    Exposed via API (URL)    
               
                API (Application Programming Interface):
                    Contract between applications
                    Focuses on WHAT, not HOW
                    Defines:
                        Request format
                        Response format
                        Security
                        Data access rules        
                        
    3️⃣ SOA vs Microservices (Very Important):  
                SOA (Service-Oriented Architecture):
                Uses central ESB
                ESB handles:
                    Routing
                    Security
                    Transactions
                Tools: Mule, TIBCO
                ❌ ESB becomes bottleneck   

                
                
                Microservices:
                    No ESB
                    Services communicate directly
                    Loosely coupled
                    Independently deployable
                    Owned by small teams
                Communication:
                    Sync (REST)
                    Async (Kafka, AMQP)                
                    
    4️⃣ SOAP vs REST:
                SOAP:
                    Protocol
                    XML-based
                Envelope:
                    Header → Security
                    Body → Payload
                    Heavy & rigid

                REST:
                    Architectural style
                    Uses HTTP
                    Resource-based
                    Stateless
                    Lightweight

                HTTP Methods:
                    GET → Read
                    POST → Create
                    PUT → Update     
    
    5️⃣ Typical Microservice Request Flow:
                    User
                       -> Controller (endpoint)
                            → Service Logic (Business functionality)
                                    → DAO (Data Access Layer)
                Clean separation = maintainability

    
    
