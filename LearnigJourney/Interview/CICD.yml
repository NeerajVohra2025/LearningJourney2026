                        SERVICE_NAME   = 'orderms-${params.ENV}-service'
                    }

                    stages {

                        stage('Approval (TEST & QA)') {
                            when {
                                expression { params.ENV != 'DEV' }
                            }
                            steps {
                                input message: "Approve deployment to ${params.ENV}?"
                            }
                        }

                        stage('Deploy to ECS') {
                            steps {
                                script {

                                    if (params.ENV == 'DEV') {
                                        sh "./deploy-ecs.sh dev ${params.IMAGE_TAG}"
                                    }
                                    else if (params.ENV == 'TEST') {
                                        sh "./deploy-ecs.sh test ${params.IMAGE_TAG}"
                                    }
                                    else if (params.ENV == 'QA') {
                                        sh "./deploy-ecs.sh qa ${params.IMAGE_TAG}"
                                    }
                                }
                            }
                        }
                    }

                    post {
                        success {
