Jenkins:
    Jenkins is an open source continuous Integrtion  server written in java that allows continuous development , build,test and deployments of codes.
    Build Code: 
        Is the process of converting source code to executable/artifacts.
        java --.jar/.war/. ear
        python – pybuilder
        How to build code? :
            Using the build tool
                java -- maven/ant/Gradle
                net -- vs/msbuild
            Build code process:
                    We can directly package source code to artifacts, but it is recommended to go through various stages
                    1) code review: static code analysis
                    2) unit test: developer level testing
                    3) code coverage: how much testing covered.
                    4) package: convert sc to executable
            All the above steps performed by ?: maven/ant/Gradle
            
            Why Do We Need Jenkins?:
                In real projects:
                    Developers keep committing code to Git
                    Code needs to be:
                        Compiled
                        Tested
                        Packaged
                        Verified
                    Doing this manually every time is:
                        Slow
                        Error-prone
                        Not scalable
                    👉 Jenkins automates all these steps..
               

            🛠️ What Is Jenkins?:
                Jenkins is a free, open-source automation server—often called a "Build Automation Server" or "Continuous Integration (CI) Server."
                But here’s the key idea:
                Jenkins doesn’t do things by itself. It’s like a smart assistant that follows your instructions to connect and coordinate other tools.
            
            
            🔁 What Is Continuous Integration (CI)?:
            
            
            Jenkins:
                Automate the build process, can say Build Automation Server
                    Integrate Git with Jenkins (Using Web Hooks)
                    Integrate Maven with Jenking (Plugins)
                We perform various stages of build code process continuously , thats why we call Jenkins as  Continuous Integration Server.
                If we executes various stages of build code process in a sequential manner thats called continuous integration pipeline
                (CI Pipeline): The Goal of CI is always to generate an executable format of source code.

                Jenkins is also called dummy tool it can’t do anything its own, we have to give instruct to Jenkins hey go to git server take a latest code, hey Jenkins go and talk to build server make a build of latest code. This also called continuous Integration pipeline, it is a mediator collaborate with other tools also called orchestration tool this pipeline always executed whenever there is a commit in GitHub.  
                
        
        🌟 What Is a Plugin?:
                Think of a plugin like an add-on or extension that gives extra features to software that doesn’t have them built-in.:
                
            1. Start with Basic Software:
                Imagine you buy a new mobile phone.
                ✅ It comes with basic features: calls, messages, camera, etc.
                ❌ But it doesn’t have, say, a fancy photo-editing app or a language translator. 
                To get those extra features, you go to the Play Store (or App Store) and install apps that add new abilities to your phone.    
           
           2. Same Idea in Software Tools:
                Many software tools—like Maven (a build tool) or Jenkins (a CI/CD automation server)—also start with a core set of basic features.
                Maven, by default, can compile your code, run tests, and package your app.
                But what if you want to review your code for mistakes? That’s not built-in.
            
            3. Plugins Add Missing Features:    
                To add new capabilities, you use plugins.
                    For code review, you can add the PMD plugin (PMD = "Programming Mistake Detector").:
                        → You just add a few lines in your project’s pom.xml file, and now Maven can check your code for bad practices!
                    Want to know how much of your code is tested?:
                        → Install the Cobertura plugin, and Maven will generate a code coverage report.
                    So, plugins = superpowers for your tools!

            4. Jenkins Loves Plugins!  :  
                What Jenkins Provides by Default:
                    Jenkins comes with basic CI/CD functionality, such as:
                        Running jobs
                        Triggering builds
                    But Jenkins Becomes Powerful with Plugins:
                        Jenkins can:
                            Integrate with Git
                            Run Maven builds
                            Perform code quality checks
                            Deploy applications
                            Send email notifications    
                    👉 All of this is possible because of Jenkins plugins. :       
            
            5. Jenkins + Plugins = Unlimited Power:
                    Jenkins has thousands of plugins
                        Each plugin adds new capabilities
                        You install only what you need
                        Examples:
                            Git plugin → Source code integration
                            Maven plugin → Build Java projects
                            PMD / Sonar plugin → Code quality
                            Email plugin → Notifications
                        That’s why Jenkins is very popular —
                        ✨ its plugin ecosystem makes it extremely flexible
            
            6. Final Summary 📝:
                A plugin is an add-on that extends software functionality
                    Core software provides basic features
                    Plugins add advanced or optional features
                    Examples:
                        Mobile apps → Phone plugins
                        PMD / Cobertura → Maven plugins
                        Git / Sonar → Jenkins plugins
                        Jenkins is powerful because of its plugins
                You just go to Jenkins → Manage Plugins, pick what you need, and install it—just like downloading an app on your phone!:        
        A plugin is a software component that enhances or extends the functionality of an existing tool without modifying its core system.

        🧩 How Jenkins Works – Step by Step:
            1. You Write Code & Push to Git (e.g., GitHub)
            Developer makes a change → commits code → pushes to GitHub.
            
            2. GitHub Tells Jenkins: “Hey, New Code!”
            Using a Webhook, GitHub automatically notifies Jenkins whenever there’s a new commit.
            
            3. Jenkins Springs into Action:
            Jenkins doesn’t build code by itself—it orchestrates other tools:
            👉 “Hey Jenkins, go get the latest code from GitHub!”
            → Jenkins uses Git plugin to clone/pull the code.
            👉 “Now build it!”
            → Jenkins calls Maven (or Gradle, npm, etc.) using a plugin to compile the code, run tests, etc.
            👉 “Check code quality!”
            → Jenkins runs plugins like PMD or SonarQube.
            👉 “How much code did we test?”
            → Jenkins uses Cobertura or JaCoCo plugins for coverage reports.
            This whole sequence is your CI Pipeline—a step-by-step automation flow.

            4. Pipeline = Your Recipe for Building Software:
            A CI Pipeline in Jenkins is just a series of stages: # step by step in sequence
               Checkout Code → Compile → Run Tests → Analyze Code → Build Artifact
            Defined in a file (like Jenkinsfile) or via GUI.
            Runs automatically on every commit.
            5. Jenkins = The Conductor of the Orchestra 🎼:
            Jenkins doesn’t play the instruments (Git, Maven, Docker, etc.).
            Instead, it coordinates them all at the right time—making it a powerful orchestration tool.  

    💡 Why Is Jenkins So Popular?:
        1000+ plugins → Integrates with almost any tool (Git, Docker, AWS, Slack, Jira, etc.).
        Free & open-source
        Runs anywhere (Windows, Linux, cloud, etc.)
        Highly customizable pipelines            
        
    Continuous Integration (CI):
        What is Continuous Integration?:
        Developers commit code frequently
        Each commit triggers:
            Build
            Test
            Validation
        👉 Because this process happens continuously, Jenkins is called a
        Continuous Integration (CI) Server.    
        
    CI Pipeline (Sequential Stages):
            When Jenkins executes multiple stages one after another, it is called a:
            Continuous Integration Pipeline (CI Pipeline)
            Example stages:
                Fetch code from Git
                Compile code
                Run unit tests
                Perform code quality checks
                Generate executable file
            📌 Since these stages run sequentially, we call it a pipeline.   


    Goal of CI Pipeline:
        🎯 Main Goal of CI
            To generate an executable format from source code
            Examples:
            .jar
            .war
            .exe
            Docker image

        Once this executable is created, it can be deployed later. 

   
    Jenkins as an Orchestration Tool:
        Since Jenkins:
        Connects Git
        Connects Maven
        Connects testing tools
        Connects deployment tools
        👉 Jenkins acts as a mediator between tools.
        This is why Jenkins is also called an:
        Orchestration Tool
        It orchestrates (coordinates) the entire CI process.    
        
    Final Summary:
        Jenkins automates the build process
        Integrates with Git using webhooks
        Integrates with Maven using plugins
        Executes build stages continuously → Continuous Integration
        Sequential stages → CI Pipeline
        Goal → Generate executable file
        Jenkins does nothing alone → needs other tools
        Acts as a mediator → Orchestration tool    
        
    One-Line Interview Answer 🎯
        Jenkins is a continuous integration server that automates the build process by orchestrating multiple tools like Git and Maven through a CI pipeline. 


CICD:
    🧱 Step 1: Understand the Key Concepts  
        🔁 CI (Continuous Integration):
                Every time a developer commits code.
                Code is built and tested automatically after every commit.
                Output: Executable artifact (JAR / WAR / Docker image)
                Goal: Catch bugs early, ensure code integrates smoothly.
            👉 CI = Build + Test
                One CI pipeline per microservice (because each is built/tested independently).  
                
        🚀 CD (Continuous Delivery / Deployment):
              Continuous Delivery: Code is always ready to deploy to production—but deployment is manual (e.g., click a button).
                  👉 CD (Delivery) = Ready to deploy, but waits for approva
              Continuous Deployment: Code is automatically deployed to production after passing tests (no human step).
                  👉 CD (Deployment) = Deploy automatically  
                  
    🏗️ Step 2: Your Setup:
            Microservices                                   Environments
            ✅ Service A (e.g., User Service):              🌱 Dev (for developer testing)
            ✅ Service B (e.g., Order Service)              🧪 Test (integration & QA testing)
            ✅ Service C (e.g., Payment Service)            ✅ QA (pre-production validation)
            
    Step 3: Basic Architecture Overview (Mental Picture):
            Developer → Git → Jenkins CI → Artifact Repo → Jenkins CD → Environments
            
            
    Step 4: How Many CI Pipelines Are Required?
            Rule:
                1 CI pipeline per microservice
            Why?:
            Each microservice:
                Has its own codebase
                Has its own build lifecycle
                Can be deployed independently
            For Your Case:
                Order Service → 1 CI pipeline   
                Payment Service → 1 CI pipeline
                User Service → 1 CI pipeline
            ✅ Total CI Pipelines = 3     

    Step 5: What Happens in Each CI Pipeline?:
            CI Pipeline Example (Order Service):
                Developer commits code to Git
                Git webhook triggers Jenkins
                Jenkins pulls latest code
                Maven builds the code
                Unit tests run
                Code quality checks (Sonar)
                Artifact created (JAR / Docker Image)
                Artifact stored in Nexus / ECR
        🎯 Goal of CI: Generate executable artifact     


    Step 6: Continuous Delivery Pipelines (CD – Delivery):
            Rule:
                1 CD pipeline per environment per microservice
            Environments:
                DEV
                TEST
                QA
            For 1 Microservice:
                DEV CD pipeline
                TEST CD pipeline
                QA CD pipeline

            For 3 Microservices:  
                3 Microservices × 3 Environments = 9 CD pipelines
            ✅ Total CD (Delivery) Pipelines = 9    

    Step 7: How Continuous Delivery Works (Step by Step):
            Example: Order Service → DEV Environment
                CI pipeline completes successfully
                Artifact is ready
                CD pipeline waits for manual approval
            After approval:
                Deployed to DEV
                Smoke tests run
            👉 Same process for TEST and QA
            📌 Deployment is not automatic → Approval required
            
    Step 8: Continuous Deployment (Fully Automated):
            Where Is Continuous Deployment Used?:
                Usually in DEV environment
                Sometimes in TEST
            How It Works:
                CI pipeline finishes
                Artifact automatically deployed to DEV
                No human intervention
            👉 This is Continuous Deployment        
            
    Step 9: Recommended Enterprise Architecture   
        CI Pipelines:
            CI-Order-Service
            CI-Payment-Service
            CI-User-Service
        CD Pipelines:
            CD-Order-DEV   → Auto deploy
            CD-Order-TEST  → Manual approval
            CD-Order-QA    → Manual approval

            CD-Payment-DEV
            CD-Payment-TEST
            CD-Payment-QA

            CD-User-DEV
            CD-User-TEST
            CD-User-QA
               
    Step 10: Final Pipeline Count Summary    
            | Type                | Count  |
            | ------------------- | ------ |
            | CI Pipelines        | 3      |
            | CD Pipelines        | 9      |
            | **Total Pipelines** | **12** |
    One-Line Interview Answer 🎯:
    In an enterprise microservices architecture, each microservice has its own CI pipeline, and each environment has its own CD pipeline, ensuring independent builds, controlled deployments, and scalable delivery.
    
📄 What Is a Jenkinsfile?:
        A Jenkinsfile is a text file that lives inside your code repository and defines your CI/CD pipeline as code.
        Think of it like a recipe that tells Jenkins:
        “When new code is pushed, here’s exactly what to do—step by step.”
        Instead of clicking buttons in the Jenkins web UI to set up jobs, you write instructions in this file, and Jenkins reads and follows them automatically.
   This approach is called “Pipeline as Code”—and it’s a best practice in modern DevOps and enterprise environments:
   
   ✅ Why Use a Jenkinsfile?:
        Without Jenkinsfile                                         With Jenkinsfile
        Pipeline setup is manual (clicks in UI):                    Pipeline is version-controlled with your code
        Hard to reproduce or share:                                 Anyone can see, edit, and reuse the pipeline
        Changes aren’t tracked:                                     Every change to the pipeline is in Git (with history & reviews!)
        Risk of “pipeline drift”:                                   Everyone uses the same pipeline
      🔑 Jenkinsfile = Your pipeline lives in your repo, just like your code.:  
        
    🧱 Structure of a Jenkinsfile (Declarative Syntax – Most Common):  
        Jenkins supports two syntaxes: # groovy script
            Scripted Pipeline Code
            Declarative Pipeline Code 
          but Declarative is beginner-friendly and widely used.   
                Here’s the basic skeleton:
                    pipeline {
                        agent any          // Where to run the pipeline (e.g., on any Jenkins worker)

                        stages {
                            stage('Build') {
                                steps {
                                    sh 'mvn clean compile'
                                }
                            }

                            stage('Test') {
                                steps {
                                    sh 'mvn test'
                                }
                            }

                            stage('Deploy to Dev') {
                                steps {
                                    sh 'kubectl apply -f k8s/dev/'
                                }
                            }
                        }
                    }          
                    
                🔍 Step-by-Step Explanation:
                        1. pipeline { }:
                            The whole pipeline lives inside this block.     
                        2. agent any:
                            Tells Jenkins: “Run this on any available build agent (worker machine).”
                            You can also specify labels like agent { label 'linux-java' }.        
                        3. stages { }:
                            Contains all your pipeline steps grouped into stages.   
                        4. Each stage('Name'):
                            A logical phase (e.g., Build, Test, Deploy).
                            Shows up as a separate column in Jenkins UI—great for visibility!        
                        5. steps { }:
                            The actual commands to run.
                            Common steps:
                            sh '...' → Run shell command (Linux/Mac)
                            bat '...' → Run batch command (Windows)
                            script { ... } → For advanced Groovy logic  

                🔹 PART 1: CI Jenkinsfile (Build + Test + Package)
                        📌 Purpose of CI
                        Compile code
                        Run tests
                        Perform code quality checks
                        Generate artifact (JAR / Docker Image)               

                    ✅ CI Jenkinsfile (Declarative Pipeline)
                            pipeline {
                                agent any

                                tools {
                                    maven 'Maven-3.9'
                                    jdk 'JDK-17'
                                }

                                environment {
                                    APP_NAME = "order-service"
                                    ARTIFACT_VERSION = "${BUILD_NUMBER}"
                                }

                                stages {

                                    stage('Checkout Code') {
                                        steps {
                                            git branch: 'main',
                                                url: 'https://github.com/company/order-service.git'
                                        }
                                    }

                                    stage('Compile') {
                                        steps {
                                            sh 'mvn clean compile'
                                        }
                                    }

                                    stage('Unit Tests') {
                                        steps {
                                            sh 'mvn test'
                                        }
                                    }

                                    stage('Code Quality Check') {
                                        steps {
                                            sh 'mvn pmd:pmd'
                                        }
                                    }

                                    stage('Package') {
                                        steps {
                                            sh 'mvn package -DskipTests'
                                        }
                                    }

                                    stage('Build Docker Image') {
                                        steps {
                                            sh '''
                                            docker build -t order-service:${ARTIFACT_VERSION} .
                                            '''
                                        }
                                    }

                                    stage('Push Artifact') {
                                        steps {
                                            sh '''
                                            docker tag order-service:${ARTIFACT_VERSION} nexus.company.com/order-service:${ARTIFACT_VERSION}
                                            docker push nexus.company.com/order-service:${ARTIFACT_VERSION}
                                            '''
                                        }
                                    }
                                }

                                post {
                                    success {
                                        echo "CI Pipeline completed successfully!"
                                    }
                                    failure {
                                        echo "CI Pipeline failed!"
                                    }
                                }
                            }
                                                
                   🧠 What This CI Pipeline Does (Simple Flow)
                                Pulls code from Git
                                Compiles source code
                                Runs unit tests
                                Checks code quality
                                Packages the application
                                Builds Docker image
                                Pushes image to artifact repository
                            🎯 CI Goal: Create a deployable artifact       

            
            
            🔹 PART 2: CD Jenkinsfile (Deploy to DEV / TEST / QA):
                    📌 Purpose of CD
                    Deploy artifact to environments
                    Apply approvals for higher environments    

                ✅ CD Jenkinsfile (Parameterized Deployment)
                    pipeline {
                        agent any

                        parameters {
                            choice(
                                name: 'ENVIRONMENT',
                                choices: ['DEV', 'TEST', 'QA'],
                                description: 'Select environment to deploy'
                            )
                            string(
                                name: 'VERSION',
                                defaultValue: 'latest',
                                description: 'Artifact version to deploy'
                            )
                        }

                        environment {
                            APP_NAME = "order-service"
                        }

                        stages {

                            stage('Approval (Only for TEST & QA)') {
                                when {
                                    expression { params.ENVIRONMENT != 'DEV' }
                                }
                                steps {
                                    input message: "Approve deployment to ${params.ENVIRONMENT}?"
                                }
                            }

                            stage('Deploy') {
                                steps {
                                    script {
                                        if (params.ENVIRONMENT == 'DEV') {
                                            sh './deploy-dev.sh ${VERSION}'
                                        }
                                        if (params.ENVIRONMENT == 'TEST') {
                                            sh './deploy-test.sh ${VERSION}'
                                        }
                                        if (params.ENVIRONMENT == 'QA') {
                                            sh './deploy-qa.sh ${VERSION}'
                                        }
                                    }
                                }
                            }

                            stage('Smoke Tests') {
                                steps {
                                    sh './smoke-test.sh'
                                }
                            }
                        }

                        post {
                            success {
                                echo "Deployment to ${params.ENVIRONMENT} successful!"
                            }
                            failure {
                                echo "Deployment to ${params.ENVIRONMENT} failed!"
                            }
                        }
                    }
                    
                🧠 How CD Pipeline Works (Example)
                        DEV Environment (Continuous Deployment):
                            CI finishes
                            Artifact auto deployed
                            No approval needed
                        TEST / QA (Continuous Delivery):
                            CI finishes
                            Manual approval required
                            Artifact deployed after approval    
                                                            
            🔹 PART 3: CI → CD Trigger (Best Practice)
                👉 CI triggers CD automatically for DEV
                            post {
                                success {
                                    build job: 'CD-Order-Service',
                                          parameters: [
                                              string(name: 'ENVIRONMENT', value: 'DEV'),
                                              string(name: 'VERSION', value: "${BUILD_NUMBER}")
                                          ]
                                }
                            }
                
            🔹 PART 4: Enterprise CI/CD Architecture (Text Diagram)    
                        Developer
                           ↓
                        Git Commit
                           ↓
                        Jenkins CI Pipeline
                           ↓
                        Artifact Repository (Nexus / ECR)
                           ↓
                        CD Pipeline
                           ├── DEV (Auto Deploy)
                           ├── TEST (Manual Approval)
                           └── QA (Manual Approval)
                           
        📁 Where Do You Put the Jenkinsfile?:
            In the root of your microservice’s Git repository
                    user-service/
                    ├── src/
                    ├── pom.xml
                    └── Jenkinsfile   ← HERE!
                    
        ✅ Summary
                Jenkinsfile = Your CI/CD pipeline written as code
                Lives in your Git repo → version-controlled, reusable, reviewable
                Uses stages to model your workflow (Build → Test → Deploy)
                Enables automated, consistent, and auditable software delivery
                Essential for microservices, enterprise, and DevOps practices       

Do We Have to Separate Jenkinsfile for CI and CD? :
    🔍 Short Answer:
        No, you don’t have to have separate Jenkinsfiles for CI and CD.
        In most real-world enterprise setups—including microservices—you typically use one Jenkinsfile that handles both CI and CD in a single pipeline, but logically separates them into stages.               
    👉 YES, it is recommended for enterprise projects
    There are 3 common approaches used in the industry.:
        Approach 1: Single Jenkinsfile (CI + CD Together)
            🔹 How it Works
                One Jenkinsfile
                Same pipeline does:
                Build
                Test
                Deploy to DEV / TEST / QA
                Example Flow:
                    Checkout → Build → Test → Deploy DEV → Approval → Deploy TEST → Approval → Deploy QA
                        user-service/
                        ├── src/
                        ├── pom.xml
                        └── Jenkinsfile   ← One file: CI + CD together                    
                    
            When to Use:
                Small projects
                Learning or POC
                Few developers
                Problem:
                ❌ Hard to maintain
                ❌ CI and CD tightly coupled
                ❌ Less secure     
        
        Approach 2: Separate Jenkinsfile for CI and CD (BEST PRACTICE ✅):   
            🔹 This Is What Enterprises Use:
                    user-service/
                    ├── src/
                    ├── pom.xml
                    ├── Jenkinsfile-CI     ← Only builds & tests
                    └── Jenkinsfile-CD     ← Only deploys (triggered manually or by another job)      
                Or:
                    CI Jenkinsfile → in application repo
                    CD Jenkinsfile → in deployment repo      

            Why Separate CI and CD?:
                    | Reason      | Explanation                        |
                    | ----------- | ---------------------------------- |
                    | Security    | Devs should not deploy to QA/Prod  |
                    | Scalability | Independent pipelines              |
                    | Reusability | Same CD pipeline for many versions |
                    | Control     | Manual approvals for higher env    |
                    | Audit       | Clear release tracking             |
            
            How Does Jenkins Know Where to Deploy After CI?:
                👉 This is the KEY QUESTION:
                Answer:
                    CI does NOT decide TEST or QA
                    CI only:
                    ✔ Builds
                    ✔ Tests
                    ✔ Publishes artifact

                    📌 CD decides environment
                    
    Step-by-Step Flow (Enterprise Standard):
            Step 1: Developer Commits Code
                Developer → Git
            Step 2: CI Pipeline Runs Automatically
                Git Webhook → CI Pipeline
                CI pipeline:
                    Builds code
                    Runs tests
                    Pushes artifac
                📌 CI ends here
                
            Step 3: CI Triggers CD for DEV Only (Optional)
                    post {
                        success {
                            build job: 'CD-Pipeline',
                            parameters: [
                                string(name: 'ENV', value: 'DEV'),
                                string(name: 'VERSION', value: "${BUILD_NUMBER}")
                            ]
                        }
                    }
                    
                ✔ DEV → Auto deploy
                ❌ TEST / QA → No auto deploy    
                                    
                    
            How Do TEST and QA Deployments Happen?:
                Option 1: Manual Trigger (Most Common)
                        Release engineer:
                            Opens Jenkins
                            Selects CD pipeline
                        Chooses:
                            ENV = TEST
                            VERSION = 25
                            Clicks Build
                        📌 Jenkins deploys selected version to TEST
                        
                Option 2: Promotion-Based Deployment (Advanced)     
                            DEV → TEST → QA
                            Same artifact promoted
                            Approval at each stage 
                            Example:
                                parameters {
                                    choice(name: 'ENV', choices: ['DEV', 'TEST', 'QA'])
                                    string(name: 'VERSION')
                                }
         
                This is how Jenkins knows where to deploy.
            
        Who Controls Environment Movement?:
                        | Stage | Who Triggers    |
                        | ----- | --------------- |
                        | DEV   | Automatic (CI)  |
                        | TEST  | QA Team         |
                        | QA    | Release Manager |
            📌 CI never auto deploys to TEST or QA
            
        Real Enterprise Pipeline View:
                    CI Pipeline (Auto)
                       ↓
                    Artifact Repository
                       ↓
                    CD Pipeline (Manual + Approval)
                       ↓
                    DEV → TEST → QA
                    
        🔑 Final Answer:
            CI and CD should be separate pipelines. CI builds and publishes artifacts, while CD controls environment deployment using parameters and approvals. Jenkins knows where to deploy based on CD pipeline parameters, not from CI logic.  

Parameters:
    🧩 Step 1 What Are Parameters in Jenkins?:
            Think of them like input boxes or dropdowns that pop up when you click “Build Now” in Jenkins
                What Is This parameters Block?:
                    parameters {
                        choice(name: 'ENV', choices: ['DEV', 'TEST', 'QA'])  // Dropdown menu
                        string(name: 'VERSION')                               // Text box
                    }
                👉 This block tells Jenkins:
                        “Before running this pipeline, ask the user some questions.”
                    So Jenkins will pause and wait for user input.   

                📥 ENV: User picks an environment from a dropdown: DEV, TEST, or QA.    
                📥 VERSION: User types a version (e.g., v1.2.3 or latest).    
            These become variables you can use later in your pipeline: ${ENV} and ${VERSION}.
            📌 These inputs decide:
                 Where to deploy
                 Which version to deploy    
                    
    ▶️ Step 2: How to Execute It:   
        👉 Parameters are used when the CD pipeline starts.
        Two ways to start CD pipeline:
            Scenario:
            You have a CD Jenkinsfile (maybe separate from CI) that deploys a pre-built artifact to a chosen environment. 
            4️⃣ Way 1: Manual Execution (Most Common):
                Step-by-Step Execution:
                    In Jenkins, you have a pipeline job (e.g., deploy-user-service).
                    You click “Build with Parameters” (instead of “Build Now”).
                A form pops up:
                    Dropdown: ENV → you pick QA
                    Text box: VERSION → you type v2.1.0
                Click “Build”.
                Jenkins runs your Jenkinsfile, and inside it:
                    ${ENV} = QA
                    ${VERSION} = v2.1.0
                Your deploy script uses these values:
                    sh "kubectl set image deployment/user-service user-service=my-registry/user-service:${VERSION} --namespace=${ENV.toLowerCase()}"  
                ✅ Result: Version v2.1.0 is deployed to the QA namespace!        
            
            Way 2: Auto Trigger from CI (Only for DEV):
                In CI Jenkinsfile:
                    post {
                        success {
                            build job: 'CD-Order-Service',
                            parameters: [
                                string(name: 'ENV', value: 'DEV'),
                                string(name: 'VERSION', value: "${BUILD_NUMBER}")
                            ]
                        }
                    }
                📌 No user interaction
                📌 Jenkins automatically sets parameters    
                    
                    
        Where Is CD Jenkinsfile Written?:
            Option 1: Inside Deployment Repository (Best Practice):
                        deployment-repo/
                         └── Jenkinsfile
                    ✔ Owned by DevOps team
                    ✔ Secure
                    ✔ Centralized deployment logic        

            Option 2: Separate File Name:  
                    repo/
                     ├── Jenkinsfile-CI
                     └── Jenkinsfile-CD
            Put the parameters block at the top of that file.   : 
                    pipeline {
                        agent any

                        parameters {
                            choice(name: 'ENV', choices: ['DEV', 'TEST', 'QA'], description: 'Target environment')
                            string(name: 'VERSION', defaultValue: 'latest', description: 'Docker image tag or JAR version')
                        }

                        stages {
                            stage('Deploy') {
                                steps {
                                    script {
                                        echo "Deploying version ${VERSION} to environment ${ENV}"
                                        // Example: deploy to Kubernetes
                                        sh "kubectl apply -f k8s/base/ -n ${ENV.toLowerCase()}"
                                        sh "kubectl set image deployment/user-service *=my-app:${VERSION} -n ${ENV.toLowerCase()}"
                                    }
                                }
                            }
                        }
                    }            
                
            💡 This file is only for deployment—no build, no tests. It assumes the artifact (e.g., Docker image my-app:v2.1.0) already exists.:        
            
        Do We Define Conditions in Jenkinsfile?:
        ✅ YES — absolutely
            This is how Jenkins decides what to do for DEV / TEST / QA.
            Example: Environment-Based Conditions
                    stage('Deploy') {
