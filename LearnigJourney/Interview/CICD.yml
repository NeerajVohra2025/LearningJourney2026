                                    git branch: 'main',
                                        url: 'https://github.com/company/orderms.git'
                                }
                            }

                            stage('Build JAR') {
                                steps {
                                    sh 'mvn clean package -DskipTests'
                                }
                            }
                            
                            // Optional: Deploy JAR to Artifactory
                            stage('Publish JAR to Artifactory') {
                                steps {
                                    sh '''
                                        mvn deploy:deploy-file \
                                          -DgroupId=com.yourcompany \
                                          -DartifactId=orderms \
                                          -Dversion=${BUILD_NUMBER} \
                                          -Dpackaging=jar \
                                          -Dfile=target/orderms-${BUILD_NUMBER}.jar \
                                          -DrepositoryId=artifactory \
                                          -Durl=${ARTIFACTORY_URL}/${ARTIFACTORY_REPO}
                                    '''
                                }
                            }

                            stage('Build Docker Image') {
                                steps {
