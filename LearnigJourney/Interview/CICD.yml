                // Jenkinsfile-CD — for Continuous Delivery

                pipeline {
                    agent any

                    parameters {
                        choice(
                            name: 'ENV',
                            choices: ['dev', 'test', 'qa'],
                            description: 'Target deployment environment'
                        )
                        string(
                            name: 'VERSION',
                            defaultValue: 'latest',
