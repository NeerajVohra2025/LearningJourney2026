OAuth2 (Open Authorization)

Authorization framework that enables secure access to resources

Allows applications to access resources on behalf of a user

Commonly used for machine-to-machine and user-based authorization

JWT (JSON Web Token):

Consists of:

Header

Payload

Signature

API Gateway validates JWT

Used for stateless authentication

OAuth2 Players

Resource Owner

User or application that owns the data

Client Application

Third-party application requesting access

Authorization Server

Issues access tokens (OAuth server)

Resource Server

Hosts protected resources (API server)

OAuth2 – Authorization Code Flow (Human Flow)
Pre-requisite

User and client must be registered with OAuth server

Steps

User clicks Login with Google / Facebook

User is redirected to OAuth provider login page

User enters credentials

OAuth server validates credentials

OAuth server returns Authorization Code to client

Client sends Authorization Code + Client ID + Client Secret to OAuth server

OAuth server returns:

Access Token (short-lived)

Refresh Token (long-lived)

Client sends access token to Resource Server

Resource Server validates token

Resource Server returns requested resource

OAuth2 – Client Credentials Flow (Machine-to-Machine)
Steps

Client sends request to OAuth server with:

Client ID

Client Secret

OAuth server validates client credentials

OAuth server issues Access Token

Client sends access token to Resource Server

Resource Server validates token and returns data


OAuth2 – Client Credentials Flow (Machine-to-Machine)

Payment service is a secured resource server

Order service wants to access payment service

Order service sends token request to OAuth server with parameters:

Client ID

Client Secret

Grant Type = Client Credentials

OAuth server validates request and returns:

Access Token

Refresh Token

Order service sends API request with access token to payment service

Design Patterns (Microservices)
Event Sourcing

Concept of auditing / tracking history

Records all events of a particular service (e.g., financial transactions, fraud tracking)

Instead of storing current state, store events

Reading data requires replaying events

Disadvantage:

Adding tables

Reading large event logs

Complexity increases

CQRS (Command Query Responsibility Segregation)

Separate write and read models

Write side → handles commands (create/update)

Read side → materialized views (optimized for reporting)

Improves performance and scalability

Strangler Pattern (Legacy → Microservices)

Incremental migration strategy

Gradually replace monolith functionality

Uses:

API Gateway

Spring Cloud Gateway

Avoids Big Bang migration

Front Controller

Implemented using:

API Gateway

Spring Cloud Gateway

Database per Service

Each microservice owns its own database

Avoids tight coupling

Shared Database (Anti-Pattern)

Multiple services using same DB

Leads to tight coupling

Not recommended

