Kafka Components
Broker

A Kafka cluster is composed of multiple brokers

Each broker is identified by a unique ID

Brokers store data and serve client requests

Brokers handle:

Receiving messages from producers

Serving messages to consumers

Topic

A Topic is a logical stream of messages

Messages are written to and read from topics

Topics are:

Named

Append-only logs

Example:

A traffic system publishing vehicle position updates → Topic = traffic-events

Partition

Topics are split into multiple partitions

Each partition:

Is an ordered, immutable sequence of messages

Can live on a different broker

Enables:

Parallelism

Scalability

High throughput

Messages in a partition are identified by an offset

Why Partitioning?

Improves:

Throughput

Parallel processing

Fault tolerance

Enables Kafka to handle large volumes of data

Workload is distributed across brokers

Replication

Kafka keeps multiple copies of partitions across brokers

These copies are called replicas

One replica is the leader

Others are followers

If leader fails:

A follower becomes the new leader

Ensures high availability

Record

A Kafka record consists of:

Key

Value

Timestamp

Headers (optional)

Stored in partitions

Used by consumers to make decisions based on metadata

Producer

Client application that publishes (writes) events to Kafka topics

Sends messages to the leader partition

Responsible for:

Choosing topic

Choosing partition (optional)

Producer Acknowledgements (acks)

acks = 0

Producer does not wait for acknowledgement

Fastest, possible data loss

acks = 1

Leader acknowledges write

No data loss if leader survives

acks = all

All replicas acknowledge

Strongest durability, slowest

Leader & Follower

Each partition has:

One leader

Multiple followers

Producers and consumers interact only with the leader

Followers replicate data from the leader

Consumer

Client application that reads (pulls) messages from Kafka

Uses polling mechanism

Tracks read position using offsets

Consumer Group

Consumers belong to a consumer group

Rules:

One partition → consumed by only one consumer in a group

Multiple consumers → partitions are divided among them

Enables:

Horizontal scalability

Load balancing

Example

Topic with 4 partitions

Consumer Group with 2 consumers:

Consumer 1 → partitions 0,1

Consumer 2 → partitions 2,3

If consumers > partitions:

Some consumers remain idle

Kafka Processing Model

Pull-based system

Consumers control:

Read speed

Offset management

Enables:

Backpressure handling

Reliable message processing

How Database Performs Data Synchronization Between Different Nodes?
Leader–Follower Model

Leader Node:

Handles writes

Follower Nodes:

Handle reads

CDC (Change Data Capture) Flow

Application writes data → Leader node

Leader node writes changes to DB Logs (short TTL)

CDC component reads logs from DB logs

CDC converts changes into Change Stream Events

Events are published to message broker

Other services consume events and update their data

