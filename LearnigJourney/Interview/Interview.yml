Collect logs from all instances

Analyze logs to identify exceptions / stack traces

Reproduce the issue in lower environment

Identify the root cause (RCA)

Fix the issue in local environment

Promote fix to higher environments

Obtain required approvals

Deploy fix to production

Perform RCA documentation

Add preventive actions

