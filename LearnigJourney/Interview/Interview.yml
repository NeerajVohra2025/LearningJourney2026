SAGA Pattern
Choreography

Event-driven communication

Each service performs a local transaction

If a transaction fails:

Service emits a compensating event

No central controller

Good for loosely coupled systems

Orchestration

Uses a Saga Orchestrator

Central component controls transaction flow

Calls services sequentially

If any service fails:

Orchestrator triggers rollback of previous services

Uses command-driven communication

