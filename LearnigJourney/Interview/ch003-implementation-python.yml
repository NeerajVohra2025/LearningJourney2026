Why This Structure?:

The repository now mirrors the PD-HECA architecture.
Instead of organizing code by frameworks or technologies, every directory has a well-defined architectural responsibility.
| Directory         | Responsibility                                                                                                                                 |
| ----------------- | ---------------------------------------------------------------------------------------------------------------------------------------------- |
| `bootstrap/`      | Application startup, dependency injection, FastAPI initialization, Google Cloud initialization, OpenTelemetry, Structured Logging              |
| `core/`           | Enterprise business logic and orchestration, independent of frameworks and cloud SDKs                                                          |
| `ports/`          | Interfaces (contracts) that define how the core communicates with external systems                                                             |
| `adapters/`       | Implementations of the ports, integrating with Vertex AI, Google Cloud services, REST APIs, MCP servers, databases, and other external systems |
| `configuration/`  | Application settings, configuration loading, and environment management                                                                        |
| `infrastructure/` | Technical infrastructure such as tracing, logging, security, metrics, and cloud client factories                                               |
| `shared/`         | Common constants, exceptions, utilities, and reusable models                                                                                   |

Root Configuration Files:
Several files reside at the project root because they apply to the entire application rather than a specific package.
.env:

Contains environment-specific values that should not be hardcoded in the application.

Typical examples include:
Google Cloud Project ID
Vertex AI Location
Environment Name
Service Name
Log Level
API Keys (for local development only)

The .env file should never be committed to source control.

config.toml:

Contains application configuration that is shared across environments and is not considered sensitive.

Examples include:

Default timeout values
Retry policies
Service metadata
Feature flags
Default model identifiers
Observability settings

Unlike .env, this file is typically version-controlled because it defines application behavior rather than secrets.

pyproject.toml:

The central configuration file for the Python project.

It defines:

Project metadata
Python version
Dependencies
Build configuration
Tool configuration

It is the authoritative source for the project's dependency and packaging configuration.

uv.lock:

Records the exact versions of all installed dependencies, ensuring that every environment resolves the same package versions.

requirements.txt:

Contains organized dependency lists grouped by concern rather than a single large file.


Principal Architect Insight:

In a Policy-Driven Hexagonal Enterprise Clean Architecture, the repository itself should communicate the architecture. A developer opening the project for the first time should immediately recognize the separation between the application core, its ports, the external adapters, the bootstrap process, and the infrastructure concerns. This architectural alignment reduces cognitive load, reinforces dependency direction, and makes the codebase easier to evolve without violating the core design principles.

Perfect. Now we move to the Bootstrap layer, because in a Policy-Driven Hexagonal Enterprise Clean Architecture (PD-HECA), everything starts from Bootstrap.
The startup sequence should be:
Application Starts
        │
        ▼
Bootstrap
        │
        ├── Load .env
        ├── Load config.toml
        ├── Initialize Logging
        ├── Initialize OpenTelemetry
        ├── Initialize Google Cloud
        ├── Initialize Vertex AI
        ├── Build Dependency Injection Container
        ├── Register Adapters
        ├── Build FastAPI Application
        └── Start Uvicorn
        
Notice that FastAPI is almost the last thing initialized, not the first.

Chapter 7:
Step 7.5 – Build the Bootstrap Layer:

Architecture Principle:
Bootstrap is the composition root of the application.
Bootstrap is responsible for assembling the application.
It creates every infrastructure component exactly once.
It wires dependencies.
It builds the Dependency Injection container.
It never contains business logic.
The Core never depends on Bootstrap.
Bootstrap is responsible for assembling the Enterprise AI Gateway.

Why Bootstrap?:
Many applications place everything inside main.py.
Example:
app = FastAPI()
logging.basicConfig(...)
vertexai.init(...)
tracer = ...
app.include_router(...)


This quickly becomes difficult to maintain.
Instead, Bootstrap owns startup.
main.py should only delegate to Bootstrap

Bootstrap Responsibilities:
Bootstrap is responsible for assembling the Enterprise AI Gateway.

It performs the following tasks in order:
   
| Step | Responsibility                       |
| ---- | ------------------------------------ |
| 1    | Load `.env`                          |
| 2    | Load `config.toml`                   |
| 3    | Initialize Configuration             |
| 4    | Initialize Structured Logging        |
| 5    | Initialize OpenTelemetry             |
| 6    | Initialize Google Cloud Clients      |
| 7    | Initialize Vertex AI                 |
| 8    | Build Dependency Injection Container |
| 9    | Register Ports and Adapters          |
| 10   | Build FastAPI Application            |
| 11   | Register Middleware                  |
| 12   | Register Exception Handlers          |
| 13   | Register Health Endpoints            |
| 14   | Start Uvicorn                        |


Bootstrap Runtime:
main.py
      │
      ▼
Bootstrap
      │
      ├── Configuration
      │
      ├── Logging
      │
      ├── Tracing
      │
      ├── Google Cloud
      │
      ├── Vertex AI
      │
      ├── Dependency Injection
      │
      └── FastAPI  
      
Notice something important:

Bootstrap creates infrastructure.

It never creates:

RequestContext
BusinessContext
Agent Runtime
Tool Executor

Those belong to runtime.     


What Gets Created During Bootstrap?:

The following are singleton services created once when the application starts:

Configuration:
Environment
Project ID
Region
Service Name 

Structured Logging:
Google Cloud Logging Client
Logger Factory
JSON Formatter


OpenTelemetry:
Tracer Provider
Resource
Exporter
Propagator


Google Cloud:
Secret Manager Client
Cloud Storage Client
Cloud Logging Client


Vertex AI:
Vertex AI Initialization
Model Registry
Default Region


Dependency Injection:

Registers:

Configuration Service
Logger Factory
Tracer
Vertex AI Client
Cloud Clients
Port Implementations


FastAPI:

Creates:

Application
Middleware
Routes
Health Endpoint


What Bootstrap Does NOT Create:

Bootstrap never creates request-scoped objects.

The following are created only when an HTTP request arrives:

Parent Trace Context
Root Application Span
Request Logger
ObservabilityContext
ExecutionContext
SecurityContext
PolicyContext
BusinessContext
RequestContext

This separation keeps startup concerns and request processing concerns independent.

Dependency Direction:
                Bootstrap
                     │
                     ▼
              Register Adapters
                     │
                     ▼
                 Ports
                     ▲
                     │
                  Core
                  
The Core knows only about Ports.:

Bootstrap wires concrete Adapter implementations to those Ports during application startup.   

Principal Architect Insight:

A common anti-pattern is allowing main.py to become the application's composition root, configuration loader, infrastructure initializer, dependency container, and web server entry point all at once. In a Policy-Driven Hexagonal Enterprise Clean Architecture, those responsibilities belong to the Bootstrap layer. Bootstrap assembles the application exactly once at startup, while the Core remains completely unaware of infrastructure, frameworks, and cloud SDKs. This separation preserves the inward dependency rule, simplifies testing, and allows infrastructure to evolve without affecting business logic.  


