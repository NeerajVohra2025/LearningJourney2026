Step 7.1 – Bootstrap the Enterprise AI Gateway Project using uv:
Benefits of uv
| Capability                              | Benefit                                                  |
| --------------------------------------- | -------------------------------------------------------- |
| High-performance dependency resolution  | Faster project setup and builds                          |
| Built-in virtual environment management | No need for separate `venv` commands                     |
| Lock file support                       | Reproducible builds across all environments              |
| Cross-platform consistency              | Same workflow on Windows, Linux, and macOS               |
| CI/CD friendly                          | Faster and deterministic pipeline execution              |
| Modern Python workflow                  | Simplifies dependency management and project maintenance |

mkdir enterprise-ai-gateway
cd enterprise-ai-gateway
uv init --package enterprise-ai-gateway

Understanding the Generated Files:
At this stage, each generated file has a specific purpose.
| File / Directory             | Purpose                                                                                |
| ---------------------------- | -------------------------------------------------------------------------------------- |
| `.gitignore`                 | Excludes generated files, virtual environments, and caches from source control.        |
| `.python-version`            | Specifies the Python version used by the project.                                      |
| `README.md`                  | Provides project documentation and onboarding information.                             |
| `pyproject.toml`             | The central configuration file for project metadata, dependencies, and build settings. |
| `src/enterprise_ai_gateway/` | Contains the Python package that will hold the Enterprise AI Gateway implementation.   |
| `tests/`                     | Contains unit, integration, and end-to-end tests.                                      |

The src layout is recommended for enterprise projects because it clearly separates source code from project configuration and reduces accidental import issues during development and testing.


Why the Package Name Uses Underscores:
Although the project directory is named enterprise-ai-gateway, the generated Python package is named enterprise_ai_gateway.
This is intentional.
Python package names cannot contain hyphens, so the project name is automatically converted to a valid Python package name using underscores.

Project Name	Python Package
enterprise-ai-gateway	enterprise_ai_gateway
This convention aligns with Python packaging standards and should be used consistently throughout the project.

