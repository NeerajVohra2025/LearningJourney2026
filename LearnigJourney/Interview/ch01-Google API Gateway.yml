What actually happens internally?:
Imagine ServiceNow sends:
POST /v1/incidents

Authorization: Bearer eyJhbGciOi...
API Gateway performs these operations before your Cloud Run service is invoked.

Step 1 — TLS Termination:
ServiceNow

        │ HTTPS

        ▼

Google Front End (GFE)

        │

TLS Handshake

        ▼

API Gateway

Google component:

Google Front End (GFE)

Purpose

Decrypt HTTPS traffic
Verify TLS certificate
Protect against common network attacks

Your application never handles TLS directly.    

Step 2 — Extract Authorization Header:
Authorization: Bearer eyJhbGc...
Gateway extracts:
Bearer Token
No validation yet.

Step 3 — Authentication:
Now Google verifies the token.

Internally:
Extract Token

        │

Validate Signature

        │

Validate Issuer

        │

Validate Audience

        │

Validate Expiration

        │

Validate Required Claims

Google services involved:
Google IAM

Identity Infrastructure

JWT Verification Engine


The gateway ensures:
✓ Signature is valid

✓ Token not expired

✓ Correct issuer

✓ Correct audience

✓ Token format valid

If any check fails:
401 Unauthorized

is returned immediately.

Cloud Run is never invoked.


Step 4 — Authorization:
Authentication asks:

Who are you?

Authorization asks:

Are you allowed to invoke this API?

Google IAM evaluates the caller's permissions.

Example:
Principal

↓

Google IAM Policy

↓

roles/run.invoker

↓

Allow

If permission is missing
403 Forbidden


Step 5 — API Key Validation (Optional):
Some organizations require:
x-api-key
Gateway validates
API Key

↓

Google Service Control

↓

Valid?
Failure
403 Forbidden


Step 6 — Quota Enforcement:

Google checks
Requests Per Minute

↓

Configured Quota

↓

Exceeded?
If exceeded
429 Too Many Requests


Step 7 — Rate Limiting:
Protects your AI platform.
Example
100 Requests

↓

1 Second

↓

Gateway
If limit exceeded
429 Too Many Requests


Step 8 — Request Routing:
Gateway determines

POST /v1/incidents

↓

API Configuration

↓

Cloud Run Backend

↓

Enterprise AI Gateway:

This routing is based on the deployed API configuration.

Step 9 — Logging:
Before forwarding the request, Google automatically records metadata.

Services:

Cloud Logging
Cloud Monitoring
Cloud Audit Logs

Captured information includes:

Timestamp
HTTP Method
URL
Response Code
Latency
Request Size
Response Size
Authenticated Principal
Trace Context (if present)

No application code is required.

