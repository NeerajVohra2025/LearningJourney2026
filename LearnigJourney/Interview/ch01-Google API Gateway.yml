What happens internally?:
Imagine ServiceNow sends
POST /v1/incidents

Authorization:
Bearer eyJhbGc...
Google API Gateway internally does something conceptually like this:
Receive Request

↓

Verify HTTPS

↓

Extract Authorization Header

↓

Validate Token

↓

Check IAM Permission

↓

Check API Configuration

↓

Check Quota

↓

Check Rate Limit

↓

Forward Request

You don't implement those steps—they're built into the managed service.:
What do you actually configure?
API Configuration:

paths:
  /v1/incidents:
  

backend:
   address:
      https://enterprise-ai-gateway.run.app  
      
This tells API Gateway where to forward authenticated requests.


Security:

security:
   OAuth2      
   
   or
securityDefinitions:
This configures how requests are authenticated.

Quotas:
1000 requests/minute

Routing:
POST /incident

↓

Cloud Run


What code do we write?:
Very little before Cloud Run.   

@app.post("/incident")
async def analyze_incident(request: IncidentRequest):

    ...
    
This is the first line of your application.:
Everything before that is Google's managed infrastructure.    