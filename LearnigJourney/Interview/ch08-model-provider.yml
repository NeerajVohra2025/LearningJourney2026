Step 1 – Receive the Model Request:

The Model Adapter receives:
RequestContext

+

ModelRequest
The ModelRequest typically contains:

Prompt
System Instructions
Temperature
Top-P
Maximum Tokens
Streaming Preference
Response Format
Model Capability Requirements

The RequestContext provides enterprise execution metadata.


Step 2 – Extract the ObservabilityContext:

The adapter retrieves the enterprise observability information.
        
RequestContext
        │
        ▼
ObservabilityContext
        │
        ├── Trace ID
        ├── Correlation ID
        ├── Parent Span
        └── Request ID        
        
        
A dedicated child span is created for model execution.

Step 3 – Create the Model Execution Span:
Gateway Span
      │
Responsible AI Span
      │
AI Orchestrator Span
      │
Agent Runtime Span
      │
Model Adapter Span

This span represents the complete interaction with the external AI provider.


Step 4 – Resolve the AI Provider:

The Model Adapter determines which provider should satisfy the request.

Example routing considerations include:

Required capabilities (text, vision, audio, embeddings)
Enterprise policy restrictions
Tenant preferences
Cost optimization
Geographic residency
Availability and failover
Latency objectives

Example:      

ModelRequest
        │
        ▼
Provider Selection
        │
        ├── Vertex AI
        ├── OpenAI
        ├── Anthropic
        └── Bedrock

The calling application remains unaware of the chosen provider.  


Step 5 – Translate the Enterprise Request:

Each provider exposes different APIs and request formats.

The Model Adapter converts the provider-independent ModelRequest into the provider's native request.

Examples of provider-specific differences include:      
Authentication mechanisms
Request schemas
Token parameter names
Streaming protocols
Tool-calling formats
Safety configuration
Response structures

This translation is hidden from the application layer.


Step 6 – Inject Trace Context:

Before calling the external provider, the Model Adapter propagates the active trace context where supported.
Current Span
        │
Inject Trace Context
        │
        ▼
AI Provider

If the provider supports OpenTelemetry or compatible propagation, the distributed trace continues.

If not, the enterprise trace still records the outbound dependency and correlates the response using trace and request identifiers.

Step 7 – Execute the Model:

The Model Adapter performs the model invocation.

Typical execution includes:

Authentication
Secure transport
Streaming or synchronous inference
Timeout enforcement
Retry policies
Provider failover
Rate-limit handling

These infrastructure concerns remain outside the application core.

Step 8 – Normalize the Response:

Each provider returns responses in its own format.

The Model Adapter transforms these into a standardized enterprise response.
ModelResult
│
├── Generated Content
├── Finish Reason
├── Token Usage
├── Latency
├── Safety Results
├── Provider Metadata
└── Diagnostics

The Agent Runtime receives a consistent interface regardless of the underlying provider.


Runtime Flow:
Receive ModelRequest
        │
Read RequestContext
        │
