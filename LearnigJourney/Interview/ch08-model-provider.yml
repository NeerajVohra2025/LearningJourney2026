Model Adapter vs Agent Runtime:
| Agent Runtime                               | Model Adapter                           |
| ------------------------------------------- | --------------------------------------- |
| Determines that model inference is required | Executes model inference                |
| Constructs prompts                          | Translates requests to provider APIs    |
| Coordinates execution                       | Communicates with external AI providers |
| Interprets results                          | Normalizes provider responses           |
| Remains provider-agnostic                   | Encapsulates provider-specific behavior |

