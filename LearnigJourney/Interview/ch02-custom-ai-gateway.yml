Principal Architect Clarification:
This is an important distinction that many teams get wrong.
Your application does not call the Cloud Trace REST API to create spans.
Instead:
Application
     │
     ▼
OpenTelemetry SDK
     │
     ▼
Cloud Trace Exporter
     │
     ▼
Google Cloud Trace

The application is SDK-driven, while the exporter is responsible for communicating with Google Cloud Trace.
