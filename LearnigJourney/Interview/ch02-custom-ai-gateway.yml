Unified RequestContext

Then, when the request reaches the AI Orchestrator, it enriches the contract by creating:

AIContext
which contains AI-specific metadata such as model selection, prompt version, token usage, conversation state, agent execution, tool calls, grounding, and evaluation metadata.

This keeps the Enterprise layer completely independent of the AI execution layer, which is fully aligned with the Policy-Driven Hexagonal Enterprise Clean Architecture (PD-HECA) and results in a cleaner, more maintainable platform.



Single Responsibility Matrix:
Each context should have exactly one owner and one purpose.

| Context              | Created By            | Purpose                       |
| -------------------- | --------------------- | ----------------------------- |
| ObservabilityContext | Enterprise AI Gateway | Tracing, logging, metrics     |
| ExecutionContext     | Enterprise AI Gateway | Runtime execution metadata    |
| SecurityContext      | Enterprise AI Gateway | Identity and authorization    |
| PolicyContext        | Enterprise AI Gateway | Enterprise policy decisions   |
| BusinessContext      | Enterprise AI Gateway | Business transaction metadata |
| RequestContext       | Enterprise AI Gateway | Aggregate enterprise contract |
| AIContext            | AI Orchestrator       | AI execution metadata         |
This enforces a clear ownership model and prevents overlap

