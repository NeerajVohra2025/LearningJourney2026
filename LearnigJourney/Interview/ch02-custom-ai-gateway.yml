Notice something new.
I intentionally added BusinessContext.                    

Why BusinessContext?:
Most AI platforms mix business information into ExecutionContext.
That is a design smell.
For example
Incident Number

Customer ID

Claim Number

Order Number

These are not execution data.
They belong to the business domain.
Therefore
                    
                    
ExecutionContext:
ONLY
Execution Metadata

while
BusinessContext:

ONLY

Business Information

This separation makes the architecture cleaner and allows the same platform to support multiple business domains without changing the execution model.

