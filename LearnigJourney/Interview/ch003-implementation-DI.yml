Chapter 7:
Step 7.7 – Build the Dependency Injection Container

Architecture Principle:

The Dependency Injection (DI) Container is the composition root of the application.

The DI Container assembles the entire application by wiring implementations to interfaces. It ensures that the Core remains completely independent of infrastructure, frameworks, and cloud SDKs.

The Core never creates objects using new, constructors, or factory methods. Instead, every dependency is provided by the DI Container.


Why Dependency Injection?:

Without a DI container, business logic often creates its own dependencies:
model = VertexAIAdapter()
logger = GoogleLogger()

This tightly couples the Core to infrastructure.

Instead, the Core depends only on abstractions (Ports), and the DI Container provides the concrete Adapter implementations.

Runtime Position:
Application Starts
        │
        ▼
Load Configuration
        │
        ▼
Initialize Infrastructure
        │
        ▼
► Build Dependency Injection Container
        │
        ▼
Register Ports
        │
        ▼
Register Adapters
        │
        ▼
Build FastAPI Application
        │
        ▼
Start Uvicorn


Container Responsibilities:

The DI Container is responsible for:

Creating singleton services
Managing object lifecycles
Resolving dependencies
Registering Port implementations
Wiring infrastructure to the Core
Providing request-scoped services when needed

It does not contain business logic.


Container Package Structure:
bootstrap/
└── container/
    ├── __init__.py
    ├── dependency_container.py
    ├── providers.py
    ├── registrations.py
    └── wiring.py
    
Dependency Registration Flow:
                Configuration
                      │
                      ▼
              Dependency Container
                      │
     ┌────────────────┼────────────────┐
     ▼                ▼                ▼
 Register Ports   Register Adapters  Register Services
     │                │                │
     └────────────────┼────────────────┘
                      ▼
               Build Application


