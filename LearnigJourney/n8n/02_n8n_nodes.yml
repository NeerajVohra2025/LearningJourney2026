Example:
 1) Get the relevant data (Order Id,Order Status, Order Value, Employee Name) from the DataWare House
 2) Filter the Order by their Status
 3) Calculate the total value of all the booked orders
 4) Notify the team members about the booked orders in the compan'y Discord channel
 5) Insert the details about the processing orders in Airtable for follow_up
 6) Schedule this workflow to run every Monday morning
 
 Workflow involves sending data from company's dataware house to two external services
    Discord/ email/Whatsup
    Airtable/Googlesheet
 Before that , the data has to be wrangled with general functions (conditional filtering, calculation,scheduling)
n8n provides integration for all these steps

Steps/Nodes:
    1) Getting data from Datawarehouse (endpoints known)
    2)Inserting data into Airtable
    3) Filtering orders
    4) Setting valuse for processing orders
    5) Calculating booked orders
    6) Notifying the team
    7) Scheduling the Workflow
    8) Actiating and examing the Workflow
