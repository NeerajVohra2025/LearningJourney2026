What is Generative Artificial Intelligence?:
Artificial Intelegence: Science of making machines to mimic human behavior
   Machine Learning: Branch of AI which focuses on the use of data and algorithims to imitate human behavior
        Deep Learning: Subeset of ML that focuses on building  artificial neural network (are desigined to mimic the structure of the human brain)that can learn from data
            Generative AI: Subset of deep-learning models that can generate hight quality text , image ,video, code based on the data they trained on
Basic Terminology:
Model:
  Algorithim + data on which trained
Prompt:
  Input provided to Model
Completion:
  Output of Model
Inference:
  Inference Parameters influence the Response generated by the Model
    Randomness and Diversity:
        Temprature: randomness less temprature means point to point no halusion
        Top K:  CutOff where the model no longer select the words, If K=50 , the modal selects from 50 of the most probable words
        Top P: Caps choices based on the sum of their probability
    Length: Controls the length of the generated response , Helps control the cost
        Length
        Max Length: 1-4096 tokens(1token~4char) Specify the maximum number of tokens to use in generated response
        Stop Sequence: Any keyword Configure Up to 4 sequences that the model recognize, After a stop sequence , the model stops generating further tokens. The returned text not contains the stoped sequence
    Repetetion: Helps control repetition in the generated response
        `Presence Penalty: Higher value to lower the probability of generating new tokens,that already appear at least once in the prompt or in the completion.
        Count Penalty:  Higher value to lower the probability of generating new tokens,that already appear at least once in the prompt or in the completion. Proportional to the number of appearance
        Frequency penalty:
        Penalize special tokens: special character
  Act of using model to generate the text is called Inference e.g Temprature , P Value , K Value, Max Token

Foundation Model:

BedRock Pricing:
Two Modes:
    On-Demand: Pay for what you use
        Text Generation Model: Charged for any input token processed, and every output token generated.
        Image Generated Model: Charged for every image generated.
        Embedding Model: Charged for every input token processed
    Provisioned Throughput: Primarily designed for large consistent inference workloads that need guarnteed throughput
    Can purchase model units for a specific base or cusom model with time commitment(1-6 months)
    Custom Model can be worked with Provisioned Throughput
   


Challanges In Machine Learning Models?:
 Each Model focused on Specific Task such as
    Text generation
    Summarization
    Q&A
   
 Needs Labeled data which requires human intervention and can be cost prohibitive

Key characteristics of Foundational Models?:
  Deep neural network techniques
  Unlabeled data- Trained on unlabeled data and self-superfised learning such as internet data
  Generalised - one FM for multiple tasks
  pre-trained models
  Large- exposed to vast amounts of data , enabling it to learn patterns and features from data.
  Expensive-Developing FM's is an expensive process that involves large amounts of computaional resources and experties
  Organization's can utilize exsisting FM's as the base for building task-specific models and Adapt them

How It Works?:
1- Prompt: Input
2- Tokenizer: text to number (vector)
3- Context Window: the number of tokens the model can take as input at once  
4- Foundation Model: based on prompt it generates the next word loop runs till it reaches its max token/stop sequence
5- Detokenizer: Once sentence is generated its sends to Detokenizer - converts the numbers to text
6- Completions:


Foundational Model: Broad Categorization of Models
