What is responsible AI:
 Responsible AI is a set of principles that help , guide the design, development ,deployment and use of AI systems in a safe, trustworthy and ethical way

Responsible AI -Guiding principles:
 Veracity and Robustness:
    Hallucinations:- LLM generates factually incorrect or fabricated response
    Veracity and Robustness:- Achieving correct outputs, even with unexpected or adversarial inputs
 
 Safety:
    Toxicity:- Generation of contents that is offensive, discriminatory or harmful
    Safety:- Preventing harmful system output and misuse.
 
 Privacy and Security:
    The model leaks private or confidential data from the data it has been trained on.
    Including PII data-names,address, phone number
    Copyright Infringment
    Privacy and Security:- Appropriately obtaining, using and protecting data and models
 
 Explainability:
    Example:- Credit Card application
        AI models are considered as black boxes
        Tranparent loan and credit approval process
    Explainability:- Explainable AI aims at implementing techniques to ensure decisions can be traced and explained
        Model Factor
        Prediction Accuracy
 
 Fairness:  (No bias)
    Example:- Tell me about famous musicians....
    Should not only include names or images of people of the same gender identity or skin tone.
    Fairness:- ensures diversity within an AI response.
 
 Transparency:
    Transparency:- Communicating information about an AI system so, stakeholders can make informed choice about the use
    Addresses quesions around:
        Biases
        ethical considerations
        regularity standards
 
 Controllability:
    Controllability:- focuses on mechanism to monitor and steer AI behavior.
    Data Quality Monitoring
    Model Monitoring
 
 Governance:
    Governance:- Incorporating best practices into the AI supply chain, including providers and developers
   
Responsible AI -Enterprise Concerns
   AI/ML Business Risks:
     Data Privacy
     Bias
     Black Box
     Non Compliance
     Safity
   Potential Negative Business Impacts:
     Damage to brand reputation
     Reduced Public trust
     Revenue Loss
     Regulatory backlash
     Customer Privacy Loss
     Hidden Cost
