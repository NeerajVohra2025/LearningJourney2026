🔗 Round 4 — Integration & Interoperability (Digital India Context):
Q8. How would you integrate an AI solution with legacy government platforms (eOffice, DIR, DigiLocker)?
Using an API Gateway + Anti-Corruption Layer pattern:
Adaptation: Wrap legacy SOAP/XML services (common in eOffice, NIC apps) with FastAPI adapters exposing REST/GraphQL.
Event Bus: Use Pub/Sub or Kafka for async integration — AI events (e.g., 'document classified') fan out without blocking.
Identity Federation: Integrate with ePGA / DigiLocker auth via OIDC/SAML; AI services never handle citizen credentials directly.
Data Contracts: Versioned OpenAPI specs + schema registry; AI services consume via typed clients.
Resilience: Circuit breakers, retries with backoff, DLQs — government systems have variable SLAs.
My SOA background (2007–2008) directly informs this — I've done this exact integration pattern for years."


