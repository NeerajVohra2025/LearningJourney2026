Q29. Why would you use Hexagonal Architecture for GenAI?:
Answer
GenAI systems are highly dependent on external infrastructure:
LLM providers
vector databases
cloud services
enterprise APIs
observability platforms
DLP services
If these dependencies are embedded directly inside business logic, the application becomes difficult to test and replace.

I would therefore structure it as:
                 Inbound Adapter
                       |
                       v
             +-------------------+
             | Application Core  |
             |                   |
             | Business Logic    |
             | Policies          |
             +-------------------+
                |             |
             Ports          Ports
                |             |
                v             v
          LLM Adapter    ServiceNow Adapter
                |             |
                v             v
           Vertex AI      ServiceNow        
The core decides WHAT.
Ports define the CONTRACT.
Adapters define HOW.
Policies decide WHETHER.
That gives us flexibility, testability and governance.      


