Q2. What is the difference between a traditional application and a GenAI application?:

Non-determinism: Traditional contracts are input → output. GenAI contracts are input → probabilistic behavior → governed output. You design for behavior, not just function.
New architectural dimensions: Beyond latency/throughput, you must architect for safety, cost-per-token, hallucination control, prompt/context management, model routing, and auditability.
Governance as a first-class concern: In traditional systems, security is a layer. In GenAI, Responsible AI (guardrails, PII redaction, content safety, HITL) is woven into every request path.
Model volatility: Models evolve quarterly. Architecture must absorb model swaps without breaking consumers — hence ports-and-adapters / hexagonal design for AI capabilities.
Strong answer should mention:
deterministic vs probabilistic behavior
hallucination
prompt injection
model risk
data leakage
non-deterministic output
evaluation challenges
token/cost variability
model version changes
governance requirements

A Principal Architect should naturally connect these to architecture.
