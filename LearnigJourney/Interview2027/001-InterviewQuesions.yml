Hi, I’m **Neeraj Vohra**.

I have **20+ years of experience in software architecture and technology**. My career started with **Java and distributed systems** and evolved through **solution architecture, cloud modernization, cloud-native platforms, Kubernetes, DevOps, and infrastructure automation**. Over the last three years, I have been deeply focused on **Generative AI and Agentic AI**.

