Q13. How do you implement end-to-end observability for a multi-agent GenAI system?
Model Answer:
"Using W3C Trace Context as the backbone:
traceparent propagates from API gateway → Agent 1 → Agent 2 → MCP tool → Vertex AI → back.
baggage carries tenant ID, policy verdict, model name.
OpenTelemetry SDK in Python/FastAPI auto-instruments; custom spans for guardrail decisions, RAG retrieval, token usage.
Export to Cloud Trace (distributed traces), Cloud Logging (structured logs correlated by trace_id), Cloud Monitoring (dashboards), Prometheus + Grafana (custom metrics).
Alerts: Guardrail rejection rate, p95 latency, token cost/minute, error rate.
This gives a single pane of glass from citizen request to model response — essential for MeitY audits."


🧪 Round 7 — Scenario & Trade-off Questions
Q14. A ministry wants to deploy a citizen-facing GenAI chatbot in 8 weeks. How do you architect for speed without compromising governance?
Model Answer:
"I'd use a Platform Accelerator approach:
Weeks 1–2: Reuse AI Platform Services (guardrails, prompt mgmt, DLP, observability) — don't rebuild.
Weeks 3–4: Build domain RAG on Vertex AI Search with ministry documents; ground all responses.
Weeks 5–6: FastAPI chatbot + HITL escalation path + Model Armor integration.
Weeks 7–8: Load testing, red-teaming (prompt injection tests), MeitY compliance checklist, Go/No-Go with audit evidence.
Key trade-off: Start with a narrow, grounded scope (e.g., scheme eligibility only) rather than open-domain chat. Expand post-launch with evidence."


Q15. The data science team wants to use the latest open-source model; the security team says only empanelled models. How do you resolve this?
Model Answer:
"This is a Policy Engine decision, not a debate:
Evaluate the open-source model against MeitY's AI Assurance framework (bias, safety, provenance).
If it passes → submit for empanelment; run in a sandboxed GKE environment with no citizen data.
Meanwhile, route production traffic to an empanelled model via the Model Router — data science can A/B test in shadow mode.
Once empanelled, promote via GitOps canary.
This preserves innovation velocity while maintaining compliance — exactly what unified architecture governance means."

