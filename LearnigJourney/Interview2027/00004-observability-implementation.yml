Chapter 35 — Final Mental Model:
The complete observability implementation can be remembered as:

AUTHENTICATE
      ↓
BUSINESS CONTEXT
      +
TRACE CONTEXT
      ↓
OBSERVABILITY CONTEXT
      ↓
EXECUTE BUSINESS LOGIC
      ↓
CREATE STRUCTURED EVENT
      ↓
VALIDATE EVENT
      ↓
DLP PROTECT
      ↓
CLOUD LOGGING
      +
CLOUD TRACE
      ↓
PROPAGATE CONTEXT
      ↓
