Chapter 25 — Observability Utility Initialization:
The observability utility must be initialized once during application startup.
Conceptually:
observability = build_observability_utility(settings)
Do not create a new observability utility for every HTTP request.

25.1 Typical Configuration:
project_id
log_name
DLP configuration
logging failure behavior
trace generation behavior
Example:
project_id = my-dev-project
log_name = genai-application
logging_failure_behavior = continue
generate_context_when_missing = true
The utility can then be reused by all requests handled by the service.
---

Chapter 26 — What Must Never Be Logged:
The observability platform must not become a repository for sensitive application content.

The following must not be logged:
Passwords
Credentials
Access Tokens
Authorization Headers
Raw Prompts
Model Responses
Chain-of-Thought
Complete Customer Payloads
Complete Tool Inputs
Complete Tool Outputs
DLP is an additional protection layer.
It is not permission to log information that should never have been logged.
---

Chapter 27 — Failure Handling Standard:
Observability failures must have explicitly defined behavior.
The three primary failure boundaries are:

                   Observability
                       |
          +------------+------------+
          |            |            |
          v            v            v
         DLP        Logging       Trace
       Failure      Failure      Failure
          |            |            |
          v            v            v
      Fail Closed   Continue/      Raise
                    Raise


27.1 DLP Failure:
Required behavior:

DLP Failure
    |
    v
STOP LOG DELIVERY
    |
    v
Never send raw event


27.2 Cloud Logging Failure — Continue Mode:
Conceptually:

Logging Failure
      |
      v
Return failure status
      +
Increment logging failure metric
      +
Continue business processing

The exact continuation behavior remains subject to the service's configured policy.


27.3 Cloud Logging Failure — Raise Mode:
Logging Failure
      |
      v
Propagate provider exception

The behavior must be explicitly configured rather than being left to individual developers.
---

Chapter 28 — Local Validation:

Before connecting to real Google Cloud services, the observability implementation should be validated locally.
Minimum validation should confirm:

PASS — Same trace ID across services
PASS — Unique span IDs
PASS — Correct parent span
PASS — Correct parent service
PASS — Structured event format
PASS — DLP protection behavior
PASS — Configured log name

The purpose is to identify implementation problems before consuming cloud resources.
---

Chapter 29 — Google Cloud Smoke Test:
After local validation, execute a real cloud smoke test.

The test should follow:

Create Synthetic Event
        |
        v
Create ObservabilityContext
        |
        v
Create Structured Payload
        |
        v
DLP Protection
        |
        v
Cloud Logging
        |
        v
Cloud Trace
        |
        v
Query Cloud Logging
        |
        v
Verify Original Synthetic PII
Is NOT Stored
        |
        v
PASS

The most important security validation is:

Original synthetic sensitive value
        |
        X
        |
Not present in stored log

This confirms that the implementation is not merely logging successfully; it is logging with the required protection.
---

Chapter 30 — Operational Troubleshooting Flow:
When an incident occurs, operations should follow this sequence.

Step 1 — Start With Business Identity:
Search using:
incident_number
Example:
INC2093356

Step 2 — Identify the Request:
Find:
request_id
correlation_id
execution_id
Example:
request_id = REQ-3001

Step 3 — Find the Trace:
Identify:
trace_id = TRACE-100

Step 4 — Follow the Span Tree:
TRACE-100
   |
   +-- Orchestrator
   |
   +-- Incident Agent
   |
   +-- ServiceNow Tool

Step 5 — Identify the Failed Operation:
Check:
service
operation
event_name
outcome
duration_ms

Step 6 — Review Protected Logs:
Review the corresponding Cloud Logging events.
Do not expect raw prompts, complete tool payloads, credentials, or other prohibited content to be present.
---

Chapter 31 — Responsibility Model:
The architecture separates responsibilities clearly.

Capability	                                                    Primary Question
Authentication	                                                Who is calling?
Authorization /Business Policy	                                What are they allowed to do?
BusinessContext	                                                Which business request is this?
TraceContext	                                                Which technical journey is this?
ObservabilityContext	                                        Where are we executing now?
Structured Logging	                                            What happened?
DLP	                                                            Is eligible logged data protected?
Cloud Logging	                                                Where is searchable operational evidence stored?
Cloud Trace	                                                    How did the request execute across services?

This separation keeps the architecture understandable and governable.
---

Chapter 32 — Developer Implementation Checklist:
Every new GenAI service integrating the observability utility should follow this checklist.

Application Startup:
[ ] Load observability configuration
[ ] Initialize DLP configuration
[ ] Initialize Cloud Logging configuration
[ ] Initialize Cloud Trace configuration
[ ] Create one observability utility instance

Request Entry:
[ ] Authenticate caller
[ ] Establish trusted business identity
[ ] Extract/create trace context
[ ] Create ObservabilityContext

Business Processing:
[ ] Execute business logic
[ ] Measure duration
[ ] Determine outcome
[ ] Create appropriate typed payload

Logging:
[ ] Validate payload
[ ] Validate request/correlation identity
[ ] Add trace/span lineage
[ ] Apply DLP
[ ] Fail closed if DLP fails
[ ] Write protected event to Cloud Logging

Trace:
[ ] Create completed service span
[ ] Export span to Cloud Trace

Downstream Calls:
[ ] Call inject_headers()
[ ] Propagate trace context
[ ] Propagate approved business context
[ ] Add authentication separately
[ ] Call downstream service

Cleanup:
[ ] Clear request-local context
[ ] Prevent context leakage between requests
