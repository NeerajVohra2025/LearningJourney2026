Chapter 22 — What Happens to One Event?:
Consider the Incident Agent completion event.   
The lifecycle is:

Incident Agent
      |
      | 1. Build AgentLogPayload
      v
Structured Event
      |
      | 2. Validate
      v
Validated Event
      |
      | 3. Add Trace / Span
      v
Correlated Event
      |
      | 4. DLP Protection
      v
Protected Event
      |
      | 5. log_struct()
      v
Google Cloud Logging

At the same time:

Incident Agent
      |
      | write_trace_span()
      v
TraceServiceClient.create_span()
      |
      v
Google Cloud Trace

Both systems therefore represent the same service operation using the same trace/span identity. 
---

Chapter 23 — Google Cloud Capabilities:
The observability implementation uses a small number of Google Cloud capabilities.
Google Cloud Capability	                                API / Method	                                    Purpose
Sensitive Data Protection	                            DlpServiceClient.deidentify_content()	            Protect sensitive log values
Cloud Logging	                                        cloud_logging.Client()	                            Create Logging client
Cloud Logging	                                        Client.logger()	                                    Select configured log
Cloud Logging	                                        Logger.log_struct()	                                Write structured event
Cloud Trace	                                            TraceServiceClient()	                            Create Trace client
Cloud Trace                                         	TraceServiceClient.create_span()	                Export completed span
ADC                                                 	Google authentication chain	                        Authenticate workload
IAM	                                                    Google Cloud IAM	                                Control permissions
