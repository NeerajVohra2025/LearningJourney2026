Chapter 24 — Google Cloud Prerequisites:
Before application implementation, the required Google Cloud services must be available.

24.1 Required APIs:
dlp.googleapis.com
logging.googleapis.com
cloudtrace.googleapis.com


24.2 DLP Configuration:
DLP inspection and de-identification templates must be available according to the target environment and configured deployment model.
Example:
Environment: DEV
Region:       us-central1
DLP Inspect Template
DLP De-identification Template

24.3 Runtime Identity:
The service runtime identity must have the required minimum permissions for:
DLP
Cloud Logging
Cloud Trace
Possible runtime environments include:
Cloud Run
GKE with Workload Identity
Virtual Machines
