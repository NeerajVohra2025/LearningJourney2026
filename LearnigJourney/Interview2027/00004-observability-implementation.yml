Chapter 33 — Enterprise Golden Rules:
The following rules are mandatory design principles for the observability implementation.

Rule 1 — Authenticate Before Trusting Context:
Authenticate
     ↓
Trust Business Context

Rule 2 — One Distributed Journey Uses One Trace ID:
Orchestrator
     |
     +-- Agent
            |
            +-- Tool

All belong to the same trace_id.

Rule 3 — Every Service Operation Gets Its Own Span:
Orchestrator → SPAN-001
Agent        → SPAN-002
Tool         → SPAN-003

Rule 4 — Business Identity and Technical Identity Are Different:
BusinessContext = What business request?
TraceContext    = What technical journey?

Rule 5 — Use Structured Events:
Do not rely on arbitrary free-text logs.

Rule 6 — Never Log Sensitive Application Content:
Do not log credentials, tokens, raw prompts, model responses, chain-of-thought, or complete customer/tool payloads.

Rule 7 — DLP Is Fail-Closed:
DLP Success
    ↓
Protected Log
    ↓
Cloud Logging
DLP Failure
    ↓
STOP

Rule 8 — DLP Is Not Permission to Log Everything:
Data that should never be logged must not be logged even if DLP exists.


Rule 9 — Authentication Must Remain Separate From Observability:
Observability propagates identity and trace lineage.
Authentication provides authorization credentials.

Rule 10 — Observability Records; It Does Not Decide:
Business policy decides what the application is allowed to do.
Observability records what happened.
---

