Dimension	                                        MCP	                                A2A
Primary relationship	                            Agent ↔ Tool	                    Agent ↔ Agent
Purpose	                                            Tool/data access	                Agent collaboration
Public abstraction	                                Tools, resources, prompts	        Agent capabilities/skills
Typical target	                                    API, DB, SaaS, filesystem	        Another autonomous agent
Work model	                                        Tool operation	                    Task-oriented collaboration
Discovery	                                        MCP server capabilities	            Agent Card
Business work	                                    Usually operation-oriented      	Long-running task-oriented
Enterprise example	                                SAP API	                            Finance Agent
