4.6  Artifact — The Business Deliverable:
After 20 minutes a contract review should hand you RiskReport.pdf, not the sentence "Contract Reviewed". Task is the work, the Executor does it, Messages are the communication, Artifacts are the deliverables.


Message	                                            Artifact
Communicates status	                                Contains the deliverable
Small, text or JSON	                                Can be large, any format (PDF, Excel, CSV, image, code, slides, audio, video)
Used during execution	                            Produced as the result of execution
"Budget approved. See the attached report."	        BudgetApprovalReport.pdf


One Task can produce several Artifacts (a PDF summary, an Excel risk matrix, a Word file).
Do not push a 100 MB PDF through every message. The message says "Report ready" and references the Artifact.
Only outputs are Artifacts. A user-supplied Passport.pdf is an input file. The agent-generated VisaApproval.pdf is an Artifact.
Skill, Task and Artifact are three different things: "Generate Invoice" (Skill), "Generate Invoice for Order 1023" (Task), Invoice1023.pdf (Artifact).
