4.3  Tasks: the unit of work:
A simple POST /employees finishes in milliseconds, so plain REST is enough. Booking an international trip involves budget, policy, grade, cost centre, SAP, exchange rates, an LLM and perhaps a manager who replies two hours later. Holding one HTTP request open that long is impractical: timeouts, memory, connection limits, network failures and retries all bite. A2A therefore replaces request-response with a Task, like opening a support ticket.

Definition:
A Task is a long-lived unit of work representing a business goal delegated from one agent to another. It can run seconds, minutes, hours or days without holding one HTTP request open. Each Task has a unique ID.

Compare	                            Distinction
Task vs HTTP request	            A request is short-lived, stateless and ends with the response. A Task persists until the work finishes, has identity and state, and its progress can be tracked. The request creates the Task. It is not the Task.

Task vs session	                    A session is the ongoing conversation between two agents. A Task is one piece of work. One session can contain many Tasks (approve budget, generate invoice, validate expense). The A2A concept for this is a context identifier.

Task vs workflow	                The workflow (read budget, check policy, get approval) runs inside the Task.

Task vs Skill	                    "Approve Budget" is the Skill, published in the card. "Approve Budget for Employee 123" is the Task, created at runtime.

A Task is responsible for: representing one business request, keeping a unique ID, tracking progress through states, holding execution context, and carrying results as messages and artifacts.


4.3.1  Task as an Enterprise Ticket:
A useful analogy is an IT ticket.

Ticket Created
      |
      v
Assigned
      |
      v
Working
      |
      v
Waiting
      |
      v
Completed

Similarly:

A2A Task
   |
   v
Submitted
   |
   v
Working
   |
   +--> Input Required
   |
   +--> Failed
   |
   v
Completed


4.3.2  Task Lifecycle:
                    Create Task
                      |
                      v
                  Submitted
                      |
                      v
                   Working
                 /    |     \
                /     |      \
               v      v       v
       Input Required Failed Completed
               |
               v
            Working
               |
               v
           Completed

The important principle:

A Task is stateful work, not simply an HTTP request.

State	                   Meaning	                                                                                                Next states

Submitted	              Accepted and stored, ID issued, no work started. Created by the receiving agent, never by the client.	    Working, Failed, Cancelled

Working	                  Executor is actively processing. Many internal steps happen here without changing state.	                Input Required, Completed, Failed, Cancelled

Input Required	          Paused for approval or missing information. The Task is waiting, not failed. Resumes as the same Task.	Working, Cancelled, Failed

Completed	              Finished successfully. Terminal.	                                                                        None

Failed	                  Execution ran but did not succeed (for example SAP unavailable). Terminal.	                            None

Cancelled	              Stopped at the client's request. Terminal.	                                                            None


Submitted State:

When Finance accepts the request:

Task ID:
TASK-1001

Status:
Submitted

This means the Task has been accepted but execution has not necessarily completed.
The server owns the Task state.


Working State:

The Executor starts processing.

For example:

Working
   |
   +--> Read Employee
   |
   +--> Read Budget
   |
   +--> Read Policy
   |
   +--> Query SAP
   |
   +--> LLM Reasoning

The Task may remain in Working while many internal operations execute.



Input Required:

One of the important enterprise scenarios is waiting for external input.

For example:

Finance Agent
      |
      v
Policy Check
      |
      v
Manager Approval Required

Instead of failing:

Task
  |
  v
Input Required

After approval:

Input Required
      |
      v
Working
      |
      v
Completed

The same Task continues.



Failed and Cancelled States:

A Task can also reach a terminal state such as:

Failed

or:

Cancelled

For enterprise systems, the Task state should be treated as an explicit state machine rather than assuming every request has an immediate response.


Who owns state:
Only the executing agent changes a Task's state. The Travel Agent can request cancellation but cannot mark the Finance Agent's Task Completed.

State vs progress vs result:
Progress (10%, 60%, 90%) changes while state stays Working. Completed means execution finished. The outputs are the messages and artifacts attached to the Task.
---



4.4  Executor: the engine behind every Task:

Nothing executes itself. The Task is a data object, like a printed work order. The LLM only reasons. The Agent is a logical identity. The component that does the work is the Executor.

Definition:

The Executor is the runtime component that reads the Task, understands the requested Skill, invokes tools, communicates with other agents, updates Task status and produces the result.

Conceptually:

The Agent Card does not execute anything.
The Skill describes what the agent can do.
The Task represents what needs to be done.
The Executor performs the work.

Agent Card
     |
     v
Discovery
     |
     v
Skill
     |
     v
Task
     |
     v
Executor
     |
     +----> LLM
     |
     +----> MCP
     |
     +----> APIs
     |
     +----> Database
     |
     +----> Other Agents
     
Agent:
Identity, Skills, capabilities, Agent Card. "Who am I?" Like a class.

Executor:
Execution, reasoning, tool calls, workflow, task updates. "What am I doing?" Like the running object.

The Executor coordinates everything a Task needs: an LLM for reasoning (not every Task needs one, an exchange-rate lookup can call the API directly), MCP tools for SAP and ServiceNow, REST for legacy systems, A2A for other agents, retries, waiting, streaming progress and artifact generation. If the agent is built with LangGraph or the OpenAI Agents SDK, the Executor runs that graph or SDK agent and keeps responsibility for the Task lifecycle.   
