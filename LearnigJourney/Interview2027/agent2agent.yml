4.2 Skills: the public business contract
A Skill answers what business problem can this agent solve, never which APIs does it call. It is the entry point to business logic and the public contract of the agent.
For Finance:

Approve Budget
Expense Validation
Generate Invoice
Travel Reimbursement
Project Cost Analysis

These are business capabilities.

A good Skill:
Represents a business function
Hides internal tools
Stays stable while technology changes
Is published in the Agent Card
Can be reused by many clients

Remember:
A Skill is not executable code
They are not implementation details.
The Executor fulfils it
An agent can publish several Skills, and the client picks one


4.2.1 Skill vs Tool:
This distinction should be kept very clear.
Skill	                                        Tool
Business capability	                            Technical operation
Public agent capability	                        Internal implementation
Published in Agent Card	                        Used internally
"Approve Budget"	                            query_sap()
"Expense Validation"	                        get_employee()
"Generate Invoice"	                            create_invoice()

For example:

Travel Agent
      |
      | A2A
      v
Finance Agent
      |
      | Skill: Approve Budget
      |
      v
Executor
      |
      +--> MCP --> SAP
      +--> MCP --> Policy DB
      +--> REST --> Legacy API
      +--> LLM --> Reasoning

The Travel Agent should not need to know how Finance internally implements Approve Budget.

The source calls this implementation hiding


4.2.2 Why Skills Create Loose Coupling?:
Today Finance might use:

SAP

Tomorrow Finance might migrate to:

Oracle ERP

The Travel Agent should still call:

Approve Budget

The public business capability remains stable even if the internal implementation changes.
