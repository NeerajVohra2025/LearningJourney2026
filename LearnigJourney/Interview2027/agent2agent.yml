4. A2A six building blocks:

Block	                          One-line meaning	                                                        Everyday analogy
Agent Card	                      Machine-readable identity and capability document	                        Business card plus resume
Skill	                          A business capability the agent offers	                                "Heart surgery", not "scalpel"
Task	                          One long-lived unit of delegated work, with an ID and a state	            A support ticket
Executor	                      Runtime component that actually performs the Task	                        The employee who picks up the ticket (like a kubelet running a Pod)
Message	                          One piece of communication inside a Task	                                Status emails on a project
Artifact	                      A deliverable the Task produces	                                        The Excel file, not the "done" email


4.1 Agent Card: how agents discover each other
Before one agent can use another agent, it needs to know:

Question	                            Answered by
Who are you?	                        Name, description, provider, version
Where are you?	                        URL or endpoint
What can you do?	                    Skills
How should I communicate?	            Supported transports and capabilities
How do I authenticate?	                Authentication requirements
Which protocol version?             	A2A version and compatibility

This information is provided through an Agent Card.

Field	                                Purpose	                                                                Example
name	                                Identifies the agent	                                                Finance Agent
description                         	Lets a client choose among, say, 20 discovered agents	                Handles budget approval and expense validation.
url                                     Where tasks are sent. Without it nobody can call you.	                https://finance.company.com
version	                                Compatibility checks between client and server	                        1.0.0
provider	                            Owning team, useful when several finance agents exist   	            Finance Department
authentication                      	How to authenticate: OAuth, bearer token, API key, mTLS 	            OAuth
skills	                                Business capabilities (the most important field)	                    Approve Budget, Generate Invoice
capabilities	                        Protocol features: streaming, push notifications, artifacts, history	Streaming, notifications
defaultInputModes	                    Input formats accepted	                                                Text, JSON, file
defaultOutputModes	                    Output formats produced	                                                Text, JSON, PDF, CSV
documentation	                        Link to developer docs	                                                Wiki page
icon	                                UI only: marketplaces, portals	                                        finance.png
tags                                	Search and categorisation                                           	finance, budget, expense

Skills vs capabilities:
Skills are what the agent does (Approve Budget). Capabilities are how it communicates (streaming, push notifications). Chef analogy: skill is "cook pizza", capability is "home delivery".

Lifecycle facts:
Built once at startup. Served to other agents, not read by its own agent. Usually cached by clients. Changes only when skills, capabilities or version change.

Key point:
The Agent Card is metadata. It never executes anything. Discovery always comes first: need an agent, read its card, validate, then create a Task.


