Why A2A → What is an Agent → Agent Discovery → Agent Card → Skills → Task → Task State → Executor → Messages → Artifacts → Transport → MCP + A2A → Implementation → Enterprise Architecture → Design Review → Interview Checklist:

1. Executive Summary:
Modern enterprises are moving from a single AI assistant toward multiple specialized AI agents.
For example:
Travel Agent
Finance Agent
HR Agent
Legal Agent
IT Agent
Customer Support Agent

Each agent may have its own:

LLM
memory
planner
tools
APIs
business rules
workflow
technology stack

The challenge is:
How should independently developed AI agents communicate with each other?
Traditional REST APIs can be used, but they create tight coupling because the calling agent must understand the target agent's API, endpoint, request format, authentication and implementation details.
A2A addresses this problem by providing a standardized model for agent discovery, capability advertisement, task delegation, progress communication and result exchange.


A2A:
An open protocol that defines how independent AI agents discover each other, communicate, delegate work, track progress, exchange messages and return results in a standard way.
A2A is to agents what HTTP is to the web, and what MCP is to tools. It is not an agent framework. It does not replace LangGraph, CrewAI, Google ADK or the OpenAI Agents SDK. Those build agents. A2A lets agents built with any of them talk to each other without knowing each other's internals.
Business benefit. Without A2A, the Travel Agent needs a custom integration to Finance, another to HR, another to Legal. With A2A, it speaks one protocol to any agent.


A2A as an open protocol for independent AI agents to:

Discover each other
Understand capabilities
Delegate work
Create and manage tasks
Exchange messages
Track progress
Exchange artifacts
Return results
Agent frameworks build agents. A2A allows independently built agents to communicate.
---

2. The Business Problem A2A Solves:
2.1 Before AI Agents:

Traditional enterprise architecture typically looks like:

                    User
                      |
                      v
               Web Application
                      |
        +-------------+-------------+
        |             |             |
        v             v             v
      HR API        SAP API      Database

Systems communicate using technologies such as:

REST
gRPC
SOAP
Message Queues

The calling application knows:

Which API to call
Which URL to use
Which request schema to send
Which response schema to expect
How authentication works

This model works well when systems are deterministic and APIs are stable.
