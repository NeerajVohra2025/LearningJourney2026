3. The Arrival of AI Agents:

Now consider an enterprise Travel Assistant.

A user asks:

"Book my business trip to London and verify whether my budget is approved."

The Travel Agent may need:

Flight information
Hotel information
Employee information
Company travel policy
Budget information
Finance approval
Visa information

One large AI agent could potentially handle everything.

But that creates another problem.


3.1 Why Not Build One Giant Agent?:
A single agent that owns travel, finance, HR, legal, sales, IT and procurement becomes a very large prompt, a huge memory, a pile of tools, slow, expensive and hard to maintain. Companies organise people into specialists, and the same shape works for agents: one expert agent per domain.

3.2 The new problem: agents must collaborate
A user asks the Travel Agent: "Book my flight and verify budget approval." The Travel Agent cannot approve budgets. Only the Finance Agent knows the budget rules. How should one talk to the other?


Attempt                             	Why it fails
Custom REST API	                        The Travel Agent must know the Finance URL, API, JSON shape, authentication and version. If Finance changes any of them, Travel breaks. This is tight coupling.


MCP	                                    MCP connects an agent to tools. The Finance Agent is not a tool. It reasons, plans, asks questions and can refuse a request. Treating it as a tool is the most common misunderstanding.


Each team invents its own protocol	    Every integration is custom, and the result is chaos. MCP removed this problem for tools. Agents needed the same.


Suppose:

Travel Agent
