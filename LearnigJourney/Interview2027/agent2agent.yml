4.8 Runtime and transport:
This part shows how they travel. A2A defines communication rules only. It does not care whether an agent is Java or Python, LangGraph or CrewAI. Agents are network services, so the transport is HTTP: a Finance Agent in AWS, an HR Agent in Azure and a Legal Agent on-premises can all talk because every platform supports HTTP.


Travel Agent
     |
 A2A Client
     |
 HTTP + JSON
     |
 A2A Server
     |
 Executor

It specifically contrasts this with MCP and describes the A2A implementation in the reference as HTTP-based with JSON payloads.


4.8.1 Transport vs Execution:
This is one of the most important concepts.

HTTP
 |
 +--> Transports request
 |
 +--> Transports response
 |
 +--> Transports messages
 |
 +--> Transports artifacts

But:

Executor
 |
 +--> Executes Task
 |
 +--> Calls LLM
 |
 +--> Calls Tools
 |
 +--> Applies Business Logic

Therefore:

HTTP transports the work; Executor performs the work.


4.8.2 Does the HTTP Connection Stay Open?:

Not necessarily.

Consider:

POST Create Task
       |
       v
Task Accepted
       |
HTTP connection ends
       |
       v
Executor continues
       |
       v
Working
       |
       v
Completed

A Task can continue independently of the lifetime of the HTTP request.

This is particularly important for long-running enterprise workloads.


4.8.3 Life Cycle Flow:
Discover:
The client fetches the Agent Card, typically from a well-known URL on the agent's host. It reads skills, capabilities, authentication, version and endpoint, and caches the result.

Authenticate and create the Task:
The client sends credentials, for example a bearer token. The server verifies them before creating the Task, then stores the Task, issues an ID, sets state to Submitted and replies. The HTTP connection closes. The Task carries on.

Execute:
The Executor works. HTTP only moved the request. It never executes business logic.

Receive updates:
The client learns about progress in one of three ways, chosen per implementation and advertised through capabilities.

Collect results:
The client reads the final state, messages and artifact references and downloads the artifacts.


4.8.4: How Does the Client Receive Progress?:
Pattern 1 — Polling:
Client --> Task Status?
Server --> Working

Client --> Task Status?
Server --> 60%

Client --> Task Status?
Server --> Completed  


Pattern 2 — Streaming:
Create Task
     |
     v
10%
     |
     v
30%
     |
     v
60%
     |
     v
Completed


Pattern 3 — Callback / Notification:
Finance Agent
     |
     | notification/callback
     v
Travel Agent

The precise mechanism depends on the implementation/deployment model described in the source.


Update pattern              How it works	                                                                                        Use when

Polling	                    Client repeatedly asks for task status, like checking an order.	                                        Simplest option, no special support

Streaming	                Server keeps a response open and pushes updates (10%, 40%, 80%…). Conceptually like MCP's SSE.	        Live progress UI. Only if the card advertises streaming.

Callbacks / webhooks	    Server notifies the client when something changes.	                                                    Hours-long tasks and approvals



4.8.5:Common misunderstandings:
Wrong	                                        Right
HTTP executes the Task	                        The Executor executes it. HTTP transports.
A Task is an HTTP request	                    An HTTP request creates the Task.
An Artifact is the HTTP response	            An Artifact is business output. HTTP only carries it.
Messages travel on their own	                Messages travel over the transport like everything else.


