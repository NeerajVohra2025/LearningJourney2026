4.5.2: Message Decomposation:
Part of a message	            Purpose

Role	                        Who sent it (user or agent)

Parts	                        Content. Text part (most common), data part (structured JSON such as {"approved": true, "amount": 25000}), file part (a PDF as an attachment), image part. One message may carry several parts.

Metadata	                    Extra context

Messages are small and usually immutable once sent. They describe what is happening. They do not carry the large deliverable.
