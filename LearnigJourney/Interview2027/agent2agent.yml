The  LLM as one component inside the larger agent architecture.


3.4 Agent anatomy:
A typical enterprise agent contains: an LLM, planner, memory, tool manager, MCP client, A2A client, reasoning engine, executor, state manager and prompt manager. Frameworks implement these differently, but an agent that works with both tools and other agents needs both clients.


Component	                                Responsibility
LLM	                                        Reasoning and language generation
Planner	                                    Determines execution sequence
Memory	                                    Maintains required state/context
Tool Manager                            	Manages tools
MCP Client                              	Communicates with tools
A2A Client                              	Communicates with other agents
Executor	                                Executes tasks
State Manager                           	Maintains task state
Prompt Manager	                            Manages prompts
The agent is the complete software system surrounding the LLM.


3.5 Agent versus tool, workflow and microservice:
Compare	                            Difference
Agent vs tool	                    A tool takes input, executes, returns output (a weather API returns 25°C). An agent receives a goal, thinks, plans, calls tools, uses an LLM, may ask questions or reject the request.

Agent vs microservice	            POST /approveBudget is deterministic and returns {"approved": true}. An agent asked "Should we approve this international trip given project priority, remaining budget and policy?" reads budget and policy, calls SAP, reasons, may ask the HR Agent, and produces a recommendation.

Agent vs workflow	                A workflow's steps are predefined. An agent decides the next step while running.

Agent vs LangGraph graph	        The graph defines behaviour. The running graph plus LLM, memory and tools forms the agent.

SDK agent vs A2A agent	            An Agent(...) object from an SDK is only an agent inside your application. To be A2A-compatible it also needs an Agent Card, an executor, an HTTP endpoint, and the task and message APIs.

Why A2A talks to agents, not LLMs. An LLM exposes no capabilities, tasks, progress, artifacts, authentication or discovery. It only predicts text. A2A connects autonomous software systems that happen to use LLMs inside.


3.6  A2A versus MCP:
                                MCP	                                               A2A
Connects	                    An agent to tools and data	                       An agent to another agent
The other side	                Executes a specific function	                   Reasons, plans, may call many tools
Exposes                     	Tools, resources, prompts	                       Capabilities through an Agent Card
Best for	                    Databases, APIs, file systems, SaaS	               Collaboration between autonomous agents

Rule of thumb;
A2A connects agents to agents. MCP connects agents to tools. They are complementary layers, not competitors. If the other side thinks, use A2A. If it only executes, use MCP.
