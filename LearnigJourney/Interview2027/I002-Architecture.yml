# 54. Responsible AI States

The investigation should not simply be:

SUCCESS / FAILURE

It should support:

EVIDENCE_INSUFFICIENT
EVIDENCE_CONFLICTING
KNOWLEDGE_NOT_FOUND
GROUNDING_FAILED
FACT_VALIDATION_FAILED
CITATION_FAILED
POLICY_DENIED
APPROVAL_REQUIRED
ACTION_FAILED
INVESTIGATION_COMPLETE

This gives the platform operationally meaningful outcomes.
