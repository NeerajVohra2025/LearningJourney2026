Caching is cross-cutting.

Recommended five cache categories:

                    CACHE
                      |
       +--------------+--------------+
       |              |              |
       v              v              v
 Incident State   Evidence Cache  Retrieval Cache
       |
       v
 Semantic Cache
       |
       v
 Vertex AI Context Cache
Cache 1 — Incident State

Stores:

current stage
agent results
evidence IDs
knowledge IDs
grounding ID
RCA status
approval status
Cache 2 — Evidence

Caches expensive runtime queries where safe.

Cache 3 — Retrieval

Caches repeated knowledge retrieval.

Cache 4 — Semantic

Caches semantically equivalent requests only where the answer remains valid.

Be very careful for live incidents.

Cache 5 — Vertex AI Context Cache

Use for relatively stable repeated context such as:

system instructions
large runbooks
stable architecture context
repeated enterprise documentation

Do not blindly cache rapidly changing incident evidence.

The reference architecture also distinguishes application/workflow caching from Vertex AI context caching.
