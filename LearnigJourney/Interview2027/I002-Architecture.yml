3. Architecture Principles:

The platform follows these principles.

Principle:	                                Meaning
Policy Driven	                            Every sensitive operation is policy controlled
Hexagonal	                                Core business logic is isolated from external systems
Clean Architecture	                        Dependencies point toward business/application logic
Agent Responsibility	                    Every agent has a clearly bounded responsibility
Least Privilege                         	Agents receive only required tools
Evidence First                          	AI reasoning begins from trusted evidence
Knowledge Separate from Evidence	        Runtime facts and enterprise knowledge are different
Grounded Generation                     	Gemini reasons over controlled context
Validation Before Action	                AI output is validated before operational action
Human-in-the-Loop	                        High-risk operations require approval
Observable by Design                    	Every investigation is traceable end-to-end
Auditable	                                Decisions and actions are reconstructable
Idempotent                              	Repeated webhook/events do not create duplicate actions
Fail Closed	                                Security/policy controls do not silently bypass
Framework Agnostic Core                  	Agent frameworks remain behind adapters
