# 34. RCA Prompt Contract

The RCA Agent should enforce rules such as:

You are an enterprise RCA Agent.

Rules:

1. Use only supplied evidence and knowledge.
2. Do not invent facts.
3. Distinguish observation from inference.
4. Distinguish correlation from causation.
5. Reference evidence IDs.
6. Reference knowledge IDs.
7. Identify unknowns.
8. Identify assumptions.
9. State confidence.
10. Do not authorize operational actions.
---

# 35. Gemini Structured Output

Never rely on free-form RCA text.

Example:

{
  "root_cause": {
    "statement": "Database connection pool exhaustion is the most likely cause.",
    "evidence_ids": [
      "E002",
      "E003"
    ],
    "confidence": "HIGH"
  },

  "contributing_factors": [
    {
      "statement": "Deployment v2.8.3 temporally preceded the incident.",
