# 30. Grounding Context Builder

Do not send raw evidence and all retrieved documents directly to Gemini.

Introduce:

Grounding Context Builder

Responsibilities:

Select relevant evidence.
Select relevant knowledge.
Remove irrelevant content.
Resolve conflicting information.
Preserve provenance.
Preserve timestamps.
Preserve evidence IDs.
Preserve knowledge IDs.
Identify gaps.
Apply policy constraints.
