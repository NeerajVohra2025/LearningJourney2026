# 53. Failure and Resilience

The system should explicitly define failure behavior.

Failure	                                                                        Expected Behavior
API Gateway unavailable	                                                        Retry according to policy
Orchestrator unavailable	                                                    ServiceNow retry / durable queue
Evidence source unavailable	                                                    Mark evidence unavailable
No evidence	                                                                    INSUFFICIENT_EVIDENCE
Conflicting evidence	                                                        CONFLICTING_EVIDENCE
RAG unavailable                                                             	Controlled degraded mode
Gemini unavailable	                                                            Retry / pending investigation
Validation failure	                                                            Do not proceed to action
Policy unavailable	                                                            Fail closed
Approval unavailable                                                        	Keep action pending
ServiceNow unavailable	                                                        Durable retry
Tool timeout	                                                                Retry if safe/idempotent
Duplicate webhook	                                                            Idempotency check
