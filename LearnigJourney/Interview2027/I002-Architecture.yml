# 32. RAG vs Augmentation vs Grounding

Use these terms carefully.

RAG
 |
 +-- Retrieve
 |
 +-- Augment
 |
 +-- Generate

Augmentation means adding retrieved information to model context.

Grounding means ensuring the generated response is anchored to trusted, verifiable information.

Therefore:

Enterprise Data
      ↓
Retrieval
      ↓
Relevant Knowledge
      ↓
Augmentation
      ↓
Controlled Grounding Context
      ↓
Gemini
      ↓
Grounded Response

The reference architecture explicitly recommends treating augmentation and grounding as related but distinct concepts.
