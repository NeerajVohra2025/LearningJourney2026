10. W3C Trace Context:
The platform uses:
traceparent
tracestate
baggage

The same distributed trace should travel through:
ServiceNow
   ↓
API Gateway
   ↓
Orchestrator
   ↓
Log Analysis Agent
   ↓
MCP
   ↓
Cloud APIs
   ↓
Knowledge Agent
   ↓
RCA Agent
   ↓
Vertex AI
   ↓
Validation
   ↓
Policy
   ↓
Action
   ↓
ServiceNow

The critical rule is:

Do not create a completely independent trace for every agent.

Instead:
ONE INVESTIGATION
      |
      +-- ONE correlation_id
      |
      +-- ONE investigation_id
      |
      +-- ONE distributed trace
             |
             +-- Orchestrator span
             +-- Agent span
             +-- Tool span
             +-- Model span
             +-- Validation span
             +-- Policy span
             +-- Action span
