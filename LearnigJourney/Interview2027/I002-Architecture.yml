07 The Five Most Important Architectural Boundaries:

The team should remember these five rules.

Boundary 1 — Orchestrator:

Orchestrator manages workflow; it does not perform specialist work.

Boundary 2 — Evidence:

Evidence establishes what actually happened.

Boundary 3 — Knowledge:

Knowledge explains what the enterprise already knows.

Boundary 4 — Gemini:

Gemini reasons over controlled grounding context; it does not authorize actions.

Boundary 5 — Policy:

Policy independently determines whether an action is permitted.

And one cross-cutting rule:

Observability

Observability is injected at the Orchestrator boundary and propagated through the entire execution chain using W3C Trace Context. 

