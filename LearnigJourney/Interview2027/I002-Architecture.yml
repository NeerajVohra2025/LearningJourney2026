# 49. Observability vs Evidence

This distinction must be explicit.

Layer	                            Purpose
Cloud Logging	                    Application/agent operational logs
Cloud Trace	                        Distributed execution
Cloud Monitoring                	Metrics and alerting
Cloud Audit Logs	                Platform/API/security audit
GCS Evidence Store	                Investigation evidence
Knowledge Store                 	Enterprise knowledge
Evaluation Store	                AI quality evaluation

Therefore:

Cloud Logging is not the evidence archive.

Cloud Logging tells us what the application/system logged.

The Evidence Store contains the normalized facts selected for the investigation.
---


