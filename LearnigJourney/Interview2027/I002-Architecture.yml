2. Core Architectural Principle:

The most important boundary is:

ORCHESTRATOR
     |
     | "What happens next?"
     |
     v
SPECIALIST AGENTS
     |
     | "Perform the actual work"
     |
     v
TOOLS / MCP
     |
     | "Access enterprise systems"
     |
     v
ENTERPRISE SYSTEMS

The Orchestrator does not perform the actual investigation.

It coordinates:

workflow
sequencing
state
agent selection
context propagation
retries
timeout handling
result aggregation
investigation completion

The Specialist Agents perform the domain work.

For example:

Component:	                                    Responsibility
Orchestrator	                                Manage workflow
Log Analysis Agent	                            Analyze runtime evidence
Evidence Agent	                                Normalize/package evidence
Knowledge Agent	                                Retrieve enterprise knowledge
RCA Agent	                                    Perform grounded reasoning
Action Agent	                                Execute approved actions
MCP/Tool Layer	                                Controlled enterprise API access
Policy Engine	                                Decide whether action is permitted
