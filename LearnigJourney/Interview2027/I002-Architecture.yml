7. ServiceNow Incident Entry:
The business process begins in ServiceNow.

Example:

Incident:

INC0012345

Short Description:
Payment API returning HTTP 500

Priority:
P2

Service:
payment-api

Environment:
production

ServiceNow generates a webhook.

ServiceNow
     |
     | HTTPS Webhook
     v
Google API Gateway

The webhook should contain enough information to identify and investigate the incident.
---


8. API Gateway:

Google API Gateway is the external entry point.

Responsibilities:
Receive webhook.
Authenticate caller.
Validate request.
Apply API-level authorization.
Apply rate limits/quotas as configured.
Propagate W3C Trace Context.
Forward request to Cloud Run.
Reject malformed or unauthorized requests.

It should not perform RCA.
It should not decide the root cause.
It should not invoke multiple specialist agents directly.
The request is forwarded to the Orchestrator.
---

9. Orchestrator Observability Injection:
Observability is injected at the Orchestrator boundary.

API Gateway
     |
     | W3C traceparent
     v
+-----------------------------------+
|          ORCHESTRATOR             |
|                                   |
| Observability Middleware          |
|                                   |
| 1. Extract trace context          |
