16. One complete example:
Let's create a simple application.

main.py     
from fastapi import FastAPI
from pydantic import BaseModel

app = FastAPI()


class Incident(BaseModel):
    incident_id: str
    description: str


@app.post("/incident")
async def analyze_incident(incident: Incident):

    return {
        "incident_id": incident.incident_id,
        "status": "received"
    }
    
Start it:
uvicorn main:app --host 0.0.0.0 --port 8000    

Now request:
POST /incident
Body:
{
  "incident_id": "INC1001",
  "description": "Application is not responding"
}

The runtime flow is:
1. Client
      |
      | HTTP POST
      v

2. Uvicorn
      |
      | ASGI
      v

3. FastAPI
      |
      | Find /incident
      |
      | Validate Incident
      v

4. analyze_incident()
      |
      v

5. Response
      |
      v

6. FastAPI
      |
      | ASGI
      v

7. Uvicorn
      |
      v

8. Client
---

17. Why async def appears everywhere
You will frequently see:
@app.post("/incident")
async def analyze_incident():
The async allows the endpoint to participate in Python's asynchronous execution model.

For example:
@app.post("/incident")
async def analyze_incident():

    result = await call_servicenow()

    rca = await call_vertex_ai(result)

    return rca
    
Conceptually:
FastAPI
   |
   | await ServiceNow
   |------------------|
                      |
                 waiting for I/O
                      |
   | other requests can progress
                      |
   |<-----------------|
   |
   | await Vertex AI
   |------------------|

---


18. One important architect-level distinction:
Don't say:
"FastAPI is the server."
A more accurate statement is:
FastAPI is the web/API framework, while Uvicorn is an ASGI server that runs the FastAPI application. ASGI defines the interface between them.
That's the terminology I would use in an architecture review or interview. 
---


