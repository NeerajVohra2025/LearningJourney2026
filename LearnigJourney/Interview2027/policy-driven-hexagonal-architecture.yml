14. Policy Layer:
For enterprise architecture, treat Policy as a first-class top-level architectural capability outside the Core.
agent-incident/
│
├── core/
│
├── policies/
│
├── security/
│
├── adapters/
│
├── observability/
│
└── configuration/

Do not make:
core/domain/policies/
the enterprise policy implementation.
Why?
Because domain rules and enterprise governance have different responsibilities.


15. Policy Categories:
Our canonical policy structure:
policies/
│
├── input/
├── security/
├── data/
├── model/
├── tool/
├── approval/
├── confidence/
├── cost/
└── governance/


Input Policy:
Controls what enters the system.
Prompt validation
Input restrictions
Prompt injection controls

Security Policy:
Controls security-related decisions.
Identity
Access
Authorization
Risk

Data Policy:
Controls data handling.
PII
Sensitive data
Data residency
Masking
DLP

Model Policy:
Controls model selection.
Which model?
Which provider?
Which data can reach the model?

Tool Policy:
Controls agent capabilities.
Can agent read?
Can agent create?
Can agent update?
Can agent delete?
Can agent execute?

Approval Policy:
Controls human intervention.
Production action → approval
High-risk action → approval

Confidence Policy:
Controls autonomous decisions.

Cost Policy:
Controls model/tool cost.
Cheap model
    ↓
evaluate
    ↓
expensive model only when necessary

Governance Policy:
Controls enterprise-level constraints.
Compliance
Audit
Responsible AI
Organizational controls


16. Policy vs Security:
Another important clarification:
Policy and Security are related, but they are NOT the same thing.
Security
Answers:
Who are you?
and:
Are you authenticated/authorized?
Authentication
Authorization
Identity
S2S
Secrets

Policy:
Answers:
Even if you are authorized, is this particular action allowed?
Example:
User = SRE
       ↓
Authorized
       ↓
Tool Policy
       ↓
Production restart?
       ↓
Human Approval Required

Therefore:

Security ≠ Policy

Security establishes identity/access.

Policy governs behavior and action constraints.


17. Policy vs Configuration:
This distinction must remain permanent.
Configuration
model = gemini
timeout = 30
top_k = 5
confidence_threshold = 0.90
Configuration provides:
VALUES / SETTINGS

Policy
Production remediation requires approval.
Policy provides:
RULES / CONSTRAINTS
Therefore:
Configuration ≠ Policy


Configuration may parameterize a policy.
For example:
confidence_threshold = 0.90
can be configuration.
But:
confidence below threshold
→ human review
is policy.


18. Security Layer:
Canonical structure:
security/
├── authentication/
├── authorization/
├── identity/
├── s2s/
└── secrets/

Depending on the service, not every subfolder is mandatory.
Security handles:
Who is calling?
How do we authenticate?
What identity is being used?
Is the caller authorized?
How are service-to-service calls protected?
Where are credentials/secrets managed?
Security is a cross-cutting enterprise capability.


