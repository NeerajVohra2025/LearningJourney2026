Policy-Driven Hexagonal Enterprise Clean Architecture:
1. Purpose
This document defines the canonical architecture, terminology, responsibilities, dependency rules, and mental model for building enterprise GenAI/Agentic AI systems using:
Policy-Driven + Hexagonal (Ports & Adapters) + Clean Architecture


