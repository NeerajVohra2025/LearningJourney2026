24. Canonical Enterprise Folder Structure:
This is the structure I recommend using as the SSOT baseline      
agent-incident/
│
├── core/           # WHAT are we trying to achieve? (Business logic)  # THE HEART (Tech-agnostic)
│   ├── domain/     # Business entities & rules (Incident, RootCause)
│   │   ├── entities/
│   │   ├── value_objects/
│   │   ├── events/
│   │   └── exceptions.py
│   │
│   ├── application/     # Use cases & orchestration (InvestigateIncident)
│   │   ├── use_cases/
│   │   ├── services/
│   │   └── workflows/
│   │
│   └── ports/          #   HOW do we communicate with the outside? (Contracts)
│       ├── inbound.py  #How the outside world asks our system to do something (e.g., InvestigateIncidentUseCase).
│       └── outbound.py #What our core needs from the outside world to function (e.g., LLMPort, IncidentRepositoryPort). The core asks for "an LLM", not "OpenAI".
│
├── policies/       # WHETHER is this action allowed? (Governance & Guardrails)
│   ├── input/
│   ├── security/   # Deny access to PII or restricted databases.
│   ├── data/       # Mask emails/credit cards before sending to an LLM.
│   ├── model/      # Route simple tasks to cheap models, complex reasoning to premium models.
│   ├── tool/       #  Agent can read tickets, but cannot close them.
│   ├── approval/   # Production restarts require human-in-the-loop sign-off.
│   ├── confidence/ #If LLM confidence < 90%, require human review.
│   ├── cost/
│   └── governance/
│
├── security/
│   ├── authentication/
│   ├── authorization/
│   └── identity/
│
├── adapters/            # Adapters implement the ports and connect to the external world. # THE EDGES (Technology specific)
│   ├── inbound/        # REST APIs, MCP servers, CLI, Kafka consumers. They translate external requests into core use cases.
│   │   └── api/
│   │
│   └── outbound/       # OpenAI SDK, ServiceNow SDK, Pinecone, AWS SDK. They translate core requests into specific technology calls.
│       ├── llm/
│       │   └── ollama/
│       ├── tools/
│       │   └── servicenow/
│       └── ...
│
├── observability/      # WHAT HAPPENED during execution? (Telemetry)
│   ├── logging/
│   ├── metrics/
│   ├── tracing/
│   └── audit/
│
├── configuration/          # WITH WHAT SETTINGS should it run? (Parameters) # SETTINGS (YAML/ENV vars, feature flags)
│   └── config.toml
│
├── bootstrap.py            # STARTUP (Loads config, init logging/tracing)
├── app_factory.py          # WIRING (Dependency Injection, connects Ports to Adapters)
└── __main__.py              # ENTRY POINT (Starts the application)

Wiring the System: bootstrap.py vs app_factory.py
bootstrap.py is the Startup phase. It loads environment variables, initializes logging, sets up telemetry, and prepares the environment.
app_factory.py is the Composition Root. It instantiates the Adapters, injects them into the Ports, builds the Policy Engine, and returns the fully wired Application.

| Area                | Responsibility                      | Key question                                               |
| ------------------- | ----------------------------------- | ---------------------------------------------------------- |
| core/domain         | Business concepts and rules         | What does the business mean?                               |
| core/application    | Use cases and orchestration         | What does the application do?                              |
| core/policies       | Governance and control decisions    | Is this allowed?                                           |
| core/ports/inbound  | Application entry contracts         | How can the application be invoked?                        |
| core/ports/outbound | Required external capabilities      | What does the core need from outside?                      |
| adapters/inbound    | REST, CLI, MCP, events              | How is an external request translated into the core model? |
| adapters/outbound   | LLM, database, RAG, ITSM, cloud     | How is a core request translated into technology calls?    |
| configuration       | Runtime settings                    | Which values should be used?                               |
| observability       | Logs, metrics, traces, audit events | What happened?                                             |
| bootstrap.py        | Startup preparation                 | How is the runtime initialized?                            |
| app_factory.py      | Dependency construction and wiring  | How are components connected?                              |
| __main__.py         | Process entry point                 | How does the application start?                            |


26. Complete GenAI Request:
Let's trace a user request: "Investigate INC12345 and restart the service if necessary."
Inbound Adapter: REST API receives the HTTP POST request.
Inbound Port: Translates HTTP payload into an InvestigateIncident command.
Application Core: Orchestrates the use case. Calls Outbound Ports to fetch the Incident, get Logs, and search the Knowledge Base.
Policy Engine (Pre-Execution): Evaluates Identity and Data policies. (e.g., Are logs sanitized? Is the user authorized?)
Outbound Adapters: Fetches data from ServiceNow, CloudWatch, and Vector DB.
Application Core: Passes data to the LLM Port to find the Root Cause.
Policy Engine (Model/Data): Masks PII from logs before sending to the LLM. Selects the approved enterprise model based on Model Policy.
LLM Adapter: Calls Vertex AI / OpenAI. Returns: Root Cause = DB Pool Exhausted, Confidence = 94%.
Policy Engine (Confidence & Tool):
Confidence Check: 94% > 90% threshold. (Pass)
Tool Check: Action is "Restart Production Service". Policy dictates this is HIGH RISK.
Human-in-the-Loop: System pauses, routes to Human Approval queue.
Outbound Adapter: Upon human approval, executes the restart via Cloud/ServiceNow adapter.
Observability: Emits a distributed trace showing latency, token usage, and policy decisions for every step.


27. The Most Important Separation:
Keep these six concepts separate:
| Concept           | Question                                 |
| ----------------- | ---------------------------------------- |
| **Domain**        | What does the business mean?             |
| **Application**   | What business use case are we executing? |
| **Port**          | What capability/contract do we need?     |
| **Adapter**       | How is that capability implemented?      |
| **Policy**        | Is this action allowed?                  |
| **Security**      | Who is allowed to access it?             |
| **Configuration** | What settings should we use?             |
| **Observability** | What happened?                           |



28. Policy-Driven vs Traditional Hexagonal:
Traditional:
Adapter
   ↓
Port
   ↓
Application/Domain


Policy-Driven:
Adapter
   ↓
Port
   ↓
Policy
   ↓
Application/Domain
   ↓
Policy
   ↓
Port
   ↓
Adapter


The important conceptual addition is:
Governance becomes an explicit architectural concern rather than scattered conditional logic.
The source makes this transition explicitly.



