22. App Factory:
app_factory.py is the composition root.
It wires implementations together.   
Configuration
      ↓
Security
      ↓
Policies
      ↓
Adapters
      ↓
Ports
      ↓
Application
      ↓
API

The source explicitly distinguishes app_factory.py as the place for dependency injection, component construction, port-adapter wiring and application creation, while bootstrap.py handles startup concerns.


