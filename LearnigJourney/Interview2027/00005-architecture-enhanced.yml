2. The Most Important Conceptual Change:
There are three different information domains.                 

Domain A — Incident / Runtime Evidence:
This answers:
What is happening right now?
Examples:
Cloud Logging
Cloud Monitoring
Cloud Trace
ServiceNow
Deployment History
Runtime Metrics
Application Errors

Example:
E001
Cloud Logging
10:03:21 UTC
HTTP 500 increased from 2% to 43%
---


3. Knowledge Bank:
This answers:
What do we already know about the system?

This is different from runtime evidence.

Examples:
Architecture documents
Runbooks
SOPs
Troubleshooting guides
Known errors
Application documentation
CMDB information
Historical RCA
Past incidents
Deployment procedures
Operational standards
The knowledge is relatively stable and is prepared/indexed ahead of time.

Conceptually:
                 KNOWLEDGE BANK

Documents
Runbooks
SOPs
Architecture
CMDB
Historical RCA
Known Issues
      │
      ▼
Chunking
      │
      ▼
Embeddings / Index
      │
      ▼
Vertex AI Search / RAG

Google's RAG documentation describes a similar ingestion/retrieval pattern: documents are processed into chunks, embeddings are created, relevant chunks are retrieved and then supplied for grounded generation.
