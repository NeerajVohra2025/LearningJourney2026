7. Chapter 5 — Google ADK Orchestrator:
Let's now start the actual detailed flow.
What is the Orchestrator?
The orchestrator is responsible for:
WHAT happens next
WHEN it happens
WHICH agent is invoked
WHAT context is passed
WHAT result comes back

It should not perform the RCA itself.

Your reference correctly separates Orchestrator and Routing Engine responsibilities.

Google ADK is appropriate here because Google describes ADK as a framework for building agents, tools and multi-agent systems, with workflow agents supporting predictable pipelines and dynamic routing also supported. ADK agents can be deployed to Cloud Run
