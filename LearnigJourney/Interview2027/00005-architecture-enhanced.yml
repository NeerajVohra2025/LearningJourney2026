9. Chapter 6 — Orchestrator Request Payload:
This is where I would improve the existing design significantly.
The orchestrator should not receive only the ServiceNow description.
It should receive a structured IncidentInvestigationRequest.    

Example:
{
  "request_id": "REQ-10001",
  "correlation_id": "CORR-78901",
  "trace_id": "TRACE-45678",

  "incident": {
    "incident_id": "INC0012345",
    "number": "INC0012345",
    "priority": "P2",
    "short_description": "Payment API returning HTTP 500",
    "description": "Payment API failures increased significantly",
    "service": "payment-api",
    "environment": "production",
    "configuration_item": "payment-api-prod",
    "assignment_group": "SRE",
    "created_at": "2026-09-23T10:03:00Z"
  },

  "investigation": {
    "objective": "Perform root cause analysis",
    "time_window": {
      "start": "2026-09-23T09:55:00Z",
      "end": "2026-09-23T10:10:00Z"
    }
  },

  "requested_evidence": [
    "logs",
    "metrics",
    "traces",
    "deployments"
  ],

  "knowledge_scope": [
    "runbooks",
    "architecture",
    "historical_rca"
  ],

  "policy_context": {
    "risk_level": "P2",
    "allow_read_tools": true,
    "allow_write_tools": false,
