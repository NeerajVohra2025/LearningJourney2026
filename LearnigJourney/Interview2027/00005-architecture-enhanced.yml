29. RCA Agent Builds the Prompt:
The RCA Agent converts the structured grounding package into model context.
Conceptually:
SYSTEM INSTRUCTIONS

You are an RCA Agent.

Rules:
1. Use provided evidence.
2. Use knowledge only as supporting context.
3. Do not invent facts.
4. Identify unsupported assumptions.
5. Return evidence IDs.
6. Return confidence.
7. Return unknowns.

Then:
INCIDENT
Payment API returning HTTP 500.

Then:
EVIDENCE

[E001] HTTP 500 increased to 43%
[E002] Database timeout increased
[E003] Connection pool exhausted

Then:
KNOWLEDGE

[K001] Payment API Runbook:
Connection pool exhaustion can cause request failures.

Then:
TASK

Determine the most likely root cause.
Explain the reasoning.
Reference supporting evidence.
Identify missing evidence.
---

