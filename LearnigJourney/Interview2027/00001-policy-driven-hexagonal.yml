Interviewer: Excellent. Let's talk about the Core layer. Can you walk me through the distinction between Domain and Application layers, and what belongs in each?

The Core Layer: Keeping Business Logic Pure
The heart of the system is the Core, which is split into two layers:
Domain Layer (Business Truth): This defines what the business means. For example, an Incident entity, a RootCause, or a rule like "A CRITICAL incident requires escalation." Crucially, the Domain knows nothing about technology. It doesn't know what ServiceNow, Gemini, or AWS is.
Application Layer (Use Cases): This orchestrates the workflow. If the use case is InvestigateIncident, this layer coordinates the steps: Get Incident → Get Logs → Search RAG → Analyze Evidence → Recommend Action
---
Interviewer: Good. Now, Ports vs Adapters—this is fundamental to Hexagonal Architecture. Can you explain the distinction and give me concrete examples from your implementation?
Ports and Adapters: The Hexagon (Technology Independence)
This is how we keep the Core independent of infrastructure.
Ports are CONTRACTS - they define what capability we need, not how it's implemented.
Adapters are IMPLEMENTATIONS - they translate core requests into technology-specific calls.
Ports are Contracts: The Core says, "I need an LLM capability" (Outbound Port) or "I need to be triggered via REST" (Inbound Port). It never says "I need OpenAI."
Adapters are Implementations: These are the tech-specific translators. If we want to switch from Ollama (for prototyping) to Vertex AI (for production), we just swap the OllamaAdapter for the VertexAIAdapter. The Core code never changes.
