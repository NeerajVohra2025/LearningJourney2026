Interviewer: Now let's discuss Policy Layer, which is your differentiator. You treat Policy as a first-class architectural concern. Walk me through your policy structure and why it's separate from Domain.
The Policy Layer: The Real Differentiator
This is where my architecture stands out. In traditional Hexagonal architecture, the flow is just Adapter → Port → Core. In my design, Policy is a first-class architectural layer that sits outside the Core.
Why outside the Core? Because Domain Rules (business truth) and Policies (governance constraints) have different lifecycles.
Domain Rule: "A root cause must have evidence."
Policy Rule: "If an agent wants to restart a production server, it requires human approval."
I organize policies into specific categories:
Input/Data Policy: Scans for prompt injections (using Model Armor) and masks PII (using Cloud DLP) before it ever reaches the LLM.
Model/Cost Policy: Routes simple tasks to cheap models (Gemini Flash) and complex ones to premium models, checking budget limits.
Confidence/Tool Policy: If the LLM's confidence is below 90%, or if it requests a high-risk tool execution, the policy intercepts and routes it to a Human-in-the-Loop (HITL).
