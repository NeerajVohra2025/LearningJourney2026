Interviewer: Now, walk me through a complete GenAI request in your architecture. Let's say: "Investigate INC12345 and restart the service if necessary."
A Real-World Example: Tracing a Request
Let’s trace a real request: "Investigate INC12345 and restart the service."
Inbound: REST API receives the request. The FastAPI adapter translates it into an InvestigateIncident command via the Inbound Port.
Application Core: Orchestrates the flow. Calls Outbound Ports to fetch the incident from ServiceNow and logs from CloudWatch.
Policy Intercept (Pre-Execution): The Policy Engine checks: Is the user authorized? Are the logs sanitized?
LLM Processing: The Core passes evidence to the LLM Port. Before calling Vertex AI, the Data Policy masks PII via Cloud DLP, and the Model Policy selects Gemini Pro.
LLM Returns: Root Cause = DB Pool Exhausted. Confidence = 94%. Action = Restart Service.
Policy Intercept (Post-Execution):
Confidence Check: 94% > 90% threshold. (Pass).
Tool Check: Restarting a production service is HIGH RISK. Policy dictates this requires Human Approval.
Human-in-the-Loop: The system pauses, creates an approval ticket in ServiceNow, and waits for an SRE to click "Approve."
Execution & Observability: Once approved, the adapter executes the restart. Throughout this entire flow, OpenTelemetry emits traces, logging token costs, latency, and every single policy decision.

The Complete Architecture in Action:

External World (REST)
        ↓
Inbound Adapter (FastAPI)
        ↓
Inbound Port (InvestigateIncident)
        ↓
Application Core (orchestration)
        ↓
Policy Engine (pre-execution checks)
        ↓
Outbound Ports (LLM, Repository)
        ↓
Policy Engine (data masking, model selection)
        ↓
Outbound Adapters (Vertex AI, ServiceNow)
        ↓
Policy Engine (confidence, tool approval)
        ↓
Human-in-the-Loop (if required)
        ↓
Execution (approved actions)
        ↓
Observability (trace entire flow)
