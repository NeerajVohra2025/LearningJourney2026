Interviewer: Let's talk about bootstrap.py vs app_factory.py. Many developers confuse these. What's the distinction?
Wiring It Up: Bootstrap vs. App Factory
To keep the startup clean, I separate runtime preparation from component wiring:
bootstrap.py (The Startup): Loads environment variables, initializes logging, sets up OpenTelemetry, and prepares the runtime.
app_factory.py (The Composition Root): This is where Dependency Injection happens. It instantiates the Adapters, builds the Policy Engine, wires the Adapters to the Ports, and returns a fully ready Application.
The Flow:
main.py (entry point)
    ↓
bootstrap.py (startup preparation)
    ├── Load configuration
    ├── Initialize logging
    ├── Setup telemetry
    └── Security init
    ↓
app_factory.py (composition root)
    ├── Instantiate Adapters
    ├── Build Policy Engine
    ├── Create Application
    ├── Wire Ports → Adapters
    └── Return Application
    ↓
Application (ready to handle requests)  

main.py is very simple:
if __name__ == "__main__":
    bootstrap.initialize()
    app = app_factory.create_application()
    app.run()
    
This separation ensures:
Startup concerns (logging, config loading) are separate from wiring concerns
Dependency injection happens in one place (composition root)
Testing is easier—you can create test applications with mock adapters
Clear separation of concerns
