The Critical Addition:
Governance becomes an explicit architectural concern rather than scattered conditional logic.
In traditional architecture, you'd see:

Where Policies Intercept:
Inbound (before Application):
Input Policy: Validate prompt
Security Policy: Authenticate/authorize
Data Policy: Check data access permissions
Outbound (before Adapter):
Model Policy: Select approved model
Data Policy: Mask PII before LLM
Cost Policy: Check budget
Post-LLM (after response):
Confidence Policy: Evaluate confidence score
Tool Policy: Check if action allowed
Approval Policy: Determine if human review needed
