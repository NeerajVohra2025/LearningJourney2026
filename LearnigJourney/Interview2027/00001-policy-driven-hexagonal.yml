Interviewer: Excellent. Now, Policy vs Security vs Configuration—these are often confused. How do you keep them separate?
Clearing Up Common Confusions:
Architects often mix up three things. Here is how I strictly separate them:
Security vs. Policy: Security asks, "Who are you, and are you authorized?" (Identity/Access). Policy asks, "Even if you are authorized, is this specific action allowed right now?" (Behavior).
Configuration vs. Policy: Configuration provides values (e.g., confidence_threshold = 0.90). Policy provides the rule (e.g., "If confidence is below the threshold, require human review").

Security answers:
"Who are you?" (Authentication)
"Are you authenticated/authorized?" (Authorization)
Identity management, S2S authentication, secrets management
Example:
User = SRE Engineer
↓
Authentication (valid credentials?)
↓
Authorization (has SRE role?)
↓
Access granted


Policy answers:
"Even if you are authorized, is THIS PARTICULAR ACTION allowed?"
Example:
User = SRE Engineer (authorized)
↓
Requests: restart_production_service
↓
Tool Policy evaluates
↓
Production restart = HIGH RISK
↓
Human Approval Required

Configuration provides VALUES/SETTINGS:
model = "gemini-pro"
timeout = 30
top_k = 5
confidence_threshold = 0.90

Policy provides RULES/CONSTRAINTS:
"Production remediation requires human approval"
"Confidence below threshold requires human review"


The Relationship:
Configuration may PARAMETERIZE a policy:
confidence_threshold = 0.90 is configuration
"Confidence below threshold → human review" is policy

But they are NOT the same:
Security ≠ Policy (Identity vs Behavior constraints)
Configuration ≠ Policy (Values vs Rules)
