In enterprise environments, prompt injection and PII leakage are massive risks. You mentioned integrating Model Armor and Cloud DLP into Vertex AI. Can you walk me through the architectural pattern you used to enforce these guardrails without severely impacting latency?

I used a Policy-Driven Hexagonal Architecture to decouple the AI governance logic from the core business logic.
Interviwer :Can you explain what Policy-Driven Hexagonal Enterprise Clean Architecture is and why you chose this approach for your GenAI platforms?:

Neeraj: "Absolutely. When we build traditional enterprise apps, standard architectures work fine. But GenAI introduces unique challenges: non-deterministic outputs, prompt injection risks, PII leakage, and unpredictable token costs. Traditional architectures scatter governance logic (like if confidence > 90%) all over the code.
To solve this, I use Policy-Driven Hexagonal Enterprise Clean Architecture. Let me break it down step-by-step so you can see how it works in practice.
1. The Core Mental Model (The 6 Pillars)
Before we look at the code, I want to share the mental model I use to keep the architecture clean. I memorize these six rules:

Core decides WHAT (The business logic and use cases).
Ports define the CONTRACT (What capabilities we need).
Adapters implement HOW (The specific technology, like OpenAI or Vertex AI).
Policies decide WHETHER (Is this action allowed by governance?).
Configuration provides SETTINGS (Runtime parameters like timeouts).
Observability tells us WHAT HAPPENED (Logs, traces, and audit trails).


Policy-Driven Hexagonal Enterprise Clean Architecture combines four complementary architectural paradigms:

Clean Architecture: - How do I keep business logic independent?
Hexagonal Architecture (Ports & Adapters): - How does the core talk to the outside world?
Policy-Driven Architecture: - makes security, governance, compliance, model usage, and cost decisions explicit and centrally governed.
Enterprise Cross-Cutting Architecture: - provides capabilities such as security, observability, audit, and resilience consistently across services.
Configuration: provides environment- and deployment-specific settings without changing business logic
Observability: provides evidence of what happened through logs, metrics, traces, and audit events.
