Important interview question:
What if someone manually changes infrastructure outside Terraform?
This creates configuration drift.
Terraform can detect differences during:
terraform plan
“I minimize manual changes and enforce infrastructure changes through CI/CD. I also use plan validation and appropriate policy controls to detect and prevent drift.”
---

14. Terraform Import:
Question:
An existing AWS resource was created manually. How do you bring it under Terraform management?
Historically:
terraform import
Modern Terraform also supports import blocks.
Conceptually:
Existing Infrastructure
        ↓
Import
        ↓
Terraform State
        ↓
Terraform Configuration
        ↓
Managed by Terraform

---
First principle: Terraform is not itself an access-control system:
For example:
Terraform
    |
    v
Creates EC2
    |
    v
AWS Console
    |
    +---- User changes instance type
    +---- User changes security group
    +---- User terminates instance
    
Terraform doesn't sit in front of the AWS Console and block those operations.
Therefore:
Use IAM/RBAC and organizational policies to prevent unauthorized manual changes; use Terraform plan/state to detect drift.
This is a very important interview statement.    
---
2. How do I detect someone changed infrastructure manually?:
Suppose Terraform created:

EC2
Instance type = t3.medium

Someone changes it through the AWS Console:

t3.medium → t3.large

Terraform configuration still says:

instance_type = "t3.medium"

Now run:

terraform plan

Terraform compares:

Terraform Configuration
        +
Terraform State
        +
Actual Cloud Infrastructure

and detects a difference.

Conceptually:

              Terraform
                  |
        ┌─────────┴─────────┐
        ↓                   ↓
 Configuration         State
        \                   /
         \                 /
          └──────┬────────┘
                 ↓
          Compare with
                 ↓
        Actual Infrastructure
                 ↓
              DRIFT
              
You might see a plan indicating that the resource needs to be changed back.
---
3. What is this called?
This is called configuration drift or infrastructure drift.

Example:              
Terraform desired state:

EC2
instance_type = t3.medium

Actual AWS:

EC2
instance_type = t3.large

                ↓

             DRIFT
Terraform is very good at detecting this during planning.
--


4. But how do I prevent Console changes?:
This is where the architecture changes.

You use cloud IAM/RBAC + organizational policies + controlled CI/CD.

For AWS: 

Developer
   |
   X
AWS Console
   |
   X
Modify production infrastructure

Instead:

Developer
   |
   v
Git Pull Request
   |
   v
Terraform Plan
   |
   v
Review
   |
   v
Approval
   |
   v
Terraform Apply
   |
   v
AWS

Infrastructure changes must go through Git + Terraform + CI/CD, not directly through the cloud console.
            