Terraform’s provider model lets the same core patterns, modules, and CI/CD pipelines work across clouds with minimal rework. CloudFormation locks you into AWS.
Terraform is multi-cloud because its engine and provider model are multi-cloud, not because an AWS resource can automatically become a GCP resource.
Files that change (in order of impact):
File / Area:                  Change Required?          Effort                              Notes
provider block,                 Yes,                    Low,                                Replace aws with google (or google-beta)
main.tf (resources),            Yes,                    Medium–High,                        Resource types and arguments change
variables.tf,                   Mostly No,              Very Low,                           Variable names/types stay; only a few cloud-specific defaults change
outputs.tf,                     Minimal,                Low,                                Attribute names change (e.g. id → self_link or name)
terraform.tfvars / env files,   Minimal                 Low,                                "Values change (project_id, region, etc.); structure stays"
Backend / state,                Yes,                    Low,                                Switch from S3 to GCS
Modules (if any),               Depends,                Medium,                             Re-point or rewrite module sources
Data sources / locals,          Yes,                    Low–Medium,                         "AMI → image, availability zones → zones, etc."

Effort saved: Roughly 60–80 % of the work compared with rewriting from scratch in Cloud Deployment Manager or starting a new CloudFormation stack. The variable surface, output contracts, module interfaces, CI pipeline, and testing harness remain almost identical.


Step-by-step migration sequence (with concrete example)
Example original AWS resources (simplified):
VPC + public/private subnets
EC2 instance
Security group
S3 bucket

1. Provider & backend (5–10 min):
# Before (AWS)
provider "aws" {
  region = var.region
}

terraform {
  backend "s3" {
    bucket = "my-tf-state"
    key    = "prod/terraform.tfstate"
    region = "us-east-1"
  }
}

# After (GCP)
provider "google" {
  project = var.project_id
  region  = var.region
}

terraform {
  backend "gcs" {
    bucket = "my-tf-state-gcp"
    prefix = "prod"
  }
}
---
2. Variables (variables.tf) – almost zero change:
# Stays almost identical
variable "region" {
  type    = string
  default = "us-central1"   # only the default value changes
}

variable "project_id" {     # new variable needed for GCP
  type = string
}

variable "instance_type" {
  type    = string
  default = "e2-medium"     # mapping from t3.medium
}
---

3. Core resources in main.tf (the bulk of the work)
VPC / Network
# AWS
resource "aws_vpc" "main" {
  cidr_block = var.vpc_cidr
  tags       = { Name = "main" }
}

# GCP equivalent
resource "google_compute_network" "main" {
  name                    = "main"
  auto_create_subnetworks = false
}

Subnet:
# AWS
resource "aws_subnet" "public" {
  vpc_id                  = aws_vpc.main.id
  cidr_block              = "10.0.1.0/24"
  map_public_ip_on_launch = true
  availability_zone       = "us-east-1a"
}

# GCP
resource "google_compute_subnetwork" "public" {
  name          = "public"
  ip_cidr_range = "10.0.1.0/24"
  region        = var.region
  network       = google_compute_network.main.id
}


Compute instance:
# AWS
resource "aws_instance" "web" {
  ami           = data.aws_ami.ubuntu.id
  instance_type = var.instance_type
  subnet_id     = aws_subnet.public.id
  vpc_security_group_ids = [aws_security_group.web.id]
}

# GCP
resource "google_compute_instance" "web" {
  name         = "web"
  machine_type = var.instance_type
  zone         = "${var.region}-a"

  boot_disk {
    initialize_params {
      image = "ubuntu-os-cloud/ubuntu-2204-lts"
    }
  }

  network_interface {
    subnetwork = google_compute_subnetwork.public.id
    access_config {}   # ephemeral public IP
  }

  tags = ["web"]
}


Firewall / Security Group:
# AWS
resource "aws_security_group" "web" {
  vpc_id = aws_vpc.main.id
  ingress {
    from_port   = 80
    to_port     = 80
    protocol    = "tcp"
    cidr_blocks = ["0.0.0.0/0"]
  }
}

# GCP
resource "google_compute_firewall" "web" {
  name    = "web-allow-http"
  network = google_compute_network.main.name

  allow {
    protocol = "tcp"
    ports    = ["80"]
  }

  source_ranges = ["0.0.0.0/0"]
  target_tags   = ["web"]
}


Storage:
# AWS
resource "aws_s3_bucket" "data" {
  bucket = "my-app-data-${var.env}"
}

# GCP
resource "google_storage_bucket" "data" {
  name     = "my-app-data-${var.env}"
  location = var.region
}


4. Outputs (outputs.tf) – light touch:
# AWS
output "instance_public_ip" {
  value = aws_instance.web.public_ip
}

# GCP
output "instance_public_ip" {
  value = google_compute_instance.web.network_interface[0].access_config[0].nat_ip
}


5. Environment / tfvars files:
# terraform.tfvars (or env-specific files)
project_id   = "my-gcp-project"
region       = "us-central1"
vpc_cidr     = "10.0.0.0/16"   # still valid
instance_type = "e2-medium"
env          = "prod"


6. Final steps:
terraform init -upgrade (downloads the Google provider).
terraform plan – review the diff carefully.
Import existing resources if you are migrating live infrastructure (terraform import).
Update CI/CD (replace AWS credentials with GCP service-account key or Workload Identity).
Run terraform apply.


AWS                         GCP
------------------------------------------------
aws_vpc                     google_compute_network
aws_subnet                  google_compute_subnetwork
aws_instance                google_compute_instance
aws_security_group          google_compute_firewall
aws_iam_role                google_service_account
aws_s3_bucket               google_storage_bucket
aws_rds_instance             google_sql_database_instance
aws_eks_cluster              google_container_cluster



                    Application Requirements
                             │
                             ▼
                  Environment Configuration
                             │
                 ┌───────────┴───────────┐
                 ▼                       ▼
             AWS Adapter             GCP Adapter
                 │                       │
        AWS Terraform modules     GCP Terraform modules
                 │                       │
                 ▼                       ▼
             AWS APIs                GCP APIs
             
