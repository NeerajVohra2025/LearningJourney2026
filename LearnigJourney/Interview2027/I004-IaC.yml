What is the difference between variables.tf, terraform.tfvars and environment-specific .tfvars?:
variables.tf
     ↓
Defines the variable contract

terraform.tfvars
     ↓
Provides values

dev.tfvars / prod.tfvars
     ↓
Provides environment-specific values        


Example:

variables.tf
variable "environment" {
  type = string
}

variable "region" {
  type = string
}

variable "instance_type" {
  type = string
}

dev.tfvars
environment  = "dev"
region       = "us-east-1"
instance_type = "t3.small" 


Should passwords and secrets be stored in .tfvars?
AWS Secrets Manager
AWS SSM Parameter Store
GCP Secret Manager
Azure Key Vault
CI/CD secret store


Remote State — one of the most important Architect questions:
terraform.tfstate   
What infrastructure does Terraform currently manage?
        ↓
What resources exist?
        ↓
What changed?
        ↓
What should Terraform create/update/delete?
--

4. Terraform State vs State Locking :
They are not the same thing.

State

Records Terraform's understanding of managed infrastructure.

terraform.tfstate
Locking

Prevents multiple Terraform operations from modifying the same state simultaneously.

Think:

                 Remote State
                     |
              +------+------+
              |             |
         State Storage    Locking

Interview question:

What problem does state locking solve?

Answer:

It prevents concurrent Terraform operations from corrupting or conflicting over the same state.   
---

5. Terraform Modules:
A module is a reusable Terraform component that encapsulates infrastructure implementation.

For example:
modules/
├── network/
├── compute/
├── database/
└── kubernetes/
---

6. Module vs Resource:
Resource:

Creates one infrastructure object.

resource "aws_s3_bucket" "app" {
  bucket = var.bucket_name
}

Module:

Groups multiple resources behind a reusable interface.

S3 Module
 ├── Bucket
 ├── Encryption
 ├── Versioning
 ├── Lifecycle
 └── IAM policy          
 --
 
 9. locals vs variables:
Variable

Input from outside.

variable "environment" {}
Local

Calculated/reusable value inside configuration.

locals {
  name_prefix = "${var.project}-${var.environment}"
}

Think:

Variable = INPUT

Local = DERIVED INTERNAL VALUE

--

10. Data Source vs Resource:

Another favorite.

Resource

Terraform manages it.

resource "aws_vpc" "main" {
   ...
}
Data source

Terraform reads existing information.

data "aws_vpc" "existing" {
  id = var.vpc_id
}

Simple interview statement:

Resource creates/manages; data source reads/queries.
---

12. Terraform lifecycle:

Know these:
lifecycle {
  create_before_destroy = true
  prevent_destroy        = true

  ignore_changes = [
    tags
  ]
}

---

13. Terraform State Commands:
Know these:
terraform state list
terraform state show
terraform state mv
terraform state rm
terraform import

