Chapter 8. Core Abstraction: The Document Object:
Everything in LangChain's RAG stack revolves around a single object type: Document, found in langchain_core.documents. Understanding it early makes every subsequent stage self-explanatory.

8.1 Why it exists:
Different sources (PDF, Word, HTML, SharePoint, databases) return completely different raw formats. Just as an ORM layer normalizes different database drivers into one Entity type, LangChain normalizes every source into one Document type — so splitters, embedding models, and retrievers never need to know where the content originated.

8.2 What Is a LangChain Document?:
A Document is essentially a Python object containing content and metadata.
Example:
from langchain_core.documents import Document

doc = Document(
    page_content="Employees are entitled to 20 days annual leave.",
    metadata={
        "source": "HRPolicy.pdf",
        "page": 10
    }
)

Field	                        Purpose
page_content                	The extracted text itself (string only — never binary/PDF data)
metadata	                    A dictionary used for filtering, provenance, and traceability (e.g. department, page, source)
id (newer versions)	            Optional identifier used for update/delete/audit operations


8.3 Who creates Document objects?:
In practice, you rarely construct them manually — the Document Loader does this for you, typically producing one Document per page or per logical unit, returned as List[Document].

8.4 Key clarifications:
ChromaDB does not store Document objects. It stores the extracted page_content, the embedding vector, metadata, and an ID. The Document object itself lives only in application memory.
Images are not stored natively. page_content is text-only; image content must first pass through OCR, captioning, or a multimodal embedding pipeline before it can be represented in a Document.
