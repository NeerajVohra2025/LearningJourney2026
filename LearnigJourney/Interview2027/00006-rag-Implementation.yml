Chapter 3 — Architecture Overview:
At a high level, RAG has two independent lifecycles that share one component — the embedding model.

Ingestion Lifecycle (offline / batch):

Raw Documents → Document Loader → Document Objects → Text Splitter
→ Chunks → Embedding Model → Vector Store (ChromaDB)

Query Lifecycle (online / real-time):

User Question → Retriever → Embedding Model → Vector Store Search
→ Top-K Chunks → Prompt Builder → LLM → Answer

Every component in this pipeline has a single, well-defined responsibility. This separation of concerns is what allows any individual piece (loader, splitter, embedding model, vector database, LLM) to be swapped out without breaking the rest of the system — the same principle behind layered architectures like Spring's DAO/Repository pattern or JDBC drivers in Java.

Therefore:

Ingestion prepares knowledge. Retrieval uses that knowledge.:
This separation is important when designing enterprise RAG systems.
---

Chapter 4 — RAG Architecture: Understand the Components First
Before implementing RAG, understand the responsibilities.

Component	                                Responsibility
Document Loader	                            Reads a source (PDF, Word, HTML, SharePoint...) and normalizes it into Document objects
Document	                                Common representation of extracted content
Text Splitter	                            Breaks large documents into retrieval-sized chunks while preserving meaning
Embedding Model	                            Converts text into dense numeric vectors for semantic comparison
Vector Store	                            Persists vectors + metadata and performs nearest-neighbor search
Retriever	                                Abstracts the vector store and returns the most relevant chunks for a query
Reranker	                                Improves relevance ordering
Prompt Builder	                            Merges retrieved context, system instructions, and the user's question into one prompt
LLM	                                        Reads the final prompt and generates a natural-language answer

The source architecture identifies the same major RAG building blocks: DocumentLoader, TextSplitter, EmbeddingModel, VectorStore, Retriever, Prompt, and LLM.
