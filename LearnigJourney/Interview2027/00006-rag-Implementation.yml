Chapter 11. Embeddings:

11.1 Why embeddings are required:
Vector databases and similarity search operate on numbers, not natural language. An embedding model converts a chunk of text into a dense numeric vector that captures its meaning — enabling semantically similar phrases (e.g. "vacation days" vs. "annual leave") to be matched even when the exact words differ.

Chunk → Embedding Model → Vector → Vector Database


11.2 Setup (Ollama-backed):
uv add langchain-ollama

from langchain_ollama import OllamaEmbeddings
embedding = OllamaEmbeddings(model="nomic-embed-text")

Instantiating the object performs no work — no vectors are generated until an embed method is called.


11.3 Constructor parameters:

Parameter	            Description
model	                Must be a dedicated embedding model — not a chat model (e.g. nomic-embed-text, bge-large, mxbai-embed-large, all-minilm, snowflake-arctic-embed)
base_url	            Defaults to http://localhost:11434; override for remote Ollama hosts
client_kwargs	        Advanced HTTP settings — timeouts, auth, proxy, SSL


11.4 Two embedding methods, two purposes:
Method	                                        Used For                        	                        Example
embed_documents()	                            Batch-embedding chunks during ingestion	                    embedding.embed_documents([chunk1, chunk2])
embed_query()	                                Embedding the user's question at query time	                embedding.embed_query("How many vacation days?")
Some embedding models optimize documents and queries differently internally, which is why LangChain exposes them as two distinct methods rather than one.


11.5 Vector dimensions by model (approximate):
Model	                                Dimensions
all-MiniLM	                            384
bge-base	                            768
bge-large	                            1024
nomic-embed-text	                    768 (model-dependent)
OpenAI text-embedding-3-small	        1536
OpenAI text-embedding-3-large	        3072



11.6 Enterprise best practices:
Consistency is mandatory: use the same embedding model for both ingestion and querying — vectors from different models are not comparable, and switching models later generally requires full re-embedding of the corpus.
Never use a chat model for embeddings — use a purpose-built embedding model.
BBatch embedding calls (e.g. 100–1,000 chunks at a time) rather than embedding one chunk per call, for throughput.
