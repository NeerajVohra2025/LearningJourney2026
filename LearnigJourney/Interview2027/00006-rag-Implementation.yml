Chapter 12.Vector Store (ChromaDB):

12.1 Why a specialized database is required:
A relational database like MySQL is optimized for exact-match queries, not nearest-neighbor search across millions of high-dimensional vectors. A vector database is purpose-built for this comparison.

12.2 Vector Store vs. Vector Database — terminology:
These terms are often conflated but describe different layers:

Layer	                          Description                             	                                                                                        Examples
Vector Database	:                 The actual storage/indexing engine                                                                                                ChromaDB, Pinecone, Milvus, Qdrant


Vector Store (LangChain):	      A Python wrapper exposing a common interface (add_documents(), similarity_search(), as_retriever()) over the underlying database	Chroma(...)



12.3 Market landscape:
Database	                                Type
Chroma	                                    Local / open source
FAISS	                                    Local library
Pinecone	                                Managed cloud
Qdrant	                                    Open source
Milvus	                                    Enterprise
Weaviate                                	Enterprise
PGVector	                                PostgreSQL extension
MongoDB Atlas Vector Search	                Cloud

This guide uses Chroma for local development.



12.4 Setup:
uv add chromadb langchain-chroma
from langchain_chroma import Chroma

vector_store = Chroma(
    collection_name="hr_policy",
    embedding_function=embedding,
    persist_directory="./chroma_db"
)

Instantiation only creates the object — no data is written yet.


12.5 Constructor parameters:
Parameter	                                        Description
collection_name	                                    Logical grouping, analogous to a SQL table (e.g. "hr_policy", "finance_policy")
embedding_function                              	Most critical parameter — Chroma calls this internally to embed queries at search time
persist_directory	                                Disk location where vectors, metadata, and indexes survive application restarts
client	                                            Advanced — connects to a remote Chroma server instead of a local instance
collection_metadata	                                Arbitrary metadata about the collection itself (e.g. {"department": "HR", "version": "1.0"})

    
12.6 Writing data:
vector_store.add_documents(chunks)

Internally, LangChain automatically calls embed_documents() on each chunk's page_content, then persists the resulting vector, text, and metadata. Chroma does not store Document objects — it stores the decomposed fields (text, vector, metadata, ID).

12.7 Querying:
docs = vector_store.similarity_search("How many vacation days?", k=3)

Internal flow: query → embed_query() → query vector → compare against all stored vectors → score → return top-K.

Method	Returns:
similarity_search()	List[Document] only
similarity_search_with_score()	Document + similarity score (useful for debugging/thresholding)

Metadata filtering narrows the search space and improves both speed and precision:
results = vector_store.similarity_search(
    query="Leave Policy",
    filter={"department": "HR"}
)


12.8 Lifecycle management:
vector_store.delete(ids=["chunk-100"])   # remove a specific chunk
Most vector stores lack native update support — the common pattern is delete, then re-insert

12.9 as_retriever():
LangChain chains and agents are built against the generic Retriever interface, not a specific vector store implementation:

retriever = vector_store.as_retriever(search_kwargs={"k": 5})
---

Chapter 13.Retriever Layer:

13.1 Purpose:
The retriever is the component that actually searches the vector store and returns only the relevant chunks — the application (and the LLM) never queries the vector database directly.
User Question → Retriever → Vector Store → Top-K Documents → Prompt Builder → LLM

13.2 Why not call the vector store directly?:
Calling vector_store.similarity_search() throughout the application code tightly couples the app to a specific database (Chroma today, Pinecone tomorrow). The Retriever abstraction decouples retrieval strategy (similarity, MMR, hybrid, metadata-filtered) from the underlying storage engine — the same rationale behind using a repository/DAO layer instead of raw SQL calls scattered through application code.


13.3 Creating a retriever:
retriever = vector_store.as_retriever(
    search_type="similarity",
    search_kwargs={"k": 5}
)


13.4 search_type options:
Value	                                        Behavior	                                                                Use Case
similarity	                                    Returns the top-K most similar chunks	                                    Default and most common
mmr (Maximum Marginal Relevance)            	Balances relevance with diversity and reduces near-duplicate results	    Summarization and broad research queries
similarity_score_threshold	                    Returns only results above a configured minimum similarity score	        Helps reduce weak matches

k controls how many top documents are returned.


13.5 Core methods:
Method	                    Purpose
invoke(query)	            Standard synchronous retrieval
batch([q1, q2, ...])	    Retrieve for multiple queries in one call
ainvoke(query)	            Async retrieval — for FastAPI/LangGraph pipelines
stream(query)	            Streams documents as they're found


13.6 Retriever variants:
Type	                                        Description
VectorStoreRetriever	                        Default — direct vector search
MultiQueryRetriever	                            Auto-generates paraphrased variants of the query to improve recall
SelfQueryRetriever	                            Parses natural-language filters (e.g. "HR policy after 2024") into structured metadata filters automatically
ParentDocumentRetriever                     	Returns the full parent document when chunks are too small to be useful alone (e.g. legal documents)
ContextualCompressionRetriever	                Post-filters retrieved content down to only the relevant sentences, reducing LLM token cost
EnsembleRetriever	                            Combines BM25 keyword search with semantic (vector) search
MultiVectorRetriever	                        Associates multiple vectors with a single document — useful for multimodal or long-document scenarios

13.7 Vector Store vs. Retriever — quick reference:
Vector Store	                                Retriever
Stores vectors	                                Retrieves documents
Knows database-specific APIs	                Knows retrieval strategy
add_documents(), similarity_search()	        invoke(), batch(), stream()
Responsible for persistence                 	Responsible for finding relevant context

Important: the retriever never calls the LLM — its responsibility ends once it returns List[Document].
---


Chapter 14.Prompt Augmentation:

14.1 Purpose:
An LLM cannot consume List[Document] directly — it requires plain text. Prompt Augmentation is the step that merges the user's question with retrieved context and system instructions into a single, structured prompt.

User Question → Retriever → List[Document] → Prompt Builder → Augmented Prompt → LLM → Answer


14.2 Setup:
from langchain_core.prompts import ChatPromptTemplate

prompt = ChatPromptTemplate.from_template("""
You are an HR Assistant.
Answer only using the supplied context.

Context
{context}

Question
{question}
""")
Creating the template does not execute anything — {context} and {question} are placeholders resolved later.


14.3 Filling the template:
final_prompt = prompt.invoke({
    "context": "Employees receive 20 days leave.",
    "question": "How many annual leaves?"
})


invoke() returns a ChatPromptValue, not a raw string — internally represented as structured System/Human messages, which is the format modern chat models expect


14.4 Anatomy of a production prompt:

Section	                                        Purpose
System Prompt	                                Defines role, security rules, and business constraints
Retrieved Context	                            The joined page_content of top-K chunks
Conversation History (if applicable)        	Prior turns in a multi-turn chat
User Question	                                The actual query
Formatting Instructions	                        Output style (bullet points, citation requirements, etc.)
Example:
SYSTEM
You are an HR Assistant. Only answer from supplied context.
If the answer is not found, say "I don't know."

CONTEXT
Employees receive 20 days annual leave.
Unused leave can be carried forward.
Medical leave requires manager approval.

QUESTION
How many annual leaves are allowed?

14.5 Common mistakes to avoid:
Mistake                                                                                     	Why it's a problem
Sending the entire source document instead of retrieved chunks                                  Defeats the purpose of retrieval; wastes context window
Omitting a system prompt	                                                                    LLM has no behavioral guardrails against guessing
Not instructing the model to say "I don't know"	                                                Increases hallucination risk
Retrieving far more chunks than necessary (e.g. 50 vs. 5)	                                    Increases cost/latency without improving answer quality


14.6 Best practices:
Use a strong system prompt to define role and prevent unsupported answers.
Insert only the most relevant chunks — stay within the context window.
Explicitly instruct the model to decline when information is unavailable.
Include source/page metadata when citation or traceability is required.
Keep prompts concise; more context is not always better.
---


Chapter 15 Generation Phase (LLM Response):

15.1 What the LLM receives:
By the time the LLM is invoked, it has no knowledge of the vector database — it only receives the final augmented prompt as plain text (via tokens).

Augmented Prompt → Tokenizer → Neural Network → Generated Tokens → Response

15.2 Two distinct embedding processes — do not confuse them:
                                RAG Embeddings	                            LLM Internal Embeddings
Stage	                        Ingestion / retrieval	                    Inside the LLM, at inference time
Purpose                     	Semantic search	                            Language understanding
Produced by                 	OllamaEmbeddings (or similar)	            The model's own embedding layer


15.3 Context window constraints:
Every model has a token limit (e.g. Llama 3 ≈ 128K tokens). If the assembled prompt exceeds it, older content must be truncated or the request fails, depending on the model/API.


15.4 Generation mechanics:
Tokens are generated sequentially, one at a time — not as a complete sentence at once. This is what enables streaming responses (tokens are sent to the client as they're produced).

Attention conceptually lets the model weigh which parts of the context are most relevant to the current question (the underlying transformer mechanism is more mathematically complex than this simplification).


15.5 Key generation parameters:
Parameter	                    Effect	                                                                    RAG Recommendation
temperature	                    0 = deterministic/most-probable token; 1 = more creative/random	            Use 0 (or near-0) for factual enterprise RAG
top_p	                        Limits token selection to the top cumulative probability mass	            e.g. 0.9
top_k	                        Limits token selection to the N most probable candidates	                e.g. 40



15.6 Invocation example:
from langchain_ollama import ChatOllama

llm = ChatOllama(model="llama3.2", temperature=0)
response = llm.invoke(prompt_value)
print(response.content)

invoke() returns an AIMessage, not a raw string — the answer text is accessed via .content.

12.7 Hallucination — RAG reduces it, does not eliminate it:
If the retrieved context doesn't contain the answer and the prompt lacks a clear "say I don't know" instruction, the model may still guess. RAG significantly lowers hallucination risk by grounding responses in retrieved context, but it is not a complete guarantee.
