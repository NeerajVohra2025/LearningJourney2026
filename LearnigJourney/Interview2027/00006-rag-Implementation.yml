Chapter 17 Enterprise Best Practices Checklist:
[ ] Use the same embedding model for both ingestion and query-time embedding.
[ ] Choose chunk_size / chunk_overlap appropriate to the document type (see Section 7.4).
[ ] Prefer lazy_load() / alazy_load() for large-scale ingestion to control memory usage.
[ ] Retrieve only the top few relevant chunks (k) — avoid flooding the prompt.
[ ] Always include a system prompt instructing the model not to guess beyond supplied context.
[ ] Set temperature near 0 for factual/enterprise use cases.
[ ] Attach source/page metadata to every chunk for citation and audit purposes.
[ ] Log retrieved documents and similarity scores to support retrieval-quality debugging.
[ ] Re-embed the full corpus if the embedding model is ever changed — vectors from different models are not interchangeable.
