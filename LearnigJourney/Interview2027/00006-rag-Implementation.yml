Chapter 10. Text Splitting (Chunking) Strategy:

10.1 Why chunking is required:
Every LLM has a finite context window, and sending an entire document is slow, expensive, and mostly irrelevant to any single query. Chunking breaks large documents into retrieval-sized pieces so that only the relevant portion is ever sent to the LLM.

PDF → Document Loader → Document Objects → Text Splitter → Chunks → Embedding → Vector Store

Install:
uv add langchain-text-splitters


10.2 Splitter catalog:
Document Type	                                        Recommended Splitter
PDF / Word	                                            RecursiveCharacterTextSplitter
Markdown	                                            MarkdownHeaderTextSplitter
HTML	                                                HTMLHeaderTextSplitter
Python Code	                                            PythonCodeTextSplitter
JSON	                                                RecursiveJsonSplitter
Legal Contracts	                                        Semantic + document-aware splitting

10.3 The default choice: RecursiveCharacterTextSplitter
from langchain_text_splitters import RecursiveCharacterTextSplitter

splitter = RecursiveCharacterTextSplitter(
    chunk_size=1000,
    chunk_overlap=200
)

Instantiation only configures the splitter — no splitting occurs until split_documents() is called.


10.4 Constructor parameters:
Parameter	                                Description	                                               Notes

chunk_size	                                Max size per chunk (characters by default)	               See recommended ranges below

chunk_overlap	                            Characters repeated between consecutive chunks	           Prevents meaning from breaking across chunk boundaries

length_function	                            Function used to measure length	                           Default len; swap for a token counter (e.g. tiktoken) when chunking by LLM tokens
    
separators	                                Ordered fallback split points	                           Default: \n\n → \n → " " → ""

keep_separator	                            Whether to retain the separator character in output	       True / False

is_separator_regex	                        Treat separators as regex patterns	                        Useful for Chapter \d+, Section.*

add_start_index	                            Store each chunk's original character offset in metadata	Useful for highlighting source text

strip_whitespace                        	Trim extra whitespace from chunk edges	                    Default True

Recommended chunk_size ranges:

Content Type	            Chunk Size
Small FAQ	                200–400
Enterprise PDF	            500–1200
Source Code	                100–300
Contracts	                800–1500

chunk_overlap guidance: almost always non-zero; typical values are 10–25% of chunk_size. Without overlap, a sentence like "Employees are entitled [/] to 20 days annual leave" can be split mid-thought, degrading retrieval quality.


10.5 Why "recursive"?:
The splitter attempts to preserve meaning by trying larger semantic units first, falling back progressively:
Paragraph split → (too large?) → Sentence split → (too large?) → Word split → (too large?) → Character split


10.6 Output and metadata inheritance:
chunks = splitter.split_documents(documents)
Output remains List[Document] — only page_content shrinks.
Every chunk inherits the parent document's metadata (e.g. source, page), which is what allows the retriever to later cite where an answer came from.


10.7 Chunking strategy taxonomy:
Strategy	                               Description	                                                  Trade-off
Fixed Character	                           Splits every N characters	                                  Simple/fast, poor semantic quality
Recursive (recommended)	                   Paragraph → sentence → word → character fallback	          Best general-purpose default
Token-based	                               Splits by model token count (e.g. 512 tokens)	              Aligns directly with LLM context limits
Semantic	                               Groups sentences by meaning rather than length	              Best retrieval quality, more compute-expensive
Document-aware	                           Splits along heading/sub-heading structure	                  Ideal for manuals, contracts, technical docs
Sliding Window	                           Overlapping fixed windows (e.g. 1–1000, 800–1800, 1600–2600)  Common in production pipelines

