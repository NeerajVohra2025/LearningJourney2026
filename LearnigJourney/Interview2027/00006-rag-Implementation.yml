Chapter 9. Core Abstraction: Document Loaders:
9.1 Purpose:
Embedding models only understand text — not PDF, DOCX, or PPT binaries. The Document Loader is the component responsible for reading a source and converting it into Document objects.

Company Documents → Document Loader → Document Objects → Text Splitter → Chunks → Embedding → Vector Store

9.2 Loader selection:
Source	                Loader
PDF	                    PyPDFLoader
Word	                Docx2txtLoader
CSV	                    CSVLoader
JSON	                JSONLoader
Folder              	DirectoryLoader
Website             	WebBaseLoader
SharePoint          	SharePointLoader
Confluence	            ConfluenceLoader
Git Repository	        GitLoader
Amazon S3	            S3Loader
Install:
uv add langchain-community pypdf unstructured beautifulsoup4

9.3 Instantiation is lazy:
from langchain_community.document_loaders import PyPDFLoader
loader = PyPDFLoader("HRPolicy.pdf")

Creating the loader does not read the file — it only stores configuration, analogous to opening a JDBC connection before running a query.

9.4 Constructor parameters:
PyPDFLoader(
    file_path,
    password=None,
    extract_images=False
)

Parameter	                    Description
file_path	                    Required. Path to the target file.
password	                    Optional, for encrypted PDFs.
extract_images	                If True, attempts to extract embedded images (parser-dependent).

9.5 Loading strategies:
Method	                                    Behavior	                                                    Best For
load()	                                    Reads the entire source into memory at once	                    Small files

lazy_load()	                                Yields one Document at a time	                                Large files (e.g. 5,000-page PDFs) — constant 
memory usage

aload()	                                    Async version of load()	                                        FastAPI / LangGraph / agent workflows

alazy_load()                            	Async + lazy	                                                Large-scale enterprise ingestion pipelines

Enterprise guidance: for bulk ingestion (thousands of documents), always prefer lazy_load() / alazy_load() over load() to avoid memory exhaustion.
for document in loader.lazy_load():
    # split → embed → store
    ...

9.6 Output shape:
documents = loader.load()
print(documents[0].page_content)   # "Leave Policy\nEmployees are entitled..."
print(documents[0].metadata)       # {"source": "HRPolicy.pdf", "page": 0}

By default, PyPDFLoader produces one Document per page.


9.7 load() vs lazy_load() — quick reference:
load()	                                                            lazy_load()
Reads entire document into memory	                                Reads one page/document at a time
Faster for small files	                                            Better for large files
Higher memory usage	                                                Lower memory usage

