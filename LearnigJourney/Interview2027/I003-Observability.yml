PART 3: How to Configure OpenTelemetry:
16. The Big Picture:
Configuration is a chain of decisions:
Instrumentation → SDK → Resource → Sampler → Exporter → Collector → Backend

Step 1 — Instrument the Application:
Our application contains:

FastAPI
Google ADK
Agents
RAG
MCP
Geminini


Use automatic instrumentation for infrastructure and manual instrumentation for GenAI business operations.

Automatic
    |
    +-- FastAPI
    +-- HTTP
    +-- Database
    +-- gRPC

Manual
    |
    +-- Agent
    +-- MCP
    +-- RAG
    +-- Grounding
    +-- Gemini
    +-- Policy
-

Step 2 — Configure the OTel SDK:
The SDK controls how telemetry is generated and processed.

Example:

from opentelemetry import trace

tracer = trace.get_tracer("rca-agent")

Then create a business-level span:

with tracer.start_as_current_span(
    "rca.investigation"
) as span:

    span.set_attribute(
        "agent.id",
        "RCAAgent"
    )

    perform_rca()
    
-

   
Step 3 — Define Resource Identity:
Every telemetry record must clearly identify where it came from.
Example:

service.name = rca-agent
service.version = 1.4.2
deployment.environment = prod
cloud.provider = gcp
cloud.region = asia-south1

This allows the SRE to answer:

Which service?
Which version?
Which environment?
Which region?

Without service.name, telemetry can become difficult to identify; the reference notes that it can appear as unknown_service.
-


Step 4 — Configure Sampling:
Imagine:

10,000 requests/sec

We may not want to permanently retain every trace.

Sampling determines what is retained.

Typical strategies:

Always On
Always Off
Trace ID Ratio
Parent Based
Tail Sampling

For a Responsible GenAI platform:

100% Errors
100% Policy Denials
100% Guardrail Blocks
100% High-Risk Actions
100% HITL

10% Normal Successful Requests

This ensures that the most important security and operational events are retained.

Why Parent-Based Sampling?:
Consider:

Service A
   |
   v
Service B
   |
   v
Service C

If Service A samples the trace but Service B independently makes another decision, the trace can become fragmented.

Parent-based sampling allows child services to honor the upstream decision.

Conceptually:

Parent Trace
      |
      +---- Child Span
      |
      +---- Child Span
      |
      +---- Child Span

This helps preserve end-to-end trace continuity.



---

Step 5 — Configure the OTLP Exporter: #The exporter determines where telemetry is sent.

The application sends telemetry through OTLP.

Application
     |
     v
OTel SDK
     |
     v
OTLP Exporter
     |
     v
OTel Collector

OTLP because it keeps the application independent of the final telemetry backend.
---


Step 6 — Configure the OTel Collector:

The Collector becomes our enterprise telemetry gateway.

It has three major stages:

Receiver
   ↓
Processor
   ↓
Exporter
Receiver

Receives telemetry.

OTLP/gRPC
OTLP/HTTP
Processor

Controls telemetry.

Batch
Filter
Redaction
Sampling
Enrichment
Exporter

Sends telemetry to:

Google Cloud
Prometheus
Grafana ecosystem
Other backends


Responsible AI Requirement — Protect Telemetry:
This is one of the most important SRE responsibilities.
Do not assume telemetry is safe merely because it is observability data.

GenAI telemetry can contain:

Prompts
Responses
PII
Secrets
Tokens
User information
Business information

Therefore:

Application
     |
     v
OTel Collector
     |
     +-- Redact
     +-- Filter
     +-- Sample
     +-- Batch
     |
     v
Backend

redaction and controlled handling of prompts/responses as important Responsible AI considerations.

---

Step 7 — Send Telemetry to Google Cloud:                  
For our GCP architecture:
                    Application
                         |
                    OpenTelemetry
                         |
                    OTel Collector
                         |
          +--------------+--------------+
          |              |              |
          v              v              v
    Cloud Logging   Cloud Trace   Cloud Monitoring
