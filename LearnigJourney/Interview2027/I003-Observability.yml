  important_distinctions:

    cloudwatch_vs_cloudtrail:
      cloudwatch:
        purpose: "Operational observability"
        answers: "How is my system behaving?"
        examples:
          - "CPU is high"
          - "API latency increased"
          - "Error rate crossed threshold"
          - "Application logs contain exceptions"
          - "Service is unhealthy"
      cloudtrail:
        purpose: "Security and API auditing"
        answers: "Who did what?"
        examples:
          - "Who deleted the resource?"
          - "Which IAM role changed the configuration?"
          - "Which API was called?"
          - "When was the security policy modified?"

    cloudwatch_vs_xray:
      cloudwatch:
        role: "Broad observability platform"
        covers:
          - "Metrics"
          - "Logs"
          - "Alarms"
          - "Dashboards"
          - "Application monitoring"
      xray:
        role: "Distributed tracing"
        covers:
          - "Trace"
          - "Span"
          - "Service dependency"
          - "Request path"
          - "Latency breakdown"

    opentelemetry_vs_observability_platform:
      opentelemetry:
        type: "Open standard and instrumentation framework"
        purpose: "Generate and export telemetry"
        telemetry:
          - "Traces"
          - "Metrics"
          - "Logs"
      cloudwatch:
        type: "AWS observability platform"
        purpose: "Store, analyze, visualize and alert on telemetry"
      cloud_monitoring:
        type: "GCP observability platform"
        purpose: "Store, analyze, visualize and alert on telemetry"

