Enterprise GenAI Observability — From Basic Terms to OpenTelemetry:

1. Telemetry:
Telemetry is data your running system sends out about its own behavior, so you can understand it from the outside without logging into the server.
Analogy: A car dashboard. Speed, fuel level and engine temperature are telemetry. You don't open the engine to know how the car is doing.
# Telemetry is the automatic collection of data about how a system is behaving while it runs.
Telemetry comes in three main types: logs, metrics and traces

Signal	                            Question it answers	                                            Example
Logs (text events)                  What happened?	                                                ERROR: LLM call failed, status 429   # (“user X asked for summary”, “model timed out”)


Metrics (numbers)	                How much / how often / how fast?	                            p95 latency = 4.2s, tokens/min = 180k  # (latency, request count, GPU utilization, token usage)


Traces                          	Where did the request go, and where was it slow?	            API → Retriever → Vector DB → LLM → Guardrail # the full journey of a single request across services
A fourth signal, profiles, is emerging, and OTel is adding it.


Why GenAI Needs More Than Standard Telemetry:
Answer: GenAI systems are non-deterministic, slow, expensive and multi-step. Classic "HTTP 200 = healthy" isn't enough. An LLM can return 200 OK with a hallucinated or unsafe answer.
Extra things we must observe:

Layer:	                        What we watch
LLM	                            Model, tokens, time to first token, retries
Agent	                        Reasoning loops, handoffs
Tools	                        Which tools ran, success or failure
RAG	                            Retrieval latency, top_k, relevance
Quality	                        Groundedness, hallucination, citation accuracy
Policy / safety	G               uardrail blocks, human-in-the-loop approvals
Cost	                        Tokens and money per request, user, tenant
---


2. Observability:
Observability is the ability to understand what is happening inside a running system by looking at the data that the system produces.
Monitoring tells you something is wrong ("latency is high").
Observability helps you find out why ("the Gemini call timed out and retried"), without deploying new code.

Analogy: Monitoring is a smoke alarm. Observability is the camera footage that shows where the fire started.

                 RUNNING APPLICATION
                        |
             +----------+----------+
             |          |          |
             v          v          v
           Logs      Metrics     Traces
             |          |          |
             +----------+----------+
                        |
                        v
                OBSERVABILITY
                        |
                        v
             Understand the system
             
---


3. Logging:
A log is a text record of an event that happened. It answers: "What happened?"     
2026-10-06 20:10:03 ERROR  LLM call failed, status 429 (rate limited)
2026-10-06 20:10:04 INFO   retry 1 succeeded

Best practice: write structured logs (JSON), not free text, so they can be searched.   
{"level":"ERROR","agent_id":"rca-agent","model_id":"gemini-2.5-pro",
 "status":429,"retry_count":1,"trace_id":"4bf92f35..."}

What does logging answer?:
What happened? 
For example:
Tool call failed
RAG returned zero documents
Gemini returned 429
Policy denied action
ServiceNow update failed
--


4. Metrics: A metric is a numerical measurement collected over time.
A metric is a number measured over time. It answers: "How much? How often? How fast?"
Examples: requests per second, p95 latency, error rate, tokens per minute, GPU utilization, cost per day.
Metrics are cheap to store and ideal for dashboards and alerts ("alert me if error rate > 2%").
Warning: don't put high-variety values like user_id or raw prompts into metric labels. This is called cardinality explosion and it makes metrics systems slow and expensive.
---


5. Tracing:
A trace is the full journey of one request through your system. It answers: "Where did the request go, and where was it slow?"

Two words to know:

Trace: the whole journey.
Span: one step in the journey (e.g., "vector search"). A span has a name, start and end time, attributes, and a status.
Example: an agent request
Trace ID: 4bf92f35...
└─ POST /chat                       1.9s   ← root span
   └─ agent.run (rca-agent)         1.8s
      ├─ rag.vector_search          0.2s
      ├─ tool.call (get_logs)       0.2s
      └─ llm.generate (gemini)      1.2s   ← the slow step
Every span shares one Trace ID, and each span has a Span ID and a Parent Span ID. That's how the tree is built.      
---


6. The Three Signals Working Together:
Problem: "Our RCA (root cause analysis) agent takes 8 seconds."
Signal	                    What it tells you
Metric	                    Latency is 8s (that it's slow)
Trace	                    The Gemini call took 6.2s (where it's slow)
Log	                        "Gemini timed out, retrying" (why it's slow)
Root cause: the Vertex AI call is causing most of the delay.
---


7. Instrumentation:
Instrumentation means adding code (or a plugin) to your application so that it produces telemetry. Without it, the app is a black box.
# Instrumentation means adding the capability to an application so that it produces telemetry.
Without instrumentation:
Application
     |
     X
No visibility

With instrumentation:

Application
     |
     v
Instrumentation
     |
     +---- Logs
     +---- Metrics
     +---- Traces
     
Simple analogy:
Think about a factory.

You install:

Temperature sensors
Pressure sensors
Production counters
Error sensors

You haven't changed what the factory produces.
You have simply added sensors.
Instrumentation is the equivalent of adding those sensors to software.     

Types of Instrumentation:
There are three common approaches.


1 Automatic Instrumentation:  # Auto (zero-code)
Efforts: Lowest
Use automatic instrumentation for common technologies:

FastAPI
HTTP
Database
gRPC

This provides fast adoption.



2 Library Instrumentation:
Efforts: Low
You enable a plugin for a specific framework (FastAPI, requests)
For example:
FastAPIInstrumentor.instrument_app(app)
The application code remains mostly unchanged.


3 Manual Instrumentation: # This is extremely important for GenAI applications
Efforts: Highest	
You write spans and attributes yourself for business logic, agents, tools, RAG
For GenAI, you will almost always need some manual instrumentation, because no generic tool knows what your agent's "tool call" or "guardrail check" means.
---

8. Context Propagation and W3C Trace Context: # How do we propagate trace information between services?
When Service A calls Service B, how does B know it's part of the same trace? A tiny header travels with the request:
traceparent: 00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-01
             │   │                                │                │
             │   └ trace-id                       │                └ flags (01 = sampled)
             └ version                             └ parent span-id
             
This format is the W3C Trace Context standard.

Inject: the caller writes the header.
Extract: the receiver reads it and continues the same trace.             
---

10. What is OpenTelemetry (OTel)?: # How do we instrument applications and produce/collect telemetry?.
# it does not provide storage or visualization.
OpenTelemetry is an open-source, vendor-neutral standard (a CNCF project) for generating, collecting and exporting telemetry.
It supports:
Logs
Metrics
Traces

It provides:
Piece	                        Plain-English meaning
API	                            Functions your code calls (tracer.start_span())
SDK	                            The engine behind the API: sampling, batching, exporting
Instrumentation libraries	    Ready-made plugins for frameworks and LLM SDKs
Context propagation	            Passing trace identity between services
OTLP	                        The standard format and protocol for sending telemetry
Collector                   	A service that receives, cleans and routes telemetry
Semantic conventions	        Standard attribute names (gen_ai.request.model)

The key point: OpenTelemetry does not store or display anything. It is the pipe, not the dashboard.

Remember this:
OpenTelemetry is not Grafana.
OpenTelemetry is not Prometheus.
OpenTelemetry is not Cloud Trace.
OpenTelemetry is not Kibana.
Think of OTel as the telemetry plumbing.
                 APPLICATION
                     |
                     v
              OpenTelemetry
                     |
             +-------+-------+
             |       |       |
           Logs   Metrics   Traces
             |       |       |
             +-------+-------+
                     |
                     v
              Telemetry Backend
                     |
             +-------+-------+
             |       |       |
           Google  Prometheus Grafana
           Cloud             |
                             |
                         Dashboards
                         
                         
