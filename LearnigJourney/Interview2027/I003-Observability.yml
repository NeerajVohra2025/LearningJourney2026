  architect_interview_summary:
    one_line:
      - "GCP Cloud Logging ≈ AWS CloudWatch Logs"
      - "GCP Cloud Monitoring ≈ Amazon CloudWatch"
      - "GCP Cloud Trace ≈ AWS X-Ray"
      - "GCP Trace Explorer ≈ X-Ray Trace Map"
      - "GCP Cloud Audit Logs ≈ AWS CloudTrail"
      - "GCP Error Reporting ≈ CloudWatch application/error capabilities"
      - "GCP Managed Prometheus ≈ Amazon Managed Service for Prometheus"
      - "GCP Managed Grafana ≈ Amazon Managed Grafana"
      - "OpenTelemetry ≈ AWS Distro for OpenTelemetry"

    key_architect_statement: >
      Logs tell me what happened, metrics tell me how the system is behaving,
      traces tell me where the request travelled and where latency occurred,
      and audit logs tell me who performed an action. CloudWatch is the broad
      AWS observability platform, X-Ray specializes in distributed tracing,
      and CloudTrail provides AWS API and audit history.