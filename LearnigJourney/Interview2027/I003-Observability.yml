What Should We Instrument in a GenAI System?:
Traditional application telemetry is not enough.

For our responsible-agent platform, instrument:               
                    GenAI Observability
                           |
       +-------------------+-------------------+
       |                   |                   |
     Agent               Tool                LLM
       |                   |                   |
     RAG                MCP                  Gemini
       |                   |                   |
  Grounding           Enterprise API      Tokens
       |                                      |
  Evaluation                            Latency/Cost
       |
    Policy
    
    
--

GenAI Instrumentation — Agent Layer:

Every agent should expose operational telemetry.

Recommended attributes:

agent_id
agent_version
trace_id
incident_id
investigation_id
start_time
end_time
latency
status
retry_count
tool_count

Example:

agent_id = RCAAgent
agent_version = 2.1
status = SUCCESS
latency = 6.8 sec
tools_called = 3

The reference identifies these exact dimensions for agent telemetry.      
--
GenAI Instrumentation — MCP / Tool Layer:

For every MCP/tool call:

tool_id
tool_name
agent_id
trace_id
duration
status
error
authorization_result

Example:

tool = get_logs
agent = LogAnalysisAgent
status = SUCCESS
latency = 320 ms
authorization = ALLOWED

For a high-risk operation:

tool = restart_service
risk = HIGH
policy = ALLOWED
approval = REQUIRED
approval_id = APR123

This allows us to answer:

Did the AI merely recommend the action, or did the system actually execute it?

That distinction is fundamental in Responsible AI.
---

GenAI Instrumentation — Gemini:

For Gemini/Vertex AI calls capture:

model_id
model_version
prompt_version
request_id
trace_id
agent_id
input_token_count
output_token_count
latency
retry_count
error
grounding_id

Potentially:

time_to_first_token
generation_latency
safety_result
guardrail_result

Example:

with tracer.start_as_current_span(
    "gemini.generate"
) as span:

    span.set_attribute(
        "gen_ai.request.model",
        "gemini"
    )

    span.set_attribute(
        "app.agent_id",
        "RCAAgent"
    )

    response = model.generate_content(prompt)

    span.set_attribute(
        "gen_ai.usage.input_tokens",
        response.usage_metadata.prompt_token_count
    )

    span.set_attribute(
        "gen_ai.usage.output_tokens",
        response.usage_metadata.candidates_token_count
    )

The reference uses this same pattern for Gemini telemetry.
---

Critical Responsible AI Rule:

Do not automatically put the complete prompt and model response into every trace.

Why?

Because they may contain:

PII
Secrets
Aadhaar/PAN-like identifiers
Customer information
Production data
Confidential business information

Instead capture:

prompt_version
prompt_hash
grounding_id
knowledge_ids
token counts
model
latency
evaluation result

And store sensitive content only where explicitly required, protected and governed.
--


####  The Most Important Architecture Distinction:
For our enterprise GenAI platform, keep these concepts separate:
Telemetry
   ↓
What the system emitted

Instrumentation
   ↓
How the application produces telemetry

OpenTelemetry
   ↓
Framework/standard used to generate and transport telemetry

W3C Trace Context
   ↓
How distributed trace context travels between services

OTel Collector
   ↓
Central telemetry processing pipeline

Cloud Logging
   ↓
Where logs can be stored/searched

Cloud Trace
   ↓
Where distributed traces can be analyzed

Cloud Monitoring
   ↓
Where metrics/alerts can be managed

Grafana
   ↓
Visualization/dashboard layer

Prometheus
   ↓
Metrics/time-series ecosystem

Observability
   ↓
Ability to understand why the system behaved as it did

And for Agentic AI, extend the traditional three pillars:
Traditional Observability
        |
        +-- Logs
        +-- Metrics
        +-- Traces

             +

GenAI Observability
        |
        +-- Agent telemetry
