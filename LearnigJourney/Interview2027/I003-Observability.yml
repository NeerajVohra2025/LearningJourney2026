What is the OpenTelemetry Collector?:
The Collector has three stages: Receivers (accept data) → Processors (clean, filter, sample) → Exporters (send to backends).

Collector pipeline:

Receivers: accept data (OTLP, Prometheus, Jaeger)
Processors: batch, filter, redact PII, sample, add attributes
Exporters: send to backends

Application
     |
     | telemetry
     v
OTel Collector
     |
     +---- Process
     +---- Filter
     +---- Redact
     +---- Sample
     +---- Enrich
     |
     v
Backend


Receiver:
Receives telemetry.
OTLP
Prometheus
Jaeger


Processor:
Processes telemetry.
For example:
Batch
Filter
Redact
Sampling
Add attributes


Exporter:
Sends telemetry somewhere.
Google Cloud
Prometheus
Grafana ecosystem
Other backend
---


OpenTelemetry vs Prometheus vs Grafana:
Simple explanation:
OpenTelemetry

Creates, collects and exports telemetry.

Prometheus: # Primarily a metrics monitoring/time-series ecosystem.
Prometheus is a system for collecting, storing and querying metrics (numbers over time). It uses a query language called PromQL and is very common in Kubernetes. It also supports alerting rules.
It does not handle traces, and it isn't a general logging tool.

Grafana:
Grafana is a visualization and alerting tool. It doesn't produce telemetry. It connects to data stores (Prometheus, Google Cloud Monitoring, Tempo, Loki, Elasticsearch and more) and draws dashboards from them.

Therefore:
Application
     |
     v
OpenTelemetry
     |
     +---- Metrics
     |       |
     |       v
     |   Prometheus
     |
     +---- Traces
     |       |
     |       v
     |   Trace Backend
     |
     +---- Logs
             |
             v
        Log Backend
             |
             v
          Grafana
          


How They Fit Together:          
Your agent (OTel SDK + instrumentation)
        │  OTLP
        ▼
   OTel Collector
        │
        ├─► Prometheus / Cloud Monitoring   (metrics)
        ├─► Tempo / Jaeger / Cloud Trace    (traces)
        └─► Loki / Elastic / Cloud Logging  (logs)
                      │
                      ▼
                   Grafana  (dashboards, alerts)          
                   
