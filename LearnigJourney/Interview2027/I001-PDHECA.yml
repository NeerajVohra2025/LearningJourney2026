The architecture exists partly to make this easy.

Layer	                    Test type                       	How
Domain	                    Pure unit tests	                    No mocks needed
Policies	                Table-driven unit tests	            Feed decisions in, assert verdicts
Application	                Unit tests with fake ports	        In-memory fakes for LLMPort, IncidentRepositoryPort, etc.
Adapters	                Contract and integration tests	    Run the same contract suite against Ollama, Vertex AI fakes, etc.
Whole system	            End-to-end	                        create_application() with mock adapters

