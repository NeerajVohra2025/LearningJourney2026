Part 5. Step-by-Step Build Guide:
Follow this order for every new use case. Building inside-out keeps the core clean and testable at each step.

Step 1. Model the Domain (business truth):
Question: what does the business mean? Allowed: pure Python, no framework imports.


Step 2. Understand Domain Rule vs Policy (the critical distinction):

                                            Domain Rule	                                Policy
Nature	                                    Business truth	                            Governance constraint
Example                                 	"A root cause must have evidence."	        "Restarting a production server requires human approval."
Owner	                                    Business / product                          Security, risk, compliance, platform
Changes when	                            The business changes	                    Regulation, risk appetite or tooling changes
Location	                                core/domain                             	policies/

If your rule starts with "the business says..." it is a domain rule. If it starts with "we are not allowed to..." or "even if X, we must..." it is a policy.


Step 3. Define Ports (contracts):
Inbound port: how somebody invokes us. Outbound port: what we need from outside.


Step 4. Write the Application Layer (use cases):
Question: how is the business use case executed? Role: orchestrate. Call ports. Never call a vendor SDK directly.

Notice: the use case contains the workflow (get → analyze → decide), not the rules (what confidence is enough, which actions are risky). Those live in policies.
Agent frameworks (Google ADK, LangGraph, OpenAI Agents SDK, CrewAI): they sit around the application/orchestration boundary behind an AgentOrchestrator port. They are implementation technologies, never the business architecture. If removing LangGraph would force a change in core/domain, the boundary has leaked.

Step 5. Build the Policy Layer:
Question: is this action allowed?

5.1 Policy categories:
Policy	                                Controls	                                    Concrete example
Input	                                What enters the system	                        Block prompt-injection patterns (Model Armor)
Security	                            Security-related decisions	                    Deny access to restricted databases
Data	                                Data handling	                                Mask PII with Cloud DLP, residency checks
Model	                                Model/provider selection	                    Simple → Gemini Flash, complex → Gemini Pro
Tool	                                Agent capabilities	                            Can read tickets, cannot close them
Approval	                            Human intervention                          	Production restart → human approval
Confidence	                            Autonomous decisions	                        Confidence below threshold → human review
Cost	                                Spend control                               	Check budget; escalate to costly model only when needed
Governance                          	Enterprise constraints	                        Compliance, audit, responsible AI


Step 6. Separate Policy, Security and Configuration:
These three are the most commonly confused. Keep them apart permanently.
6.1 Security vs Policy:

SECURITY: "Who are you?"                 POLICY: "Is THIS action allowed now?"

User = SRE engineer                      User = SRE engineer (already authorized)
   ↓                                        ↓
Authentication (valid credentials?)      Requests: restart_production_service
   ↓                                        ↓
Authorization (has SRE role?)            Tool Policy → HIGH RISK
   ↓                                        ↓
Access granted                           Human approval required

Security establishes identity and access. Policy governs behavior and action constraints. Security ≠ Policy.

6.2 Configuration vs Policy:
# configuration/config.toml     -> VALUES / SETTINGS
[llm]
provider = "vertexai"
model_default = "gemini-flash"
model_premium = "gemini-pro"

[service]
timeout_seconds = 30

[retrieval]
top_k = 5

[policy]
confidence_threshold = 0.90

Policy (rule):   "Confidence below the threshold → human review"
Configuration:   confidence_threshold = 0.90
Configuration may parameterize a policy, but it is not the policy. Configuration ≠ Policy. Secrets never go in config.toml: local uses .env, production uses Secret Manager or secret injection.


Step 7. Write Adapters (technology edges):
Adapters implement ports. All vendor SDKs live here and nowhere else.

Outbound adapter (translates core request to technology call):
Inbound adapter (translates external request to a core command):

Step 8. Add Security (cross-cutting):
security/
├── authentication/   # validate tokens / credentials
├── authorization/    # roles, scopes
├── identity/         # who is the caller? which identity do we use downstream?
├── s2s/              # service-to-service protection (mTLS, workload identity)
└── secrets/          # fetch credentials from Secret Manager
Questions it answers: who is calling, how do we authenticate, what identity is used downstream, is the caller authorized, how are service-to-service calls protected, where do credentials live. Not every subfolder is mandatory for every service.

Step 9. Add Observability (cross-cutting):
Observability answers what happened. In GenAI, ordinary logging is not enough, because outputs vary run to run.
observability/
├── logging/   metrics/   tracing/   audit/

Every span / audit record should carry:
trace_id, span_id, correlation_id, request_id, service, operation, tool, model, latency, tokens, cost, policy decision, outcome, error


Step 10. Wire it: bootstrap.py vs app_factory.py
                            bootstrap.py:                                                        	            app_factory.py
Role	                    Startup (prepare the runtime)	                                                    Composition root (wire the components)

Does	                    Load config and env, init logging, set up OpenTelemetry, init security	             Instantiate adapters, build policy engine, inject adapters into ports, return the Application

Key question	            How is the runtime initialized?                                                 	How are components connected?

# bootstrap.py
def initialize() -> Settings:
    settings = load_config("configuration/config.toml")   # + .env / Secret Manager
    init_logging(settings)
    init_telemetry(settings)        # OpenTelemetry
    init_security(settings)
    return settings


# app_factory.py  - the ONLY place that knows concrete classes
def create_application(settings: Settings) -> Application:
    # adapters
    llm = VertexAIAdapter(vertex_client(settings), settings.llm) \
          if settings.llm.provider == "vertexai" else OllamaAdapter(settings.llm)
    incidents = ServiceNowAdapter(settings.servicenow)
    logs      = CloudWatchAdapter(settings.aws)
    knowledge = VectorDBAdapter(settings.vector)

    # policies
    engine = PolicyEngine(
        input_p=InputPolicy(model_armor_client(settings)),
        data_p=DataPolicy(dlp_client(settings)),
        model_p=ModelPolicy(settings.llm),
        cost_p=CostPolicy(settings.cost),
        confidence_p=ConfidencePolicy(settings.policy.confidence_threshold),
        tool_p=ToolPolicy(),
        approval_p=ApprovalPolicy(),
        audit=AuditLogger(),
    )

    # use case (ports <- adapters)
    use_case = InvestigateIncident(incidents, logs, knowledge, llm, engine,
                                   ServiceNowApproval(settings), CloudRemediation(settings),
                                   OTelTelemetry())
    return Application(routes=build_api(use_case))



# __main__.py   (python -m agent_incident)
from . import bootstrap, app_factory

if __name__ == "__main__":
    settings = bootstrap.initialize()
    app = app_factory.create_application(settings)
    app.run()


Startup sequence:
python -m agent_incident
        ↓
__main__.py
        ↓
bootstrap.py       (config → logging → telemetry → security)
        ↓
app_factory.py     (adapters → policies → ports → application → API)
        ↓
Application ready to handle requests
Why this split pays off: startup concerns stay apart from wiring; dependency injection happens in exactly one place; tests can build an application with mock adapters in one call.

