Part 7. Guardrails Without Hurting Latency:
Technique	                                    How it reduces latency
Run independent checks in parallel	            Injection screening, DLP masking and budget check do not depend on each other; use asyncio.gather so total time is the slowest one, not the sum

Scan only what goes out	                        Apply DLP to the text actually sent to the LLM (logs, free text), not to whole records or structured IDs

Tier the checks                             	Cheap deterministic checks first (length, allow-lists, regex); call remote services only if those pass

Co-locate in region	                            Use regional endpoints in the same region as Vertex AI to avoid cross-region hops

Cache	                                        Cache verdicts and mask results for identical content (e.g. repeated log lines, repeated runbook chunks) within a safe TTL

Pre-mask at ingestion	                        Mask knowledge-base content when it is indexed, so retrieval-time masking is only for fresh data

Right-size the model	                        Model Policy routes simple tasks to Flash; savings on the LLM call usually dwarf guardrail overhead

Fail closed, with timeouts	                    Each guardrail has a timeout from config; on timeout the request is denied or degraded to human review, never silently skipped

Stream-aware output                             checks	Where output screening is required, evaluate in chunks rather than waiting for the full response

Measure it	                                    Emit per-policy latency in traces; tune from data, not assumptions

Principle: latency optimizations may change how a check runs, never whether it runs. A skipped check is a policy violation.

Validate exact API names, quotas and per-call latency for Model Armor and Cloud DLP against current Google Cloud documentation and your own load test before quoting numbers.
