Part 9. How to Add a New Capability (Worked Example):
Scenario: add a rule, "Never send customer emails to the LLM, and use the cheap model for incidents below HIGH severity."
    
Step	            Action                          	                                                        Files touched
1	                Is it business truth or governance? Governance → policy                                 	none yet
2	                Add/extend a Data policy to mask email addresses	                                        policies/data/
3	                Add a Model policy rule keyed on severity	                                                policies/model/
4	                Put thresholds/model names in config	                                                    configuration/config.toml
5	                Register in the engine	                                                                    app_factory.py
6	                Add table-driven tests                                                                  	tests/policies/
7	                Confirm traces show the new verdicts	                                                    observability check
Not touched: core/domain, core/application, any adapter. That is the payoff of the architecture.

Scenario 2: switch LLM provider. Write NewAdapter implementing LLMPort, run the shared contract tests, change provider in config, add one branch in app_factory.py. The core is unchanged.
