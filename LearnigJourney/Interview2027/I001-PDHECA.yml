Part 3. The Four Ideas We Combine:
These are complementary, not competing.

Paradigm	                                Main question	                                                What it gives us
Clean Architecture	                        How do we keep business logic independent?	                    Dependencies point inward toward the domain
Hexagonal (Ports & Adapters)	            How does the core talk to the outside world?	                Swap technology without touching the core
Policy-Driven	                            Who decides what is allowed?	                                Governance is explicit and central
Enterprise Cross-Cutting	                How do we secure, observe and govern everything?	            Security, audit, resilience applied consistently

3.1 Clean Architecture in one picture:
Infrastructure  →  Application  →  Domain
 (outer)                            (inner)

Dependencies point INWARD only.


3.2 Hexagonal in one picture:
Core
 └── LLMPort  (contract)
       ├── OllamaAdapter     (prototype)
       ├── OpenAIAdapter
       ├── GeminiAdapter
       └── VertexAIAdapter   (production)
The core says "I need an LLM capability." It never says "I need OpenAI."


3.3 Policy-Driven: the flow change
TRADITIONAL                         POLICY-DRIVEN
Adapter                             Adapter
  ↓                                   ↓
Port                                Port
  ↓                                   ↓
Application / Domain                POLICY   ◄── new: before
                                      ↓
                                    Application / Domain
                                      ↓
                                    POLICY   ◄── new: after
                                      ↓
                                    Port
                                      ↓
                                    Adapter
Governance becomes an explicit architectural concern rather than scattered if statements.
