Part 1. Why This Architecture Exists:    
Traditional enterprise architectures (layered, MVC, plain Clean Architecture) work well for deterministic software. GenAI adds four problems they were not designed for:

GenAI problem:	                                                        What goes wrong without a dedicated answer
Non-deterministic output	                                            Same input gives different answers; you must gate what the model is allowed to cause
Prompt injection	                                                    Malicious text in a prompt, log or document hijacks the agent
PII / sensitive data leakage	                                        Customer data reaches a third-party or shared model
Unpredictable token cost                                            	One runaway agent loop burns the monthly budget

The typical failure pattern is that governance ends up scattered through the code:
# ANTI-PATTERN: governance buried inside business logic
def investigate(incident_id):
    logs = get_logs(incident_id)
    if "ssn" in logs.lower():          # data policy, hidden here
        logs = logs.replace(...)
    answer = call_llm(logs)
    if answer.confidence > 0.9:        # confidence policy, hidden here
        if answer.action == "restart": # tool policy, hidden here
            restart_service()          # no approval, no audit

Problems with this: it cannot be audited, it is duplicated across use cases, changing a rule means editing business code, and nobody can answer "what are our guardrails?" without reading everything.

Our answer: make governance an explicit, central, testable layer. This is what "Policy-Driven" means.

1.1 Objective:

The purpose of this architecture is to provide a standard enterprise architecture for GenAI and Agentic AI applications that are:

Secure
Governed
Testable
Technology-independent
Observable
Maintainable
Replaceable
Production-ready

---

Part 2. The Mental Model:
2.1 Six statements to memorize:

Core:                       decides WHAT (business logic and use cases).
Ports:                      define the CONTRACT (what capabilities we need).
Adapters:                   implement HOW (the specific technology).
Policies:                   decide WHETHER it is allowed (governance).
Configuration:              provides SETTINGS (runtime values).
Observability:              tells us WHAT HAPPENED (logs, metrics, traces, audit).
Security (who are you?) sits alongside these as a cross-cutting capability. Together that gives eight separate concerns:


Concept                                                 	The question it answers:
Domain	                                                    What does the business mean?
Application	                                                What use case are we executing?
Port                                                    	What capability or contract do we need?
Adapter	                                                    How is that capability implemented?
Policy	                                                    Is this action allowed right now?
Security	                                                Who is calling, and are they authorized?
Configuration	                                            What settings should we use?
Observability	                                            What happened?
Rule of thumb: if you cannot say which of the eight a piece of code belongs to, it is probably doing two jobs. Split it.


2.1.1  Core Architecture:

Domain + Application + Ports

Domain defines business truth. Application executes business use cases. Ports define how the Core communicates with the outside world.

What is the Core?:
Think of the Core as the technology-independent heart of the application.
                 CORE
                  |
       +----------+----------+
       |          |          |
       v          v          v
    DOMAIN    APPLICATION   PORTS

The Core should be able to answer:
What is an Incident?
What is a Critical Incident?
What does "Investigate Incident" mean?
What capabilities do we need?
What should happen during the use case?

But it should not answer:
How do I call ServiceNow?
How do I call Vertex AI?
How do I expose REST?
How do I connect to PostgreSQL?
How do I implement MCP?
How does Google ADK work?


Core dependency rule:
This is the most important rule for developers:
                 TECHNOLOGY
                     |
                     v
                  ADAPTER
                     |
                     v
                   PORT
                     |
                     v
               APPLICATION
                     |
                     v
                  DOMAIN
                  
                  
Dependencies should move toward the business core.

Domain Layer:
The Domain represents:
Business meaning + business rules
Incident
IncidentStatus
IncidentPriority
RootCause
Recommendation
RemediationAction
AgentDecision
ConfidenceScore


as Domain concepts.

A possible structure is:
core/
└── domain/
    ├── entities/
    │   └── incident.py
    │
    ├── value_objects/
    │   ├── severity.py
    │   └── confidence.py
    │
    ├── events/
    │   └── incident_investigated.py
    │
    └── exceptions.py
    


Domain Entity:
An Entity represents something that has business identity.

Our primary entity is:    
Incident

Conceptually:
Incident
├── incident_id
├── title
├── description
├── severity
├── status
└── created_at
For example:
INC12345
Database connection failures
Severity = CRITICAL
Status = OPEN
The important point is that Incident does not care where the data came from.

It could have come from:
ServiceNow
or:
REST API
or:
Kafka event
or:
another agent
The Domain only understands:
Incident


Domain Value Object:
A Value Object represents a business concept whose meaning is defined by its value rather than by an independent identity.

Examples:
Severity
ConfidenceScore
IncidentPriority
For example:
Severity = CRITICAL
Instead of allowing arbitrary strings everywhere:
severity = "critical"
we can model:
Severity.CRITICAL

This gives us a central place for business validation.
For example:
Allowed:
LOW
MEDIUM
HIGH
CRITICAL

Invalid:
VERY_BAD
SUPER_CRITICAL

The exact implementation can vary, but the architectural responsibility belongs to the Domain.

Domain Business Rule:
Now we reach a very important distinction.
Suppose the business says:
A Critical incident requires controlled remediation.
This is a Domain rule.
It describes what the business means.
Incident
   |
   +---- Severity = CRITICAL
              |
              v
       Controlled remediation


This is not necessarily a technology rule.:
It doesn't mention:
FastAPI
Vertex AI
ServiceNow
Google ADK

Therefore it belongs in Domain.
--

Application Layer:
Now we move one level outward.
The Application layer answers:
How is a business use case executed?
InvestigateIncident
AnalyzeRootCause
GenerateRemediation
CreateIncident
UpdateIncident
SummarizeIncident

For our system:
core/
└── application/
    ├── use_cases/
    │   └── investigate_incident.py
    │
    ├── services/
    │
    └── workflows/




What is a Use Case?:
A Use Case represents an application capability.
For example:
InvestigateIncident
Its responsibility is to coordinate the steps required to investigate an incident.

Conceptually:
InvestigateIncident
        |
        +---- Get Incident
        |
        +---- Get Runtime Evidence
        |
        +---- Retrieve Knowledge
        |
        +---- Analyze Evidence
        |
        +---- Determine Root Cause
        |
        +---- Calculate Confidence
        |
        +---- Recommend Remediation

What Application should NOT do:
A common mistake is turning the Application layer into a giant infrastructure layer.
For example, this is bad:
class InvestigateIncident:

    def execute(self):

        # ServiceNow SDK
        incident = servicenow_client.get_incident()

        # Google SDK
        response = vertex_ai.generate_content(...)

        # PostgreSQL
        connection = psycopg.connect(...)

        # Vector DB
        results = pinecone.query(...)

Why?
Because now the Application knows the technology.
Instead:

Application
     |
     +---- IncidentRepositoryPort
     |
     +---- KnowledgeRepositoryPort
     |
     +---- LLMPort
     
The Application orchestrates capabilities.:
The Adapters perform technology-specific work.:
--

Application = Orchestrator:
A useful mental model:
Application coordinates; it does not implement infrastructure.

For example:     
InvestigateIncident
        |
        +---- IncidentRepositoryPort
        |
        +---- EvidenceRepositoryPort
        |
        +---- KnowledgeRepositoryPort
        |
        +---- LLMPort
        
The Application says:
"I need the incident."
"I need runtime evidence."
"I need knowledge."
"I need an LLM."
The Ports define those contracts.
The Adapters decide how to fulfill them.            
--


Ports:
Now we reach the third part of the Core.
core/
└── ports/
    ├── inbound.py
    └── outbound.py
Think of a Port as a socket.
The Core says:
"This is the capability I require."
It doesn't care which technology plugs into that socket.

Inbound Port:
An Inbound Port defines:
How can someone invoke the application?
For our example:
InvestigateIncidentPort

Potential callers:

REST
MCP
