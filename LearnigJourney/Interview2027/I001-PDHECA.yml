2.1.5 What does "Configuration provides SETTINGS" mean?:
Configuration provides values, not business decisions.

For example:
 
[service]
timeout = 30

[llm]
model = "gemini"

[policy]
confidence_threshold = 0.90 

These are settings.

But:
If confidence < 0.90
        ↓
require human review

is a policy.
Therefore:
Configuration ≠ Policy
 
 
2.1.6 What does "Observability tells us WHAT HAPPENED" mean?:
A GenAI system is not just:
Request → Response
We need to understand the complete execution.

For example:
Request
   |
   +-- ServiceNow call       250 ms
   |
   +-- Log retrieval         800 ms
   |
   +-- Vector search         150 ms
   |
   +-- LLM call             1800 ms
   |
   +-- Policy evaluation      20 ms
   |
   +-- Tool execution        500 ms
We need to capture things such as:

trace_id
span_id
request_id
service
operation
tool
model
latency
tokens
cost
policy decision
outcome
error



