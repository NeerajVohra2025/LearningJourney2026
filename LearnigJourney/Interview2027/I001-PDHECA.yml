Part 9.Interview and Onboarding Cheat Sheet:
Q: What is Policy-Driven Hexagonal Enterprise Clean Architecture? A combination of Clean Architecture (independent business logic), Hexagonal (ports and adapters for technology independence), a Policy layer (explicit, central governance) and cross-cutting security, configuration and observability. It exists because GenAI adds non-determinism, prompt injection, PII leakage and unpredictable cost, and these must be governed in one place.

Q: Domain vs Application? Domain is business truth (entities, rules) and knows no technology. Application orchestrates use cases by calling ports.

Q: Ports vs Adapters? Ports are contracts that say what capability the core needs. Adapters are technology implementations that translate between core and vendor. Swap Ollama for Vertex AI by swapping the adapter.

Q: Why is Policy outside the Core? Domain rules and governance have different lifecycles and owners. The core triggers governance through a port; the policy layer implements it.

Q: Policy vs Security vs Configuration? Security = who are you. Policy = is this action allowed now. Configuration = the values a policy uses.

Q: bootstrap vs app_factory? bootstrap prepares the runtime (config, logging, telemetry). app_factory is the composition root where dependency injection and port-to-adapter wiring happen.

Q: How do you add guardrails without latency pain? Centralize them in the policy engine, run independent checks in parallel, tier cheap checks first, co-locate regionally, cache, route simple tasks to cheaper models, enforce timeouts that fail closed, and measure per-policy latency.

Q: How is GenAI observability different? Beyond logs: token economics, policy verdicts, and agent/tool latency across MCP and A2A calls, all in one trace.

One-line summary: We do not just build an AI that works; we build one that is secure, governed, observable and cost-optimized, with governance built into the architecture rather than bolted on.
