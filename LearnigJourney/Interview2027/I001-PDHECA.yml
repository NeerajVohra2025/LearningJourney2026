│   ├── data/                      #   PII masking, residency, DLP
│   ├── model/                     #   which model/provider
│   ├── tool/                      #   read / create / update / delete / execute
│   ├── approval/                  #   human-in-the-loop rules
│   ├── confidence/                #   autonomy thresholds
│   ├── cost/                      #   budget checks
│   └── governance/                #   compliance, responsible AI, audit rules
│
├── security/                      # WHO: identity and access
│   ├── authentication/
│   ├── authorization/
│   ├── identity/
│   ├── s2s/                       #   service-to-service
│   └── secrets/
│
├── adapters/                      # HOW: technology-specific edges
│   ├── inbound/api/               #   FastAPI, MCP server, Kafka, CLI, A2A
│   └── outbound/
│       ├── llm/{ollama,vertexai}/
│       ├── tools/servicenow/
│       └── ...                    #   cloudwatch, vector DB, postgres
│
├── observability/                 # WHAT HAPPENED
│   ├── logging/  metrics/  tracing/  audit/
│
├── configuration/                 # WITH WHAT SETTINGS
│   └── config.toml
│
├── bootstrap.py                   # STARTUP
├── app_factory.py                 # WIRING (composition root)
└── __main__.py                    # ENTRY POINT

Placement decision (important): policies/ is a top-level folder, not core/domain/policies/. Domain rules and governance rules change at different speeds and are owned by different people 


Dependency rule for imports:
adapters ─► core.ports ◄─ core.application ─► core.domain
policies ─► core.ports  (implements PolicyGatewayPort)
core imports NOTHING from adapters/, policies/, security/, observability/ implementations

