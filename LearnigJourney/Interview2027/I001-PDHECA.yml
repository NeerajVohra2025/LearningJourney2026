Part 6. End-to-End Walkthrough:
Request: "Investigate INC12345 and restart the service if necessary."


        
#	Stage	                    Layer	                                    What happens
1	Inbound	                    Adapter (FastAPI)	                        REST POST /investigate received; caller authenticated
2	Translate	                Inbound Port	                            HTTP body becomes InvestigateIncidentCommand
3	Pre-check	                Policy (Input / Security)	                Prompt screened for injection; user authorized; data access checked
4	Orchestrate	                Application	                                InvestigateIncident starts
5	Fetch	                    Outbound Adapters	                        Incident from ServiceNow, logs from CloudWatch, runbooks from Vector DB
6	Pre-LLM	                    Policy (Data / Model / Cost)	            Cloud DLP masks PII; Model Policy selects Gemini Pro; budget checked
7	Reason	                    LLM Adapter (Vertex AI)                 	Returns Root Cause = DB connection pool exhausted, Confidence = 94%, Action = restart service
8	Post-check: confidence	    Policy	                                    94% ≥ 90% threshold → PASS
9	Post-check: tool risk	    Policy	                                    Restarting a production service = HIGH RISK → approval required
10	Human-in-the-loop	        Approval Port	                            System pauses, creates approval ticket in ServiceNow
11	Approve                 	Human (SRE)	                                SRE clicks Approve
12	Execute                     Outbound Adapter	                        Restart executed
13	Observe                     Observability	                            One distributed trace: latency, tokens, cost, every policy verdict


External (REST)
   ↓
Inbound Adapter (FastAPI)
   ↓
Inbound Port (InvestigateIncident)
   ↓
