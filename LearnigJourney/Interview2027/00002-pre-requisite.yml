# Step 2.26 — One-Time Configuration vs Runtime

This distinction should be very clear in the final architecture document.

One-time configuration

Performed by platform administrators:

1. Create GCP project/configuration
2. Enable APIs
3. Create Workload Identity Pool
4. Create Okta OIDC Provider
5. Configure issuer
6. Configure audience
7. Configure attribute mapping
8. Configure attribute condition
9. Create DEV service account
10. Grant WorkloadIdentityUser
11. Configure Cloud Run IAM
12. Configure API Gateway
Runtime

Happens for every request:

ServiceNow
    ↓
Request Okta token
    ↓
Receive OIDC JWT
    ↓
Call API Gateway
    ↓
Google/API Gateway validates configured identity
    ↓
Gateway forwards to Cloud Run
    ↓
Cloud Run receives incident request

