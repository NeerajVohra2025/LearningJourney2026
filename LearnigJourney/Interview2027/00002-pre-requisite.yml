# Step 2.28 — Final Mental Model

Remember these four things:

1. Okta answers:

Who is ServiceNow?

servicenowtestdev
2. Workload Identity Federation answers:

Does Google trust this external identity?

Yes — because issuer, audience, claims and federation policy match.
3. IAM answers:

What can this identity do?

Allowed Google permissions
4. API Gateway answers:

What is the application's front door?

GCP API Gateway

And the backend is:

DEV Cloud Run Orchestrator

So the complete security chain is:

                 IDENTITY
                    │
                    ▼
ServiceNow → Okta → OIDC JWT
                    │
                    ▼
          Workload Identity Federation
                    │
                    ▼
             Google IAM
                    │
                    ▼
              API Gateway
                    │
                    ▼
             Cloud Run DEV

