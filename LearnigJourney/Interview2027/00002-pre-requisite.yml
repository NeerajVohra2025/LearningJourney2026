Chapter 1 — Step 1: ServiceNow DEV Machine Identity
Step 1.0 — First Understand What We Are Building:

Before we build any AI agent, we first need to establish a secure path from ServiceNow to our Google Cloud platform.
There Are Two One-Time Prerequisites:
There are two different teams involved.
| Step | Prerequisite                                   | Owner                 | Why we need it                                      |
| ---- | ---------------------------------------------- | --------------------- | --------------------------------------------------- |
| 1    | ServiceNow identity / OAuth-OIDC configuration | ServiceNow / IAM team | Gives ServiceNow a trusted machine identity         |
| 2    | Google Cloud Workload Identity Federation      | GCP / IAM team        | Allows Google Cloud to trust that external identity |

Think about it this way:
                ONE-TIME SETUP

        Step 1                    Step 2
   ServiceNow / IAM              GCP / IAM
         |                           |
         | Create identity            | Create trust
         |                           |
         v                           v
 ServiceNow Identity -------> Google Cloud Trust
 
 Only after these two steps are completed do we configure and test the runtime webhook.

Our objective is:
Allow ServiceNow DEV to securely invoke the GenAI Application through GCP API Gateway.
The application entry point is GCP API Gateway.
Therefore, our high-level runtime path is:
ServiceNow DEV
     |
     | HTTPS Request
     v
GCP API Gateway          ← GenAI Application Entry Point
     |
     v
DEV Orchestrator
     |
     v
Cloud Run
But before ServiceNow can call the API Gateway, we must establish identity and trust.
That is the purpose of Step 1.:


Step 1 — Identify the ServiceNow DEV Caller:
Our first question is:
Who is calling the GenAI application?
The answer is:
ServiceNow DEV
More specifically, the integration is represented by a machine identity such as:
servicenowtestdev

This is not a human identity.
It represents:
ServiceNow DEV Incident Integration

So our first logical model is:
ServiceNow DEV
     |
     | Machine Identity
     v
servicenowtestdev

Why do we need this?:
Because the API Gateway should never have to accept:
Unknown caller
     |
     v
API Gateway

We want:
Known ServiceNow DEV identity
     |
     v
API Gateway


Step 1.1 — ServiceNow Does Not Directly Establish Google Identity:
This is an important distinction.
ServiceNow is an external application.
Google Cloud should not simply assume:
"Anything coming from ServiceNow is trusted."
Instead, ServiceNow authenticates through our corporate Identity Provider.
In our environment:
ServiceNow DEV
      |
      | Authenticate
      v
     Okta

So:
Okta is the Identity Provider for the ServiceNow DEV machine identity.


Step 1.2 — Create the Okta Application for ServiceNow DEV:
The Okta administrator creates/configures an application representing the ServiceNow DEV integration.
Conceptually
Okta
 |
 +--------------------------------+
 | ServiceNow DEV Application     |
 |                                |
 | Client ID                      |
 | Client Secret                  |
 | Token Configuration            |
 | Audience                       |
 +--------------------------------+

This establishes the relationship:
ServiceNow DEV
      ↕
Okta

The exact Okta configuration is owned by the Okta/IAM team.


Step 1.3 — Configure OAuth 2.0 Client Credentials:
Because ServiceNow is an application rather than a human, we use:
OAuth 2.0 Client Credentials
The conceptual flow is:
ServiceNow DEV
     |
     | Client ID
     | Client Secret
     v
Okta

There is no:
Username
Password
MFA

in this machine-to-machine flow.
The purpose is simply:
ServiceNow proves to Okta that it is the registered ServiceNow DEV integration.


Step 1.4 — ServiceNow Requests an Identity Token:
When ServiceNow needs to authenticate, it contacts the configured Okta token endpoint.
Conceptually:
ServiceNow DEV
servicenowtestdev
       |
       | OAuth 2.0 Client Credentials
       v
Okta Token Endpoint

ServiceNow provides the credentials required by the configured OAuth client.
Okta then authenticates the client.

Step 1.5 — Okta Validates the ServiceNow Client:
Okta checks:
Is this a registered client?
        |
        v
Are the client credentials valid?
        |
        v
Is this client allowed to request this token?

If everything is valid:
ServiceNow DEV
       |
       v
Okta
       |
       ✓
Identity established

If authentication fails:
ServiceNow DEV
       |
       v
Okta
       |
       X
Request rejected
No Google Cloud request should proceed from that failed authentication.


Step 1.6 — Okta Issues the OIDC JWT:
After successful authentication, Okta issues the configured OIDC identity token.
Conceptually:
ServiceNow DEV
       |
       v
     Okta
       |
       | Signed OIDC JWT
       v
ServiceNow

The JWT contains claims identifying the caller.

For example:
{
  "iss": "https://your-okta-domain/oauth2/default",
  "sub": "servicenowtestdev",
  "aud": "gcp-genai-dev",
  "iat": 1782322932,
  "exp": 1782323232
}
These are example values. The actual issuer, subject and audience must come from your Okta/GCP configuration


Step 1.7 — Understand the Important JWT Claims:
We only need to understand four claims at this stage.

iss — Issuer
Who issued this token?
Expected answer:
Okta

sub — Subject
Which identity does this token represent?
Expected conceptual value:
servicenowtestdev

aud — Audience
Who is this token intended for?
The audience must be agreed between the Okta/IAM and GCP/IAM teams.


exp — Expiration
Is the token still valid?
An expired token must not be accepted.

So conceptually Google receives:
Token
 |
 +-- Issuer       → Is this a trusted issuer?
 |
 +-- Subject      → Is this the approved ServiceNow identity?
 |
 +-- Audience     → Is this token intended for us?
 |
 +-- Expiration   → Is the token still valid?
 
 
Step 1.8 — Now Google Cloud Receives the External Identity:
At this point we have:
ServiceNow DEV
      |
      v
Okta
      |
      | Signed OIDC JWT
      v
Google Cloud

But Google Cloud does not automatically trust every Okta token.
We need to configure that trust.
That is where:
Workload Identity Federation
comes into the picture.
---

Step 1.9 — GCP Creates a Workload Identity Pool:
The GCP/IAM administrator creates a DEV Workload Identity Pool.
Conceptually:
Google Cloud DEV
       |
       v
Workload Identity Pool
       |
       +--- ServiceNow DEV
       
Think of the pool as:
A controlled place where external identities can be recognized by Google Cloud.       


Step 1.10 — GCP Creates an Okta OIDC Provider:
Inside the Workload Identity Pool, GCP configures an OIDC provider for Okta.
Conceptually:
Workload Identity Pool
        |
        v
Okta OIDC Provider
        |
        +-- Issuer
        +-- Audience
        +-- Attribute Mapping
        +-- Attribute Conditions
        
This tells Google Cloud:
"For this DEV integration, Okta is a trusted external identity provider."        



Step 1.11 — Google Validates the Okta JWT:
Now the external JWT reaches Google's token-exchange mechanism.
Conceptually:
Okta JWT
   |
   v
Google Security Token Service

Google validates the configured identity information.
Conceptually:
                Google STS
                    |
                    v
          Is the signature valid?
                    |
                    v
             Is issuer trusted?
                    |
                    v
            Is audience correct?
                    |
                    v
             Is token valid?
                    |
                    v
          Is identity permitted?

If validation fails:
Okta JWT
   |
   v
Google STS
   |
   X
Rejected

If validation succeeds:
Okta JWT
   |
   v
Google STS
   |
   ✓
Federated identity established



Step 1.12 — Google Maps the ServiceNow Identity
Now Google needs to understand:
Which external identity is this?
For example:
Okta
 |
 +-- sub = servicenowtestdev
              |
              v
       Attribute Mapping
              |
              v
       Google Identity
       
This mapping is configured once by the GCP/IAM team.
It does not need to be created for every incident.       


Step 1.13 — Restrict the Identity
We don't want every identity in Okta to access the GenAI platform.
We want only the approved DEV ServiceNow identity.
Conceptually:
Incoming Okta Identity
          |
          v
Is this servicenowtestdev?
       /       \
     YES        NO
      |          |
      v          v
   Continue    Reject
   
This is where the GCP IAM team can use an attribute condition to restrict the federation.


Step 1.14 — Map to the DEV Google Service Account
Now we establish the Google-side identity.
For example:   
servicenowtestdev
       |
       | WIF
       v
genai-orchestrator-dev
The Google service account represents the permissions that the federated workload is allowed to use.
For example:
genai-orchestrator-dev
        |
        +-- API Gateway access
        |
        +-- Required DEV permissions

Only the permissions actually required by the application should be granted.


Step 1.15 — Important: ServiceNow Does Not Become the Service Account
This is a common misunderstanding.
We do not have:
ServiceNow = Google Service Account
Instead:
ServiceNow Identity
       |
       | Federation
       v
Google Federated Identity
       |
       | IAM authorization
       v
DEV Google Service Account

The important security benefit is:
We don't give ServiceNow a permanent Google service-account private key.
The external identity and Google service identity remain conceptually separate.


Step 1.16 — Google Issues a Short-Lived Credential:
After successful federation and, where the design uses service-account impersonation, successful service-account authorization, Google can issue a short-lived Google credential.
Conceptually:
Okta OIDC JWT
       |
       v
Google STS
       |
       v
Federated Identity
       |
       v
genai-orchestrator-dev
       |
       v
Short-Lived Google Credential

The important security benefit is:
We don't give ServiceNow a permanent Google service-account private key.


Step 1.17 — Now the GenAI Application Entry Point Is Ready:
Now we come to the most important point in your architecture.
Our GenAI Application entry point is GCP API Gateway.
Therefore:
                  GENAI APPLICATION

ServiceNow DEV
      |
      | Authenticated request
      v
┌───────────────────────────────┐
│       GCP API Gateway         │
│                               │
│     GENAI ENTRY POINT         │
└───────────────┬───────────────┘
                |
                v
        DEV Orchestrator
          Cloud Run

The API Gateway is therefore the front door of the GenAI application.


Step 1.18 — API Gateway Is the Security Front Door
The gateway now receives the request.
Its role is:
              GCP API Gateway
                     |
          +----------+----------+
          |                     |
     Authentication        Routing
          |                     |
          v                     v
     Is caller allowed?   Which backend?
          |                     |
          +----------+----------+
                     |
                     v
              DEV Orchestrator

The gateway should not become the AI workflow engine.
Its job is to provide the controlled application entry point.

The final state is:
┌────────────────────┐
│  ServiceNow DEV    │
│ servicenowtestdev  │
└─────────┬──────────┘
          |
          | Okta
          v
┌────────────────────┐
│     Okta IdP       │
└─────────┬──────────┘
          |
          | OIDC Identity
          v
┌────────────────────┐
│ Google WIF / STS   │
└─────────┬──────────┘
          |
          | Federated Identity
          v
┌────────────────────┐
│ DEV Service        │
│ Account            │
└─────────┬──────────┘
          |
          | Authorized
          v
╔════════════════════╗
║ GCP API GATEWAY    ║
║                    ║
║ GENAI ENTRY POINT  ║
╚════════╤═══════════╝
         |
         v
┌────────────────────┐
│ DEV Orchestrator   │
│ Cloud Run          │
└────────────────────┘

Step 1 — In Very Simple Words:
Think of this like entering a secure office.

1. ServiceNow gets an ID:
ServiceNow DEV
      ↓
servicenowtestdev

2. Okta verifies the ID:
servicenowtestdev
      ↓
Okta
      ↓
Signed OIDC JWT


3. Google verifies Okta's identity:
OIDC JWT
      ↓
Google STS
      ↓
WIF


4. Google maps it to the DEV identity:
ServiceNow DEV
      ↓
Google Federation
      ↓
genai-orchestrator-dev


5. ServiceNow calls the application:
ServiceNow DEV
      ↓
GCP API Gateway
      ↓
DEV Orchestrator

And the single most important architectural statement is:
GCP API Gateway is the GenAI application's entry point. Cloud Run/Orchestrator is the backend application behind the gateway.

At the end of Step 1, we only know:
WHO?
ServiceNow DEV / servicenowtestdev

WHO AUTHENTICATES IT?
Okta

WHO TRUSTS IT?
Google Cloud WIF

WHICH GOOGLE IDENTITY?
DEV service account

WHERE DOES THE GENAI APPLICATION START?
GCP API Gateway

WHERE DOES THE REQUEST GO NEXT?
DEV Orchestrator on Cloud Run
