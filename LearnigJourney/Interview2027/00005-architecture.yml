Chapter 17 — Evidence vs Grounding:
This distinction should be memorized.

| Concept         | Question answered                                 |
| --------------- | ------------------------------------------------- |
| Evidence        | What facts do we have?                            |
| RAG             | What relevant knowledge can we retrieve?          |
| Grounding       | What trusted information should the model use?    |
| Citation        | Where did the information come from?              |
| Fact validation | Does the generated claim agree with the evidence? |
| Confidence      | How strong is the supporting information?         |


Example:
Evidence:

E001:
Error rate = 42%

E002:
Deployment v2.8.3 at 10:01

E003:
Database latency increased

Grounding:
Provide E001, E002, E003
and relevant runbook context
to Gemini.

Gemini:
The incident is strongly correlated
with deployment v2.8.3.
Citation:
[E001][E002][E003]

Fact validation:
Does the statement agree
with E001-E003?
