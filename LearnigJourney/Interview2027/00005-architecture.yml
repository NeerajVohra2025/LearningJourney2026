Chapter 12 — Evidence Engineering:
This is one of the most important new chapters.
What is Evidence?

Evidence is:
A traceable piece of information from an identifiable source that supports or contradicts an incident hypothesis.

Example:
Evidence ID: E001
Source:
Cloud Monitoring
Observation:
Error rate = 42%
Timestamp:
10:03 UTC

Another:

Evidence ID: E002
Source:
Deployment History
Observation:
Version v2.8.3 deployed
Timestamp:
10:01 UTC

Another:
Evidence ID: E003
Source:
Cloud Trace
Observation:
Database latency increased
after deployment.

Why do we need Evidence?
Because the LLM should not say:
"I think deployment v2.8.3 caused the problem."
It should reason:
E001 → Error rate increased
E002 → Deployment occurred
E003 → Database latency increased
Then form a conclusion based on those facts.
