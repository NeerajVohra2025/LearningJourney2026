The Three Concepts You Should Remember Most
If an interviewer asks:
"Explain Evidence, Grounding and Citation."

Use this answer:
1. Evidence:

Evidence is the factual information collected from authoritative enterprise sources to support or challenge an incident hypothesis.                              
Cloud Monitoring
Cloud Logging
Cloud Trace
ServiceNow
Deployment History
CMDB
        ↓
Evidence Package

2. Grounding:
Grounding is the process of providing trusted evidence and relevant enterprise knowledge to the model so that its response is based on verified context rather than only its pretrained knowledge.
Evidence + RAG Knowledge
          ↓
   Grounding Context
          ↓
        Gemini
        
3. Citation:
Citation is the mechanism that connects a generated claim back to the evidence or source that supports it.      
Claim
 ↓
Evidence ID
 ↓
Source
 ↓
Citation

And the relationship is:
             ┌──────────────┐
             │   Evidence   │
             │ "What we know"│
             └──────┬───────┘
                    │
                    ▼
             ┌──────────────┐
             │   Grounding  │
             │ "What model  │
             │ should use"  │
             └──────┬───────┘
                    │
                    ▼
                 Gemini
                    │
                    ▼
             ┌──────────────┐
             │    Claim     │
             └──────┬───────┘
                    │
                    ▼
             ┌──────────────┐
             │   Citation   │
             │ "Where did   │
             │ this come?"  │
             └──────────────┘  