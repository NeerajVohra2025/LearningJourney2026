Chapter 20 — Citation / Attribution:
What is Citation?:

Citation means:
Connecting a generated claim back to the source evidence or document that supports it.

Example:
Root Cause:

The incident correlates strongly with
deployment v2.8.3.

Evidence:

[E001] Cloud Monitoring
[E002] Deployment History
[E003] Cloud Trace

Why?
Without citation:
AI says:
"Deployment caused the incident."

We don't know why.
With citation:

AI says:
"Deployment v2.8.3 is strongly correlated
with the incident."
[E001]
[E002]
[E003]
Now the user can inspect the supporting information
---


Chapter 21 — How Citation Should Be Implemented:

Citation should not be invented after generation.
A stronger architecture is:
Evidence
   ↓
Evidence ID
   ↓
Grounding Context
   ↓
LLM
   ↓
Claim + Evidence IDs
   ↓
Citation Resolver
   ↓
Final Response

For example, instruct the structured output to return:
{
  "claim": "Deployment v2.8.3 is strongly correlated with the incident.",
  "evidence_ids": ["E001", "E002", "E003"]
}

The application then resolves:
E001 → Cloud Monitoring
E002 → Deployment History
E003 → Cloud Trace

Important
The LLM should not invent URLs, document IDs or evidence references.
The application should resolve citations from the authoritative Evidence Store.
---

Chapter 22 — Citation vs Grounding:
This is a critical interview question.

Grounding:
Happens before/during generation.
Trusted Data
    ↓
Model Context
    ↓
Generation


Citation:
Happens as part of attribution of the generated result
Generated Claim
    ↓
Evidence ID
    ↓
Source

Therefore:
Grounding helps the model stay connected to trusted information; citation helps the user verify where the information came from.
