Chapter 32 — Failure & Resilience Architecture:
This chapter should explicitly answer:

What if DLP fails?:

Sensitive-data control unavailable
        ↓
Do not continue sensitive processing
        ↓
Fail closed / controlled degradation

What if Model Armor fails?:

Do not bypass the control for high-risk processing.

What if evidence sources disagree?

Return:
Conflicting Evidence
rather than forcing a conclusion.

What if no evidence exists?

Return:
Insufficient Evidence

rather than hallucinating.

What if ServiceNow is unavailable?:
Persist the action/result and retry through a controlled mechanism; do not lose the audit trail.
What if the LLM is unavailable?
The investigation can remain in a:
INVESTIGATION_PENDING
state.
