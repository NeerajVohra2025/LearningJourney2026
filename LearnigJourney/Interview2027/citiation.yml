28. What Should We Evaluate?

I would create at least these metrics.

1. Evidence Relevance

Did Sumo retrieval find useful evidence?
SUMO evidence relevant?
YES / NO

2. KB Retrieval Relevance

Did we retrieve the right ServiceNow KB?

KB001001
Relevant = YES


3. Groundedness

Is the RCA actually supported by evidence?

Claim:
Certificate expired

Evidence:
SUMO-E002

Grounded = YES                         


4. Citation Correctness

Does citation [1] actually support the claim?

5. Citation Completeness

Did the system cite important claims?

6. Faithfulness

Did the model add facts that weren't in the evidence?

7. RCA Accuracy

Was the root cause correct according to your validated incident dataset?

8. Latency
ServiceNow → response

and separately:

Sumo retrieval latency
KB retrieval latency
LLM latency
9. Cost

Track:

Sumo query cost
Embedding cost
Vector retrieval
LLM input tokens
LLM output tokens
