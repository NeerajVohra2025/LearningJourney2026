15. KB Document Loader

Your question was:

Which DocumentLoader will be used?

If ServiceNow exposes Knowledge Base content through an API, I would not force a PDF/Web/Directory document loader.

I would create a:

ServiceNow Knowledge Connector / API Loader

Conceptually:
ServiceNow REST API
        ↓
ServiceNowKnowledgeLoader
        ↓
Normalized Document

For example:
Document(
    page_content="""
    To renew an expired VPN certificate...
    """,
    metadata={
        "source": "ServiceNow",
        "kb_number": "KB001001",
        "category": "Network",
        "subcategory": "VPN",
        "status": "Published",
        "version": "3",
        "environment": "Production"
    }
)

The exact framework implementation can vary, but architecturally this should be an API-based enterprise connector, not treating ServiceNow as a random file repository.
---
16. KB Chunking Strategy:

Now your second question:
Which chunking strategy should we use for the KB?

For ServiceNow Knowledge Articles, I would start with:
Structure-aware + Recursive
and selectively add:
Semantic chunking

So:
ServiceNow KB
      ↓
Structure-aware parsing
      ↓
Recursive chunking
      ↓
Semantic validation
      ↓
Embedding
      ↓
Vector Store
Why?

Because ServiceNow articles commonly contain logical structures such as:
Problem
Symptoms
Cause
Resolution
Steps
Troubleshooting
Notes

We don't want:
Chunk 1:
half of a resolution procedure

Chunk 2:
other half of the procedure

We want:
Chunk 1
Symptoms

Chunk 2
Root Cause

Chunk 3
Resolution Steps

Chunk 4
Troubleshooting

Your RAG material emphasizes that chunking should preserve meaningful business ideas and that structure-aware, recursive, semantic and hybrid approaches are useful depending on the document type
---

