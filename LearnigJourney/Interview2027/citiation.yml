3. Step 1 — GCP API Gateway / Entry Point:
ServiceNow
    |
    | HTTPS webhook
    ↓
GCP API Gateway
    |
    ↓
Cloud Run
    |
    ↓
Orchestrator Agent
The request should be authenticated and authorized before reaching the agent.

Your Orchestrator receives:
incident_number = INC0012345

short_description =
VPN authentication failures after certificate expiration
---

It creates an internal investigation context:
{
  "incident_id": "INC0012345",
