31. The Most Important Design Decision

If I were reviewing this as a Principal GenAI Architect, I would explicitly document this rule: 
| Data                             | Nature                | Retrieval                        | Chunking                                            |
| -------------------------------- | --------------------- | -------------------------------- | --------------------------------------------------- |
| **ServiceNow incident**          | Transactional/live    | ServiceNow API                   | **No RAG chunking**                                 |
| **ServiceNow short description** | Query/context         | Passed directly                  | **No chunking**                                     |
| **Sumo Logic logs**              | Real-time operational | API/query + time/service filters | **Evidence grouping, not normal document chunking** |
| **ServiceNow KB**                | Enterprise knowledge  | Vector + metadata                | **Structure-aware + Recursive/Semantic**            |
| **Historical incidents**         | Historical knowledge  | Vector search                    | **Incident/evidence-aware chunks**                  |
| **RCA prompt**                   | Instruction           | Direct                           | **No chunking**                                     |
| **LLM response**                 | Generated output      | N/A                              | **No chunking**                                     |
| **Citations**                    | Traceability          | Evidence registry                | **No chunking**                                     |
