2. Let's Use One Concrete Incident:
Suppose ServiceNow sends:
Incident Number:
INC0012345

Short Description:
VPN authentication failures after certificate expiration

The ServiceNow webhook/request to your GCP application could conceptually be:
{
  "incident_number": "INC0012345",
  "short_description": "VPN authentication failures after certificate expiration"
}

Notice something important:
ServiceNow does NOT send the complete diagnostic evidence.
It only sends the incident context.
That is good architecture.

ServiceNow says:
"There is an incident."

Your AI platform determines:
"What evidence do I need to investigate this incident?"
