4. Step 2 — Orchestrator Decides What to Do:

This is where Agentic RAG begins.
The Orchestrator should not itself become responsible for every operation.
Its responsibility is:
Understand the task and coordinate specialized capabilities.
For this incident:
Orchestrator
     |
     ├── Need logs? → YES
     |
     ├── Need KB? → YES
     |
     ├── Need ServiceNow incident details? → Maybe
     |
     └── Need RCA? → YES
	 
So it invokes:
