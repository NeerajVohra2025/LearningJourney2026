They are two different retrieval paths:

Sumo Logic = live operational evidence → real-time tool/API retrieval
ServiceNow Knowledge Base = relatively stable knowledge → document ingestion + chunking + embeddings + vector retrieval

Then the RCA Agent combines the two evidence sets + incident context + prompt/policies, and the Vertex AI/Gemini model generates the grounded response.

