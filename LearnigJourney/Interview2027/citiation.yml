23. What Should the LLM Return?

I would not allow free-form text as the only response.

Have the model produce a structured result.

For example:
{
  "root_cause": {
    "statement": "VPN authentication failures are caused by an expired VPN certificate.",
    "confidence": "high"
  },

  "evidence": [
    {
      "id": "SUMO-E002",
      "supports": "Certificate expired"
    },
    {
      "id": "SUMO-E003",
      "supports": "TLS handshake failed"
    }
  ],

  "knowledge": [
    {
      "id": "KB001001-C03",
      "supports": "Certificate renewal procedure"
    }
  ],

  "recommendation": [
    "Renew the VPN certificate.",
    "Install the renewed certificate.",
    "Restart the VPN client."
  ]
}

Then your application—not the LLM—can construct the final citation presentation.

This is a very important architecture principle:

Don't ask the LLM to invent citation metadata. Pass citation IDs through the pipeline and resolve them from your evidence registry	
