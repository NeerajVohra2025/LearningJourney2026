19.27. Interview-Ready Answer:
Q: Why do we need re-ranking if retrieval already returns relevant documents?

"Retrieval is optimized for speed and recall, so it produces a candidate set rather than guaranteeing the perfect ranking. I typically retrieve a larger candidate set, such as Top-20, and then use a re-ranking model to evaluate the relationship between the query and each candidate more deeply. A Cross-Encoder is a common approach because it evaluates the query and document together, providing stronger relevance scoring than simple vector similarity. I then pass only the highest-quality candidates, for example Top-3 to Top-5, to the prompt builder. This improves evidence quality while controlling LLM context size, latency and cost."
This closely follows the architecture and interview framing in your source
---

Chapter 20 — Augmentation & Context Construction:
Your previous chapters have now taken us through:

Ingestion → Parsing → Cleaning → Chunking → Embedding → Vector Store → Metadata → Indexing → Query Processing → Query Embedding → Search → Retrieval → Re-ranking

20.1 What is Augmentation?:
In RAG, Augmentation is the process of enriching the user's question with the information required by the LLM before generation.
The augmented input can contain:

System instructions
Business rules
Retrieved knowledge
Re-ranked evidence
Conversation history
User question
Output-format instructions
Source/citation information

Conceptually:
User Question
      │
      ▼
Query Processing
      │
      ▼
Search → Retrieval → Re-ranking
      │
      ▼
Best Evidence
      │
      ├── System Instructions
      ├── Business Rules
      ├── Conversation History
      ├── Retrieved Knowledge
      └── User Question
                │
                ▼
        Prompt Construction
                │
                ▼
               LLM
                │
                ▼
             Response
The important point is:
The LLM does not directly query the Vector Database.
The RAG application constructs the context and sends the resulting prompt/input to the LLM.  
---

20.2 Why Do We Need Augmentation?:
Imagine the user asks:
"How many vacation days do I receive?"
If we send only that question to the LLM, the model may answer from its general knowledge.
But our enterprise system wants the answer based on the company's actual HR policy.

So Retrieval may find:           
HR Policy 2026

Annual Leave:
Employees receive 20 working days
of annual leave.
Augmentation combines this evidence with the question:
System Instructions:
Answer using the supplied enterprise knowledge.

Retrieved Context:
HR Policy 2026
Annual Leave:
Employees receive 20 working days of annual leave.

User Question:
How many vacation days do I receive?
The LLM can now generate an answer based on the supplied enterprise context.

This is why the source describes RAG as improving the quality of information available to the LLM, rather than making the LLM itself more intelligent.
---

20.3 Retrieval vs Re-ranking vs Augmentation:
This distinction is extremely important for interviews.
| Stage            | Main Question                                   | Output                     |
| ---------------- | ----------------------------------------------- | -------------------------- |
| **Search**       | Where are possible matches?                     | Candidate documents        |
| **Retrieval**    | Which candidates should continue?               | Top-K chunks               |
| **Re-ranking**   | Which candidates are most relevant?             | Best-ranked evidence       |
| **Augmentation** | How should we prepare the evidence for the LLM? | Constructed context/prompt |
| **Generation**   | What answer should be produced?                 | Final response             |

Simple mental model:
Search
  ↓
Find candidates

Retrieval
  ↓
Select candidates

Re-ranking
  ↓
Select best evidence

Augmentation
  ↓
Prepare evidence + instructions + question

Generation
  ↓
Generate answer
---

20.4 What Goes Inside the Augmented Context?:
A production prompt is usually much richer than:
User Question + Retrieved Documents
A conceptual enterprise prompt can look like:
SYSTEM INSTRUCTIONS
--------------------
You are an enterprise IT support assistant.

BUSINESS RULES
--------------
Answer using approved enterprise knowledge.
Do not invent unsupported information.

RETRIEVED CONTEXT
-----------------
Source: ServiceNow KB001234
Title: VPN Certificate Renewal
Version: 3

VPN certificates must be renewed
before expiration.

Source: ServiceNow KB001245
Title: VPN Troubleshooting
Version: 5

If the certificate has expired,
follow the certificate renewal procedure.

CONVERSATION HISTORY
--------------------
User previously reported:
"My VPN stopped working yesterday."

USER QUESTION
-------------
My VPN certificate expired.
How do I fix it?

OUTPUT INSTRUCTIONS
-------------------
Provide:
1. Diagnosis
2. Recommended steps
3. Sources
This complete structure becomes the input to the LLM.
---

20.5 Prompt Builder:
This is where the Prompt Builder becomes an important architectural component.

Think of it as:

Prompt Builder = Context Assembly Engine

Its responsibility is not simply writing a clever prompt.

It determines:

Which evidence should be included?
Which business rules apply?
Which conversation history is relevant?
How should the information be structured?
How much context can be sent?
How should sources be represented?
What output format is required?
---

20.6 Context Window:
This is one of the most important architectural considerations.
Every LLM has a context window, which determines how much input it can process in one request.

Conceptually:
Context Window
┌─────────────────────────────┐
│ System Instructions         │
│ Business Rules              │
│ Conversation History        │
│ Retrieved Chunks            │
│ User Question               │
│ Output Instructions         │
└─────────────────────────────┘
             ↓
       Total Tokens
The problem is that we cannot simply keep adding information.

For example:
15 retrieved chunks
+
50 conversation messages
+
large system prompt
+
business policies
+
user question

The Prompt Builder must decide what is important enough to retain.
The source identifies context-window management as one of the important responsibilities of the Prompt Builder.   
---

20.7 Context Prioritization:

Suppose the system has:
15 retrieved chunks
50 previous messages
large system instructions
multiple business policies

We should not blindly send everything.     
A typical prioritization described in the source is:

1. System Instructions
2. Safety Policies
3. User Question
4. Top-ranked Retrieved Chunks
5. Recent Conversation History
6. Older History
   ↓
Summarize/remove when necessary
The objective is:

Keep the most important information while remaining within the available context.
---

20.8 Context ≠ Just Retrieved Documents:
This is an important architect-level distinction.
Many people think:

RAG Context = Retrieved Documents

That's incomplete.

A production context can be:

Context
│
├── System Instructions
├── Security / Safety Policies
├── Business Rules
├── Retrieved Evidence
├── Conversation Context
├── User Question
└── Output Instructions

Therefore, context construction is broader than simply copying retrieved chunks into a prompt.
---

20.9 Prompt Templates:
Enterprise systems should avoid constructing every prompt manually.
The source recommends reusable templates.

Example:
Role:
{system_prompt}

Business Rules:
{business_rules}

Retrieved Context:
{retrieved_context}

Conversation:
{conversation_history}

User Question:
{user_question}

Instructions:
{output_format}

This provides:

consistency
maintainability
easier policy changes
easier testing
easier version management

For an enterprise platform, I would therefore treat prompts as versioned configuration/artifacts, rather than hard-coded strings scattered throughout application code.
