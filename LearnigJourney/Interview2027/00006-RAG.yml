5,000 documents changed

Don't do:

10 million
   ↓
Reprocess everything

Instead:

10 million existing
        +
5,000 changed
        ↓
Process only 5,000
        ↓
Update index
This is:

Incremental Indexing as the preferred production approach because it reduces compute, time and operational impact
