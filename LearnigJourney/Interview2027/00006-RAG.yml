Chapter 22 — Runtime Evidence Retrieval:

22.1. What is Runtime Evidence?:
So far, our RAG pipeline retrieves knowledge that has already been indexed.
For example:
ServiceNow Knowledge Base
        ↓
Ingestion
        ↓
Chunking
        ↓
Embedding
        ↓
Vector Store
        ↓
RAG Retrieval
        ↓
Evidence

But enterprise AI often needs information that changes every minute.
For example:
“What is the current status of INC0012345?”
The vector database may contain information about ServiceNow incidents, but it should not be treated as the authoritative source for the current incident state.
The current state should come directly from ServiceNow at runtime.
So we introduce:
Runtime Evidence = authoritative, current information retrieved from a live enterprise system during the user's request.
---

22.2. Knowledge Evidence vs Runtime Evidence:
This is the most important distinction.

| Type                   | Example                               | Source              | Freshness                  |
| ---------------------- | ------------------------------------- | ------------------- | -------------------------- |
| **Knowledge Evidence** | VPN troubleshooting procedure         | Vector DB           | Usually minutes/hours/days |
| **Runtime Evidence**   | Current incident status               | ServiceNow API      | Real-time                  |
| **Knowledge Evidence** | "How to reset VPN certificate"        | ServiceNow KB → RAG | Relatively stable          |
| **Runtime Evidence**   | INC0012345 currently assigned to John | ServiceNow          | Changes continuously       |
| **Knowledge Evidence** | Incident management policy            | Vector DB           | Versioned                  |
| **Runtime Evidence**   | Current incident priority/state       | ServiceNow API      | Current                    |


Simple mental model:
RAG answers: "What does the organization know?"
Runtime retrieval answers: "What is happening right now?"
---

22.3. Why Vector Search Alone Is Not Enough:
Suppose the user asks:
"Why is INC0012345 still open and who is working on it?"
A traditional RAG system might retrieve:
KB00123
Incident Management Procedure

KB00452
Incident Priority Guidelines

KB00781
ServiceNow Incident Lifecycle

These documents explain how incidents work.
But they cannot reliably tell us:
Incident: INC0012345
State: In Progress
Priority: P2
Assigned To: Rajesh Kumar
Updated: 17:32
Work Notes: Database team investigating connection failures

That information belongs to the live ServiceNow record.
Therefore:
Knowledge Retrieval
        +
Runtime Retrieval
        ↓
Complete Evidence
---

22.4. Runtime Evidence Does NOT Mean RAG:
This is an important architectural distinction.
Runtime evidence retrieval may use:
REST API
GraphQL
Database
ServiceNow API
Monitoring API
CMDB API
Ticketing API
Inventory API
Cloud API
It does not necessarily require embeddings or a vector database.

For example:
User
 │
 │ "What is the status of INC0012345?"
 ▼
Agent
 │
 │ identify incident number
 ▼
ServiceNow Tool
 │
 │ REST API
 ▼
ServiceNow
 │
 ▼
Current Incident
 │
 ├── State
 ├── Priority
 ├── Assignment
 ├── SLA
 ├── Updated Time
 └── Work Notes
This is runtime retrieval, not vector retrieval.
---

