So there isn't necessarily one universal parser for every source.
---

6.7 Parsing Should Preserve Structure:
This is especially important for enterprise RAG.

Suppose the original document says:
Section: VPN Troubleshooting

Problem:
Users cannot connect to VPN.

Cause:
Outdated client.

Resolution:
Upgrade VPN client.

A parser should ideally preserve:
Section = VPN Troubleshooting

Problem = Users cannot connect to VPN

Cause = Outdated client

Resolution = Upgrade VPN client

rather than producing one unstructured block.
Why?:
Because later, when we perform chunking, we can create meaningful chunks.
---

6.8 Parsing Output:
Think of parsing as producing an intermediate representation:
Raw Document
     ↓
   Parser
     ↓
Structured Content
     │
     ├── Text
     ├── Tables
     ├── Sections
     ├── Lists
     ├── Metadata
     └── Structure

For example:
{
    "content": "...",
    "sections": [...],
    "tables": [...],
    "pages": [...],
    "metadata": {...}
}
---

6.9 Principal Architect Perspective:
This is the key sentence to remember:

Parsing is not simply text extraction; parsing is preservation of meaning and structure.
But there is a problem.
The extracted content may still contain a lot of noise.
---
Interview Questions:
Q1. What is Document Parsing?:
Answer

Document Parsing is the process of extracting meaningful, structured information from raw enterprise documents and converting it into machine-readable content for downstream processing such as chunking and embedding.

Q2. Why is OCR important in a RAG pipeline?:
Answer

OCR converts scanned images into text. Without OCR, scanned PDFs cannot be parsed, embedded, or searched because they contain images rather than machine-readable text.

Q3. Why shouldn't we embed raw PDF content directly?
Answer

Raw PDFs often contain headers, footers, page numbers, watermarks, and formatting artifacts. Embedding this unnecessary content reduces retrieval quality and increases noise in the Vector Database.

Q4. Can poor parsing affect the quality of AI responses?:
Answer

Yes. If parsing extracts incorrect or incomplete information, the embeddings and retrieval results will also be incorrect. Since the LLM depends on retrieved context, poor parsing directly impacts the accuracy of generated responses.
---


Chapter 7 — Document Cleaning & Normalization:
Parsed text is still not necessarily ready for embedding.

7.1 Example of Raw Parsed Content:
Suppose parsing gives us:
Employee Handbook

Page 18

**************

Annual Leave Policy

Employees receive 20 working days.

Page 18 of 150

Company Confidential

Version 3.2

**************
The useful business information is:
Annual Leave Policy

Employees receive 20 working days.

The rest may be noise for semantic retrieval.
So:
Parsed Content
       ↓
Cleaning
       ↓
High-Quality Content
---

7.2 What Is Cleaning?:
Removing unnecessary, duplicate or irrelevant content while preserving meaningful business information.
Typical things to remove include:
Headers
Footers
Page numbers
Repeated text
HTML tags
Extra spaces
OCR artifacts
Invalid characters
Unnecessary formatting
---

7.3 Cleaning Example:
Before cleaning:
INC0012345
--------------------------------
Created by: John
Updated by: Mary
Last updated: 10:35
[system generated text]

Description:
Users cannot connect to VPN.

Work notes:
Client version is outdated.

Resolution:
Upgrade VPN client to 8.4.
--------------------------------

Cleaning might produce:
Description:
Users cannot connect to VPN.

Work Notes:
Client version is outdated.

Resolution:
Upgrade VPN client to 8.4.

while preserving:
Metadata:
incident = INC0012345
priority = P1
assignment_group = Network
updated_at = ...
---

7.4 Cleaning vs Normalization:
Cleaning:
Remove unwanted information.
Page 18
Page 18 of 150
*************
    ↓

  Removed.

Normalization:
Make useful information consistent without changing its meaning.
For example:
Employee ID:  12345
Employee ID : 12345
Employee ID=12345

could be normalized into a consistent representation.
Cleaning removes unnecessary or incorrect information, while normalization standardizes the remaining content without changing its meaning.
---

7.5 Why Cleaning Matters:
Imagine two vector databases.
Database A:
Annual Leave
Page 18
Company Confidential
Page 18 of 150
********
Annual Leave
Employees receive 20 days
Company Confidential

Database B:
Annual Leave Policy
Employees receive 20 working days.

Which representation is more useful for semantic retrieval?

Clearly the second.

The document's principle is:
Less noise
     ↓
Better embeddings
     ↓
Better similarity search
     ↓
Better context
     ↓
Better AI response
---

7.6 But Don't Over-Clean
This is an important Principal Architect point.
Cleaning does not mean:
"Delete everything except sentences."
Suppose we have:
Version: 4.2
Department: HR
Country: India
Classification: Internal
These may look like unnecessary information.

But they can be valuable for:
Filtering
Security
Version management
Auditing
Citations
Governance

removing version numbers or department information can reduce retrieval quality.
Therefore:

Remove noise, not business meaning.
---

7.7 Enterprise Example:
Let's use your ServiceNow scenario.
Suppose a ServiceNow Knowledge Article contains:
------------------------------------------------
ServiceNow Knowledge Article

KB0012345

Page 1

VPN Connectivity Issue

Last updated: 2026-09-20

Problem:
Users cannot connect to VPN.

Solution:
Upgrade VPN client to version 8.4.

CONFIDENTIAL
------------------------------------------------
After parsing:
KB0012345
Page 1
VPN Connectivity Issue
Last updated: 2026-09-20
Problem:
Users cannot connect to VPN.
Solution:
Upgrade VPN client to version 8.4.
CONFIDENTIAL

Cleaning may produce:
KB0012345

