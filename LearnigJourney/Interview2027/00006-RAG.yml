Chapter 2 — What Is RAG?:

Now that we understand why RAG is required, the next question is:
How do we give the LLM enterprise knowledge without retraining it?
RAG = Retrieval-Augmented Generation.
The easiest way to understand it is through an open-book examination.

2.1 Open-book exam analogy:
Imagine you're taking an exam.
You don't memorize a 1,000-page textbook.
Instead:
Question
   │
   ▼
Find relevant chapter
   │
   ▼
Read relevant section
   │
   ▼
Use that information
   │
   ▼
Answer

RAG works similarly.:
User Question
      │
      ▼
Retrieve relevant knowledge
      │
      ▼
Add knowledge to prompt
      │
      ▼
LLM
      │
      ▼
Answer
---

2.2 What does "Retrieval" mean?:
Suppose the user asks:
"What is our maternity leave policy?"
The system searches the enterprise knowledge base.
It might find:
HR Policy 2026

Maternity Leave:
180 days

That's Retrieval.
The retriever's responsibility is:
Find the relevant information.
Not generate the answer.
---

2.3 What does "Augmentation" mean?:
Now we take the retrieved information and add it to the LLM's context.

Instead of:
Question:
What is our maternity leave policy?
we send something conceptually like:
System Instruction:
Answer using the supplied context.

Context:
HR Policy 2026
Maternity Leave = 180 days

Question:
What is our maternity leave policy?

That is Augmentation:
---

2.4 What does "Generation" mean?:
Now the LLM receives:
Question
    +
Retrieved Context
    +
Instructions

and generates:
"According to HR Policy 2026, employees are entitled to 180 days of maternity leave."
That's Generation.
So:
R = Retrieve
A = Augment
G = Generate
---


2.5 Very important architectural distinction:
This is one of the most important things in your document:
The LLM does not perform the retrieval.
The architecture is:
                User Question
                      │
                      ▼
              Retrieve Documents
                      │
                      ▼
          Relevant Knowledge Chunks
                      │
                      ▼
              Build the Prompt
                      │
                      ▼
             Large Language Model
                      │
                      ▼
             Grounded AI Response
According to the HR Policy 2026, employees are entitled to 180 days of maternity leave. Notice that the answer comes from the company policy—not from the model's memory.
---

2.6 RAG vs Fine-Tuning:
Suppose your HR policy changes:
Old:
Annual Leave = 20 days

New:
Annual Leave = 25 days

With fine-tuning/retraining:
New Document
     │
     ▼
Training Data
     │
     ▼
Retrain Model
     │
     ▼
Deploy Model
This is expensive and slow.

With RAG:
New Policy
    │
    ▼
Ingestion
    │
    ▼
Embedding
    │
    ▼
Vector Store

The model itself doesn't need to change.
At query time:
User Question
      │
      ▼
Retrieve New Policy
      │
      ▼
    LLM
That's the core architectural advantage.

Why Is RAG Better Than Training?:
| Retrain the LLM       | Use RAG             |
| --------------------- | ------------------- |
| Very expensive        | Cost-effective      |
| Slow                  | Fast                |
| Requires GPUs         | No retraining       |
| Difficult to maintain | Easy to update      |
| Static knowledge      | Real-time knowledge |
| Doesn't scale well    | Scales easily       |
