Chapter 13 — Metadata:
How do we attach business context, security and filtering information to knowledge?

13.1 Architect's Question            
We know:
The Vector Database can find semantically similar ServiceNow knowledge.
But there is another problem.

Suppose ServiceNow has:
KB001001 → VPN Policy — India
KB001002 → VPN Policy — USA
KB001003 → VPN Policy — UK
KB001004 → VPN Policy — Production
KB001005 → VPN Policy — Development
A semantic search may find all of them because they are about VPN.

But the user may need:
India + Production + latest published policy
So the architect's question becomes:
How do we tell the retrieval system which knowledge is applicable to this user and this request?

Answer:
Metadata.
---

13.2 What is Metadata?:

The simplest definition is:
Metadata is information about the knowledge that helps us identify, filter, secure, and manage that knowledge.
Think of it as a label attached to every chunk.
For example:
ServiceNow Knowledge Chunk
        +
Metadata
The actual knowledge says:
"To renew your VPN certificate, open the Certificate Management Portal..."
Metadata tells us:
Who?
Where?
Which system?
Which version?
Which environment?
Which category?
Which security level?
Is it published?
When was it updated?
---

13.3 ServiceNow Example:
Suppose we have this ServiceNow article:
KB Number:
KB001234

Title:
VPN Certificate Renewal

Article:
To renew an expired VPN certificate,
open the Certificate Management Portal...

After chunking, we might have:
Chunk ID:
KB001234-C02

Now attach metadata:
{
    "source": "ServiceNow",
    "kb_number": "KB001234",
    "title": "VPN Certificate Renewal",

    "category": "Network",
    "subcategory": "VPN",

    "country": "India",
    "environment": "Production",

    "status": "Published",
    "version": "3",

    "language": "English",

    "classification": "Internal",

    "updated_at": "2026-09-20"
}
This metadata is stored alongside the vector/reference information in the retrieval architecture.
---

13.4 Why do we need Metadata?:

There are four major reasons.

1. Filtering:

Find only relevant knowledge.

2. Security:

Prevent unauthorized knowledge from being retrieved.

3. Accuracy:

Prevent semantically similar but contextually wrong documents from reaching the LLM.

4. Governance:

Know which source, version, environment and classification the answer came from.

So:
Metadata
   ↓
Filtering
   +
Security
   +
Accuracy
   +
Governance
---

13.5 Metadata vs Content:

This distinction is very important.
Suppose the ServiceNow article says:
"VPN certificates expire after 12 months."

That's content.
Metadata might say:
country = India
environment = Production
version = 3
status = Published

That's metadata.

Think of a book.

Book Content:
"The policy requires employees to..."
Metadata:
Author
Version
Country
Department
Publication Date
Classification

The content tells you what the document says.
Metadata tells you what the document is and how it should be handled.
---

13.6 Metadata is Attached to the Chunk:
This is a critical RAG concept.
Suppose one ServiceNow article becomes four chunks:
KB001234
   |
   +── Chunk 1
   +── Chunk 2
   +── Chunk 3
   +── Chunk 4
Each chunk should retain the necessary metadata
Chunk 1
  ├── Vector
  ├── Text
  └── Metadata

Chunk 2
  ├── Vector
  ├── Text
  └── Metadata

Chunk 3
  ├── Vector
  ├── Text
  └── Metadata

Chunk 4
  ├── Vector
  ├── Text
  └── Metadata

Why?:
Because retrieval operates at the chunk level.
We don't want:  
Vector → no context
We want:
Vector
  +
Chunk
  +
Metadata
---

13.8 Metadata for Environment:
ServiceNow often has different environments or operational contexts.

For example:
environment = Development
environment = Test
environment = Production
Imagine these articles:
KB1001 → Restart application — DEV
KB1002 → Restart application — TEST
KB1003 → Restart application — PROD

User asks:
"How do I restart the application?"
Semantic similarity alone may consider all three relevant.
Metadata can tell the system:
environment = Production
Then:
DEV     ❌
TEST    ❌
PROD    ✅
This is an example of business-aware retrieval.
---

