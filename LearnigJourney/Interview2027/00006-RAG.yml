20.18 Interview Question:
Q: What is Augmentation in a RAG architecture?
Interview-ready answer

Augmentation is the stage where I construct the LLM's context by combining the best retrieved and re-ranked evidence with system instructions, business rules, relevant conversation history, the user's question, and output-format requirements.

I treat the Prompt Builder as a context-management component rather than simply a prompt-writing utility. It controls context prioritization, token usage, prompt templates, source references, and policy requirements.

The goal is to provide the LLM with the right evidence in the right structure and within the context window. I also maintain source metadata so the final response can be cited and audited.

Importantly, augmentation supports grounding, but they are not identical. Augmentation constructs the context; grounding ensures the generated answer is based on trusted evidence.

That is a Principal GenAI Architect-level answer because it moves beyond "we add retrieved documents to the prompt" and discusses context management, governance, evidence and production concerns.   
---

