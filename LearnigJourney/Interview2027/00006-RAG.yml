  └── Citations
        ├── KB number
        ├── title
        └── section/version
---

21.14 Generation and Guardrails:
The LLM should not be considered an unrestricted output engine.
Enterprise systems can apply guardrails around the response.
The source identifies guardrails for:
Confidential data leakage
Harmful content
Company policies
Unsupported claims
Compliance requirements
So the architecture becomes:        

Prompt
  ↓
LLM
  ↓
Generated Response
  ↓
Grounding Validation
  ↓
Safety / Policy Guardrails
  ↓
Citation Generation
  ↓
Final Response

This is more mature than:

Prompt
  ↓
LLM
  ↓
User
---

21.15 Why Validation After Generation?:
Imagine the LLM receives:

Evidence:
Annual leave = 20 days

but generates:

Employees receive 30 days.

The evidence was correct.

The retrieval was correct.

The augmentation was correct.

But generation produced an unsupported answer.

Therefore, an enterprise system may need:

Generated Answer
       +
Retrieved Evidence
       ↓
Grounding Validation
       ↓
Supported?
   /        \
 Yes         No
 ↓            ↓
Return       Reject /
             Regenerate /
             Escalate
---

