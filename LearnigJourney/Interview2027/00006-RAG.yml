18.9. Search Produces Candidates:

Suppose we get:
| Rank | Chunk      | Reason                          |
| ---: | ---------- | ------------------------------- |
|    1 | KB1001-C04 | Oracle listener troubleshooting |
|    2 | KB2005-C02 | ORA-12514 resolution            |
|    3 | KB3010-C01 | Database connectivity           |
|    4 | KB4011-C03 | Production DB troubleshooting   |
|    5 | KB5007-C02 | Oracle service registration     |
|  ... | ...        | ...                             |

At this point we have candidates.
We have not necessarily identified the best evidence yet.
---

18.10. Retrieval Selects the Candidate Set:
Suppose:
Search → Top 50

Retrieval may establish:
Candidate set → Top 20

Those 20 chunks now become the input to the next stage.
The important architecture principle is:
Do not send everything returned by search to the LLM.
---

18.11. Why Retrieval Quality Matters:
Consider this situation:
Chunk 1
General Oracle Database Information

Chunk 2
Oracle Listener Architecture

Chunk 3
ORA-12514 Resolution Procedure

Chunk 4
Database Backup Procedure

Chunk 5
Production Database Access

The user's question is specifically:

ORA-12514

The most useful chunk is probably:

Chunk 3

But semantic similarity alone may not always put it first.

That is why the next stage — Re-ranking — exists.
---

18.12. Retrieval vs Re-ranking:
This is an excellent interview question.
| Retrieval                      | Re-ranking                     |
| ------------------------------ | ------------------------------ |
| Finds candidate chunks         | Reorders candidates            |
| Fast                           | More computationally expensive |
| Works across very large corpus | Works on small candidate set   |
| Embedding/similarity based     | Deeper relevance evaluation    |
| Optimized for recall           | Optimized for precision        |
| Top-K candidates               | Final best evidence            |
---

18.13. Why Don't We Re-rank Millions of Chunks?:

Imagine:
100 million chunks

If a sophisticated re-ranker evaluated:
Query + Chunk 1
Query + Chunk 2
Query + Chunk 3
...
Query + Chunk 100,000,000

the system would become prohibitively expensive and slow.

Instead:
100 Million
     ↓
Retriever
     ↓
Top 20
     ↓
Re-ranker
     ↓
Top 5
     ↓
LLM
The source explicitly uses this architecture to explain why re-ranking operates only on a small shortlist.
---   

14. Metadata Is Still Important During Retrieval:
Suppose ServiceNow contains:
VPN Policy — India
VPN Policy — USA
VPN Policy — UK

User is authorized for:
Country = India

The retrieval flow should not simply be:
Query
 ↓
Vector Search
 ↓
Results

Instead:

User Identity
      ↓
Authorization
      ↓
Allowed Data Scope
      ↓
Metadata Filters
      ↓
Search
      ↓
Retrieval

For example:

country = India
department = Network
status = Published
version = Latest               
---

18.15. Retrieval and Hybrid Search:
In an enterprise system, Retrieval often works with the output of:
Dense Search
      +
Sparse Search
      +
Metadata Filtering
      ↓
Candidate Results
      ↓
Retrieval

For example:

Dense search catches
"database listener connectivity problem"
Sparse search catches
"ORA-12514"
Metadata catches
Production
Database
Published
India

Then the candidate set can be created from the combined results.
---

18.16. Retrieval Score Does NOT Mean Truth:
This is an important architect-level point.
Suppose:

Chunk A → similarity = 0.93
Chunk B → similarity = 0.88

It does not necessarily mean:
A is factually correct
B is factually incorrect

It means the retrieval mechanism considers A more relevant according to its scoring mechanism.

Therefore:
Similarity
   ≠
Truth

and:

Retrieval relevance
   ≠
Authorization

and:

Retrieval relevance
   ≠
Final answer correctness

These are separate concerns.
---

18.17. Retrieval Quality Metrics:

A Principal Architect should not evaluate only:
"Did the LLM give a good answer?"
We should separately evaluate retrieval.

Important measurements include:
Recall:
Did we retrieve the chunks that actually contained the required evidence?

Required evidence exists
        ↓
Was it retrieved?


Precision:
How much of what we retrieved was actually relevant?

Relevant chunks
-------------------------
All retrieved chunks

Latency:
How long did retrieval take?

Query
 ↓
Search
 ↓
Retrieval

Candidate quality:
Are the retrieved candidates useful enough for re-ranking?
---

18.18. Principal Architect View:
At Principal Architect level, I would look at Retrieval as an optimization problem.

Questions include:
1. Are we retrieving enough candidates?

2. Are we retrieving too many?

3. Is K correctly tuned?

4. Are metadata filters applied correctly?

5. Are we using dense, sparse or hybrid search?

6. Is retrieval latency acceptable?

7. Is recall sufficient?

8. Is precision sufficient?

9. Are irrelevant chunks reaching the LLM?

10. Are we measuring retrieval independently?
---

