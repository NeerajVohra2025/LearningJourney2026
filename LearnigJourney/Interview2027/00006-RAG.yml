Chapter 1 — Why Was RAG Invented?:
Your document starts with a very useful analogy: imagine joining a company on your first day and immediately being asked:

"What is our company's maternity leave policy?"
You cannot answer because you haven't read the HR policy, employee handbook, internal guidelines, Wiki or SharePoint documents. The document uses this analogy to explain the fundamental problem with LLMs.   

1.1 The fundamental problem:
What Does an LLM Actually Know?:
Many people believe ChatGPT "knows everything."
It doesn't.
An LLM knows only what it has learned during training.
Think of it like this:
An LLM has learned patterns from its training data.
Conceptually:
Public / Training Data
        │
        ▼
     Training
        │
        ▼
       LLM
But your company's private information sits somewhere else:
Company Knowledge:
       │
       ├── SharePoint
       ├── Confluence
       ├── ServiceNow
       ├── Jira
       ├── PDFs
       ├── Databases
       └── Internal APIs       
These systems contain valuable enterprise knowledge, but they are completely separate from the model.      
There is no automatic connection between the two.
Your document explicitly highlights systems such as SharePoint, Confluence, ServiceNow, Jira, SAP, Oracle, SQL databases, S3 and internal APIs as enterprise systems an LLM cannot automatically access .
---

1.2 Example — HR policy:
Suppose your organization has:
HR_Leave_Policy_2026.pdf
Inside:
Annual Leave = 20 days
Maternity Leave = 180 days

Now the employee asks:
"How many annual leave days do I get?"
The standalone LLM doesn't automatically know that your company's policy says 20 days.

It might answer:
"Most companies provide 20–30 days."
That sounds reasonable.
But it isn't necessarily your company's answer.
This is the distinction you should remember:
LLM answer
    ≠
Enterprise truth
---


The Three Biggest Limitations of LLMs:
1. Knowledge Cutoff:
An LLM only knows information available up to the point when it was trained.

Example
"What happened in our production environment yesterday?"
The model cannot know unless someone provides that information.

2. Private Enterprise Data:
Organizations store critical information in private systems such as:

HR Policies
Financial Reports
Customer Contracts
Product Documentation
Incident Reports
Medical Records
Insurance Claims
Since these documents are private, they are not included in the model's training data.

3. Hallucinations:
This is one of the most serious limitations of Large Language Models.
When the model does not know the correct answer, it may generate a response that sounds convincing but is actually incorrect.

Example
Question

"How many annual leave days does our company provide?"
LLM Response
"Most companies provide 30 days of annual leave."
The answer sounds reasonable.
However, the actual HR policy states:
20 days
The model did not retrieve the company policy—it guessed based on patterns learned during training.

This behavior is called Hallucination.
Think about hallucination like this:
Question
   │
   ▼
LLM
   │
   ├── Has relevant context
   │       │
   │       ▼
   │     Answer
   │
   └── Does NOT have relevant context
           │
           ▼
       May guess
           │
           ▼
      Hallucination


Why Is Hallucination a Serious Business Problem?:
Banking
Customer

"What is my loan interest rate?":
If the AI invents an incorrect interest rate, it can lead to financial disputes and customer dissatisfaction.

Healthcare
Doctor

"What dosage should this patient receive?"
If the AI guesses the dosage, the consequences could directly impact patient safety.

Insurance
Customer

"Does my insurance policy cover flood damage?"
The AI replies:
"Yes."

However, the policy actually excludes flood coverage.
This may result in legal, financial, and compliance issues.
The problem isn't necessarily that the LLM is not intelligent enough.
The problem is:
The LLM doesn't have the right context.
That is the foundation of RAG.
---

1.5 Principal Architect insight:

Don't think:
"How do I make the LLM know everything?"

Think:
"How do I give the LLM the right trusted context at the right time?"
This is a much better enterprise architecture mindset.
---

