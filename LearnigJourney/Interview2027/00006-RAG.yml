Chapter 14 — Indexing:
Architect's Question: How do we search millions of vectors efficiently?  

14.1 First: What Problem Does Indexing Solve?
Let's start with the simplest example.
Suppose your ServiceNow Knowledge Base contains:
100 ServiceNow articles
        ↓
1,000 chunks
        ↓
1,000 embeddings

No big problem.
But imagine a large enterprise:
10 million documents
        ↓
100 million chunks
        ↓
100 million vectors

Now a user asks:
"How do I renew my VPN certificate?"
The system has to determine:
Which vectors are closest to this question?
A naive approach would be:
Query Vector
     ↓
Compare against Vector 1
Compare against Vector 2
Compare against Vector 3
...
Compare against Vector 100,000,000
That is called brute-force search.:
It can be accurate, but it becomes expensive and slow at large scale. Your source specifically identifies brute-force search as a common mistake for large knowledge bases.
So we need:
An index.
---

14.2 What Is an Index?:
Think about a physical dictionary.
Suppose I ask:
What does "architecture" mean?
You don't start reading:
A...
B...
C...
D...
You go directly to the A section.
The index helps you narrow down where to look.
RAG indexing does something conceptually similar.
Millions of vectors
        ↓
     INDEX
        ↓
Quickly identify
candidate vectors
        ↓
Similarity search
        ↓
Top relevant chunks

So:
Indexing is the mechanism that organizes vectors so the system can find nearby vectors efficiently without comparing the query with every vector.
---

14.3 Embedding vs Indexing:
This distinction is extremely important for interviews.

Embedding answers:
"How do I represent meaning numerically?"

Example:
"VPN certificate expired"
        ↓
[0.21, -0.44, 0.73, ...]

Indexing answers:
"How do I find similar vectors quickly?"
So:
Document
   ↓
Embedding
   ↓
Vector
   ↓
Index
   ↓
Fast Search

Remember:
Embedding creates the vector. Indexing organizes the vectors for efficient search.
---

14.4 What Is Actually Indexed?:
Your source makes an important point:
A Vector Database does not simply store documents.
It stores:
Embedding
+
Metadata
+
Reference to original content
For example:
Vector Record
────────────────────────────
Chunk ID
Embedding
Metadata
Source Reference
Document ID
Version
────────────────────────────
Example:
{
  "chunk_id": "KB001001-C03",

  "embedding": [
    0.21,
    -0.44,
    0.73
  ],

  "metadata": {
    "source": "ServiceNow",
    "kb_number": "KB001001",
    "category": "Network",
    "country": "India",
    "environment": "Production",
    "version": "3",
    "status": "Published"
  },

  "source_reference": "ServiceNow://KB001001"
}
The index primarily helps the vector search engine navigate the embedding space efficiently.
---

14.5 Simple ServiceNow Example:
Let's take our running example.
ServiceNow contains:
KB001001
VPN Certificate Renewal

KB001002
VPN Authentication Troubleshooting

KB001003
VPN Client Installation

KB001004
Password Reset

KB001005
Network Connectivity

Each article is chunked.
For example:
KB001001
    ↓
Chunk 1
Chunk 2
Chunk 3
Chunk 4

Each chunk gets an embedding:
KB001001-C01 → Vector A
KB001001-C02 → Vector B
KB001001-C03 → Vector C
KB001001-C04 → Vector D

Now the vector database builds an index over those vectors.
Conceptually:
                  Vector Index
                       |
          ┌────────────┼────────────┐
          ↓            ↓            ↓
       Region A      Region B      Region C
          |            |            |
       vectors       vectors       vectors
The actual implementation depends on the vector search technology, but the architectural purpose is the same:
Reduce the amount of vector space that must be examined.       
---

14.6 What Is ANN?:
This is the key term for Chapter 14.
ANN = Approximate Nearest Neighbor
Suppose the query vector is:
Q
and we have:
V1
V2
V3
...
V100,000,000

We want the vectors closest to Q.
Exact search:
Q
 ↓
Compare with all 100M vectors
 ↓
Calculate similarity
 ↓
Sort
 ↓
Top K


ANN says:
"Instead of checking every vector, intelligently navigate the vector space and examine the most promising candidates."
Your source describes ANN as finding extremely close vectors without comparing against every vector, providing a balance between speed and retrieval accuracy.
---

14.7 Real-Life Analogy — Google Maps:
Imagine asking:
"Find the nearest restaurant to me."
Google Maps doesn't calculate the distance from your location to every restaurant on Earth.

It narrows the search:
World
 ↓
Country
 ↓
City
 ↓
Area
 ↓
Nearby restaurants
 ↓
Nearest restaurant

ANN does something conceptually similar:
All vectors
    ↓
Candidate region
    ↓
Candidate vectors
    ↓
Nearest vectors

ANN narrows the possible search space rather than examining every vector.
---

14.8 Three Important Indexing Techniques:
Your source identifies three important techniques:

HNSW
IVF
Product Quantization (PQ)

Let's understand them without getting lost in mathematics.
---

14.9 HNSW:
HNSW = Hierarchical Navigable Small World
This is one of the most important concepts to know as a GenAI Architect.
Think of a city with roads.
Instead of checking every road:
Home
 ↓
Small road
 ↓
Main road
 ↓
Highway
 ↓
Destination

HNSW creates a graph-like structure that allows the search to navigate toward nearby vectors.
Conceptually:
                  Level 2
             A ─────────── D
              \            /
               \          /
                \        /
                  B ─ C

                  ↓

                  Level 1
          A ─ B ─ C ─ D ─ E ─ F

                  ↓

                  Vectors
                  
The search starts at a higher-level structure and navigates toward promising areas.

Why architects like HNSW
Your source characterizes HNSW as:
Very fast
Excellent accuracy
Widely used
Good for production systems

So the mental model is:
HNSW = navigate through a graph to find nearby vectors quickly
---

14.10 IVF:
IVF = Inverted File Index
Think about a warehouse.

Instead of putting all products into one giant room:
Warehouse
   |
   ├── Electronics
   ├── Furniture
   ├── Clothing
   └── Food
   
When you want a laptop, you don't search the entire warehouse.
You go to:
Electronics
IVF works conceptually similarly.
Vectors are grouped into clusters.   

                 All Vectors
                      |
          ┌───────────┼───────────┐
          ↓           ↓           ↓
       Cluster A   Cluster B   Cluster C
          ↓           ↓           ↓
       vectors     vectors     vectors
       
       
Query:
VPN certificate
      ↓
Find relevant cluster
      ↓
Search that cluster
      ↓
Top results
IVF as grouping similar vectors into clusters and searching only relevant clusters
---

14.11 Product Quantization:
This one is easier to understand as:
Vector compression.
Suppose we have:           
100 million vectors
and every vector consumes significant memory.
PQ compresses vector representations.
Think of:       
Large file
   ↓
Compression
   ↓
Smaller representation

The trade-off is:
Less memory
     +
Potentially faster processing
     ↓
Some loss in precision
---

14.12 HNSW vs IVF vs PQ:
Keep this simple.
| Technique | Mental Model             | Main Benefit     |
| --------- | ------------------------ | ---------------- |
| **HNSW**  | Navigate a graph         | Speed + accuracy |
| **IVF**   | Search relevant clusters | Scale            |
| **PQ**    | Compress vectors         | Reduce memory    |

Architect's point:
You normally don't implement these algorithms yourself.
You choose/configure a vector-search platform that provides the appropriate indexing capabilities.
Your source makes exactly this point: an Enterprise Architect should understand why these algorithms exist rather than necessarily implementing them.
---

