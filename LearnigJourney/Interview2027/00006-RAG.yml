---
The one-line Principal Architect answer
Traditional RAG is a mostly predefined retrieval-and-generation pipeline for answering questions from enterprise knowledge. Agentic RAG adds an intelligent orchestration layer that can decide what information or tools are required, retrieve both indexed knowledge and live runtime evidence, reason over the results, iterate when necessary, maintain context or memory, and execute governed multi-step workflows                  