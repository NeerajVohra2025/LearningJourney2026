19.20. Why Re-ranking Can Improve RAG Without Changing the LLM:
This is one of the most useful architect insights.

Suppose your LLM is already capable of answering correctly if it receives the correct evidence.

But your retrieval pipeline gives it:

Wrong / weak evidence

The LLM cannot magically recover information that wasn't supplied.

Therefore:

Poor Retrieval
      ↓
Poor Evidence
      ↓
LLM
      ↓
Poor Answer

Whereas:

Better Retrieval
      ↓
Better Re-ranking
      ↓
Better Evidence
      ↓
Same LLM
      ↓
Better Grounded Answer

The source emphasizes that improving retrieval and re-ranking can improve answer quality without changing the LLM itself                 
---

19.22. Popular Re-ranking Options in the Source:
Commercial
Cohere Rerank
Google:
Vertex AI ranking capabilities
Open source
BGE Reranker
Jina AI Reranker
Sentence Transformers CrossEncoder

The source says selection depends on:

Latency
Cost
Accuracy
Deployment Environment
---

19.23. Best-Practice Pattern:
The source recommends:
Retrieve more
      ↓
Re-rank
      ↓
Send fewer

For example:
Vector/Search Layer
       ↓
Top 20
       ↓
Re-ranker
       ↓
Top 5
       ↓
Prompt Builder
       ↓
LLM
---

19.24. Common Mistakes:
❌ Mistake 1 — Sending Top-20 directly to the LLM

More context isn't automatically better.

❌ Mistake 2 — Using a Cross-Encoder across millions of documents

Too expensive and slow.

❌ Mistake 3 — Assuming vector similarity is perfect relevance

Semantic similarity and answer relevance are not identical.

❌ Mistake 4 — Re-ranking before authorization

Security boundaries must be established independently.

❌ Mistake 5 — Evaluating only final LLM answers

You need to evaluate retrieval and ranking separately.

❌ Mistake 6 — Adding a re-ranker without measuring latency

A quality improvement that violates the application's latency budget may not be appropriate.
---

19.25. Retrieval → Re-ranking → LLM:
This is the most important picture from this chapter:
                 KNOWLEDGE BASE
                Millions of Chunks
                       │
                       ▼
                  SEARCH
                       │
                       ▼
                  Top-20
                Candidates
                       │
                       ▼
                RE-RANKING
                       │
                       ▼
                  Top-5
               Best Evidence
                       │
                       ▼
                AUGMENTATION
                       │
                       ▼
                     LLM
                       │
                       ▼
              GROUNDED ANSWER

And remember:
The LLM should not be responsible for finding the knowledge.
Search and retrieval find it.
Re-ranking improves its ordering.
Augmentation constructs the context.
Generation produces the answer.
---

19.26. Principal Architect Mental Model:
You can memorize the entire sequence like this:
SEARCH
"Where might the answer be?"
        ↓
RETRIEVAL
"Which candidates should continue?"
        ↓
RE-RANKING
"Which candidates are actually the strongest evidence?"
        ↓
AUGMENTATION
"How do I construct the context?"
        ↓
GENERATION
"How do I answer using that context?"

That is the cleanest mental model for your RAG architecture.
