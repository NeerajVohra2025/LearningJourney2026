Chapter 15 — Query Processing:
We now move from the knowledge preparation side to the user-query side.
Your RAG mental model is:   
             
15.1 What is Query Processing?:
In simple terms:
Query Processing converts the user's raw question into a structured, retrieval-ready query.
The user does not necessarily ask the question in the same language or terminology used in your ServiceNow Knowledge Base.

For example, the user asks:
"My VPN is not working after the certificate expired. How can I fix it?"

But your ServiceNow KB may contain:
"VPN Certificate Renewal Procedure"

or:
"Procedure for expired client authentication certificates"
The words are different, but the business meaning is related.
Query Processing helps the RAG system understand what the user is actually asking before we perform search.
---

15.2 The Important Mental Model:
Think of Query Processing as a translator between the user and the knowledge base.

            USER
             │
             │ "My VPN is not working after the certificate expired.
             │  How can I fix it?"
             ▼
┌──────────────────────────────┐
│      QUERY PROCESSING        │
│                              │
│ Understand intent            │
│ Extract important terms      │
│ Identify filters             │
│ Rewrite / normalize query    │
│ Detect ambiguity             │
└──────────────┬───────────────┘
               │
               ▼
        Retrieval-ready Query
               │
               ▼
        Chapter 16
      Query Embedding
      
So:
Query Processing decides WHAT the user is asking.
Then:
Query Embedding converts that meaning into a vector.    
---


15.3 ServiceNow Example:
Suppose your organization has thousands of ServiceNow Knowledge articles.
Example KB:  
KB001001
Title:
VPN Certificate Renewal

Content:
If the corporate VPN certificate has expired,
the user must renew the client certificate
before reconnecting to the corporate VPN.

Another article:
KB001002
Title:
VPN Connectivity Troubleshooting

Content:
Check VPN client configuration, network connectivity,
authentication status and certificate validity.

Now the user asks:
"VPN stopped working after my certificate expired. What should I do?"
Notice something important.

The user didn't say:
"Show me KB001001."
They described a problem.
---

15.4 What Query Processing Does:
The system can transform the question conceptually into:
Original Query:
"VPN stopped working after my certificate expired.
What should I do?"

Intent:
VPN troubleshooting / certificate renewal

Entities:
VPN
Certificate

Problem:
Expired certificate

Action:
Troubleshoot / renew

Domain:
Network

Knowledge Type:
ServiceNow Knowledge Base

Now the retrieval system has much more useful information.

---

15.5 Query Processing Is NOT Query Embedding:
This distinction is very important in an architect interview.

Query Processing
Understands the question.
User Question
      ↓
Intent
Entities
Filters
Context
Query Rewrite


Query Embedding:
Converts the processed query into numbers.
Processed Query
      ↓
Embedding Model
      ↓
[0.021, -0.183, 0.742, ...]


So:
Query Processing = understanding
Query Embedding = numerical representation
---

15.6 Why Do We Need Query Processing?:
Because enterprise users rarely ask perfectly structured questions.

Consider these questions:
Question 1:

"VPN cert expired. Fix?"

Question 2:

"My VPN stopped working because the certificate expired."

Question 3:

"How do I renew the corporate VPN certificate?"

Question 4:

"Certificate authentication failed when connecting to VPN."

All four may represent essentially the same business problem.

Query Processing helps normalize them.
---

15.7 Query Normalization:
One responsibility is normalization.
For example:

"VPN cert expired"
can be normalized to:
"VPN certificate expired"

Similarly:
"svc now"
could be normalized to:
"ServiceNow"

And:

"prod"
could be interpreted as:
"Production"
This becomes particularly useful in enterprise environments where users use:
abbreviations
acronyms
internal terminology
product names
short forms
spelling variations.
---

15.8 Query Expansion / Rewriting:
Sometimes the original query is too short.
Example:
"VPN problem"
That's not enough context.
The system may rewrite it conceptually as:
"Troubleshooting corporate VPN connectivity,
including authentication and certificate-related failures."
This gives semantic search more useful information.

Another example:
User:
"Certificate expired"

Expanded query:

"How do I renew an expired corporate VPN
client authentication certificate?"
The goal is better retrieval, not changing what the user wants.
---

15.9 Query Processing Can Identify Metadata Filters:
This is where Chapter 13 — Metadata — becomes important.
Suppose the user asks:
"What is the VPN certificate renewal procedure for production systems in India?"
Query Processing can identify:
Query:
VPN certificate renewal procedure

Metadata:
country = India
environment = Production
Then the retrieval architecture can logically apply those constraints.
User Query
    │
    ▼
Query Processing
    │
    ├── Search Query
    │     "VPN certificate renewal procedure"
    │
    └── Metadata Filters
          country = India
          environment = Production
Then the search system looks for relevant knowledge within the permitted/contextually relevant scope.   
---


15.10 Query Processing + Authorization:
This is an important enterprise architecture distinction.
Suppose a user says:
"Show me the VPN procedure for the US."
The system should not simply trust the query and assume the user is authorized to access US documents.
There are two different concepts:

User intent
User wants:
country = USA
User authorization
User is authorized for:
country = India
Authorization must come from your identity/access-control system, not from the user's words.
So the architecture should conceptually be:

User Identity
      │
      ▼
Authorization / Policy
      │
      ▼
Allowed Data Scope
      │
      ▼
Query Processing
      │
      ▼
Metadata Filters
      │
      ▼
Search

This is one of the key differences between a demo RAG and an enterprise RAG architecture. 
---


15.11 Conversation Context:
Query Processing can also use conversation history.
Suppose the user first asks:
"My VPN certificate expired."

Then:
"How do I renew it?"
The second question by itself is ambiguous.
What does "it" mean?
The conversation provides the context:    
Previous:
VPN certificate expired

Current:
How do I renew it?
The system can interpret the current query as:
"How do I renew the expired VPN certificate?"
This is often called context-aware query processing or query rewriting.  
---

15.12 A More Realistic ServiceNow Example:

Imagine the user asks:
"Incident INC0012345 says VPN authentication failed after cert expiry. What is the standard fix?"

Now we have several pieces of information.

Query Processing
Incident:
INC0012345

Problem:
VPN authentication failure

Root-cause clue:
Certificate expired

Requested action:
Find standard fix

Knowledge source:
ServiceNow Knowledge Base

The system can produce a retrieval query such as:

"VPN authentication failure caused by
expired certificate standard remediation"

and potentially metadata constraints such as:

source = ServiceNow
status = Published
---

