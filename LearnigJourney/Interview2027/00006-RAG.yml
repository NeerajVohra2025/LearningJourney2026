23 Traditional RAG vs Agentic RAG — Step-by-Step End-to-End:
The simplest way to understand the difference is:
Traditional RAG is primarily an information-retrieval pipeline. Agentic RAG is a problem-solving system where RAG becomes one of the agent's capabilities.

23.1. First understand Traditional RAG:
Suppose the user asks:
"How do I resolve a VPN certificate problem?"
Traditional RAG is designed primarily to find the relevant organizational knowledge and generate an answer.
End-to-end flow
User
 │
 ▼
Question
 │
 ▼
Query Processing
 │
 ▼
Query Embedding
 │
 ▼
Vector / Hybrid Search
 │
 ▼
Candidate Documents
 │
 ▼
Retrieval
 │
 ▼
Re-ranking
 │
 ▼
Best Evidence
 │
 ▼
Prompt / Context Builder
 │
 ▼
LLM
 │
 ▼
Grounded Answer

Let's go through it.
---

23.2. Traditional RAG — Step 1: User asks a question
Example:
"My VPN certificate has expired. How do I fix it?"
The system receives the question.
At this point, the system does not yet know which documents are relevant.
---

23.3. Step 2: Query Processing
The system understands the query.
It may identify:
Intent:
Troubleshooting

Domain:
VPN

Problem:
Certificate expired

Desired action:
Fix / renew certificate
---
So conceptually:
Natural Language
       ↓
Structured Retrieval Intent
---

23.4. Step 3: Query Embedding
The processed query is converted into an embedding vector.
"My VPN certificate has expired"
              ↓
       Embedding Model
              ↓
       Query Vector
This allows semantic search.
---

23.5. Step 4: Search:
The system searches the enterprise knowledge.
For example:       
Vector DB
   │
   ├── KB001 VPN Certificate Renewal
   ├── KB002 VPN Troubleshooting
   ├── KB003 Network Authentication
   ├── KB004 Certificate Management
   └── KB005 VPN Client Installation    

It might return Top-20 candidates.
For enterprise systems, this can be:   
Dense Search
      +
BM25 / Keyword Search
      +
Metadata Filtering
      ↓
Candidate Set
---

23.6. Step 5: Retrieval
Now we select a manageable set of relevant candidates.
For example:
Top 20 candidates
        ↓
Relevant Top 10
The purpose is to prevent thousands or millions of documents from reaching the next stage.
---

23.7. Step 6: Re-ranking
Now a re-ranker examines the query and candidates more deeply.
Example:
Candidate 1 → General VPN troubleshooting
Candidate 2 → VPN certificate renewal
Candidate 3 → Network authentication
Candidate 4 → VPN installation
After re-ranking:
1. VPN Certificate Renewal
2. Certificate Troubleshooting
3. VPN Authentication

Now we have stronger evidence.
---

23.8. Step 7: Augmentation
The system constructs the context for the LLM.
For example:
SYSTEM INSTRUCTIONS
-------------------
Answer using approved enterprise knowledge.

EVIDENCE
--------
KB001:
VPN Certificate Renewal

Step 1:
Request new certificate.

Step 2:
Install certificate.

Step 3:
Restart VPN client.

USER QUESTION
-------------
My VPN certificate has expired.
How do I fix it?
This is augmentation
---


23.9. Step 8: Generation
The LLM receives that context.
It generates:
"Your VPN certificate needs to be renewed. According to KB001, request a new certificate, install it, and restart the VPN client."
---

23.10. Step 9: Grounding Validation
The system can check:

Generated Answer
       +
Retrieved Evidence
       ↓
Grounding Validation

If the answer contains unsupported information:

Unsupported claim
       ↓
Reject / regenerate / escalate

Otherwise:

Supported
   ↓
Return answer

This is the traditional RAG model we have built across the previous chapters. Your source emphasizes that generation is not necessarily the final enterprise control point; grounding validation, guardrails and citations can follow generation.
---


23.11. Now the important question: What happens when the user asks something more complex?
Suppose the user asks:
"INC0012345 is causing a VPN problem. What is its current status, what caused it, and what should I do to fix it?"
Now we have three different requirements.

Requirement 1 — Current status:
We need:
ServiceNow
because the current incident state is runtime information.

Requirement 2 — Root cause / historical knowledge:
We may need:
ServiceNow Incident
+
Knowledge Base
+
Previous incidents

Requirement 3 — Resolution procedure:
We need:
RAG
to find the approved troubleshooting procedure.
Traditional fixed RAG starts becoming insufficient because we need to decide what information sources and actions are required.
That is where Agentic RAG comes in.
---

23.12. What is Agentic RAG?:
Agentic RAG puts an AI agent/orchestrator around the retrieval capability.
Instead of:
Question
   ↓
RAG
   ↓
Answer

we have:
User
 ↓
Agent
 ↓
Understand problem
 ↓
Plan
 ↓
Decide what information is needed
 ↓
Use RAG / Tools / APIs / Memory
 ↓
Observe results
 ↓
Reason again
 ↓
Gather additional evidence if required
 ↓
Generate answer / execute task
---

23.13. Agentic RAG — Step 1: User asks the question
Same question:
"INC0012345 is causing a VPN problem. What is its current status, what caused it, and what should I do to fix it?"
The difference begins here.
The agent asks internally:
What information do I need?
It identifies:
Incident number:
INC0012345

Current state:
Need ServiceNow runtime data

Cause:
Need incident details / work notes

Resolution:
Need enterprise knowledge

Potentially:
Need related incidents
---

23.14. Agentic RAG — Step 2: Agent creates a plan
Conceptually:
PLAN

1. Retrieve current incident
2. Examine incident details
3. Search knowledge base for VPN certificate issue
4. Search related knowledge if required
5. Combine runtime + knowledge evidence
6. Determine whether evidence is sufficient
7. Generate grounded response

This is a major difference.
Traditional RAG generally follows a predefined retrieval pipeline.
Agentic RAG can dynamically determine what it needs to do next.
---

