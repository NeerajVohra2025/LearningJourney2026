10.27. Interview Questions:
Q1. What is an embedding?
Answer:
An embedding is a numerical vector representation of text that captures semantic meaning. It allows the retrieval system to mathematically compare the semantic similarity between queries and document chunks.

Q2. Why are embeddings important in RAG?
Answer:
Embeddings enable semantic search. They allow the system to retrieve relevant information even when the user's wording differs from the wording used in the source document.

Q3. What is the difference between embed_documents() and embed_query()?
Answer:
embed_documents() converts document chunks into vectors during ingestion, while embed_query() converts the user's question into a query vector during retrieval. Both participate in the same retrieval space and should normally use the same embedding model.

Remember:
Embedding = text → numerical vector
Document embedding = embed_documents()
Query embedding = embed_query()
Similar meaning → vectors can be close
Vector similarity → semantic search
Same embedding model → document/query compatibility
Change embedding model → regenerate embeddings
Better embeddings → better retrieval → better RAG

And the most important distinction:
Chunking decides how knowledge is divided. Embedding converts each knowledge unit into a mathematical representation that enables semantic retrieval.
---

Chapter 12 — Vector Store / Vector Database:
Architect's Question:
Where do the ServiceNow knowledge embeddings live, and how does RAG quickly find the right ServiceNow knowledge when a user asks a question?

The answer is:
The Vector Database stores the embeddings and associated metadata, and performs semantic similarity search to retrieve relevant ServiceNow knowledge chunks.

12.1 Where are we in the RAG pipeline?:
So far, we have done:
ServiceNow
    ↓
Document Loading
    ↓
Parsing
    ↓
Cleaning
    ↓
Chunking
    ↓
Embedding
    ↓
????

Vectore Store:                 

ServiceNow
    ↓
Chunk
    ↓
Embedding
    ↓
┌──────────────────────────────┐
│      VECTOR DATABASE         │
│                              │
│  Vector                      │
│  Chunk Text / Reference      │
│  Metadata                    │
│  Vector Index                │
└──────────────────────────────┘
Now our knowledge is ready to be searched.
---
12.2 First understand the problem:
Imagine your ServiceNow instance contains:
500,000 Knowledge Articles

And each article produces several chunks.
For example:
500,000 articles
       ↓
5,000,000 chunks
       ↓
5,000,000 embeddings

Now an employee asks:
"My VPN certificate has expired. How can I renew it?"
We cannot simply ask the LLM:
"Search all 5 million chunks."
That would be inefficient.
We need a specialized system that can quickly find the chunks whose meaning is closest to the user's question.
That's the job of the Vector Database.
---

12.3 What is stored in the Vector Database?:
This is one of the most important concepts.
The Vector Database doesn't simply store:
ServiceNow Article
Instead, conceptually, each record looks like:
+------------------------------------------------+
| ServiceNow Knowledge Vector Record             |
+------------------------------------------------+
| Vector                                         |
| [0.21, -0.44, 0.71, 0.18, ...]                |
|                                                |
| Chunk Text                                     |
| "Renew the expired VPN certificate..."         |
|                                                |
| Metadata                                       |
| source = ServiceNow                            |
| kb_number = KB001234                           |
| category = Network                             |
| subcategory = VPN                              |
| environment = Production                       |
| country = India                                |
| status = Published                             |
| version = 3                                    |
| classification = Internal                      |
+------------------------------------------------+
---

12.4 ServiceNow ingestion example:
Let's take one ServiceNow article.
Original ServiceNow article
KB Number:
KB001234

Title:
VPN Certificate Renewal

Category:
Network

Article:

If your corporate VPN certificate has expired,
open the Certificate Management Portal.

Select "Renew Certificate".

Download the new certificate and install it
on your corporate laptop.

If renewal fails, contact the Network Support team.
The RAG ingestion pipeline processes it.
---

Step 1 — Chunk
Suppose we divide it into:
Chunk 1
VPN certificate expiration symptoms

Chunk 2
How to renew the certificate

Chunk 3
How to install the new certificate

Chunk 4
What to do if renewal fails

The important chunk might be:
Chunk 2:

"Open the Certificate Management Portal.
Select 'Renew Certificate'.
Download the new certificate..."
---

12.5 Step 2 — Embedding:
Chunk 2 is converted into an embedding.
Chunk 2
   ↓
Embedding Model
   ↓
[0.21, -0.44, 0.71, 0.18, ...]
We now have a mathematical representation of the meaning of:

"How to renew an expired VPN certificate."
---
12.6 Step 3 — Store it:
Now we store the vector in the Vector Database.
Vector
   +
Chunk
   +
Metadata
   ↓
Vector Database

For example:
ID = KB001234-C02

Vector =
[0.21, -0.44, 0.71, 0.18, ...]

Text =
"Open the Certificate Management Portal..."

Metadata =
{
   source: "ServiceNow",
   kb_number: "KB001234",
   category: "Network",
   subcategory: "VPN",
   country: "India",
   environment: "Production",
   status: "Published",
   version: "3"
}
Now the ServiceNow knowledge is searchable.
---

12.7 What happens when the user asks a question?:
Now let's move from ingestion to query time.
User asks:
"My VPN certificate has expired. How can I renew it?"
The system does not immediately send this question to the LLM.
Instead:
User Question
      ↓
Query Processing
      ↓
Query Embedding
      ↓
Vector Database
      ↓
Similarity Search
      ↓
Relevant ServiceNow Chunks
      ↓
LLM

Let's understand each step.
---

12.8 Query becomes an embedding:
The question:
"My VPN certificate has expired. How can I renew it?"

is converted into a query vector.

User Question
      ↓
Embedding Model
      ↓
[0.20, -0.42, 0.69, 0.19, ...]

Notice something important.
The query vector is mathematically close to the vector representing:
"Open the Certificate Management Portal and select Renew Certificate."

Even though the wording is different.
That's the power of semantic search.
---

12.9 Vector Database performs similarity search:
The Vector Database compares the query vector against stored vectors.
Imagine it finds:
Candidate 1
KB001234-C02
VPN Certificate Renewal
Similarity = 0.92

Candidate 2
KB001235-C01
VPN Troubleshooting
Similarity = 0.87

Candidate 3
KB004512-C04
Remote Access Problems
Similarity = 0.81

Candidate 4
KB003210-C02
Password Reset
Similarity = 0.32

The system can return the most relevant candidates.
For example:
Top-K = 3
So:
KB001234-C02
KB001235-C01
KB004512-C04

are returned.
The Vector Database is therefore answering:
"Which ServiceNow knowledge chunks are semantically closest to this question?"
It is not answering the user
---

12.10 Why do we need Top-K?:
Suppose ServiceNow contains millions of chunks.
We don't want:
5,000,000 chunks
       ↓
LLM

Instead:
5,000,000 chunks
       ↓
Vector Search
       ↓
Top 10
       ↓
Retrieval / Re-ranking
       ↓
Top 3 or 5
       ↓
LLM
This keeps the context manageable and focused.
---

12.11 Now comes an important Enterprise concept — Metadata Filtering:
Suppose ServiceNow has:
KB001234
VPN Certificate - India Production

KB005678
VPN Certificate - USA Production

KB008901
VPN Certificate - UK Production

The question is:
"How do I renew my VPN certificate?"

All three articles may be semantically similar.

But imagine the user belongs to:
Country = India
Environment = Production

We don't want to retrieve the USA or UK policy if the knowledge is country-specific.
So we can filter:
source = ServiceNow
country = India
environment = Production
status = Published

Then perform semantic search.
Conceptually:
                 User Question
                       ↓
                Query Embedding
                       ↓
              Metadata Filtering
                       ↓
             ┌─────────────────┐
             │ India           │
             │ Production      │
             │ Published       │
             └─────────────────┘
                       ↓
              Vector Similarity
                       ↓
                  Top-K Results
                  
This is one of the most important enterprise architecture responsibilities of metadata.
---

12.12 Vector Database vs ServiceNow:
This distinction is important.

You might ask:
"If ServiceNow already has the knowledge, why do we need a Vector Database?"
Because ServiceNow and the Vector Database have different responsibilities.    

ServiceNow:
System of Record  
ServiceNow owns:
Knowledge articles
Incidents
Problems
Changes
Users
Workflows
Business processes

Vector Database:
It owns:

Embeddings
Vector indexes
Metadata for retrieval
Similarity search

So:
              ServiceNow
           System of Record
                  |
                  | ingestion
                  ↓
          RAG Ingestion Pipeline
                  |
                  ↓
          Vector Database
          Semantic Search            
The Vector Database does not replace ServiceNow.
It provides a retrieval-optimized representation of the knowledge.
---

12.13 Vector Database vs SQL Database:
Another common interview question.
A traditional SQL query might be:
SELECT *
FROM knowledge_article
WHERE category = 'Network';
This is an exact/structured query.

But the user asks:
"My VPN certificate has stopped working. What should I do?"
The user didn't necessarily use the exact words:
"VPN certificate renewal"
Semantic search can still identify the relevant knowledge because the meaning is similar.

So:
SQL
↓
Exact / structured search
while:
Vector Database
↓
Semantic similarity search
---

12.14 What is ANN?:
Imagine:
10 million vectors
A brute-force approach could compare the query against every vector.

That's expensive.
Vector databases therefore use specialized indexing approaches such as:    
ANN
Approximate Nearest Neighbor

Think of it like Google Maps.
You don't calculate every possible road between two cities.
You intelligently narrow the search space.

Similarly:
10 million vectors
       ↓
Vector Index / ANN
       ↓
Potentially relevant vectors
       ↓
Top-K
---
