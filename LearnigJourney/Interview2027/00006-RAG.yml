4.5 Step 4 — Chunking:
Large documents are divided into smaller logical sections called chunks.
Imagine:
500-page PDF
You don't want to retrieve and send all 500 pages to the LLM.

Question Why can't we send:
a 500-page PDF
directly to the LLM?
Because
context window
is limited.
So we split the document.
This is called
Chunking:

Instead:
500-page document
        │
        ▼
     Chunking
        │
 ┌──────┼──────┐
 ▼      ▼      ▼
C1     C2     C3 ... C500
Later, perhaps only:
C127
C128
C129
are relevant.
---

4.6 Step 5 — Embedding:
Suppose we have:
"Employees receive 180 days of maternity leave."

The embedding model converts the text into a vector:
Each chunk is converted into a numerical vector.
These vectors allow computers to understand **semantic meaning** rather than simple keywords.
Text
 │
 ▼
Embedding Model
 │
 ▼
[0.21, -0.72, 0.88, ...]
The vector represents semantic characteristics of the text.
Now the system can compare the meaning of a question against the meaning of stored chunks.
---

