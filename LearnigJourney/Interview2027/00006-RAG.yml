14.22 Why Hashes Are Useful:
Suppose the article metadata says:

updated_at = today
but the content hasn't actually changed.
You don't necessarily want to re-embed unnecessarily.
You can calculate:
content
   ↓
SHA-256 hash
Example:

old_hash = ABC123
new_hash = ABC123

Therefore:
No content change
      ↓
No re-embedding required

But:

old_hash = ABC123
new_hash = XYZ789

means:

Content changed
      ↓
Reprocess

This is a practical implementation of the source's recommendation to detect document changes using hashes or repository events
