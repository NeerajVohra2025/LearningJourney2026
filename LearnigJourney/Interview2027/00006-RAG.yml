22.8. Runtime Evidence Should Be Treated as First-Class Evidence:
I would recommend that your architecture does not treat API responses as random tool output.
Normalize them into an Evidence object.
Conceptually
{
  "evidence_id": "EV-20260926-001",
  "type": "RUNTIME",
  "source": "ServiceNow",
  "source_type": "API",
  "entity": "INC0012345",
  "retrieved_at": "2026-09-26T17:32:10Z",
  "authority": "SYSTEM_OF_RECORD",
  "freshness": "REAL_TIME",
  "data": {
    "state": "In Progress",
    "priority": "P2",
    "assigned_group": "Network",
    "short_description": "VPN authentication failure"
  }
}

This is extremely useful architecturally.
Now both sources can use the same evidence contract:
Knowledge Evidence
        │
        ├── source = ServiceNow KB
        ├── type = KNOWLEDGE
        └── authority = APPROVED_KNOWLEDGE

Runtime Evidence
        │
        ├── source = ServiceNow API
        ├── type = RUNTIME
        └── authority = SYSTEM_OF_RECORD

---


22.9. Evidence Hierarchy:
For enterprise systems, I would establish an explicit precedence rule.
For example:
CURRENT SYSTEM-OF-RECORD DATA
             ↑
       Runtime Evidence
             ↑
     Approved Knowledge
             ↑
      Historical Data
             ↑
       LLM Knowledge
       
Therefore, if the vector database says:
Incident status = Assigned
but ServiceNow currently says:   
Incident status = In Progress

the runtime ServiceNow evidence should be used for current incident status.
The vector database may still be useful for explaining what that status means or what procedure should be followed.    
---

