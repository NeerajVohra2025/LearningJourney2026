16.15 Enterprise Implementation Responsibilities:
For the team, I would define responsibilities like this:
| Component             | Responsibility                      |
| --------------------- | ----------------------------------- |
| **Query Processor**   | Understand and prepare the query    |
| **Embedding Service** | Convert query into vector           |
| **Embedding Model**   | Generate semantic representation    |
| **Vector Store**      | Store document vectors              |
| **Search Engine**     | Find similar vectors                |
| **Metadata Layer**    | Apply contextual/data-scope filters |
| **Retriever**         | Select candidate evidence           |
| **Re-ranker**         | Improve relevance ordering          |
| **Prompt Builder**    | Construct grounded context          |
| **LLM**               | Generate final response             |
---

16.16 What Should the Architect Monitor?:
A production embedding service should not be treated as a black box.

At minimum, monitor:
Technical
Embedding latency
Embedding failures
Throughput
Request size
Token usage
Model availability
Retrieval quality
Query → relevant chunks
Query → irrelevant chunks
Recall
Precision
Top-K quality

The source specifically recommends benchmarking embedding quality using real enterprise queries rather than selecting an embedding model only by theoretical characteristics or cost
---

16.19 Principal GenAI Architect View:
At architect level, don't ask only:
"Which embedding model should we use?"
Ask:

1. What type of knowledge are we embedding?:
ServiceNow KB
Policies
Technical documentation
FAQs
Incident summaries

2. What languages?:
English only?
Multilingual?

3. What is the scale?:
100K chunks?
10M?
100M?

4. What is the query pattern?:
Natural language
Error codes
Incident numbers
Product names
Policy numbers

This may influence whether you need:
Semantic Search
+
Keyword Search
+
Hybrid Retrieval


5. What is the freshness requirement?:

A changed ServiceNow KB article eventually needs its embedding refreshed.


6. What is the evaluation strategy?:

Don't select an embedding model simply because it looks good in a benchmark.

Build a representative enterprise evaluation set:
Real ServiceNow questions
        ↓
Expected relevant KBs
        ↓
Embedding model candidates
        ↓
Measure retrieval quality
