The architect's responsibility is therefore not:
"Which LLM should I call?"

It is:
"How do I make the entire generation path trustworthy, observable, governed and evidence-based?"     
---

21.17 Common Mistakes:
❌ Mistake 1 — Assuming RAG eliminates hallucinations

It doesn't.

Poor retrieval or incomplete context can still result in hallucination.  

❌ Mistake 2 — Trusting the LLM blindly

Even a powerful model can generate unsupported information.  

❌ Mistake 3 — No source citations

The user cannot verify the answer.         

❌ Mistake 4 — No response validation

Unsupported output goes directly to the user.

❌ Mistake 5 — Evaluating only the LLM

A weak retrieval pipeline can make a strong model appear ineffective.
---

21.18 Best Practices:
The source recommends:

Instruct the LLM to answer using retrieved context.
Return an insufficient-information response when evidence is inadequate.
Include citations.
Validate responses.
Track hallucination rate.
Apply safety guardrails.
Continuously evaluate response quality.

For enterprise architecture, I would express this as:
GOOD GENERATION
=
Good Evidence
+
Good Context
+
Clear Instructions
+
Grounding
+
Validation
+
Guardrails
+
LLM Capability
