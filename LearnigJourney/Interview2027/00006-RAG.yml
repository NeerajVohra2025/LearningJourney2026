Chapter 17 — Search:
Enterprise RAG Implementation Guide
We now reach the point where the query vector actually meets the indexed ServiceNow knowledge.
The previous chapters prepared both sides:   
SERVICE NOW KNOWLEDGE
        ↓
Chunking
        ↓
Document Embedding
        ↓
Vector Store
        ↓
Indexing

and:
USER QUESTION
        ↓
Query Processing
        ↓
Query Embedding
        ↓
Query Vector       
Now we need to answer:

How do we search the knowledge base and find the most relevant candidates?
---


17.1 What Is Search?:
In simple terms:
Search takes the user's query and finds candidate knowledge chunks that may contain the answer.
Our query is:
"My VPN stopped working after the certificate expired. How can I fix it?"

After Chapter 16:
Query Vector

[0.019, -0.176, 0.721, 0.118, ...]
The vector store contains millions of vectors:
KB001001-C01 → [....]
KB001001-C02 → [....]
KB001001-C03 → [....]
KB001002-C01 → [....]
KB001002-C02 → [....]
...
Search compares the query vector against the indexed document vectors and finds the closest candidates.
---

17.2 The Simplest Mental Model:
Think of a huge library.
You ask the librarian:
"I need information about renewing an expired VPN certificate."
The librarian doesn't read every book.
Instead, the library's catalogue/index helps identify potentially relevant books.
Similarly:
Query Vector
     ↓
Vector Index
     ↓
Candidate Chunks

For example:
Top 20 candidates
These are not yet necessarily the final evidence.
That distinction is important.
---

17.3 Search vs Retrieval vs Re-ranking:
These three concepts can easily become confusing

For our architecture, think of them as:
Search:
Find potentially relevant candidates.
10 million chunks
       ↓
Search
       ↓
Top 20 candidates

Retrieval:
Determine which candidate knowledge should actually be returned for the query.

Top 20 candidates
       ↓
Retrieval logic
       ↓
Relevant evidence set

Re-ranking:
Improve the ordering/relevance of the retrieved candidates using a stronger relevance model.
Candidates
    ↓
Re-ranker
    ↓
Best evidence first
---

17.4 Three Major Search Approaches:
Enterprise RAG generally considers:

1. Dense Search
2. Sparse / Keyword Search
3. Hybrid Search
---

17.5 Dense Search:
Dense search uses embeddings.
We already created:
User Query
     ↓
Embedding Model
     ↓
Query Vector

And our ServiceNow chunks already have:
Chunk
  ↓
Embedding Model
  ↓
Document Vector

Dense search compares:
Query Vector
      ↓
Similarity
      ↓
Document Vectors
---

17.6 ServiceNow Dense Search Example:
User:
"My VPN stopped working after the certificate expired. How do I fix it?"

ServiceNow article:
KB001001

VPN Certificate Renewal

If the corporate VPN certificate has expired,
renew the client certificate before reconnecting
to the corporate VPN.

The wording isn't identical.

User says:

certificate expired
VPN stopped working
fix

Knowledge article says:

certificate renewal
reconnect VPN

But the meaning is related.
Dense retrieval can identify that semantic relationship.
This is one of the primary benefits of embeddings.
---

17.7 Sparse / Keyword Search:
Sparse retrieval works differently.
Instead of asking:
"Are these meanings semantically similar?"
it focuses on terms and their occurrence.
A common approach is BM25.

For example:

User Query:
ORA-12514 database connection failure

Suppose a ServiceNow article contains:

Oracle error ORA-12514 troubleshooting

Keyword search can be extremely useful because:

ORA-12514
is an exact technical identifier.
This is something semantic similarity alone may not always handle optimally.
---

17.8 Why Keyword Search Still Matters:
Consider this query:
"How do I renew my VPN certificate?"
Dense search is useful.
But consider:
"How do I resolve ORA-12514?"
or:
"What is procedure KB001234?"
or:
"Fix INC0012345"
These contain exact identifiers.
Keyword search can be very effective for:
Incident numbers
Error codes
KB numbers
Product names
Policy numbers
Version numbers
Technical identifiers

The source specifically highlights exact identifiers such as error codes, product names and policy numbers as situations where hybrid retrieval is valuable
---

17.9 Hybrid Search:
This is where enterprise RAG becomes more powerful.
Instead of choosing:
Dense
OR
Keyword
we can use:
Dense Search
     +
Sparse / Keyword Search
     ↓
Merge Results
     ↓
Top-K
This is called:

Hybrid Retrieval
---

17.10 ServiceNow Hybrid Example:
Suppose the user asks:
"How do I resolve ORA-12514 database connection failure in production?"

Dense Search
Understands:
database connectivity
Oracle listener
connection failure

Keyword Search:
Finds exact:
ORA-12514
Metadata

Finds:

environment = Production
status = Published

So conceptually:

                USER QUERY
                    │
          ┌─────────┴─────────┐
          ▼                   ▼
    Dense Search        Keyword Search
          │                   │
          │                   │
    Semantic matches     Exact matches
          │                   │
          └─────────┬─────────┘
                    ▼
               Merge Results
                    │
                    ▼
                 Top-K

This is a much stronger enterprise retrieval pattern than relying exclusively on one search method.
---

17.11 Where Does Metadata Filtering Fit?:
This is very important.
Suppose ServiceNow has:
KB001001 → India → Production
KB001002 → USA → Production
KB001003 → UK → Production
KB001004 → India → Development
The user asks:
"What is the production VPN procedure for India?"
Query processing can identify:
Search Query:
VPN procedure
Metadata:
country = India
environment = Production
Conceptually:

User
 ↓
Query Processing
 ↓
Search Query + Metadata Constraints
 ↓
Search
 ↓
Relevant Candidates

The source material describes metadata filtering as a way to narrow the search space based on attributes such as department, country, version, language and access permissions.
---

17.12 What Does the Index Actually Do?:
We covered indexing in the previous chapter, but now let's connect it to Search.
Suppose ServiceNow has:
10,000,000 chunks
Without an efficient vector index, searching every vector would be expensive.
The index provides a structure that allows the vector search engine to efficiently identify nearby vectors.
Conceptually:

10 Million Vectors
       │
       ▼
   Vector Index
       │
       ▼
Candidate region
       │
       ▼
Relevant vectors
This is why the vector index is so important.
The vector database's responsibility is to efficiently find the relevant knowledge rather than making the LLM search the documents
---

17.13 Search Is Not Reading the Documents:
This is another important misconception.
The flow is not:
LLM
 ↓
Read 10 million ServiceNow articles
 ↓
Find answer
Instead:

User Query
    ↓
Query Embedding
    ↓
Vector Search
    ↓
Candidate Chunks
    ↓
Retrieval
    ↓
Re-ranking
    ↓
Selected Evidence
    ↓
LLM

The LLM sees only the evidence eventually selected for the prompt.
---

17.14 Top-K:
Search normally does not return everything.
Instead, we specify:
K
For example:
Top-K = 20

means:
Return the 20 strongest search candidates.

Example:
Search
  ↓
10,000,000 chunks
  ↓
Top 20

Then later:
20 candidates
   ↓
Re-ranking
   ↓
Top 5

And finally:
Top 5
   ↓
Prompt Context
   ↓
LLM

---

17.15 Why Not Set K = 1000?:
Because more results do not automatically mean better results.
Suppose we send 1,000 chunks to the LLM.

Problems include:
large context
higher token consumption
higher latency
irrelevant information
conflicting information
greater opportunity for the model to focus on the wrong evidence

Therefore, K is an architectural tuning parameter.

The source recommends tuning K using real user queries rather than selecting it arbitrarily.
