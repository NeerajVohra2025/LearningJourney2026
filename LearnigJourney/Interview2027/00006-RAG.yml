Let's use your enterprise scenario.
User asks
"How do I resolve ORA-12514 database connection failure in production?"   

Step 1 — Query Processing:
The system identifies:  
Intent:
Resolve database connection failure

Error:
ORA-12514

Environment:
Production

Domain:
Database

Action:
Troubleshoot / resolve


Step 2 — Query Embedding:
The processed query becomes a vector:

Query
 ↓
Embedding Model
 ↓
Query Vector
Step 3 — Search

Hybrid search might perform:

Dense search:
Find concepts related to:

database connectivity
listener
Oracle connection
service registration
connection failure

Sparse search:
Find the exact identifier:
ORA-12514

Metadata filtering:

For example:
environment = Production
status = Published
category = Database
