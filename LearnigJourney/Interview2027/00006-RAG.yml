Chapter 18 — Retrieval:
Which Chunks Should We Return?
18.1. What Is Retrieval?:

Simple definition
Retrieval is the process of selecting the most relevant knowledge chunks from the searchable knowledge base for the user's question.

The important word is:
Relevant

The system does not need to return the entire knowledge base.
It needs to return a small, useful set of candidate chunks that can potentially answer the question.

Mental model
User Question
      ↓
Query Processing
      ↓
Query Embedding
      ↓
Search
      ↓
Candidate Chunks
      ↓
Retrieval
      ↓
Top-K Relevant Chunks
      ↓
Re-ranking
      ↓
Best Evidence
      ↓
Augmentation
      ↓
LLM

---

18.2. Search vs Retrieval:
This distinction is extremely important for an Architect interview.
They are closely related, but conceptually different.
| Search                         | Retrieval                                   |
| ------------------------------ | ------------------------------------------- |
| Finds candidates               | Selects relevant candidates                 |
| Focuses on finding             | Focuses on what should be returned          |
| Dense / sparse / hybrid        | Top-K selection and candidate set           |
| Uses indexes                   | Uses search results and relevance           |
| Optimized for recall and speed | Balances relevance, recall and context size |
| Can produce many candidates    | Produces manageable candidate set           |

Think of it this way:
Search = Find candidates.
Retrieval = Decide which candidates should continue.

Then:
Re-ranking = Determine the best order among those candidates.
---

3. Why Do We Need a Retrieval Stage?:
Imagine your ServiceNow knowledge base contains:

2,000,000 KB articles
8,000,000 chunks

User asks:
"How do I fix ORA-12514 when connecting to the production database?"

We don't want:

8,000,000 chunks
        ↓
       LLM

That would be:

extremely expensive
extremely slow
too much context
difficult to control
likely to introduce irrelevant information
---



Instead:

8,000,000 chunks
        ↓
Search
        ↓
Top 50 candidates
        ↓
Retrieval
        ↓
Top 20 candidates
        ↓
Re-ranking
        ↓
Top 5 evidence chunks
        ↓
LLM

The source gives the same architectural principle: retrieve a larger candidate set and then use later ranking to reduce it before the LLM.
---


18.4. What Does Retrieval Actually Return?:
Retrieval normally returns chunks, not simply documents.

For example:
KB001234
VPN Certificate Renewal

may have been divided into:
KB001234-C01
KB001234-C02
KB001234-C03
KB001234-C04
KB001234-C05

The query might retrieve:
KB001234-C03
KB001234-C04
KB008765-C02

Each result can contain:

{
  "chunk_id": "KB001234-C03",
  "content": "To renew the VPN certificate...",
  "score": 0.91,
  "metadata": {
    "source": "ServiceNow",
    "kb_number": "KB001234",
    "category": "Network",
    "environment": "Production",
    "version": "3",
    "status": "Published"
  }
}

So retrieval gives the downstream pipeline:
Content + relevance information + metadata + source reference.
---

18.5. What Is Top-K Retrieval?:
This is one of the most important concepts.
Suppose search produces:
Chunk A → 0.94
Chunk B → 0.91
Chunk C → 0.89
Chunk D → 0.87
Chunk E → 0.84
Chunk F → 0.81
...

If:

K = 5

we return:

A
B
C
D
E

That is:
Top-K Retrieval
The source defines Top-K as selecting the K most relevant chunks based on similarity scores.
---

18.6. Why Not Always Use K = 5?:
Because K is an architecture tuning parameter.

Suppose:
K = 3
You may get:
Very low context
Very low cost
Very low latency
BUT
Potentially miss the required evidence

Whereas:
K = 50

may provide:
Higher recall
BUT
More noise
More tokens
Higher latency
Higher cost

Therefore:
There is no universal K.
tuning K using real user queries and monitoring retrieval quality, latency, recall and precision.
---

18.7. Retrieval Should Usually Be a Two-Stage Process:
A production RAG architecture commonly looks like
                    KNOWLEDGE BASE
                          │
                          │
                    Millions of chunks
                          │
                          ▼
                 ┌─────────────────┐
                 │     SEARCH      │
                 │ Dense / Sparse │
                 │     / Hybrid   │
                 └────────┬────────┘
                          │
                          ▼
                    Top 20 / 50
                    Candidates
                          │
                          ▼
                 ┌─────────────────┐
                 │    RETRIEVAL    │
                 │ Candidate       │
                 │ selection       │
                 └────────┬────────┘
                          │
                          ▼
                     Top-K
                          │
                          ▼
                 ┌─────────────────┐
                 │   RE-RANKING    │
                 └────────┬────────┘
                          │
                          ▼
                       Top 3–5
                          │
                          ▼
                        LLM
This is why we shouldn't treat Search and Retrieval as completely interchangeable concepts.
---

