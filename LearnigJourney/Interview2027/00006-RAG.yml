18.20. Common Retrieval Mistakes:
❌ Mistake 1 — Always using K = 5

There is no universal optimal K.

❌ Mistake 2 — Returning too many chunks
Top 100

may overwhelm the prompt with irrelevant information.

❌ Mistake 3 — Using only semantic search

Exact identifiers can be missed or poorly prioritized.

❌ Mistake 4 — Ignoring metadata

This can produce irrelevant or inappropriate knowledge.

❌ Mistake 5 — Measuring only LLM output

You may incorrectly blame the LLM when the real problem is retrieval.

❌ Mistake 6 — Treating similarity score as truth

A high score means relevance according to the retrieval mechanism, not factual correctness.

These align with the common retrieval mistakes identified in the source  
