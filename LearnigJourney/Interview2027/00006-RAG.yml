Chapter 6 — Document Parsing:
6.1 Where are we?:

We start with enterprise documents:
PDF
Word
Excel
PowerPoint
SharePoint
Confluence
ServiceNow
Jira
Database
API

The previous chapter, Document Loading, brings these documents into our ingestion pipeline.
Now we have to answer:
What is actually inside these documents?
That is the job of Parsing.

The document defines parsing as extracting meaningful, structured information from raw enterprise documents and converting it into machine-readable content for downstream processing such as chunking and embedding.
---

6.2 Loading vs Parsing:
This distinction is extremely important.

Loading:
Means:
Get the document from the source.

Example:
SharePoint
    ↓
Download TravelPolicy.pdf

Parsing:
Means:
Understand/extract the content from the document.

So:
Loading = GET THE DOCUMENT

Parsing = EXTRACT THE INFORMATION
---

6.3 Simple Example:
Suppose ServiceNow returns:
Incident Number:
INC0012345

Short Description:
VPN connectivity failure

Description:
Users cannot connect to VPN after the security patch.

Work Notes:
VPN client version is outdated.

Resolution:
Upgrade VPN client to version 8.4.

The ServiceNow connector loads the record.
---

6.4 Parsing Is More Than "Extract Text":
                 RAW DOCUMENT
                      │
                      ▼
                    PARSER
                      │
       ┌──────────────┼───────────────┐
       │              │               │
      Text          Tables          Images
       │              │               │
       ├──────────────┼───────────────┤
       │              │               │
    Sections        Lists         Metadata
                      │
                      ▼
             MACHINE-READABLE
                REPRESENTATION
Parsing converts the source response into a structured internal representation:
Document
{
    title: "INC0012345",

    content: "...",

    metadata: {
        source: "ServiceNow",
        incident_number: "INC0012345"
    }
}

Now downstream components don't need to understand ServiceNow's original API response format.
---

6.5 Why Parsing Is Important for RAG:
Suppose parsing extracts only this:
VPN connectivity failure
but loses:
Root Cause:
Old VPN client

Resolution:
Upgrade to version 8.4

The RAG system may later retrieve incomplete information.
Therefore:
Poor Parsing
     ↓
Missing Information
     ↓
Poor Chunks
     ↓
Poor Embeddings
     ↓
Poor Retrieval
     ↓
Poor Answer


This is why parsing is not just a technical preprocessing step.
It affects the entire downstream RAG pipeline.
---

