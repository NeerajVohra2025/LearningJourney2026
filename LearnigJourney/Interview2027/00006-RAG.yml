1.7 Interview answer
If an interviewer asks:
"Why was RAG invented?"
A strong architect-level answer would be:
RAG was introduced to allow an LLM to use external, private and changing knowledge at inference time without retraining the underlying model. The system retrieves relevant enterprise information, provides it as context to the LLM, and allows the model to generate a response grounded in that information.
That is much stronger than simply saying:
"RAG is used to search documents."                
