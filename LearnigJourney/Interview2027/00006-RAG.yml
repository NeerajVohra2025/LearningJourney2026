23.20. Traditional RAG vs Agentic RAG  :
| Area             | Traditional RAG                       | Agentic RAG                                               |
| ---------------- | ------------------------------------- | --------------------------------------------------------- |
| Primary purpose  | Answer using retrieved knowledge      | Solve a multi-step problem                                |
| Workflow         | Mostly predefined                     | Dynamic                                                   |
| Retrieval        | Central pipeline                      | One capability/tool                                       |
| Planning         | Limited/none                          | Yes                                                       |
| Tool calling     | Usually absent                        | Core capability                                           |
| Runtime evidence | Limited                               | Native capability                                         |
| APIs             | Usually outside RAG                   | Agent can invoke tools                                    |
| Memory           | Usually conversational/context memory | Can maintain task/conversation memory                     |
| Reasoning loop   | Usually one pass                      | Observe → act → observe                                   |
| Multiple systems | Limited                               | Can coordinate                                            |
| Execution        | Usually no                            | Can execute permitted actions                             |
| Follow-up        | Usually user-driven                   | Agent can determine when additional information is needed |
| LLM calls        | Often one main generation call        | Potentially multiple                                      |
| Architecture     | Pipeline                              | Orchestrated workflow                                     |
| Failure handling | Pipeline error/fallback               | Can retry, choose another tool or escalate                |
| Best suited for  | Knowledge assistants                  | Complex enterprise workflows                              |
---

23.21. The Biggest Architectural Difference:
This is the sentence I want you to remember for interviews:

Traditional RAG asks: "Which knowledge should I retrieve?"

Agentic RAG asks: "What do I need to do to solve this problem?"
Then retrieval becomes one of the available capabilities.
Traditional RAG

