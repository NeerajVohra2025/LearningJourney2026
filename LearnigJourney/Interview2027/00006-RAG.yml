23.24. Agentic RAG Example:
User:
"INC0012345 has a VPN certificate problem. Check what's happening, find the approved resolution, and tell me what needs to be done."
Architecture:
User
 ↓
Agent
 ↓
Understand request
 ↓
Plan
 ↓
 ├── ServiceNow Tool
 │      ↓
 │   Current Incident
 │
 ├── RAG
 │      ↓
 │   Approved Knowledge
 │
 └── Maybe Certificate Tool
        ↓
     Current Certificate
 ↓
Combine Evidence
 ↓
Evaluate Evidence
 ↓
Context Assembly
 ↓
LLM
 ↓
Grounding Validation
 ↓
Answer

This is where Agentic RAG provides real architectural value.        
