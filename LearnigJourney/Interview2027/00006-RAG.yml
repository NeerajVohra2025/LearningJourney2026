21.3 How Does an LLM Generate an Answer?:
At a simplified level, an LLM generates text token by token.

Suppose the context says:
Employees receive 20 working days
of annual leave.

And the user asks:
How many annual leave days do employees receive?

The model generates something conceptually like:
Employees
→ receive
→ 20
→ working
→ days
→ of
→ annual
→ leave.
Each next token is generated based on the information available in the model's context.
For architecture discussions, you do not need to explain the entire Transformer implementation.
The important mental model is:
Context
   +
Question
   +
Model
   ↓
Next-token prediction
   ↓
Next token
   ↓
Next token
   ↓
...
   ↓
Final response
---

21.4 Generation Does NOT Mean "Search Again":
This distinction is important.
After retrieval:
Vector DB
   ↓
Top-K
   ↓
Re-ranking
   ↓
Evidence

the LLM doesn't normally go back and search the vector database itself.
Instead:
Evidence
   ↓
Prompt
   ↓
LLM
   ↓
Answer
So responsibilities remain separated:
| Component            | Responsibility           |
| -------------------- | ------------------------ |
| Search               | Find candidates          |
| Retrieval            | Select candidates        |
| Re-ranking           | Prioritize best evidence |
| Augmentation         | Build context            |
| LLM                  | Generate response        |
| Grounding validation | Check support            |
| Guardrails           | Enforce policies         |
---

21.5 What Is Grounding?:
Now we reach the most important concept in this chapter.

Grounding means generating a response based on trusted external evidence provided to the model.
In RAG, that evidence generally comes from:
Enterprise documents
ServiceNow knowledge
Policies
Databases
APIs
Contracts
Product documentation
Other approved knowledge sources

Simple mental model:
Without Grounding

Question
   ↓
LLM
   ↓
Possible answer

versus:
With Grounding

Question
   +
Trusted Evidence
   ↓
LLM
   ↓
Evidence-based answer
---

21.6 Augmentation vs Grounding — Final Distinction:
This was an important question from the previous chapter.
They are related but different.

Augmentation:
What information do we provide to the LLM?
Question
+
Evidence
+
Policies
+
Conversation
+
Instructions
        ↓
Augmented Context

Grounding:
Is the generated answer actually supported by the evidence?

Therefore:
Augmentation supplies the context. Grounding ties the answer to that context.
---

21.7 Why Do Hallucinations Still Occur?:
This is one of the most important questions.

You might think:
"If we have RAG, hallucinations are solved."

No.

The source explicitly states that RAG can significantly reduce hallucinations, but cannot completely eliminate them.

Why?:
Because problems can occur at multiple stages.

Poor Query
    ↓
Poor Search
    ↓
Poor Retrieval
    ↓
Poor Re-ranking
    ↓
Incomplete Context
    ↓
Weak Prompt
    ↓
LLM Generation
    ↓
Hallucination

So hallucination is not necessarily an LLM-only problem.
---

21.9 Where Can the RAG Pipeline Fail?:
As a Principal Architect, don't immediately blame the LLM.

Trace the pipeline.

Failure 1 — Query Processing:
User says:
"VPN stopped working"
but the system misunderstands the intent.

Failure 2 — Search:
Search doesn't find the relevant VPN knowledge.

Failure 3 — Retrieval:
Relevant knowledge exists but doesn't make it into Top-K.

Failure 4 — Re-ranking:
The relevant chunk is ranked too low.

Failure 5 — Augmentation:
The correct evidence exists but isn't included in the final context.

Failure 6 — Generation:
The LLM receives good evidence but generates unsupported information.

Failure 7 — Validation:
The unsupported answer is not detected.
This gives us an important architecture principle:
Generation quality depends on the entire RAG pipeline, not just the LLM.
---

