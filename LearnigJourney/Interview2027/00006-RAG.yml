Chapter 10 — Embeddings: How RAG Understands Meaning
10.1 — Where We Are in the RAG Pipeline

So far, our document has gone through:
ServiceNow / PDF / Word / SharePoint / Confluence
                    ↓
                 Loading
                    ↓
                  Parsing
                    ↓
                  Cleaning
                    ↓
                 Chunking
                    ↓
             ⭐ WE ARE HERE
                Embedding
                    ↓
              Vector Store
                    ↓
                Retrieval
                    ↓
                Reranking
                    ↓
             Prompt Augmentation
                    ↓
                   LLM
                    ↓
              Grounded Answer
So embedding comes after chunking and before vector storage.  
---

10.3 — What Is an Embedding?:
The simplest definition is:

An embedding is a numerical representation of text that captures its semantic meaning.

For example:
"Employees are entitled to annual leave."

                 ↓

        Embedding Model

                 ↓

[0.21, -0.44, 0.71, 0.18, ...]

Another sentence:
"How many vacation days do employees get?"

                 ↓

        Embedding Model

                 ↓

[0.19, -0.41, 0.69, 0.22, ...]

The vectors can be close in vector space because the two statements have similar meaning, even though the wording is different.
The actual vector may contain hundreds or thousands of numerical dimensions.
You don't need to understand each individual number.
---

10.4 Why Do We Need Embeddings?:
This is one of the most important concepts in RAG.
Suppose our knowledge base contains:
Employees are entitled to annual leave.
The user asks:
How many vacation days do employees get?
Look at the words:

Document:
annual leave

User:
vacation days

The words are different.

A simple keyword search may struggle because:

annual ≠ vacation
leave ≠ days

But semantically:

annual leave
      ≈
vacation days

An embedding model represents both pieces of text in vector space so that semantically related content can be identified.

That is the foundation of semantic search.
---

10.5. Keyword Search vs Semantic Search:

Let's make this very simple.
Keyword Search

The system asks:
"Do these words match?"

Query:
vacation days

Document:
annual leave
Exact keyword overlap may be weak.

Semantic Search:
The system asks:
"Do these two pieces of text have a similar meaning?"
Query:
How many vacation days do employees get?

              ↓

        Embedding Model

              ↓

        Query Vector

              ↓

       Similarity Search

              ↓

Document:
Employees are entitled to annual leave.
This is why embeddings are so important to RAG.
---

10.6. What Exactly Happens During Embedding?:

Let's take one chunk.

Chunk:
Employees are entitled to annual leave.

The process is:
                    CHUNK
                      │
                      ▼
             Embedding Model
                      │
                      ▼
             Numerical Vector
                      │
                      ▼
              Vector Database
              
For example:
"Employees are entitled to annual leave."

                  ↓

          Embedding Model

                  ↓

[0.21, -0.44, 0.71, 0.18, ...]
The vector is then stored along with the original text and metadata.
---

10.7. What Does the Vector Represent?:
This is an important conceptual point.

The vector is not simply a list of keywords.

It is a numerical representation intended to capture semantic relationships.

Conceptually
                    Semantic Space

       Annual Leave
             ●
            /
           /
          ● Vacation Days

                         ● Medical Policy


       ● Travel Policy
       
Texts with related meanings tend to be represented closer together than unrelated texts.
The retrieval system can then calculate similarity between vectors. 
---
      
108. Embedding Is Not the LLM   :
This is a very common interview question.
You might have:
Gemini
GPT
Claude
Llama
These are generally used as generative/chat models.
An embedding model has a different purpose:
Embedding Model
      ↓
Text → Vector

while an LLM does:
Prompt
  ↓
LLM
  ↓
Generated Answer
So:
Embedding Model
= representation for retrieval

LLM
= generation/reasoning over the supplied context

Your RAG architecture normally uses both, but for different jobs.
---

10.9. A Very Important Architect Insight

A powerful LLM does not automatically fix poor retrieval.   
Imagine:
User Question
      ↓
Poor Embedding
      ↓
Wrong Chunks Retrieved
      ↓
LLM
      ↓
Poor/Unsupported Answer
Even if you replace the LLM with a more powerful model, the relevant evidence may never reach it.
Therefore:
Better Embeddings → Better Retrieval → Better RAG → Better Answers
---

10.10. Document Embedding:
Now let's see how this works during RAG ingestion.
Suppose Chunking produced:
Chunk 1:
Employees are entitled to annual leave.

Chunk 2:
Medical reimbursement policy.

Chunk 3:
Employees can claim travel expenses.

We send these chunks to the embedding model.
Chunk 1
   ↓
Embedding Model
   ↓
Vector 1

Chunk 2
   ↓
Embedding Model
   ↓
Vector 2

Chunk 3
   ↓
Embedding Model
   ↓
Vector 3

Conceptually:
[
   [0.12, -0.44, ...],
   [0.89,  0.22, ...],
   [0.31, -0.12, ...]
]

# embedding.embed_documents(...) where multiple document chunks are converted into vectors
---

11. embed_documents() — What Does It Mean?
In a LangChain-style implementation:

vectors = embedding.embed_documents(
    [
        "Employees are entitled to annual leave.",
        "Medical reimbursement policy.",
        "Employees can claim travel expenses."
    ]
)
Conceptually:
                 embed_documents()
                       │
        ┌──────────────┼──────────────┐
        ▼              ▼              ▼
     Chunk 1        Chunk 2        Chunk 3
        │              │              │
        ▼              ▼              ▼
     Vector 1       Vector 2       Vector 3
One important point:
Creating the embedding object does not itself generate vectors.     
For example:
embedding = OllamaEmbeddings(
    model="nomic-embed-text"
)
creates/configures the embedding component. The actual embedding happens when you invoke the embedding operation
---

10.12. Query Embedding:
Now we move from the ingestion side to the query side.
Suppose the user asks: 
How many vacation days are allowed?
We also need to convert the user's question into a vector.      
User Question
      ↓
Embedding Model
      ↓
Query Vector

For example:
query_vector = embedding.embed_query(
    "How many vacation days are allowed?"
)

Conceptually:
Question
   ↓
[0.44, -0.72, 0.31, ...]
The vector database can now compare the query vector against stored document vectors.
--

10.13. Why Are There Two Methods?:
This is an important point to remember:
embed_documents()
is used for document/chunk embedding.

embed_query()
is used for the user's query.

So:
INGESTION
Document Chunk
     ↓
embed_documents()
     ↓
Document Vector

and:

QUERY
User Question
     ↓
embed_query()
     ↓
Query Vector

Some embedding models optimize document and query representations somewhat differently, which is why frameworks expose separate operations
---

10.14. Complete Embedding Flow:
                 INGESTION TIME
                 ───────────────

Document
   ↓
Parsing
   ↓
Cleaning
   ↓
Chunking
   ↓
embed_documents()
   ↓
Embedding Model
   ↓
Document Vectors
   ↓
Vector Store

Then later:
                 QUERY TIME
                 ───────────

User Question
      ↓
embed_query()
      ↓
Embedding Model
      ↓
Query Vector
      ↓
Vector Search
      ↓
Relevant Chunks
---

10.15. Why Must Document and Query Embeddings Be Compatible?:
Suppose we have:
Document Vector
       ↓
[0.21, -0.44, 0.71, ...]

and:

Query Vector
       ↓
[0.19, -0.41, 0.69, ...]

The retrieval system compares them in the same vector space.:
Therefore, document and query embeddings should normally be generated using the same embedding model.
Otherwise you can end up with vectors that are not meaningfully comparable.
---

10.17. Which Embedding Model Should We Use?:
The key principle from the source is:
Use an embedding model designed for retrieval rather than simply using a chat model.

Examples mentioned in the source include:
nomic-embed-text
BGE
mxbai
OpenAI Embeddings
Vertex AI Embeddings

For an Ollama-based implementation, the source uses:
from langchain_ollama import OllamaEmbeddings

embedding = OllamaEmbeddings(
    model="nomic-embed-text"
)
Important distinction:
Don't think:
LLM = embedding model
Instead:
LLM
 └── Generates answers

Embedding Model
 └── Creates vectors for retrieval
---
 
10.18. Batch Embedding in Enterprise Systems:
Imagine your enterprise knowledge base contains: 
1,000,000 chunks
You don't necessarily want to call the embedding model one chunk at a time:
Chunk 1 → API
Chunk 2 → API
Chunk 3 → API
...
Instead, document embeddings can be processed in batches where supported:
100 / 1000 chunks
       ↓
Embedding Model
       ↓
Vectors
This can improve throughput, subject to the embedding model, API limits, memory and infrastructure constraints.
---

