23.27. Where MCP Fits:
If you later use MCP, MCP can provide a standardized interface between the agent and tools/resources.
Conceptually:
Google ADK Agent
       │
       ▼
     MCP
       │
 ┌─────┼─────────────┐
 ▼     ▼             ▼
RAG  ServiceNow   Other Systems
Tool     Tool        

The important point is:
MCP is not Agentic RAG itself.
MCP is a protocol/interface mechanism.
Agentic RAG is the architecture/workflow pattern involving agent reasoning, retrieval, tools, evidence and potentially execution.
