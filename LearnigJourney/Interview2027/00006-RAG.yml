Chapter 5 — Document Loading:
Now we go deeper into the first ingestion stage.

What Is Document Loading?:
Document Loading is the process of collecting enterprise knowledge from different data sources and making it available for the rest of the ingestion pipeline. Think of it as gathering all the books before organizing a library. Without books, there is nothing to catalog. Similarly, Without documents, there is nothing to parse, chunk, embed, or retrieve.
Enterprise Analogy
Imagine you're building an AI assistant for a multinational bank. Where does the bank's knowledge exist? Certainly not in a single PDF. Instead, it is scattered across many systems. For example:

HR Policies in SharePoint
Customer Agreements in Document Management Systems
Product Manuals in Confluence
Customer Information in SQL Databases
Incident Reports in ServiceNow
Source Code Documentation in GitHub
Standard Operating Procedures in Google Drive
Before AI can answer questions, it must first collect knowledge from all these locations. This is the responsibility of Document Loading.

Therefore we need:
Connectors / Document Loaders
---

5.1 Different sources need different loaders:
PDF
 │
 ▼
PDF Loader

SharePoint
 │
 ▼
SharePoint Loader

ServiceNow
 │
 ▼
ServiceNow Loader

SQL
 │
 ▼
Database Loader

REST API
 │
 ▼
API Loader
The loaders normalize different source formats into a common internal document representation.
---

5.2 Unified document model:
Regardless of where the document came from, downstream processing should ideally see something like:
Although documents come from different sources, the ingestion pipeline should treat them uniformly.
Document
{
   title,
   content,
   metadata
}
For example:
Title:
Travel Policy

Content:
Employees are eligible for...

Metadata:
source = SharePoint
department = HR
version = 4.0
created_date = 2025-01-10

This is architecturally valuable because:
                    Sources
                       │
        ┌──────────────┼──────────────┐
        ▼              ▼              ▼
   SharePoint      ServiceNow       SQL
        │              │              │
        ▼              ▼              ▼
 SharePoint Loader  SN Loader      DB Loader
        │              │              │
        └──────────────┼──────────────┘
                       ▼
                Unified Document
                       │
                       ▼
               Common Pipeline
Now the rest of the ingestion pipeline doesn't need to care where the information came from.

Enterprise Example:
Suppose an employee asks:

"What is our Work From Home policy?"
The relevant information exists in:

SharePoint
HR Portal
Employee Handbook
Microsoft Teams Wiki

The Document Loaders collect all these documents and convert them into a unified format.

Only then can the next stages process them.
example:
| Data Source | Loader            |
| ----------- | ----------------- |
| PDF         | PDF Loader        |
| Word        | DOCX Loader       |
| SharePoint  | SharePoint Loader |
| Confluence  | Confluence Loader |
| SQL         | Database Loader   |
| REST API    | API Loader        |
