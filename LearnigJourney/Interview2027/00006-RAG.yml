Chapter 16 — Query Embedding:
16.1 Where Are We in the RAG Pipeline?:

We already completed the knowledge preparation side.
For example, ServiceNow KB article:
KB001001
VPN Certificate Renewal
was processed through:

ServiceNow
   ↓
Document Loading
   ↓
Parsing
   ↓
Cleaning
   ↓
Chunking
   ↓
Embedding
   ↓
Vector Store
   ↓
Indexing
We ended up with something conceptually like:
┌──────────────────────────────────────────┐
│ Chunk ID: KB001001-C03                   │
│                                          │
│ Text:                                    │
│ "If the VPN certificate has expired,     │
│ renew the client certificate before      │
│ reconnecting to the corporate VPN."      │
│                                          │
│ Embedding:                               │
│ [0.021, -0.182, 0.734, ...]              │
│                                          │
│ Metadata:                                │
│ source = ServiceNow                      │
│ kb_number = KB001001                     │
│ category = Network                       │
│ environment = Production                 │
│ status = Published                       │
└──────────────────────────────────────────┘
Now the user asks:
"My VPN stopped working because the certificate expired. How do I fix it?"
Chapter 15 — Query Processing — prepared this question.
Now Chapter 16 converts it into a vector.
---


16.2 What Is Query Embedding?:

Very simply:
Query Embedding converts the processed user question into a numerical vector representing its semantic meaning.
Mental model:
User Question
      ↓
Query Processing
      ↓
Processed Query
      ↓
Embedding Model
      ↓
Query Vector
For example:
"My VPN stopped working because the
certificate expired. How do I fix it?"

becomes conceptually:

[
  0.018,
 -0.241,
  0.731,
  0.119,
 -0.084,
  ...
]
The actual vector may contain hundreds or thousands of dimensions depending on the embedding model.
The important point is:
The numbers represent semantic meaning, not individual words.
---

16.3 Why Do We Need Query Embedding?:
Our ServiceNow knowledge already has embeddings.
For example:
KB001001-C03
       ↓
Document Embedding
       ↓
[0.021, -0.182, 0.734, ...]

The user query also needs to become a vector:

User Question
       ↓
Query Embedding
       ↓
[0.019, -0.176, 0.721, ...]

Now the vector search engine can compare them.

Conceptually:
                    VECTOR SPACE

       KB001001-C03 ●
                    ↑
                    │ close
                    │
             Query ●
             
If two vectors are semantically close, the system considers their underlying text more relevant to each other.
This is what enables semantic search             
---

16.4 Keyword Search vs Semantic Search:
Consider the user question:
"How can I restore VPN access after my certificate became invalid?"
ServiceNow article:
"VPN Certificate Renewal Procedure"
There may not be an exact keyword match for:
restore
access
became invalid

But semantically:
certificate became invalid
        ≈
certificate expired

restore VPN access
        ≈
renew VPN certificate
Embeddings allow the retrieval system to recognize this semantic relationship.
---

16.5 Very Important: Embedding Model ≠ LLM
This is one of the most common mistakes in RAG implementations.
There are two different model responsibilities.

Embedding Model
Responsible for:
Text
 ↓
Vector

Used for:
document embeddings
query embeddings
semantic similarity

LLM
Responsible for:

Evidence + Question
        ↓
Answer

Used for:

reasoning
generation
summarization
response formatting

So:
                 RAG
                  │
       ┌──────────┴──────────┐
       │                     │
Embedding Model             LLM
       │                     │
Retrieval                  Generation
       │                     │
Vectors                    Answer
The LLM does not perform the vector search.
---

16.6 The Most Important Enterprise Rule:
Suppose during ingestion you used:
Embedding Model A
Then ServiceNow chunks were converted into vectors using Model A.
At query time, you should normally use:
Embedding Model A
again.
Why?
Because the document and query vectors need to live in the same vector space.
Conceptually:
ServiceNow KB
     │
     ▼
Embedding Model A
     │
     ▼
Document Vectors
     │
     │
     │ same vector space
     │
     ▼
Query
     │
     ▼
Embedding Model A
     │
     ▼
Query Vector

---

16.7 What Happens If We Change the Embedding Model?:
This is a very important production consideration.
Suppose today we have:
Embedding Model A
and 5 million ServiceNow chunks have been embedded.
Tomorrow the team decides:
"Let's use Embedding Model B."
We cannot simply start generating new query vectors using Model B while keeping the old document vectors from Model A.
The vector spaces may be incompatible.
The typical architecture is:

Existing ServiceNow chunks
          ↓
Embedding Model B
          ↓
New embeddings
          ↓
New / rebuilt vector index
---

16.8 Complete ServiceNow Example:

Let's walk through this end to end.

Step 1 — ServiceNow Knowledge Article:
Suppose ServiceNow contains:
KB001001

Title:
VPN Certificate Renewal

Content:
If the corporate VPN certificate has expired,
the user must renew the client certificate
before reconnecting to the corporate VPN.

Step 2 — Chunking:
The ingestion pipeline creates:

Chunk ID:
KB001001-C03
with:

Text:
If the corporate VPN certificate has expired,
the user must renew the client certificate
before reconnecting to the corporate VPN.

Step 3 — Document Embedding:
The embedding service receives:
KB001001-C03 text
and produces:
Document Vector:

[
  0.021,
 -0.182,
  0.734,
  0.115,
 ...
]
This vector is stored in the vector store along with the chunk and metadata.
---

16.9 Later — User Asks a Question:

The user asks:
"My VPN stopped working after the certificate expired. How can I fix it?"
Conceptually:
Intent:
VPN troubleshooting

Problem:
Expired certificate

Action:
Fix / renew certificate

Domain:
Network

---

16.10 Query Embedding:
The query embedding service receives:
"My VPN stopped working after the certificate expired.
How can I fix it?"

The embedding model produces:
Query Vector:

[
  0.019,
 -0.176,
  0.721,
  0.118,
 ...
]

Now we have:
Document Vector
[0.021, -0.182, 0.734, ...]

        VS

Query Vector
[0.019, -0.176, 0.721, ...]

The search engine can now calculate their similarity.
---

16.11 Who Creates the Query Embedding?:
This is an important architecture question.
The application's retrieval/query pipeline invokes the embedding model.

It may be implemented using:
Vertex AI embedding service
an Ollama embedding model
another managed embedding service
a self-hosted embedding model
depending on the architecture.

For example, conceptually:
Google ADK Agent / RAG Service
              │
              ▼
       Query Processing
              │
              ▼
       Embedding Service
              │
              ▼
        Query Vector
              │
              ▼
        Vector Store
The agent itself does not need to "understand vectors."
It orchestrates the retrieval workflow.    
---

16.12 Example Using Ollama
For a local implementation, you might use an embedding model such as:   

from langchain_ollama import OllamaEmbeddings
embedding = OllamaEmbeddings(
    model="nomic-embed-text"
)

For a query:
query = "My VPN certificate expired. How do I fix it?"
query_vector = embedding.embed_query(query) 

Conceptually:
query
  ↓
embed_query()
  ↓
query_vector

And during ingestion:
document_vectors = embedding.embed_documents(chunks)

So the same embedding configuration is used for:
Documents → embed_documents()
Queries    → embed_query()
---

16.13 What Happens After Query Embedding?:
This is where the next chapters connect.

We now have:
Query
  ↓
Query Processing
  ↓
Query Embedding
  ↓
Query Vector

The query vector is passed to the search layer.

Then:

Query Vector
      ↓
Vector Search
      ↓
Candidate Results

For example:

Top 20 Candidates

Then:

Top 20
   ↓
Retrieval
   ↓
Re-ranking
   ↓
Top 5 Evidence Chunks

Then:

Top 5
   ↓
Augmentation
   ↓
LLM
   ↓
Grounded Answer
---

