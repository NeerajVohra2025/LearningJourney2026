The important principle is:
Tool access is governed access, not unrestricted access.  
---

22.12. Runtime Evidence vs Knowledge vs Grounding:
This is where your earlier thinking becomes clearer.  
| Concept              | Meaning                                                        |
| -------------------- | -------------------------------------------------------------- |
| **Knowledge**        | Information stored in organizational sources                   |
| **RAG**              | Mechanism for retrieving relevant indexed knowledge            |
| **Runtime Evidence** | Current information retrieved directly from a live system      |
| **Augmentation**     | Putting selected evidence/instructions into the LLM context    |
| **Grounding**        | Ensuring the generated answer is supported by trusted evidence |
| **Citation**         | Showing where the evidence came from                           |
| **Validation**       | Checking whether the generated answer is supported             |
So your earlier statement that "grounding is similar to augmentation" needs one refinement:
Augmentation supplies the evidence to the model; grounding ensures the answer is actually supported by that evidence.    
And runtime evidence is one important type of evidence.
---

