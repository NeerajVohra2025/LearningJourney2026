20.12 Augmentation vs Grounding:
This is especially important because you previously identified that these concepts appear similar.
They are related, but not identical.

Augmentation:
Answers:
"What information do we put into the LLM's context?"
Question
+
Evidence
+
Policies
+
Conversation
+
Instructions
      ↓
Augmented Context


Grounding:
Answers:
"Is the generated answer actually based on trusted evidence?"

The source describes grounding as providing trusted external context so that the LLM generates responses based on factual evidence rather than relying solely on pretrained knowledge.
So the relationship is:

Retrieval
    ↓
Evidence
    ↓
Augmentation
    ↓
LLM
    ↓
Grounded Response
    ↓
Grounding Validation

Very simple memory trick:
Augmentation = putting evidence into the context.
Grounding = making sure the answer is tied to that evidence.
Therefore:
Augmentation supports grounding, but augmentation and grounding are not the same thing.
