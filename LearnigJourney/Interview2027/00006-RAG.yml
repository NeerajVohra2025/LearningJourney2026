23.22. Very Important: Agentic RAG Does NOT Replace RAG
This is a common interview mistake.
Do not say:
"Agentic RAG is a replacement for RAG."

Instead say:
"Agentic RAG extends RAG by making retrieval one capability within an agentic orchestration layer that can plan, invoke tools, retrieve runtime evidence, use memory, and execute multi-step workflows." 
---

23.23. Traditional RAG Example:
User:
"What is the VPN certificate renewal procedure?"
Architecture:
User
 ↓
RAG
 ↓
Search KB
 ↓
Retrieve
 ↓
Re-rank
 ↓
Prompt
 ↓
LLM
 ↓
Answer

Very good use case.

No need for a complicated agent. 
