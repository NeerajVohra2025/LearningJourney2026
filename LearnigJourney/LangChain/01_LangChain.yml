        🔹 13  Agents (Decision Makers): 
                An Agent is an AI worker that can decide what action to take next.
                Key Difference:
                    | Component | Behavior                  |
                    | --------- | ------------------------- |
                    | Chain     | Follows fixed steps       |
                    | Agent     | Chooses steps dynamically |
                
                    🔹 Agent Core Classes
