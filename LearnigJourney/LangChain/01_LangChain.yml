                AgentExecutor:
                        (The Runtime Controller)   
                             AgentExecutor is the manager that supervises the agent.
                                The agent decides
                                The executor enforces rules   
                                AgentExecutor = Governance + Runtime Controller
                    
                        What AgentExecutor Controls:
                            | Control        | Purpose                |
                            | -------------- | ---------------------- |
                            | Max steps      | Prevent infinite loops |
                            | Tool execution | Secure execution       |
                            | Logging        | Observability          |
                            | Error handling | Stability              |
                        
                    
                     Step-by-Step:
                            STEP 1: AgentExecutor Starts
                                    Max steps = 5
                                    Allowed tools = support tools only
                            STEP 2: Agent Runs
                                    Agent reasons and calls tools
                                    
                            STEP 3: Executor Monitors
                                    Logs every step
                                    Tracks tool usage     

                            STEP 4: Executor Stops Agent
                                    When answer is ready
                                    OR
                                    When step limit is reached       

                            STEP 5: Final Output
                                    Safe, controlled response returned                
                    
                        Example with Limits & Safety:
                                agent_executor = AgentExecutor(
