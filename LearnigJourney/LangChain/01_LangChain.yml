                ReAct Agent:
                    (Reason + Act Agent)
                        When Enterprises Use ReAct Agents:
                            Customer support
                            IT helpdesk
                            Operations
                            Investigations

                        📌 Best when steps are not known in advance
                                An agent that thinks before acting, then learns from the result.
                                It follows a loop:
                                    Reason → Act → Observe → Repeat
                    
                        Step-by-Step ReAct Execution:
                            🔹 STEP 1: User Input
                                    The agent receives:
                                        “Where is my order 12345?”
                            🔹 STEP 2: Reasoning
                                    Agent thinks:
                                        “This requires order data. I need to call the order system.”
                                        
                            🔹 STEP 3: Decide Action
                                    Agent chooses:
                                        Action: get_order_status
                                        Input: 12345
                            🔹 STEP 4: Act (Tool Call)
                                    System executes the tool:
                                    “Order shipped. ETA tomorrow.”
                                    
                            🔹 STEP 5: Observe
                                    Agent reviews:  
                                        “I have the answer now.”
                            
                            🔹 STEP 6: Final Response
                                    Agent replies:
                                        “Your order has been shipped and will arrive tomorrow.”
                                        
                        ReAct Agent — IMPLEMENTATION:
                            🔹 When to Use
                                    Customer support
                                    IT helpdesk
                                    Operations
                                    Unknown step sequence
                            from langchain.agents import create_react_agent
                            from langchain.prompts import ChatPromptTemplate
                            from langchain.agents import AgentExecutor
                        
                            📌 Agents decide:
                                Decide when to call tools
                                Decide which tool to call
                                Decide when to stop
                                Handle unknown user inputs
                            
                            1) Define Tools:
                                @tool
                                def get_order_status(order_id: str) -> str:
                                    return f"Order {order_id} is shipped and will arrive tomorrow."
                                📌 Enterprise rule: Agent can only use tools you define.
                           
                            2) Create ReAct Prompt:
                                prompt = ChatPromptTemplate.from_messages([
                                    ("system", "You are a customer support agent."),
                                    ("human", "{input}"),
                                    ("assistant", "{agent_scratchpad}")
                                ])
                
                            3) Create ReAct Agent:
                                tools = [get_order_status]

                                agent = create_react_agent(
                                    llm=llm,
                                    tools=tools,
                                    prompt=prompt
                                )
                            4) Wrap with AgentExecutor:
                            
                                agent_executor = AgentExecutor(
                                    agent=agent,
                                    tools=tools,
                                    verbose=True
                                )
                                                
                            5) Run the Agent:
                                agent_executor.invoke({
                                    "input": "Where is my order 12345?"
                                })
                                
                        🔁 Runtime Flow (Explain This Verbally)
                            Agent reads question
                            Thinks: I need order data
                            Calls get_order_status
                            Observes result
                            Responds to user
                            ✅ ReAct loop happens automatically
                                            
                
                
                
