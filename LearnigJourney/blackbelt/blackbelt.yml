Which is NOT a core question Black Belts and account leaders should aim to answer during impact tracking?:
 "Are the tools chosen readily available?"
 Here's why:
 Core questions for impact tracking focus on:
 "Are engineers using the tool?" ✓ - Measures adoption
 "Are engineers seeing some gains?" ✓ - Measures effectiveness and value realization
 "Are engineers satisfied using the tool?" ✓ - Measures user satisfaction and sustainability
 These three questions directly measure the impact of the GenAI intervention: adoption, outcomes, and satisfaction.
 "Are the tools chosen readily available?" is NOT a core impact tracking question because:
 This is a pre-implementation consideration, not an impact measurement
 Tool availability should be addressed during the planning and selection phase
 Impact tracking happens after implementation to measure results
 This question doesn't measure the actual business impact or value delivered
 Impact tracking is about measuring outcomes and value realization, not implementation logistics or tool availability. 
 
Select three archetypes for "Ringfencing" from the options, the correct answers are:
 ✅ Timeline compression
 ✅ Redeploying teams to new programs
 ✅ Throughput increase
 Ringfencing in GenAI transformation refers to protecting and capturing the value created by GenAI interventions. The three archetypes represent different ways to "ringfence" or secure the benefits:
 Timeline compression - Completing work faster while maintaining quality, allowing resources to be protected and reallocated
 Redeploying teams to new programs - Taking capacity freed up by GenAI and securing it for new strategic initiatives rather than losing it
 Throughput increase - Delivering more with the same resources, ensuring the productivity gains are captured
 "Technical upskilling of developers" is NOT a ringfencing archetype because:
 It's an enablement or capability-building activity
 It doesn't directly represent a way to capture and protect value
 It's more of a preparatory or supporting activity rather than a value capture mechanism
 Ringfencing is about ensuring the benefits of GenAI adoption translate into tangible business outcomes that are protected and reinvested strategically.
 
 
