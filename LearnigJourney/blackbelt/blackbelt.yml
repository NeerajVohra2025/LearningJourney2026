 Account shortlisted as per selection criteria - Initial phase: selecting the right accounts
 Value Stream Mapping completed - Discovery phase: mapping processes and identifying opportunities
 Solution built/trainings completed - Implementation phase: building solutions and enabling teams
 Execute and ring-fence at scale - FINAL phase: scaling the transformation and protecting the value
