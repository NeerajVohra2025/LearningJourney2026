                Robustness
                Accountability
    👉 If all six aren’t present → answer is incomplete.
    
    👉 Any question with bias, fairness, explainability, hallucination → Governance metrics
    
    🚨 Common exam traps from this slide
        ❌ “High accuracy means AI is successful”
        ✅ No — adoption + business metrics must improve
        
        ❌ “Governance metrics are optional”
        ✅ Wrong — mandatory under ISO 42001
        
        ❌ “Service metrics = model metrics”
        ✅ No — service is system-level, model is algorithm-level
        
        ❌ “Bias is a model accuracy issue”
        ✅ No — bias = governance
        
        ❌ “Factual correctness is only technical”
        ✅ No — hallucination = RAI risk
        
        ❌ “Natural language response = adoption”
        ✅ No — capability ≠ adoption
        
    🧠 One-line memory trick
            Accuracy & behavior → Technical
            Ethics & harm → Governance    
        
        
    📌 Exam trap:
        This is NOT adoption — it’s capability, not usage.   
    📌 Any mention of hallucination → governance alarm bell  

