    GenAI adoption starts with capability, use-case clarity, and risk assessment.     
    🧠 Key distinction:
        Explainability → individual predictions
        Interpretability → overall model behavior   

    📌 Rule:
        Bias issue ⇒ Fairness + Traceability first   
    📌 Rule:
        Availability failure ⇒ Reliability first   

    🎯 One-line exam mantra
        Bias → Fairness | Failure → Reliability | No explanation → Transparency | Attacks → Robustness   

    📌 Rule:
        RAG on existing app = EXTEND
        
    ✅ EXTEND; you fine-tune/augment an existing AI with LLM-RAG
    ✅ Stakeholders, Data Quality, Compliance, Initiation & Systemic AI changes
    ✅ Re-evaluation / Continuous validation; Evaluation Report with documented risks
    🎯 Final ultra-short memory map
        RAG added → EXTEND
        User impact → SIA
        Continuous learning → Re-evaluation + Evaluation report    
        If it’s Responsible AI principles → ALWAYS include Inclusiveness
    👉 Inclusiveness ≠ Fairness    
        Inclusiveness →
            Works across diverse user groups
            Accessible
            Does not exclude populations due to language, disability, demographics, or digital divide  

