    🎯 How This Appears in MCQs
            Model performs well but users complain of unfair outcomes
            ✔️ Answer: Fairness & Bias metrics

            LLM answers harmful questions inconsistently
            ✔️ Answer: Refuse-to-Answer rate, Robustness testing

            Auditor asks “why was this decision made?”
            ✔️ Answer: SHAP / LIME / Explainability metrics        
    
    ⭐ Demographic Parity:
        (Fairness metric)
            🔍 What it measures
                Ratio of selection rates across groups
                Ensures outcomes are not skewed toward one demographic
                Smallest selection rate ÷ Largest selection rate
            👥 Groups considered
                Gender
                Race
                Age
            Location (if sensitive)
        📌 When you use it
                Hiring
                Loan approvals
                Eligibility / screening systems
        📝 Exam cue
                “Approval rate is lower for one district”
                ✅ Answer: Check Demographic Parity
                
    ⭐ Equalized Odds (Ratio / Difference):
            (Advanced Fairness metric)
            🔍 What it measures
                Whether True Positive Rate (TPR) and False Positive Rate (FPR)
                are equal across groups
            🧠 Key distinction    
                | Metric             | Focus            |
                | ------------------ | ---------------- |
                | Demographic Parity | Outcome equality |
                | Equalized Odds     | Error equality   |
            
            📌 When you use it
                Credit scoring
                Medical diagnosis
        📝 Exam cue
                “Model rejects qualified candidates from one group more often”
                ✅ Answer: Equalized Odds issue
                
    ⭐ Feature Importance Score (SHAP / LIME):
            (Explainability & Interpretability)
            🔍 What it measures
                   Which inputs influenced the decision
                    How much each feature contributed
            🛠️ Tools
                SHAP → global + local explanations
                LIME → local explanations
            📌 When you use it
                Regulatory explanations
                Debugging bias
                Customer decision transparency

            📝 Exam cue
            “Customer asks why they were rejected”
            ✅ Answer: SHAP / LIME    
            
    ⭐ RtA – Refuse to Answer:
            (Safety & Robustness for LLMs)
                🔍 What it measures
                    Whether the model declines unsafe, unethical, or prohibited queries
                    ⚠️ Important insight
                    Higher RtA is GOOD when questions are unsafe
                📌 When you use it
                    Chatbots
                    Copilots
                    GenAI assistants
                📝 Exam cue
                    “Model answered a harmful question”
                    ✅ Answer: RtA failure    
                
    ⭐ Toxicity Score:
            (Safety & Content Moderation)
                🔍 What it measures
                    Presence of:
                    Hate speech
                    Harassment
                    Abusive language
                📌 When you use it
                    Public-facing LLMs
                    Customer support bots
                    Social content generation
                📝 Exam cue
                        “Model responses are offensive”
                        ✅ Answer: Toxicity score issue  

    ⭐ Robustness Score:  
            (Security & Reliability):
                🔍 What it measures
                    Resistance to:
                    Adversarial inputs
                    Prompt injection
                    Environmental changes
                📌 When you use it
                    Image classifiers
                    Security-sensitive systems
                    Autonomous agents
                📝 Exam cue
                    “Model fails under poor lighting”
                    ✅ Answer: Low robustness score 

    ⭐ Hallucination Rate:
            (Truthfulness / Factuality for LLMs)
            🔍 What it measures
                % of responses that contain factually incorrect information
            📌 When you use it
                RAG systems
                Knowledge assistants
                Enterprise Q&A bots
            📝 Exam cue
                “Model confidently gives wrong facts”
                ✅ Answer: High hallucination rate    
                
