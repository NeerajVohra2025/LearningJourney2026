✅ Large Language Models (LLMs) – Interview Questions with Answers 🤖🧠

⿡ What is a language model?  
Answer:  
A language model predicts the next word in a sequence based on previous context. It’s trained on large datasets to understand and generate human-like text.

⿢ How does GPT differ from BERT?  
Answer:  
- GPT (Generative Pretrained Transformer): Unidirectional, autoregressive, designed for text generation.  
- BERT (Bidirectional Encoder Representations from Transformers): Bidirectional, designed for understanding tasks like classification or question answering.

⿣ What is prompt engineering?  
Answer:  
It’s the practice of crafting effective prompts to get desired outputs from LLMs. Techniques include:  
- Clear instructions  
- Providing examples (few-shot)  
- Using system messages for context

⿤ Explain zero-shot, few-shot, and fine-tuning.  
Answer:  
- Zero-shot: Model performs a task without examples.  
- Few-shot: Task is guided by a few examples.  
- Fine-tuning: Model is retrained on task-specific data for better performance.

⿥ What is tokenization?  
Answer:  
Tokenization breaks text into smaller units (tokens) like words or subwords. LLMs process these tokens numerically.

⿦ What is the attention mechanism?  
Answer:  
Attention allows the model to weigh the importance of each token relative to others in a sequence. Key part of how transformers capture context.

⿧ How does positional encoding work in transformers?  
Answer:  
Since transformers don't process sequences in order, positional encoding adds information about token positions so the model can learn word order.

⿨ What is cross-entropy loss in LLMs?  
Answer:  
It measures the difference between predicted and actual word distributions. Lower loss = better predictions.
