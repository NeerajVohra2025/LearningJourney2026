Statistics & Probability Cheatsheet for Data Science 📚🧠  

Master these formulas & concepts for analytics, ML & interviews:

📌 Descriptive Statistics  
* Mean = (Σx) / n  
* Median = Middle value  
* Mode = Most frequent value  
* Variance (σ²) = Σ(x - μ)² / n  
* Standard Deviation (σ) = √Variance  
* Range = Max - Min  
* IQR = Q3 - Q1

📌 Probability Basics  
* P(A) = Outcomes A / Total Outcomes  
* P(A ∩ B) = P(A) × P(B) (if independent)  
* P(A ∪ B) = P(A) + P(B) - P(A ∩ B)  
* Conditional: P(A|B) = P(A ∩ B) / P(B)  
* Bayes’ Theorem:  
  P(A|B) = [P(B|A) × P(A)] / P(B)

📌 Common Distributions  
* Binomial: Discrete, fixed trials  
* Normal: Bell curve  
* Poisson: Rare events over time  
* Uniform: Equal probability  

📌 Inferential Stats  
* Z-score: (x - μ) / σ  
* Central Limit Theorem: Sampling dist ≈ Normal  
* Confidence Interval (CI):  
  CI = x̄ ± z*(σ/√n)

📌 Hypothesis Testing  
* H₀ = No effect, H₁ = Effect  
* p-value < α → Reject H₀  
* Tests:  
  – t-test: small samples  
  – z-test: known std dev  
  – chi-square: categorical data  

📌 Correlation  
* Pearson: Linear relationship (–1 to 1)  
* Spearman: Rank-based correlation  

🧪 Tools to Practice
* Python: scipy.stats, statsmodels, pandas  
* Visuals: seaborn, matplotlib
