✅ Decision Tree: Code Implementation using Python 🌳💻

🔸 Problem Statement:  
We want to classify whether a person will buy a product based on their age and income using a Decision Tree Classifier.

🔹 Sample Data:  
| Age | Income | Buy |  
|-----|--------|-----|  
| 22  | Low    | No  |  
| 25  | Medium | Yes |  
| 47  | High   | Yes |  
| 52  | Medium | No  |  
| 46  | Low    | No  |  
| 56  | High   | Yes |

🔹 Python Code:  
 
import pandas as pd  
from sklearn.tree import DecisionTreeClassifier  
from sklearn.preprocessing import LabelEncoder  

data = {'Age': [22, 25, 47, 52, 46, 56],  
        'Income': ['Low', 'Medium', 'High', 'Medium', 'Low', 'High'],  
        'Buy': ['No', 'Yes', 'Yes', 'No', 'No', 'Yes']}  

df = pd.DataFrame(data)

# Encode categorical variables
le_income = LabelEncoder()  
df['Income'] = le_income.fit_transform(df['Income'])  
le_buy = LabelEncoder()  
df['Buy'] = le_buy.fit_transform(df['Buy'])

X = df[['Age', 'Income']]  
y = df['Buy']

model = DecisionTreeClassifier()  
model.fit(X, y)

pred = model.predict([[30, le_income.transform(['Medium'])[0]]])  
print("Buy prediction:", le_buy.inverse_transform(pred)[0])


🔹 Output:  
Prediction → Yes or No depending on input

💡 Pro Tip: Try plot_tree() from sklearn.tree for visualizing the decision tree.

📚 Use Cases: Customer behavior, medical diagnoses, loan approvals, etc.
