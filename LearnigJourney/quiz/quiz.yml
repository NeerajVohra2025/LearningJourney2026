✅ Everything You Need to Know About Support Vector Machine (SVM) 🧠📈

🔹 What is SVM?  
SVM is a supervised machine learning algorithm used for classification and regression. It finds the optimal hyperplane that best separates classes in a dataset.

🔹 How It Works:  
- Finds a decision boundary (hyperplane) that maximizes the margin between different classes  
- Supports both linear and non-linear classification using kernel tricks

🔹 Why It’s Powerful:  
✅ Effective in high-dimensional spaces  
✅ Works well for clear margin of separation  
✅ Memory efficient (only uses support vectors)  
✅ Can model non-linear boundaries with kernels

🔹 Key Concepts:  
- Support Vectors: Data points closest to the hyperplane  
- Hyperplane: Decision boundary that separates classes  
- Margin: Distance between support vectors and hyperplane  
- Kernel Trick: Projects data into higher dimensions for better separation (RBF, Polynomial, Sigmoid)

🔹 Hyperparameters to Tune:  
- C – Regularization (trade-off between margin size and classification error)  
- kernel – Linear, RBF, Poly, etc.  
- gamma – Defines influence of a single training example (for RBF kernel)  
- degree – Degree of polynomial (for poly kernel)

🔹 Performance Metrics:
- Accuracy, Precision, Recall, F1 Score, ROC-AUC

🔹 When to Use It?  
- For binary or multi-class classification  
- When the data is not too large  
- When the margin between classes is clear

🔹 Tools & Libraries:  
- Python: sklearn.svm.SVC, sklearn.svm.SVR  
- R: e1071::svm

