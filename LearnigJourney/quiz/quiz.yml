✅ Exploratory Data Analysis (EDA) – Interview Questions with Answers 📊🔍

⿡ What is EDA?  
Answer: Exploratory Data Analysis is the process of analyzing datasets to summarize their main characteristics using visual and statistical techniques.

⿢ Why is EDA important?  
Answer: It helps detect errors, understand patterns, discover relationships, and form hypotheses for modeling.

⿣ What are summary statistics?  
Answer: Measures like mean, median, mode, min, max, std deviation that describe the central tendency and dispersion of data.

⿤ What types of plots are used in EDA?  
Answer:  
- Bar plot: For categorical variables  
- Histogram: For distribution of continuous data  
- Box plot: For outlier detection  
- Scatter plot: To explore relationships between two numerical features  
- Heatmap: To visualize correlation

⿥ What is the difference between correlation and causation?  
Answer:  
- Correlation: Measures association between variables  
- Causation: Implies one variable causes change in another (not always implied by correlation)

⿦ How do you handle outliers during EDA?  
Answer:  
- Detect using box plots, z-scores, or IQR  
- Handle by capping, transformation, or removing depending on context

⿧ What is univariate vs multivariate analysis?  
Answer:  
- Univariate: Analyzing one variable at a time  
- Multivariate: Analyzing relationships between multiple variables

⿨ What are pairplots used for?  
Answer: Pairplots (like in Seaborn) show scatter plots for all numerical features against each other and help spot correlations and patterns.

⿩ How do you check for missing data?  
Answer:  
- Use df.isnull().sum() in Pandas  
- Visualize using heatmaps (Seaborn) or bar charts

🔟 How do you choose which visualizations to use in EDA?  
Answer: Depends on data type:  
- Categorical: bar charts, pie charts  
- Continuous: histograms, boxplots, KDE  
- Bivariate: scatter plots, correlation matrix

