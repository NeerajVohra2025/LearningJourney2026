🧠 AI Dev | AMS Lifecycle — Plan & Monitor
            “Once AI is approved (risk, SIA, RAI), how do we run, monitor, and improve it in production?”
            Think of it as AI = Software + Operations + Governance + People. 
                Overall structure:
                    The lifecycle is split into three pillars:
                        Life Cycle Execution → Build & run AI
                        Performance Management → Measure & control AI
                        AI-Specific Enablement → People, skills & adoption
                        All three must exist — missing one = AI failure.
                Pillar 1: Life Cycle Execution
                        This is how AI is engineered and operated.
                        🔹 AI in CI/CD | Service Architecture
                            AI models are deployed like software
                        Pipelines for:
                            Model updates
                            Prompt updates
                            RAG data refresh
                        👉 MLOps / LLMOps  
            
                        🔹 AI Life Cycle Model
                            Follows the lifecycle you saw earlier:
                            POC → Design → Deploy → Monitor → Retire
                        
                        🔹 AI Risk Assessment
                            Continuous risk reviews
                            Triggered by:
                                New data
                                Model changes
                                Increased autonomy    
                            
                        🔹 Capacity | Availability | Transition    
                            Ensure:
                                Compute availability
                                Scalability
                                Failover readiness     
                        
                        🔹 Data | Change Management   
                            Control:
                                Data updates
                                Schema changes
                                Vector DB refreshes
                            📌 This block = “AI as a production system”                        
                                                                                                        
                Pillar 2: Performance Management
                        This is how leadership controls AI.
                        🔹 Goals & Objectives
                                Why does this AI exist?
                                What success looks like?
                            Example:
                                Reduce support tickets by 30%
                                Improve response accuracy to 95%
                        
                        🔹 AI Metrics Selection   
                                Metrics go beyond accuracy:
                                Quality (hallucination rate)
                                Safety (toxic output rate)
                                Latency
                                Cost per request
                                User satisfaction   
                        
                        🔹 AI Infrastructure, Environment & Resources        
                                Monitor:
                                    Cloud cost
                                    GPU usage
                                    API limits
                                    
