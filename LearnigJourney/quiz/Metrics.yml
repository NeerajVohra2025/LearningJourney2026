        What is System Impact Assessment (SIA)?:
            System Impact Assessment is done to understand:
                Who will be affected by this AI system, how, and how badly — before and after deployment.
            It goes beyond technical risk and looks at:
                Humans
                Society
                Business
                Ethics
                Compliance

            📌 Think of SIA as “AI due diligence”
        
        What SIA assesses:
        
        🔹 “Assess AI impact on:”
                Stakeholders (users, employees, customers)
                Society (bias, discrimination, misinformation)
                Business (brand, trust, legal exposure)
                
        🔹 Impacted AI System & Key RAI Principles (Values)

        This connects directly to the Responsible AI pillars you saw earlier:
            Fairness
            Accountability
            Privacy
            Safety
            Explainability
            Reliability
        👉 SIA checks whether these values are at risk      

Key components of System Impact Assessment:
        ✅ 1. AI Objectives & Stakeholders
                Ask:
                    Why are we building this AI?
                    Who benefits?
                    Who could be harmed?
                Example:
                    Customer support bot → customers, agents, compliance team
                    
        ✅ 2. Risk Analysis
                Ask:
                    What unintended outcomes are possible?
                    What happens if the AI fails or hallucinates?
                Example:
                    Wrong financial advice
                    Biased hiring recommendations      

        ✅ 3. Data Quality Assessment
                Ask:
                    Is the data accurate, representative, up-to-date?
                    Any missing or skewed data?
                Example:
                    Historical hiring data biased against certain groups    

        ✅ 4. Compliance Check
                Ask:
                    Does this violate regulations?
                    GDPR, EU AI Act, internal policies?
                Example:
                    Using PII without consent   

        ✅ 5. Impact Analysis
                Ask:
                    Severity of harm if things go wrong?
                    Individual vs societal impact?
                Example:
                    One wrong answer vs systemic discrimination     

        ✅ 6. Governance
                Ask:
                    Who approves?
                    Who monitors?
                    Who shuts it down if needed?
                Example:
                    AI review board approval required    

        🧩 End-to-end view How SIA fits     
                    | Stage                        | What it answers                   |
                    | ---------------------------- | --------------------------------- |
                    | Deployment Model             | How are we building AI?           |
                    | Autonomy Level               | How much freedom does AI have?    |
                    | Risk Assessment              | What can go wrong?                |
                    | **System Impact Assessment** | **Who is affected and how?**      |
                    | RAI Checks                   | Are values enforced continuously? |
                            
            “System Impact Assessment evaluates how an AI system affects individuals, society, and business, ensuring ethical, compliant, and responsible deployment beyond technical risk.” 

                        O → R → D → C → I → G
