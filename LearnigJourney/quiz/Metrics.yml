 🧠 DBS AI QMS – Development Lifecycle
            (QMS = Quality Management System)
            This slide answers one key question:
            “How do we build AI systems in a controlled, repeatable, and compliant way?”       
        Think of it as SDLC + MLOps + Responsible AI.:  

1️⃣ POC (Proof of Concept) – Should we even do this?

Purpose: Validate feasibility with minimum risk.

What happens here:

Define objectives

Due diligence & RACI (who owns what)

Identify AI use case

Define success criteria

Run initial training

Pilot implementation

📌 Key idea:
👉 No governance-heavy deployment yet — just learning.

2️⃣ Requirements – What exactly are we building?

Purpose: Lock down scope + responsibility.

Activities:

Business & AI objectives

Functional & non-functional requirements

Risk assessment

Risk treatment plan

Policies & compliance (privacy, ethics, security)

📌 Key idea:
👉 AI risks are identified BEFORE design.

3️⃣ Design / Technical Solution – How will it work?

Purpose: Architecture + controls.

Activities:

System architecture

Sequence diagrams

Training & validation data strategy

Risk treatment implementation

Examples:

RAG vs fine-tuning

Human-in-the-loop

Guardrails & thresholds

📌 Key idea:
👉 Design choices directly affect risk & autonomy.

4️⃣ Development – Build the AI

Purpose: Implementation with controls.

Activities:

Code

Unit testing

Training & validation data usage

Ongoing risk monitoring & review

📌 Key idea:
👉 Risk doesn’t stop once coding starts.

5️⃣ Verification & Validation – Does it really work safely?

Purpose: Prove correctness, safety, and performance.

Activities:

Test data preparation

Integration testing

Performance testing

User Acceptance Testing (UAT)

Risk monitoring & review

📌 Key idea:
👉 AI must be validated technically AND ethically.

6️⃣ Deployment – Release to production

Purpose: Controlled go-live.

Activities:

Runtime deployment

Deployment risk treatment

Approval gates

📌 Key idea:
👉 Deployment is a risk event, not a formality.

7️⃣ Operation & Monitoring – Run AI in the real world

Purpose: Keep AI safe and effective.

Activities:

Live data input monitoring

Model execution tracking

Model updates

Risk management

Examples:

Drift detection

Hallucination monitoring

Cost & latency tracking

📌 Key idea:
👉 AI behavior changes over time — monitor continuously.   

