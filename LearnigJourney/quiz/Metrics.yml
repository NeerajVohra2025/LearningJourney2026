                Pillar 3: AI-Specific Enablement
                    This is about people and adoption, often ignored — but critical.
                    
                        🔹 AI Agency Setup
                                Define:
                                    Who owns AI?
                                    Who approves changes?
                                    Who responds to incidents?
                                    
                                    
                        🔹 AI Capability | Skills
                                Upskill:
                                    Engineers
                                    Product owners
                                    Risk teams      

                        🔹 AI Awareness
                                Train users on:
                                    Limitations
                                    Safe usage
                                    Escalation paths      
                        🔹 AI Customer Collaboration
                                Feedback from:
                                    End users
