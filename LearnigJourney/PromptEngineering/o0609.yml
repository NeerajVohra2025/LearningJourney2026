A well-crafted prompt should have the following features:

1. **Specificity**: Clearly define what you want to know or achieve.
2. **Clarity**: Avoid ambiguity and ensure the prompt is easy to understand.
3. **Context**: Provide relevant background information or context to help the respondent understand the user's needs.
4. **Scope**: Define the level of detail or scope of the information required.
5. **Relevance**: Ensure the prompt is relevant to the topic or domain.
6. **Unambiguous language**: Use simple, concise language to avoid confusion. 


