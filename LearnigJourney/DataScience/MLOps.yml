Roles of People in the world of AI:
There are 3 important roles People having in AI field

Data Engineer:
Responsible for the infrastructure that ensures data is stored and available for data scientists.
They build the systems that ingest raw data from various sources and store it in a centralized data lake. Data engineers often also build other data warehouses that derive data from the data lake but transform it so that it is more useful for the end user; for example, image data might be resized and reformatted so that data scientists can focus on data analysis rather than data manipulation.

Data Scientist:
Generally, they are deployed first to analyze existing data and to find patterns that could be used to solve underlying business problems.

ML Engineer:
They take those concepts and build them into a production-scale system. As the title implies, ML engineers understand the theoretical side of machine learning but are more involved with paradigms found in engineering such as continuous integration (CI) and continuous delivery (CD). They tackle automating and scaling model training, testing models before deployment and deploying and monitoring models in production.

