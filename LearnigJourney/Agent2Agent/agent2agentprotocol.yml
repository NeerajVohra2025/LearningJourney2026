Interview Questions
Q1. What is an Artifact in A2A?:

An Artifact is a business output produced while executing a Task. Examples include reports, PDFs, spreadsheets, images, source code, and structured datasets.

Q2. What is the difference between a Message and an Artifact?
| Message                            | Artifact                                 |
| ---------------------------------- | ---------------------------------------- |
| Communicates status or information | Contains the actual business deliverable |
| Usually text or structured updates | Can be any output format                 |
| Used during execution              | Produced as the result of execution      |

Q3. Can one Task create multiple Artifacts?:

Yes.

A single Task may generate several deliverables, such as a PDF report, an Excel workbook, and a PowerPoint presentation.


Q4. Is every uploaded file an Artifact?:

No.

Files supplied by the user are inputs to the Task. Artifacts are outputs created by the agent while completing the Task.

