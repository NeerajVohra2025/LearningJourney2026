Step 17 – Responsibilities of an Agent:

An enterprise AI Agent is responsible for:
| Responsibility      | Description                                          |
| ------------------- | ---------------------------------------------------- |
| Goal Understanding  | Interpret the user's objective.                      |
| Planning            | Decide the sequence of actions.                      |
| Tool Usage          | Invoke APIs, databases, or MCP tools.                |
| Collaboration       | Delegate work to other agents using A2A when needed. |
| Memory              | Maintain conversation or task state if required.     |
| Reasoning           | Evaluate information and make decisions.             |
| Response Generation | Produce the final answer for the user.               |

The LLM assists with reasoning and language generation, but the agent orchestrates the overall workflow


