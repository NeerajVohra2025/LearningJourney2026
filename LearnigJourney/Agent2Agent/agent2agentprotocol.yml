Interview Questions
Q1. Why do we need A2A if we already have MCP?:

Answer: MCP standardizes communication between an AI agent and external tools or data sources. A2A standardizes communication between autonomous AI agents. They solve different problems and are often used together.

Q2. Why can not agents just use REST APIs?:

They can, but REST doesn't define concepts such as agent discovery, capabilities, long-running tasks, artifacts, or standardized agent collaboration. A2A adds these protocol-level semantics.


Q3. Does A2A replace LangGraph or OpenAI Agent SDK?:

No.

Frameworks help you build agents.

A2A helps independently built agents communicate with each other

