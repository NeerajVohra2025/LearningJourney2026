Step 20 – Interview Questions:
Q1. What is a Skill in A2A?:

Answer:

A Skill is a business capability that an agent exposes to other agents. It describes what the agent can do, not how it does it.


Q2. What is the difference between a Skill and an MCP Tool?:

| Skill                     | MCP Tool                               |
| ------------------------- | -------------------------------------- |
| Business capability       | Technical operation                    |
| Visible to other agents   | Used internally by an agent            |
| Exposed in the Agent Card | Exposed by an MCP Server               |
| Example: "Approve Budget" | Example: `get_budget()`, `query_sap()` |


Q3. Can one Skill use multiple MCP Tools?:

Yes.

A single Skill may invoke many MCP tools, REST APIs, databases, or LLM calls. The client only sees the Skill, while the implementation remains hidden.


Q4. Why not expose Tools instead of Skills?:

Because clients should depend on stable business capabilities, not internal implementation details. This keeps agents loosely coupled and allows implementations to evolve without breaking clients.
