| Communication       | Exchange information between agents. |
| Progress updates    | Inform clients about execution.      |
| Human-readable text | Explain what is happening.           |
| Structured data     | Carry machine-readable content.      |
| References          | Point to generated artifacts.        |


Interview Questions:
Q1. Why doesn't A2A simply return one response?:

Because many AI tasks are long-running and interactive. Messages allow agents to communicate progress, request input, and deliver intermediate and final information during the lifetime of a Task.


Q2. Can one Task contain multiple Messages?:

Yes.

A Task represents the work, while Messages represent the conversation about that work. A single Task can generate many Messages over its lifetime.


Q3. What is the difference between a Message and an Artifact?
| Message                    | Artifact                      |
| -------------------------- | ----------------------------- |
| Communication              | Output produced by the task   |
| Text or structured updates | PDF, CSV, image, report, etc. |
| Explains what happened     | Contains the deliverable      |


Example:

Message:
"Budget approval completed. Please review the attached report."

Artifact:
BudgetApprovalReport.pdf


Q4. Who creates Messages?:

The Executor inside the executing agent. As the Task progresses, the Executor generates Messages that are sent back to the requesting agent.
###
An Artifact is actually the business output produced by executing a Task.

Think of it this way:

Task = The work
Executor = Performs the work
Messages = Communication during the work
Artifacts = The deliverables produced by the work

