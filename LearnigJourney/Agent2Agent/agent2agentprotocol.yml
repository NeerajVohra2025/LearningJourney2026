# Enterprise A2A using Python

# Chapter 3 – Executor (The Brain of the Agent)

Now our Finance Agent starts becoming **intelligent**.

So far we have built:

```text
Agent Card
      │
      ▼
Skills
      │
      ▼
Task Manager
```

The Task Manager can create a Task, but it **cannot execute** it.

Now we'll build the **Executor**, which is responsible for performing the actual business work.

---

# Step 1 – What is an Executor?

The Executor is the runtime engine that executes a Task.

Think of it as the employee inside the Finance department.

For every Task, the Executor will:

```text
Receive Task
      │
      ▼
Read Skill
      │
      ▼
Execute Business Logic
      │
      ▼
Update Task State
      │
      ▼
Generate Messages
      │
      ▼
Generate Artifacts
      │
      ▼
Complete Task
```

Notice that the Executor **does not create Tasks**.

That responsibility belongs to the Task Manager.

---

# Step 2 – Runtime Architecture

```text
Travel Agent

      │

Create Task

      ▼

Task Manager

      │

Create Task

      ▼

Executor

      │

Business Logic

      │

LLM

      │

MCP Tools

      │

Artifacts

      ▼

Completed
```

---

# Step 3 – Responsibilities of the Executor

The Executor should only perform execution.

It should **not**:

* Create Agent Card
* Register Skills
* Start HTTP Server
* Manage Task storage

Its responsibilities are:

* Read Task
* Execute Skill
* Call LLM
* Call MCP Tools
* Update Task State
* Produce Messages
* Produce Artifacts

---

# Step 4 – Create executor.py

Location

```text
src/
└── a2a_demo/
    └── finance_agent/
        └── executor.py
```

---

# Step 5 – Imports

Initially our Executor depends on only two components.

```python
from .task_manager import TaskManager
from .models import TaskState
```

Later we will also import

```python
MCP Client

OpenAI Agent SDK

LangGraph

Ollama
```

---

# Step 6 – Create Executor Class

```python
class Executor:

    def __init__(self, task_manager: TaskManager):

        self.task_manager = task_manager
```

Notice

The Executor receives the Task Manager through dependency injection.

It does **not** create it itself.

---

# Step 7 – Why Dependency Injection?

Bad Design

```python
Executor()

↓

Creates TaskManager()
```

Good Design

```python
TaskManager

↓

Executor(TaskManager)
```

Benefits:

* Loose coupling
* Easier testing
* Replace Task Manager later without changing Executor

---

# Step 8 – Execute Method

The main responsibility of the Executor is executing a Task.

Conceptually

```python
execute(task_id)
```

Internally it performs

```text
Find Task

↓

Update State

↓

Execute Skill

↓

Generate Result

↓

Completed
```

---

# Step 9 – Runtime Flow

Suppose the Task is

```text
Approve Budget
```

The Executor performs

```text
Read Task

↓

Update State → Working

↓

Execute Business Logic

↓

Generate Approval

↓

Update State → Completed
```

---

# Step 10 – First Version (Without LLM)

Initially we'll simulate business logic.

```text
Approve Budget

↓

Wait

↓

Return Approved
```

Later this simulation will be replaced by:

* Ollama
* OpenAI
* LangGraph
* MCP Tool Calls

---

# Step 11 – Future Architecture

Eventually the Executor will orchestrate many systems.

```text
Executor

├── Ollama

├── MCP Client

├── REST API

├── Database

├── Another A2A Agent

└── Artifact Generator
```

The Executor becomes the orchestration engine.

---

# Step 12 – Why Doesn't the Task Execute Itself?

A Task is only a data object.

Think of a printed work order.

The paper doesn't perform the work.

An employee reads it and executes it.

Similarly

```text
Task

↓

Executor

↓

Execution
```

---

# Step 13 – Executor vs Task Manager

| Task Manager      | Executor                |
| ----------------- | ----------------------- |
| Creates Tasks     | Executes Tasks          |
| Stores Tasks      | Reads Tasks             |
| Updates lifecycle | Performs business logic |
| Retrieves Tasks   | Calls tools and LLMs    |

Each class has one responsibility.

---

# Step 14 – Executor vs Agent

Many people confuse these.

The Agent represents:

* Identity
* Skills
* Capabilities
* Agent Card

The Executor represents:

* Runtime execution
* Tool invocation
* Reasoning
* Workflow

Think of it like this:

```text
Agent

↓

Who am I?

-----------------------

Executor

↓

What am I doing?
```

---

