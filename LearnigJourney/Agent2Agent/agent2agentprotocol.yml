Interview Questions:
Q1. Why separate the Agent Card from the Executor?:

Because they have different responsibilities.

The Agent Card describes the agent.
The Executor performs the work.

This separation makes the agent easier to maintain and evolve.             


Q2. Where does business logic belong?:

Inside the Executor.

The Agent Card, Skills, and Task Manager are metadata and orchestration. The Executor coordinates LLM reasoning, tool calls, and task execution.

Q3. Why separate Skills and Executor?:

Skills describe what the agent can do.

The Executor defines how those skills are implemented.

This separation allows the implementation to change without changing the public contract.


