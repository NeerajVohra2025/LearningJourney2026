Step 7 – What is an Agent Card?:

Definition

An Agent Card is a machine-readable document that describes an AI agent's identity, capabilities, supported skills, authentication requirements, communication endpoint, and protocol features so that other agents can discover and interact with it.

Think of it as
Identity

+

Capabilities

+

Communication Details

+

Rules


