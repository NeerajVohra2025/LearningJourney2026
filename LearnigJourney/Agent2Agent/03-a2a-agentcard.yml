Step 10 – What Does an Agent Card Contain?:

Conceptually,

an Agent Card answers six questions.
| Question                               | Answer                                |
| -------------------------------------- | ------------------------------------- |
| Who are you?                           | Name, description, provider, version  |
| Where are you?                         | URL / endpoint                        |
| What can you do?                       | Skills                                |
| How should I communicate?              | Supported transports and capabilities |
| How do I authenticate?                 | Authentication requirements           |
| Which protocol version do you support? | A2A version and compatibility         |


