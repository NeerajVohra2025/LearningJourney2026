Step 20 – Interview Questions:
Q1. Why do we need an Agent Card?:

Answer:

The Agent Card allows other agents to discover an agent's identity, capabilities, supported skills, endpoint, authentication requirements, and protocol version before interacting with it. It reduces coupling and enables dynamic discovery.


Q2. Is an Agent Card similar to Swagger/OpenAPI?:

Partially.

Swagger describes HTTP endpoints and request/response schemas.

An Agent Card describes the agent itself—its purpose, skills, capabilities, authentication, and how to communicate with it. It is about agent discovery, not just API documentation.


Q3. Does an Agent Card execute business logic?:

No.

The Agent Card is metadata. It does not process requests or execute tasks. Actual work is performed later by the agent's executor.


Q4. Is the Agent Card mandatory?:

For interoperable A2A systems, yes. Without it, other agents cannot reliably discover what the agent does or how to communicate with it.


