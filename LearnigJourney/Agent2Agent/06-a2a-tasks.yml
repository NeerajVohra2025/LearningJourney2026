Step 13 – Task vs HTTP Request:

This is a favourite interview question.

| HTTP Request         | Task                       |
| -------------------- | -------------------------- |
| Short-lived          | Long-lived                 |
| Ends after response  | Exists until work finishes |
| No lifecycle         | Has multiple states        |
| Stateless            | Has identity and state     |
| No progress tracking | Progress can be tracked    |


