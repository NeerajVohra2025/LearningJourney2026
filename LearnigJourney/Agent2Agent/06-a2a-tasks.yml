Step 19 – Responsibilities of a Task:

A Task is responsible for:
| Responsibility          | Description                                      |
| ----------------------- | ------------------------------------------------ |
| Represent work          | Encapsulates one business request.               |
| Maintain identity       | Has a unique Task ID.                            |
| Track progress          | Moves through lifecycle states.                  |
| Store execution context | Keeps information related to that work item.     |
| Return results          | Produces messages, artifacts, or status updates. |


Step 20 – Interview Questions:
Q1. Why does A2A introduce Tasks instead of simple HTTP requests?:

Answer:

Because AI work is often long-running and asynchronous. Tasks provide identity, lifecycle management, progress tracking, cancellation, and resumability, which plain HTTP request/response does not.


Q2. Can multiple Tasks exist in one Session?:

Yes.

A Session represents an ongoing relationship or conversation between agents. Multiple independent Tasks can be created within the same Session.

Q3. What is the difference between a Skill and a Task?:
| Skill                       | Task                              |
| --------------------------- | --------------------------------- |
| Business capability         | Execution of that capability      |
| Published in the Agent Card | Created at runtime                |
| Long-lived metadata         | Temporary runtime object          |
| Example: "Approve Budget"   | "Approve Budget for Employee 123" |

Q4. Does a Task replace the workflow?:

No.

The Task represents the overall unit of work. The internal workflow (planning, tool calls, approvals, LLM reasoning, etc.) is how the agent completes that task.