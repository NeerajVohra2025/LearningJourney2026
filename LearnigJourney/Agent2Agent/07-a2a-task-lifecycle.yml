Step 21 – Complete State Transition Table:
| Current State  | Next Possible State(s)                       |
| -------------- | -------------------------------------------- |
| Submitted      | Working, Failed, Cancelled                   |
| Working        | Input Required, Completed, Failed, Cancelled |
| Input Required | Working, Cancelled, Failed                   |
| Completed      | Terminal (no further transitions)            |
| Failed         | Terminal                                     |
| Cancelled      | Terminal                                     |


