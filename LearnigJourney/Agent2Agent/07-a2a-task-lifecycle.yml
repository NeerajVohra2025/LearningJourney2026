Interview Questions:
Q1. Why does A2A use Task states instead of simple HTTP responses?:

Answer:

Because AI work is often asynchronous and long-running. Task states let clients monitor progress, handle waiting periods (such as human approval), and react appropriately without keeping one HTTP request open.

Q2. Who owns the Task lifecycle?:

The executing agent (the agent that accepted the Task). It is responsible for creating the Task, updating its state, and marking it as completed, failed, or cancelled.


Q3. What is the difference between Working and Input Required?:
Working means the agent is actively processing the task.
Input Required means execution is paused until additional information or approval is received.

Q4. Is Completed the same as returning a result?:

Not exactly.

Completed indicates that execution has finished successfully. The task's outputs—such as messages, artifacts, or structured data—are associated with that completed state.