A Task is like a living object. It has a lifecycle just like a Kubernetes Pod or a Jira ticket.

Think of it like this:

Task = Kubernetes Pod
Task State = Pod Status
Executor = Kubelet
Client = kubectl

The client continuously observes the Task until it reaches a terminal state.

