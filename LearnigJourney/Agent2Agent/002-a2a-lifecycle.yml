Chapter 9 – Tasks:

Everything in A2A revolves around Tasks.

Think of a Task as

"Please perform this work."

          
Example
Task

Book Hotel

Location

London

Date

10 July

Every Task gets

Task ID

Exactly like a support ticket.



Chapter 10 – Transport Layer:

Just as MCP has STDIO and Streamable HTTP,

A2A also has a transport layer.

A2A primarily uses    

HTTPS:

Every communication happens through HTTP endpoints.

Typical endpoints

POST /tasks

GET /tasks/{id}

GET /.well-known/agent.json  

Unlike MCP,:

A2A does not use JSON-RPC.

It uses standard HTTP + JSON contracts.    


