Chapter 12 – Interaction Patterns:

There are four interaction models.

Static:
Question

↓

Answer
Simple.


Polling:
Client

↓

Are you done?

↓

No

↓

Wait

↓

Are you done?

↓

Yes

Like refreshing Uber every few seconds.


Streaming:
Searching...

↓

Comparing Hotels...

↓

Booking...

↓

Completed
Live updates.


Batch:
Task 1

Task 2

Task 3

↓

Process

↓

Return Later

Useful for long-running enterprise jobs.


