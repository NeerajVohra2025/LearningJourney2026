    🐳 STEP 1 — DOCKERFILE (ONE PER AGENT):
            ⚠️ Rule (enterprise standard)
                Each microservice (agent) gets its own Dockerfile, inside its own folder.
                    1️) LangGraph Agent Dockerfile:
                        📄 Path: langgraph_agent/Dockerfile:
                                FROM python:3.13-slim

                                # Set working directory
                                WORKDIR /app

                                # Install uv for faster package management
                                RUN pip install uv

                                # Copy requirements.txt
                                COPY langgraph_agent/requirements.txt .

                                # Install dependencies properly
                                RUN uv pip install -r requirements.txt --verbose --system

                                # Copy source code and project files
                                COPY langgraph_agent/src/ src/
                                COPY langgraph_agent/pyproject.toml .
                                COPY langgraph_agent/README.md .
                                COPY langgraph_agent/agents.toml .
                                # Copy shared to /shared (../shared relative to /app where pyproject.toml is)
                                
                                COPY shared /shared

                                # Install shared package first
                                WORKDIR /shared
                                RUN uv pip install -e . --system

                                # Install the langgraph-agent package so uv run can find the script
                                WORKDIR /app
                                RUN uv pip install -e . --system

                                # Expose port
                                EXPOSE 8001

                                # Run the application
                                # Note: OPENAI_API_KEY should be passed at runtime via -e flag or docker-compose
                                CMD ["uv", "run", "langgraph-agent"]                        



