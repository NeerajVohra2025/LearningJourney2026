Interview Questions
Q1. Is an LLM an AI Agent?:

Answer:

No. An LLM is a language model that predicts the next token. An AI agent is a software system that uses an LLM together with planning, memory, tool usage, and execution to achieve goals.

Q2. Why does A2A communicate with Agents instead of LLMs?:

Because A2A is designed for business workflows. Agents expose capabilities, tasks, progress, authentication, and collaboration interfaces. LLMs only generate text and do not provide these protocol-level features.

Q3. Can an Agent exist without an LLM?:

Yes, depending on the definition. An agent can follow predefined rules or workflows without using an LLM. However, in modern Generative AI systems, an LLM is typically the reasoning component of the agent.

Q4. Can an Agent use both MCP and A2A?:

Yes. This is the recommended enterprise architecture:

MCP for interacting with tools, APIs, databases, and enterprise systems.
A2A for collaborating with other intelligent agents.