Step 4 – What is an Executor?:

Definition

An Executor is the runtime component responsible for executing a Task.:

It

reads the Task
understands the requested Skill
invokes the required tools
communicates with other agents
updates Task status
produces the final result

Think of it as

the

Execution Engine.


