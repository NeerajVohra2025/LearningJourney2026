Step 19 – Responsibilities of an Executor:

An Executor is responsible for:
| Responsibility       | Description                                              |
| -------------------- | -------------------------------------------------------- |
| Read Task            | Understand the requested business operation.             |
| Execute Skill        | Perform the requested business capability.               |
| Coordinate reasoning | Invoke the LLM when reasoning is needed.                 |
| Call tools           | Use MCP tools, REST APIs, databases, or local functions. |
| Collaborate          | Invoke other agents through A2A when appropriate.        |
| Manage lifecycle     | Update Task states and progress.                         |
| Produce outputs      | Return messages, artifacts, and final results.           |

