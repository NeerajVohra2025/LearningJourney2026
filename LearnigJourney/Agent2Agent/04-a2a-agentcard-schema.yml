Step 12 – Responsibilities of Each Field:
| Field              | Purpose                                            |
| ------------------ | -------------------------------------------------- |
| name               | Identifies the agent                               |
| description        | Explains what the agent does                       |
| url                | Where requests should be sent                      |
| version            | Protocol/application compatibility                 |
| provider           | Owner or organization responsible                  |
| authentication     | How clients authenticate                           |
| skills             | Business capabilities exposed by the agent         |
| capabilities       | Protocol features (streaming, notifications, etc.) |
| defaultInputModes  | Supported input formats                            |
| defaultOutputModes | Supported output formats                           |
| documentation      | Developer documentation                            |
| icon               | UI representation                                  |
| tags               | Search and categorization                          |


Interview Questions
Q1. Why is url mandatory?:

Without an endpoint, another agent has no way to communicate with the agent after discovery.

Q2. What is the difference between skills and capabilities?:

This is one of the most important interview questions.

Skills describe business functions.

Examples:

Approve Budget

Book Flight

Generate Invoice

Capabilities describe protocol features.

Examples:

Streaming

Push Notifications

Artifacts

History

Think of it this way:

Chef

↓

Skill

Cook Pizza

---------------------

Capability

Home Delivery

One is what the agent does.

The other is how the agent communicates.



Q3. Why publish authentication in the Agent Card?:

So that clients know which authentication mechanism to use before sending requests, reducing negotiation failures and enabling interoperable communication.

Q4. Are Agent Cards static?:

Usually they change infrequently and can be cached, but they may evolve as an agent gains new skills, changes capabilities, or upgrades protocol versions.
