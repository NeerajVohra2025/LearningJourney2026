Chapter 4 – Agent Card Schema (Every Field Explained):
Step 1 – What is an Agent Card?:

Think of an Agent Card as the metadata describing an AI Agent.

Just like a Java class has
class Employee {

    String name;

    String department;

    String designation;

}

Similarly,

every AI Agent has metadata.
Name

Description

Skills

Capabilities

Authentication

Version

URL

These together form

the Agent Card.


