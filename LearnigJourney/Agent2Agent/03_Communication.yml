        🎯 ONE-LINE MEMORY RULE (VERY IMPORTANT)
                Fast → Static
                Long → Streaming
                Huge → Batch
                Uncertain → Polling
                
                progress updates → Streaming
                overnight processing → Batch
                simple lookup → Static
                checking status repeatedly → Polling   


🧠  WHAT IS /.well-known/agent-card.json?   :
        One-line definition:
            /.well-known/agent-card.json is a public, predictable URL where an agent describes itself.
            It is:
                Not a registry
                Not a marketplace
                Not a search engine

        It is a self-description document.
        
        🏠 SIMPLE ANALOGY (VERY IMPORTANT):
            Imagine a house.
            You already know the address:
            👉 https://planner.mycompany.com
            Now you want to know:
                Who lives there?
                What services they provide?
                How to talk to them?
                So you knock on the front door and read the nameplate.
            That nameplate =
            👉 /.well-known/agent-card.json    


        📍 WHY .well-known?
                .well-known is a global internet convention.
            It means:
                “If you want to learn about this service, look here.”
                So clients don’t guess random URLs.  


        🧩 WHAT PROBLEM agent-card.json SOLVES:     

            Without it:
                Every team invents custom discovery URLs
                Clients must read documentation
                Integration is slow and error-prone

            With it:
                Tools know exactly where to look
                Integration is automated
                Humans and machines can both read it        
                                
        🧱 STEP-BY-STEP FLOW (IMPORTANT)
                Let’s walk through exactly how it’s used.
                STEP 1️) You already know the agent’s domain:
                        Example:
                            https://planner.mycompany.com
                            
                        How you know it:
                            Internal docs
                            Partner onboarding
                            API Gateway
                            Registry (internal)
                        📌 /.well-known does NOT help you find the domain.    
                
                STEP 2️) Client requests the agent card:
                    The client (human or another agent) sends:
                        GET https://planner.mycompany.com/.well-known/agent-card.json
                     No authentication required (usually).
                            
                STEP 3️) Agent returns its Agent Card:
                    The agent responds with structured JSON.
                        🧾 EXAMPLE agent-card.json (REALISTIC)
                                {
                                  "agent_id": "langgraph-planner",
                                  "description": "Planning agent that decomposes tasks into steps",
                                  "version": "1.0.0",

                                  "skills": [
                                    {
                                      "name": "plan",
                                      "description": "Create an execution plan from a task",
                                      "input_schema": {
                                        "task": "string"
                                      },
                                      "output_schema": {
                                        "plan": "string"
                                      }
                                    }
                                  ],

                                  "a2a": {
                                    "endpoint": "/a2a",
                                    "methods": ["POST"]
                                  },

                                  "authentication": {
                                    "type": "bearer",
                                    "description": "Requires service-to-service token"
                                  },

                                  "owner": {
                                    "team": "planning-team",
                                    "email": "planning@mycompany.com"
                                  }
                                }
                    🧠 WHAT EACH PART MEANS (PLAIN LANGUAGE):
                            agent_id:
                                Unique name of the agent.
                            skills:
                                What the agent can do.
                                Each skill clearly says:
                                    Name
                                    What input it expects
                                    What output it returns
                                No guessing.  

                            owner:
                                Who owns the agent.
                                Critical for:
                                    Support
                                    Governance
                                    Security reviews
                                    
                            🔐 WHY agent-card.json IS SAFE TO BE PUBLIC:
                                Important point.
                                    It exposes:
                                        Capabilities
                                        Contract
                                        Auth method

                                    It does NOT expose:
                                        Secrets
                                        Tokens
                                        Credentials
                                        Internal logic
                                    This is the same model as:
                                        OpenAPI specs
                                        OAuth discovery docs   

        🧠 PRINCIPAL ARCHITECT TAKEAWAY (MEMORIZE THIS):
                    /.well-known/agent-card.json does NOT make agents discoverable.:
                            It makes agents understandable.
                            Discovery happens elsewhere.
                            Execution happens elsewhere.
                            This file bridges the two.                                    

                                                    