Step 17 – Responsibilities of a Skill:

A Skill represents a stable business capability.

It should:

| Responsibility                | Description                                               |
| ----------------------------- | --------------------------------------------------------- |
| Represent a business function | e.g., "Approve Budget"                                    |
| Hide implementation details   | Internal tools and workflows remain private               |
| Remain stable                 | Internal technology can change without changing the Skill |
| Be discoverable               | Published through the Agent Card                          |
| Be reusable                   | Multiple clients can invoke the same business capability  |



