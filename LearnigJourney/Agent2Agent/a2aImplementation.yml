│   ├── CHANGELOG.md
│   ├── .importlinter
│   ├── src/agent_platform/
│   │   ├── configuration/              # loader.py, environment.py, validation.py
│   │   ├── security/
│   │   │   ├── authentication/
│   │   │   ├── authorization/
│   │   │   ├── identity/
│   │   │   └── credentials/
