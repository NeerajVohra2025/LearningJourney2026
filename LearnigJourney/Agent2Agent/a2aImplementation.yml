│   │   │   ├── redaction/
│   │   │   ├── middleware/
│   │   │   └── taxonomy.py
│   │   ├── audit/                      # events.py, sink.py, sinks/
│   │   ├── a2a/
│   │   │   ├── protocol/               # Agent Card, Task, Message models
│   │   │   ├── server/                 # app, executor, card_builder, task_store, middleware
│   │   │   └── client/                 # discovery, ID-token auth, retries, trace inject
│   │   ├── resilience/                 # retry, timeout, circuit breaker, idempotency
│   │   ├── evaluation/
│   │   ├── prompts/
│   │   ├── integrations/{vertex_ai,google_cloud,http,persistence}/
│   │   └── testing/                    # fakes and contract-test helpers
│   └── tests/
│
├── services/
│   ├── travel-agent/                   # INDEPENDENT SERVICE 1
│   │   ├── pyproject.toml              # depends on agent-platform-sdk>=1,<2
│   │   ├── Dockerfile
│   │   ├── .importlinter
│   │   ├── contracts/                  # public API of this service
│   │   │   ├── agent-card.json
│   │   │   └── skills/                 # e.g. search_flights.v1.json
│   │   ├── docs/{adr/, runbook.md}
│   │   ├── infra/                      # cloudrun.tf, iam.tf, secrets.tf, datastore.tf
│   │   ├── src/travel_agent/
│   │   │   ├── core/                   # PURE: no SDK, no framework, no I/O
│   │   │   │   ├── domain/{models,services,policies}/
│   │   │   │   ├── application/{commands,queries,services,interceptors}/
│   │   │   │   └── ports/
│   │   │   │       ├── inbound/        # HandleTaskUseCase
│   │   │   │       └── outbound/       # ReasoningEnginePort, ToolPort, MemoryPort,
│   │   │   │                           # ModelGatewayPort, PolicyPort, AuditPort,
│   │   │   │                           # RemoteAgentPort, TravelProviderPort
│   │   │   ├── adapters/
│   │   │   │   ├── inbound/{a2a,http}/ # a2a: handler.py + card.py (data only)
│   │   │   │   └── outbound/
│   │   │   │       ├── a2a/            # calls finance-agent via generated client
│   │   │   │       ├── travel_provider/
│   │   │   │       ├── reasoning/{langgraph,crewai,google_adk,openai_agents,vertex_ai}/
│   │   │   │       ├── tools/
│   │   │   │       ├── memory/
│   │   │   │       └── google_cloud/
│   │   │   ├── configuration/          # settings.py, agent.yaml, policies.yaml
│   │   │   ├── prompts/
│   │   │   ├── bootstrap/              # container.py (only place that wires adapters)
│   │   │   └── __main__.py
│   │   └── tests/{architecture,unit,contract,integration,security,evals}/
│   │
│   └── finance-agent/                  # INDEPENDENT SERVICE 2 (same layout)
│       ├── pyproject.toml
