1. Target architecture:
                         ┌──────────────────────┐
                         │   FastAPI / Uvicorn  │
                         │      ASGI Layer      │
                         └──────────┬───────────┘
                                    │
                         Cross-Cutting Middleware
                                    │
                 ┌──────────────────┼──────────────────┐
                 │                  │                  │
              Logging            Tracing           Security
              Metrics             Audit            Correlation
                 │                  │                  │
                 └──────────────────┼──────────────────┘
                                    │
                         ┌──────────▼──────────┐
                         │  Runtime Bootstrap  │
                         │  Config / DI /      │
                         │  Dynamic Agent Load │
                         └──────────┬──────────┘
                                    │
                     Runtime-selected Agent Package
                                    │
              ┌─────────────────────┼─────────────────────┐
              │                                           │
      ┌───────▼────────┐                         ┌─────────▼────────┐
      │  Travel Agent  │                         │  Finance Agent   │
      │ independent    │                         │ independent      │
      │ Python package │                         │ Python package   │
      └───────┬────────┘                         └─────────┬────────┘
              │                                           │
              └─────────────────┬─────────────────────────┘
                                │
                         ┌──────▼──────┐
                         │ A2A Adapter │
                         └──────┬──────┘
                                │
                           A2A Protocol
                                │
                         ┌──────▼──────┐
                         │ Application │
                         │   Use Case  │
                         └──────┬──────┘
                                │
                    ┌───────────┼───────────┐
                    │           │           │
                 Policy      Reasoning   Enterprise
                  Port         Port        API Port
                    │           │           │
                    ▼           ▼           ▼
                  OPA/       Vertex AI    Google APIs
                 Policy       / ADK       SAP / SNOW
                              / CrewAI    HR / Finance
                              / LangGraph
                              / OpenAI
                              
