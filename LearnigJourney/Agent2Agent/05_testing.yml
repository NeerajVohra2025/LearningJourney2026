1️) ISSUE: shared FOLDER IMPORT ERROR
    ❌ What’s happening (root cause)
            Each agent is its own Python package created with:
                uv init --package <agent_name>
            So when you write:
                from shared.a2a_message import A2AMessage
            Python says:
                ❌ ModuleNotFoundError: No module named 'shared'  

        Because shared/ is NOT installed as a package and not on PYTHONPATH. 

        ✅ ENTERPRISE-CORRECT FIX (DO THIS):
                You have two valid enterprise options.
                I’ll give you the simplest + cleanest one for local development.  

            ✅ OPTION A (RECOMMENDED): Make shared a real Python package
                This is what enterprises do. 
                            
                    🔧 Step 1: Turn shared into a package
                                cd shared
                                touch __init__.py
                            Now structure becomes:    
                                shared/
                                ├── __init__.py
                                ├── a2a_message.py
                                └── agent_card.py
                            
                    🔧 Step 2: Add shared as a local dependency to each agent
                                Example for langgraph_agent:
                                    📄 langgraph_agent/pyproject.toml
                                            [project]
                                            dependencies = [
                                              "langgraph",
                                              "langchain",
                                              "langchain-openai",
                                              "openai",
                                              "fastapi",
                                              "uvicorn",
                                              "python-dotenv",
                                              "pydantic",
                                              "requests",
                                              "shared @ file://../shared"
                                              
                        Do the same for:
                            crewai_agent/pyproject.toml
                            openai_agent/pyproject.toml
                📌 This tells Python:
                    “Install shared as a local package”              
                    
                    ]
                    
                🔧 Step 3: Install dependencies again  
                        From each agent folder:
                        uv sync
                        
                        
