    ❌ COMMON POSTMAN MISTAKES (VERY IMPORTANT)     :
            | Problem               | Cause                        | Fix                       |
            | --------------------- | ---------------------------- | ------------------------- |
            | 401 Unauthorized      | Missing Authorization header | Add Bearer token          |
            | 400 Skill not allowed | Wrong skill name             | Match `agents.toml`       |
            | 404 Not Found         | Wrong endpoint               | Use `/a2a`                |
            | Streaming not visible | Missing `Accept` header      | Add `text/event-stream`   |
            | Registry empty        | Agents not registered        | Register or auto-register |
    
