        REGISTRY API KEY:
            “Where does it come from?”
                   🔑 Simple truth (important):
                            Registry API keys are NOT generated by Docker or FastAPI.
                                They are issued by platform owners
                    In our example:
                            We hardcoded:
                                API_KEY = "registry-secret-key"

                            This simulates:
                                Platform security team issuing a key
                                Teams using it to register agents

                More realistic enterprise setup:   
                            | Environment | How key is managed          |
                            | ----------- | --------------------------- |
                            | Local       | `.env`                      |
                            | CI/CD       | Secret manager              |
                            | Cloud       | Vault / AWS Secrets Manager |
                
                
