❌ Docker healthcheck command fails:
    🧠 ENTERPRISE MENTAL MODEL (VERY IMPORTANT)
            In enterprise systems, service lifecycle has 3 phases:
            Start → process is running
            Healthy → service is ready
            Registered → service is discoverable

        You implemented 1️) and 2️) but 3️)is missing.
    
    ✅ ENTERPRISE-STANDARD SOLUTION (NO STRUCTURE CHANGE):    
            Agents must auto-register themselves with the registry at startup
        
        🧩 STEP 1 — WHAT REGISTRY EXPECTS (CLARITY):
                Your registry already supports:
                    POST /register:
                    with payload like:
                        {
                          "agent_id": "langgraph-planner",
                          "base_url": "http://langgraph:8001",
                          "skills": [
                            {"id": "plan"}
                          ]
                        }
                So nothing to change in registry.
                                    
        🧩 STEP 2 — WHERE REGISTRATION SHOULD LIVE (ENTERPRISE RULE):
                        Registration belongs to the Transport layer, not the Agent logic
                        That means:
                            NOT in executor.py
                            NOT in LangGraph / CrewAI logic
                            ✅ In app.py startup lifecycle
                            This keeps intelligence decoupled from infrastructure.
                            
        🧩 STEP 3 — ADD A GENERIC REGISTRATION HELPER (SHARED, SAFE):
                    Create (or reuse) a shared helper:    
                        📁 shared/registry.py
                                                        
                                import os
                                import requests
                                import time

                                def register_agent(agent_card: dict):
                                    registry_url = os.getenv("REGISTRY_URL")
                                    api_key = os.getenv("REGISTRY_API_KEY")

                                    if not registry_url or not api_key:
                                        print("⚠️ Registry config missing, skipping registration")
                                        return

                                    payload = {
                                        "agent_id": agent_card["agent_id"],
                                        "base_url": agent_card["base_url"],
                                        "skills": agent_card.get("skills", [])
                                    }

                                    # Retry because registry may start slightly later
                                    for attempt in range(5):
                                        try:
                                            r = requests.post(
                                                f"{registry_url}/register",
                                                headers={"X-API-Key": api_key},
                                                json=payload,
                                                timeout=5
                                            )
                                            if r.status_code == 200:
                                                print(f"✅ Registered agent {agent_card['agent_id']}")
                                                return
                                        except Exception as e:
                                            print(f"⏳ Registry not ready, retrying... ({attempt+1}/5)")
                                            time.sleep(2)

                                    raise RuntimeError("❌ Failed to register agent")
                                    
                        ✅ Enterprise traits:
                                Retry
                                No hard dependency
                                No crash loops
                                Safe failure handling                                  
                                
