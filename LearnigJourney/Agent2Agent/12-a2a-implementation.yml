Interview Questions:
Q1. Why is agent_card.py a separate file?:

Because the Agent Card represents the agent's public metadata and should be independent of business logic, task execution, and infrastructure concerns.


Q2. Does the Agent Card change during Task execution?:

Normally, no.

It is created during application startup and remains largely static until the agent is reconfigured or redeployed.

Q3. Does the Agent Card execute Skills?:

No.

It only advertises which Skills are available. The Executor invokes the implementation when a Task is received.


