Why create models?:

Every enterprise application separates

Business Model

from

Business Logic

Exactly like

Java DTOs

or

Pydantic Models.

Interview Questions:
Q1. Why doesn't agent_card.py contain business logic?:

Because its responsibility is only to describe the agent. Business execution belongs to the Executor.


Q2. Why keep Skills in a separate file?:

Skills are part of the public contract of the agent. Separating them makes it easy to update capabilities without modifying the Agent Card implementation


Q3. Why create models.py?:

It centralizes shared data structures and avoids duplicating model definitions across files.


