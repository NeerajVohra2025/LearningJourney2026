# Interview Questions

### Q1. Why is the Executor separate from the Task Manager?

Because they have different responsibilities.

The Task Manager manages the lifecycle and storage of Tasks.

The Executor performs the business logic.

---

### Q2. Why inject the Task Manager into the Executor?

Dependency Injection reduces coupling, improves testing, and allows different Task Manager implementations (memory, Redis, PostgreSQL) without changing the Executor.

---

### Q3. Can the Executor call another Agent?

Yes.

An Executor may:

* Invoke MCP tools
* Call REST APIs
* Query databases
* Communicate with another A2A agent
* Invoke an LLM

It is the orchestration component of the agent.

