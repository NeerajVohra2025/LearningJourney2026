Interview Questions
Q1. Why does the Task Manager create the Task instead of the Executor?:

Because creating, storing, retrieving, updating, and deleting Tasks is a persistence/lifecycle responsibility. The Executor's responsibility is to execute the Task, not manage its storage.

Q2. Why use UUID for Task IDs?:

UUIDs are globally unique, making them suitable for distributed systems where multiple agent instances may create Tasks concurrently.

Q3. Why use an Enum for TaskState?:

Enums provide type safety, prevent invalid state values, improve readability, and make state transitions easier to validate.


# Chapter 2 – Task Manager

This is exactly like we built **MemorySaver** before building the LangGraph.

The **Task Manager** is responsible for:

```text
Create Task
    ↓
Store Task
    ↓
Update Status
    ↓
Find Task
    ↓
Delete Task
```

Think of it as the **Task Database** for your A2A agent.

Initially, we'll keep everything **in memory**. Later, we can replace it with a persistent datastore such as:

* PostgreSQL
* Redis
* MongoDB

without changing the Executor.


