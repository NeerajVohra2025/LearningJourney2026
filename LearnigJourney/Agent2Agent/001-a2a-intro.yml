Chapter 1 – Why Was A2A Created?:

Let's first understand the problem.

Suppose you have one AI assistant.

User

↓

AI Assistant

↓

Answer
Life is simple.

Now imagine an enterprise AI system.
Travel Agent

HR Agent

Finance Agent

Legal Agent

IT Agent

Security Agent
Now ask yourself:

How will these agents communicate with each other?

Without any standard,

every team creates its own APIs.
Travel API

HR API

Finance API

Legal API

Every integration becomes different.

Exactly the same problem MCP solved for tools.


Chapter 2 – Real Enterprise Example:

Suppose a user asks:

Book my business trip to London.

Can one agent do everything?

No.

The AI must coordinate multiple specialists.
Travel Agent

↓

Hotel Agent

↓

Flight Agent

↓

Expense Agent

↓

