How does Travel Agent communicate with Hotel Agent?

This is exactly what A2A solves.


Chapter 3 – What is A2A?:

Agent-to-Agent (A2A) is an open protocol that standardizes communication between independent AI agents.

Notice something important.
MCP:
Agent

↓

Tool

A2A:
Agent

↓

Another Agent

Completely different purpose.


Chapter 4 – MCP vs A2A:

This is one of the most common interview questions.
| MCP                      | A2A                          |
| ------------------------ | ---------------------------- |
| Agent → Tool             | Agent → Agent                |
| Access resources         | Delegate work                |
| Tools                    | Skills                       |
| Resources                | Agents                       |
| JSON-RPC                 | HTTP + JSON contracts        |
| Standard tool invocation | Standard agent collaboration |

Think of it this way.
MCP
Chef

↓

Knife

A2A
Chef

↓

Another Chef

