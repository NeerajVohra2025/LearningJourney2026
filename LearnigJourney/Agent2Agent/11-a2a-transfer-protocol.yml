Notice something very important:

The Task lifecycle is independent of the lifetime of any single HTTP request.

Interview Questions:
Q1. Does HTTP execute the Task?:

No.

HTTP is only the transport mechanism. The Executor performs the Task.


Q2. Why doesn't A2A keep one HTTP connection open until the Task finishes?

Because Tasks may run for minutes or hours. Keeping a single request open is inefficient and unreliable. Instead, the Task continues independently, and updates are obtained through polling, streaming, callbacks, or other supported mechanisms.

Q3. Does A2A use JSON-RPC like MCP?:

No.

MCP standardizes communication using JSON-RPC 2.0. A2A uses HTTP with JSON-based protocol messages and models work around Tasks, Messages, and Artifacts rather than JSON-RPC methods.

Q4. Can an A2A agent internally use MCP?:

Yes. This is a very common enterprise architecture.

Travel Agent
      │
      ▼
A2A
      │
      ▼
Finance Agent
      │
      ▼
Executor
      │
      ├── MCP → SAP
      ├── MCP → ServiceNow
      ├── REST → Legacy API
      └── LLM → Reasoning
      
A2A is used for agent collaboration, while MCP is used for tool access within an agent.      