Step 11 – Then How Does Client Get Updates?:

Question

If HTTP closed,

how does

Travel Agent know

Task

is progressing?

There are several possible patterns depending on the implementation:

Polling – Client periodically asks for task status.
Streaming – Server streams task updates over a long-lived response.
Callbacks/Webhooks – Server notifies the client.
Other implementation-specific mechanisms.

The protocol supports asynchronous interactions, and implementations may choose the most appropriate mechanism.



