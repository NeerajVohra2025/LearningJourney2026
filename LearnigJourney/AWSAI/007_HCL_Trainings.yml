Which type of AI models does AWs Bedrock Supports?:
    Vision # some newer foundation models (e.g., Claude 3 and Llama 3.2) support multimodal inputs (including images), Bedrock’s core and historically supported use case is text. Vision capabilities are limited and model-dependent, not a primary or universal feature across Bedrock.
    Text: # Amazon Bedrock primarily supports foundation models (FMs) for text-based generative AI tasks.
