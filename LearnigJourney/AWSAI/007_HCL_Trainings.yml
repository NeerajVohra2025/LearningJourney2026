Which service does AWS Bedrock integrate with for input data storage?:
    Vector DB # While vector databases (e.g., Amazon OpenSearch, Pinecone, or AWS Kendra with vector search) are often used alongside Bedrock for retrieval-augmented generation (RAG), they are not a native AWS storage service that Bedrock directly integrates with for general input data. Vector DBs are optional add-ons, not core integrations.
    S3 : # Amazon Bedrock integrates natively with Amazon S3 (Simple Storage Service) for storing and retrieving input data, model artifacts, training data (for fine-tuning), and output results.
    EC2 # Provides virtual servers—not a storage service. Bedrock is serverless and doesn’t require EC2 for data input.
    EBS # Block storage attached to EC2 instances—not used directly by Bedrock, which is a managed service that doesn’t expose underlying infrastructure.

