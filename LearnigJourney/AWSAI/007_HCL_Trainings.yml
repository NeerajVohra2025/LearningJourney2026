What is the key feature of AWS Bedrock?:
    Serverless Architecture: #  Amazon Bedrock is its serverless architecture, which allows developers to use, customize, and deploy foundation models (FMs) without managing any underlying infrastructure.
    Real-time analytics # Not a core capability of Bedrock—it’s for generative AI inference, not analytics.
    Managed services for ML # Too generic—many AWS services (e.g., SageMaker, Comprehend) are managed ML services. Bedrock’s distinctive trait is being serverless and model-agnostic for FMs.
    Batch jobs for analytics   # Bedrock supports batch inference, but it’s for AI model predictions, not general-purpose analytics workloads. 
    
