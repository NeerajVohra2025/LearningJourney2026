A financial company wants to build a model to perform trend analysis. The company requires a high level of transparency and interpretability to understand how the model arrives at predictions.Which model provides the MOST interpretability?:            
            
    Linear regression models are highly interpretable because the model's coefficients directly represent the relationship between each feature and the target variable. Therefore, linear regression models provide a clear understanding of how the model arrives at its predictions


    Deep neural networks are complex models that are often difficult to interpret and explain. Deep neural networks can achieve high performance. However, deep neural networks often lack transparency into how the model arrives at its predictions.


    RCF models are ensemble models that combine multiple decision trees. Therefore, RCF models are less interpretable than simpler models like linear regression. You can explain RCF models through feature importance scores. However, understanding the exact relationship between features and the target variable is more challenging.


    K-NN models are instance-based learning algorithms that can be difficult to interpret. K-NN models are especially difficult to interpret when you have high-dimensional data or non-linear relationships. You can explain k-NN models through feature importance scores. However, understanding the exact relationship between features and the target variable is more challenging.


    ✅ Linear regression models provide the highest level of transparency and interpretability, making them ideal for financial trend analysis where understanding model reasoning is critical.

A company is developing an ML model to predict customer turnover. The model performs well on the training dataset but does not accurately predict turnover for new data.Which solution will resolve this issue?:
    Overfitting occurs when a model performs well on training data but poorly on new data. Regularization is an optimization technique that you can use to reduce overfitting. Decreasing the regularization parameter would increase model complexity. Therefore, this solution is the opposite of what you need to address the overfitting issue. Increasing model complexity would likely make the overfitting issue worse

    The model's poor performance on new data despite good performance on training data is a sign of overfitting. Regularization is an optimization technique that you can use to reduce overfitting. Increasing the regularization parameter decreases model complexity. Therefore, this is the appropriate solution to address the overfitting issue. By increasing regularization, you constrain the model. Therefore, you reduce the model's tendency to overfit to the training data and improve the model's ability to generalize to new, unseen data.

    Overfitting occurs when a model performs well on training data but poorly on new data. Adding more features to the input data is not likely to resolve the overfitting issue. This action could make the issue worse by increasing model complexity. When a model is already overfitting, adding more features can make the model even more likely to memorize the training data rather than learn generalizable patterns.  

    Training the model for more epochs would not resolve the overfitting problem. When a model is already overfitting, additional training epochs are likely to further overfit the model to the training data. This action could make the issue worse rather than resolving the issue. The model would be even less capable of generalizing to new data.
    
    ✅ Increase the regularization parameter

Formatting and data cleansing occur during which phase of the ML lifecycle?:          
    In the business goal identification phase, you outline the problem that you need to solve, identify the business value, define the success criteria, and evaluate whether to proceed.

    In the model development phase, you train, tune, and evaluate the ML model. During training, you provide the ML algorithm with training data to learn from. Hyperparameters tuning, or tuning, is the process of finding the most suitable set of hyperparameters for your model. For each model that you train, you will evaluate its performance against the test dataset by using the model evaluation metrics that you identify.

    The data preprocessing phase of the ML lifecycle includes data collection and data preparation tasks. During data collection, you identify and collect the data that you need to train the model. During data preparation, you preprocess your data to address any data formatting or data cleansing issues. Issues could include missing values or outliers. Feature engineering is also part of data preparation.

    The deployment phase of the ML lifecycle is when you deploy your trained model to production to make predictions on new data. Before you deploy your model to production, you must determine the inference method and the deployment strategy that you want to use.
     
    ✅ Data preparation (data preprocessing) phase   

