A company has deployed its generative AI model to production. The company wants to know how the model adjusts to unexpected data patterns and user inputs over time.Which stage of the generative AI foundation model (FM) lifecycle does this represent?:

    Model evaluation is the process of assessing a trained model's performance before deployment by using a separate test dataset. Model evaluation occurs before production deployment. In the scenario, production deployment has already occurred. Model evaluation does not observe the model's behavior on user input in production.

    Model monitoring focuses on the performance and behavior of a model after the model has been deployed. The model is continuously evaluated as the model interacts with real-world data and users. You can use model monitoring to observe how a model adjusts to unexpected data patterns and user inputs over time. Model monitoring helps detect issues that might emerge in production. For example, model monitoring can detect data drift or unfairness issues.

    Model deployment is the stage where a trained and tested model is integrated into a production environment and made available to end users. In this scenario, the model is in production. Therefore, model deployment has already occurred

    Data preparation is an early stage in the ML lifecycle. During data preparation, you collect, clean, and label the data that you will use to train the model. This stage occurs before model training and deployment. In the scenario, production deployment has already occurred. Therefore in this scenario, the data preparation stage has already occurred. The company's interest in how the model adjusts to new data patterns is not related to the initial data preparation process.
             
    
    ✅ Model monitoring is the stage that involves observing how a deployed generative AI model adapts to unexpected inputs and evolving real-world conditions over time.
    
A company is building a chatbot application by using Amazon Bedrock. The company wants to avoid toxicity in the chatbot responses. The company wants to add safeguards before releasing the chatbot application to the public.Which feature of Amazon Bedrock can help filter out harmful and offensive content?:             
             
    You can use Amazon Bedrock agents to add autonomous agents to generative AI applications. You can use agents to orchestrate tasks and complete actions for end users. For example, you can query data sources, invoke knowledge bases, and make API calls. Agents cannot filter out harmful or offensive content.

    You can use Amazon Bedrock knowledge bases to set up data sources for generative AI applications. Knowledge bases can help you build retrieval augmented generation (RAG) applications. You can use knowledge bases to securely connect foundation models (FMs) in Amazon Bedrock to your company data. Knowledge bases cannot filter out harmful or offensive content.

    You can use custom models in Amazon Bedrock to adapt foundation models (FMs) to specific tasks and domains by using your own data. Model customization is helpful for domain-specific use cases. Model customization can help you improve performance and overall customer experience. Custom models cannot filter out harmful and offensive content.

    You can use Amazon Bedrock guardrails to implement safeguards for your generative AI applications. Guardrails evaluate both user inputs and model responses to block unwanted topics, filter out harmful content, and avoid inappropriate language. You can use guardrails to configure custom safeguards based on the responsible AI policies of your company.
             
    ✅ Amazon Bedrock Guardrails is the feature designed to filter harmful and offensive content and enforce responsible AI behavior before public release.
    
An AI practitioner has built a deep learning model and wants to determine if the model is overfit.Which finding confirms that the model is overfit?:
        A low gap between training and testing accuracy typically indicates a well-fitted model, not an overfit model. In an overfit model, you would typically see a significant difference between training and testing accuracy.

        A high gap between training and testing accuracy is a strong indicator of overfitting. Overfitting occurs when the model performs well on the training data but performs poorly on unseen test data. Overfitting indicates that the model memorized the training set rather than learning generalizable patterns.
        
        ✅ A high gap between training and testing accuracy confirms that the model is overfit.

Which method modifies the weights of a large language model (LLM)?:             

    Prompt engineering is a technique that optimizes inputs to an LLM to improve outputs. This method focuses on designing effective prompts rather than modifying the model's internal weights

    RAG is a process to enhance LLM outputs by incorporating external knowledge. RAG augments the model's context during inference without changing the model's weights.

    Fine-tuning is a method that trains an existing model on a specific dataset to improve performance for a particular task or domain. Fine-tuning alters the model's internal weights.

    Chain of thought is a prompt engineering technique. Chain of thought processes complex questions as a series of small tasks that mimics a reasoning process. This technique enhances the model's output quality during inference without changing its internal weights.
       
    ✅ Fine-tuning   
             

