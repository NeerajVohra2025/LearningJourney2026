A company is predicting next year's sales by using monthly sales data from the previous 2 years. The dataset is in CSV format and consists of the year, month, and corresponding sales total for each month. Which type of data is the company using?:           
            
    Structured data has a predefined schema and is organized in a tabular format. The company's dataset consists of clear fields. The fields include year, month, and sales total. The fields are arranged in a tabular structure. Each row represents a month's sales figures. The scenario describes structured data. Structured data has a fixed schema that you can query. The scenario describes data that you could store in a relational database or spreadsheet, which are common tools for structured data


    Unstructured data lacks a predefined data model or organization. Examples of unstructured data include images, video files, and free-form text. The company's sales data has a clear structure with defined fields (year, month, sales total) in a tabular format. This organized, predictable structure is inconsistent with the characteristics of unstructured data.

    Semi-structured data falls between structured and unstructured data. Typically, semi-structured data contains tags or markers to separate semantic elements but lacks the strict data model of structured data. Examples of semi-structured data include XML and JSON formats. The company's sales data has a structure with clearly defined fields (year, month, sales total) in a tabular format.

    Text data typically refers to unstructured or semi-structured data in the form of written language. Written language includes documents, emails, or social media posts. The company's dataset consists of numeric and date values (year, month, sales total) that is organized in a tabular format. Structured, quantitative data would not contain natural language content.
    
    ✅ Structured data

A company released a generative AI chatbot for its internal users. The chatbot uses Amazon Bedrock. The company wants to collect metrics and display the metrics on a dashboard that shows the input and output tokens generated for each interaction with the chatbot.Which service should the company use to build a metric dashboard?:

    CloudWatch is a monitoring and observability service that provides metrics, logs, and dashboards for AWS resources and applications. CloudWatch integrates natively with Amazon Bedrock. Therefore, you can use CloudWatch to monitor Amazon Bedrock usage, set alarms, and visualize metrics in near real time. CloudWatch can collect and graph metrics such as input and output tokens for Amazon Bedrock. CloudWatch can display the metrics on customizable CloudWatch dashboards.

    CloudTrail is a service that provides governance, compliance, operational auditing, and risk auditing of your AWS account. CloudTrail tracks API calls that are made to AWS resources. However, CloudTrail does not provide application-level metrics or customizable dashboards. CloudTrail cannot collect or display metrics on input and output tokens for Amazon Bedrock.

    Trusted Advisor is a tool that provides guidance based on best practices to help you optimize cost, security, and the performance of your AWS infrastructure. Trusted Advisor does not support collection and visualization of metrics, such as Amazon Bedrock input and output tokens.

    AWS Config is a service that helps you assess, audit, and evaluate the configurations of your AWS resources. AWS Config provides a view of the configuration and relationship of AWS resources in your account. AWS Config can show how resource configurations change over time. However, AWS Config does not collect or visualize application data or service metrics, such as input and output tokens for Amazon Bedrock.
    
    ✅ Amazon CloudWatch 


A company wants to use a database to support a generative AI model. The model will create intelligent agents that provide conversational search experiences. Which AWS services will meet these requirements? (Select TWO.):            

    Neptune is a fully managed graph database service that includes vector search capabilities. You can use Neptune to support a generative AI–based conversational search experience by using Retrieval Augmented Generation (RAG).

    Amazon EKS is a managed Kubernetes service that you can use to deploy and manage containerized applications. Amazon EKS is not a database that supports generative AI–based conversational search

    Amazon S3 is an object storage service that provides scalability, data availability, security, and performance. Amazon S3 is not a database service. Amazon S3 does not optimize search performance or provide the database querying capabilities that you need to support a generative AI–based conversational search.

    OpenSearch Service is a managed service that you can use to deploy, operate, and scale OpenSearch clusters in the AWS Cloud. OpenSearch Service supports vector search. You can use OpenSearch Service to implement generative AI–based conversational search experiences by using Retrieval Augmented Generation (RAG).

    Amazon EMR is a managed cluster platform that you can use to process vast amounts of data. Amazon EMR is not a database that can support generative AI–based conversational search.
    
    ✅ Amazon Neptune
    ✅ Amazon OpenSearch Service

A company wants to use a large language model (LLM) to generate concise, feature-specific descriptions for the company's products.Which prompt engineering technique will meet these requirements in the MOST operationally efficient way?           
            
    To create a single generic prompt for all products does not meet the requirement for feature-specific descriptions. This approach would likely generate broad, non-specific content that does not highlight the unique features of each product. Editing the responses afterwards adds unnecessary manual work and does not use the LLM's capabilities effectively. The scenario requires a technique to generate concise, feature-specific descriptions. Therefore, this solution does not meet the requirements.

    You can create prompts for each product category that highlight key features to generate concise, feature-specific descriptions. You can include the desired output format and length in each prompt. This technique ensures that the LLM generates tailored, focused content for each product category. This solution is the most operationally efficient way to create feature-specific descriptions. This solution provides concise outputs by specifying the desired length.

    You can include a diverse range of product features in each prompt to lead to creative descriptions. However, this technique does not meet the requirement for concise, feature-specific descriptions. This technique could result in overly lengthy or unfocused content that does not highlight the key features of each product effectively. The scenario requires concise descriptions.

    You can manually create detailed, product-specific prompts. However, this solution is not an operationally efficient prompt engineering technique, especially if the company has many individual products. A more operationally efficient technique would be to create prompts for product categories. The level of detail included in a prompt does not ensure concise outputs. The scenario requires a technique that balances specificity with conciseness.
    
    ✅ Create prompts for each product category that highlight key features — this is the most operationally efficient and effective prompt engineering technique for the stated goal.


            
How do embeddings help improve the accuracy of large language models (LLMs)?:            
            
    Latency is determined by factors such as model architecture, computational resources, and hardware specifications. These factors are separate from the embedding process that captures semantic meaning. Embeddings do not directly influence the latency or speed of model results.

    Embeddings provide contextual information to the model. Embeddings do not specifically influence the selection of lower-probability outputs. Embeddings help guide the model's understanding. However, embeddings do not directly manipulate output probabilities.

    Embeddings can improve the accuracy of LLMs by encoding words into dense vectors that capture semantic meaning and relationships. When words are used in different contexts, the words' embedding vectors adjust to reflect varied meanings. Then, the LLMs can understand that the same word can have different implications based on the surrounding context. This contextual understanding is important for improving the model's accuracy in interpreting and generating language.

    Embeddings do not function to stop token generation in LLMs. Instead of stopping token generation, embeddings provide contextual information to inform and improve the quality of generated tokens. Embeddings enhance the model's understanding of language. Embeddings do not limit the model's output.
    
    ✅ Embeddings improve LLM accuracy by capturing contextual and semantic relationships between words, enabling the model to interpret and generate language more intelligently.

A company wants to evaluate a large language model (LLM) from Amazon Bedrock.Select the correct model evaluation type from the following list for each use case. Each model evaluation type should be selected one or more times. (Select FOUR.)
Automatic model evaluation
Human-in-the-loop model evaluation
    Accuracy of the text summarization on the built-in dataset:           
    Automatic model evaluation is the process of assessing the performance of an AI model by using predefined metrics, without direct human intervention. This approach uses quantitative metrics to evaluate the model's outputs. Quantitative metrics include accuracy, precision, recall, and F1 score. Automatic evaluation is well-suited for tasks where the correct outputs can be objectively determined. For example, in text summarization, sentiment analysis, or named entity recognition, the outputs can be objectively determined. You can use automatic model evaluation to evaluate the accuracy of text summarization and to evaluate the toxicity of text generation.

    Human-in-the-loop model evaluation involves direct engagement of human evaluators to assess the performance of an AI model. This approach relies on human judgment and a subjective assessment of the model's outputs. This approach does not rely on automated metrics. Human-in-the-loop evaluation is particularly useful for tasks that require more nuanced or contextual understanding. An example of a nuanced task is evaluating the factual correctness, linguistic quality, or overall coherence of generated text. By incorporating human feedback, this evaluation method can provide a more comprehensive and qualitative assessment of the model's capabilities. You can use human-in-the-loop model evaluation to evaluate the factual correctness of generated responses and the linguistic quality of text generation.


What is a primary purpose of having separate training, validation, and testing datasets in ML?:            
            
    In ML, data is typically split into three subsets- training, validation, and testing. You use the training set to fit the model parameters. You use the validation set to evaluate the performance of the model type on the training dataset while you tune hyperparameters. You use the testing set to evaluate the final model performance on unseen data.

    Parallelizing the training process across multiple datasets can potentially speed up the training time. However, the purpose of having separate training, testing, and validation datasets is to evaluate the model's performance on unseen data and prevent overfitting. The purpose is not to improve training speed.

    Ensemble methods combine multiple models that are trained on different subsets of data. However, ensemble methods are not the purpose of having separate training, testing, and validation datasets. The purpose of the separation is to ensure unbiased performance estimation and effective generalization to unseen data

    You can apply preprocessing techniques to the entire dataset before splitting the data into training, validation, and testing sets. However, the purpose of the separation is to ensure unbiased performance estimation and effective generalization to unseen data.
     
    ✅ Correct Answer: To evaluate model performance on unseen data and prevent overfitting.
    
    

 
     
