A data scientist wants to fine-tune a foundation model (FM) on Amazon Bedrock to improve the model's performance in a specific industry domain. Which statements accurately describe fine-tuning on Amazon Bedrock? (Select TWO.):  
   Fine-tuning requires labeled data. Continued pre-training requires unlabeled data.
   
   You can fine-tune a model with a relatively small dataset compared to the original pre-training dataset. Therefore, fine-tuning is an effective approach to model customization.
 
   Persistence of training data in a vector is not required for fine-tuning.
  
   Model customization is not supported by all FMs on Amazon Bedrock.
   When you fine-tune an existing FM, you create a custom model.
  
  
  ✅ Final Answer
    When you fine-tune an existing FM, you create a custom model.
    You can fine-tune a model with a relatively small dataset compared to the original pre-training dataset. Therefore, fine-tuning is an effective approach to model customization.  


An AI practitioner is creating a forecasting model to predict stock prices. The data sources being analyzed contain missing values and statistical outliers. The AI practitioner wants to clean and transform the data without writing custom code. Which AWS service or feature will meet these requirements?:   
   
   AWS Glue jobs require you to write custom code in PySpark or Scala to transform data. You can use AWS Glue jobs for extract, transform, and load (ETL) tasks. However, this solution would require you to develop custom transformation logic for currency conversion.
   
   SageMaker Data Wrangler provides multiple built-in data transformations. Therefore, this solution meets the requirement to transform the data without writing custom code. SageMaker Data Wrangler has a no-code interface that you can use for data transformation tasks.
   
   Athena is an interactive query service that you can use to analyze data in Amazon S3 by using standard SQL. Athena does not provide built-in transformations for data transformation tasks. With Athena, you would need to write custom SQL queries to transform the data.
   
   
   You can use SageMaker Feature Store to store, update, retrieve, and share ML features. SageMaker Feature Store does not provide built-in transformations for data transformation tasks.
   
   ✅ SageMaker Data Wrangler provides multiple built-in data transformations. Therefore, this solution meets the requirement to transform the data without writing custom code. SageMaker Data Wrangler has a no-code interface that you can use for data transformation tasks.
   
A company wants to deploy an ML model that will provide near real-time inference for high-definition images. The images can take up to 3 minutes to process. Which model inference type will meet these requirements?:   
    Real-time inference is suitable for applications that have synchronous, low-latency request processing requirements. Real-time inference supports a maximum processing time of 60 seconds. In this scenario, the image processing time can take up to 3 minutes, and the requests should be queued if necessary. Real-time inference does not meet the processing time requirements.
    
    Serverless inference is suitable for applications that have intermittent traffic and low-latency request processing requirements. AWS manages all the underlying infrastructure of the endpoint. Serverless inference can support a maximum processing time of 60 seconds. In this scenario, the processing time can take up to 3 minutes, and the requests are being queued. Therefore, you cannot use serverless inference.
   
    Asynchronous inference is suitable for near real-time inference of up to 1 GB of data. Asynchronous inference supports a maximum processing time of up to 1 hour. Asynchronous inference can queue requests to your inferencing endpoint when the traffic is high and scale down when there are no requests to process. Therefore, asynchronous inference meets the requirements.

    You can use batch transform for use cases with large datasets (gigabytes in size) that can take up to days to process. Batch transform is suitable for jobs where you do not need a persistent inferencing endpoint and you do not need to process data immediately. The scenario requires near real-time inferencing and can only accept a processing delay of a few minutes. Therefore, you cannot use batch transform for this scenario.
    
    ✅ Asynchronous inference
	
A company has an ML model that was trained with custom libraries dependencies. The model performs well on training data. However, the model does not perform as well when the model is tested on new datasets.What should the company do to improve the model's performance on the new datasets?:

    In the scenario, the model performs well on training data but performs poorly on new datasets. Therefore, the scenario describes an overfitting issue. Training with smaller datasets is not a recommended approach to improve model performance on new datasets. A solution that uses less data could increase bias and reduce the model's ability to generalize.
    
    You can establish reliable packaging patterns for software libraries to improve consistency and reproducibility in ML workflows. However, this solution does not address the model's performance issues on new datasets. The requirement is to improve the model's generalization ability. Therefore, the solution should analyze and adjust the model's bias and variance. Packaging patterns alone will not solve the performance discrepancy between training and new datasets.
	
	
    Automating model training by using MLOps and CI/CD practices can improve consistency and efficiency in the ML pipeline. However, this solution does not address the model's poor performance on new datasets. The requirement is to improve the model's ability to generalize to unseen data. Automation is valuable. However, automation does not replace the need for a thorough analysis of the model's bias and variance to identify and correct performance issues.
	
	
    Performing a bias and variance tradeoff analysis is the most suitable solution to improve the model's performance on new datasets. The scenario indicates that the model performs well on training data but poorly on new datasets. Therefore, the scenario describes an overfitting issue. By conducting a bias and variance tradeoff analysis, you can identify whether the model is underfitting (high bias) or overfitting (high variance). Then, you can make the necessary adjustments to improve the model's generalization ability. This solution addresses the core issue of a performance discrepancy between training and new data.

    ✅ Perform a bias and variance tradeoff analysis to diagnose and address overfitting.

A travel company uses Amazon Bedrock to produce images of people snow skiing for an upcoming marketing campaign. The model is generating images of people water skiing in addition to snow skiing. The company does not want the water skiing images.How can the company prevent the unwanted images from being generated with the LEAST operational effort?:	
    You would use a mask prompt to cover an object in an image. For example, a mask prompt can cover water in an image. However, this solution does not prevent the unwanted images from being generated.

    SageMaker AI is an ML service that you can use to build, train, and deploy ML models. You can use SageMaker AI to create a model to generate images. This solution requires additional operational effort to set up the SageMaker AI environment, collect and prepare a dataset, and train the model.

    You can use a negative prompt to instruct a model on certain concepts, images, or words that you do not want to be generated in the output. You can use a negative prompt of water skiing to instruct the model not to generate water skiing images.


    You can use Amazon Bedrock agents to build autonomous agents in an application. Agents orchestrate interactions between users, the foundation model (FM), software applications, or data sources. Amazon Bedrock agents cannot prevent unwanted images from being generated.
    ✅ You can use a negative prompt


An ML specialist incorporated a large language model (LLM) in a proof of concept. The ML specialist wants to reduce the response randomness of the model. Which change in inference parameter can reduce random responses?:	
    Temperature is a parameter that you can use to increase or decrease randomness in responses. To reduce the temperature can reduce randomness in responses.

    Top P is a parameter that you can use to increase or decrease the diversity of responses. To increase Top P increases response randomness.

    Top K is a parameter that you can use to select the number of candidates with the highest probabilities. Top K does not reduce randomness in responses.

     Max_length is a parameter that specifies the maximum number of characters in a response. To reduce the max_length parameter to a lower value will limit the length of responses. However, this solution does not reduce response randomness.
    ✅ Lower the temperature inference parameter



A company wants to use Amazon Bedrock to build a generative AI application for product advertising. The company wants to customize a foundation model (FM) by using unlabeled data to make the model more specialized.Which model customization technique will meet these requirements?:	 
     Fine-tuning is a technique that uses labeled datasets to adapt model parameters for specific tasks. Fine-tuning can customize a model. However, fine-tuning requires annotated data with additional context.
     
     
     RAG is a process that enhances large language model (LLM) outputs by referencing external knowledge bases. RAG can improve model performance. However, RAG does not customize an FM by using unlabeled data. RAG can augment model responses during inference. However, RAG does not modify the underlying model.
     
     Continued pre-training is designed to further train an FM by using unlabeled data. You can use continued pre-training to make the model more specialized to your specific domain or use case. An example of a use case is product advertising.
	 
    ✅ Continued pre-training of the foundation model using unlabeled domain-specific data

A company wants to use large language models (LLMs) to produce code from natural language code comments.Which LLM feature will meet these requirements?:	

    Text summarization is an LLM feature that generates concise summaries of input text. Text summarization focuses on extracting key points by capturing the most critical information and condensing long pieces of text from an existing corpus. Text summarization does not produce code from natural language code comments.
	 
     Text generation is an LLM feature that can produce code from natural language code comments. A model can use this capability to translate natural language instructions into machine code. Text generation can interpret the intent expressed in code comments. Then, text generation can output corresponding functional code.
     
     Text embeddings are meaningful vector representations of unstructured text. You can use text embeddings to capture semantic information and relationships in text. You cannot use text embeddings to produce code from natural language code comments.
     
     Text classification is an LLM feature that categorizes input text into predefined classes or categories. Text classification is useful for tasks such as sentiment analysis or topic categorization. Text classification does not generate code or translate between natural language and programming languages.
     
     ✅ Code generation from natural language (text-to-code)
	 
Which part of a prompt needs the user to provide information to set up the situation for the model?:	

    An output indicator specifies the expected format or type of the model's response, such as "Human:" or "Assistant:". An output indicator does not provide situational information to set up the situation for the model.
	 
     The input is the specific question or task given to the model to respond to. The input does not provide the background information or situational context to frame the model's understanding.
     
     Instructions provide guidance to the model on how to formulate its response. An example of instruction is "Explain your reasoning." Instructions do not provide the background information or situational context to set up the scenario for the model.
     
     The context is the part of a prompt that provides external information or background to set up the situation for the model. Context provides the model with the necessary background information to understand and respond appropriately to the input. An example of context is "The following is a customer email that was received last week." This contextual information helps frame the model's understanding of the scenario.
     
     ✅ Context
	 
A company has audio files that need to be converted into text. Which AWS service will meet this requirement?	:

     Amazon Polly is a service that can convert text to speech or audio. Amazon Polly does not convert speech or audio to text.
     Amazon Lex is a service for natural language understanding and automatic speech recognition. You cannot use Amazon Lex to convert speech or audio to text.
     Amazon Transcribe is a speech recognition service that converts speech or audio to text. Amazon Transcribe meets the requirements to convert audio files to text.
     Amazon Comprehend is a service that you can use to identify key phrases, language, and sentiments within a document. You cannot use Amazon Comprehend to convert speech or audio to text
     
     ✅ Amazon Transcribe 
	 
A company wants to add conversational capabilities to its customer service system. The company needs flexible conversations that can connect to the company's existing systems. Which AI technology will meet these requirements? :
    
    A recommendation engine is an AI technology that you can use to provide personalized suggestions based on user data and behavior patterns. An example of a recommendation engine is Amazon Personalize. Recommendation engines are useful for enhancing customer experience. However, a recommendation engine does not provide the flexible conversational capabilities that you need for customer service. Recommendation engines do not engage in back-and-forth dialogue and connect to existing systems.

    Speech recognition technologies convert spoken language into text. An example of a speech recognition service is Amazon Transcribe. Speech recognition can be a component of a conversational system. However, speech recognition by itself does not provide the flexible conversational capabilities that you need for customer service. Speech recognition does not understand context, generate responses, or connect to existing systems.
	 
    A chatbot is an AI technology that can add conversational capabilities to customer service applications. Amazon Lex provides chatbot capabilities. Chatbots can engage in flexible conversations, understand context, and connect to existing company systems. You can customize chatbots to handle a wide range of customer service scenarios. Therefore, chatbots provide the flexibility and integration capabilities that the company requires.
      
    Summarization is an AI technology that you can use to condense longer texts into shorter, concise versions while retaining key information. Summarization does not provide the conversational capabilities that you need for customer service. Summarization cannot engage in interactive dialogue. Summarization cannot understand context or connect to existing systems.
    
    ✅ Chatbot
	  
A medical company is developing an AI application. The company needs to store patient data locally to comply with regulations. The company wants to use Amazon S3 on Outposts to keep the data in the same country as the patient.Which data governance concept is the company using?:	  
      
    Data logging refers to the process of recording events, transactions, or activities within a system. Data logging has no direct relation to the physical location of data storage.

    Data residency refers to the physical or geographic location where you store or process data. You can use S3 on Outposts to store patient data locally in the same country as the patient. Therefore, the medical company meets the data residency requirements

    Data retention refers to the policy of maintaining and storing data for a specific period of time. Data retention does not address the requirement to store patient data locally in the same country.

    Data protection focuses on methods to safeguard data from unauthorized access, corruption, or loss. Data protection is not related to the physical location of data storage.
      
      ✅ Data residency
	  
A car company wants to make an application for drivers. The application will summarize questions and answers from the car manual.Which AWS service can the company use to build this application?:	  
      
    Amazon Polly is a service that converts text to speech. Amazon Polly does not provide the capability to summarize questions and answers from a car manual.

    Amazon Rekognition is a computer vision service that you can use to analyze images and videos. Amazon Rekognition does not have the capability to summarize text or answer questions from a car manual.

    Amazon Personalize is a service that you can use to create personalized product recommendations and user experiences. Amazon Personalize does not provide the text summarization or question-answering capabilities you need to summarize a car manual.

    Amazon Bedrock is a fully managed service that provides access to high-performing foundation models (FMs) through an API. Amazon Bedrock provides capabilities such as text summarization and question answering. You can use Amazon Bedrock language models to build applications that understand and generate human-like text. Therefore, this is the most suitable solution to create a question-answering application.

    ✅ Amazon Bedrock

A company notices that its model produces more accurate results when tested on one group of customers over another. The company wants to understand what is causing these results.Which AWS service can help identify the cause of the model's behavior? : 
	   
    SageMaker JumpStart provides pre-trained models to help you start using ML. SageMaker JumpStart does not detect bias on models.

    SageMaker Model Monitor tracks the quality of deployed models and measures metrics such as data drift and model status. SageMaker Model Monitor does not detect bias on models.

    If a model provides more accurate results for one group over another, then the model has bias. SageMaker Clarify detects bias in models and helps you identify the cause. Then, you can take corrective measures.

    Amazon Bedrock Guardrails is a feature of Amazon Bedrock that you can use to filter and moderate inappropriate or unwanted content. Amazon Bedrock Guardrails do not provide insight into why a model has a different accuracy level for different customer groups.
    
    ✅ Amazon SageMaker Clarify
       
A sports company wants to broadcast sports programs with real-time captioning in many languages.Which solution will meet these requirements?:       
    Amazon Transcribe is a speech recognition service that converts audio to text in real time. Amazon Translate is a machine translation service that can translate text into multiple languages quickly. This solution meets the requirement for real-time captioning in many languages for sports broadcasts. Amazon Transcribe converts the live sports commentary to text. Then, Amazon Translate translates the text into multiple languages simultaneously. This solution provides multi-language captioning in real time.

    Amazon Translate is designed for text translation, not speech-to-text conversion. You can use Amazon Transcribe to convert speech to text, not to translate text

    Amazon Comprehend is a natural language processing (NLP) service that you can use to extract insights from text. You would not use Amazon Comprehend for translation. Amazon Polly is a text-to-speech service, not a speech-to-text service. Neither service can provide the real-time speech-to-text and translation capabilities that you need for multi-language sports broadcast captioning.

    Amazon Polly is a text-to-speech service, not a translation service. Amazon Comprehend is a natural language processing (NLP) service. Amazon Comprehend cannot convert speech to text.
    
    ✅ Use Amazon Transcribe to convert live audio to text, then Amazon Translate to generate real-time captions in multiple languages.
    
A global company has built a generative AI application by using Amazon Bedrock foundation models (FMs). The company's highest priority is cloud security.According to the AWS shared responsibility model, which option is solely the customer's responsibility?:        
    AWS customers are solely responsible for managing, securing, and encrypting their data. Additionally, AWS customers are solely responsible for using AWS Identity and Access Management (IAM) tools to apply appropriate permissions. The customer maintains control over who can access their applications that run on AWS and how customer data is protected.

    AWS manages the physical networking setup and configuration as part of the underlying infrastructure for Amazon Bedrock and other AWS services.

    AWS is responsible for the host operating system and virtualization layer. Amazon Bedrock is a fully managed service, so AWS manages the underlying infrastructure and host operating system.

    Security and compliance is a shared responsibility, not a sole responsibility for AWS customers. AWS obtains and maintains compliance certifications for the underlying AWS services, including Amazon Bedrock. The customer is responsible for complying with applicable standards in their use of AWS services, but not for the certifications themselves.
    
    ✅ Managing and securing customer data (prompts, inputs, outputs) and configuring access controls for Amazon Bedrock
        
An AI practitioner has built various models by using Amazon SageMaker AI. The AI practitioner needs to present a governance audit for model risks to senior leadership.What can the AI practitioner do to present the governance information?:       

    SageMaker Model Cards are designed to document model governance and risk information. You can use SageMaker Model Cards to explain the intended use case for a model before production and outline all governance aspects. SageMaker Model Cards provide a structured way to document model details, performance metrics, responsible AI practices, and potential risks. Therefore, SageMaker Model Cards are suitable for governance audits.

    QuickSight is a business intelligence tool that you can use to create dashboards and visualize data. QuickSight dashboards are more suitable for visualizing operational metrics and business data. Visualizing key metrics in a QuickSight dashboard does not provide the required governance information.

    You can use SageMaker Model Dashboard to access and monitor models that are currently running in your account or that are available for deployment. SageMaker Model Dashboard provides operational insights. However, SageMaker Model Dashboard does not provide the detailed documentation of model risks and governance aspects that you would need for an audit presentation.


    You can use SageMaker AI endpoints to deploy and test models in production environments. Endpoints do not provide the necessary tools or format to present governance audits or explain model risks.
    
    ✅ Use Amazon SageMaker Model Cards to document and present model governance and risk information

A financial company wants to evaluate a large language model (LLM) that is used for text summarization. The company wants to evaluate the quality of the summaries.Which metric will meet the requirement to assess the quality of generated text summaries?:        
    BLEU is an evaluation metric that primarily evaluates machine translation quality. You cannot use BLEU to evaluate text summarization performance.

    You can use mAP to measure model performance. You would typically use mAP for object detection models. The mAP metric does not apply to evaluating text summaries.

    ROUGE is a set of metrics that you can use to evaluate the quality of machine-generated summaries. ROUGE can compare the summaries to human-written summaries. ROUGE measures characteristics such as coverage and relevance. Therefore, this solution is suitable to assess the text summarization in the scenario.

    The F1 score is an evaluation metric that you can use to measure the predictive performance of a model. The F1 score combines precision and recall scores. You would typically use F1 scores for binary classification. You cannot use F1 scores to evaluate text summarization performance
    
    ✅ ROUGE is the appropriate metric to assess the quality of generated text summaries.
          
A company needs to predict whether a patient has a medical issue based on radiology images.Which ML technique will meet this requirement?:          
    Time series modeling is a technique that you can use to analyze structured data that is collected over time. Time series modeling can identify trends and make predictions that vary over time. The scenario requires a technique that can process unstructured visual data.  

    You can use NLP to analyze and understand human language in text or speech form. The scenario requires a technique that can process unstructured visual data.

    Computer vision involves training algorithms to interpret and analyze visual information from images or videos. Computer vision can process the unstructured data in radiology images to identify patterns and features to predict medical issues.

    Regression modeling can predict a numerical value or classification based on structured data inputs. The scenario requires a technique that can process unstructured visual data.
    
    ✅ Computer vision is the ML technique that can analyze radiology images to predict medical issues.
          
A company wants to use a language model to generate human-like text for marketing materials. The company wants to ensure that the generated text is relevant and aligned with the company's professional tone. Which solution will meet these requirements with the LEAST operational effort?:          
    Prompt engineering carefully designs the input prompts to steer the language model's generation toward the desired output characteristics. Output characteristics can include tone, style, and content relevance. This solution aligns the generated text with the company's professional tone and marketing goals

    Creating a custom language model is a complex and resource-intensive process that is not necessary for this use case. Prompt engineering by using a well-trained, ready-to-use language model would meet the requirements with less operational effort.


    Postprocessing techniques can be useful to refine and filter generated text. However, you should use postprocessing techniques in conjunction with prompt engineering, not as a replacement. Prompt engineering can guide the model's generation toward the desired output characteristics.


    Ensemble methods combine multiple models. Ensemble methods can improve performance in some use cases. However, ensemble methods do not directly address the need for professional tone alignment and relevant text generation. Prompt engineering is a more targeted approach to shape the output of a single language model to meet the requirements.
    
    ✅ Prompt engineering

A company needs to train an ML model to predict the company's electricity load usage. The dataset includes electricity load, temperature, and cloud coverage. Which ML technique will meet these requirements?:
 
    Supervised learning involves training a model on labeled data. This technique includes both input features (temperature, cloud coverage) and the target variable (electricity load). The model learns to predict the target based on the features. The scenario represents a regression problem. Regression is a type of supervised learning.

    Reinforcement learning involves an agent learning from its environment through trial and error. The company's requirement is to predict electricity load based on known variables. The scenario does not include learning from interactions with an environment. The scenario does not involve an agent making decisions and receiving rewards. An agent making decisions and receiving rewards are key components of reinforcement learning.

    You can use unsupervised learning when there is no labeled target variable. Unsupervised learning focuses on finding patterns or structures in data without predefined outputs. In the scenario, the company has a clear target variable (electricity load) that needs to be predicted based on known features (temperature, cloud coverage). The presence of a labeled target variable makes this a supervised learning problem, not an unsupervised learning problem.


    NLP is a branch of AI that deals with the interaction between computers and human language. NLP processes and analyzes large amounts of natural language data. The company's requirement involves numerical data (electricity load, temperature, cloud coverage) rather than text or speech. Predicting electricity load based on numerical features is a task for traditional ML techniques, not NLP.
    
    ✅ Supervised learning is the appropriate ML technique for predicting electricity load using labeled numerical features.
           
What is Retrieval Augmented Generation (RAG)?:           
    RAG can augment the generation process by retrieving information from a knowledge base to improve performance. You can use RAG to ground the generated responses to an external data source. RAG is not a prompting technique that enhances generalization.


    RAG can augment the generation process by retrieving information from a knowledge base to improve performance. You can use RAG to ground the generated responses to an external data source. RAG is not a prompting technique that enhances generalization.

    RAG can augment the generation process by retrieving information from a knowledge base to improve performance. RAG does not compress prompts to decrease processing time.

    RAG is a process that retrieves and incorporates relevant information from external sources before generating a response. You can use RAG to improve a model's output with up-to-date or specialized knowledge.
    
     ✅ RAG is a process that retrieves and incorporates relevant information from external sources before generating a response, enabling LLMs to produce more accurate, grounded, and contextually relevant outputs—especially for specialized or up-to-date knowledge.
           
An AI practitioner wants to deploy a trained model that is used for consistent, live, interactive, and low-latency predictions.Which solution will meet these requirements?:           
   
    Real-time inference endpoints in Amazon SageMaker AI are specifically designed for live, interactive, and low-latency prediction requirements. You can use real-time inference endpoints to deploy a trained model to SageMaker AI and obtain an endpoint that you can use for real-time inference. Real-time endpoints provide the necessary infrastructure to handle immediate requests and return predictions with minimal latency.

    Batch transform jobs are designed for offline processing of large datasets. Batch transform jobs generate predictions in bulk rather than in real time. This approach introduces latency and does not support interactive queries.

    Serverless inference provides scalability and cost-efficiency for unpredictable request patterns. However, serverless inference can take up to 60 seconds to process requests. Serverless inference is not suitable for consistent, live interactive predictions.

    SageMaker Feature Store is a fully managed repository that you can use to store, share, and manage features for ML models. You cannot use SageMaker Feature Store to deploy a model.
   
    ✅ Deploy the model using a real-time (synchronous) inference endpoint
 
 Which components of the ML pipeline are performed during or after model training? (Select TWO.):          
           
    Data collection is part of the data processing phase. The data processing phase occurs before model training. Model training requires training data.

    Feature engineering prepares the data to be suitable for model training. Feature engineering occurs before model training.

    Hyperparameter tuning occurs during the model training stage. The goal of hyperparameter tuning is to generate better model versions. You can use different tuning strategies to automate the process of generating better model versions.

    Model evaluation occurs after model training. Model evaluation includes model performance and success metrics. When you perform hyperparameter tuning, model evaluation compares the different produced models and selects the most suitable model and hyperparameter combination.
    
    ✅ Hyperparameter tuning
    ✅ Model evaluation    
