A company wants to build an ML model to make predictions. The model's predictions must be interpretable.Which type of model has the HIGHEST interpretability?:
                    
    Linear regression models use a linear function to model the relationship between input features and output. Therefore, this model type helps you understand how each feature impacts the prediction. The coefficients directly indicate the influence of each feature. Therefore, this model type provides clear interpretation of the model's decision-making process.

    Neural network models have low interpretability compared to linear regression models. A neural network model can capture complex patterns. However, neural networks have a multilayered structure and non-linear transformations. With neural network models, it is difficult to understand how specific inputs lead to particular predictions.

    Models that use ensemble methods have low interpretability compared to linear regression models. Ensemble methods models combine multiple models. Individual models can be interpretable. However, the aggregation of many models makes it difficult to understand the overall decision-making process.

    LLMs have very low interpretability. LLMs are based on complex transformer neural network architectures with billions of parameters. Therefore, it is extremely difficult to understand how an LLM arrives at specific predictions or outputs
                    
    ✅ Correct Answer: Linear regression models



A company wants to use Amazon Bedrock to summarize customer documents that are in the company's database.Which metric will evaluate the accuracy of the summaries?:
                    
    BERTScore is a metric that you can use to evaluate the semantic similarity of text samples by comparing human-generated text to model-generated text. BERTScore uses pre-trained contextual embeddings from BERT models to calculate similarity between candidate and reference sentences. BERTScore can capture semantic similarities beyond exact word matches. Semantic similarities are important for evaluating summaries.

    RMSE is a metric that you can use to evaluate numeric predictions. You would typically use RMSE in regression problems. RMSE measures the standard deviation of residuals (prediction errors). RMSE is not suitable for assessing the accuracy of text summaries

    Toxicity is a metric that you can use to assess the level of toxicity in content from model outputs. The toxicity metric identifies potentially harmful or offensive content. Toxicity does measure how well a summary captures the key information from original customer documents.

    MAPE is a metric that you can use to evaluate the accuracy of numeric predictions. You would typically use MAPE in time series forecasting or regression problems. MAPE expresses accuracy as a percentage of the error. The percentage of the error is not applicable to text summaries.
    ✅ BERTScore 

Which prompt engineering technique involves providing a model with examples of the desired input/output mapping before asking the model to perform the task?:
                    
    Zero-shot prompting provides a model with a detailed prompt that describes the task or desired output. However, zero-shot prompting does not provide any additional training data that is specific to that task. The model uses preexisting knowledge and understanding of language to generate appropriate responses or outputs based solely on the prompt. Zero-shot prompting does not provide any examples to the model.

    Few-shot prompting provides a small number of examples to a language model to help the model understand the desired task before asking the model to generate outputs. This technique can improve performance compared to zero-shot prompting where no examples are given.

    Chain-of-thought prompting is a technique where a model is prompted to break down a complex problem into a series of steps or "thoughts" before arriving at a final answer. Chain-of-thought prompting asks the model to show its step-by-step reasoning process.

    ReAct prompting combines reasoning (Re) and action (Act). ReAct prompting provides explanations in a chain-of-thought format and associates the model's understanding with a task. An example of a task is an external REST API integration. ReAct prompting does not provide examples to the model before asking the model to perform a task.
    ✅ Few-shot prompting
    
                    
