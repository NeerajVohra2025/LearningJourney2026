🧠 Prompt, Completion & Inference  :   
        1) Prompt — “What you ask the model”:
             🔹 What is a Prompt?:
                     A prompt is the input you give to an AI model.
                    It tells the model what task to perform.
                    📌 Can include:
                            Instructions
                            Questions
                            Context
                            Examples
                            🔹 Simple Example:
                                    Prompt:
                                        "Summarize the following email in one sentence."
                    
                👉 You are telling the model what to do.      
                        🔹 Real-life analogy
                            🗣️ You ask a human:
                                    “Please explain this in simple terms.”
                                        That request = Prompt        
        
        2) Completion — “What the model replies”:  
            🔹 What is a Completion?:
                    A completion is the output generated by the model in response to the prompt.
                    🔹 Simple Example  :
                            Prompt:
                                "Summarize the following email in one sentence."
                            Completion:
                                "The email confirms the meeting schedule and requests confirmation."
                👉 The model’s answer = Completion
                        🔹 Real-life analogy 
                            🧠 Human hears your question → gives an answer
                                    That answer = Completion         
                                    
        3) Inference — “The process of generating the answer”:
            🔹 What is Inference?:
                        Inference is the process where:
                                A trained model
                                Uses its learned parameters
                                To generate a completion
                                From a prompt
                        📌 Happens after training
                        📌 Happens every time you call the model    


                    Prompt (Input)  "What is AWS?"
                         ↓
                    Inference (Model thinks using learned weights)   "Model processes the input using trained parameters"
                         ↓
                    Completion (Output)   "AWS is a cloud computing platform that provides on-demand IT services."
                    
        
        4) AWS Exam Mapping :
        
                    | Term       | Meaning in Exam                           |
                    | ---------- | ----------------------------------------- |
                    | Prompt     | Input sent to model                       |
                    | Completion | Output generated                          |
                    | Inference  | Prediction/output generation process      |
                    | Training   | Learning model parameters (NOT inference) |

        👉 Inference ≠ Training (common exam trap)
                Inference is when a trained model produces predictions or text.
                Each inference consumes tokens, so cost increases per prompt.
            Response speed = inference latency, not training.   
                
Types of Foundation Models:
    🔹 Large Language Model (LLM):  
            What it is
                An LLM is a model trained on massive text data to:
                    Understand language
                    Generate text
                    Answer questions
                    Summarize content
                    Reason over text
                Examples:
                    Chatbots
                    Text summarization
                    Q&A systems
            AWS examples:
                    Claude (Anthropic)
                    Llama
                    Titan Text models
            👉 Available via Amazon Bedrock    
           
    🔹 Diffusion Model
            What it is
            A diffusion model generates data (mostly images) by:
                Starting with noise
                Gradually removing noise
                Producing high-quality outputs
            Used for:
                Image generation
                Image editing
                Art creation
            Examples:
                Stable Diffusion
                Titan Image Generator (Bedrock)
            👉  Not used for chatbots or text reasoning     

    🔹 Multimodal Model
            What it is
            A multimodal model can process more than one data type:
                Text
                Images
                Audio
                Video
            Examples:
                Image + text question answering
                Describing images
                Document understanding (text + images)
            AWS example:
                Claude multimodal models (via Bedrock)

    🔹 Embedding Model
            What it is
            An embedding model converts data into numerical vectors that represent meaning.
            Used for:
                Semantic search
                Similarity comparison
                Retrieval-Augmented Generation (RAG)
            Recommendations:
            AWS example:
                Amazon Titan Embeddings (Bedrock)   

    🔹 Embedding
            An embedding is:
                A numerical representation of text, image, or audio that captures its meaning.  
            Example:
                "I love flying" → [0.21, 0.87, -0.14, ...]
    
    🔹 Vector
            A vector is:
                The mathematical form of an embedding (array of numbers).
            Vectors allow:
                Distance calculation
                Similarity search                     