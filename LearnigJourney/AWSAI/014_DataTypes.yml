🧠 AI Data Types:
    Understanding data types is foundational in AI.
        The type of data you have directly decides:
                Which model you can use
                Which AWS service fits best
                Which metrics matter in exams and real projects
         1. Structured Data 📊:           
                What It Is:
                    Structured data is highly organized information arranged in a predefined format with clear relationships between data points. Think of it as data that fits neatly into spreadsheets or database tables.
                    Key Characteristics:
                        Organized in rows and columns
                        Fixed schema with defined data types(every row follows the same format).
                        Easily searchable using SQL queries
                        Predictable format
                   💼 Business Example:
                        | Customer_ID | Age | Location   | Purchase_Amount | Member_Since |
                        |-------------|-----|------------|-----------------|--------------|
                        | 101         | 30  | Delhi      | 15000          | 2023-01-15   |
                        | 102         | 45  | Mumbai     | 8500           | 2022-11-20   |
                        | 103         | 28  | Bangalore  | 22000          | 2024-02-10   |       
                        CRM records
                        Sales transactions
                        Customer demographics        
               🤖 ML Models That Excel With Structured Data:
                        Support Vector Machines (SVM): – Classification tasks
                        Logistic Regression: – Binary outcomes (yes/no, fraud/legitimate)
                        Decision Trees & Random Forests: – Rule-based predictions
                        XGBoost/LightGBM: – High-performance gradient boosting
                        Linear Regression: – Predicting continuous values               
                  ✅ Traditional ML—not GenAI.:      
                  
               ☁️ AWS Services & Tools:
                       Service                  Primary Use Case 
                       Amazon SageMaker:        Build custom ML models (classification, regression, forecasting)
                       Amazon Redshift ML:      Create ML models directly within your data warehouse
                       AWS Glue + SageMaker:    ETL pipelines to clean and prepare data for modeling
                       Amazon Athena:           Query structured data in S3 using SQL
                 
                📊 Key Performance Metrics:
                      Classification Tasks (e.g., Will customer churn? Is email spam?):
                                Accuracy: Percentage of correct predictions overall
                                Precision: Of all predicted "Yes," how many are actually "Yes"?
                                Recall: Of all actual "Yes," how many did we catch?
                                F1-Score: Harmonic mean of precision and recall                 

                     Regression Tasks (e.g., Predict house price, forecast revenue):
                                MAE (Mean Absolute Error): Average prediction error in actual units
                                RMSE (Root Mean Squared Error): Penalizes larger errors more heavily
                                R² (R-squared): How well the model explains variance (0 to 1)     
                    
                Common Structured Subtypes:
                    Tabular Data: Customer records (name, age, income)   
                    Time Series Data: Stock prices every minute, weather hourly                

                Exam Tips 🎯:
                        Keywords to Watch: "Tabular data," "relational database," "customer attributes," "SQL table"
                        Rule: Structured/Tabular data → Traditional ML → Use Amazon SageMaker
                        ❌ Not for Generative AI tasks
                        ✅ Perfect for predictive analytics and classification                   


                
        2. Semi-Structured Data: 🧩
             What It Is:
                Data that doesn't fit rigid table structures but has some organizational properties through tags, hierarchies, or key-value pairs. It's the middle ground between structured and unstructured.
                Not rigidly tabular, but contains metadata (e.g., JSON, XML, logs).
                Common in event-driven systems and NoSQL databases.
                🧾 Example (JSON):
                        {
                          "user": "Neeraj",
                          "action": "purchase",
                          "amount": 1200,
                          "timestamp": "2026-01-15T10:30:00Z"
                        }   
                🏢 Business Examples:
                        Application logs
                        Event data
                        NoSQL records
             🤖 How It’s Used:
                Preprocessed into structured format → fed into traditional ML pipelines.
                Can also be parsed by LLMs for contextual understanding.
              🎯 Exam Keywords:
                    “JSON logs”, “event data”, “NoSQL”
                    ➡️ Treated as structured after transformation.
                        Semi-structured → Transform → Treated as structured
             AWS Services & Tools:   
                | Service | Primary Use Case |
                |---------|------------------|
                | **AWS Glue** | ETL to parse JSON/XML and convert to structured format |
                | **Amazon Athena** | Query JSON/Parquet files in S3 using SQL |
                | **Amazon DynamoDB** | Store and retrieve semi-structured NoSQL data |
                | **Amazon SageMaker** | Train models on transformed data |             
                Exam Tips 🎯:
                    Keywords: "JSON logs," "event data," "NoSQL," "API responses," "nested structures"
                    Rule: For text analytics → Amazon Comprehend | For generative AI → Amazon Bedrock 
       
