    4. Time Series Data ⏰📈:
           What It Is:
                Data points collected sequentially over time, where the order matters. Each observation is timestamped, and patterns emerge from temporal relationships.
           Example 1: E-commerce Sales Forecasting
           Example 2: Energy Consumption Prediction
                        - Hourly electricity usage in a building
                        - Forecast demand to optimize energy procurement     
           Example 3: Stock Market Analysis   
                    - Minute-by-minute stock prices
                    - Predict future price movements   
          Example 4: Website Traffic Monitoring
                    - Hourly visitor counts
                    - Detect unusual spikes (potential DDoS or viral content)      
          Example 5: Inventory Management
                    - Weekly product demand across stores
                    - Optimize restocking schedules      
         🤖 ML Models for Time Series: 
                    - **ARIMA/SARIMA** – Classical statistical methods
                    - **LSTM/GRU** – Deep learning for sequences
                    - **Prophet** – Facebook's forecasting tool
                    - **Transformers** – Modern state-of-the-art (Temporal Fusion Transformers)
          AWS Services & Tools:      
