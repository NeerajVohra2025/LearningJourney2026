            |---------|------------------|---------|
            | **Amazon Forecast** | Automated time series forecasting using ML | Predict product demand for next quarter |
            | **Amazon Lookout for Metrics** | Detect anomalies in time series data | Alert when website traffic drops unexpectedly |
            | **Amazon SageMaker** | Build custom time series models | Train specialized LSTM for financial predictions |
            | **AWS IoT Analytics** | Time series analysis for IoT sensor data | Monitor equipment health over time |      
                          
         Key Performance Metrics:                  
            | Task | Metrics | What They Mean |
            |------|---------|----------------|
            | **Forecasting** | WAPE (Weighted Absolute Percent Error), RMSE, MAPE | How far off are predictions from actual values? |
            | **Anomaly Detection** | Precision of alerts, Recall of real anomalies | Balance false alarms vs. missed incidents |     
        Exam Tips 🎯:
            **Keywords:** "Forecast," "trend over time," "historical data," "seasonal patterns," "predict future"

            **Rule:**  
