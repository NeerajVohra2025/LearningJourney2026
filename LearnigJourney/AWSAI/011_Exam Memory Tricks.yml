Inference is what happens after a machine learning model has been trained. It’s the process of using the trained model to make predictions  or decisions on new, unseen data:
    Think of it like this:
    Training = studying for an exam (learning from past examples).
    Inference = taking the exam (answering new questions using what you learned).
    
