Overfitting Remedies:  
    Regularization (e.g., L1/L2)
    Cross-validation
    Feature selection or reduction
    Increasing training data diversity
    Early stopping (for neural networks)
    Simplifying the model architecture   
    To fix overfitting and improve generalization, the most effective action is to:
        Add more diverse training examples
        Ensure the data better represents real-world scenarios
        Retrain the model so it learns general patterns, not noise
        Retrain the model with a larger, more diverse, and representative dataset (to reduce overfitting).:
        ❌ Why other actions are wrong (exam traps)    
        
            | Parameter / Action   | Why wrong                          |
            | -------------------- | ---------------------------------- |
            | Increase temperature | ❌ Increases randomness             |
            | Increase max tokens  | ❌ Controls length, not randomness  |
            | Change top-k only    | ❌ Indirect, temperature is primary |
            | Fine-tune the model  | ❌ Much higher effort               |
            | Change training data | ❌ Not inference-time control       |

