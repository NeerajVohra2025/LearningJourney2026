Fine-tuning:
    Fine-tuning trains the model further
    Requires labeled, domain-specific data
    Updates internal parameters (weights)
    Results in better task/domain accuracy
    Fine-tuning creates a customized version of the foundation model for the customer:
        The base FM remains unchanged
        You get a customized copy of the model 
        The tuned model is private to your account
        Used repeatedly without re-providing examples
        | Technique           | Uses Labeled Data | Changes Weights | Persistent   |
        | ------------------- | ----------------- | --------------- | ------------ |
        | Prompt engineering  | ❌ No              | ❌ No            | ❌ No         |
        | In-context learning | ❌ No              | ❌ No            | ❌ No         |
        | **Fine-tuning**     | ✅ Yes             | ✅ Yes           | ✅ Yes        |
        | RAG                 | ❌ No              | ❌ No            | ✅ (via data) |  
    Fine-tuning is the method that updates (modifies) the internal weights of a large language model (LLM) using additional training data—typically labeled, task- or domain-specific data.
    This leads to persistent changes in the model’s behavior and improved performance for the targeted use case. 
    Explanation:
        Fine-tuning involves continuing the training process of a pre-trained LLM on a task-specific dataset.
        During this process, the model’s internal parameters (weights) are updated via backpropagation and optimization (e.g., using gradient descent).
        This allows the model to adapt its knowledge to a specific domain or task (e.g., legal document summarization, medical Q&A).
        ✅ Result: The model’s weights are permanently modified, leading to improved performance on the target task      

        

What continued pre-training does:
    Uses unlabeled domain-specific data (e.g., product descriptions, marketing copy)
    Further trains the FM to better understand the language, style, and terminology of the domain
    Improves performance without requiring labels
    Makes the model more specialized while keeping general knowledge
    This is ideal for advertising, branding, and marketing language adaptation.
    Continued pre-training is the process of providing unlabeled data to a pre-trained model to expose a model to specific topic areas. Continued pre-training does not increase the consistency of an LLM by providing the model with access to external sources of knowledge.
    
