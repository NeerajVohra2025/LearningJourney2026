How do embeddings help improve the accuracy of large language models (LLMs)?:   
    🧠 How embeddings help (step by step)
            1️ Convert text into meaning-aware vectors:
                Embeddings turn words, sentences, or documents into high-dimensional vectors where:
                    Similar meanings → vectors are close together
                    Different meanings → vectors are far apart
                This captures semantic similarity, not just keywords.
            2️ Enable semantic search and retrieval:
                When an LLM is paired with embeddings:
                    User queries are embedded
                    The system retrieves most relevant documents/chunks
                    The LLM generates answers using accurate, relevant context
                    This is the foundation of Retrieval Augmented Generation (RAG)  
           3️ Reduce hallucinations and irrelevant answers:
                Because the model:
                    Grounds its response in retrieved, relevant data
                    Uses domain-specific knowledge instead of guessing
                    👉 Accuracy improves and hallucinations decrease. 
           4️ Improve understanding of context and intent:
                Embeddings help the system understand:
                    Synonyms (“price” ≈ “cost”)
                    Related concepts (“engine” ≈ “horsepower”)
                    User intent beyond exact wording     
      Embeddings transform text into numerical vectors that represent semantic meaning, not just symbols.:
        In modern LLMs, contextual embeddings (like those from Transformers) allow the same word (e.g., “bank”) to have different vector representations depending on whether it appears in “river bank” or “bank account.” 
     This context-aware representation enables the model to:
            Better understand user input,
            Generate more relevant and accurate responses,
            Handle ambiguity and nuance in language.
        This deep semantic grounding is foundational to the performance of LLMs in tasks like question answering, summarization, and dialogue. :

A company wants to evaluate a large language model (LLM) from Amazon Bedrock. Select the correct model evaluation type from the following list for each use case. Each model evaluation type should be selected one or more times. (Select FOUR.):
     When evaluating LLMs in Amazon Bedrock, the choice depends on:  
        What is being measured (objective vs subjective)
        Whose dataset is used (built-in vs company-provided)       
        
        1️ Accuracy of the text summarization on the built-in dataset:
            ✅ Automatic model evaluation:
                Why?
                    Accuracy on summarization can be measured using automated metrics (for example ROUGE)
                    Uses a built-in dataset
                    No human judgment required
                📌 Objective + built-in dataset → Automatic
        
        2️ Toxicity of the text generation on the built-in dataset  :
            ✅ Automatic model evaluation:
                Why?
                    Toxicity detection uses automated classifiers
                    AWS provides built-in safety/toxicity benchmarks
                    No subjective business context needed
                📌 Safety metric + built-in dataset → Automatic
                
        3️ Factual correctness of the generated response on the company-provided dataset:    
            ✅ Human-in-the-loop model evaluation
                Why?
                    “Factual correctness” depends on company-specific knowledge
                        The dataset is company-provided
                        Requires human judgment to verify facts
            📌 Company data + correctness → Human-in-the-loop
            
        4️ Linguistic quality of the text generation on the company-provided dataset:
            ✅ Human-in-the-loop model evaluation    
                Why?
                    Linguistic quality (clarity, tone, fluency) is subjective
                    Company standards vary
                    Best assessed by humans
                📌 Subjective quality + company data → Human-in-the-loop   

            | Use Case                                       | Correct Evaluation Type                |
