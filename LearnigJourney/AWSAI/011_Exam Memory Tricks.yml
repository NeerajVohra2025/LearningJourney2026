A music company wants to build a system to search for songs by the meaning of the lyrics. Which solution will meet this requirement?:
    The key phrase in the question is:
        “search for songs by the meaning of the lyrics”
        This is semantic search, not keyword search.
    👉 This is exactly what embeddings + vector search are designed for.:
            ✅ How the solution works (step by step):
                1️ Generate embeddings:
                        Use Amazon Bedrock embedding models
                        Convert each song’s lyrics into numerical vectors that capture meaning
                2️ Store embeddings:
                        Store vectors in Amazon OpenSearch Service (vector index)
                3️  Search by meaning:
                        Convert the user’s search query into an embedding
                        Perform similarity search to find songs with the closest meaning
                4️   Return relevant songs:
                        Results are based on semantic similarity, not exact words  
            Amazon OpenSearch Service supports k-nearest neighbor (k-NN) vector search, allowing you to:
                Index embeddings of song lyrics,
                Convert a user’s query (e.g., “songs about heartbreak”) into an embedding,
                Retrieve songs whose lyrics have similar semantic meaning.
                This directly fulfills the requirement of searching by the meaning of the lyrics. 
        ❌ Why other options are wrong (exam traps)
