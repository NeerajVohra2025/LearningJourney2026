            | Accuracy of summarization (built-in dataset)   | **Automatic model evaluation**         |
            | Toxicity of text generation (built-in dataset) | **Automatic model evaluation**         |
            | Factual correctness (company dataset)          | **Human-in-the-loop model evaluation** |
            | Linguistic quality (company dataset)           | **Human-in-the-loop model evaluation** |
                                
