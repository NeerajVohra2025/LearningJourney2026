GAN (Generative Adversarial Network): Primarily used for generating synthetic data (e.g., images), not classification. GANs require large datasets and are unstable on small data. Not suitable.
Transformer: Excels in unstructured data (e.g., text, images) but requires massive datasets and computational resources. Transformers overfit easily on small structured/tabular data. Not suitable.
CNN (Convolutional Neural Network): Designed for grid-like data (e.g., images, time-series). CNNs need large datasets to train effectively and perform poorly on non-spatial structured/tabular data. Not suitable.
SVM (Support Vector Machine): A classic shallow machine learning model ideal for small structured datasets. It handles high-dimensional feature spaces well, avoids overfitting with limited data, and works efficiently on tabular data (e.g., CSV files). Best fit.

Clustering: Unsupervised technique that groups data without predefined labels. Since it doesn't use class labels, class imbalance does not apply.
Regression: Predicts continuous numerical values (e.g., house prices). There are no discrete classes, so class imbalance is irrelevant.
Dimensionality reduction: Techniques like PCA or t-SNE reduce feature dimensions without using class labels. Class imbalance does not directly affect these methods.
Comprehend: An NLP service for text analysis (e.g., sentiment, entities). Does not process images.
Rekognition: An AWS computer vision service specifically designed for image and video analysis, including label detection (e.g., identifying objects, scenes, activities like "car," "beach," or "person").
Transcribe: An automatic speech recognition (ASR) service for converting speech to text. No image capabilities.
Bedrock: A service providing access to foundation models (e.g., LLMs like Claude, Titan) for text generation, chatbots, or limited image generation (via models like Stable Diffusion). Not designed for label detection; lacks built-in image analysis features.
SageMaker: A machine learning development platform for building, training, and deploying custom models. While it supports vision tasks via frameworks (e.g., TensorFlow, PyTorch), it does not provide out-of-the-box pre-trained vision APIs. Users must build/train models themselves or use JumpStart (which offers some pre-trained models but isn't API-focused).
Rekognition: A dedicated computer vision service offering pre-trained APIs for image/video analysis. It requires zero ML expertise and provides immediate access to vision capabilities like:
Object/scene detection (e.g., "car," "beach")
Facial analysis (emotion, age range)
Text detection in images
Content moderation
No training or infrastructure management need
Bedrock: Provides access to foundation models (e.g., Anthropic Claude, Stable Diffusion) for generative AI tasks. While it includes some multimodal models (e.g., for image generation/captioning), it lacks dedicated pre-trained vision APIs for core tasks like object detection or facial recognition. It focuses on LLMs/generative workflows, not turnkey vision APIs.
Forecast: A time-series forecasting service for predicting numerical trends (e.g., sales, demand). No vision capabilities whatsoever.

Real-time inference: Requires immediate results (low-latency), but processing a 100-MB document typically takes seconds/minutes. This forces users to wait, violating the requirement. ❌
Streaming: Processes data in chunks as it arrives (e.g., video/audio streams). However, a static 100-MB document is already fully available, making streaming unnecessary. It also doesn’t inherently eliminate wait times for large files. ❌
Asynchronous inference: Decouples request submission from result retrieval. Users submit the document, receive an immediate acknowledgment (e.g., a job ID), and fetch results later via callbacks/webhooks. Perfectly matches the requirement: no waiting, scalable for large files, and standard in cloud services (e.g., AWS SageMaker batch transform, Azure ML async endpoints). ✅

Edge inference: Runs models on edge devices (e.g., phones, IoT sensors) to reduce latency. However, 100-MB documents overwhelm edge hardware (limited memory/bandwidth), and processing still blocks the user. Edge is for latency-sensitive tasks, not large-file throughput. ❌

GPU training:
Serverless does not support GPU training. Training requires persistent, long-running GPU instances (e.g., SageMaker training jobs). Inference ≠ training. ❌

