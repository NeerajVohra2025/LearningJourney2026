🔍 What the question is really asking:
            Uses the Generative AI Security Scoping Matrix
            Asks which solution scope gives the MOST ownership of security responsibilities
            Ownership increases as you control more of the stack
            👉 In AWS shared responsibility models (including GenAI), more control = more responsibility.    
        
        🧩 Understand the four scopes (from least → most responsibility):
                A. Third-party enterprise app with embedded GenAI:
                    You’re just a consumer
                    Vendor owns most security controls
                    ❌ Least responsibility
                
                B. Building an app using a third-party FM:
                    You manage the application
                    Provider manages the model
                    ❌ Moderate responsibility
                
                C. Fine-tuning a third-party FM:
                    You now manage:
                        Your data
                        Training process
                        Still not the base model
                        ❌ More responsibility, but not the most
                        
                D. Build and train a GenAI model from scratch:
                    You own:
                        Data
                        Model architecture
                        Training
                        Evaluation
                        Deployment
                        Security controls
                        AWS only provides the infrastructure
                    ✅ This gives the MOST ownership of security responsibilities        
                            
                    
