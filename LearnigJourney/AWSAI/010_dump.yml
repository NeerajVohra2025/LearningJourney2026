🔍 Key requirements in the question:
            LLM application using Amazon Bedrock
            Customer data stored in Amazon S3
            Security policy: each team can access only its own customers’ data
            Needs strong isolation and enforcement, not trust-based controls
        This is an IAM / least-privilege access control problem.    

        ✅ Why Option A is correct
                Creating a separate Amazon Bedrock service role per team allows you to:
                Attach team-specific IAM policies
                Restrict S3 access to only that team’s customer prefixes/buckets
                Enforce hard security boundaries at the role level
                Align perfectly with AWS least privilege and defense-in-depth
                📌 Bedrock assumes the service role → the role’s S3 permissions strictly control what data the model can access.    
        ❌ B. Ask teams to specify the customer name in each request
                Relies on user honesty
                ❌ Not enforceable security
                ❌ Violates least privilege      
        ❌ C. Redact personal data + update bucket policy
                Redaction ≠ access control
                Teams could still access other customers’ data
                ❌ Does not meet isolation requirement        
        ❌ D. One Bedrock role with full S3 access
                Central role has too much privilege
                IAM roles for teams don’t protect Bedrock’s access
                ❌ Breaks least privilege and blast-radius control   

        🎯 AWS AI Practitioner Exam Tip
                If the question mentions:
                Bedrock + S3
                Multiple teams
                “Only their own data”

                ➡️ Always think: IAM roles + least privilege, not request parameters or shared roles.            
                
