    🧠 What usually causes this in vision models?:
    Most commonly:
        Training data is not representative
        Some groups are overrepresented or underrepresented
        Model learns skewed patterns
    This is the definition of sampling bias.   
    ✅ Why Sampling bias is correct:
        Sampling bias occurs when:
            Training data does not reflect the true population
            Certain groups appear more often or in biased contexts
            The model learns unfair associations
        In this case:
