🔍 The key symptom here is:
        Performs well on training data
        Performs poorly on new (unseen) data
        👉 This is a classic case of overfitting.
        Why option B is correct:
        Increasing the regularization parameter (e.g., L1/L2 regularization) penalizes overly complex models.
        This forces the model to learn more general patterns instead of memorizing the training data.
        As a result, generalization to new data improves, resolving the issue.            
        ❌ Why the other options are incorrect
            | Option                         | Why it’s not correct                                              |
            | ------------------------------ | ----------------------------------------------------------------- |
            | **A. Decrease regularization** | Makes the model even more complex → worsens overfitting           |
            | **C. Add more features**       | Can increase complexity and overfitting unless carefully selected |
            | **D. Train for more epochs**   | Likely increases overfitting further                              |
            
        🏆 Final Takeaway
            When a model:
            ✅ Fits training data well
            ❌ Fails on new data
            ➡️ Reduce model complexity
            ➡️ Increase regularization  

🧠 Explanation:
        Explainability in AI refers to how easily humans can understand why a model made a particular decision—this is especially critical in regulated domains like financial services (loan approvals, audits, compliance).
        Why Model Complexity matters most:
        Simpler models (e.g., linear models, decision trees) are generally more explainable.
        Highly complex models (e.g., deep neural networks, large foundation models) behave more like black boxes, making decisions harder to interpret.
        As model complexity increases, explainability decreases, which directly impacts auditability and trust.            
        ❌ Why the other options are not correct
