        Guardrails = Safety + compliance
        Clarify = Bias detection
        Canvas = No-code ML
        SageMaker = Full ML lifecycle
        Bedrock = Foundation models
        K-means = Grouping
        Inference = Prediction
        EDA = Stats + visualization
        
        
🔥 TOP 30 TRICK QUESTIONS (AIF-C01):
    1️) Company wants LLM to use internal documents without retraining:
    ✅ Answer: Retrieval Augmented Generation (RAG)
    ❌ Trick: Fine-tuning (too expensive, static)
    
    2️) LLM gives wrong facts → want to reduce hallucinations:
    ✅ Answer: RAG
    ❌ Trick: Increase epochs / temperature tuning
    
    3) Want to change tone/style of LLM responses quickly:
    ✅ Answer: Prompt engineering
    ❌ Trick: Fine-tuning
    
    4️) Want LLM to understand domain-specific scientific terms:
    ✅ Answer: Domain adaptation fine-tuning
    ❌ Trick: Few-shot prompting (insufficient)
    
    5️) Need least cost contextual chatbot using company policies:
    ✅ Answer: RAG
    ❌ Trick: Retraining LLM
    
    6️) Model performs well on training but fails on new data:
    ✅ Answer: Increase regularization
    ❌ Trick: Train longer (worsens overfitting)
    
    7️) Model predictions are biased → detect bias:
    ✅ Answer: Amazon SageMaker Clarify
    ❌ Trick: CloudWatch
    
    8️) Prevent LLM from generating PII + get alerts:
    ✅ Answer: Bedrock Guardrails + CloudWatch
    ❌ Trick: Macie (storage only)
    
    9️) Want no-code ML for business users:
    ✅ Answer: SageMaker Canvas
    ❌ Trick: SageMaker Studio
    
    🔟 Want fully automated model tuning
    ✅ Answer: Amazon SageMaker
    ❌ Trick: Comprehend / Athena
    
    1️1) Want to compare LLM toxicity with least overhead:
    ✅ Answer: Automatic model evaluation
    ❌ Trick: Human evaluation (expensive)
    
    Chatbot must learn from feedback automatically:
    ✅ Answer: Reinforcement learning
    ❌ Trick: Supervised learning
    
    Student copies AI content for essays:
    ✅ Answer: Plagiarism
    ❌ Trick: Hallucination
    
    Want to protect against prompt injection:
    ✅ Answer: Adversarial prompting
    ❌ Trick: Zero-shot prompting
    
    Attack that reveals system prompt:
    ✅ Answer: Extracting the prompt template
    ❌ Trick: Prompt persona switch
    
    LLM safety bypass during testing:
    ✅ Answer: Jailbreak
    ❌ Trick: Penetration testing
    
    Want explainable AI decisions:
    ✅ Answer: Lower model complexity
    ❌ Trick: Training time
    
    Employees want to adjust feature weights manually:
    ✅ Answer: Logistic regression
    ❌ Trick: Neural networks
    
    Group customers by behavior:
    ✅ Answer: K-means
    ❌ Trick: K-NN (classification, not grouping)
    
    Model predicting missing words in text:
    ✅ Answer: BERT-based model
    ❌ Trick: Topic modeling
    
    Security camera flags specific ethnic group:
    ✅ Answer: Sampling bias
    ❌ Trick: Confirmation bias
    
    Predict future prices accurately:
    ✅ Answer: Increase training data volume
    ❌ Trick: Reduce training data
    
    Fastest way to index unlabeled images/audio/video:
    ✅ Answer: Rekognition + Transcribe + Comprehend
    ❌ Trick: Build custom models
    
    Encrypt Bedrock custom model artifacts:
    ✅ Answer: AWS KMS
    ❌ Trick: Secrets Manager
    
    SageMaker jobs must run without internet:
    ✅ Answer: Network isolation
    ❌ Trick: IAM roles
    
    Improve image generation specificity:
    ✅ Answer: Increase CFG scale
    ❌ Trick: Increase generation steps
    
    Want to reduce chatbot operational cost:
    ✅ Answer: Decrease prompt tokens
    ❌ Trick: Provisioned throughput
    
    Measure chatbot financial impact:
    ✅ Answer: Cost per conversation
    ❌ Trick: Number of conversations
    
    Want FM to stay updated with new data:
    ✅ Answer: Continuous pre-training
    ❌ Trick: Static training
    
    🧠 FINAL MEMORY RULES
        RAG = cheapest + private data
        Fine-tuning = behavior change
        Prompt engineering = fastest fix
        Clarify = bias
        Canvas = no-code
        CFG ↑ = image detail ↑
        Overfitting = increase regularization
        Grouping = K-means
        Inference = predictions
        
