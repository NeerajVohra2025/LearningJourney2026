🔍 What the question is really describing
        Model performs well on training data
        Performance drops in production
        This is the textbook symptom of overfitting:
            The model learned the training data too well but failed to generalize to real-world data.   

    🧠 How do you mitigate overfitting?:
            You want the model to:
            See more diverse examples
            Learn general patterns, not noise
            The most effective and safest fix is:
            ➡️ Train with more data    

    ✅ Why Increasing the training data volume is correct
        Increasing training data:
            Improves generalization
            Reduces overfitting
            Helps the model learn real-world variability
            Is a best-practice solution in ML
            This directly addresses the gap between training and production performance.            
        ❌ A. Reduce the volume of training data
                Makes overfitting worse
                Less data → poorer generalization    
            
        ❌ B. Add hyperparameters
                Hyperparameters don’t fix overfitting by themselves
                Vague and not a corrective action    
                
        ❌ D. Increase model training time
                Likely worsens overfitting
                Model memorizes training data even more        
                
