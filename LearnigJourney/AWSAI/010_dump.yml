🔍 Key clues in the question:
        Model generates images of humans
        Input data is biased
        Specific attributes affect image generation
        Bias originates from the data
        This clearly indicates a data bias problem, not an inference-time or monitoring problem  

    🧠 What is the REAL problem?
            The training dataset:
            Over-represents some attributes (e.g., one gender or ethnicity in certain professions)
            Under-represents others
            ➡️ The model learns and amplifies this imbalance
            To fix bias caused by imbalanced or skewed data, you must fix the data distribution. 

    ✅ Why Data Augmentation for Imbalanced Classes is correct:
            Data augmentation:
            Increases representation of underrepresented groups
            Balances attribute distribution
            Reduces bias learned during training
            Is a proactive bias mitigation technique
            ✔️ Examples
            Generate more images of underrepresented genders in certain professions
            Balance age, ethnicity, or other sensitive attributes
            This directly addresses:
            “Input data is biased and affects image generation”            
            
        ❌ B. Model monitoring for class distribution
                Detects bias after deployment:
                    Does NOT fix the problem
                    ➡️ Reactive, not corrective    
        ❌ C. Retrieval Augmented Generation (RAG)
                    Used for grounding LLM outputs with external knowledge
                    ❌ Not related to image bias or training data imbalance   
        ❌ D. Watermark detection for images
                    Used to detect AI-generated images
                    ❌ Has nothing to do with training bias       


