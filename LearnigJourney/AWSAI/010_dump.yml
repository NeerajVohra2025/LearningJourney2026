        🧠 What is the ONLY guaranteed way to prevent leakage?:
            ✅ Remove the confidential data from training and retrain
            If sensitive data is in the training set:
            The model may memorize it
            Post-processing (masking, encryption) does NOT stop the model from using it internally
            Therefore:
            Delete the compromised model
            Remove confidential data
            Retrain with a clean dataset
            This is the only defensible and exam-correct approach.
        ❌ B. Dynamic data masking
                Masks output after generation
                ❌ Model still reasons using confidential data    
        ❌ C. Encrypt inference responses
                Encryption protects data in transit/storage
                ❌ Does not stop confidential data from appearing in responses        
        ❌ D. Encrypt model with AWS KMS
                Protects model artifacts at rest
                ❌ Does NOT prevent memorization or leakage  
        🎯 AWS AI Practitioner Exam Tip
                If a question mentions:
                Confidential / sensitive data
                Model memorization
                Preventing leakage
                ➡️ Always fix it at the training data level, not at inference or encryption.        
                
                
