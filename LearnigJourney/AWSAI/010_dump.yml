        | -------------------------------- | -------------------------------------------------------- |
        | **B. Training time**             | Affects cost and speed, not how decisions are explained  |
        | **C. Number of hyperparameters** | Impacts tuning complexity, not decision interpretability |
        | **D. Deployment time**           | Operational concern, unrelated to explainability         |
        
        
