     👤 Part 5: Identity & Access Control (IAM):
                🔑 IAM Core Concepts – Your Digital Badge System:   
                        | Identity  | Purpose           | Example        |
                        | --------- | ----------------- | -------------- |
                        | IAM User  | Human access      | dev-alice      |
                        | IAM Group | Permission bundle | data-engineers |
                        | IAM Role  | Temporary access  | EC2 → S3       |
                        📌 Best Practice:
                                Apps should use IAM Roles, not access keys.       

                📜 IAM Policies — “Permission rules”:
                    Policies define:
                        Who can act
                        What they can do
                        Which resource
                    ⚠️ Critical IAM Best Practices:
                            Never use the root account for daily tasks.
                            Prefer IAM Roles over access keys (especially for EC2, Lambda, ECS).
                            Rotate keys every 90 days—or better yet, eliminate them with roles.
                            Tag resources → enforce policies like “All S3 buckets must have env=prod”.
                        
