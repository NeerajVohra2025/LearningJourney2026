    Agents:
    Agents are the core building block in your apps. An agent is a large language model (LLM) configured with instructions, tools, and optional runtime behavior such as handoffs, guardrails, and structured outputs.

    🧠 1. What This Configuration Represents:
    Agent = Identity + Behavior + Capabilities + Governance + Execution Controls

    🏗️ 2. Enterprise Mapping:
    | Category          | Properties                           | Layer             |
    | ----------------- | ------------------------------------ | ----------------- |
    | Identity          | name                                 | Domain            |
    | Behavior          | instructions, prompt                 | Application       |
    | Orchestration     | handoffs, handoff_description        | Application       |
    | Intelligence      | model, model_settings                | Infrastructure    |
    | Capabilities      | tools, mcp_servers                   | Interface         |
    | Governance        | guardrails                           | Domain + Security |
    | Output Control    | output_type                          | Application       |
    | Lifecycle         | hooks                                | Infrastructure    |
    | Execution Control | tool_use_behavior, reset_tool_choice | Runtime           |

    🔍 3. Property-by-Property Deep Explanation (Architect View):
    🔹 1. name (Identity Layer)
    👉 Defines who the agent is
    "Finance Risk Evaluator Agent"
    ✔ Used in:
    Logging
    Tracing
    Handoff routing
    👉 Enterprise Rule:
    Name should reflect capability + domain

    🔹 2. instructions (Behavior Brain):
    👉 This is the system prompt
    "You are a finance risk agent. Always validate loan eligibility."
    ✔ Can be:
    Static
    Dynamic (function-based)
    👉 Enterprise Rule:
    ❌ Never put business logic here
    ✅ Only behavior + boundaries


    🔹 3. prompt (Advanced Prompt Control):
    👉 Fine-grained control using OpenAI Responses API
    Used for:
    Templates
    Structured prompt injection
    Multi-turn formatting

    👉 Enterprise Use:
    Standardized prompt templates across organization

    🔹 4. handoff_description (Agent Discovery):
    👉 Metadata for orchestration
    "Handles financial risk calculations"
    ✔ Helps orchestrator decide:
    Which agent to call


    🔹 5. handoffs (Multi-Agent Orchestration):
    👉 Enables:
    Agent A → Agent B
    ✔ Core of multi-agent systems
    👉 Two enterprise patterns:
    Manager → Specialist
    Peer-to-peer delegation


    🔹 6. model (LLM Selection):
    👉 Example:
    gpt-4.1 / gpt-4o / gpt-5 (future)
    ✔ Choose based on:
    Cost
    Latency
    Reasoning need



    🔹 7. model_settings (Tuning Layer):
    Controls:
    temperature
    top_p
    tool_choice
    👉 Enterprise Strategy:

    | Use Case | Temperature |
    | -------- | ----------- |
    | Finance  | 0.0         |
    | Chat     | 0.7         |
    | Creative | 0.9         |


    🔹 8. tools (Capability Layer):
    👉 This is how agents act in real world
    Examples:
    API calls
    DB queries
    File search
    👉 Enterprise Rule:
    ❌ Never allow direct system access
    ✅ Always go via tools


    🔹 9. mcp_servers (Enterprise Integration Layer):
    👉 MCP = Model Context Protocol
    ✔ Standardized integration for:
    Internal tools
    External services
    👉 Enterprise Benefit:
    Plug-and-play tool ecosystem

    🔹 10. mcp_config (Governance on MCP):
    Controls:
    Schema strictness
    Error handling
    Tool formatting
    👉 Enterprise Use:
    Standardization across org

    🔹 11. input_guardrails (Security Layer):
    👉 Runs BEFORE execution
    ✔ Validates:
    User input
    Injection attacks
    Policy violations

    🔹 12. output_guardrails (Trust Layer):
    👉 Runs AFTER execution
    ✔ Prevents:
    Hallucinations
    Sensitive data leaks
    Invalid responses


    🔹 13. output_type (Structured Output):
    👉 Replace free text with schema
    {
      "risk_score": number,
      "decision": "approved | rejected"
    }
    ✔ Critical for:
    APIs
    Automation
    Downstream systems


    🔹 14. hooks (Lifecycle Control):
    👉 Event-based callbacks
    Examples:
    before_run
    after_run
    on_error
    👉 Enterprise Use:
    Logging
    Auditing
    Metrics

    🔹 15. tool_use_behavior (Execution Strategy):
    Controls:
    LLM → Tool → LLM → Tool → ...
    OR
    LLM → Tool → END
    👉 Enterprise Decision:
    Iterative reasoning vs single-shot execution

    🔹 16. reset_tool_choice (Loop Protection):
    👉 Prevents infinite loops
    ✔ Default: TRUE
    👉 Enterprise Rule:
    Always keep enabled unless debugging


