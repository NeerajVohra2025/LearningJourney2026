    Avoid over-engineering:
    Start single agent
    Scale to multi-agent

    ✅ 4. Tools = Capability Layer
    Agents should not directly access systems
    Always go via tools

    ✅ 5. Guardrails First, Not Last
    Security + correctness

    ✅ 6. Observability is Mandatory
    No tracing = no production readiness

