🚀 Step-by-Step: Create Helm Chart for WordPress + MySQL

📁 Step 1: Create Chart
helm create wordpress-chart
cd wordpress-chart

✏️ Step 2: Update values.yaml
mysql:
  password: neeraj!
  storage: 20Gi

wordpress:
  storage: 20Gi
  
🔐 Step 3: Secret Template
apiVersion: v1
kind: Secret
metadata:
  name: mysql-pass
type: Opaque
data:
  password: {{ .Values.mysql.password | b64enc }}

💾 Step 4: PVC Template (MySQL)
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mysql-pv-claim
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.mysql.storage }}

⚙️ Step 5: MySQL Deployment   
Uses Secret
Mounts /var/lib/mysql
Uses PVC


🌐 Step 6: WordPress Deployment
Connects to MySQL using service
Uses same secret
Mounts /var/www/html


🚀 Step 7: Install Chart
helm install wordpress-release .

🎯 Final Takeaways
Problem:
Multiple YAML + hardcoding

Solution:
Helm

Benefits:
✔ Reusable
✔ Scalable
✔ Easy upgrades
✔ Easy rollback

🎯 Interview Answer:
"Helm simplifies Kubernetes deployments by packaging multiple YAML files into reusable charts and enabling dynamic configuration using values files, making deployments scalable and maintainable."


🚀 1. Production Helm Chart (High-Level Architecture):
Helm Chart
   ├── MySQL (StatefulSet + PVC + Secret)
   ├── WordPress (Deployment + PVC)
   ├── Services
   ├── Probes (health checks)

📁 Chart Structure (Production Ready):
wordpress-prod/
 ├── Chart.yaml
 ├── values.yaml
 ├── templates/
 │    ├── mysql-statefulset.yaml
 │    ├── mysql-service.yaml
 │    ├── wordpress-deployment.yaml
 │    ├── wordpress-service.yaml
 │    ├── pvc.yaml
 │    ├── secret.yaml
 │    └── _helpers.tpl


⚙️ 2. values.yaml (Production Config):
mysql:
  image: mysql:8.0
  rootPassword: neeraj!
  storage: 20Gi

wordpress:
  image: wordpress:6.0-apache
  replicas: 2
  storage: 10Gi

service:
  type: ClusterIP 
  
🔐 3. Secret Template
apiVersion: v1
kind: Secret
metadata:
  name: mysql-secret
type: Opaque
data:
  password: {{ .Values.mysql.rootPassword | b64enc }}

🧱 4. MySQL StatefulSet (Production)
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql
spec:
  serviceName: mysql
  replicas: 1
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
        - name: mysql
          image: {{ .Values.mysql.image }}
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: password
          ports:
            - containerPort: 3306

          # 🔍 Readiness Probe
          readinessProbe:
            exec:
              command: ["mysqladmin", "ping", "-h", "127.0.0.1"]
            initialDelaySeconds: 10
            periodSeconds: 5

          # ❤️ Liveness Probe
          livenessProbe:
            tcpSocket:
              port: 3306
            initialDelaySeconds: 30
            periodSeconds: 10

          volumeMounts:
            - name: mysql-storage
              mountPath: /var/lib/mysql

  volumeClaimTemplates:
    - metadata:
        name: mysql-storage
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.mysql.storage }}

🌐 5. MySQL Headless Service (Important):
apiVersion: v1
kind: Service
metadata:
  name: mysql
spec:
  clusterIP: None
  ports:
    - port: 3306
  selector:
    app: mysql
👉 Required for StatefulSet


⚙️ 6. WordPress Deployment (Production):
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wordpress
spec:
  replicas: {{ .Values.wordpress.replicas }}
  selector:
    matchLabels:
      app: wordpress
  template:
    metadata:
      labels:
        app: wordpress
    spec:
      containers:
        - name: wordpress
          image: {{ .Values.wordpress.image }}
          env:
            - name: WORDPRESS_DB_HOST
              value: mysql
            - name: WORDPRESS_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: password

          ports:
            - containerPort: 80

          # 🔍 Readiness Probe
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 5

          # ❤️ Liveness Probe
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 10    
    
    
    
🌐 7. WordPress Service
apiVersion: v1
kind: Service
metadata:
  name: wordpress
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: 80
  selector:
    app: wordpress


🚀 8. Deploy Helm Chart:
helm install wp-prod .

