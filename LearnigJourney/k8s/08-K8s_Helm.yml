✅ Scalable frontend
Multiple replicas

🚀 9. Helm + CI/CD Pipeline (GitLab Example):

📁 Project Structure    

repo/
 ├── helm/
 │    └── wordpress-prod/
 ├── .gitlab-ci.yml
 
 ⚙️ .gitlab-ci.yml
 stages:
  - lint
  - deploy

variables:
  RELEASE_NAME: wordpress-prod

lint:
  stage: lint
  script:
    - helm lint helm/wordpress-prod

deploy:
  stage: deploy
  script:
    - helm upgrade --install $RELEASE_NAME helm/wordpress-prod \
        --namespace default
  only:
    - main
    
🔄 CI/CD Flow
Developer pushes code
        ↓
GitLab CI triggers
        ↓
Helm lint
        ↓
Helm upgrade/install
        ↓
Kubernetes updated


