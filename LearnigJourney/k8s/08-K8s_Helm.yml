🚀 Problem with YAML-Based Deployments in Kubernetes:
🔴 Real-World Challenge:
In Kubernetes, deploying even a simple application requires multiple YAML files:
Deployment
Service
PVC
Secret
👉 For a basic WordPress + MySQL app, you may need 6–7 YAML files

❌ Key Problems:
1. Hardcoding Values:
storage: 20Gi
type: LoadBalancer
Not flexible ❌
Not reusable ❌
Hard to maintain ❌

2. Difficult to Manage:
Any change → edit YAML manually ❌
Multiple environments (dev/test/prod) ❌
Microservices → dozens of YAML files ❌

🧠 Core Problem:
Managing multiple YAML files with hardcoded values becomes complex, error-prone, and not scalable.


🟢 Solution: Helm (Kubernetes Package Manager)

👉 What is Helm?:
Helm is a package manager for Kubernetes that simplifies application deployment.

🔄 Real-Life Analogy:
Linux World:
apt install nginx
yum install nginx

apt / yum → Package Manager
nginx → Application

Kubernetes World:
helm install my-nginx bitnami/nginx
Helm → Package Manager
Helm Chart → Application Package

🧩 Key Idea:
Multiple YAML files → Combined → Helm Chart → Installed via Helm

📦 Helm Concepts:

📁 Helm Chart:
A Helm Chart is a collection of YAML files packaged together

🧱 Chart Structure:
mychart/
 ├── Chart.yaml     # Metadata
 ├── values.yaml    # Configurable values
 ├── templates/     # YAML templates
 ├── _helpers.tpl   # Reusable functions
 └── NOTES.txt      # Post-install instructions

🧠 Important Files:

📄 Chart.yaml:
Name, version, description

📄 values.yaml:
Default configuration
Avoids hardcoding

📁 templates/:
Kubernetes YAML with variables

📄 _helpers.tpl:
Reusable template logic

📄 NOTES.txt:
Instructions after deployment


⚙️ How Helm Works:
values.yaml → templates → rendered YAML → deployed to cluster

🛠️ Helm Setup (Step-by-Step):
✅ Step 1: Check Helm Installation
which helm
helm version
whereis helm

❌ Step 2: Install Helm (if not present)
uname -a
wget https://get.helm.sh/helm-v3.xx-linux-amd64.tar.gz
tar -zxvf helm-v3.xx-linux-amd64.tar.gz
mv linux-amd64/helm /usr/local/bin/helm

🔗 How Helm Connects to Kubernetes:
Uses same config as kubectl:
~/.kube/config
👉 Communicates with Kubernetes API Server


📦 Helm Repository:
👉 What is Repo?

Storage location for Helm charts (like Docker Hub)

➕ Add Repository
helm repo add <userdefined Name>  https://charts.bitnami.com/bitnami  # add the repository

🔍 Verify
helm repo list
helm repo update

🗑️ Uninstall:
help repo remove <userdefined Name>

🚀 Deploy Application Using Helm:
📦 Install:
helm install <userDefinedApplicationName> <reponame>/<name of chart>   # execute the package(chart)

🔍 Check:
helm list

🗑️ Uninstall:
helm uninstall <userDefinedApplicationName>

🔄 Custom Configuration (Important):
🔴 Problem

Hardcoded values:
storage: 20Gi

🟢 Solution: Override values
📄 custom-values.yaml
service:
  type: LoadBalancer
  
  
🚀 Deploy with Custom Values:
helm install <userDefinedApplicationName> bitnami/nginx -f custom-values.yaml  


