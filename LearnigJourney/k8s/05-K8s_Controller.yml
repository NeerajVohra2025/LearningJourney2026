⏸️ Step 9: Pause & Resume Deployment
⏸️ Pause:
kubectl rollout pause deployment myapp
👉 Stops rollout temporarily
⏸️ Pause:
kubectl rollout resume deployment myapp
👉 Continues rollout

🔄 Rolling Update Flow (Simple)
Old Pods ↓  
New Pods ↑  
Gradual replacement → No downtime

⏪ Rollback Flow
New Version ❌  
↓  
Rollback  
↓  
Old Stable Version ✔

🧠 Final Enterprise Insight:

Rolling Update ensures safe, zero-downtime upgrades, while Rollback provides a quick recovery mechanism by reverting to a previous stable version using ReplicaSets

