🔄 Rolling Update & Rollback in Kubernetes (Step-by-Step):
🧠 What is Rolling Update?
Rolling Update = Gradually replacing old Pods with new Pods without downtime
🎯 Goal:
Zero downtime
Continuous availability
Safe deployment

⚙️ Step-by-Step Rolling Update:
🟢 Step 1: Create Initial Deployment
kubectl create deployment myapp --image=nginx:1.17 --replicas=3

👉 Current state:
Pod1 → nginx:1.17  
Pod2 → nginx:1.17  
Pod3 → nginx:1.17

🔄 Step 2: Update the Application
kubectl set image deployment/myapp nginx=nginx:1.18

⚙️ Step 3: Kubernetes Starts Rolling Update:
👉 It does NOT kill all Pods at once ❌
Instead:
🔁 Step 3.1: Create New Pod
+ Pod4 → nginx:1.18
🔁 Step 3.2: Delete One Old Pod
- Pod1 → nginx:1.17

🔁 Step 3.3: Repeat Process
+ Pod5 → nginx:1.18  
- Pod2 → nginx:1.17  

+ Pod6 → nginx:1.18  
- Pod3 → nginx:1.17

✅ Final State
All Pods → nginx:1.18
✔ Zero downtime achieved

🧠 Important Concepts:
🔑 maxSurge & maxUnavailable
Control update behavior:

---
strategy:
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 1

| Field          | Meaning                          |
| -------------- | -------------------------------- |
| maxSurge       | Extra Pods allowed during update |
| maxUnavailable | Pods allowed to be down          |


🔍 Monitor Rolling Update:
kubectl rollout status deployment/myapp


⏪ Rollback (Very Important)
🧠 What is Rollback?

Rollback = Revert to previous working version
⚠️ When to Use
New version has bug ❌
Application crashes ❌
Performance issues ❌

⚙️ Step-by-Step Rollback:
🔍 Step 1: Check History
kubectl rollout history deployment/myapp

👉 Output:
REVISION  CHANGE-CAUSE
1         <none>   # nginx:1.17

🔄 Step 2: Perform Rolling Update (Upgrade)
kubectl set image deployment/myapp nginx=nginx:1.18
🧠 What Happens Internally
New ReplicaSet created (nginx:1.18)
Old ReplicaSet scaled down (nginx:1.17)
Old Pods terminated gradually
New Pods created one by one

👉 No downtime ✔

📜 Check History:
kubectl rollout history deployment myapp
👉 Output:
REVISION  CHANGE-CAUSE
1         <none>   # nginx:1.17
2         <none>   # nginx:1.18


⚠️ Step 3: Deploy Wrong Version (Failure Scenario)
kubectl set image deployment myapp nginx=httpd
📜 Check History:
kubectl rollout history deployment myapp
👉 Output:
REVISION  CHANGE-CAUSE
1         <none> # nginx:1.17
2         <none> # nginx:1.18
3         <none> # httpd ❌

🔍 Step 4: Verify Issue

kubectl get ep svc-nginx
kubectl get pods
👉 You may see:
Errors
Crashes
Wrong behavior

⏪ Step 5: Rollback to Previous Version
kubectl rollout undo deployment myapp
🎯 Or Specific Version
kubectl rollout undo deployment/myapp --to-revision=1

🔄 Step 6: Kubernetes Performs Reverse Rolling Update

👉 Same process as update:
nginx:1.18 → nginx:1.17
✔ Old stable version restored

🧠 Internal Working
🔁 What Happens Internally
New ReplicaSet created for new version
Old ReplicaSet scaled down
Rollback = scale old RS up again

⚠️ Best Practices:
✅ Always
Use readiness probes
Monitor rollout
Use small maxUnavailable

❌ Avoid
Updating all Pods at once
Skipping monitoring

