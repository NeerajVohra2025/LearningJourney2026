🔥 Must-Know One-Liners:
👉 API Server = brain of Kubernetes
👉 etcd = single source of truth
👉 kubelet = Pod creator
👉 CRI = container runner
👉 CNI = network provider
👉 kube-proxy = traffic router

🎯 Golden Principle:
Desired State vs Actual State → Kubernetes continuously reconciles

