🚀 Kubernetes Interview Notes (Quick Revision):
🧠 Core Architecture:
Control Plane → Decision making
Worker Node → Execution

Key Components:
API Server → Entry point (all communication happens here)
etcd → Cluster state (source of truth)
Scheduler → Assigns Pods to nodes
Controller Manager → Maintains desired state

⚙️ Node Components:
kubelet → Creates Pods
Container Runtime (CRI) → Runs containers (containerd)
kube-proxy → Networking (iptables rules)

🔄 Pod Creation Flow :
kubectl apply → API Server
API Server → etcd (store YAML)
Scheduler → assigns node
kubelet → creates Pod
CRI → runs container
CNI → assigns IP

🌐 Networking:
CNI → Provides Pod IP
kube-proxy → Creates iptables rules
Service → Stable access to Pods
Key Concept
Pods are in private network, accessed via Service

🔐 br_netfilter:
Enables iptables on bridge network
Required for Service communication

📦 CRI vs CNI:
| Component | Purpose            |
| --------- | ------------------ |
| CRI       | Run containers     |
| CNI       | Provide networking |


