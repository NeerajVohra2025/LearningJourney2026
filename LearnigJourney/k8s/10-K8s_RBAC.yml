RBAC: Role Base Access control (Authorizing the User)
🧠 1. What is RBAC in Kubernetes?
RBAC (Role-Based Access Control) is used to control:
👉 Who can do what in the cluster

🏗️ 2. Core Building Blocks of RBAC:
🔷 A. Role (Namespace Level):
👉 A Role defines permissions within a namespace
    set of rules defines three things 
      1) which api group user can access
      2) what resources under those api group user can access
      3) what action user can perform on those resources  
---
kind: Role
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: k8s-User
  namespace: default
rules:
- apiGroups: ["", "apps"]
  resources: ["deployments","replicasets","pods"]
  verbs: ["get","list","watch","create"]    

Authorization in k8s Cluster?:
    Role/ClusterRole: 

🧠 Explanation (Simple):
apiGroups → WHERE (which API domain)
resources → WHAT (pods, deployments)
verbs → ACTION (get, create)        


🔷 B. ClusterRole (Cluster Level):
👉 Works across entire cluster
---
kind: ClusterRole
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: deployment-reader
rules:
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["get","list","watch"]

🧠 Key Difference:
| Feature  | Role             | ClusterRole         |
| -------- | ---------------- | ------------------- |
| Scope    | Namespace        | Whole cluster       |
| Use case | App-level access | Admin/global access |

kubectl explain role

🔗 3. RoleBinding (Connecting Identity to Role):
A RoleBinding answers:
“Who (subject) gets what permissions (Role)?”
Subjects can be:
👤 User (external identity)
👥 Group
🤖 ServiceAccount (internal workload identity)

🧠 4. apiGroup — The MOST misunderstood concept:
🔷 Simple Meaning
👉 apiGroup = “Where should Kubernetes look?”
🧩 Real-world analogy:
    Company departments:
    HR 👩‍💼
    Finance 💰
    IT 💻
    If you say:
    👉 “Get employee record”
    System asks:
    👉 “From which department?”
    👉 That department = apiGroup

⚙️ 5. apiGroup in Role (Rules):
apiGroups: ["", "apps"]
🧠 Meaning
| Value  | Meaning                   |
| ------ | ------------------------- |
| `""`   | Core API (Pods, Services) |
| `apps` | Deployments, ReplicaSets  |
👉 So this Role allows:
Access Pods + Deployments

⚙️ 6. apiGroup in RoleBinding (Critical Part):
🔷 roleRef.apiGroup
roleRef:
  kind: Role
  name: k8s-User
  apiGroup: rbac.authorization.k8s.io
 
🧠 Meaning
👉 “Find this Role inside RBAC API group” 

🔥 Why important?
Because Kubernetes identifies resources using:  
    (apiGroup + kind + name)
    ❌ If wrong:
    apiGroup: apps   ❌
👉 Kubernetes:
    Looks in wrong place
    Cannot find Role
    Access denied

⚙️ 7. apiGroup in subjects (User vs ServiceAccount):
🔷 Case 1 — USER:
---
subjects:
- kind: User
  name: abc@gmail.com
  apiGroup: rbac.authorization.k8s.io
🧠 Explanation
👉 User is:
NOT stored in Kubernetes
Comes from:
IAM (GCP/AWS)
OIDC
Certificates
👉 So apiGroup provides context  

🔷 Case 2 — ServiceAccount:
---
subjects:
- kind: ServiceAccount
  name: my-app-sa
  namespace: default
🧠 Explanation
👉 ServiceAccount:
Exists INSIDE Kubernetes
Belongs to:  
Core API group ("")
👉 So:
   apiGroup = "" (or omitted)
    
🔥 8. Key Difference (Very Important):
| Subject        | Location | apiGroup                  |
| -------------- | -------- | ------------------------- |
| User           | External | rbac.authorization.k8s.io |
| ServiceAccount | Internal | ""                        |

⚙️ 9. Internal Flow (Step-by-Step):
🔷 For USER:
1. Request comes from abc@gmail.com
2. Auth via IAM/OIDC
3. RoleBinding check:
   - subject = User
   - apiGroup = rbac.authorization.k8s.io
4. Match found
5. Role applied

🔷 For ServiceAccount:
1. Pod uses ServiceAccount token
2. API Server identifies SA
3. RoleBinding check:
   - subject = ServiceAccount
   - apiGroup = ""
4. Match found
5. Role applied

🔷 Identity Layer:
User → External Identity (IAM/OIDC)
ServiceAccount → Internal Identity (K8s)

🔷 Authorization Layer
    RoleBinding
       ↓
    Maps identity → Role
    
🔷 Policy Layer
Role (RBAC rules)



🔥 9. When to use what?:
| Use Case                 | Use            |
| ------------------------ | -------------- |
| Human access (kubectl)   | User           |
| CI/CD pipelines          | ServiceAccount |
| App-to-app communication | ServiceAccount |
| External SSO users       | User           |

🎯 10. Final Simple Explanation:
“In RoleBinding, apiGroup differs because users are external identities and require RBAC context (rbac.authorization.k8s.io), while ServiceAccounts are native Kubernetes objects in the core API group, so their apiGroup is empty.”

🧠 Easy Memory Trick:
User → Outside → Needs apiGroup
ServiceAccount → Inside → No apiGroup 

🧪 10. Testing using kubectl auth can-i:
This is how you test RBAC permissions.
🔷 1. Test for USER:
Assume:
User = abc@gmail.com
Bound via RoleBinding

Command:
kubectl auth can-i get pods --as=abc@gmail.com
👉 Output:
yes / no

Test namespace-specific:
kubectl auth can-i create deployments \
  --as=abc@gmail.com \
  -n default
  
🔷 2. Test for ServiceAccount:
Format:
system:serviceaccount:<namespace>:<name>
Example:
kubectl auth can-i get pods \
  --as=system:serviceaccount:default:my-ksa
Another example:
kubectl auth can-i create services \
  --as=system:serviceaccount:default:my-ksa \
  -n default  


🔥 3. What happens internally?:
kubectl auth can-i
      ↓
Kubernetes API Server
      ↓
RBAC Engine checks:
  - Subject
  - RoleBinding
  - Role rules
      ↓
Returns YES / NO

⚠️ Common Pitfalls:
❌ 1. Confusing IAM with RBAC
👉 Important:
| Layer           | Responsibility          |
| --------------- | ----------------------- |
| GCP IAM         | Access to GCP APIs      |
| Kubernetes RBAC | Access to K8s resources |

❌ 2. Workload Identity ≠ Kubernetes RBAC

👉 Workload Identity:
Controls access to GCP services
👉 RBAC:
Controls access to Kubernetes resources

❌ 3. Missing RoleBinding for ServiceAccount
Even if Workload Identity works:
Pod → GCP API ✅
Pod → Kubernetes API ❌ (if no RBAC)

🎯 Final Mental Model:
[User]
 → RBAC → Kubernetes

[ServiceAccount]
 → RBAC → Kubernetes
 → Workload Identity → GCP APIs 

🧠 Interview-Ready Answer
 “Workload Identity maps a Kubernetes ServiceAccount to a GCP IAM Service Account, allowing pods to access GCP APIs without using service account keys by leveraging identity federation. Meanwhile, kubectl auth can-i is used to validate Kubernetes RBAC permissions for both users and service accounts by simulating authorization checks against RoleBindings and Roles.”


