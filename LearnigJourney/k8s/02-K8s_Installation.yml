TROUBLESHOOTING SECTION
===================================================================================================

Common Issues and Solutions:

1. kubeadm join hangs at "Running pre-flight checks"
   Solution: Fix AWS Security Groups (add inbound rules listed in step 8)

2. Nodes show "NotReady" status
   Solution: Ensure CNI plugin is installed (step 9)

3. Permission denied errors
   Solution: Use 'sudo' for system commands and 'sudo tee' for file redirections

4. Token expired
   Solution: Generate new token on master: kubeadm token create --print-join-command

5. CNI pods not starting
   Solution: Check containerd is running: sudo systemctl status containerd

