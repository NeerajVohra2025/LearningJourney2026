Kubernetes Cluster Setup Guide - Ubuntu 20.04 (v1.31)
=====================================================

Prerequisites:
- Master: Minimum 2 CPU, 2 GB RAM, 20 GB disk
- Worker: Minimum 1 CPU, 1 GB RAM, 20 GB disk  
- Ubuntu 20.04 operating system
- AWS Security Groups configured (see troubleshooting section)

Execution Order:
- Steps 1-6: Execute on BOTH master and worker nodes
- Steps 7-9: Execute on MASTER node only
- Step 10: Execute on WORKER node only
- Step 11: Execute on MASTER node only
- Step 12: Testing (on master)


🚀 Kubernetes Cluster Setup:

🧱 Step 1: Create Virtual Machines
    Create 2 Virtual Machines:
    Control Plane (Master Node)
    Worker Node
    Minimum Requirements:
    CPU: 2 cores
    RAM: 2 GB (Recommended: 4 GB)
    👉 In your case:
    ✔ 2 CPU
    ✔ 4 GB RAM (Good for learning & stability)

🌐 Step 2: Configure Networking (Very Important)
    Kubernetes requires proper network packet forwarding for Pod communication.
    Enable Required Kernel Module:
    sudo modprobe br_netfilter
    Enable IP Tables Bridging:
    cat << EOF | sudo tee /etc/sysctl.d/k8s.conf
    net.bridge.bridge-nf-call-iptables = 1
    net.ipv4.ip_forward = 1
    EOF
    👉 This ensures:
    Containers can communicate across nodes
    Overlay networking (CNI) works correctly

📦 Step 3: Install Container Runtime (CRI)
    Kubernetes does NOT run containers directly.
    It uses a Container Runtime Interface (CRI).
    Recommended Runtime:
    containerd (lightweight and widely used)
    👉 Responsibility:
    Pull container images
    Run containers inside Pods

⚙️ Step 4: Install Kubernetes Components
    Install the following on both Master & Worker nodes:
    kubelet → Runs Pods on the node
    kubectl → CLI to interact with cluster
    kubeadm → Tool to bootstrap the cluster
    👉 Think:
    kubeadm = Setup tool # just like gcloud init cluster
    kubectl = User interface
    kubelet = Node executor

🧠 Step 5: Initialize Control Plane (Master Node)
    kubeadm init
    👉 This will:
    Start API Server
    Setup etcd database
    Initialize Scheduler & Controller Manager
    Generate join command for worker nodes

🔗 Step 6: Join Worker Node to Cluster
    Run the generated command on Worker Node:
    kubeadm join <master-ip> --token <token> ...
    👉 This connects the worker node to the cluster.


🌉 Step 7: Deploy Pod Network (CNI)
    Kubernetes needs a network plugin (CNI) to assign IPs to Pods.
    Examples:
    Flannel
    Calico
    Weave
    👉 Responsibility:
    Assign IP address to each Pod
    Enable Pod-to-Pod communication across nodes


🧠 Key Understanding (Very Important):
    Without CNI → Pods will NOT get IPs ❌
    Without CRI → Containers cannot run ❌
    Without kubelet → Node cannot execute Pods ❌

🔄 Final Flow Summary
    Create VMs
    Configure networking
    Install container runtime
    Install Kubernetes tools
    Initialize Master
    Join Worker
    Install CNI
👉 Now your cluster is ready to:
    Deploy applications
    Scale Pods
    Perform rolling updates

