8. Configure AWS Security Groups (CRITICAL FOR AWS)

Before proceeding, ensure these inbound rules are added to MASTER node's Security Group:
- Port 6443 (TCP) - Source: 0.0.0.0/0 (API Server)
- Ports 2379-2380 (TCP) - Source: 0.0.0.0/0 (etcd)
- Ports 10250-10252 (TCP) - Source: 0.0.0.0/0 (kubelet, kube-scheduler, kube-controller)
- Port 30000-32767 (TCP) - Source: 0.0.0.0/0 (NodePort services)

Test connectivity from worker node:
