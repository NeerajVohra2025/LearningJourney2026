🚀 Deployment of a Kubernetes Cluster:
    Kubernetes clusters can be deployed in two primary ways:
    - Managed Service – provided by cloud vendors.
    - Self‑Managed – set up and maintained entirely by the user.

Self-Managed Kubernetes:
 Organizations manage the complete Kubernetes stack.
    Key Benefits:
    Full infrastructure control
    Custom configurations
    Suitable for on-premise or regulated environments   

Core Components:
| Layer         | Component          | Responsibility                 |
| ------------- | ------------------ | ------------------------------ |
| Control Plane | Managed by GCP     | API Server, Scheduler, etcd    |
| Worker Nodes  | Compute Engine VMs | Run workloads                  |
| Networking    | VPC                | Cluster communication          |
| IAM           | GCP IAM            | Authentication & Authorization |


🛠️ Step-by-Step: Create GKE Cluster:
    Step 1: Select Project
    gcloud projects list
    gcloud config set project <PROJECT_ID>
    
    Step 2: Enable Required Services # Kubernetese Engine (First Enable), and Compute Engine (Enable)
    gcloud services enable compute.googleapis.com
    gcloud services enable container.googleapis.com
    
    Step 3: Set Region & Zone
    gcloud config set compute/region us-central1
    gcloud config set compute/zone us-central1-a

    Step 4: Create Cluster
    gcloud container clusters create hello-cluster --num-nodes=2 # both are worker nodes , then where is master?
    Optional (Better Configuration):
    gcloud container clusters create hello-cluster \
      --num-nodes=2 \
      --machine-type=e2-highcpu-8
      
     ✅ Verify Cluster
     kubectl get nodes
    kubectl get pods -A

    🔗 Connect to Cluster:
      gcloud container clusters get-credentials hello-cluster
      🔍 What this does:
        - Fetches the cluster’s authentication credentials and configuration.
        - Updates your local kubeconfig file with the cluster context.
        - Allows you to use kubectl commands directly against the cluster.
     # Connect to the cluster
        gcloud container clusters get-credentials hello-cluster
        # Verify connection
        kubectl get nodes
        kubectl get pods --all-namespaces   

🏗️ Understanding GKE Architecture (Very Important):      
In GKE:
Master Node = ❌ Not visible / Not accessible
Worker Nodes = ✅ Visible in your project
👉 Cloud provider manages the master internally. 
 

❓ Where is the Master Node?:
✔ It exists
✔ But you cannot access it
✔ It is managed by Google


🔐 How Do We Communicate with Cluster?:
Even if master is not accessible, communication is simple.
✅ Rule:
👉 User always communicates with API Server

📌 Key Points:
kubectl → talks to API Server
API Server → talks to cluster
You never talk to master directly

🌐 API Server Access
Cloud provider exposes:
Master Endpoint (IP/DNS)
Port: 6443
Security:
Only port 6443 is open
All other ports are blocked


💻 From Where Can You Run kubectl?
👉 Anywhere!
Your laptop
Cloud Shell
CI/CD pipeline
VM / Server
❗ Important:
Cloud Shell is not master, just a client.


✅ Preconditions to Run kubectl
 1) Install kubectl:
    which kubectl
    # or
    whereis kubectl
2) kubeconfig File (Most Important):
    $HOME/.kube/config
    📌 kubeconfig Contains:
    API Server address
    Credentials (token/certificate)
    Cluster details
    
3) connectivity to api-server from wher running the kubectl command
    ping <Master IP>    
    
End-to-End Flow Diagram (Logical):
User (kubectl command)
        ↓
Reads kubeconfig (~/.kube/config)
        ↓
Connects to API Server (Master Endpoint:6443)
        ↓
API Server validates request
        ↓
Scheduler / Controller Manager
        ↓
Worker Nodes (Execution)    
    
    
Key Takeaways:
✔ Master node is not directly accessible
✔ API Server is the single entry point
✔ kubectl can run from any environment
✔ kubeconfig is mandatory for authentication & connectivity
✔ Communication is secure and controlled via port 6443    
 

Enterprise Insight:
 In enterprise environments:
 kubeconfig is often:
 Managed securely (Vault, Secret Manager)
 Not shared directly with users
 Access is controlled via:
 IAM + RBAC
 Private cluster endpoints
 Bastion hosts / VPN


🏢 Enterprise Best Practices:
🔐 Security
Use RBAC
Use IAM
Restrict API access

📈 Scalability
Enable autoscaling
Use node pools

📊 Monitoring
Cloud Monitoring
Prometheus + Grafana

❌ Delete the Cluster:
gcloud container clusters delete hello-cluster


