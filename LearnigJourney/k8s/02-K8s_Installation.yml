# Check all system pods are running
kubectl get pods -n kube-system
# Expected: All pods showing "Running" status

# Check cluster info
kubectl cluster-info

12. Test Cluster Operations

# Create test pod
kubectl run firstpod --image=nginx


# Only components running as a service in node use server IP
systemctl status kubelet
systemctl status containerd
# Other components running as a Pod is kube-system namespace use server IP
kubectl get pod -n kube-system
kubectl describe po kube-apiserver -n kube-system

# Why kube-proxy in master node?
#     - kube-proxy : interaction with pod
#     - master : kubectl<>api-server, kubelet<->api-server
#     - worker: user<-> application (running inside the pod)
#     - all application pods get IP address from flannel network

# Expose pod as NodePort service
kubectl expose pod firstpod --type=NodePort --port 80 --name firstsvc

# Get service details
kubectl get svc

# Test pod connectivity
kubectl get pods -o wide

# Access the service (use any node IP + NodePort)
curl <node-ip>:<nodeport>

