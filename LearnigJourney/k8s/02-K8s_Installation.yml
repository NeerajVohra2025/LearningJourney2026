🌐 Kubernetes + CNI + CRI:
🧩 Step 1: Installing Kubernetes (What Actually Gets Installed)
    When you install Kubernetes packages:
    dpkg -l | grep -i kube
    You typically get:
    kubelet → Runs Pods
    kubectl → CLI
    kubeadm → Cluster setup tool

⚠️ Important Clarification
❌ CNI is NOT automatically installed fully
✔ Only CNI framework (support) is present

👉 You STILL need to install a network plugin like:
    Flannel
    Calico
    Cilium

🔌 Step 2: What is CNI?
👉 CNI (Container Network Interface) is a standard interface
Think of it like:
🔌 “A plug point where different networking solutions can connect”

💡 Key Idea:
    Kubernetes does NOT implement networking directly
    It delegates networking to CNI plugins

🌉 Step 3: Installing a Network Plugin (Flannel / Calico)
When you deploy something like Flannel:
👉 It acts as the real network provider

Flow:
You install Flannel
Flannel registers itself as a CNI plugin
Now Kubernetes can use it

⚙️ Step 4: Who Talks to CNI?:
👉 kubelet is the main component
NOT kubectl ❌

Correct Flow:
You run:
kubectl apply -f pod.yaml
API Server stores request
Scheduler assigns node
kubelet (on that node):
Calls CNI plugin

🔄 Step 5: How Pod Gets IP
Step-by-step:
kubelet asks:
    “Create network for this Pod”
    CNI plugin (Flannel/Calico):
    Allocates IP
    Sets up network namespace
    Connects Pod to bridge
    Pod gets IP like:
    10.244.x.x
    
🧠 Key Correction (Important)
    ❌ kubectl does NOT interact with CNI
    ✔ kubelet interacts with CNI    


⚙️ Step 6: CRI (Container Runtime Interface)
👉 CRI is another interface (like CNI)
It connects:
kubelet → container runtime


📦 Step 7: Container Runtime (containerd vs Docker)
✔ containerd
Has built-in CRI support
Works directly with kubelet


❌ Docker (Old Model)
Docker itself is NOT CRI-compatible
Required:
dockershim (removed in newer K8s)
👉 That’s why:
Docker is no longer preferred in Kubernetes


Think Kubernetes like this:
| Layer      | Responsibility      |
| ---------- | ------------------- |
| kubectl    | Send request        |
| API Server | Store desired state |
| Scheduler  | Decide node         |
| kubelet    | Execute             |
| CRI        | Run container       |
| CNI        | Provide networking  |

🔥 One-Line Architect Summary:
kubelet uses CRI to run containers and CNI to configure networking, while CNI plugins like Flannel or Calico actually assign IPs and enable Pod communication

🧩 Step 1: What Comes with Kubernetes Installation?
    When you install:
    kubeadm, kubelet, kubectl
    👉 Kubernetes provides:
    A CNI framework (interface support)
    A directory like:
    /etc/cni/net.d/
    💡 What This Means
    👉 Kubernetes is saying:
    “I support CNI… but I don’t provide actual networking”

⚠️ Step 2: What is Missing After Install?
    After cluster setup:
    ❌ Pods will NOT get IP
    ❌ Pods will stay in:
    Pending / ContainerCreating
     👉 Because:
        No network plugin is installed yet
    
    
🔌Step 3: When Do CNI Plugins Come?
    👉 CNI plugins come ONLY when you install a network solution
    Examples:
    Flannel
    Calico
    Cilium    

⚙️ Step 4: What Happens When You Install Flannel (Example)?
    When you apply:
    kubectl apply -f flannel.yaml
    👉 It does:
    Installs Flannel pods
    Drops CNI config into:
    /etc/cni/net.d/
    Installs binaries into:
    /opt/cni/bin/

🔄 Step 5: Now CNI Becomes Active
    After this:
    👉 kubelet can now:
    Call CNI plugin
    Assign IP to Pods
    Setup networking

🧠 Key Understanding
| Component                   | Who Provides It   |
| --------------------------- | ----------------- |
| CNI Interface               | Kubernetes        |
| CNI Plugin (Flannel/Calico) | You install       |
| Pod Networking              | Handled by plugin |

🔥 Simple Analogy:
Think like this:
Kubernetes = 🔌 “Power socket”
CNI plugin = 🔋 “Actual device (fan, AC)”
👉 Socket alone does nothing
👉 Device makes it useful

✔ kubelet and container runtime run as system services (on the OS)
✔ Most Kubernetes components run as Pods (inside the cluster)
❗ But there are a few important exceptions

🔍 Step-by-Step Explanation:
🧩 1. Components Running as Services (on Node OS):
    These run directly on the machine (systemd services):
    ✔ Always:
    kubelet
    Container Runtime (containerd / CRI-O)
    👉 These are critical because:
    kubelet manages Pods
    runtime runs containers

⚠️ 2. What About Control Plane Components?:
    This is where confusion happens 👇
    ✔ In kubeadm-based clusters (most common)
    Control plane components run as Static Pods:
    API Server
    Scheduler
    Controller Manager
    etcd
    👉 They are:
    Defined as YAML files in:
    /etc/kubernetes/manifests/
    Automatically started by kubelet:
    💡 Important Insight
        Even control plane components are actually Pods managed by kubelet
    
⚙️ 3. What Runs as Pods (Normal Cluster Workloads):
    These run as regular Pods:
    CoreDNS
    kube-proxy
    CNI plugins (Flannel / Calico)
    Your applications    
    | Component            | Runs As    |
    | -------------------- | ---------- |
    | kubelet              | OS Service |
    | container runtime    | OS Service |
    | API Server           | Static Pod |
    | Scheduler            | Static Pod |
    | Controller Manager   | Static Pod |
    | etcd                 | Static Pod |
    | kube-proxy           | Pod        |
    | CoreDNS              | Pod        |
    | CNI (Flannel/Calico) | Pod        |

🔄 Mental Model
    👉 Think like this:
    OS Layer (Services)
    kubelet
    container runtime
    Kubernetes Layer (Pods)
    Everything else
⚠️ Small Correction to Your Statement

Your statement:
“only kubelet and container runtime run as a service, all others run as pod”
👉 ✔ Almost correct
👉 ❗ Better version:
kubelet and container runtime run as OS services, while most other Kubernetes components—including control plane components—run as Pods (often as static Pods managed by kubelet)


🧩 Step 1: Who Actually Creates Pods?
    In Kubernetes:
    ❌ API Server does NOT create Pods
    ❌ Scheduler does NOT create Pods
    👉 ✔ kubelet creates Pods

⚙️ Step 2: Who Runs Containers Inside Pods?
    👉 ✔ Container Runtime (containerd / CRI-O)
    kubelet → asks runtime
    runtime → creates containers

🧠 Step 3: Now Think About Master Node
    You said:
    “Control plane components run as Pods”
    ✔ Correct
    Examples:
    API Server
    Scheduler
    Controller Manager
    etcd

❓ Step 4: Important Question
    👉 If these are Pods…
    Who will create them?

    ✔ Answer:
    👉 kubelet on the master node

🔄 Step 5: How It Actually Works:
    kubeadm creates YAML files:
    /etc/kubernetes/manifests/
    kubelet on master node:
    Watches this folder
    Detects Pod definitions
    kubelet:
    Calls container runtime
    Container runtime:
    Creates containers
    👉 Now control plane Pods are running
    

🔑 Step 6: Why kubelet MUST Run on Master
    Because:
    Without kubelet → no Pods can run
    So:
    No API Server
    No Scheduler
    No Controller Manager
    👉 Entire cluster DEAD ❌    

🔑 Step 7: Why Container Runtime (CRI) MUST Be There
    Because:
    kubelet does NOT run containers itself
    It delegates to:
    👉 container runtime (containerd)

🧠 Final Mental Model
Think like this:
kubelet = “Pod Manager”
container runtime = “Container Executor”

🏗️ Master Node Reality:
| Component                | Role                       |
| ------------------------ | -------------------------- |
| kubelet                  | Creates control plane Pods |
| container runtime        | Runs containers            |
| control plane components | Run INSIDE Pods            |


⚠️ Common Misconception:
    “Master node only manages, does not run workload”
    ❌ Not fully true
    👉 It also:
    Runs control plane Pods
    Needs kubelet + runtime to do that

🔥 One-Line Architect Answer:
kubelet and container runtime must run on the master node because control plane components are deployed as static Pods, and kubelet is responsible for creating those Pods while the runtime executes their containers


