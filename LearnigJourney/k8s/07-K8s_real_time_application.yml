🚀 Persistence in Kubernetes (PV, PVC, SC, CSI, Pod):
🧠 Why Persistence Matters in Kubernetes:
By default, Pods are ephemeral — when they restart, data is lost.
👉 Solution:
Kubernetes introduces a persistent storage layer using PV, PVC, StorageClass, and CSI

🧩 Core Components of Kubernetes Storage:

🔌 CSI (Container Storage Interface):
Standard interface between Kubernetes and storage providers
Examples:
AWS EBS
GCP Persistent Disk
Azure Disk
👉 Runs as controllers inside the cluster

📦 StorageClass (SC):
Defines:
Storage type (SSD / HDD)
Provisioner (CSI driver)
Policies
👉 Enables dynamic provisioning

📥 PersistentVolumeClaim (PVC):
Request for storage by application

📄 PersistentVolume (PV):
Actual storage resource (external disk)

🔗 Pod + Volume:
PVC is attached to Pod
Data persists beyond Pod lifecycle

🔗 Pod + Volume:
PVC is attached to Pod
Data persists beyond Pod lifecycle
Pod → PVC → StorageClass → CSI → External Storage → PV


🚀 Real-Time Use Case: Deploying a Stateful Application:

🧩 Application Architecture:
Example: WordPress Application
| Layer    | Component          |
| -------- | ------------------ |
| Frontend | Apache (WordPress) |
| Backend  | MySQL Database     |
| Storage  | Persistent Volumes |


🧠 Key Design Principle:
Separate Compute (Pod) from Storage (Volume)

🛠️ Deployment Approaches:
YAML files (manual)
Helm charts (recommended for production)

🛠️ Deployment Approaches:
YAML files (manual)
Helm charts (recommended for production)

🔴 Step 1: Backend (MySQL Database)
🔐 1. Create Secret (Password):
echo -n "neeraj!" | base64
---
apiVersion: v1
kind: Secret
metadata:
  name: mysql-pass
type: Opaque
data:
  password: bmVlcmFqIQ==
  
  
🌐 2. Service (ClusterIP):  
---
apiVersion: v1
kind: Service
metadata:
  name: wordpress-mysql
spec:
  ports:
    - port: 3306
  selector:
    app: wordpress
    tier: mysql
  type: ClusterIP
👉 Internal communication only

💾 3. PVC (Database Storage):
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mysql-pv-claim
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
👉 Uses default StorageClass if not specified

⚙️ 4. Deployment (MySQL):
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wordpress-mysql
spec:
  selector:
    matchLabels:
      app: wordpress
      tier: mysql
  template:
    metadata:
      labels:
        app: wordpress
        tier: mysql
    spec:
      containers:
        - name: mysql
          image: mysql:5.6
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-pass
                  key: password
          ports:
            - containerPort: 3306
          volumeMounts:
            - name: mysql-storage
              mountPath: /var/lib/mysql
      volumes:
        - name: mysql-storage
          persistentVolumeClaim:
            claimName: mysql-pv-claim
👉 /var/lib/mysql = actual DB data path

🟢 Step 2: Frontend (WordPress)
🌐 1. Service (NodePort):
---
apiVersion: v1
kind: Service
metadata:
  name: wordpress
spec:
  ports:
    - port: 80
  selector:
    app: wordpress
    tier: frontend
  type: NodePort

💾 2. PVC (Frontend Storage):
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: wp-pv-claim
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi

⚙️ 3. Deployment (WordPress):
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wordpress
spec:
  selector:
    matchLabels:
      app: wordpress
      tier: frontend
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: wordpress
        tier: frontend
    spec:
      containers:
        - name: wordpress
          image: wordpress:4.8-apache
          env:
            - name: WORDPRESS_DB_HOST
              value: wordpress-mysql
            - name: WORDPRESS_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-pass
                  key: password
          ports:
            - containerPort: 80
          volumeMounts:
            - name: wordpress-storage
              mountPath: /var/www/html
      volumes:
        - name: wordpress-storage
          persistentVolumeClaim:
            claimName: wp-pv-claim

🔗 End-to-End Flow:
User → NodePort Service → WordPress Pod
       ↓
       Connects via DNS (wordpress-mysql)
       ↓
MySQL Service → MySQL Pod
       ↓
PVC → PV → External Storage

🧠 Important Concepts:
🔹 Service Discovery:
wordpress-mysql → auto DNS resolution inside cluster

🔹 Authentication:
Shared Secret between frontend & backend

🔹 Volume Mount Paths:
| Component | Path           | Purpose       |
| --------- | -------------- | ------------- |
| MySQL     | /var/lib/mysql | DB data       |
| WordPress | /var/www/html  | Website files |

🔹 Deployment Strategies:
| Strategy      | Description      |
| ------------- | ---------------- |
| RollingUpdate | Zero downtime    |
| Recreate      | Stop → Start     |
| Blue-Green    | Two environments |
| Canary        | Gradual rollout  |

"In Kubernetes, persistence is achieved using PVCs that request storage from StorageClasses via CSI drivers. These volumes are mounted into Pods, ensuring data survives Pod restarts. In real-world applications like WordPress, both frontend and backend use persistent storage, with Secrets managing credentials and Services enabling communication."