Kubernetes Scheduling, Node Selection, and Taints/Tolerations:
1) What Kubernetes scheduling means:
In Kubernetes, scheduling is the process of deciding which worker node should run a new Pod.
Think of it like this:
A Pod is a workload that needs a home.
The scheduler is the decision-maker.
The kubelet on each node is the worker that actually starts and manages the Pod.
The API server is the central source of truth that stores the current state of the cluster.

2) Who does what in the scheduling flow:
Step 1 — kubelet sends health and status updates
Each node runs a kubelet. The kubelet sends heartbeats to the API server so Kubernetes knows the node is alive and healthy.

Step 2 — the API server holds the cluster state
The API server stores the current node and Pod information. The scheduler reads this state from the API server.

Step 3 — the scheduler looks for a place to run the Pod
The scheduler watches for Pods that are waiting to be assigned to a node. It then chooses the best node based on:
Filtering: remove nodes that cannot run the Pod
Scoring / weighing: rank the remaining nodes and choose the best fit

Step 4 — the scheduler binds the Pod to a node
Once a node is selected, the scheduler assigns that Pod to that node.

Step 5 — kubelet starts the Pod
After assignment, the kubelet on that node pulls the image and runs the container.

3) Clean architecture view:
    [Pod Request]
          ↓
    [API Server / Cluster State]
          ↓
    [Kube-Scheduler]
          ↓
    [Chosen Node]
          ↓
    [Kubelet]
          ↓
    [Container Runtime]
          ↓
    [Running Pod]
    
This is the clean separation:
Scheduler decides
Kubelet executes
API server coordinates    

4) NodeSelector: the simplest way to place a Pod on a specific node
What it does
nodeSelector tells Kubernetes:
“Run this Pod only on a node that has this label.”
This is a Pod-level setting, not a container-level setting.


How it works step by step
Step 1 — label the node:
You first add a label to the worker node:

kubectl label nodes <node-name> gpu=true
kubectl get nodes --show-labels

Step 2 — use that label in the Pod spec:
apiVersion: v1
kind: Pod
metadata:
  name: db-pod
spec:
  nodeSelector:
    gpu: "true"
  containers:
  - name: db
    image: my-db-image

Step 3 — scheduler matches the label:
If a node has gpu=true, the scheduler can place the Pod there.

UC What if no matching node exists?:
The Pod stays in Pending state.
That means:
the Pod exists in the API server
but no node has been chosen yet
so the Pod has not started

UC What if the node label is removed after the Pod is already running?:
Nothing happens to the running Pod.
Why?
Because scheduling only matters when the Pod is being assigned. After a Pod is running, removing the label does not automatically evict it.


5) NodeAffinity: a more flexible version of nodeSelector
nodeSelector is simple, but it only works for exact label matching.
NodeAffinity gives you more control.
Why use it
You use NodeAffinity when you want:
multiple labels
more expressive matching
hard or soft scheduling preferences

Two important types:
A. Required node affinity:
This is a hard rule.
If the node does not match, the Pod will not be scheduled.

B. Preferred node affinity:
This is a soft rule.
Kubernetes tries to honor it, but will still schedule the Pod elsewhere if needed.

Simple mental model:
nodeSelector = exact match, simple and strict
nodeAffinity = advanced node placement logic


6) PodAffinity: place Pods near other Pods
nodeAffinity:
This says:
“Place my Pod on a node with these labels.”
Example:
schedule database Pods on GPU nodes
schedule memory-heavy workloads on large nodes

podAffinity:
This says:
“Place my Pod near other Pods that match certain labels.”
Example:
put frontend Pods close to backend Pods
keep cache and app Pods in the same zone or node for lower latency

Simple difference:
| Concept      | What it matches | Example                 |
| ------------ | --------------- | ----------------------- |
| nodeAffinity | Node labels     | “Run on GPU node”       |
| podAffinity  | Other Pods      | “Run near backend Pods” |

7) Taints: keep Pods away from certain nodes
Problem:
You may want to stop Pods from being scheduled on a specific worker node.
Example:
node W2 is GPU being patched
you do not want any Pods landing there

Solution:
Use a taint on the node.
A taint says:
“Do not schedule Pods here unless they explicitly tolerate this taint.”

Taint structure:
key=value:effect

Common effects:
NoSchedule:
Hard block for new Pods
NoExecute:
Hard block for new Pods and evict running Pods that do not tolerate it
PreferNoSchedule:
Soft block; Kubernetes tries to avoid the node, but may use it if needed

Example:
kubectl taint node <node-name> app=webserver:NoSchedule
Meaning:
do not place new Pods on this node unless they have a matching toleration

Important behavior:
NoSchedule:
new Pods are blocked
already running Pods continue running

NoExecute:
new Pods are blocked
Pods without toleration may be evicted

PreferNoSchedule:
soft preference to avoid the node

8) Tolerations: allow a Pod onto a tainted node
If a node is tainted, a Pod needs a toleration to be allowed there.

Think of it like:
taint = “keep out”
toleration = “this Pod is allowed in”

Example Pod with toleration:
apiVersion: v1
kind: Pod
metadata:
  name: db-pod
spec:
  tolerations:
  - key: "app"
    operator: "Equal"
    value: "webserver"
    effect: "NoSchedule"
  containers:
  - name: db
    image: my-db-image
    
This means:
the Pod can be scheduled onto a node tainted with app=webserver:NoSchedule    

9) Why the master/control-plane node is tainted:
By default, the control-plane node is tainted so application Pods do not run there.
Why?
Because the control-plane node is reserved for cluster management components, not your workloads.

So by default:
application Pods go to worker nodes
control-plane nodes stay protected


10) Enterprise clean architecture view:
    [Pod Spec]
       ↓
    [Scheduler Rules]
       ↓
    [nodeSelector / nodeAffinity / tolerations]
       ↓
    [Chosen Worker Node]
       ↓
    [kubelet]
       ↓
    [Running Pod]

Placement controls:
nodeSelector: simple exact label match
nodeAffinity: advanced node selection
taints/tolerations: repel or allow Pods on nodes

11) Practical summary
Use nodeSelector when:
you need simple label-based placement
one label is enough

Use nodeAffinity when:
you need more control
you need hard or soft placement preferences
you want multiple matching conditions

Use taints/tolerations when:
you want to keep certain nodes reserved
you want to block workloads from special nodes
you want to allow only specific Pods onto specific nodes

Kubernetes scheduling decides which node should run a Pod. The scheduler reads the cluster state from the API server, filters out unsuitable nodes, scores the remaining ones, and binds the Pod to the best match. nodeSelector and nodeAffinity help choose the right node, while taints and tolerations help keep Pods away from nodes unless they are explicitly allowed.

