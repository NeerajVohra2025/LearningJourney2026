⚙️ 3. nodeAffinity Example (Node-based scheduling):
🎯 Use Case
👉 “Run database Pod only on GPU nodes”

🔷 Step 1 — Label the Node
kubectl label nodes node1 gpu=true

🔷 Step 2 — Pod with nodeAffinity
apiVersion: v1
kind: Pod
metadata:
  name: db-pod
spec:
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
        - matchExpressions:
          - key: gpu
            operator: In
            values:
            - "true"
  containers:
  - name: db
    image: mysql

🧠 Explanation
Scheduler checks:
    → Does node have label gpu=true?
       YES → schedule
       NO  → skip

🔥 Key Points
requiredDuringScheduling = hard rule
If no matching node → Pod stays Pending
After running → rule is ignored (no eviction)

⚙️ 4. nodeAffinity (Soft Rule Example):
🎯 Use Case
👉 “Prefer GPU nodes but not mandatory”
affinity:
  nodeAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
    - weight: 1
      preference:
        matchExpressions:
        - key: gpu
          operator: In
          values:
          - "true"
          
🧠 Meaning
Try GPU node first
If not available → schedule anywhere

⚙️ 5. podAffinity Example (Pod-based scheduling):
🎯 Use Case
👉 “Place frontend Pod near backend Pods”          

🔷 Example YAML
apiVersion: v1
kind: Pod
metadata:
  name: frontend-pod
spec:
  affinity:
    podAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
      - labelSelector:
          matchLabels:
            app: backend
        topologyKey: "kubernetes.io/hostname"
  containers:
  - name: frontend
    image: nginx
    
🧠 Explanation
Scheduler checks:
    → Is there a node running pods with label app=backend?
    YES → place frontend on SAME node
    NO  → Pod stays Pending    
🔥 Key Concept
topologyKey = where to match
| Value    | Meaning                |
| -------- | ---------------------- |
| hostname | Same node              |
| zone     | Same availability zone |
| region   | Same region            |

⚙️ 6. podAffinity (Soft Rule Example)
affinity:
  podAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
    - weight: 1
      podAffinityTerm:
        labelSelector:
          matchLabels:
            app: backend
        topologyKey: "kubernetes.io/hostname"
        
🧠 Meaning
Try to place near backend
If not possible → still schedule elsewhere        

⚖️ 7. nodeAffinity vs podAffinity:
| Feature  | nodeAffinity    | podAffinity           |
| -------- | --------------- | --------------------- |
| Based on | Node labels     | Pod labels            |
| Use case | Infra placement | App co-location       |
| Example  | GPU nodes       | Frontend near backend |
| Scope    | Node            | Pod topology          |

🧠 8. Real Enterprise Use Cases:
🔷 nodeAffinity
    GPU workloads
    SSD nodes
    High-memory nodes
    Dedicated nodes (compliance)
    
🔷 podAffinity
    Microservices (frontend ↔ backend)
    Cache + app co-location
    Reduce network latency    
    
⚠️ 9. Common Mistakes:
❌ Missing topologyKey
👉 Pod will not schedule correctly    

❌ Using required when you need preferred
👉 Pod stuck in Pending

❌ Wrong labels
👉 No matching → scheduling fails

🧠 10. Final Mental Model:
    nodeAffinity → "Which machine?"
    podAffinity  → "Near which app?"

🎯 Final Simple Explanation
“nodeAffinity controls which nodes a Pod can be scheduled on based on node labels, while podAffinity controls placement based on the presence of other Pods, enabling application-aware scheduling.”

