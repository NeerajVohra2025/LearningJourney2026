🚀 Kubernetes Storage & Persistence:

🔴 1. Core Problem: Pods Are Ephemeral
Pods in Kubernetes are stateless by default
When a Pod is deleted/crashes:
Controller creates a new Pod
❌ Data inside old Pod is lost

🧪 Example:
🔴 1. Core Problem: Pods Are Ephemeral
Pods in Kubernetes are stateless by default
When a Pod is deleted/crashes:
Controller creates a new Pod
❌ Data inside old Pod is lost
👉 New Pod created → test.txt ❌ gone



🔴 2. Why This Is a Problem?
❌ Stateless Apps (OK)
APIs
Frontend
⚠️ Stateful Apps (Problem)
MySQL
PostgreSQL
MongoDB

👉 These require persistent storage


🟢 3. Real-World Analogy:
💻 Without External Storage:
Data stored on laptop
Laptop crashes → Data lost ❌
☁️ With External Storage:
Store data on Google Drive / Cloud
Laptop crashes → Data safe ✅

👉 Key Principle:

Separate Compute (Pod) from Storage (External System)

🟢 4. Enterprise Storage Concepts:

Storage Providers:
AWS EBS
GCP Persistent Disk
Azure Disk
NetApp
Ceph

Storage Protocols:
🔹 SAN (Storage Area Network)
Block storage
Acts like local disk
High performance
🔹 NAS (Network Attached Storage)
File-based storage
Shared over network


🧠 Key Concept:
Local disk is often just a mapped reference to external storage
Failure Scenario
Server crashes ❌
Attach same volume to new server ✅
Data preserved ✅

🔄 5. Kubernetes Mapping:
| Real World       | Kubernetes        |
| ---------------- | ----------------- |
| Server           | Pod               |
| Application      | Container         |
| External Storage | Persistent Volume |
| Disk Mount       | Volume            |


🟢 6. Kubernetes Persistence Architecture:
👉 Goal:
Ensure data survives Pod restart

🧩 3-Step Flow:
1) How to Connect to the external storage with the K8s  # mainly done with help of storage vendor, vendor dependent steps  (Google-persistent disk)/AWS-EBS
    - CSI (Container Storage Interface)    #K8s does not have any native storage
    - SC (Storage Class)  
    
2) How to Provision storage/Volume
    - PVC (Persistent Volume Claim)
    - PV (Persistent Volume)

3) Attach the volume to the Pod       
    - Creating a Pod with Volume

✅ Step 1: Connect to External Storage
🔌 CSI (Container Storage Interface):
Kubernetes does NOT have native storage
Uses CSI to talk to storage providers
👉 Examples:
AWS → EBS CSI
GCP → PD CSI
📌 CSI runs as Pods inside cluster
kubectl get pods -n kube-system

📦 StorageClass (SC): # Forward the reguest to the CSI
Defines:
Provisioner
Storage type
Policies
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata: null
name: standard
provisioner: kubernetes.io/gce-pd # defines the provisioner which need to be called to create the volume
allowVolumeExpansion: true

kubectl get sc  # pd.csi.storage.gke.io

How Provisioning happens in K8s?:
Pre-Requisite:
step1: There are an external storage sytem.
step2: In K8s cluster there is a CSI (Pos) as well as StorageClass resource

Provisioning:
step3: User generates a request for storage in K8s Cluster 
            - Size
            - SC 
            - Permission
step4: Storage Class (Provisioner) defined in the request, Internally It connects to the csi.
       - CSI Internally Connect to the Storage System of the provisioner
       - Ask from the Storage System I have a request of GB Volume
       - Storage System Create a Volume of 5GB internally in there own Storage System
       - Storage System return reference of Volume back to the K8s cluster,and bind/mount the request with the Volume

# How to request for the volume (PVC)
1) In the K8s the request of volume Called the PVC , In the reguest user defines  
    Size
    SC
    accessMode / Permission
 
step1: 
PVC: Request of volume
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: aws-ebs-static-pvc
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: aws-ebs-trident
  volumeName: aws-ebs-pv
  resources:
    requests:
      storage: 2Gi

Permission/accessModes)for the volume:
🔐 Access Modes:
| Mode | Meaning                        |
| ---- | ------------------------------ |
| RWO  | ReadWriteOnce (single node)    |
| RWX  | ReadWriteMany (multiple nodes) |
| ROX  | ReadOnlyMany                   |



2) In the K8s , actual storage/volume created by storage system, volume reference obtaied from the Storage System in K8s Cluster
Is called the Volume.

PVC is the request for volume
PV is actual volume that obtained
K8s bounds PVC with PV

step2: 
PV: Volume Obtained from the Storage System (automatically created)

---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: aws-ebs-pv
spec:
  capacity:
    storage: 20Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: aws-ebs-trident
  csi:
    driver: csi.trident.netapp.io
    volumeHandle: trident-aws-ebs-volume-001
    volumeAttributes:
      backendType: aws-cvs
      region: us-east-1
      zone: us-east-1a
      serviceLevel: standard
      
      
kubectl apply -f pvc.yml
kubectl get pvc,pv

🔄 Binding Flow:
User creates PVC
StorageClass triggers provisioning
CSI connects to storage backend
Volume created
PV created
PVC bound to PV


✅ Step 3: Attach Volume to Pod  
---
kind: Pod
apiVersion: v1
metadata:
  name: pod-pvc
spec:
  containers:
    - name: myfrontend
      image: nginx
      volumeMounts:
        - name: mypvcpod
          mountPath: /var/www/html
  volumes:
    - name: mypvcpod
      persistentVolumeClaim:
        claimName: aws-ebs-static-pvc     


🔄 Pod Failure Scenario (With Storage):
Pod crashes ❌
New Pod created ✅
Same PVC attached ✅
Data available ✅

👉 🎉 Persistence Achieved

🎯 Final Architecture Flow:
        Container
           ↓
        Pod
           ↓
        Volume
           ↓
        PVC (Request)
           ↓
        PV (Actual Storage)
           ↓
        StorageClass
           ↓
        CSI Driver
           ↓
        External Storage (AWS / GCP / SAN / NAS)

