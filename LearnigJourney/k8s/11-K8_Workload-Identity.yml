🔄 Workload Identity (GCP Integration)
🔄 Part 1 — Workload Identity (IAM ↔ KSA Mapping)
We are working with:
    Google Cloud Platform
    Kubernetes (GKE)

🧠 1. Problem Workload Identity Solves:
Without Workload Identity:
Pod → Needs GCP API access → Uses JSON Key (Service Account Key)
🚨 Problems with this approach
🔓 Keys can leak (security risk)
🔄 Hard to rotate/manage
📉 Not scalable for enterprise systems

✅ 2. Workload Identity — Clean Solution:
    👉 Instead of keys, we use identity mapping
    Kubernetes ServiceAccount (KSA)
            ↓ (secure mapping)
    GCP IAM Service Account (GSA)
            ↓
    Access GCP APIs (NO KEYS)

🧠 One-line understanding:    
“Workload Identity allows a Pod to act as a GCP IAM Service Account without using credentials.”
⚙️ Flow:
    Pod 
      ↓
    Kubernetes ServiceAccount (KSA)
      ↓
    Workload Identity (token exchange)
      ↓
    GCP IAM Service Account (GSA)
      ↓
    Access GCP APIs

🔥 Responsibility Separation:
| Layer | Responsibility                 |
| ----- | ------------------------------ |
| RBAC  | Access to Kubernetes resources |
| IAM   | Access to GCP services         |

👉 Key Insight:
 RBAC ≠ IAM
 RBAC → “Can access pods?”
 IAM → “Can access GCS bucket?”



    
⚙️ 3. Step-by-Step Setup:

🔷 Step 1 — Enable Workload Identity on cluster  :
gcloud container clusters update CLUSTER_NAME \
  --workload-pool=PROJECT_ID.svc.id.goog
👉 This enables identity federation between GKE and IAM

🔷 Step 2 — Create GCP IAM Service Account (GSA):
gcloud iam service-accounts create my-gsa
👉 Grant permissions: 
gcloud projects add-iam-policy-binding PROJECT_ID \
  --member="serviceAccount:my-gsa@PROJECT_ID.iam.gserviceaccount.com" \
  --role="roles/storage.objectViewer"

👉 Now GSA can access GCP services:

🔷 Step 3 — Create Kubernetes ServiceAccount (KSA):
apiVersion: v1
kind: ServiceAccount
metadata:
  name: my-ksa
  namespace: default
👉 This is used by your Pod

  
🔷 Step 4 — Bind KSA → GSA (THE CORE STEP):
gcloud iam service-accounts add-iam-policy-binding \
  my-gsa@PROJECT_ID.iam.gserviceaccount.com \
  --member="serviceAccount:PROJECT_ID.svc.id.goog[default/my-ksa]" \
  --role="roles/iam.workloadIdentityUser"

🧠 What this means:
“Allow this Kubernetes ServiceAccount to act as this GCP Service Account”

🔷 Step 5 — Annotate KSA:
kubectl annotate serviceaccount my-ksa \
  iam.gke.io/gcp-service-account=my-gsa@PROJECT_ID.iam.gserviceaccount.com
  
🧠 Why this is needed
👉 This tells Kubernetes:  
“This KSA is mapped to this GSA”


🔷 Step 6 — Use KSA in Pod:
apiVersion: v1
kind: Pod
metadata:
  name: test-pod
spec:
  serviceAccountName: my-ksa

🔬 4. What happens at runtime? (MOST IMPORTANT PART):
🧠 Step-by-step runtime flow
1. Pod starts
2. Pod uses KSA identity
3. KSA token is issued
4. GKE exchanges token with IAM
5. IAM validates mapping (Step 4 binding)
6. IAM returns short-lived credentials
7. Pod accesses GCP API securely

🔐 Key Security Benefit:
✔ No long-lived keys
✔ Temporary credentials
✔ Fully managed by GCP

🏗️ 5. Clean Architecture View:

🔷 Layer 1 — Workload Layer:
Pod → Kubernetes ServiceAccount (KSA)

🔷 Layer 2 — Identity Federation Layer:
GKE Workload Identity
    Token exchange
    Trust boundary

🔷 Layer 3 — Cloud IAM Layer:
GCP IAM Service Account (GSA)
    Permissions to GCP APIs

🔷 Layer 4 — Resource Layer:
GCP Services (GCS, BigQuery, Pub/Sub)

🎯 8. Final Simple Explanation:

“Workload Identity replaces service account keys by securely mapping a Kubernetes ServiceAccount to a GCP IAM Service Account, allowing pods to access GCP APIs using short-lived credentials instead of static keys.”

🧠 Interview-Ready Answer:
“Workload Identity in GKE enables secure access to GCP services by mapping a Kubernetes ServiceAccount to a GCP IAM Service Account. This eliminates the need for service account keys by using identity federation and short-lived tokens, improving security and scalability.”