Chapter 11 – Real JSON Payloads:

We'll build actual payloads like

Initialize:
{
  "jsonrpc":"2.0",
  "id":1,
  "method":"initialize",
  "params":{
      "protocolVersion":"2025-06-18",
      "capabilities":{
          "sampling":{},
          "tools":{},
          "resources":{}
      },
      "clientInfo":{
          "name":"OpenAI Agent SDK",
          "version":"1.0"
      }
  }
}


Tool Call:
{
  "jsonrpc":"2.0",
  "id":101,
  "method":"tools/call",
  "params":{
      "name":"execute_sql",
      "arguments":{
          "query":"SELECT * FROM SALES"
      }
  }
}

Progress Notification (Server → Client):
{
  "jsonrpc":"2.0",
  "method":"notifications/progress",
  "params":{
      "progress":40,
      "message":"Reading Database"
  }
}


Sampling Request:
{
  "jsonrpc":"2.0",
  "id":9001,
  "method":"sampling/createMessage",
  "params":{
      "messages":[
          {
              "role":"user",
              "content":"Summarize these tickets."
          }
      ]
  }
}

Sampling Response:
{
  "jsonrpc":"2.0",
  "id":9001,
  "result":{
      "content":"Top issue is Login Failure..."
  }
}


Final Tool Response:
{
  "jsonrpc":"2.0",
  "id":101,
  "result":{
      "summary":"Revenue increased by 12%."
  }
}
