Chapter 1 – Understanding JSON-RPC:

Imagine you call customer care.

Instead of saying:

"Do something..."

you say

"Reset my password."

The operator immediately understands

what operation
what parameters
who requested it

JSON-RPC follows exactly the same idea.

Every message contains
Who am I?

↓

What operation?

↓

What parameters?

↓

Which request?

↓

Where should I return the result?


