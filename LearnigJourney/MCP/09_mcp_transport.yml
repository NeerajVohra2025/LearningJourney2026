StreamableHttp Transport: 
 The Streamable HTTP transport enables MCP clients to connect to remotely hosted servers over HTTP connections. Unlike the standard I/O transport that requires both client and serve on the same machine, this transport opens up posibilities for public MCP servers that anyone can access 
 
 Configuration Setting:
  Two key settings control how the streamable HTTP transport behaves
    stateless_http: controls connection state management
    json_response: controls response format handline
  By default both settings are false, but certain deployment scenerios may force you to set them true. When enabled, these settings can break core functionality like progress notifications, logging and server-initiated requests

Initially Setup:     
  The process starts like any MCP connection
    Clent sends a Initialize request to the server
    Server responds with an Initial Result that includes a special mcp-session-id
    Client sends an Initial notification with the session Id
  This mcp-session-id is crucial - it uniquely Identifies the client and must be included in all future requests   
  
