Final Mental Model:

Think of these layers as a corporate office building:

TCP Connection → The road leading to the office building.
HTTP → Each visit through the reception desk to submit a task.
MCP Session → Your employee ID badge, proving who you are across many visits.
JSON-RPC Request ID → The ticket number assigned to each individual task.
SSE Stream → The live status updates for that specific ticket ("In Progress", "50% Complete", "Completed").

Each layer has a unique responsibility, and together they enable MCP to support efficient, stateful, concurrent communication without mixing networking concerns with application state.



