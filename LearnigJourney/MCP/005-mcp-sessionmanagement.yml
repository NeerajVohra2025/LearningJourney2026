Chapter 14 – When Does the Session End?:

A session typically ends when:

The client explicitly disconnects.
The server times out due to inactivity.
The server restarts.
The session expires based on policy.
Authentication is revoked.

After that, the client must perform the initialization handshake again to establish a new session.



