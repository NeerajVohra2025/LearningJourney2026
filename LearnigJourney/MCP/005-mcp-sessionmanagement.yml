Chapter 1 – Why Do We Need a Session?:

Let's first understand the problem.

Suppose you walk into a bank.

The receptionist gives you a token.
Token : A102
Now every time you meet a different officer, you don't explain who you are again.

You simply say
My Token is A102
Immediately everyone knows

your identity
your application
your previous requests
your documents

That token makes the conversation stateful.

Exactly the same idea is used in MCP.

Instead of giving the server your identity every time, the server gives the client a Session ID.


