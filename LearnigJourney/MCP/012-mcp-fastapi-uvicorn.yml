Important Observation

You asked

How does it know which Uvicorn server to use?

Actually,

the MCP apps know nothing about Uvicorn.

Think of it like this.

hr_app

↓

ASGI Object

It has

no port
no host
no socket

Similarly

finance_app

↓

ASGI Object

Also

no port
no socket

Only

uvicorn.run(main_app)

creates

TCP Socket

↓

Port 8000

Both MCP apps live inside

that one ASGI application.


Why does not hr_app need port information?:

Because

hr_app is not a server.

This is probably the biggest misconception.

People think

hr_app = hr.streamable_http_app()

creates

an HTTP server.

It doesn't.

It creates

an ASGI Application.

Think of it like a Spring Boot DispatcherServlet.

It knows

how to process requests.

It doesn't know

how requests arrive.


Just because an MCP Server is accessible through HTTP/browser doesn't mean you should call it like a normal REST APi
This is one of the biggest misunderstandings people have about Streamable HTTP.


