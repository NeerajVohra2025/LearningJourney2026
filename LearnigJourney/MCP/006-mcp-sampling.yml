Chapter 7 – What is a Sampling Request?:

The server sends a request back to the client.

Conceptually it looks like:

sampling/createMessage


The request contains:

Messages
Instructions
Preferred model (optional)
Temperature
Max Tokens
System Prompt (optional)

Think of it as saying:

"Dear Client,

Please ask your AI model to summarize these tickets."



Chapter 8 – Client Receives Sampling Request:

The client now receives:
Sampling Request

↓

Summarize 500 Tickets


The client checks:

Is Sampling enabled?
Does the user allow this?
Which model should be used?
Are there policy restrictions?

If everything is allowed,

the client proceeds.



