This is a one-way event stream.

Nothing travels from client to server on this stream.


Chapter 3 – Then How Can Two-Way Communication Happen?:

Because MCP is not built only on SSE.

Think of MCP Streamable HTTP as having two communication paths.

               HTTP Request

Client ----------------------> Server


               SSE Events

Client <---------------------- Server


So there are two independent channels:

Client → Server (HTTP POST carrying JSON-RPC requests)
Server → Client (SSE carrying JSON-RPC responses/events)

This is why it supports full duplex communication even though SSE itself is one-way.


