Chapter 16 – Is Sampling Mandatory?:

No.

Sampling is an optional MCP capability.


A server may:

Never use Sampling.
Use it occasionally.
Use it extensively.

Similarly, a client may:

Support Sampling.
Reject Sampling requests.
Require user approval before executing them.

During the initialize handshake, the client and server negotiate whether Sampling is supported.



Chapter 17 – Relationship Between Tools and Sampling:

This is where many people get confused.

A Tool is a business capability exposed by the server.

Examples:

Execute SQL
Read File
Search Documents

Sampling is not a Tool.

Sampling is an MCP protocol capability that allows the server to borrow the client's reasoning ability.

A common sequence looks like this:

User

↓

Tool Call

↓

Server Reads Data

↓

Server Needs AI

↓

Sampling Request

↓

Client LLM

↓

Summary

↓

Server

↓

Final Tool Response


Final Mental Model

Think of a hospital:

MCP Client → The hospital that employs a specialist doctor (the LLM).
MCP Server → A laboratory that performs blood tests but cannot diagnose diseases.
Tool Call → "Run a blood test."
Sampling → The laboratory asks the specialist doctor, "Please interpret these test results."
LLM → The specialist doctor provides the diagnosis.
Server → Includes the diagnosis with the lab report and returns it.
User → Receives a complete, intelligent answer.

The key insight is that Sampling lets an MCP Server temporarily "borrow" the client's AI model without ever owning or directly calling the model itself. This keeps AI configuration, security, billing, and governance centralized in the client while allowing servers to add intelligent reasoning whenever needed.

The client does NOT send the LLM response over the same SSE stream. It sends it as a new JSON-RPC message (typically over HTTP in the opposite direction). SSE is only one mechanism for the server to push events to the client.
Let's build this from scratch.

Chapter 1 – First Understand SSE:

SSE stands for Server-Sent Events.

Notice the name carefully.

Server

↓

↓

↓

Client

The word Server-Sent tells us something important.
Only the server can push messages.

The client cannot push messages on the SSE stream.

Think of watching a live cricket score.

Score Server

↓

4 Runs

↓

6 Runs

↓

Wicket

↓

Client

Can your mobile send
"Please score another six"

through the same live score stream?

No.

You need a separate request.

Exactly the same applies here.



