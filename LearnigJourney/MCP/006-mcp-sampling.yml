This is where JSON-RPC Request IDs become extremely important.
Let's walk through it carefully.

Step 1:
Server creates a Sampling request.

id = 9001

It sends:

sampling/createMessage
id = 9001


Client receives:

id = 9001

The client stores:
Sampling Request
Sampling Request

ID

9001

Now GPT generates the answer.

The MCP Client sends:
{
   id : 9001

