Chapter 1 – What is Sampling?:

Before defining Sampling, let's understand the problem it solves.

Imagine an MCP Server whose job is to retrieve information from a database.

Now imagine the server receives this request:

"Summarize the last 500 customer support tickets."

The server can certainly fetch the 500 tickets from the database.

But can it generate an intelligent summary?

No.

Because the MCP Server is not an AI model.

It is simply a service exposing tools and resources.

To summarize the tickets, the server needs help from an LLM.

But here's the question:

How can an MCP Server ask the client's AI model to perform reasoning?

This is exactly why Sampling exists.


Chapter 2 – Why Was Sampling Introduced?:

Normally the communication flow looks like this:

User

↓

Client

↓

MCP Server

↓

Database

The client asks the server for data.

The server returns data.

Simple.

Now consider another scenario.

The server retrieves 50 MB of documents.

Instead of sending all 50 MB back to the client, it wants the client's LLM to summarize them first.

The server now needs to ask the client:

"Can your AI summarize this for me?"

This reverses the normal direction of communication.


Chapter 3 – What is Sampling?:

Sampling is an MCP capability that allows an MCP Server to request the MCP Client to perform an LLM inference on its behalf.

Notice something important.

Normally:

Client

↓

Server

With Sampling:

Server

↓

Client's LLM

The server temporarily becomes the requester.

The client temporarily becomes the AI provider.


Chapter 4 – Why Does not the Server Call OpenAI Directly?:
This is an important design decision.

Suppose every MCP Server called OpenAI directly.

Then every server would need:

OpenAI API Keys
Anthropic Keys
Gemini Keys
Billing
Model Selection
Security Policies

This creates many problems.

Instead,

the client already owns:

AI model
Authentication
User permissions
Model configuration
Cost controls

So the server simply asks:

"Can your AI do this for me?"


