Chapter 12 – Why Didn't MCP Use WebSockets?:

A natural question is:

"If communication is two-way, why not use WebSockets?"

The MCP designers intentionally chose HTTP + SSE because:

HTTP works with existing infrastructure (load balancers, proxies, gateways).
SSE is simpler than WebSockets for server-to-client streaming.
HTTP requests are ideal for client-to-server commands.
It avoids the complexity of maintaining a fully bidirectional socket protocol.

So the communication model becomes:
Client → Server : HTTP POST (JSON-RPC Requests)

Server → Client : SSE (JSON-RPC Responses, Progress, Sampling Requests)

Client → Server : HTTP POST (Sampling Results, New Requests)


