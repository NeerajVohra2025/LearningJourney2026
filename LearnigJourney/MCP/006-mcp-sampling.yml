The key takeaway:

There are three independent concepts working together:

HTTP POST → Used by the client to send JSON-RPC requests (including sampling results) to the server.
SSE → Used only by the server to push JSON-RPC messages, progress updates, and sampling requests to the client.
MCP Session → A logical context that ties all these HTTP requests and SSE events together using the same Session ID.

This separation is why MCP can support rich, bidirectional interactions while still using the simple and widely supported combination of HTTP + SSE instead of requiring WebSockets.


Important: In the latest MCP Streamable HTTP specification, the server can send any JSON-RPC message over the server→client stream. That includes:

Responses
Progress notifications
Logging notifications
Sampling requests
Other server-initiated requests

So yes, the stream is not just for "responses"; it can also carry requests initiated by the server.

Now let's answer each question.

Question 1 Can SSE send both streaming responses and streaming requests?:
Yes.

Think of the SSE stream as a one-way pipeline:
Server
   │
   ▼
Client

Anything the server wants to send travels through this pipeline.
For example:
Event 1

10% Completed

Event 2

20% Completed

Event 3

Sampling Request

Event 4

Continue Processing

Event 5

Completed

Notice something.

The transport doesn't care whether the payload is

a progress notification,
a JSON-RPC response,
or a JSON-RPC request.

It simply delivers events.


Question 2 When the server sends a Sampling request, does it pause?:

Yes—typically the processing of that particular tool invocation pauses.
Let's see why.

Suppose the tool is:

Summarize 500 Tickets

The server performs:

Read Database

↓

500 Tickets

Now it needs AI reasoning.

The server cannot continue because it doesn't yet have the summary.

So internally it reaches a point like:
summary = ?

Need Client LLM

The server sends:

sampling/createMessage

Now that tool invocation waits:

Think of it like calling another department.
Finance

↓

Waiting for HR Approval

Finance cannot finish until HR responds.

Exactly the same.
So the state becomes:
Tool Request 101

↓

Paused

↓

Waiting for Sampling Result

Notice:

Only Request 101 is paused.

The server itself is not paused.

Other requests can continue.

Server

├── Request 101 (Waiting)
├── Request 102 (Running)
├── Request 103 (Running)
└── Request 104 (Completed)


This is a very important distinction.


Question 3 Does the client pause while waiting for the LLM?:

Yes.

Let's follow the flow.
Server

↓

Sampling Request

Client receives:

Summarize These Tickets

Now the client starts:

GPT

↓

Thinking...
During this time,

the client cannot answer the Sampling request because GPT hasn't responded yet.

So for that Sampling request, the client waits.

Sampling Request

↓

Waiting for GPT

↓

GPT Responds

↓

Continue

Again,

this does not freeze the entire client.

If the client supports concurrency, it may still process:

another tool response,
another progress event,
another user request.

Only that Sampling workflow is waiting.


Question 4:
After GPT returns, who creates the HTTP POST?

The MCP Client does.

Let's see it step by step.

Server

↓

