}

Then the MCP Client sends it using HTTP POST.
HTTP POST

↓

Server

GPT never knows anything about MCP.

GPT simply returns text.

The MCP Client is responsible for:

packaging the JSON-RPC response,
attaching the Session ID,
sending the HTTP request.

So the flow is:

GPT

↓

Plain Text

↓

MCP Client

↓

Create JSON-RPC Response

↓

HTTP POST

↓

Server


