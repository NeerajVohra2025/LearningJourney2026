Step 1: Understand Standard HTTP Protocol
Request-Response based.
Stateless by design.
Typically short-lived: a client sends a request → server sends a full response → connection closes (unless kept alive).
Versions:
HTTP/1.1: supports chunked transfer encoding (allows streaming bodies).
HTTP/2: introduces stream multiplexing over a single TCP connection.
HTTP/3: uses QUIC for faster, multiplexed streams with reduced head-of-line blocking.

from http.server import BaseHTTPRequestHandler, HTTPServer
class MyHandler(BaseHTTPRequestHandler):
    def do_GET(self):
        self.send_response(200)
        self.send_header("Content-type", "text/plain")
        self.end_headers()
        self.wfile.write(b"Hello, this is a complete response.")
Once wfile.write() finishes, the response is closed.
#################################
MCP is a standardized protocol for enabling AI models to interact with external tools and services in a structured, real-time manner, often used in applications like AI agents or interactive systems. Streamable HTTP serves as one of its transport layers, allowing for efficient, bidirectional communication over standard HTTP infrastructure.

Step-by-Step Explanation of Streamable HTTP Protocol:
Streamable HTTP is designed for scenarios where AI models need to stream data, handle progress updates, or engage in back-and-forth interactions without the overhead of full WebSockets. It builds on HTTP but incorporates Server-Sent Events (SSE) for streaming, JSON-RPC 2.0 for message framing, and features like resumability and session management. Here's how it operates:



1) Initialization and Handshake:
The client starts by sending an initialization request to establish a session. This is typically an HTTP POST to a single MCP endpoint (e.g., /mcp) with a JSON-RPC payload specifying capabilities (e.g., supported methods like "weather.getForecast").
The server responds with an HTTP 202 Accepted (for acknowledgments) or 200 OK, potentially including a session ID in a custom header like Mcp-Session-Id. This ID is used for stateful interactions.
If streaming is supported, the response may switch to Content-Type: text/event-stream to begin an SSE stream for immediate feedback.
In Python (client side): Use requests to send the POST. The client might then open a separate GET for listening to unsolicited events.
import requests
import json

url = "http://localhost:8123/mcp"  # Single endpoint
init_payload = {
    "jsonrpc": "2.0",
    "method": "initialize",
    "params": {"capabilities": ["weather.getForecast"]},
    "id": 1  # Unique request ID
}

response = requests.post(url, json=init_payload, headers={"Accept": "application/json, text/event-stream"})
if response.status_code == 202:
    session_id = response.headers.get("Mcp-Session-Id")
    print(f"Session initialized with ID: {session_id}")
    
2) Sending Requests (Command Channel via POST):
Clients send batched or single JSON-RPC requests, notifications, or responses via HTTP POST to the same endpoint.
Each message has a unique ID for tracking. The payload can include requests (expecting responses) or notifications (fire-and-forget).
The server processes these and can respond synchronously (as JSON) or asynchronously (as an SSE stream for progress updates).
Python example (client sending a request):  
request_payload = {
    "jsonrpc": "2.0",
    "method": "weather.getForecast",
    "params": {"city": "New York"},
    "id": 2
}
headers = {"Mcp-Session-Id": session_id, "Accept": "text/event-stream"}
response = requests.post(url, json=request_payload, headers=headers, stream=True)


3) Handling Responses and Streaming (Via SSE):
For streaming, the server sets Content-Type: text/event-stream and sends events as they occur (e.g., progress notifications like "Fetching data... 50% complete").
Events are formatted as SSE: id: <unique_id>\nevent: message\ndata: <json_payload>\n\n.
The client parses the stream, matching responses to request IDs and handling progress or final results.
If the connection drops, resumability kicks in using the Last-Event-ID header on reconnect.
Python example (client parsing SSE stream): 
if response.headers.get("Content-Type") == "text/event-stream":
    for line in response.iter_lines():
        if line:
            # Parse SSE lines (simplified; use a library like sseclient for production)
            if line.startswith(b"data:"):
                data = json.loads(line.decode("utf-8")[5:])
                if "result" in data:
                    print(f"Final result: {data['result']}")
                elif "progress" in data:
                    print(f"Progress: {data['progress']}") 
                    
4) Listening for Unsolicited Messages (Announcement Channel via GET):
For server-initiated messages (e.g., notifications not tied to a specific request), the client opens a long-lived HTTP GET to the endpoint with Accept: text/event-stream.
The server pushes events via SSE on this channel.
This enables bidirectional flow: client pushes via POST, server pushes via GET stream.
Python example (client listening):  
get_headers = {"Accept": "text/event-stream", "Mcp-Session-Id": session_id}
response = requests.get(url, headers=get_headers, stream=True)
for line in response.iter_lines():
    if line.startswith(b"data:"):
        data = json.loads(line.decode("utf-8")[5:])
        print(f"Server notification: {data}")                 