Mental Model:

Think of it this way:


FastMCP
      │
      ▼
Application Definition

streamable_http_app()
      │
      ▼
Converts the application into an ASGI application

Uvicorn
      │
      ▼
Makes it accessible over HTTP

So the responsibilities are clearly separated:
| Component               | Responsibility                                                                                                    |
| ----------------------- | ----------------------------------------------------------------------------------------------------------------- |
| `FastMCP()`             | Defines the MCP application (tools, resources, prompts, configuration).                                           |
| `streamable_http_app()` | Builds an ASGI application that exposes the MCP protocol over Streamable HTTP.                                    |
| `uvicorn.run()`         | Starts the web server, opens a TCP port, accepts HTTP connections, and forwards requests to the ASGI application. |


My Suggested Learning Sequence:

Rather than jumping between methods, I recommend covering them in the order that FastMCP itself uses them during server startup:

✅ streamable_http_app() (transport creation)
run() and run_stdio() (how servers actually start)
tool() / @mcp.tool
resource() / @mcp.resource
prompt() / @mcp.prompt
Context object
SamplingMessages and sampling APIs
Request lifecycle from initialize → tools/list → tools/call

This mirrors the actual lifecycle of an MCP server and makes each subsequent concept much easier to understand.


