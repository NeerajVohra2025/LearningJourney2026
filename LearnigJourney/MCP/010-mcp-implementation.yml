Summary Table:
| Parameter        | Purpose                                               | Typical Usage                                    |
| ---------------- | ----------------------------------------------------- | ------------------------------------------------ |
| `name`           | Human-readable server name                            | Displayed to clients, logging                    |
| `instructions`   | Guidance for AI hosts                                 | Safe tool usage, operational guidance            |
| `version`        | Server version metadata                               | Compatibility, troubleshooting                   |
| `lifespan`       | Startup and shutdown lifecycle                        | Database pools, Redis, model loading             |
| `dependencies`   | Required packages                                     | Packaging and deployment metadata                |
| `auth`           | Authentication/authorization                          | OAuth, JWT, API keys                             |
| `settings`       | General server configuration                          | Timeouts, limits, feature flags                  |
| `stateless_http` | Whether HTTP requests share server-side session state | Short REST-like calls vs session-based workflows |
| `json_response`  | One-shot JSON response vs streaming response behavior | Simple APIs vs progress updates/streaming        |
| `middleware`     | Cross-cutting request processing                      | Logging, tracing, rate limiting, auditing        |


Before We Move to Methods

One important point for accuracy:

The concepts above are fundamental to FastMCP server configuration, but the exact place where they're configured depends on the FastMCP SDK version. In newer releases, options such as stateless_http and json_response are commonly provided to transport methods like streamable_http_app() rather than directly to the FastMCP constructor.

For the rest of this guide, I recommend we follow the latest FastMCP SDK (2025/2026) so that every example matches the actual APIs you'll use in production. After this, the natural next chapter is:

FastMCP Object Methods — tool(), resource(), prompt(), run(), run_stdio(), and especially streamable_http_app(), with internal diagrams showing exactly what each method creates and how requests flow through the framework.


FastMCP Constructor Defaults
| Parameter      | Required | Default                                                  | Should You Set It?                      |
| -------------- | -------- | -------------------------------------------------------- | --------------------------------------- |
| name           | ✅ Yes    | No default                                               | Yes                                     |
| instructions   | No       | None / Empty                                             | Recommended                             |
| version        | No       | SDK/Application default (often `"1.0.0"` or unspecified) | Recommended                             |
| lifespan       | No       | None                                                     | Only if resources need startup/shutdown |
| dependencies   | No       | Empty list                                               | Optional                                |
| auth           | No       | No authentication                                        | Production: Yes                         |
| settings       | No       | Default settings object                                  | Usually No                              |
| stateless_http | No       | False (session enabled for Streamable HTTP)              | Depends                                 |
| json_response  | No       | False (streaming behavior)                               | Depends                                 |
| middleware     | No       | Empty list                                               | Optional                                |


