Question 1: Which is the latest FastMCP approach?

As of the latest MCP Python SDK/FastMCP (2025–2026), the preferred pattern is:
from mcp.server.fastmcp import FastMCP

mcp = FastMCP("Demo")

mcp.run(
    transport="streamable-http"
)

or

mcp.run(
    transport="stdio"
)


The SDK has moved toward one run() method with a transport parameter instead of separate startup methods.
Older examples often show:

mcp.run_stdio()
or

app = mcp.streamable_http_app()

uvicorn.run(app)

So for learning:

Understand streamable_http_app() because it explains how HTTP transport works.
For writing new code, prefer mcp.run(transport="...") unless you specifically need to embed MCP into another web application.


