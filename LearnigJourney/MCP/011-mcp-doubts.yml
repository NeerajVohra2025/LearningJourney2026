↓

SAP

↓

GitHub

One server.

One port.

Easy operations.


A better mental model is:
                    Uvicorn
                       │
                  FastAPI (Parent ASGI App)
             ┌─────────┴─────────┐
             ▼                   ▼
        HR MCP App         Finance MCP App

Both HR and Finance are independent FastMCP applications.

They are siblings, not parent-child.

FastAPI (or another ASGI application) is the parent container that mounts them at different URL paths, and Uvicorn is simply the web server that serves the parent ASGI application.

This is the same pattern used by large enterprise applications to host multiple REST APIs and multiple MCP endpoints behind a single web server and port. 

