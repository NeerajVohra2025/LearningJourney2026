Chapter 14 – Why This Design Is Brilliant:

This separation of responsibilities is intentional      

| Component                                                         | Responsibility                                                                                                                |
| ----------------------------------------------------------------- | ----------------------------------------------------------------------------------------------------------------------------- |
| MCP Client                                                        | Protocol communication (sessions, JSON-RPC, message routing)                                                                  |
| Host Application (OpenAI Agent SDK, Claude Desktop, Cursor, etc.) | Decides whether to honor the sampling request, applies policies, selects the model, invokes the LLM, and receives the result. |
| LLM                                                               | Performs reasoning and generates the answer.                                                                                  |
| MCP Server                                                        | Requests AI assistance when needed and continues processing after receiving the result.                                       |
  
  
This design allows the same MCP Client library to work with any AI model because it never hardcodes model-specific logic.
  
