Chapter 8 – The Role of JSON-RPC 2.0:

MCP uses JSON-RPC 2.0 as its communication protocol.

JSON provides a lightweight, structured format that is easy for systems to exchange.
RPC (Remote Procedure Call) allows one system to request that another system execute a specific operation.
Instead of exchanging arbitrary messages, MCP clients invoke well-defined methods and receive structured responses.

This makes communication predictable, language-independent, and easy to implement.


Chapter 1 – What is a Transport?:
Before understanding MCP Transport, let's first understand the meaning of transport.

Imagine you want to send a parcel from Delhi to Mumbai.

The parcel contains important business documents.

There are multiple ways to deliver it:

Road
Air
Train
Courier

Although the transportation method changes, the parcel remains exactly the same.

The only thing that changes is how it travels.

The same concept applies to MCP.

The AI Client wants to send a JSON-RPC request to an MCP Server.

The request is always the same.

Only the communication medium changes.

This communication medium is called the Transport Layer.

Transport defines how MCP messages travel between the Client and the Server.




Chapter 2 – Where Does Transport Fit?:

Let's first understand the complete architecture.
                User

                  │

                  ▼

        OpenAI Agent SDK
           LangGraph

                  │

             MCP Client

                  │
          (Transport Layer)

        STDIO / HTTP /
      Streamable HTTP

                  │

             MCP Server

                  │

      Database / API / Files /
      Kubernetes / CRM / ERP
      
      
Notice something important.:

The MCP Client and MCP Server always communicate using JSON-RPC 2.0.

The Transport Layer only decides how these JSON messages move.      


Chapter 3 – Why Do We Need Different Transports?:

Different deployment environments require different communication methods.

For example:

Scenario 1:

Your AI application and MCP Server are running on the same laptop.

No internet is required.

The fastest communication method is STDIO.

Scenario 2:

Your MCP Server is running inside Kubernetes.

Your AI application is running in another cloud.

Now both applications communicate over HTTP.

Scenario 3:

The server continuously streams progress updates.

Normal HTTP is not efficient.

Streamable HTTP becomes the better choice.

So the transport depends entirely on where the client and server are deployed.


