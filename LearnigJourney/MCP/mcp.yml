Architect Recommendation

As a Principal Architect, I recommend:

For development or a single MCP service
mcp.run(transport="streamable-http")

This is the simplest approach.

For an enterprise platform hosting multiple MCP services

                    One Uvicorn
                         │
                    One FastAPI
                         │
        ┌────────────────┼────────────────┐
        ▼                ▼                ▼
     HR MCP          Finance MCP      GitHub MCP
     HR MCP          Finance MCP      GitHub MCP

This gives you:

One TCP port
One HTTPS certificate
One authentication layer
One logging pipeline
One monitoring endpoint
Multiple independent MCP applications mounted at different paths

This is the pattern you'll commonly see in enterprise API gateways and AI platform service
