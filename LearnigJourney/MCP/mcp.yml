Chapter 15 – Answering Your Question: If HTTP Keep-Alive Already Supports Multiple Requests, Why Do We Need MCP Sessions?

This is a very important distinction.


HTTP Keep-Alive:

HTTP Keep-Alive is a network optimization.

Its only job is to avoid creating a new TCP connection for every request.

It remembers nothing about:

the client
permissions
negotiated capabilities
protocol version

If the TCP connection closes, Keep-Alive ends


MCP Session:

The MCP Session is an application-level concept.

It stores logical state such as:

Client identity
Protocol version
Supported capabilities
Authentication context
Authorization and permissions

Even if the underlying TCP connection is dropped and a new one is established, the client can continue using the same MCP Session ID (provided the session is still valid on the server). The server recognizes the client because of the Session ID, not because of the TCP connection.


So:

TCP Keep-Alive improves network efficiency.
MCP Session provides logical continuity across requests.


