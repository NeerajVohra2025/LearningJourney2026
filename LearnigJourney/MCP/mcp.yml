Chapter 1 – First Understand What SSE Is:

Many people think SSE is something like RabbitMQ or Kafka.

It is not.

SSE is simply an HTTP response whose connection remains open.
Instead of:
Client -----------------> Server

            Request

<-------------------------

Response

Connection Closed

SSE becomes:
Client -----------------> Server

            Request

<=========================

Event 1

Event 2

Event 3

Event 4

...
The HTTP response remains open.

Nothing more.


Chapter 2 – Where Are Events Stored?:

This is your question.

Suppose the server wants to send
10%

20%

30%

40%

Completed
