30%

50%

Analyzing...

Almost Finished...

Traditional HTTP cannot efficiently deliver these intermediate updates while remaining responsive.

This is where Streamable HTTP becomes valuable.


Chapter 8 – Streamable HTTP:

Streamable HTTP extends normal HTTP by allowing the server to send multiple messages during a single interaction.

Instead of:
    Request

    ↓

    Response

    ↓

    Finished
    
The communication becomes:
    Request

    ↓

    Accepted

    ↓

    Progress

    ↓

    Progress

    ↓

    Progress

    ↓

    Final Result    
    
Think of downloading a large file.

Instead of waiting until the download completes,

you continuously see
    10%

    25%

    60%

    90%

    Completed    
    
    
Chapter 9 – Streamable HTTP Initialization:

Before exchanging business requests, the client and server establish a session.    
Step 1 – Client Initializes:

The client sends an initialize request using HTTP POST.

This request includes:

Supported protocol version
Client capabilities
Client information

The goal is to introduce itself to the server.


Step 2 – Server Responds:

The server returns:

Supported protocol version
Server capabilities
Server information

Most importantly, it creates a unique MCP Session ID and returns it in the response headers.

This Session ID identifies the client for future requests.

Step 3 – Client Confirms:

The client sends a small notification:
notifications/initialized
This tells the server:

"Initialization is complete. I'm ready to communicate."

Now the session is fully established.


