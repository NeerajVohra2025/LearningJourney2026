One Important Version Note

Depending on the FastMCP SDK version, you may find that mcp.run() supports different transports (for example, transport="stdio" or transport="streamable-http") instead of having a separate run_stdio() method. The underlying concepts remain the same:

STDIO transport → Reads from stdin, writes to stdout.
Streamable HTTP transport → Creates an ASGI application and uses an ASGI server (typically Uvicorn) to listen for HTTP requests.


