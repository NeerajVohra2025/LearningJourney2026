"If the server is already HTTP, then my application can simply use requests.post().":
Technically, yes.

But HTTP is only the transport.

Think of it this way:
Transport (HTTP)
        │
        ▼
Message Format (JSON-RPC)
        │
        ▼
MCP Protocol
        │
        ▼
Tools / Resources / Sampling / Sessions


requests.post() only helps with the HTTP transport. It knows nothing about:

initialize
Session IDs
tools/list
tools/call
Progress notifications
Sampling
Protocol error handling
Capability negotiation

The MCP client library implements all of that protocol logic for you.

This is exactly the same relationship as:

requests → HTTP transport
psycopg → PostgreSQL protocol
pymongo → MongoDB protocol
boto3 → AWS API protocol
MCP Client SDK → MCP protocol over HTTP

So the browser or your application can talk directly to an MCP server, but unless it implements the MCP protocol itself, it's just sending raw HTTP—not acting as a complete MCP client. That's why classes such as MCPServerStreamableHttp exist: they encapsulate the MCP protocol so your agent code can simply say "call this tool" instead of implementing the protocol state machine manually.

  




