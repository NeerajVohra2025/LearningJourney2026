70%

Generating Charts...

95%


Step 5:

Finally,

the server sends
Completed

Quarterly Revenue

Growth

Summary
The client receives the complete result without repeatedly polling the server.


Chapter 11 – Stateful vs Stateless Communication:
Stateless HTTP:

Every request is independent.
Request 1

↓

Complete

Connection Ends

-----------------

Request 2

↓

Complete

Connection Ends

The server remembers nothing unless the client includes the required context in each request.


Stateful Streamable HTTP:

A session is created once.
Initialize

↓

Session Created

↓

Session ID

↓

Request 1

↓

Request 2

↓

Request 3

↓

Same Session

The Session ID lets the server associate multiple requests with the same client, enabling richer interactions such as progress updates and server-initiated events.

Chapter 12 – Transport Comparison:
| Feature               | STDIO             | HTTP       | Streamable HTTP      |
| --------------------- | ----------------- | ---------- | -------------------- |
| Communication         | Local Process     | Network    | Network              |
| Same Machine Required | Yes               | No         | No                   |
| Internet Required     | No                | Yes        | Yes                  |
| Long Running Tasks    | Limited           | Basic      | Excellent            |
| Progress Updates      | No                | Limited    | Yes                  |
| Streaming Responses   | No                | Limited    | Yes                  |
| Best Use Case         | Local development | Cloud APIs | Enterprise AI agents |

Final Takeaway:

Think of JSON-RPC 2.0 as the language spoken by the MCP Client and MCP Server. Transport is the road that carries those messages.

STDIO is like walking down a hallway in the same building—fast and local.
HTTP is like sending a courier package—you send one request and receive one response.
Streamable HTTP is like tracking a live delivery—you receive continuous updates until the work is complete.

The message format stays the same across all transports. Only the communication path changes. This separation allows MCP to remain transport-independent while supporting both local development and large-scale enterprise deployments


