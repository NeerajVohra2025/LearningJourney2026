Chapter 5 – STDIO Transport:
STDIO stands for

Standard Input / Standard Output

This is the simplest transport.

Imagine launching a Python program.
python weather_server.py

The MCP Client starts the server as a child process.

Instead of communicating over the network, both communicate using operating system pipes
    MCP Client

    ↓

    stdin

    ↓

    Weather Server

    ↓

    stdout

    ↓

    Client
    
There is no TCP.

No HTTP.

No REST API.

Everything happens locally.


How STDIO Works:
Step 1:

Client starts the MCP Server.  
weather_server.py

Step 2:

Operating System creates  
stdin

stdout

communication channels.


Step 3:

Client writes JSON-RPC request.
stdin

↓

initialize

Step 4:

Server reads request.

Processes it.

Step 5:

Server writes response.

stdout

↓

Initialization Result

Step 6:

Client reads response.

Communication continues.

Everything happens locally.


When STDIO is Used:

Perfect for

Claude Desktop
Cursor
VS Code
Local development
Testing


Chapter 6 – HTTP Transport:

Now suppose the server is no longer on your laptop.

It is running in Google Cloud.

How will the client communicate?

Obviously not through stdin.

Now communication happens using HTTP.

    Client

    ↓

    POST

    ↓

    Internet

    ↓

    HTTP Server

    ↓

    MCP Server
    
    
HTTP Request Flow:

Suppose the user asks

Show today's weather.


Step 1:

The AI Agent understands it needs weather data.   

Step 2:

The MCP Client creates a JSON-RPC request. 

initialize

or

tools/list

or

tools/call


Step 3:

The request is wrapped inside an HTTP POST request.
POST /mcp


Step 4:

    The request travels through the network.
    Internet

    ↓

    Load Balancer

    ↓

    API Gateway

    ↓

    MCP Server
    

Step 5:

The server processes the request.    

Step 6:

The server returns a JSON response.
HTTP Response

↓

JSON-RPC Result


Step 7:

The client receives the response.

The connection ends.

This is called Request–Response Communication.

Characteristics:

✔ Stateless

✔ One request

✔ One response

✔ Connection usually closes after completion

Very similar to REST APIs.


Chapter 7 – Why Standard HTTP Is not Enough:

Suppose an AI Agent asks:

Analyze one million sales records.

The operation takes

30 seconds
2 minutes
5 minutes

Should the client simply wait?

That creates a poor user experience.

Users expect updates like:
10%

30%

50%

Analyzing...

Almost Finished...

Traditional HTTP cannot efficiently deliver these intermediate updates while remaining responsive.

This is where Streamable HTTP becomes valuable.


Chapter 8 – Streamable HTTP:

Streamable HTTP extends normal HTTP by allowing the server to send multiple messages during a single interaction.

Instead of:
    Request

    ↓

    Response

    ↓

    Finished
    
The communication becomes:
    Request

    ↓

    Accepted

    ↓

    Progress

    ↓

    Progress

    ↓

    Progress

    ↓

    Final Result    
    
Think of downloading a large file.

Instead of waiting until the download completes,

you continuously see
    10%

    25%

    60%

    90%

    Completed    
    
    
Chapter 9 – Streamable HTTP Initialization:

Before exchanging business requests, the client and server establish a session.    
Step 1 – Client Initializes:

The client sends an initialize request using HTTP POST.

This request includes:

Supported protocol version
Client capabilities
Client information

The goal is to introduce itself to the server.


Step 2 – Server Responds:

The server returns:

Supported protocol version
Server capabilities
Server information

Most importantly, it creates a unique MCP Session ID and returns it in the response headers.

This Session ID identifies the client for future requests.

Step 3 – Client Confirms:

The client sends a small notification:
notifications/initialized
This tells the server:

"Initialization is complete. I'm ready to communicate."

Now the session is fully established.


