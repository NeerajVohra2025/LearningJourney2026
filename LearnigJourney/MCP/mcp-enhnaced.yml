Chapter 9:  Building a Server with FastMCP

FastMCP is to the MCP world what FastAPI is to the REST world: a high-level Python framework that hides all the JSON-RPC/session/transport plumbing. Instead of implementing the protocol yourself, you write:

@mcp.tool
def search_customer():
    ...
...and FastMCP handles the rest.

9.1 Creating the Server Object:
from mcp.server.fastmcp import FastMCP

mcp = FastMCP(
    name,
    instructions,
    version,
    lifespan,
    dependencies,
    auth,
    settings,
    stateless_http,
    json_response,
    middleware,
)

At this point, nothing is running yet — no HTTP port is open, no STDIO transport is active, no client can connect. You have only created and configured an application object. Internally, FastMCP sets up empty registries that decorators like @mcp.tool will populate later:
FastMCP
├── Server Metadata
├── Tool Registry        (empty until @mcp.tool is used)
├── Resource Registry     (empty until @mcp.resource is used)
├── Prompt Registry        (empty until @mcp.prompt is used)
├── Session Manager
├── Transport Config
├── Authentication
└── Middleware


9.2 Constructor Parameters — What Each One Does:
Parameter	                            Purpose	                                                   Typical Usage
name ⭐⭐⭐⭐⭐	                    Human-readable server name shown to connecting clients	    "Customer Service Server" instead of "Unknown Server"
instructions ⭐⭐⭐⭐⭐	            System prompt for the server — tells the AI Host how to     e.g. "Never modify records. Always verify customer ID. 
                                        safely use it, not Python config	                        operations without explicit confirmation."

version ⭐⭐⭐	                        Server version metadata	                                    Compatibility checks across 100s of connected    
clients,troubleshooting

lifespan ⭐⭐⭐⭐⭐	                Startup/shutdown lifecycle hook	                            Open one DB pool / Redis connection at startup, reuse    across all requests, close cleanly at shutdown — avoids reconnecting on every request

dependencies ⭐⭐⭐	                Declares required packages	                                Similar to requirements.txt — used for packaging/deployment

auth ⭐⭐⭐⭐⭐	                    Who can use the server                                  	OAuth / JWT / API key — critical for anything touching production data (e.g. a Payroll server)

settings ⭐⭐⭐	                    General app configuration	                                Timeouts, rate limits, logging — similar to application.yml/.env

stateless_http ⭐⭐⭐⭐⭐	            Whether HTTP requests share server-side session state	    True = every request independent (simple REST-like calls); False (default) = session persists across requests, needed for Sampling/progress/streaming

json_response ⭐⭐⭐⭐	                One-shot JSON vs. streaming behavior	                    True = single JSON reply, connection closes; False = server can stream progressive updates — required for long-running operations

middleware ⭐⭐⭐⭐	                Cross-cutting request processing	                        Logging, auth checks, rate limiting, tracing, correlation IDs — every request flows: Client → Logging → Auth → Rate Limit → Tool → Response

Version note (accuracy callout): in newer FastMCP SDK releases, stateless_http and json_response are often passed to transport methods like streamable_http_app() rather than the constructor directly. Always check the SDK version your team has pinned before copying constructor signatures verbatim.


9.3 A Minimal, Real Server:
from mcp.server.fastmcp import FastMCP

hr = FastMCP("HR")

@hr.tool
def get_employee():
    return "Employee Found"

hr_app = hr.streamable_http_app()   # exposes an ASGI application


9.4 Running the Server: run() vs run_stdio() vs streamable_http_app()

Method	                                                 What it does	                                                                When to use
mcp.run(transport="streamable-http", port=8000):        Starts its own Uvicorn instance, binds a port, serves only this MCP server	    Simple, single-service development or a small standalone deployment

mcp.run_stdio():                                    	Runs over stdin/stdout as a child process, no network at all	                Local tooling — Claude Desktop, Cursor, VS Code

mcp.streamable_http_app():                          	Returns an ASGI application object but starts nothing itself	                Enterprise pattern — mount multiple MCP servers under one shared Uvicorn/FastAPI process
