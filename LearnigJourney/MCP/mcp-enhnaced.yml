│   └── tools.py
│
└── requirements.txt

Each department owns its own MCP server module and exports a single ASGI app object; main.py never needs to know the internal details of HR or Finance tooling — it only imports and mounts.    

10.5 Architect's Recommendation:
Scale	                                                                        Recommended pattern
Development or a single MCP service	                                            mcp.run(transport="streamable-http") — simplest possible setup
Enterprise platform with many MCP services	                                    One Uvicorn + one FastAPI parent, with each MCP server mounted at its own path
The enterprise pattern gives you: one TCP port, one HTTPS certificate, one authentication layer, one logging pipeline, one monitoring endpoint, while keeping each department's MCP application fully independent under the hood. This is the same pattern used by production API gateways.
---

Chapter 10:— Why You Still Need an MCP Client:
A natural question: "If the MCP Server is just HTTP, can't my browser just call it directly with fetch()?"

Technically, yes. A browser (or requests.post()) can send a raw HTTP POST with a JSON-RPC body to /mcp and get a JSON-RPC response back — nothing stops that mechanically.

But MCP is not REST. A browser understands HTTP. An MCP Server understands HTTP + JSON-RPC + the full MCP protocol — initialize → session → tools/list → tools/call → sampling → progress notifications → resources, correctly sequenced, with session IDs tracked, reconnection handled, and errors managed per spec. Manually re-implementing all of that with raw fetch()/requests.post() calls for every consuming application is painful and error-prone. That is exactly what the MCP Client library exists to do for you.

JDBC analogy: Java could open a raw TCP socket and speak Oracle's wire protocol directly. Nobody does, because the JDBC driver already encapsulates that protocol. Same relationship:
requests        → HTTP transport
psycopg         → PostgreSQL protocol
pymongo         → MongoDB protocol
boto3           → AWS API protocol
MCP Client SDK  → MCP protocol over HTTP/STDIO
10.1 Real Client-Side Code (OpenAI Agent SDK example):
server = MCPServerStreamableHttp(
    params=MCPServerStreamableHttpParams(
        url="http://hr-server:8001/mcp"
    )
)
This one object teaches the OpenAI Agent SDK — which otherwise doesn't know how to "speak" MCP — how to perform, automatically:
Initialize → Create Session → Store Session ID → tools/list → tools/call
           → Handle Streaming → Handle Sampling → Reconnect on failure

Without it, your application code would have to hand-roll session management, JSON-RPC message construction, SSE parsing, sampling callbacks, and reconnection logic — for every single consuming app. Nobody does that, for the same reason nobody hand-crafts raw TCP packets to call a REST API.

A browser can become a full MCP client — but only if its JavaScript implements initialize, session handling, JSON-RPC, SSE, sampling, and notifications itself. That is significant, non-trivial protocol logic — which is precisely the value the MCP Client SDK packages up for you.
---

Chapter 11:— End-to-End Walkthrough (Everything Together):
Bringing every part of this guide together, here is a single request traced through the entire stack, from user question to final answer — this is the flow to whiteboard for new team members.

Scenario: A sales manager asks, "Show me the total sales for Q2 and summarize the key trends."

Step	                             What Happens
1. User Request	                    The question reaches the AI Host. The AI recognizes it needs current sales data — not something in its training data.

2. Session Handshake (once)	        Client sends initialize → Server creates a session, returns MCP-Session-ID in headers → Client sends notifications/initialized.

3. Tool Discovery	                Client asks "what can you do?" (tools/list). Sales MCP Server responds: Execute SQL, Get Sales Report, Fetch Regional Revenue.

4. Tool Invocation	                AI selects Get Sales Report. Client sends tools/call (with MCP-Session-ID header) over Streamable HTTP.

5. Server Executes Business Logic	Server queries the database, may call SAP, may aggregate multiple sources. The AI never needs to know these internals.

6. Progress Streaming	            Server pushes SSE progress events: 10% Reading Database → 45% Executing Query → 70% Processing → 95% Formatting.

7. (Optional) Sampling	            If the server needs intelligent summarization it cannot do itself, it sends sampling/createMessage back to the client, which calls its own LLM and returns the generated text.

8. Structured Response          	Server returns structured data: Revenue, Profit, Region, Growth %.

9. AI Reasoning	                    The Host's AI now reasons over trusted, grounded, current enterprise data — not memory or assumptions — and produces insights: "Sales increased 12%. Western region drove the growth. Margin improved vs. last quarter."

10. User Sees the Answer	        The entire session/protocol/streaming/sampling machinery is invisible to the end user — they simply get a fast, accurate, well-reasoned answer.
---

Chapter 12:— Best Practices & Governance Checklist:
Use this checklist when reviewing or standing up a new MCP server for production:

[ ] Naming & instructions — every server has a clear name and instructions that tell the AI Host how to use it safely (e.g., "never delete without confirmation").
[ ] Authentication is mandatory for any server touching sensitive data (Payroll, SAP, Legal) — never ship auth=None to production.
[ ] Least-privilege tools — expose only the specific tools required; do not wrap an entire raw API surface.
[ ] Lifespan management — use lifespan to open connection pools once at startup and close them cleanly at shutdown, rather than per-request.
[ ] Stateless vs. stateful choice is deliberate — set stateless_http based on whether the server needs sampling/progress/streaming, not by default.
[ ] Middleware for governance — logging, auditing, rate limiting, and correlation IDs on every request for traceability.
[ ] Sampling policy is explicit — decide per-server and per-client whether sampling is allowed, and whether it requires user approval.
[ ] One gateway for many servers — at enterprise scale, mount servers under a single FastAPI/Uvicorn host rather than provisioning a port per department.
[ ] Session hygiene — define and enforce session timeout/expiry policy; never assume sessions live forever.
[ ] Transport choice matches deployment — STDIO for local/dev tooling, Streamable HTTP for anything remote or long-running.

---
Appendix — Glossary & Quick Reference:
    Term	                    Meaning
    Host	                    The AI application the user interacts with (Claude Desktop, IDE, custom agent app)
    Client	                    Embedded in the Host; manages the MCP connection and protocol
    Server	                    Exposes tools/resources/prompts for a specific system (SAP, HR, Legal, etc.)
    Tool	                    An action the server can perform (mutates state)
    Resource	                Read-only information the server can provide
    Prompt	                    A reusable, server-published prompt template
    Session	                    Server-side memory of a client's identity/capabilities across multiple requests
    Transport	                The delivery mechanism for JSON-RPC messages: STDIO, HTTP, or Streamable HTTP
    JSON-RPC 2.0	            The message format every MCP request/response/notification uses
    Sampling	                A server asking the client to run an LLM inference on its behalf
    SSE	                        Server-Sent Events — one-way server → client streaming channel
    ASGI app	                The mountable application object returned by streamable_http_app()
    FastMCP	                    High-level Python SDK for building MCP servers (the "FastAPI of MCP")
