Chapter 7: Streaming with SSE:
Server-Sent Events (SSE) is the mechanism that commonly underpins Streamable HTTP's progress updates: a one-way channel where the server continuously pushes events and the client only listens.
Server → → → → → Client   (events only flow one direction)
Normal tool call flow with SSE:

Client sends tools/call.
Server immediately replies Accepted / Processing Started and keeps the HTTP connection open.
Server pushes a sequence of event messages — e.g., 10% Reading Database, 20% Executing SQL, 45% Filtering Records, 70% Generating Summary, 95% Formatting Response.
Server sends Completed; the connection closes.
Important nuance: SSE by itself is one-directional (server → client). When the server needs something back from the client mid-stream (as in Sampling, covered next), the client's answer is not pushed back over the same SSE stream — it is sent as a new JSON-RPC message, typically via a separate HTTP call in the opposite direction.
---

Chapter 8: Sampling: Borrowing the Client's AI:

8.1 The Problem Sampling Solves:
An MCP Server is not an AI model — it's a service exposing tools and resources. Suppose a server receives: "Summarize the last 500 customer support tickets." It can fetch the 500 tickets from the database, but it cannot intelligently summarize them. It needs an LLM's help — but the LLM lives on the client side, not the server side.

8.2 What Sampling Is:
Sampling is an MCP capability that lets an MCP Server ask the MCP Client to run an LLM inference on its behalf.

This temporarily reverses the normal direction of communication:
Normal flow	With Sampling
Client → Server	Server → Client's LLM

8.3 Why the Server Doesn't Just Call OpenAI Directly:
If every MCP Server called an LLM provider directly, every server would need its own API keys, billing, model selection, and security policy — duplicated across every server in the enterprise. Instead, the client already owns the AI model, authentication, user permissions, model configuration, and cost controls. So the server simply asks: "Can your AI do this for me?"

8.4 End-to-End Sampling Flow
Scenario: A lawyer asks a Legal MCP Server to "Summarize this 800-page contract." The server can read the PDF and extract text, but cannot understand legal nuance.
User → Client (tools/call) → MCP Server
                                  │  reads DB / documents
                                  ▼
                          Server has raw data,
                          but needs reasoning
                                  │
                         sampling/createMessage
                                  ▼
                             MCP Client
                                  │  checks: is sampling enabled?
                                  │          does policy allow it?
                                  │          which model to use?
                                  ▼
                         Client calls its own LLM
                          (GPT-4 / Gemini / Claude)
                                  │
                          LLM generates the answer
                                  ▼
                       Client returns result to Server
                                  ▼
                    Server completes the original tool call
                                  ▼
                              User sees the
                            final intelligent answer


The user never sees the internal sampling round-trip — it's fully transparent.
Sampling request payload:
{
  "jsonrpc": "2.0",
  "id": 9001,
  "method": "sampling/createMessage",
  "params": {
    "messages": [
      { "role": "user", "content": "Summarize these tickets." }
    ]
  }
}

Sampling response payload:
{
  "jsonrpc": "2.0",
  "id": 9001,
  "result": { "content": "Top issue is Login Failure..." }
}
A sampling request typically also carries instructions, a preferred model (optional), temperature, max tokens, and an optional system prompt.


8.5 Why Sampling Is Better (Centralized AI Governance):
Without Sampling — every MCP Server needs its own provider keys, billing, model selection, and security review. AI logic is duplicated across every server.

With Sampling — one client owns one LLM connection; many MCP servers (HR, Finance, Legal, SAP, CRM) all reuse it via sampling/createMessage. One AI. Many servers.


8.6 Is Sampling Mandatory?:
No — it's optional and negotiated during the initialize handshake. A server may never use it, use it occasionally, or rely on it heavily. A client may support it, reject it, or require explicit user approval before executing a sampling request.


8.7 Tools vs. Sampling — Don't Confuse Them:
A Tool is a business capability the server exposes (Execute SQL, Read File, Search Documents).
Sampling is a protocol capability that lets the server borrow the client's reasoning ability. It is not a tool.

