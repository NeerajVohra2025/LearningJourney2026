  | "Call ServiceNow tool"
  v
MCP Client
  |
  | MCP protocol
  v
MCP Server

3.3 MCP Server: exposes controlled enterprise capabilities.
The Server is the provider of context and capabilities. It can represent a SQL database, a CRM, a document repository, a cloud service, a REST API, a Kubernetes cluster, or a vector database. Rather than exposing raw APIs directly to AI models, the server presents well-defined, discoverable capabilities through MCP.
