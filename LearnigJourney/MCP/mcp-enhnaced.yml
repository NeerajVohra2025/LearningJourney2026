| ---------------- | -------------------- | ----------------------------------------- |
| TCP              | Road                 | Reliable network byte transport           |
| HTTP             | Delivery envelope    | HTTP communication                        |
| MCP Session      | Identity/token       | Logical MCP client-server relationship    |
| JSON-RPC Request | Work ticket          | Individual MCP operation                  |
| Request ID       | Ticket number        | Match request with response               |
| SSE/stream       | Live update channel  | Server-to-client streaming                |
| Tool             | Business operation   | Perform an action                         |
