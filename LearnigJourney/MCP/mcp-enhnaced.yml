22. Chapter 21 — Critical Sampling + SSE Concept:
One of the most confusing areas in the original material is:
"How can the server send a request to the client if SSE is one-way?"
The clean mental model is:

Client → Server
       HTTP POST

and:

Server → Client
       streaming channel
       
The server can send a JSON-RPC request such as a Sampling request through the server-to-client stream.
The client's response to that JSON-RPC request is then sent back as a new client-to-server message.
So conceptually:       
CLIENT                                      SERVER

tools/call
-------------------------------------------->

                                  process tool

<========== server → client ============
        sampling/createMessage
==========================================

Client calls LLM

LLM returns summary

sampling result
-------------------------------------------->

                                  continue processing

<========== server → client ============
             Completed
==========================================
