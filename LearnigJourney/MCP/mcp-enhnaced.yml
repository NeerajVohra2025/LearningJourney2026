Chapter 4: The Protocol: JSON-RPC 2.0 (MCP needs a structured message format)
Every MCP message — regardless of transport — is a JSON-RPC 2.0 message. Think of it like calling customer care: instead of a vague "do something," you say "reset my password" — a precise operation with parameters. JSON-RPC gives every message:

Who am I?
What operation?
What parameters?
Which request (so I can match the reply)?
Where should the result go?

4.1 Anatomy of a Request:
{
  "jsonrpc": "2.0",
  "id": 101,
  "method": "tools/call",
  "params": { "...": "..." }
}
jsonrpc — always "2.0".
id — generated by the client, unique per request. The server never changes it; the client uses it to match the eventual response.
method — the operation, e.g. initialize, tools/list, tools/call.
params — the operation's arguments (can be nested objects, arrays, optional fields).

4.2 Notifications (Fire-and-Forget):
A notification is a request with no id and no expected response. Example:
{
  "jsonrpc": "2.0",
  "method": "notifications/initialized"
}
The server never replies to a notification — this reduces unnecessary traffic. Notifications should never be used where the caller needs confirmation that the operation succeeded.

4.3 Response Object:
{
  "id": 101,
  "result": { "...": "..." }
}

The response always carries back the same id the request used, so the client can match responses even if they arrive out of order (important for concurrent requests and streaming).

4.4 Error Object:
{
  "id": 101,
  "error": {
    "code": -32000,
    "message": "Tool execution failed",
    "data": { "...": "..." }
  }
}
Distinguish between: Tool Error (the business operation failed), Transport Error (network/connection issue), Protocol Error (malformed JSON-RPC), and Application Error (upstream system failure, e.g. SAP unreachable).

4.5 Batch Requests:
Instead of sending requests one at a time, a client can send an array:

[ { "id": 101, "...": "..." }, { "id": 102, "...": "..." }, { "id": 103, "...": "..." } ]

The server processes them independently and responses may return out of order (e.g., 103, then 101, then 102) — this is fine because the id field lets the client match each response to its request.

4.6 Real Payload Examples (Reference):
Initialize:
{
  "jsonrpc": "2.0",
  "id": 1,
  "method": "initialize",
  "params": {
    "protocolVersion": "2025-06-18",
    "capabilities": { "sampling": {}, "tools": {}, "resources": {} },
    "clientInfo": { "name": "OpenAI Agent SDK", "version": "1.0" }
  }
}

Tool call:

{
  "jsonrpc": "2.0",
  "id": 101,
  "method": "tools/call",
  "params": {
    "name": "execute_sql",
    "arguments": { "query": "SELECT * FROM SALES" }
  }
}

Progress notification (server → client):
{
  "jsonrpc": "2.0",
  "method": "notifications/progress",
  "params": { "progress": 40, "message": "Reading Database" }
}

Final tool response:
{
  "jsonrpc": "2.0",
  "id": 101,
  "result": { "summary": "Revenue increased by 12%." }
}

