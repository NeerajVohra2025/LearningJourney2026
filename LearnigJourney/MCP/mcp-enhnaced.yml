Chapter 5: Transport Layer: STDIO, HTTP, Streamable HTTP
Key separation: JSON-RPC 2.0 is the language. Transport is the road the message travels on. The message format never changes — only the delivery mechanism does. This is why MCP is transport-independent.

Transport defines:
How Messages Travel
Not:
What Messages 

5.1 STDIO Transport (Local):
Used when the client and server run on the same machine — e.g., launching python weather_server.py. The MCP Client starts the server as a child process, and both sides communicate over OS pipes (stdin / stdout). No TCP, no HTTP, no REST — everything is local.
MCP Client → stdin → Weather Server → stdout → Client
How it works:
Client starts the server process.
OS creates stdin/stdout channels.
Client writes a JSON-RPC initialize request to stdin.
Server reads and processes it.
Server writes the response to stdout.
Client reads the response; communication continues.
Best for: Claude Desktop, Cursor, VS Code, local development, testing.

5.2 HTTP Transport (Remote, Request–Response):
Used when the server runs remotely (e.g., in the cloud). Flow: Client → HTTP POST → Internet → Load Balancer → API Gateway → MCP Server → JSON response → connection closes.

Characteristics: stateless, one request/one response, connection usually closes after completion — very similar to a REST API.

Limitation: if an operation takes 30 seconds to 5 minutes (e.g., "analyze one million sales records"), plain HTTP forces the client to simply wait with no visibility into progress. This is a poor experience and doesn't scale for long-running enterprise workflows.

5.3 Streamable HTTP (Remote, Long-Running, Progressive):
Streamable HTTP extends normal HTTP so the server can send multiple messages during a single logical interaction — think of downloading a large file and watching the progress bar move (10% → 25% → 60% → 90% → Completed) instead of staring at a blank screen.

Initialization sequence:

Client sends initialize (HTTP POST) with protocol version, client name/version, and capabilities.
Server responds with its own protocol version/capabilities, and — critically — returns a unique MCP Session ID in the HTTP response headers (not the JSON body).
Client confirms by sending the notification notifications/initialized. The session is now fully established.
A business request, end to end (e.g., "generate a quarterly sales report"):
    Client                         Server
      |──── tools/call ───────────>|
      |<─── 202 Accepted ──────────|   "I've received this and started processing"
      |<─── 10% Reading Database ──|
      |<─── 20% Executing Query ───|
      |<─── 45% Processing Results─|
      |<─── 70% Generating Summary-|
      |<─── 95% Formatting Output──|
      |<─── Completed + Result ────|
The client receives the full result without polling. Notice: one request, multiple responses.


5.4 Stateless vs Stateful Communication:
Stateless HTTP: every request is independent — Request → Complete → Connection Ends, repeated. The server remembers nothing unless the client resends context every time.

Stateful Streamable HTTP: a session is created once, and every subsequent request reuses it — Initialize → Session Created → Session ID → Request 1 → Request 2 → Request 3 → Same Session.


5.5 Transport Comparison:

Feature	                    STDIO	                    HTTP	                    Streamable HTTP
Communication	            Local process	            Network	                    Network
Same machine required	    Yes                     	No	                        No
Internet required	        No	                        Yes                     	Yes
Long-running tasks	        Limited	                    Basic	                    Excellent
Progress updates	        No                      	Limited	                    Yes
Streaming responses	        No	                        Limited	                    Yes
Best use case	            Local development	        Simple cloud APIs	        Enterprise AI agents
Analogy: STDIO is walking down a hallway in the same building — fast and local. HTTP is sending a courier package — one request, one response. Streamable HTTP is tracking a live delivery — continuous updates until the work finishes.
