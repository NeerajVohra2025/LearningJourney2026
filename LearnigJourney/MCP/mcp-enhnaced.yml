Chapter 3: Core Architecture: Host, Client, Server
MCP follows a client–server architecture with three components. Understand these three roles first — everything else in this document is built on top of them.
        User
          │
          ▼
   ┌─────────────┐
   │  MCP HOST   │   Claude Desktop / Cursor / VS Code / LangGraph app
   └──────┬──────┘
          │ embeds
          ▼
   ┌─────────────┐
   │  MCP CLIENT │   Manages the connection, speaks the protocol
   └──────┬──────┘
          │ (Transport: STDIO / HTTP / Streamable HTTP)
          ▼
   ┌─────────────┐
   │  MCP SERVER │   Exposes tools/resources: DB, CRM, SAP, files, APIs
   └─────────────┘

3.1 MCP Host:
The Host is the AI application or environment where the user interacts — e.g., Claude Desktop, Cursor, VS Code, a custom agent app, or a framework like LangGraph. The Host manages user interaction and initiates communication with external systems.
Responsibilities:
User interaction
AI execution
Agent reasoning

3.2 MCP Client:
The Client is embedded inside the Host. It is the communication manager, responsible for:
Responsibilities:
Tool Discovery
Requesting resources
Tool Invocation
Session Management
Receiving responses
JSON-RPC2 Communication
Passing information back to the AI model

3.3 MCP Server:
The Server is the provider of context and capabilities. It can represent a SQL database, a CRM, a document repository, a cloud service, a REST API, a Kubernetes cluster, or a vector database. Rather than exposing raw APIs directly to AI models, the server presents well-defined, discoverable capabilities through MCP.
Responsibilities:
Expose tools
Expose resources
Execute business logic

3.4 Where Agent Frameworks Fit:
A common misconception is that MCP replaces agent frameworks (LangGraph, OpenAI Agent SDK). It does not — they solve different problems:
Agent Framework (LangGraph, OpenAI Agent SDK)	                                                MCP
Planning	                                                                                    Discovering enterprise capabilities
Reasoning	                                                                                    Accessing data
Multi-agent orchestration	                                                                    Executing tools
Memory	                                                                                        Standardizing communication
Guardrails, workflow execution	                                                                —
The agent framework decides what should happen. MCP provides the standardized way to make it happen.



3.4  Capabilities: Resources, Tools, Prompts:
An MCP Server exposes three primary types of capability:

Capability	             Purpose         	            Examples	                                                               Mutates Data?
Resources	            Provide information	            PDF documents, SQL tables, config files, KB articles	                    No (read-only)
Tools	                Perform actions	                Execute SQL, send email, create Jira ticket, deploy to K8s, search docs	    Yes
Prompts	                Reusable templates that         Standardized prompt for "summarize a legal contract"	                    N/A 
                        guide AI behavior	
Prompts let an organization publish standardized, vetted prompt templates through MCP instead of every team reinventing them.
