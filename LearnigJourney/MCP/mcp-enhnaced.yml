Chapter 12:— Best Practices & Governance Checklist:
Use this checklist when reviewing or standing up a new MCP server for production:

[ ] Naming & instructions — every server has a clear name and instructions that tell the AI Host how to use it safely (e.g., "never delete without confirmation").
[ ] Authentication is mandatory for any server touching sensitive data (Payroll, SAP, Legal) — never ship auth=None to production.
[ ] Least-privilege tools — expose only the specific tools required; do not wrap an entire raw API surface.
[ ] Lifespan management — use lifespan to open connection pools once at startup and close them cleanly at shutdown, rather than per-request.
[ ] Stateless vs. stateful choice is deliberate — set stateless_http based on whether the server needs sampling/progress/streaming, not by default.
[ ] Middleware for governance — logging, auditing, rate limiting, and correlation IDs on every request for traceability.
[ ] Sampling policy is explicit — decide per-server and per-client whether sampling is allowed, and whether it requires user approval.
[ ] One gateway for many servers — at enterprise scale, mount servers under a single FastAPI/Uvicorn host rather than provisioning a port per department.
[ ] Session hygiene — define and enforce session timeout/expiry policy; never assume sessions live forever.
[ ] Transport choice matches deployment — STDIO for local/dev tooling, Streamable HTTP for anything remote or long-running.

