meta:
  name: tool-servicenow
  purpose: "Regenerate the minimum production utility for governed ServiceNow incident creation, retrieval, update, and resolver assignment."
  domain: "ITSM incident management"
  description: "Production-code SSOT. Tests, fixtures, examples, Postman assets, runbooks, generated files, and unused configuration are intentionally excluded."

replication_profile:
  language: {name: Python, version: ">=3.12"}
  agent_frameworks:
    - {name: FastAPI, version: ">=0.135.1", role: "HTTP/S2S transport and dependency injection"}
    - {name: Pydantic, version: ">=2.12.5", role: "Configuration and protocol validation"}
    - {name: platform-sdk, version: "workspace dependency; unspecified", role: "Governed observability context, DLP-aware logging, and tracing"}
    - {name: platform-protocol, version: "0.1.0", role: "Canonical ServiceMessage S2S envelope"}
  orchestration:
    topology: pipeline
    description: "Authenticate -> validate/generate enterprise context -> normalize typed command -> route allowlisted capability -> validate endpoint policy -> call ServiceNow -> validate postconditions -> return protocol envelope."
  model_provider: none
  models: []
  runtime: {type: "Async Python service or embedded package", description: "Uvicorn/FastAPI deployable service plus ToolService and ServiceNowTool Python APIs"}
  hosting_platform: {type: "Google Cloud Run compatible OCI container", description: "Fedora Python 3.12 multi-stage image, non-root UID 1001, port 8086"}
  vector_store: none
  secrets_management: "Environment variables locally; hosted credentials and collector endpoints must be injected from a secret manager. No secret belongs in TOML."
  supporting_services:
    - {name: ServiceNow Table API, type: "HTTP REST", purpose: "Incident CRUD subset and assignment"}
    - {name: platform-registry, type: "HTTP registry", purpose: "Optional registration, heartbeat, deregistration, and capability discovery"}
    - {name: Google Cloud Logging/Trace, type: observability, purpose: "DLP-protected correlated tool telemetry"}
    - {name: Sumo Logic, type: observability, purpose: "Optional platform-sdk HTTP collector"}
  presentation_layer: {framework: none, type: none, backend_binding: none, description: "No UI; S2S, operator HTTP, and Python APIs only"}

source_structure:
  tree: |
    services/tool-servicenow/
    |-- .containerignore
    |-- .env.cloud-run.example
    |-- .env.example
    |-- .env.podman.example
    |-- .gitignore
    |-- config.toml
    |-- tool.toml
    |-- Containerfile
    |-- pyproject.toml
    |-- uv.lock
    |-- shared-contracts/platform-protocol/
    |   |-- pyproject.toml
    |   `-- src/platform_protocol/
    |       |-- __init__.py
    |       |-- __main__.py
    |       |-- application/message_validator.py
    |       `-- domain/{message_type.py,service_message.py,service_metadata.py,service_type.py}
    `-- src/tool_servicenow/
        |-- __init__.py
        |-- __main__.py
        |-- main.py
        |-- app_factory.py
        |-- bootstrap.py
        |-- application/{__init__.py,capability_schemas.py,tool_contract.py}
        |-- configuration/{settings.py,operation_catalog.py}
        |-- adapters/
        |   |-- __init__.py
        |   |-- inbound/{__init__.py,http/{__init__.py,s2s_controller.py,security.py}}
        |   `-- outbound/{__init__.py,registry/{__init__.py,registrar.py},servicenow/__init__.py}
        |-- client/
        |   |-- __init__.py
        |   |-- agent_client.py
        |   `-- capabilities/{__init__.py,_base.py,create_incident.py,retrieve_incident.py,update_incident.py,assign_resolver_group.py}
        |-- core/
        |   |-- __init__.py
        |   |-- application/{__init__.py,commands.py,request_normalizer.py,tool_service.py}
        |   |-- domain/{__init__.py,policies.py,servicenow_policies.py,value_objects.py,workflow_contract.py}
        |   `-- ports/{__init__.py,inbound.py,outbound.py}
        |-- infrastructure/
        |   |-- capability_executor.py
        |   |-- http_client.py
        |   |-- operation_router.py
        |   |-- registry_client.py
        |   `-- operations/{assign_resolver_group.py,capability_tool.py,contract_endpoint_executor.py,create_incident.py,incident_identity.py,retrieve_incident.py,update_incident.py}
        `-- observability/{__init__.py,runtime.py}
  entry_points:
    - {path: src/tool_servicenow/__main__.py, purpose: "tool-servicenow CLI; checks port and starts Uvicorn factory"}
    - {path: src/tool_servicenow/app_factory.py, purpose: "FastAPI composition/lifecycle root"}
    - {path: src/tool_servicenow/bootstrap.py, purpose: "Embedded and HTTP dependency composition"}
    - {path: src/tool_servicenow/application/tool_contract.py, purpose: "Agent-facing embedded facade"}
    - {path: src/tool_servicenow/client/agent_client.py, purpose: "Remote async S2S client"}
  modules:
    - {path: application/capability_schemas.py, role: schema catalog, key_responsibilities: ["Draft 2020-12 input/output schemas", "registry-safe schema metadata"]}
    - {path: application/tool_contract.py, role: embedded facade, key_responsibilities: ["four explicit methods", "generic invoke", "workflow metadata"]}
    - {path: core/application/commands.py, role: typed commands, key_responsibilities: ["canonical capability payload serialization"]}
    - {path: core/application/request_normalizer.py, role: normalization, key_responsibilities: ["aliases", "body/data promotion", "typed command construction"]}
    - {path: core/application/tool_service.py, role: use case, key_responsibilities: ["execute one capability", "configuration/live readiness"]}
    - {path: core/domain/value_objects.py, role: domain values, key_responsibilities: ["incident identity", "assignment targets", "placeholder filtering"]}
    - {path: core/domain/policies.py, role: governance/readiness, key_responsibilities: ["host/method allowlist", "credential readiness"]}
    - {path: core/domain/servicenow_policies.py, role: ServiceNow decisions, key_responsibilities: ["update verification", "assignment sequencing", "partial-success policy"]}
    - {path: infrastructure/operation_router.py, role: explicit router, key_responsibilities: ["allowlisted capability dispatch"]}
    - {path: infrastructure/http_client.py, role: outbound transport, key_responsibilities: ["wrapper-owned auth", "header sanitization", "response decoding"]}
    - {path: infrastructure/operations, role: capability adapters, key_responsibilities: ["create/retrieve/update/assign behavior", "identity lookup", "endpoint expansion"]}
    - {path: adapters/inbound/http/s2s_controller.py, role: HTTP adapter, key_responsibilities: ["S2S/operator routes", "idempotency", "safe error mapping", "tool telemetry"]}
    - {path: adapters/outbound/registry/registrar.py, role: registry lifecycle, key_responsibilities: ["metadata publication", "heartbeat", "deregistration"]}
    - {path: configuration/settings.py, role: configuration, key_responsibilities: ["TOML/env precedence", "typed settings", "process cache"]}
  config_files:
    - {path: config.toml, purpose: "Non-secret runtime baseline"}
    - {path: tool.toml, purpose: "Registry-facing identity/capability contract"}
    - {path: .env.example, purpose: "Local runtime template"}
    - {path: .env.cloud-run.example, purpose: "Cloud Run template"}
    - {path: .env.podman.example, purpose: "Podman template"}
    - {path: pyproject.toml, purpose: "Minimum package/build/runtime dependencies"}
    - {path: Containerfile, purpose: "Non-root OCI image"}
  notable_conventions: ["Hexagonal boundaries", "async I/O", "explicit capability maps", "typed immutable commands/value objects", "wrapper-owned credentials", "fail-closed egress governance", "no model or prompt"]

architecture:
  pattern: tool-calling
  components:
    - {name: HTTP/S2S adapter, role: inbound, description: "Protected canonical /s2s and optional operator routes", inputs: [ServiceMessage, HTTP], outputs: [ServiceMessage, JSON]}
    - {name: ToolService, role: application, description: "Normalizes and executes exactly one capability", inputs: [capability, payload], outputs: [ServiceNow result]}
    - {name: OperationRouter, role: deterministic router, description: "Only four compiled operations exist", inputs: [CapabilityRequest], outputs: [operation result]}
    - {name: EndpointGovernancePolicy, role: egress guard, description: "Checks fixed method and endpoint host", inputs: [method, URL, payload], outputs: [allow or exception]}
    - {name: ServiceNowHttpClient, role: outbound adapter, description: "Adds wrapper auth and strips caller credentials", inputs: [HTTP request], outputs: [decoded response]}
    - {name: Registrar, role: lifecycle adapter, description: "Optional discovery publication", inputs: [tool.toml, settings], outputs: [registry action status]}
    - {name: DownstreamObservabilityPipeline, role: telemetry, description: "Governed context and DLP-aware terminal tool evidence", inputs: [headers, payload, result], outputs: [logs/traces]}
  data_flows:
    - {from: agent, to: "/s2s", data_type: ServiceMessage, description: "Authenticated capability request"}
    - {from: inbound adapter, to: ToolService, data_type: "capability + payload", description: "Context-governed execution"}
    - {from: normalizer, to: OperationRouter, data_type: CapabilityRequest, description: "Typed canonical command"}
    - {from: operation, to: ServiceNowHttpClient, data_type: governed HTTP, description: "Fixed method/template plus safe query/body/headers"}
    - {from: lifecycle, to: platform-registry, data_type: service metadata, description: "Optional register/heartbeat/deregister"}
  state_schema:
    s2s_idempotency_cache: {type: "dict[(correlation_id, capability), response]", applies_to: [servicenow.assign_resolver_group], maximum_entries: 1024, eviction: "oldest insertion", persistence: none}
    settings_cache: {type: "LRU maxsize=1", persistence: process}
  entry_point: "tool-servicenow -> tool_servicenow.__main__:main -> tool_servicenow.app_factory:app_factory"
  terminal_conditions: ["ServiceNow success response", "protocol ERROR envelope", "direct HTTP error", "readiness response", "registration lifecycle result"]

api_contracts:
  entry_points:
    - {name: "POST /s2s", invocation_style: canonical HTTP, signature: "handle_s2s(request, ServiceMessage, ToolService)", inputs: [ServiceMessage, Authorization, enterprise headers], outputs: [ServiceMessage], description: "Only canonical agent/platform capability endpoint"}
    - {name: "GET /health", invocation_style: HTTP, signature: "health()->dict[str,str]", inputs: [], outputs: ["{status:UP}"], description: liveness}
    - {name: "GET /readyz", invocation_style: HTTP, signature: "readiness_probe(request,response)->dict", inputs: [], outputs: ["{status:READY|NOT_READY}"], description: "503 when not ready"}
    - {name: "GET /ready", invocation_style: HTTP, signature: "ready(service)->dict", inputs: [], outputs: [ReadinessResult], description: detailed readiness}
    - {name: "GET /capabilities/schemas", invocation_style: HTTP, signature: "capability_schemas()->dict", inputs: [], outputs: [CapabilitySchemaCatalog], description: discovery schemas}
    - {name: "POST /register-self", invocation_style: HTTP, signature: "register_self(request)->dict", inputs: [], outputs: [RegistryStatus], description: manual registration}
    - {name: "GET /incident", invocation_style: operator HTTP, signature: "get_incident(sysparm_limit=100, incident_sys_id=None, incident_number=None)", inputs: [query], outputs: [ServiceNow result], description: "limit 1..1000"}
    - {name: "PUT /incident/{incident_sys_id}", invocation_style: operator HTTP, signature: "put_incident(incident_sys_id, update_data)", inputs: [identifier, update], outputs: [ServiceNow result], description: update}
    - {name: "PUT /incident", invocation_style: operator HTTP, signature: "put_incident_by_identifier(update_request, incident_sys_id=None, incident_number=None)", inputs: [identifier, update], outputs: [ServiceNow result], description: update by either identity}
    - {name: "PUT /incident/{incident_sys_id}/resolver-assignment", invocation_style: operator HTTP, signature: "put_incident_resolver_assignment(incident_sys_id, assignment_data)", inputs: [identifier, assignment], outputs: [ServiceNow result], description: assignment}
    - {name: "PUT /incident/resolver-assignment", invocation_style: operator HTTP, signature: "put_incident_resolver_assignment_by_identifier(assignment_request, incident_sys_id=None, incident_number=None)", inputs: [identifier, assignment], outputs: [ServiceNow result], description: assignment by either identity}
    - {name: "POST /api/execute", invocation_style: deprecated operator HTTP, signature: "execute_api(payload)", inputs: [compatibility envelope], outputs: ["{message,capability,result}"], description: "Hidden from schema; omit in a strict minimum deployment if backward compatibility is not required"}
    - {name: ServiceNowTool, invocation_style: embedded Python, signature: "create/retrieve/update/assign/invoke", inputs: [dict], outputs: [dict], description: explicit facade}
    - {name: AsyncServiceNowToolClient, invocation_style: remote Python, signature: "four convenience methods + invoke", inputs: [typed keyword arguments], outputs: [dict], description: S2S client}
  internal_interfaces:
    - {name: ToolServicePort, signature: "execute(capability,payload); operational_readiness(); close()", description: inbound port}
    - {name: CapabilityExecutorPort, signature: "execute(CapabilityRequest); supported_capabilities(); dependency_issues(); close()", description: outbound port}

business_logic:
  intent: "Expose a narrow incident API without becoming a generic authenticated HTTP proxy or leaking caller credentials to ServiceNow."
  rules:
    - "Accept exactly four capabilities: servicenow.create_incident, retrieve_incident, update_incident, assign_resolver_group; reject every other name."
    - "Payload must be an object; query, headers, body, and data must be objects when present."
    - "Normalize incident_sys_id aliases in order incident_sys_id, incident_id, sys_id; also preserve incident_number."
    - "Trim optional text; treat replace-with-* and {{placeholder}} assignment values as absent."
    - "Create promotes body to data when data is absent; otherwise infers data from non-control top-level fields."
    - "Create removes an unresolved {incident_sys_id} path component unless an identifier was explicitly supplied."
    - "Retrieve accepts identity at top-level or sys_id aliases inside query."
    - "Retrieve incident_number becomes sysparm_query=number=<number> unless caller already supplied sysparm_query."
    - "List retrieval defaults sysparm_limit to string '100'; explicit caller value wins."
    - "Retrieval by sys_id appends it to a list endpoint when the template has no placeholder."
    - "If retrieval by sys_id returns HTTP 404, retry once against the list endpoint with sysparm_query=sys_id=<id> and sysparm_limit=1. No other failure falls back."
    - "Update and assignment accept incident_number by first GETting list endpoint with number query, limit 1, fields sys_id."
    - "If number lookup finds no sys_id, fail; if supplied sys_id conflicts with resolved sys_id, fail."
    - "Update normalizes preferred contact method mobile/phone to phone and email to email."
    - "Update sets sysparm_input_display_value=true unless supplied."
    - "Only when validate_update_applied is truthy (bool or 1/true/yes/on string), compare returned fields; journal work_notes/comments use case-insensitive containment, others exact normalized comparison."
    - "Ignore requested fields absent from ServiceNow response during update verification; fail only fields returned with mismatched values."
    - "Resolver alias keys are uppercase; an alias must resolve through configured map unless direct assignment_group is supplied."
    - "Assignment group precedence is body.assignment_group, top-level assignment_group, resolver alias, configured default."
    - "Assigned-to precedence is body.assigned_to then top-level assigned_to. Work notes precedence is body, top-level, then the human-approval default sentence."
    - "Assignment requires a resolved assignment_group."
    - "Request sysparm_display_value=all for assignment verification; use sysparm_input_display_value=true for display values but remove it for 32-hex sys_ids."
    - "When assignment_group and assigned_to differ in sys_id-vs-display shape, update group first and assignee second; otherwise submit together."
    - "After assignment group success, accept assignee HTTP 403 as partial success only when detail indicates business-rule/group-abort policy and not authentication; return tool_partial_success=true and warning."
    - "Verify returned assignment_group against requested value or display_value when ServiceNow includes it; fail on mismatch."
    - "When endpoint governance is enabled, allow only configured uppercase methods and allowlisted hosts; derive allowed host from ServiceNow base URL when configured list is empty."
    - "Caller headers authorization, cookie, proxy-authorization, x-api-key, and x-usertoken are never forwarded; caller cannot override wrapper default headers."
    - "Outbound auth_type is basic, header, or none. Basic requires username/password. Header auth must reside in wrapper default headers."
    - "Decode JSON responses as JSON, empty bodies as {}, and other bodies as {content:text}; raise for non-2xx."
    - "Inbound bearer auth is optional. If required but configured token is absent, return 503; missing/malformed or unequal token returns 401 using constant-time comparison."
    - "Production S2S requires x-enterprise-current-service; local S2S may execute without governed context."
    - "Non-REQUEST S2S returns protocol ERROR code TOOL_PROTOCOL_INVALID_MESSAGE_TYPE rather than HTTP failure."
    - "Default S2S capability is retrieve only for metadata/error/idempotency computation; execution passes empty capability when omitted and therefore rejects it."
    - "Cache terminal success and error responses only for assign_resolver_group, keyed by correlation_id+capability; replay duplicate without ServiceNow I/O; cap at 1024."
    - "Map governed context, egress policy, upstream 401/403/other HTTP, timeout, request error, ValueError, and unknown exceptions to stable protocol error codes."
    - "Bound upstream HTTP error detail to 500 characters."
    - "Direct endpoints map governance to 403, validation to 400, upstream 4xx to same status, upstream 5xx/other failures to 502."
    - "Operator routes return 404 when operator_endpoints_enabled=false; /s2s remains available."
    - "Readiness checks placeholder base URL; basic credentials, header auth headers, optional registry key, and optionally one live ServiceNow GET with sysparm_limit=1."
    - "Configuration precedence is preexisting OS env > .env > config.toml; settings process cache size is one."
    - "Registration has exactly one startup attempt and zero retry delay. Fail-fast raises after any nonregistered result."
    - "Only start heartbeat after registered/already_registered; stop on shutdown; optionally deregister; then drain observability and close owned tool service."
    - "Registry localhost URLs additionally try host.containers.internal only after ConnectError."
    - "Registry duplicate HTTP 400 containing 'already registered' is success state already_registered. Missing API key skips unless raise_on_error."
    - "Service ID precedence: env override, tool.toml static id, generated service-hostname-port. Endpoint precedence: env override, nonplaceholder tool.toml endpoint, generated http://service:port/s2s."
  constraints: ["No LLM/model/prompt", "No database/vector store", "No arbitrary capability or HTTP verb", "No caller credentials forwarded", "No registration retries", "Only assignment is idempotency-cached", "Cache is process-local"]
  assumptions: ["ServiceNow Table API response usually uses result", "Reference fields may be scalar or {value,display_value}", "platform-sdk implements context validation and DLP delivery outside this service"]
  domain_terms: {incident_sys_id: "ServiceNow unique record ID, normally 32 hex characters", incident_number: "Human-readable INC identifier", resolver_group: "Agent-facing alias", assignment_group: "ServiceNow reference/sys_id", partial_success: "Group updated but assignee blocked by ServiceNow business policy"}

tool_inventory:
  tools:
    - {name: servicenow.create_incident, type: HTTP POST, description: "Create incident", inputs: [CreateIncidentPayload], outputs: [ServiceNowResponse]}
    - {name: servicenow.retrieve_incident, type: HTTP GET, description: "List or retrieve incident", inputs: [RetrieveIncidentPayload], outputs: [ServiceNowResponse]}
    - {name: servicenow.update_incident, type: HTTP PUT, description: "Update incident", inputs: [UpdateIncidentPayload], outputs: [ServiceNowResponse]}
    - {name: servicenow.assign_resolver_group, type: HTTP PUT, description: "Human-approved group/assignee update", inputs: [AssignmentPayload], outputs: [ServiceNowResponse]}
  mcps: []
  external_services:
    - {name: ServiceNow Table API, type: REST, purpose: incident operations, auth_method: "wrapper-owned Basic, header, or none"}
    - {name: platform-registry, type: REST, purpose: discovery lifecycle, auth_method: x-api-key}
    - {name: Google Cloud Logging/Trace, type: observability, purpose: governed telemetry, auth_method: runtime identity/ADC}
    - {name: Sumo Logic, type: observability, purpose: optional collector, auth_method: secret endpoint}
  databases: []

prompt_patterns:
  system_prompts: []
  user_prompt_templates: []
  chains:
    - {name: capability_pipeline, steps: ["authenticate", "establish context", "normalize command", "route fixed capability", "validate egress", "call ServiceNow", "validate postcondition", "emit terminal evidence", "return envelope"]}
  evaluation_criteria: ["Never forward caller credentials", "Never execute unknown capability/method/host", "Never claim assignment/update reflected when returned evidence conflicts", "Never retry registry startup or arbitrary mutations"]

config_schema:
  env_vars:
    - {name: TOOL_SERVICENOW_CONFIG_PATH, purpose: TOML path, required: false, example_format: config.toml}
    - {name: TOOL_SERVICENOW_HOST, purpose: bind host, required: false, example_format: 0.0.0.0}
    - {name: TOOL_SERVICENOW_PORT, purpose: bind/identity port, required: false, example_format: "8086"}
    - {name: PORT, purpose: Cloud Run port mapped by container shell, required: false, example_format: "8080"}
    - {name: TOOL_SERVICENOW_RELOAD, purpose: Uvicorn reload, required: false, example_format: "false"}
    - {name: TOOL_SERVICENOW_SERVICE_NAME, purpose: identity, required: false, example_format: tool-servicenow}
    - {name: TOOL_SERVICENOW_SERVICE_VERSION, purpose: identity version, required: false, example_format: 1.0.0}
    - {name: TOOL_SERVICENOW_ENVIRONMENT, purpose: environment/production context enforcement, required: false, example_format: production}
    - {name: TOOL_SERVICENOW_AUTH_REQUIRED, purpose: inbound bearer toggle, required: false, example_format: "true"}
    - {name: TOOL_SERVICENOW_AUTH_TOKEN_ENV, purpose: token variable name, required: false, example_format: TOOL_SERVICENOW_AUTH_TOKEN}
    - {name: TOOL_SERVICENOW_AUTH_TOKEN, purpose: inbound token, required: "when auth required", example_format: "<secret>"}
    - {name: TOOL_SERVICENOW_BASE_URL, purpose: incident table URL, required: true, example_format: "https://<instance>.service-now.com/api/now/table/incident"}
    - {name: TOOL_SERVICENOW_AUTH_TYPE, purpose: outbound auth, required: true, example_format: "basic|header|none"}
    - {name: TOOL_SERVICENOW_USERNAME, purpose: Basic username, required: "basic auth", example_format: "<secret>"}
    - {name: TOOL_SERVICENOW_PASSWORD, purpose: Basic password, required: "basic auth", example_format: "<secret>"}
    - {name: TOOL_SERVICENOW_TIMEOUT_SECONDS, purpose: upstream timeout, required: false, example_format: "30"}
    - {name: TOOL_SERVICENOW_DEFAULT_HEADERS, purpose: wrapper-owned headers, required: "header auth", example_format: "Accept=application/json;X-UserToken=<secret>"}
    - {name: TOOL_SERVICENOW_READY_CHECK_UPSTREAM, purpose: live readiness toggle, required: false, example_format: "true"}
    - {name: TOOL_SERVICENOW_DEFAULT_RESOLVER_GROUP_SYS_ID, purpose: assignment fallback, required: false, example_format: "32-hex sys_id"}
    - {name: TOOL_SERVICENOW_RESOLVER_GROUP_SYS_ID_MAP, purpose: alias map, required: false, example_format: "EAI=<sys_id>,SPES=<sys_id>"}
    - {name: TOOL_SERVICENOW_ENDPOINT_CREATE_INCIDENT, purpose: endpoint override, required: false, example_format: "{servicenow.base_url}"}
    - {name: TOOL_SERVICENOW_ENDPOINT_RETRIEVE_INCIDENT, purpose: endpoint override, required: false, example_format: "{servicenow.base_url}"}
    - {name: TOOL_SERVICENOW_ENDPOINT_UPDATE_INCIDENT, purpose: endpoint override, required: false, example_format: "{servicenow.base_url}/{incident_sys_id}"}
    - {name: TOOL_SERVICENOW_ENDPOINT_ASSIGN_RESOLVER_GROUP, purpose: endpoint override, required: false, example_format: "{servicenow.base_url}/{incident_sys_id}"}
    - {name: REGISTRY_URL, purpose: registry base URL, required: "when registration enabled", example_format: "http://platform-registry:8500"}
    - {name: TOOL_SERVICENOW_REGISTRY_API_KEY_ENV, purpose: registry key variable name, required: false, example_format: PLATFORM_REGISTRY_API_KEY}
    - {name: PLATFORM_REGISTRY_API_KEY_ENV, purpose: compatibility override for key variable name, required: false, example_format: PLATFORM_REGISTRY_API_KEY}
    - {name: PLATFORM_REGISTRY_API_KEY, purpose: registry secret fallback, required: "when registration enabled", example_format: "<secret>"}
    - {name: TOOL_SERVICENOW_REGISTRY_API_KEY, purpose: registry secret fallback, required: false, example_format: "<secret>"}
    - {name: TOOL_SERVICENOW_REGISTRY_TIMEOUT_SECONDS, purpose: registry timeout, required: false, example_format: "10"}
    - {name: TOOL_SERVICENOW_AUTO_REGISTER, purpose: startup registration, required: false, example_format: "false"}
    - {name: TOOL_SERVICENOW_REGISTRATION_FAIL_FAST, purpose: fail startup, required: false, example_format: "false"}
    - {name: TOOL_SERVICENOW_HEARTBEAT_ENABLED, purpose: heartbeat, required: false, example_format: "true"}
    - {name: TOOL_SERVICENOW_HEARTBEAT_INTERVAL_SECONDS, purpose: heartbeat cadence, required: false, example_format: "20"}
    - {name: TOOL_SERVICENOW_DEREGISTER_ON_SHUTDOWN, purpose: deregistration, required: false, example_format: "true"}
    - {name: TOOL_SERVICENOW_ENABLE_GOVERNANCE_CONTROLS, purpose: egress policy, required: false, example_format: "true"}
    - {name: TOOL_SERVICENOW_ALLOWED_ENDPOINT_HOSTS, purpose: host allowlist, required: false, example_format: "instance.service-now.com"}
    - {name: TOOL_SERVICENOW_ALLOWED_HTTP_METHODS, purpose: method allowlist, required: false, example_format: "GET,POST,PUT"}
    - {name: TOOL_SERVICENOW_OPERATOR_ENDPOINTS_ENABLED, purpose: direct routes, required: false, example_format: "false"}
    - {name: TOOL_SERVICENOW_LOG_LEVEL, purpose: log level, required: false, example_format: INFO}
    - {name: TOOL_SERVICENOW_LOG_NAME, purpose: cloud log name, required: false, example_format: genai-application}
    - {name: GOOGLE_CLOUD_PROJECT, purpose: project, required: "cloud logging", example_format: project-id}
    - {name: TOOL_SERVICENOW_CLOUD_LOGGING, purpose: cloud delivery, required: false, example_format: "true"}
    - {name: TOOL_SERVICENOW_OBSERVABILITY_CONTEXT_ENABLED, purpose: context pipeline, required: false, example_format: "true"}
    - {name: TOOL_SERVICENOW_GENERATE_CONTEXT_WHEN_MISSING, purpose: synthesize operator context, required: false, example_format: "true"}
    - {name: TOOL_SERVICENOW_BUSINESS_PROCESS, purpose: workflow label, required: false, example_format: incident-management}
    - {name: TOOL_SERVICENOW_SERVICE_ID, purpose: registry identity override, required: false, example_format: tool-servicenow-instance-8086}
    - {name: TOOL_SERVICENOW_INSTANCE_ID, purpose: generated identity component, required: false, example_format: instance-1}
    - {name: TOOL_SERVICENOW_S2S_ENDPOINT, purpose: published endpoint override, required: false, example_format: "https://service/s2s"}
    - {name: SUMO_LOGIC_ENABLED, purpose: collector toggle, required: false, example_format: "true"}
    - {name: SUMO_LOGIC_ENDPOINT, purpose: collector secret URL, required: "if enabled", example_format: "<secret>"}
    - {name: SUMO_LOGIC_TIMEOUT_SECONDS, purpose: delivery timeout, required: false, example_format: "2"}
  parameters:
    - {name: server, type: object, default: "host=127.0.0.1, port=8086, reload=false", description: listener}
    - {name: service, type: object, default: "tool-servicenow 1.0.0 local", description: identity}
    - {name: observability, type: object, default: "INFO, cloud/context/generation enabled, incident-management", description: telemetry}
    - {name: tool_auth, type: object, default: "required=false, token_env=TOOL_SERVICENOW_AUTH_TOKEN", description: ingress auth}
    - {name: registry, type: object, default: "localhost:8500, PLATFORM_REGISTRY_API_KEY, 10s", description: discovery}
    - {name: servicenow, type: object, default: "basic, 30s, JSON/transaction headers, no live check", description: upstream}
    - {name: endpoints, type: object, default: "base for create/retrieve; base/{incident_sys_id} for update/assign", description: reviewed routes}
    - {name: registration, type: object, default: "off; one attempt; heartbeat 20s; deregister true", description: lifecycle}
    - {name: guardrails, type: object, default: "enabled; GET/POST/PUT; operator routes true", description: egress/route policy}
  warnings:
    - "All token, password, username, API key, X-UserToken, and collector endpoint values are <secret>."
    - "Omit config.toml [example_client] entirely; production runtime never reads it."
    - "Omit configuration/postman_environment.py and the prepare-postman console entry point from minimum regeneration."
    - "resolve_registry_api_key accepts a literal secret mistakenly placed in api_key_env for compatibility; do not reproduce this unsafe compatibility branch in a clean minimum build unless required."

