adr:
  - {id: ADR-001, decision: "Deterministic four-capability wrapper, not an agent reasoner", context: "ServiceNow credentials grant material write access", rationale: "Prevent arbitrary URL/verb/tool selection", alternatives_considered: ["generic HTTP proxy", "LLM tool router"], consequences: "Narrow safe contract"}
  - {id: ADR-002, decision: "Wrapper owns all outbound authentication", context: "Callers are less trusted than integration service", rationale: "Prevent credential forwarding and override", alternatives_considered: ["pass-through Authorization"], consequences: "Separate inbound/outbound credentials"}
  - {id: ADR-003, decision: "Resolve incident_number to sys_id before mutations", context: "Numbers are human-friendly but sys_ids are unique route identifiers", rationale: "Detect conflicts and use canonical record path", alternatives_considered: ["mutate by encoded query"], consequences: "One extra GET for number-based mutation"}
  - {id: ADR-004, decision: "Split mixed-format group/assignee reference updates", context: "ServiceNow input display mode applies request-wide", rationale: "Each reference receives correct input mode", alternatives_considered: ["single combined PUT always"], consequences: "Potential two-step partial success"}
  - {id: ADR-005, decision: "Process-local idempotency only for resolver assignment", context: "Duplicate assignment retries are risky", rationale: "Replay terminal response without repeated mutation", alternatives_considered: ["no cache", "durable database"], consequences: "Not shared across replicas/restarts"}
  - {id: ADR-006, decision: "Optional one-attempt registry lifecycle", context: "Discovery must not create retry storms", rationale: "Explicit fail-fast or degraded startup", alternatives_considered: ["unbounded retry"], consequences: "Transient registry failure needs external recovery/manual registration"}

abom:
  frameworks: ["FastAPI >=0.135.1", "Pydantic >=2.12.5", "httpx >=0.28.1", "Uvicorn >=0.41.0", "python-dotenv >=1.2.1", "platform-sdk workspace", "platform-protocol 0.1.0"]
  models: []
  tools: ["ServiceNow create incident", "ServiceNow retrieve incident", "ServiceNow update incident", "ServiceNow assign resolver group"]
  mcps: []
  platforms: ["Python 3.12", "OCI/Podman", "Google Cloud Run", "ServiceNow", "platform-registry", "Google Cloud Logging/Trace", "optional Sumo Logic"]
  data_classification: "Operational/confidential: incident identifiers, descriptions, work notes, assignee/group references, tenant/correlation context, and upstream diagnostics. Secrets: all auth tokens, usernames/passwords, API keys, and collector endpoints."
  estimated_cost_profile: "No model cost. Per invocation uses one ServiceNow call normally; number resolution, sys_id fallback, or split assignment can add one call. Optional readiness, registry heartbeat, cloud telemetry, and Sumo ingestion add usage-based network/observability cost."

