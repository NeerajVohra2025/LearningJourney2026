meta:
  name: security-guardrails-armor
  purpose: Regenerate the synchronous Google Cloud Model Armor adapter and demonstration client.
  domain: AI security guardrails
  description: Utility code-generation blueprint for runtime code only; tests, test helpers, and documentation logic are excluded.

replication_profile:
  language: { name: Python, version: ">=3.12; armor_client.py inline metadata permits >=3.11" }
  agent_frameworks:
    - { name: google-cloud-modelarmor, version: "declared >=0.3.0; locked 0.7.1", role: "Typed security-filtering SDK and client" }
  orchestration:
    topology: pipeline
    description: Screen input; if the demo allows it, screen output. The adapter exposes both operations independently.
  model_provider: none
  models: []
  runtime: { type: "Python library and CLI script", description: "armor_utility.py is reusable; armor_client.py is executable" }
  hosting_platform: { type: none, description: "No server, container, function, or IaC" }
  vector_store: none
  secrets_management: Application Default Credentials; never store credentials in local configuration.
  supporting_services:
    - { name: "Google Cloud Model Armor API", type: "managed security API", purpose: "Evaluate text against an enterprise template" }
    - { name: "ADC and Cloud IAM", type: "identity controls", purpose: "Authenticate and authorize SDK calls" }
  presentation_layer: { framework: none, type: console, backend_binding: "armor_client.main -> ArmorUtility", description: "Print demonstration evidence to stdout" }

source_structure:
  tree: |
    security-guardrails-armor/
    |-- .env
    |-- armor_client.py
    |-- armor_utility.py
    |-- config.toml
    |-- pyproject.toml
    `-- uv.lock
  entry_points:
    - { path: armor_client.py, purpose: "Run the input/output demonstration pipeline" }
    - { path: armor_utility.py, purpose: "Expose ArmorUtility to importing applications" }
  modules:
    - path: armor_utility.py
      role: Provider adapter
      key_responsibilities: ["Validate values", "Select endpoint", "Build typed requests", "Make one call", "Return typed response unchanged"]
    - path: armor_client.py
      role: Local demonstration client
      key_responsibilities: ["Load configuration", "Invoke both boundaries", "Apply demo-only decision", "Print evidence"]
  config_files:
    - { path: .env, purpose: "Synthetic demonstration content" }
    - { path: config.toml, purpose: "Template, location, and timeout" }
    - { path: pyproject.toml, purpose: "Package and dependency definition" }
    - { path: uv.lock, purpose: "Exact dependency resolution" }
  notable_conventions: ["Policy-free adapter", "Official SDK types", "Injectable client", "Regional endpoint selection"]

architecture:
  pattern: pipeline
  components:
    - { name: ArmorUtility, role: "outbound adapter", description: "Validate, construct requests, call Model Armor, return responses", inputs: [template_name, location, timeout_seconds, client, text], outputs: [SanitizeUserPromptResponse, SanitizeModelResponseResponse] }
    - { name: "Demonstration client", role: "loader and presenter", description: "Run conditional input/output screening", inputs: [.env, config.toml], outputs: [stdout] }
    - { name: ModelArmorClient, role: "external SDK client", description: "Call managed API synchronously", inputs: [request, timeout], outputs: [response] }
  data_flows:
    - { from: armor_client.main, to: ArmorUtility.sanitize_user_prompt, data_type: str, description: "Screen input first" }
    - { from: ArmorUtility.sanitize_user_prompt, to: ModelArmorClient.sanitize_user_prompt, data_type: SanitizeUserPromptRequest, description: "Submit input request" }
    - { from: armor_client._print_result, to: armor_client.main, data_type: bool, description: "Control whether output screening runs" }
    - { from: armor_client.main, to: ArmorUtility.sanitize_model_response, data_type: str, description: "Screen output when input is allowed" }
    - { from: ArmorUtility.sanitize_model_response, to: ModelArmorClient.sanitize_model_response, data_type: SanitizeModelResponseRequest, description: "Submit output request" }
  state_schema: { template_name: str, timeout_seconds: float, client: "ModelArmorClient-compatible object" }
  entry_point: "armor_client.main for execution; ArmorUtility for integration"
  terminal_conditions: ["Input blocked, so output is skipped", "Output result printed", "An exception propagates"]

api_contracts:
  entry_points:
    - name: ArmorUtility.__init__
      invocation_style: constructor
      signature: "__init__(self, template_name: str, location: str, timeout_seconds: float = 30.0, client: modelarmor_v1.ModelArmorClient | None = None) -> None"
      inputs: ["template_name: str", "location: str", "timeout_seconds: float", "optional client"]
      outputs: [ArmorUtility]
      description: Validate configuration and create or retain a client.
    - name: ArmorUtility.sanitize_user_prompt
      invocation_style: synchronous
      signature: "sanitize_user_prompt(self, text: str) -> modelarmor_v1.SanitizeUserPromptResponse"
      inputs: ["non-empty text: str"]
      outputs: ["typed response unchanged"]
      description: Screen user input.
    - name: ArmorUtility.sanitize_model_response
      invocation_style: synchronous
      signature: "sanitize_model_response(self, text: str) -> modelarmor_v1.SanitizeModelResponseResponse"
      inputs: ["non-empty text: str"]
      outputs: ["typed response unchanged"]
      description: Screen generated output.
    - name: armor_client.main
      invocation_style: script
      signature: "main() -> None"
      inputs: [.env, config.toml, ADC]
      outputs: [stdout]
      description: Execute the demonstration.
  internal_interfaces:
    - { name: _contains_match, signature: "_contains_match(value: Any) -> bool", description: "Recursively find MATCH_FOUND" }
    - { name: _print_result, signature: "_print_result(boundary: str, response: Any, original: str) -> bool", description: "Interpret and print one result" }

business_logic:
  intent: Add input and output security checkpoints without embedding enterprise enforcement policy in the adapter.
  rules:
    - "If template_name.strip() or location.strip() is empty, raise ValueError('template_name and location are required')."
    - "If timeout_seconds <= 0, raise ValueError('timeout_seconds must be greater than zero')."
    - "If location.lower() is not global, use modelarmor.<location>.rep.googleapis.com; otherwise use ModelArmorClient.DEFAULT_ENDPOINT."
    - "Use a truthy injected client; otherwise create ModelArmorClient(ClientOptions(api_endpoint=endpoint))."
    - "If either method receives empty or whitespace-only text, raise ValueError('text is required')."
    - "For input, build SanitizeUserPromptRequest(name=template_name, user_prompt_data=DataItem(text=text))."
    - "Call sanitize_user_prompt exactly once with request and timeout_seconds; return the exact result."
    - "For output, build SanitizeModelResponseRequest(name=template_name, model_response_data=DataItem(text=text))."
    - "Call sanitize_model_response exactly once with request and timeout_seconds; return the exact result."
    - "_contains_match recursively examines dict values and list items; a scalar matches only when it is a case-insensitive MATCH_FOUND string."
    - "_print_result converts sanitization_result._pb with MessageToDict and preserving_proto_field_name=True."
    - "Match names are filter_results keys whose nested detail contains MATCH_FOUND."
    - "invocation_ok means invocation_result == SUCCESS."
    - "allowed means invocation_ok and filter_match_state == NO_MATCH_FOUND."
    - "If disallowed after successful invocation with no named match, use 'provider match'."
    - "If invocation failed with no named match, use 'provider invocation <enum name>'."
    - "Print boundary, original synthetic text, allowed, matches, and original-or-BLOCKED safe text."
    - "Read .env line-by-line; ignore blanks, comments, and lines without '='; split once and use os.environ.setdefault."
    - "Read config.toml['model_armor']; require template_name/location; convert timeout to float and default it to 30."
    - "Strip ARMOR_TEST_INPUT and ARMOR_TEST_OUTPUT; raise ValueError if either is empty."
    - "Sanitize input first; if disallowed, print the skip notice and return; otherwise sanitize and print output."
    - "Do not catch SDK or provider exceptions."
  constraints: ["No LLM, RAG, memory, MCP, database, queue, endpoint, retry, telemetry, or persistence", "ArmorUtility does not decide allowed or rewrite content", "Both methods use the same template and timeout"]
  assumptions: ["ADC and IAM are configured", "The template exists at the configured location", "Responses expose sanitization_result._pb"]
  domain_terms:
    template: Externally managed Model Armor filter configuration.
    input_boundary: Screening before AI or tool execution.
    output_boundary: Screening before releasing generated content.

tool_inventory:
  tools:
    - { name: sanitize_user_prompt, type: "SDK operation", description: "Screen input", inputs: [SanitizeUserPromptRequest, timeout], outputs: [SanitizeUserPromptResponse] }
    - { name: sanitize_model_response, type: "SDK operation", description: "Screen output", inputs: [SanitizeModelResponseRequest, timeout], outputs: [SanitizeModelResponseResponse] }
  mcps: []
  external_services:
    - { name: "Google Cloud Model Armor API", type: "managed security API", purpose: "Apply the configured template", auth_method: "ADC and Cloud IAM" }
  databases: []

prompt_patterns:
  system_prompts: []
  user_prompt_templates: []
  chains: []
  evaluation_criteria: []

config_schema:
  env_vars:
    - { name: ARMOR_TEST_INPUT, purpose: "Synthetic demonstration prompt", required: true, example_format: "<synthetic-text>" }
    - { name: ARMOR_TEST_OUTPUT, purpose: "Synthetic demonstration response", required: true, example_format: "<synthetic-text>" }
  parameters:
    - { name: model_armor.location, type: str, default: us-central1, description: "Location and endpoint selector" }
    - { name: model_armor.api_timeout_seconds, type: number, default: 30, description: "Positive call deadline" }
    - { name: model_armor.template_name, type: str, default: "projects/mt-office-of-ai-poc/locations/us-central1/templates/mattel-armor-guardrail", description: "Full template resource" }
  warnings: ["Use ADC; do not place credentials in these files", ".env values are redacted test data"]

component_manifest:
  files:
    - path: armor_utility.py
      language: Python
      classes:
        - name: ArmorUtility
          kind: class
          properties: [{ name: template_name, type: str }, { name: timeout_seconds, type: float }, { name: client, type: "ModelArmorClient-compatible object" }]
          methods:
            - { name: __init__, signature: "__init__(self, template_name: str, location: str, timeout_seconds: float = 30.0, client: modelarmor_v1.ModelArmorClient | None = None) -> None" }
            - { name: sanitize_user_prompt, signature: "sanitize_user_prompt(self, text: str) -> modelarmor_v1.SanitizeUserPromptResponse" }
            - { name: sanitize_model_response, signature: "sanitize_model_response(self, text: str) -> modelarmor_v1.SanitizeModelResponseResponse" }
      functions: []
    - path: armor_client.py
      language: Python
      classes: []
      functions:
        - { name: _contains_match, signature: "_contains_match(value: Any) -> bool" }
        - { name: _print_result, signature: "_print_result(boundary: str, response: Any, original: str) -> bool" }
        - { name: main, signature: "main() -> None" }
  config_keys:
    - { name: ARMOR_TEST_INPUT, purpose: "Demo input", source_file: .env }
    - { name: ARMOR_TEST_OUTPUT, purpose: "Demo output", source_file: .env }
    - { name: model_armor.location, purpose: "Endpoint selection", source_file: config.toml }
    - { name: model_armor.api_timeout_seconds, purpose: "Call timeout", source_file: config.toml }
    - { name: model_armor.template_name, purpose: "Template resource", source_file: config.toml }
  config_artifacts:
    - { path: .env, format: dotenv, purpose: "Demo data", keys: [ARMOR_TEST_INPUT, ARMOR_TEST_OUTPUT], structure: { ARMOR_TEST_INPUT: "<redacted-test-data>", ARMOR_TEST_OUTPUT: "<redacted-test-data>" } }
    - path: config.toml
      format: TOML
      purpose: Provider configuration
      keys: [model_armor.location, model_armor.api_timeout_seconds, model_armor.template_name]
      structure: { model_armor: { location: us-central1, api_timeout_seconds: 30, template_name: "projects/mt-office-of-ai-poc/locations/us-central1/templates/mattel-armor-guardrail" } }
    - path: pyproject.toml
      format: TOML
      purpose: Package regeneration
      keys: [project.name, project.version, project.description, project.readme, project.requires-python, project.dependencies, build-system.requires, build-system.build-backend, tool.setuptools.py-modules]
      structure: { project: { name: security-guardrails-armor, version: 0.1.0, description: "Policy-aligned Google Cloud Model Armor adapter", readme: README.md, requires-python: ">=3.12", dependencies: ["google-cloud-modelarmor>=0.3.0"] }, build-system: { requires: ["setuptools>=68"], build-backend: setuptools.build_meta }, tool: { setuptools: { py-modules: [armor_utility] } } }
    - { path: uv.lock, format: "uv lockfile", purpose: "Exact dependencies", keys: [version, revision, requires-python, "package[]"], structure: { version: 1, requires-python: ">=3.12", direct_runtime_dependency: { google-cloud-modelarmor: 0.7.1 }, note: "Retain source lockfile for exact transitive versions and hashes" } }
  payload_schemas:
    - { name: SanitizeUserPromptRequest, fields: [{ name: name, type: str }, { name: user_prompt_data, type: DataItem }, { name: user_prompt_data.text, type: str }], used_by: sanitize_user_prompt }
    - { name: SanitizeModelResponseRequest, fields: [{ name: name, type: str }, { name: model_response_data, type: DataItem }, { name: model_response_data.text, type: str }], used_by: sanitize_model_response }
    - { name: "Consumed response subset", fields: [{ name: sanitization_result.invocation_result, type: InvocationResult }, { name: sanitization_result.filter_match_state, type: FilterMatchState }, { name: sanitization_result.filter_results, type: "map[str, nested detail]" }], used_by: _print_result }
  messaging: []
  deploy_resources:
    - { type: "external Model Armor template", name: "projects/mt-office-of-ai-poc/locations/us-central1/templates/mattel-armor-guardrail", file: config.toml }

behavioral_tests:
  scenarios: []
  edge_cases: []

adr:
  - { id: ADR-001, decision: "Keep the adapter policy-free", context: "Hosts own enforcement", rationale: "Provider success is not business authorization", alternatives_considered: ["Embed allow/block logic"], consequences: "Hosts must interpret responses" }
  - { id: ADR-002, decision: "Use two synchronous typed SDK operations", context: "Input and output are separate trust boundaries", rationale: "Preserve schema fidelity and reuse", alternatives_considered: ["Raw HTTP", "One opaque workflow"], consequences: "SDK dependency and synchronous latency" }

abom:
  frameworks: ["google-cloud-modelarmor 0.7.1", "setuptools >=68"]
  models: []
  tools: [sanitize_user_prompt, sanitize_model_response, uv]
  mcps: []
  platforms: ["Python >=3.12", "Google Cloud Model Armor", ADC, IAM]
  data_classification: Prompt and response text may be sensitive; do not log raw content in production.
  estimated_cost_profile: One Model Armor API call per invoked boundary; no LLM token cost.

# Extraction notes
# overall_confidence: High for runtime code, signatures, configuration, request construction, and branches.
# scope: Tests, test helpers, documentation, operational guidance, and test scenarios are intentionally excluded.
# redactions: .env input/output values are represented as <redacted-test-data>; no credential was copied.