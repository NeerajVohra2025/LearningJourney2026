  data_classification: Structured operational metadata may include business identifiers; prompts, responses, credentials, authorization headers, and full tool results are prohibited. Eligible strings are DLP-protected.
  estimated_cost_profile: No LLM/token cost; DLP, Logging, and Trace API usage may incur platform charges and quotas.

# Extraction notes
# overall_confidence: High for runtime files, models, signatures, configuration, and primary behavior; medium-high for private downstream completion scheduling summarized from implementation.
# scope: Tests, test helpers, documentation, documentation validation, and operational runbooks are intentionally excluded.
# redactions: Synthetic client PII is described by shape only. No secret value or credential was copied.