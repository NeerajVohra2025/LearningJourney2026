adr:
  - { id: ADR-001, decision: "DLP-protect before returning or delivering entries", context: "Logs can contain identifiers/messages", rationale: "Prevent raw fallback", alternatives_considered: ["Log then redact", "Continue on DLP failure"], consequences: "DLP availability is fail-closed" }
  - { id: ADR-002, decision: "Keep framework-neutral immutable contexts", context: "Services use different runtimes", rationale: "Portable propagation and validation", alternatives_considered: ["Depend on one web/agent framework"], consequences: "Hosts adapt transport themselves" }
  - { id: ADR-003, decision: "Separate primary and downstream contract families", context: "Cloud evidence and governed downstream routing have different needs", rationale: "Avoid leaking transport/policy fields into primary API", alternatives_considered: ["One oversized context model"], consequences: "Similarly named models must be imported from the correct module" }

