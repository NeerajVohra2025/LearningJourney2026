meta:
  name: genai-observability
  purpose: Regenerate shared trace propagation, DLP-protected structured logging, Cloud Trace export, and downstream request-context continuation utilities.
  domain: GenAI observability and governed service lineage
  description: Runtime code-generation blueprint only. Tests, test helpers, documentation validators, and operational runbooks are excluded.

replication_profile:
  language: { name: Python, version: ">=3.12" }
  agent_frameworks:
    - { name: pydantic, version: "declared >=2.10.0; locked 2.13.4", role: "Strict immutable runtime contracts" }
    - { name: google-cloud-logging, version: "declared >=3.12.0; locked 3.16.2", role: "Structured log delivery" }
    - { name: google-cloud-trace, version: "declared >=1.16.0; locked 1.20.0", role: "Explicit span export" }
    - { name: google-cloud-dlp, version: "declared >=3.31.0; locked 3.38.0", role: "DLP deidentification" }
  orchestration:
    topology: pipeline
    description: The primary synchronous observability adapter prepares and delivers protected evidence; an optional asynchronous downstream pipeline validates enterprise context, coordinates one workflow decision, and invokes at most one next hop.
  model_provider: none
  models: []
  runtime: { type: "Python package plus local and cloud-smoke clients", description: "Framework-neutral synchronous utility and async downstream pipeline" }
  hosting_platform: { type: "embedded library", description: "No standalone server, container, or IaC" }
  vector_store: none
  secrets_management: Application Default Credentials; authentication headers and credentials are deliberately excluded from propagated/logged data.
  supporting_services:
    - { name: "Google Cloud Sensitive Data Protection", type: "DLP API", purpose: "Deidentify string log values before exposure or delivery" }
    - { name: "Google Cloud Logging", type: "managed logging", purpose: "Store protected structured entries" }
    - { name: "Google Cloud Trace", type: "managed tracing", purpose: "Store explicitly exported spans" }
    - { name: "ADC and Cloud IAM", type: "identity controls", purpose: "Authenticate and authorize cloud calls" }
  presentation_layer: { framework: none, type: console, backend_binding: "demonstration clients call package API", description: "Clients print synthetic validation evidence" }

source_structure:
  tree: |
    genai-observability/
    |-- cloud_smoke_client.py
    |-- observability_client.py
    |-- config.toml
    |-- pyproject.toml
    |-- uv.lock
    `-- src/genai_observability/
        |-- __init__.py
        |-- observability_utility.py
        |-- cloud_runtime.py
        |-- downstream.py
        `-- downstream_runtime/
            |-- __init__.py
            |-- pipeline.py
            |-- logging_runtime.py
            `-- domain/
                |-- __init__.py
                |-- models.py
                |-- log_payloads.py
                |-- log_events.py
                `-- exceptions.py
  entry_points:
    - { path: src/genai_observability/__init__.py, purpose: "Public primary API" }
    - { path: src/genai_observability/downstream.py, purpose: "Public downstream API re-exports" }
    - { path: observability_client.py, purpose: "Local synthetic lineage/logging demonstration" }
    - { path: cloud_smoke_client.py, purpose: "DLP, Cloud Logging, and Cloud Trace smoke execution" }
  modules:
    - { path: src/genai_observability/observability_utility.py, role: "Primary context, payload, DLP/logging/trace utility", key_responsibilities: ["Trace parsing/generation", "Business context", "Header propagation", "DLP protection", "Cloud Logging", "Cloud Trace"] }
    - { path: src/genai_observability/cloud_runtime.py, role: "Lazy cloud composition", key_responsibilities: ["Google DLP adapter", "Environment-driven cloud utility builder"] }
    - { path: src/genai_observability/downstream_runtime/pipeline.py, role: "Async downstream context pipeline", key_responsibilities: ["Validate carrier", "Create local/primary context", "Coordinate", "Propagate", "Invoke once", "Completion evidence"] }
    - { path: src/genai_observability/downstream_runtime/logging_runtime.py, role: "Process logging bootstrap", key_responsibilities: ["Active trace filter", "JSON formatter", "Cloud handler", "One-time configuration"] }
    - { path: src/genai_observability/downstream_runtime/domain/models.py, role: "Immutable downstream contracts", key_responsibilities: ["Context", "routing", "workflow decision", "policy models"] }
    - { path: src/genai_observability/downstream_runtime/domain/log_payloads.py, role: "Downstream log schemas", key_responsibilities: ["Platform/agent/tool payload validation"] }
    - { path: src/genai_observability/downstream_runtime/domain/log_events.py, role: "Operational event catalog", key_responsibilities: ["Stable event strings and dotted names"] }
    - { path: src/genai_observability/downstream_runtime/domain/exceptions.py, role: "Controlled gateway failures", key_responsibilities: ["Transport-safe error metadata"] }
    - { path: observability_client.py, role: "Local demonstration", key_responsibilities: ["Fake DLP/logging", "Build component events", "Validate lineage/templates"] }
    - { path: cloud_smoke_client.py, role: "Cloud smoke client", key_responsibilities: ["Write protected event/span", "Poll Logging", "Reject stored synthetic PII"] }
  config_files:
    - { path: config.toml, purpose: "Primary runtime defaults and cloud-smoke resources" }
    - { path: pyproject.toml, purpose: "Package/build/dependencies" }
    - { path: uv.lock, purpose: "Exact dependency graph" }
  notable_conventions: ["Strict frozen models with extra fields forbidden", "W3C traceparent preferred", "DLP fail-closed", "Technical lineage never deidentified", "Cloud delivery lazily initialized", "ContextVars scope downstream requests"]

architecture:
  pattern: "hybrid pipeline/event-driven"
  components:
    - { name: GenAIObservabilityUtility, role: "primary adapter", description: "Context propagation and protected logging/trace boundary", inputs: [headers, business context, log payload], outputs: [ObservabilityContext, protected entry, cloud writes] }
    - { name: GoogleDlpDeidentifier, role: "DLP adapter", description: "Call template-based deidentify_content lazily", inputs: [text], outputs: [protected text] }
    - { name: DownstreamObservabilityPipeline, role: "async workflow wrapper", description: "Validate, coordinate, propagate, invoke, and record completion", inputs: [DownstreamInboundRequest, Coordinator, Invoker], outputs: [DownstreamPipelineResult] }
    - { name: logging_runtime, role: "process bootstrap", description: "Attach active trace fields and JSON formatting", inputs: [ObservabilityRuntimeConfig, LogRecord], outputs: [configured logging, JSON] }
  data_flows:
    - { from: incoming headers, to: GenAIObservabilityUtility.create_context, data_type: "trace/business lineage", description: "Parse upstream trace or create root, then make local span" }
    - { from: EnterpriseLogPayload, to: build_log_entry, data_type: "validated event", description: "Verify request identity and add trace metadata" }
    - { from: build_log_entry, to: DLP, data_type: "JSON list of protected string values", description: "Deidentify content while preserving technical lineage" }
    - { from: write_log_with_entry, to: Cloud Logging, data_type: "protected structured entry", description: "Deliver exactly once" }
    - { from: write_trace_span, to: Cloud Trace, data_type: Span, description: "Explicitly export completed span" }
    - { from: DownstreamObservabilityPipeline, to: Coordinator, data_type: "RequestContext and payload", description: "Obtain exactly one local response or next-hop request" }
    - { from: DownstreamObservabilityPipeline, to: Invoker, data_type: "GovernedDownstreamRequest and allowlisted carrier", description: "Invoke approved next hop once" }
  state_schema:
    utility: "project/configuration, lazy logging and trace clients, lazy cloud logger, thread-safe failure counter"
    downstream_request_scope: "ContextVar<RequestContext>, ContextVar<primary ObservabilityContext>, ContextVar<pipeline>"
  entry_point: "Package APIs; demonstration clients are optional executables"
  terminal_conditions: ["Local workflow response returned", "One next-hop result returned", "Validation/provider failure raised", "Logging delivery failure returns false/null only in continue mode"]

api_contracts:
  entry_points:
    - { name: GenAIObservabilityUtility.__init__, invocation_style: constructor, signature: "__init__(self, project_id: str, *, accept_cloud_trace_context: bool = True, generate_context_when_missing: bool = True, dlp_utility: DlpUtilityProtocol | None = None, log_name: str = 'genai-application', logging_client: cloud_logging.Client | None = None, trace_client: trace_v2.TraceServiceClient | None = None, logging_failure_mode: LoggingFailureMode = 'continue', dlp_fields: tuple[str, ...] | None = None) -> None", inputs: [configuration], outputs: [utility], description: "Configure primary utility without cloud calls" }
    - { name: create_context, invocation_style: synchronous, signature: "create_context(self, headers: Mapping[str, str], *, service_name: str, business: BusinessContext, operation: str | None = None, agent_name: str | None = None, step: str | None = None) -> ObservabilityContext", inputs: [headers, service/business metadata], outputs: [ObservabilityContext], description: "Create root or child context" }
    - { name: inject_headers, invocation_style: synchronous, signature: "@staticmethod inject_headers(context: ObservabilityContext) -> dict[str, str]", inputs: [context], outputs: [allowlisted headers], description: "Propagate trace and business identity" }
    - { name: build_log_entry, invocation_style: synchronous, signature: "build_log_entry(self, payload: EnterpriseLogPayload, context: ObservabilityContext) -> dict[str, Any]", inputs: [payload, context], outputs: [protected entry], description: "Validate and DLP-protect without delivery" }
    - { name: write_log, invocation_style: synchronous, signature: "write_log(self, payload: EnterpriseLogPayload, context: ObservabilityContext) -> bool", inputs: [payload, context], outputs: [success bool], description: "Protect and deliver" }
    - { name: write_log_with_entry, invocation_style: synchronous, signature: "write_log_with_entry(self, payload: EnterpriseLogPayload, context: ObservabilityContext, *, on_prepared: Callable[[Mapping[str, Any]], None] | None = None) -> dict[str, Any] | None", inputs: [payload, context, callback], outputs: [entry or null], description: "Expose protected entry then deliver once" }
    - { name: write_trace_span, invocation_style: synchronous, signature: "write_trace_span(self, context: ObservabilityContext, *, display_name: str | None = None, end_time: datetime | None = None) -> None", inputs: [context, display/end], outputs: [none], description: "Export one span" }
    - { name: DownstreamObservabilityPipeline.execute, invocation_style: async, signature: "execute(self, *, inbound: DownstreamInboundRequest, coordinate: Coordinator, invoke: Invoker | None = None) -> DownstreamPipelineResult", inputs: [inbound, coordinator, invoker], outputs: [DownstreamPipelineResult], description: "Run the seven-stage downstream flow" }
  internal_interfaces:
    - { name: extract_trace_context, signature: "extract_trace_context(self, headers: Mapping[str, str]) -> TraceContext | None", description: "Parse W3C or optional Google trace header" }
    - { name: build_cloud_logging_metadata, signature: "build_cloud_logging_metadata(self, trace: TraceContext) -> dict[str, object]", description: "Build Google trace correlation fields" }
    - { name: build_enterprise_carrier, signature: "build_enterprise_carrier(context: RequestContext, *, next_service_name: str, header_names: Mapping[str, str] | None = None) -> dict[str, str]", description: "Build downstream allowlisted carrier" }
    - { name: configure_observability_runtime, signature: "configure_observability_runtime(config: ObservabilityRuntimeConfig) -> None", description: "Configure process logging once" }

business_logic:
  intent: Maintain exact technical and business lineage while preventing sensitive content from reaching logs unprotected.
  rules:
    - "All primary/downstream Pydantic records are frozen and reject unknown fields."
    - "Trace IDs are 32 lowercase hex characters; span/parent IDs are 16; flags are 2; all-zero identifiers are invalid."
    - "sampled is bit zero of trace_flags; traceparent always emits W3C version 00."
    - "TraceContext.child preserves trace ID, flags, and tracestate; current span becomes parent; new span is UUID hex first 16."
    - "TraceContext.root creates UUID trace/span and flags 01 when sampled else 00."
    - "Prefer traceparent. Reject malformed headers, version ff, invalid/all-zero IDs without echoing supplied values."
    - "Use X-Cloud-Trace-Context only when traceparent is absent and fallback is enabled; require decimal span in 1..2^64-1 and translate to 16-digit hex."
    - "If no trace exists and generation is disabled, raise InvalidTraceContextError; otherwise create a sampled root."
    - "If an incoming trace exists, create a child and set parent_service from normalized X-Current-Service."
    - "Propagated headers include traceparent and required execution, correlation, request, tenant, process, user, and current-service values; omit absent optional values."
    - "Agent complete token breakdown must satisfy input + output = total; cost_micros and currency_code must appear together."
    - "Payload correlation_id and request_id must exactly match context business IDs."
    - "A log cannot be built without DLP. DLP failures/invalid shape always fail closed."
    - "Protect every string except TECHNICAL_LINEAGE_FIELDS by default; when dlp_fields is configured, protect only named eligible strings."
    - "Send protected values as one compact JSON array; require DLP output to decode to an equal-length all-string list."
    - "Cloud logging metadata is empty without project_id; otherwise include trace URI, spanId, and sampled."
    - "write_log requires project_id unless a logging client is injected; initialize client/logger lazily and reuse them."
    - "Call on_prepared only after DLP and before delivery."
    - "On Google API/auth/retry delivery error increment the locked failure counter; rethrow in raise mode, else return null/false."
    - "write_trace_span requires project_id, lazily creates trace client, and sends one Span with context start, provided/current end, parent or empty, and display name fallback operation then service."
    - "GoogleDlpDeidentifier requires nonblank project/location, derives default template names, lazily creates DlpServiceClient, rejects empty text, and returns response.item.value."
    - "Cloud builder enables DLP only when enabled and project is nonblank; environment variables override DLP location/templates/timeout."
    - "ActiveTraceContextFilter leaves records unchanged without active context; otherwise adds portable fields and Google private handler fields when project exists."
    - "JsonFormatter emits canonical_observability_entry exactly when it is a mapping; otherwise builds timestamp/severity/logger/message, nonreserved extras, and formatted exception."
    - "Runtime logging configuration is idempotent via root._enterprise_observability_configured."
    - "Downstream request must contain all ten governed headers; payload tenant/capability/operation/workflow may not conflict with headers."
    - "Local downstream context uses trusted service identity plus governed header identity and only selected optional payload fields."
    - "GovernedDownstreamRequest.path must equal target.path when a target exists."
    - "Coordinator may be sync/async but must return WorkflowDecision selecting exactly one of response or downstream_request."
    - "When response is selected, return locally without invoker; when downstream is selected, require a request target or fixed next service and require invoker."
    - "Build only allowlisted enterprise carrier headers; supplement primary trace/business headers without overwriting existing names."
    - "Set request, primary context, and pipeline ContextVars during coordination/invocation and always reset them in finally."
    - "Record primary completion success/failure without changing business outcome; skip when primary context/utility/DLP is absent."
    - "Completion incident enrichment recursively examines model dumps/mappings for incident_number or number and accepts only nonblank strings beginning INC."
    - "A next hop is invoked exactly once; await sync-compatible awaitables as needed."
    - "Cloud smoke polling checks every 2 seconds for at most 30 seconds; reject stored raw synthetic email or timeout."
  constraints: ["Never log prompts, responses, credentials, authorization headers, or complete tool results", "No model-cost calculation", "No retry orchestration", "Spans export only on explicit call", "DLP protection precedes caller callback and delivery"]
  assumptions: ["Headers originate from authenticated/trusted boundaries", "DLP templates return JSON-preserving replacement text", "Hosts choose meaningful safe events and enforce business policy"]
  domain_terms: { technical_lineage: "Trace/span/service fields preserved exactly", business_lineage: "Execution/correlation/request/tenant/process identifiers", primary_context: "TraceContext plus primary BusinessContext", downstream_context: "Governed service/policy derivative used by async pipeline" }

tool_inventory:
  tools:
    - { name: DlpServiceClient.deidentify_content, type: "Google DLP operation", description: "Protect serialized string values", inputs: [parent, inspect_template_name, deidentify_template_name, item.value], outputs: [item.value] }
    - { name: Logger.log_struct, type: "Cloud Logging operation", description: "Write protected structured entry", inputs: [entry, severity, trace metadata], outputs: [none] }
    - { name: TraceServiceClient.create_span, type: "Cloud Trace operation", description: "Write completed span", inputs: [Span], outputs: [none] }
    - { name: logging, type: "Python standard library", description: "JSON console/cloud logging pipeline", inputs: [LogRecord], outputs: [JSON] }
  mcps: []
  external_services:
    - { name: "Google Sensitive Data Protection", type: API, purpose: "Deidentify log content", auth_method: ADC/IAM }
    - { name: "Google Cloud Logging", type: API, purpose: "Store structured logs", auth_method: ADC/IAM }
    - { name: "Google Cloud Trace", type: API, purpose: "Store spans", auth_method: ADC/IAM }
  databases: []

prompt_patterns: { system_prompts: [], user_prompt_templates: [], chains: [], evaluation_criteria: [] }

config_schema:
  env_vars:
    - { name: GENAI_OBSERVABILITY_DLP_LOCATION, purpose: "Cloud builder DLP region", required: false, example_format: us-central1 }
    - { name: GENAI_OBSERVABILITY_DLP_INSPECT_TEMPLATE, purpose: "Full inspect-template resource", required: false, example_format: "projects/{{project}}/locations/{{location}}/inspectTemplates/{{name}}" }
    - { name: GENAI_OBSERVABILITY_DLP_DEIDENTIFY_TEMPLATE, purpose: "Full deidentify-template resource", required: false, example_format: "projects/{{project}}/locations/{{location}}/deidentifyTemplates/{{name}}" }
    - { name: GENAI_OBSERVABILITY_DLP_TIMEOUT_SECONDS, purpose: "DLP timeout", required: false, example_format: "30" }
  parameters:
    - { name: genai_observability.project_id, type: str, default: "", description: "Empty permits local/cloud-neutral entry formatting" }
    - { name: genai_observability.service_name, type: str, default: business-orchestrator, description: "Local service" }
    - { name: genai_observability.log_level, type: str, default: INFO, description: "Process log level" }
    - { name: genai_observability.log_name, type: str, default: genai-application, description: "Cloud log name" }
    - { name: genai_observability.logging_failure_mode, type: str, default: continue, description: "continue|raise" }
    - { name: genai_observability.accept_cloud_trace_context, type: bool, default: true, description: "Enable legacy Google header fallback" }
    - { name: genai_observability.generate_context_when_missing, type: bool, default: true, description: "Permit sampled root creation" }
    - { name: cloud_smoke.project_id, type: str, default: mt-office-of-ai-poc, description: "Smoke project" }
    - { name: cloud_smoke.location, type: str, default: us-central1, description: "DLP location" }
    - { name: cloud_smoke.inspect_template, type: str, default: "projects/mt-office-of-ai-poc/locations/us-central1/inspectTemplates/mattel-inspect-template", description: "Inspect resource" }
    - { name: cloud_smoke.deidentify_template, type: str, default: "projects/mt-office-of-ai-poc/locations/us-central1/deidentifyTemplates/mattel-de-identity-template", description: "Deidentify resource" }
    - { name: cloud_smoke.log_name, type: str, default: genai-observability-smoke, description: "Smoke log" }
  warnings: ["Resource names are nonsecret; credentials must come from ADC", "Raw sensitive content must never be used as fallback when DLP fails"]

component_manifest:
  files:
    - path: src/genai_observability/observability_utility.py
      language: Python
      classes:
        - { name: DlpUtilityProtocol, kind: Protocol, properties: [], methods: [{ name: deidentify_content, signature: "deidentify_content(self, text: str) -> str" }] }
        - { name: InvalidTraceContextError, kind: exception, properties: [], methods: [] }
        - { name: FrozenModel, kind: BaseModel, properties: [{ name: model_config, type: "ConfigDict(frozen=True, extra='forbid')" }], methods: [] }
        - { name: TraceContext, kind: model, properties: [{ name: trace_id, type: "str[32 lowercase hex]" }, { name: span_id, type: "str[16 lowercase hex]" }, { name: parent_span_id, type: "str|null" }, { name: trace_flags, type: "str='00'" }, { name: tracestate, type: "str|null, max 512" }, { name: sampled, type: "computed bool" }, { name: traceparent, type: "computed str" }], methods: [{ name: reject_reserved_zero_identifiers, signature: "reject_reserved_zero_identifiers(self) -> TraceContext" }, { name: child, signature: "child(self) -> TraceContext" }, { name: root, signature: "@classmethod root(cls, *, sampled: bool = False) -> TraceContext" }] }
        - { name: BusinessContext, kind: model, properties: [{ name: execution_id, type: "str default UUID, 1..128" }, { name: correlation_id, type: "str default UUID, 1..128" }, { name: request_id, type: "str default UUID, 1..128" }, { name: tenant_id, type: "str 1..128" }, { name: business_process, type: "str 1..128" }, { name: user_id, type: "str 1..128" }, { name: conversation_id, type: "str|null" }, { name: incident_number, type: "str|null" }], methods: [] }
        - { name: ObservabilityContext, kind: model, properties: [{ name: trace, type: TraceContext }, { name: business, type: BusinessContext }, { name: parent_service, type: "str|null" }, { name: current_service, type: str }, { name: current_operation, type: "str|null" }, { name: current_agent, type: "str|null" }, { name: current_step, type: "str|null" }, { name: started_at, type: "datetime UTC now" }], methods: [] }
        - { name: EnterpriseLogPayload, kind: model, properties: [{ name: timestamp, type: datetime }, { name: severity, type: Severity }, { name: event_name, type: str }, { name: message, type: str }, { name: logger, type: str }, { name: execution_id, type: str }, { name: correlation_id, type: str }, { name: request_id, type: str }, { name: tenant_id, type: str }, { name: business_process, type: str }, { name: parent_service, type: "str|null" }, { name: current_service, type: str }, { name: conversation_id, type: "str|null" }, { name: incident_number, type: "str|null" }], methods: [{ name: common_fields, signature: "@classmethod common_fields(cls, context, *, severity, event_name, message, logger_name) -> dict[str, object]" }] }
        - { name: PlatformServiceLogPayload, kind: model, properties: [{ name: operation, type: str }, { name: outcome, type: Outcome }, { name: downstream_service, type: "str|null" }, { name: http_method, type: "str|null" }, { name: http_path, type: "str|null" }, { name: http_status, type: "int|null 100..599" }, { name: duration_ms, type: "float|null >=0" }], methods: [] }
        - { name: AgentLogPayload, kind: model, properties: [{ name: agent_name, type: str }, { name: agent_framework, type: str }, { name: operation, type: str }, { name: outcome, type: Outcome }, { name: downstream_service, type: "str|null" }, { name: tool_name, type: "str|null" }, { name: model_provider, type: "str|null" }, { name: model_name, type: "str|null" }, { name: input_tokens, type: "int|null >=0" }, { name: output_tokens, type: "int|null >=0" }, { name: total_tokens, type: "int|null >=0" }, { name: cost, type: "float|null >=0" }, { name: cost_micros, type: "int|null >=0" }, { name: currency_code, type: "str|null, 3 uppercase" }, { name: duration_ms, type: "float|null >=0" }], methods: [{ name: validate_token_total, signature: "validate_token_total(self) -> AgentLogPayload" }] }
        - { name: ToolLogPayload, kind: model, properties: [{ name: tool_name, type: str }, { name: operation, type: str }, { name: target_system, type: str }, { name: outcome, type: Outcome }, { name: duration_ms, type: "float|null" }, { name: attempt_number, type: "int=1" }, { name: error_code, type: "str|null" }], methods: [] }
        - { name: GenAIObservabilityUtility, kind: class, properties: [{ name: project_id, type: str }, { name: accept_cloud_trace_context, type: bool }, { name: generate_context_when_missing, type: bool }, { name: dlp_utility, type: "DlpUtilityProtocol|null" }, { name: log_name, type: str }, { name: logging_client, type: "Client|null" }, { name: trace_client, type: "TraceServiceClient|null" }, { name: logging_failure_mode, type: "continue|raise" }, { name: dlp_fields, type: "tuple[str,...]|null" }, { name: logging_failure_count, type: int }], methods: [{ name: extract_trace_context, signature: "extract_trace_context(self, headers) -> TraceContext | None" }, { name: create_context, signature: "create_context(self, headers, *, service_name, business, operation=None, agent_name=None, step=None) -> ObservabilityContext" }, { name: inject_headers, signature: "@staticmethod inject_headers(context) -> dict[str,str]" }, { name: build_cloud_logging_metadata, signature: "build_cloud_logging_metadata(self, trace) -> dict[str,object]" }, { name: build_log_entry, signature: "build_log_entry(self, payload, context) -> dict[str,Any]" }, { name: write_log, signature: "write_log(self, payload, context) -> bool" }, { name: write_log_with_entry, signature: "write_log_with_entry(self, payload, context, *, on_prepared=None) -> dict[str,Any] | None" }, { name: write_trace_span, signature: "write_trace_span(self, context, *, display_name=None, end_time=None) -> None" }] }
      functions: []
    - { path: src/genai_observability/cloud_runtime.py, language: Python, classes: [{ name: GoogleDlpDeidentifier, kind: class, properties: [{ name: _project_id, type: str }, { name: _location, type: str }, { name: _parent, type: str }, { name: _inspect_template, type: str }, { name: _deidentify_template, type: str }, { name: _timeout_seconds, type: float }, { name: _client, type: "Any|null" }], methods: [{ name: __init__, signature: "__init__(self, project_id: str, *, location: str='us-central1', inspect_template: str|None=None, deidentify_template: str|None=None, timeout_seconds: float=30.0, client: Any|None=None) -> None" }, { name: deidentify_content, signature: "deidentify_content(self, text: str) -> str" }] }], functions: [{ name: build_cloud_observability_utility, signature: "build_cloud_observability_utility(project_id: str, *, enabled: bool, generate_context_when_missing: bool=True) -> GenAIObservabilityUtility" }] }
    - path: src/genai_observability/downstream_runtime/domain/models.py
      language: Python
