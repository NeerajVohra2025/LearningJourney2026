adr:
  - {id: ADR-001, decision: "Separate deterministic action authorization from LLM reasoning", context: "Remediation has side effects", rationale: "Model output cannot grant authority", alternatives_considered: ["LLM tool selection", "prompt-only guardrails"], consequences: "Explicit structured payload required; safer and reproducible"}
  - {id: ADR-002, decision: "Hexagonal ports and replaceable adapters", context: "Package and service modes plus testability", rationale: "Core remains framework-neutral", alternatives_considered: ["FastAPI-coupled business logic"], consequences: "More interfaces/composition code; easy fakes and alternate transports"}
  - {id: ADR-003, decision: "Mutations are submitted, never synchronously claimed complete", context: "Kafka connector state transitions are asynchronous", rationale: "Avoid false remediation claims", alternatives_considered: ["poll until terminal", "trust accepted HTTP status"], consequences: "Caller must poll status"}
  - {id: ADR-004, decision: "No mutation retries", context: "Duplicate side effects are unsafe", rationale: "At-most-one attempt with correlation/idempotency keys", alternatives_considered: ["automatic exponential retries"], consequences: "Transient failures surface to orchestrator"}
  - {id: ADR-005, decision: "In-memory isolated ADK session per query", context: "No durable conversational memory requirement", rationale: "Prevent cross-request leakage", alternatives_considered: ["persistent session/database"], consequences: "Stateless horizontal scaling; no conversational continuity"}
