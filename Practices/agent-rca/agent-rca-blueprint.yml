behavioral_tests:
  scenarios: []
  edge_cases: []

adr:
  - {id: ADR-001, decision: "Schema-constrained JSON generation at temperature zero", context: "RCA must be machine-consumable and repeatable", rationale: "Reject prose and minimize nondeterminism", alternatives_considered: ["free-form Markdown", "nonzero sampling"], consequences: "Model output failing schema becomes a service error"}
  - {id: ADR-002, decision: "Generate before historical lookup", context: "Vector service is optional and fallible", rationale: "Base RCA remains available without external history", alternatives_considered: ["RAG before generation"], consequences: "History changes remediations only, not analysis reasoning"}
  - {id: ADR-003, decision: "Historical descriptions replace generated remediations", context: "Resolved incidents provide operationally grounded actions", rationale: "Prefer known resolutions", alternatives_considered: ["append", "model synthesis over results"], consequences: "Generated recommendations are discarded whenever valid records exist"}
  - {id: ADR-004, decision: "Best-effort historical tool", context: "RCA availability is more important than enrichment", rationale: "Tool errors do not fail successful generation", alternatives_considered: ["fail whole request"], consequences: "Clients may receive unenriched RCA without explicit response flag"}
  - {id: ADR-005, decision: "Unique in-memory ADK session per request", context: "RCA requests are independent", rationale: "Prevent cross-incident state leakage", alternatives_considered: ["persistent conversational memory"], consequences: "Stateless scaling and no history between calls"}
  - {id: ADR-006, decision: "Production requires authenticated resolution search and safety/project credentials", context: "Incident content is sensitive", rationale: "Fail closed in hosted deployments", alternatives_considered: ["anonymous vector calls"], consequences: "More deployment configuration"}

abom:
  frameworks: ["Google ADK via platform-sdk", "FastAPI >=0.115", "Pydantic >=2.8", "LiteLLM >=1.75,<1.92", "httpx >=0.27", "Uvicorn >=0.30", "platform-sdk workspace", "shared workspace"]
  models: ["OpenAI gpt-4.1-mini default", "Gemini gemini-1.5-pro-001 supported baseline"]
  tools: [vector_search_tool]
  mcps: []
  platforms: ["Python 3.12", "OCI/Podman", "Google Cloud Run", "OpenAI", "Gemini", "resolution-store-service", "Google Cloud Model Armor/DLP/Logging/Trace", "optional Sumo Logic"]
  data_classification: "Sensitive operational data: incident numbers/descriptions, timestamped logs, errors, dependency evidence, RCA conclusions, and historical resolution text. Secrets: provider keys, resolution-store bearer tokens, collector endpoints, and cloud credentials."
  estimated_cost_profile: "Moderate and usage-based: one model generation per RCA, up to configured generation retries; optional vector HTTP search up to configured retries; safety inspection, Cloud Logging/Trace, and Sumo delivery may add charges. No local database cost."

# Extraction notes
# overall_confidence: high for service behavior, prompts, configuration, and shared RCA schemas; medium for platform-sdk runtime internals and external vector-store implementation.
# inferred_sections: provider mechanics, standard health routes, Cloud Run deployment, safety APIs, and resolution-store engine are outside this service. The requested services/rca/_service path was interpreted as the existing services/rca_service directory.
# excluded_from_generation: all tests/fixtures, docs/runbook, README, pyproject_use.toml, optional dev dependencies, caches, and generated/local environment files.
# redactions: LLM API key, OpenAI-compatible URL when secret-bearing, resolution-store token, Sumo endpoint, and cloud credentials; no values copied.