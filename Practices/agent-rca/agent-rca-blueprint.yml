meta:
  name: rca-service
  purpose: "Regenerate the minimum production service that creates deterministic, structured root-cause analyses from incident and log evidence."
  domain: "Incident root-cause analysis and historical-resolution enrichment"
  description: "Production-code SSOT. Tests, fixtures, runbooks, generated files, alternate packaging drafts, and unused references are excluded."

replication_profile:
  language: {name: Python, version: ">=3.11,<3.14; container uses 3.12"}
  agent_frameworks:
    - {name: Google ADK, version: "provided transitively by platform-sdk", role: "Agent runtime, runner, in-memory sessions, final events, function tools"}
    - {name: platform-sdk, version: "workspace dependency; unspecified", role: "LLM generation, safety, token usage, request context, observability, and FastAPI foundation"}
    - {name: FastAPI, version: ">=0.115.0", role: "HTTP ingress"}
    - {name: Pydantic, version: ">=2.8.0", role: "Configuration, request, response, tool, and event validation"}
    - {name: LiteLLM, version: ">=1.75,<1.92", role: "Provider-neutral model access through platform-sdk/ADK"}
  orchestration:
    topology: pipeline
    description: "Validate request -> governed context -> ADK session -> deterministic LLM JSON generation -> optional mandatory vector-search tool attempt -> replace remediation recommendations with valid historical resolutions -> return RCAReport."
  model_provider: "OPENAI or GEMINI through platform-sdk Google ADK generation runtime"
  models:
    - {role: "Structured RCA JSON generation", provider: OpenAI, model_id: "gpt-4.1-mini (checked-in default; normalized to openai/gpt-4.1-mini for ADK)", context_window: "not specified"}
    - {role: "Supported alternative", provider: Gemini, model_id: "gemini-1.5-pro-001 (model default/commented baseline)", context_window: "not specified"}
  runtime: {type: "Async FastAPI service with custom Google ADK BaseAgent", description: "One isolated in-memory session per /rca request; tool and generation adapters are composed once"}
  hosting_platform: {type: "Google Cloud Run compatible OCI container", description: "Fedora Python 3.12, UID 1001, port 8082, Uvicorn"}
  vector_store: "External resolution-store-service accessed through POST /resolutions/search; storage engine is not visible here"
  secrets_management: "YAML plus environment/dotenv overrides loaded by platform-sdk; model keys, bearer tokens, collector endpoints, and Google credentials are secrets."
  supporting_services:
    - {name: resolution-store-service, type: "HTTP vector-search service", purpose: "Find similar historical incident resolutions"}
    - {name: Google Cloud DLP/Model Armor, type: safety, purpose: "Filter model input/output"}
    - {name: Google Cloud Logging/Trace, type: observability, purpose: "DLP-protected correlated telemetry"}
    - {name: Sumo Logic, type: observability, purpose: "Optional protected log export"}
  presentation_layer: {framework: none, type: none, backend_binding: none, description: "No UI; POST /rca only"}

source_structure:
  tree: |
    services/rca_service/
    |-- .env.example
    |-- Containerfile
    |-- pyproject.toml
    |-- uv.lock
    `-- src/rca_service/
        |-- __init__.py
        |-- main.py
        |-- application/
        |   |-- __init__.py
        |   |-- mappers/{__init__.py,rca_mapper.py}
        |   |-- ports/
        |   |   |-- __init__.py
        |   |   |-- inbound/{__init__.py,rca_use_case.py}
        |   |   `-- outbound/{__init__.py,rca_generation_port.py,resolution_store_port.py}
        |   `-- services/{__init__.py,rca_service.py}
        |-- domain/
        |   |-- __init__.py
        |   |-- exceptions/__init__.py
        |   `-- agent/{__init__.py,agent.py,config.py,constants.py,observability.py,prompts.py,tools.py}
        `-- platform/
            |-- __init__.py
            |-- config/{__init__.py,config.yaml,di_container.py,settings.py}
            `-- adapters/
                |-- __init__.py
                |-- inbound/{__init__.py,routes.py}
                `-- outbound/
                    |-- __init__.py
                    |-- rca_generation/{__init__.py,client.py}
                    `-- resolution_store/{__init__.py,auth.py,client.py}
  entry_points:
    - {path: src/rca_service/main.py, purpose: "Loads .env and exports app=create_app() for Uvicorn"}
    - {path: src/rca_service/platform/adapters/inbound/routes.py, purpose: "FastAPI app and POST /rca composition"}
    - {path: src/rca_service/platform/config/di_container.py, purpose: "Agent, adapters, tools, safety, observability, sessions, runner, and service composition"}
    - {path: src/rca_service/domain/agent/agent.py, purpose: "Core RCA orchestration"}
  modules:
    - {path: application/mappers/rca_mapper.py, role: response mapper, key_responsibilities: ["RCAReport to alias-preserving JSON"]}
    - {path: application/ports/inbound/rca_use_case.py, role: inbound port, key_responsibilities: ["analyze_rca contract"]}
    - {path: application/ports/outbound/rca_generation_port.py, role: generation port, key_responsibilities: ["prompt to JSON text"]}
    - {path: application/ports/outbound/resolution_store_port.py, role: vector port/models, key_responsibilities: ["search contract", "resolution schemas"]}
    - {path: application/services/rca_service.py, role: use-case facade, key_responsibilities: ["delegate to analysis runner"]}
    - {path: domain/agent/agent.py, role: orchestrator, key_responsibilities: ["validate", "generate", "search", "enrich", "events"]}
    - {path: domain/agent/prompts.py, role: prompt builder, key_responsibilities: ["embed output schema", "evidence/determinism rules", "prompt-type routing"]}
    - {path: domain/agent/tools.py, role: tool registry, key_responsibilities: ["vector_search_tool", "input/output validation"]}
    - {path: domain/agent/observability.py, role: safe telemetry, key_responsibilities: ["agent/tool event normalization"]}
    - {path: platform/adapters/outbound/rca_generation/client.py, role: model adapter, key_responsibilities: ["timeout", "retry", "generation runtime"]}
    - {path: platform/adapters/outbound/resolution_store/client.py, role: vector adapter, key_responsibilities: ["auth/context propagation", "retry", "response parsing"]}
    - {path: platform/adapters/inbound/routes.py, role: HTTP adapter, key_responsibilities: ["context", "safety/error responses", "lifecycle"]}
    - {path: platform/config/settings.py, role: validated configuration, key_responsibilities: ["normalization", "production hardening"]}
  config_files:
    - {path: src/rca_service/platform/config/config.yaml, purpose: "Runtime model, tool, retry, observability, and safety defaults"}
    - {path: .env.example, purpose: "Non-secret environment shape"}
    - {path: pyproject.toml, purpose: "Minimum build/runtime dependencies"}
    - {path: Containerfile, purpose: "Non-root OCI deployment"}
  notable_conventions: ["Hexagonal ports/adapters", "temperature fixed at zero", "structured schema-constrained JSON", "one session per request", "optional best-effort historical enrichment", "bounded retries", "no durable local state"]

architecture:
  pattern: hybrid
  components:
    - {name: RCA HTTP adapter, role: inbound, description: "Validates RcaRequest and establishes enterprise context", inputs: [RcaRequest, headers], outputs: [RCAReport or error JSON]}
    - {name: RCAAgent, role: orchestrator, description: "Runs generation then optional historical search", inputs: [structured request, trace_id], outputs: [RCAReport]}
    - {name: RCAGenerationAdapter, role: model gateway, description: "Calls safety-enabled deterministic generation runtime with retry", inputs: [prompt, TokenUsageContext], outputs: [JSON text]}
    - {name: vector_search_tool, role: tool, description: "Searches similar historical resolutions", inputs: [description, error, top_k], outputs: [VectorSearchResult mapping]}
    - {name: ResolutionStoreHttpAdapter, role: external tool adapter, description: "POST search with auth, lineage, and retry", inputs: [search payload], outputs: [ResolutionRecord list]}
    - {name: ADK runner/session service, role: runtime, description: "Unique in-memory session and state keys per invocation", inputs: [request state], outputs: [final typed report event]}
  data_flows:
    - {from: caller, to: POST /rca, data_type: RcaRequest, description: "Incident details and analyzed logs"}
    - {from: RCAAgent, to: LLM runtime, data_type: "schema-bearing prompt", description: "Generate complete RCA JSON"}
    - {from: RCAAgent, to: resolution-store-service, data_type: "description/error/top_k", description: "Optional similarity search"}
    - {from: resolution records, to: RCAReport, data_type: "list[ResolutionRecord]", description: "Replace generated remediation recommendations with historical descriptions"}
  state_schema:
    session: {service: InMemorySessionService, id: "random UUID per request", keys: {rca_input: RcaRequest, trace_id: str, rca_report: RCAReport}, persistence: none}
    request_context: {request_id: str, trace_id: str, incident_number: "str|null"}
  entry_point: "uvicorn rca_service.main:app --host 0.0.0.0 --port ${PORT:-8082}"
  terminal_conditions: ["valid enriched or generated RCAReport", "input validation error", "safety rejection/failure", "LLM gateway/parse failure", "unexpected internal failure"]

api_contracts:
  entry_points:
    - {name: "POST /rca", invocation_style: HTTP JSON, signature: "run_rca(payload: RcaRequest, request: Request) -> JSONResponse", inputs: [RcaRequest, enterprise/request headers], outputs: [RCAReport], description: "Only service business route; framework foundation may also supply standard health/docs routes"}
    - {name: RCAUseCase.analyze_rca, invocation_style: Python port, signature: "async (input_data: dict[str,Any], trace_id: str) -> RCAReport", inputs: [dict, trace_id], outputs: [RCAReport], description: application contract}
    - {name: RCAAgent.process, invocation_style: Python, signature: "async (input_data: Mapping[str,Any], trace_id: str='') -> RCAReport", inputs: [mapping, trace_id], outputs: [RCAReport], description: core orchestration}
  internal_interfaces:
    - {name: RCAAnalysisRunnerPort, signature: "run_analysis(input_data,trace_id)->RCAReport", description: ADK runtime boundary}
    - {name: RCAGenerationPort, signature: "generate_rca(*,prompt,usage_context)->str", description: model boundary}
    - {name: ResolutionStorePort, signature: "search_resolutions(*,description,error,top_k)->VectorSearchResult", description: vector boundary}
    - {name: ToolInvoker, signature: "invoke_tool(tool_name,arguments)->Mapping", description: named tool boundary}

business_logic:
  intent: "Create evidence-grounded deterministic RCA reports, optionally replacing speculative remediations with descriptions of similar resolved incidents."
  rules:
    - "Validate incoming mapping as RcaRequest; translate Pydantic validation failure to ValidationException (HTTP 400, VALIDATION_ERROR)."
    - "Require RFC3339 timestamps with a time component and Z or numeric timezone; parse them as ISO-8601."
    - "Resolve request ID from middleware context or a new UUID."
    - "Build model prompt from the full request except prompt_type, with JSON keys sorted and indented."
    - "Only the default blank prompt_type is supported because the specialized builder map is empty; any nonblank prompt_type is rejected."
    - "Prompt embeds the complete RCAReport JSON Schema and demands JSON only, no Markdown/comments/explanations."
    - "Model conclusions must use provided incident details/logs/stats; it has no historical incidents in the prompt."
    - "Use Unclassified when evidence cannot support a category; never invent IDs, timestamps, or unsupported facts."
    - "Do not emit null optional text/arrays according to prompt; use evidence-limited statements and empty arrays only when justified."
    - "Include at least one Timeline item when timestamped logs exist; FiveWhy and Dependencies must remain evidence-limited."
    - "Temperature must equal exactly 0.0; any other configured value fails validation."
    - "Normalize llm_provider uppercase and environment/runtime/auth mode lowercase; blank optional credential/URL/project fields become null."
    - "For OpenAI, prefix model with openai/ for ADK unless already prefixed; Gemini model is unchanged."
    - "Apply model credential to OPENAI_API_KEY and optional OPENAI_BASE_URL, or GOOGLE_API_KEY, during container composition."
    - "Call LLM within llm_timeout_seconds; empty text is LLM_GATEWAY_FAILURE."
    - "Retry model failures up to outbound_retry_max_attempts except SafetyError and exceptions exposing HTTP 4xx status."
    - "Model retry delay is capped exponential base*2^(attempt-1) plus uniform random jitter from 0 through base delay."
    - "Parse returned text directly as RCAReport JSON; empty output is RCAParseError, schema/JSON failure is LLM_OUTPUT_PARSE_FAILURE."
    - "Historical search occurs after successful generation and only when historical_resolution_search_enabled=true."
    - "Build search description as short_description newline description."
    - "Build search error by flattening every log entry as timestamp | source_system | source | severity | message and optional payload.error."
    - "vector_search_tool requires at least one nonblank description or error; top_k must be 1..20."
    - "The enabled historical search tool is required to be invoked exactly once by deterministic orchestration, not selected by the LLM."
    - "Historical tool failure is logged and swallowed; return the model-generated RCA unchanged."
    - "Validate each returned resolution record independently; skip malformed records with warning rather than failing the RCA."
    - "If at least one valid record exists, replace (not append to) remediation_recommendations with nonblank record descriptions in response order."
    - "If valid records exist but every description is blank, replacement becomes an empty recommendation list."
    - "Resolution search payload contains top_k plus only nonblank description/error and fails if both absent."
    - "Resolution store retries network errors and HTTP 429/500/502/503/504 up to configured attempts; returns all other responses immediately."
    - "Honor numeric or HTTP-date Retry-After exactly; otherwise use capped exponential delay plus configured jitter."
    - "After retries, raise the final request error or return final response and raise_for_status."
    - "Resolution response expects resolution_records; each record requires id, incident_id, similarity_score and accepts description falling back to resolution_text then empty."
    - "ResolutionRecord similarity_score must be 0..1."
    - "Resolution store auth modes are none, static_bearer, or google_id_token; required token/audience must exist."
    - "Propagate enterprise carrier headers when governed context exists; otherwise propagate traceparent, X-Cloud-Trace-Context, X-Correlation-Id, and X-Request-Id from context variables. Auth headers win via setdefault semantics."
    - "Production requires llm_api_key and gcp_project_id."
    - "Production with historical search forbids resolution-store auth none; Google ID mode requires audience; static bearer requires token."
    - "If enterprise header is absent and context generation is disabled, execute directly without downstream context pipeline."
    - "If generation is enabled and header absent, synthesize enterprise headers using correlation/request/tenant/incident data and fixed policy/version/parent/current-service values."
    - "Invalid enterprise context maps to HTTP 400 code RCA_SERVICE_INVALID_ENTERPRISE_CONTEXT."
    - "SafetyError returns platform safety business response and outcome rejected for SAFETY_INPUT_BLOCKED/SAFETY_OUTPUT_BLOCKED, otherwise failure."
    - "AgentException returns its HTTP status/error code/detail and optional tool_name; unknown exception returns HTTP 500 INTERNAL_ERROR."
    - "SafetyError is never wrapped as LLMGatewayError and is never retried."
    - "The ADK final event stores alias-form RCAReport JSON in state delta under rca_report."
    - "Shutdown drains downstream observability; adapters use request-scoped HTTP clients and in-memory session state only."
  constraints: ["One /rca operation", "No free-form output", "No nonzero temperature", "No durable memory", "top_k 1..20", "historical search cannot block successful generation", "production safety/auth configuration fails closed"]
  assumptions: ["shared package contracts are copied into standalone regeneration", "platform-sdk provides Google ADK, safety, token usage, observability, and standard FastAPI behavior", "resolution-store storage engine and embedding model are external/unknown"]
  domain_terms: {RCA: "Root Cause Analysis", historical_resolution: "Similar resolved incident returned by vector service", deterministic: "temperature zero plus schema-only JSON and stable input serialization", evidence: "incident details, analyzed logs, and optional historical statistics present in input"}

tool_inventory:
  tools:
    - {name: vector_search_tool, type: deterministic function tool, description: "Search historical resolutions after model generation", inputs: ["description:str|null", "error:str|null", "top_k:int=5"], outputs: [VectorSearchResult]}
  mcps: []
  external_services:
    - {name: OpenAI API, type: model API, purpose: RCA JSON generation, auth_method: "OPENAI_API_KEY bearer through LiteLLM"}
    - {name: Gemini API, type: model API, purpose: supported alternative generation, auth_method: GOOGLE_API_KEY}
    - {name: resolution-store-service, type: vector search REST, purpose: historical remediation lookup, auth_method: "none, static Bearer, or Google ID token"}
    - {name: Google Cloud DLP/Model Armor, type: safety API, purpose: model I/O filtering, auth_method: ADC/runtime identity}
    - {name: Google Cloud Logging/Trace, type: observability, purpose: correlated protected telemetry, auth_method: ADC/runtime identity}
    - {name: Sumo Logic, type: observability, purpose: optional protected collector, auth_method: secret endpoint}
  databases: [{name: resolution-store backing store, engine: "unknown/external", purpose: "vector similarity search over resolved incidents"}]

prompt_patterns:
  system_prompts:
    - name: RCA_SYSTEM_PROMPT
      purpose: "Constrain structured evidence-grounded RCA generation"
      template: |
        You are a deterministic root cause analysis agent.
        Using the provided logs, and recent change records, generate a structured Root Cause Analysis (RCA) report.
        You do not have access to historical incidents; rely solely on the provided logs.
        Return only valid JSON that conforms exactly to this RCAReport JSON Schema:
        {{rca_report_json_schema}}
        Rules:
        - Return JSON only; no Markdown, comments, code fences, or external explanation.
        - Base conclusions only on {{incident_details}}, {{log_analysis_results}}, and available historical statistics.
        - Use Unclassified when evidence is insufficient.
        - Populate every field; use concise evidence-unavailable text instead of null text.
        - Use an empty array only when no evidence-backed array items exist.
        - Include a Timeline item when timestamped logs exist.
        - Keep FiveWhy and Dependencies evidence-limited and remediations actionable.
        - Never invent identifiers, timestamps, or facts.
      variables: [rca_report_json_schema, incident_details, log_analysis_results]
  user_prompt_templates:
    - name: default_rca_request
      template: |
        {{RCA_SYSTEM_PROMPT}}

        Perform root cause analysis for this incident payload. Use the logs and historical statistics, when present, as evidence.

        {{sorted_indented_request_json_without_prompt_type}}
      variables: [RCA_SYSTEM_PROMPT, sorted_indented_request_json_without_prompt_type]
    - {name: ADK_session_message, template: "Generate the RCA report for the structured incident input in session state.", variables: []}
    - {name: generation_runtime_instruction, template: "Return only the RCA JSON requested by the user prompt.", variables: []}
  chains:
    - {name: rca_analysis, steps: ["validate RcaRequest", "build schema prompt", "safe deterministic model generation with retry", "parse RCAReport", "optional required vector tool call", "skip invalid records", "replace remediations when records exist", "emit completion", "return alias JSON"]}
  evaluation_criteria: ["Valid RCAReport schema", "JSON only", "temperature 0", "evidence-grounded", "no invented IDs/timestamps", "Unclassified when uncertain", "historical lookup cannot fail the base RCA"]

config_schema:
  env_vars:
    - {name: ENVIRONMENT, purpose: deployment posture, required: false, example_format: "local|test|production"}
    - {name: AGENT_RUNTIME, purpose: agent runtime, required: false, example_format: google_adk}
    - {name: LLM_GENERATION_RUNTIME, purpose: generation runtime, required: false, example_format: google_adk}
    - {name: LLM_PROVIDER, purpose: provider, required: false, example_format: "OPENAI|GEMINI"}
    - {name: LLM_MODEL_NAME, purpose: model ID, required: false, example_format: gpt-4.1-mini}
    - {name: LLM_API_KEY, purpose: provider secret, required: production, example_format: "<secret>"}
    - {name: OPENAI_BASE_URL, purpose: compatible endpoint, required: false, example_format: "https://host/v1"}
    - {name: LLM_TEMPERATURE, purpose: deterministic temperature, required: false, example_format: "0.0"}
    - {name: LLM_MAX_OUTPUT_TOKENS, purpose: output bound, required: false, example_format: "10000"}
    - {name: LLM_TIMEOUT_SECONDS, purpose: generation timeout, required: false, example_format: "120"}
    - {name: HISTORICAL_RESOLUTION_SEARCH_ENABLED, purpose: vector enrichment, required: false, example_format: "false"}
    - {name: VECTOR_SEARCH_TOP_K, purpose: result count, required: false, example_format: "5"}
    - {name: TOOL_TIMEOUT_SECONDS, purpose: resolution HTTP timeout, required: false, example_format: "120"}
    - {name: RESOLUTION_STORE_SERVICE_URL, purpose: vector service URL, required: "when search enabled", example_format: "http://resolution-store-service"}
    - {name: RESOLUTION_STORE_AUTH_MODE, purpose: auth strategy, required: production_search, example_format: "none|static_bearer|google_id_token"}
    - {name: RESOLUTION_STORE_AUTH_TOKEN, purpose: static bearer secret, required: static_bearer, example_format: "<secret>"}
    - {name: RESOLUTION_STORE_AUDIENCE, purpose: Google ID audience, required: google_id_token, example_format: "https://resolution-store"}
    - {name: OUTBOUND_RETRY_MAX_ATTEMPTS, purpose: model/tool attempts, required: false, example_format: "3"}
    - {name: OUTBOUND_RETRY_BASE_DELAY_SECONDS, purpose: retry base, required: false, example_format: "0.1"}
    - {name: OUTBOUND_RETRY_MAX_DELAY_SECONDS, purpose: retry cap, required: false, example_format: "2.0"}
    - {name: GCP_PROJECT_ID, purpose: production project, required: production, example_format: project-id}
    - {name: PORT, purpose: HTTP port, required: false, example_format: "8082"}
    - {name: OBSERVABILITY__CONTEXT_ENABLED, purpose: governed context, required: false, example_format: "true"}
    - {name: OBSERVABILITY__CLOUD_LOGGING, purpose: cloud export, required: false, example_format: "true"}
    - {name: SUMO_LOGIC_ENABLED, purpose: Sumo export, required: false, example_format: "true"}
    - {name: SUMO_LOGIC_ENDPOINT, purpose: collector secret URL, required: "if enabled", example_format: "<secret>"}
    - {name: SUMO_LOGIC_TIMEOUT_SECONDS, purpose: delivery timeout, required: false, example_format: "2"}
  parameters:
    - {name: environment, type: enum, default: local, description: hardening posture}
    - {name: llm_provider/model, type: strings, default: "OPENAI/gpt-4.1-mini in YAML", description: generation model}
    - {name: llm_temperature, type: float, default: 0.0, description: immutable determinism}
    - {name: llm_max_output_tokens, type: int, default: 10000, description: YAML output limit}
    - {name: historical_resolution_search_enabled, type: bool, default: false, description: enrichment toggle}
    - {name: vector_search_top_k, type: int, default: 5, description: 1..20}
    - {name: outbound_retry, type: object, default: "attempts=3, base=.1s, cap=2s", description: shared model/tool retry values}
    - {name: observability, type: platform_sdk.ObservabilitySettings, default: "context/cloud/generation true, INFO", description: telemetry}
    - {name: safety, type: platform_sdk.SafetyConfig, default: "enabled; model I/O filtering; DLP Model Armor us-central1", description: guardrails}
  warnings:
    - "All API keys, bearer tokens, collector endpoints, and credential documents are <secret>."
    - "pyproject_use.toml is an alternate packaging draft and is excluded."
    - "The tracked README is copied by Containerfile only for build metadata; a minimum regeneration may remove the pyproject readme reference and omit README."

component_manifest:
  files:
    - {path: src/rca_service/main.py, language: Python, classes: [], functions: []}
    - {path: application/mappers/rca_mapper.py, language: Python, classes: [], functions: [{name: report_to_response_data, signature: "(RCAReport)->dict[str,Any]"}]}
    - {path: application/ports/inbound/rca_use_case.py, language: Python, classes: [{name: RCAUseCase, kind: Protocol, properties: [], methods: [{name: analyze_rca, signature: "async (dict,trace_id)->RCAReport"}]}], functions: []}
    - {path: application/ports/outbound/rca_generation_port.py, language: Python, classes: [{name: RCAGenerationPort, kind: Protocol, properties: [], methods: [{name: generate_rca, signature: "async (*,prompt,usage_context)->str"}]}], functions: []}
    - {path: application/ports/outbound/resolution_store_port.py, language: Python, classes: [{name: ResolutionRecord, kind: Pydantic_model, properties: [{name: id, type: str}, {name: incident_id, type: str}, {name: description, type: str}, {name: resolved_at, type: "str|null"}, {name: similarity_score, type: "float 0..1"}], methods: []}, {name: VectorSearchResult, kind: Pydantic_model, properties: [{name: resolution_records, type: "list[ResolutionRecord]"}], methods: []}, {name: ResolutionStorePort, kind: ABC, properties: [], methods: [{name: search_resolutions, signature: "async (*,description,error,top_k)->VectorSearchResult"}]}], functions: []}
    - {path: application/services/rca_service.py, language: Python, classes: [{name: RCAService, kind: application_service, properties: [{name: _runner, type: RCAAnalysisRunnerPort}], methods: [{name: __init__, signature: "(runner)->None"}, {name: analyze_rca, signature: "async (dict,trace_id)->RCAReport"}]}], functions: []}
