meta:
  name: genai-cost-governor
  purpose: Regenerate a synchronous Vertex AI utility for token measurement, configured cost estimation, prompt-budget governance, generation, summarization, and explicit cache lifecycle management.
  domain: GenAI cost governance
  description: Utility code-generation blueprint for runtime code and policy configuration only. Tests, test helpers, and documentation logic are excluded.

replication_profile:
  language: { name: Python, version: ">=3.12; cost_client.py inline script metadata permits >=3.11" }
  agent_frameworks:
    - { name: google-genai, version: "declared >=1.41.0; locked 2.20.0", role: "Vertex AI client, request configuration, token counting, generation, and cache APIs" }
  orchestration:
    topology: pipeline
    description: A configuration-selected generate, govern, or cache pipeline wraps a policy-neutral reusable adapter.
  model_provider: Google Vertex AI
  models:
    - { role: "tokenizer, generator, and summarizer", provider: "Google Vertex AI", model_id: gemini-2.5-flash, context_window: "not declared in source" }
  runtime: { type: "Python library and CLI script", description: "cost_utility.py is reusable; cost_client.py dispatches a configured operation" }
  hosting_platform: { type: none, description: "No server, function, container, or deployment manifest" }
  vector_store: none
  secrets_management: Application Default Credentials; no credential belongs in the repository configuration.
  supporting_services:
    - { name: "Vertex AI Generative AI API", type: "managed model API", purpose: "Token counting and content generation" }
    - { name: "Vertex AI context cache", type: "managed cache API", purpose: "Explicit cached-content creation and deletion" }
    - { name: "ADC and Cloud IAM", type: "identity controls", purpose: "Authenticate and authorize Google Gen AI client operations" }
  presentation_layer: { framework: none, type: console, backend_binding: "cost_client.main -> GenAiCostUtility", description: "Print a fixed evidence record" }

source_structure:
  tree: |
    genai-cost-governor/
    |-- .env
    |-- cost_client.py
    |-- cost_utility.py
    |-- config.toml
    |-- config-01-normal-allow.toml
    |-- config-02-require-summarization.toml
    |-- config-03-optional-vertex-summarizer.toml
    |-- config-04-raise-stop.toml
    |-- config-05-allow-exception-review.toml
    |-- config-06a-cache-disabled.toml
    |-- config-06b-cache-enabled-below-min.toml
    |-- config-06c-cache-create-live.toml
    |-- pyproject.toml
    `-- uv.lock
  entry_points:
    - { path: cost_client.py, purpose: "Execute the operation selected by a TOML policy" }
    - { path: cost_utility.py, purpose: "Expose GenAiCostUtility and immutable result models" }
  modules:
    - path: cost_utility.py
      role: Provider and arithmetic adapter
      key_responsibilities: ["Count tokens", "Estimate configured USD cost", "Generate content", "Summarize", "Decide prompt-budget action", "Create/delete cache", "Normalize usage"]
    - path: cost_client.py
      role: Configuration-driven console client
      key_responsibilities: ["Load environment and TOML", "Build utility", "Dispatch generate/govern/cache", "Format usage/cost evidence", "Apply client-level cache eligibility"]
  config_files:
    - { path: .env, purpose: "Synthetic client input catalogue; only active GENAI_COST_TEST_INPUT is consumed" }
    - { path: config.toml, purpose: "Default generation policy" }
    - { path: "config-01-normal-allow.toml", purpose: "Allow and generate policy" }
    - { path: "config-02-require-summarization.toml", purpose: "Caller-owned summarization decision policy" }
    - { path: "config-03-optional-vertex-summarizer.toml", purpose: "Managed summarization and post-summary gates" }
    - { path: "config-04-raise-stop.toml", purpose: "Oversize prompt exception policy" }
    - { path: "config-05-allow-exception-review.toml", purpose: "Manual review decision policy" }
    - { path: "config-06a-cache-disabled.toml", purpose: "Disabled cache policy" }
    - { path: "config-06b-cache-enabled-below-min.toml", purpose: "Cache minimum-size policy" }
    - { path: "config-06c-cache-create-live.toml", purpose: "Synthetic expansion, cache creation, and cleanup policy" }
    - { path: pyproject.toml, purpose: "Package and dependency definition" }
    - { path: uv.lock, purpose: "Exact dependency resolution" }
  notable_conventions: ["Frozen dataclass results", "Host-owned enforcement", "Injected client support", "Synchronous provider calls", "Local cost arithmetic is not billing authority"]

architecture:
  pattern: pipeline
  components:
    - { name: GenAiCostUtility, role: "outbound Vertex adapter", description: "Own provider request construction, normalization, configured arithmetic, and prompt-decision evidence", inputs: [configuration, text, token_thresholds], outputs: [CostEstimate, GenerationResult, PromptDecision, CacheResult] }
    - { name: cost_client, role: "scenario dispatcher and presenter", description: "Select operation from TOML and render a stable report", inputs: [.env, TOML], outputs: [stdout] }
    - { name: "Vertex model API", role: "tokenizer and generator", description: "Count tokens and generate text", inputs: [model, contents, GenerateContentConfig], outputs: [token_count, generated_response] }
    - { name: "Vertex cache API", role: "cached-content manager", description: "Create and delete explicit cache resources", inputs: [model, contents, TTL, display_name], outputs: [cache_resource] }
  data_flows:
    - { from: cost_client, to: GenAiCostUtility, data_type: "configuration plus synthetic text", description: "Build utility and invoke selected operation" }
    - { from: GenAiCostUtility.count_tokens, to: client.models.count_tokens, data_type: "model and contents", description: "Obtain provider tokenizer count" }
    - { from: GenAiCostUtility.generate_content, to: client.models.generate_content, data_type: "model, prompt, generation config", description: "Generate once and receive usage metadata" }
    - { from: GenAiCostUtility.generate_content, to: GenAiCostUtility.estimate_cost, data_type: "input/output token counts", description: "Calculate configured USD estimate" }
    - { from: GenAiCostUtility.govern_prompt, to: GenAiCostUtility.summarize, data_type: "oversized text and target", description: "Optionally produce a bounded summary" }
    - { from: GenAiCostUtility.create_cache, to: client.caches.create, data_type: CreateCachedContentConfig, description: "Create cached content" }
    - { from: GenAiCostUtility.delete_cache, to: client.caches.delete, data_type: "cache name", description: "Delete cached content" }
  state_schema:
    model: str
    input_rate: float
    output_rate: float
    max_output_tokens: int
    temperature: float
    top_p: float
    top_k: int
    cache_ttl_seconds: int
    client: genai.Client-compatible
  entry_point: "cost_client.main for execution; GenAiCostUtility for library integration"
  terminal_conditions: ["Selected operation reports and returns", "Govern raise is converted by client to a stopped report", "Unsupported operation or uncaught validation/provider error propagates"]

api_contracts:
  entry_points:
    - name: GenAiCostUtility.__init__
      invocation_style: constructor
      signature: "__init__(self, project_id: str, location: str, model: str, input_cost_per_1m_tokens: float, output_cost_per_1m_tokens: float, api_version: str = 'v1', timeout_seconds: float = 30, max_output_tokens: int = 512, temperature: float = .2, top_p: float = .8, top_k: int = 40, cache_ttl_seconds: int = 3600, client: genai.Client | None = None) -> None"
      inputs: [project_id, location, model, input/output rates, API/generation/cache settings, optional client]
      outputs: [GenAiCostUtility]
      description: Validate configuration and create a Vertex-enabled client when none is injected.
    - { name: count_tokens, invocation_style: synchronous, signature: "count_tokens(self, text: str) -> int", inputs: [text], outputs: [total_tokens], description: "Return non-negative Vertex token count" }
    - { name: estimate_cost, invocation_style: local, signature: "estimate_cost(self, input_tokens: int, output_tokens: int) -> CostEstimate", inputs: [input_tokens, output_tokens], outputs: [CostEstimate], description: "Apply configured per-million rates" }
    - { name: generate_content, invocation_style: synchronous, signature: "generate_content(self, prompt: str) -> GenerationResult", inputs: [prompt], outputs: [GenerationResult], description: "Generate once, normalize usage, and estimate cost" }
    - { name: summarize, invocation_style: synchronous, signature: "summarize(self, text: str, target_tokens: int) -> GenerationResult", inputs: [text, target_tokens], outputs: [GenerationResult], description: "Generate with the standard summary instruction" }
    - { name: govern_prompt, invocation_style: synchronous, signature: "govern_prompt(self, text: str, max_input_tokens: int, target_input_tokens: int, on_exceeded: str = 'allow', summarization_enabled: bool = False, require_net_token_reduction: bool = False) -> PromptDecision", inputs: [text, thresholds, action, flags], outputs: [PromptDecision], description: "Count and route prompt; optionally summarize and gate summary" }
    - { name: create_cache, invocation_style: synchronous, signature: "create_cache(self, contents: str, display_name: str = '') -> CacheResult", inputs: [contents, display_name], outputs: [CacheResult], description: "Create cache using configured TTL" }
    - { name: delete_cache, invocation_style: synchronous, signature: "delete_cache(self, cache_id: str) -> CacheResult", inputs: [cache_id], outputs: [CacheResult], description: "Delete cache" }
    - { name: cost_client.main, invocation_style: "CLI --config FILE; default config.toml", signature: "main() -> None", inputs: [.env, TOML, ADC], outputs: [stdout], description: "Dispatch configured operation" }
  internal_interfaces:
    - { name: GenAiCostUtility._usage, signature: "_usage(value: object, *names: str) -> int", description: "Return first present usage field converted to int, else zero" }
    - { name: cost_client.report, signature: "report(config: str, operation: str, **values: object) -> None", description: "Render fixed evidence fields with N/A defaults" }
    - { name: cost_client.load_env, signature: "load_env() -> None", description: "Overwrite process environment with active dotenv entries" }
    - { name: cost_client.load, signature: "load(path: str) -> dict", description: "Return TOML genai_cost table" }
    - { name: cost_client.build, signature: "build(c: dict) -> GenAiCostUtility", description: "Convert policy values and instantiate utility" }
    - { name: cost_client.costs, signature: "costs(g) -> dict", description: "Format token/cost fields, USD to ten decimal places" }

business_logic:
  intent: Provide token, generation, cost, governance, and cache evidence while leaving durable budgets, enforcement, retries, observability, billing reconciliation, and release policy to the host.
  rules:
    - "Reject blank project_id, location, or model."
    - "Reject timeout_seconds <= 0, negative token rates, max_output_tokens <= 0, temperature < 0, top_p outside [0,1], top_k <= 0, or cache_ttl_seconds <= 0."
    - "Use a truthy injected client; otherwise create genai.Client(vertexai=True, project, location, HttpOptions(api_version, timeout=int(seconds*1000)))."
    - "count_tokens rejects falsey text, calls models.count_tokens(model=self.model, contents=text), rejects missing or negative total_tokens, and returns int(total_tokens)."
    - "estimate_cost rejects negative counts; input cost = input_tokens * input_rate / 1,000,000; output cost is analogous; total is their sum."
    - "generate_content rejects a falsey prompt and calls the configured model once."
    - "Generation disables automatic function calling and thinking, and passes max_output_tokens, temperature, top_p, and top_k."
    - "Generation strips response.text and rejects an empty result."
    - "Usage reads snake_case then camelCase names: prompt token count, candidate token count, and cached-content token count; absent values become zero."
    - "summarize rejects falsey text or target_tokens <= 0, then delegates to generate_content with the exact template below."
    - "govern_prompt supports only allow, summarize, raise, review, and require_summarization; reject other actions."
    - "Reject non-positive max_input_tokens or target_input_tokens, then count original text."
    - "If tokens <= maximum OR on_exceeded is allow, return original text with action allow."
    - "If oversized, action summarize, and summarization is enabled: summarize; count summary; overhead=max(generation.input_tokens-original_tokens,0)."
    - "Stop with empty text/action stop_summary_over_target if summary tokens exceed target_input_tokens."
    - "Otherwise stop with action stop_summary_over_maximum if summary tokens exceed max_input_tokens."
    - "Otherwise, if net reduction is required and summary tokens + overhead >= original tokens, stop with action stop_no_net_token_reduction."
    - "Otherwise accept generated summary with action summarize and attached GenerationResult."
    - "If oversized action is raise, raise ValueError('prompt exceeds configured token budget')."
    - "If oversized action is review or require_summarization, return original text and that action without generation."
    - "create_cache rejects falsey contents; creates with model, TTL '<cache_ttl_seconds>s', optional display_name or None, and contents=[contents]."
    - "Cache ID is response.name or response.id; reject if neither exists; return status created."
    - "delete_cache rejects falsey cache_id, calls caches.delete(name=cache_id), and returns status deleted."
    - "load_env ignores blank/comment/malformed lines and overwrites os.environ for every active KEY=VALUE line."
    - "The client requires a truthy GENAI_COST_TEST_INPUT; GENAI_COST_TEST_OUTPUT is not consumed."
    - "The configured operation defaults to generate; unsupported operations raise ValueError."
    - "Generate operation produces and releases output and reports all token/cost fields."
    - "Govern catches any ValueError from govern_prompt, recounts input, reports stopped/action raise, and returns."
    - "For govern action allow with generate_when_allowed true, call generate_content on decision text."
    - "A summary exists only when generation exists and decision action equals summarize; stopped means action starts with stop_."
    - "Summary overhead is max(generation input tokens - original tokens, 0); effective reduced tokens are final tokens + overhead; saved tokens are original minus effective."
    - "Release generated output only when generation exists and decision is not stopped."
    - "For cache operation, count tokens; if expansion is enabled and count is below minimum, repeat text plus newline minimum//max(count,1)+2 times and recount."
    - "Skip cache if disabled or still below minimum; report the corresponding reason."
    - "Otherwise create cache with display name genai-cost-test, immediately delete it, and report both statuses."
  constraints: ["No durable/session budget store", "No billing authority", "No retries or telemetry", "No output authorization beyond client demonstration", "Summary target is an instruction followed by explicit post-generation gates"]
  assumptions: ["ADC/IAM permit Vertex operations", "Configured rates are supplied and governed externally", "Usage metadata fields follow one supported naming style"]
  domain_terms:
    original_tokens: Vertex count for supplied text.
    final_tokens: Count for selected original text or summary.
    summarization_overhead: "max(generation request tokens - original tokens, 0)"
    effective_reduced_tokens: "summary tokens + summarization overhead"
    cached_tokens: Provider-reported cached request tokens; not subtracted from configured estimate.

tool_inventory:
  tools:
    - { name: models.count_tokens, type: "Vertex SDK operation", description: "Count tokens", inputs: [model, contents], outputs: [total_tokens] }
    - { name: models.generate_content, type: "Vertex SDK operation", description: "Generate or summarize", inputs: [model, contents, config], outputs: [text, usage_metadata] }
    - { name: caches.create, type: "Vertex SDK operation", description: "Create explicit cached content", inputs: [model, CreateCachedContentConfig], outputs: [cache resource] }
    - { name: caches.delete, type: "Vertex SDK operation", description: "Delete cached content", inputs: [name], outputs: [provider result ignored] }
  mcps: []
  external_services:
    - { name: "Google Vertex AI", type: "managed model and cache service", purpose: "Tokenize, generate, summarize, and cache", auth_method: "ADC and Cloud IAM" }
  databases: []

prompt_patterns:
  system_prompts: []
  user_prompt_templates:
    - name: bounded_summary
      template: |-
        Summarize the following text in no more than {{target_tokens}} tokens. Preserve decisions, constraints, risks, and required actions.

        {{text}}
      variables: [target_tokens, text]
  chains:
    - { name: "optional summarization", steps: ["Count original", "Generate bounded summary", "Count summary", "Calculate overhead", "Apply target, maximum, and net-reduction gates"] }
  evaluation_criteria: ["summary <= target_input_tokens", "summary <= max_input_tokens", "when required, summary + overhead < original"]

config_schema:
  env_vars:
    - { name: GENAI_COST_TEST_INPUT, purpose: "Active synthetic client input", required: true, example_format: "<synthetic-text>" }
    - { name: GENAI_COST_TEST_OUTPUT, purpose: "Present in catalogue but unused by runtime code", required: false, example_format: "<synthetic-text>" }
  parameters:
    - { name: operation, type: str, default: generate, description: "generate|govern|cache" }
    - { name: project_id, type: str, default: mt-office-of-ai-poc, description: "Vertex project" }
    - { name: location, type: str, default: us-central1, description: "Vertex region" }
    - { name: model, type: str, default: gemini-2.5-flash, description: "Model for all calls" }
    - { name: api_version, type: str, default: v1, description: "Google API version" }
    - { name: api_timeout_seconds, type: float, default: 30, description: "Provider timeout" }
    - { name: input_cost_per_1m_tokens, type: float, default: 0.15, description: "Configured input USD rate" }
    - { name: output_cost_per_1m_tokens, type: float, default: 0.60, description: "Configured output USD rate" }
    - { name: max_input_tokens, type: int, default: 8192, description: "Prompt threshold" }
    - { name: target_input_tokens, type: int, default: 6144, description: "Summary target" }
    - { name: max_output_tokens, type: int, default: 512, description: "Generation output limit" }
    - { name: temperature, type: float, default: 0.2, description: "Sampling temperature" }
    - { name: top_p, type: float, default: 0.8, description: "Nucleus sampling" }
    - { name: top_k, type: int, default: 40, description: "Candidate sampling" }
    - { name: on_exceeded, type: str, default: allow, description: "Oversize action" }
    - { name: summarization_enabled, type: bool, default: false, description: "Allow provider summary" }
    - { name: require_net_token_reduction, type: bool, default: false, description: "Apply overhead-aware reduction gate" }
    - { name: generate_when_allowed, type: bool, default: false, description: "Client generation after allow" }
    - { name: cache_enabled, type: bool, default: false, description: "Client cache policy" }
    - { name: cache_min_tokens, type: int, default: 0, description: "Minimum cache input size" }
    - { name: expand_synthetic_cache_document, type: bool, default: false, description: "Repeat synthetic input until above minimum" }
    - { name: cache_ttl_seconds, type: int, default: 3600, description: "Cache TTL" }
  warnings: ["Configured prices are estimates, not invoices", "Do not put credentials in .env/TOML", ".env values are redacted test data"]

component_manifest:
  files:
    - path: cost_utility.py
      language: Python
      classes:
        - { name: CostEstimate, kind: "frozen dataclass", properties: [{ name: input_tokens, type: int }, { name: output_tokens, type: int }, { name: input_cost_usd, type: float }, { name: output_cost_usd, type: float }, { name: total_cost_usd, type: float }], methods: [] }
        - { name: GenerationResult, kind: "frozen dataclass", properties: [{ name: text, type: str }, { name: input_tokens, type: int }, { name: output_tokens, type: int }, { name: cached_tokens, type: int }, { name: estimated_cost, type: CostEstimate }], methods: [] }
        - { name: PromptDecision, kind: "frozen dataclass", properties: [{ name: text, type: str }, { name: original_tokens, type: int }, { name: final_tokens, type: int }, { name: action, type: str }, { name: generation, type: "GenerationResult | None = None" }, { name: reason, type: "str = ''" }], methods: [] }
        - { name: CacheResult, kind: "frozen dataclass", properties: [{ name: cache_id, type: str }, { name: status, type: str }], methods: [] }
        - name: GenAiCostUtility
          kind: class
          properties: [{ name: model, type: str }, { name: input_rate, type: float }, { name: output_rate, type: float }, { name: max_output_tokens, type: int }, { name: temperature, type: float }, { name: top_p, type: float }, { name: top_k, type: int }, { name: cache_ttl_seconds, type: int }, { name: client, type: genai.Client-compatible }]
          methods:
            - { name: __init__, signature: "__init__(self, project_id: str, location: str, model: str, input_cost_per_1m_tokens: float, output_cost_per_1m_tokens: float, api_version: str = 'v1', timeout_seconds: float = 30, max_output_tokens: int = 512, temperature: float = .2, top_p: float = .8, top_k: int = 40, cache_ttl_seconds: int = 3600, client: genai.Client | None = None) -> None" }
            - { name: count_tokens, signature: "count_tokens(self, text: str) -> int" }
            - { name: estimate_cost, signature: "estimate_cost(self, input_tokens: int, output_tokens: int) -> CostEstimate" }
            - { name: generate_content, signature: "generate_content(self, prompt: str) -> GenerationResult" }
            - { name: summarize, signature: "summarize(self, text: str, target_tokens: int) -> GenerationResult" }
            - { name: govern_prompt, signature: "govern_prompt(self, text: str, max_input_tokens: int, target_input_tokens: int, on_exceeded: str = 'allow', summarization_enabled: bool = False, require_net_token_reduction: bool = False) -> PromptDecision" }
            - { name: create_cache, signature: "create_cache(self, contents: str, display_name: str = '') -> CacheResult" }
            - { name: delete_cache, signature: "delete_cache(self, cache_id: str) -> CacheResult" }
            - { name: _usage, signature: "@staticmethod _usage(value: object, *names: str) -> int" }
      functions: []
    - path: cost_client.py
      language: Python
      classes: []
      functions:
        - { name: report, signature: "report(config: str, operation: str, **values: object) -> None" }
        - { name: load_env, signature: "load_env() -> None" }
        - { name: load, signature: "load(path: str) -> dict" }
        - { name: build, signature: "build(c: dict) -> GenAiCostUtility" }
        - { name: costs, signature: "costs(g) -> dict" }
        - { name: main, signature: "main() -> None" }
  config_keys:
    - { name: "genai_cost.*", purpose: "All parameters enumerated in config_schema.parameters", source_file: "config*.toml" }
    - { name: GENAI_COST_TEST_INPUT, purpose: "Client input", source_file: .env }
  config_artifacts:
    - path: "config.toml and config-*.toml"
      format: TOML
      purpose: "Complete runtime policy profiles"
      keys: [genai_cost.operation, genai_cost.project_id, genai_cost.location, genai_cost.model, genai_cost.api_version, genai_cost.api_timeout_seconds, genai_cost.input_cost_per_1m_tokens, genai_cost.output_cost_per_1m_tokens, genai_cost.max_input_tokens, genai_cost.target_input_tokens, genai_cost.max_output_tokens, genai_cost.temperature, genai_cost.top_p, genai_cost.top_k, genai_cost.on_exceeded, genai_cost.summarization_enabled, genai_cost.require_net_token_reduction, genai_cost.generate_when_allowed, genai_cost.cache_enabled, genai_cost.cache_min_tokens, genai_cost.expand_synthetic_cache_document, genai_cost.cache_ttl_seconds]
      structure:
        common: { project_id: mt-office-of-ai-poc, location: us-central1, model: gemini-2.5-flash, api_version: v1, input_cost_per_1m_tokens: 0.15, output_cost_per_1m_tokens: 0.60, cache_ttl_seconds: 3600 }
        config.toml: { operation: generate, api_timeout_seconds: 30, max_output_tokens: 128, temperature: 0.2, top_p: 0.8, top_k: 40 }
        config-01-normal-allow.toml: { operation: govern, api_timeout_seconds: 30, max_input_tokens: 8192, target_input_tokens: 6144, max_output_tokens: 128, temperature: 0.2, top_p: 0.8, top_k: 40, on_exceeded: allow, summarization_enabled: false, generate_when_allowed: true }
        config-02-require-summarization.toml: { operation: govern, api_timeout_seconds: 30, max_input_tokens: 30, target_input_tokens: 20, max_output_tokens: 20, temperature: 0.2, top_p: 0.8, top_k: 40, on_exceeded: require_summarization, summarization_enabled: false }
        config-03-optional-vertex-summarizer.toml: { operation: govern, api_timeout_seconds: 30, max_input_tokens: 60, target_input_tokens: 40, max_output_tokens: 512, temperature: 0.2, top_p: 0.8, top_k: 40, on_exceeded: summarize, summarization_enabled: true, require_net_token_reduction: true }
        config-04-raise-stop.toml: { operation: govern, api_timeout_seconds: 30, max_input_tokens: 20, target_input_tokens: 10, max_output_tokens: 20, temperature: 0.2, top_p: 0.8, top_k: 40, on_exceeded: raise, summarization_enabled: false }
        config-05-allow-exception-review.toml: { operation: govern, api_timeout_seconds: 30, max_input_tokens: 20, target_input_tokens: 10, max_output_tokens: 20, temperature: 0.2, top_p: 0.8, top_k: 40, on_exceeded: review, summarization_enabled: false }
        config-06a-cache-disabled.toml: { operation: cache, api_timeout_seconds: 30, cache_enabled: false, cache_min_tokens: 32768 }
        config-06b-cache-enabled-below-min.toml: { operation: cache, api_timeout_seconds: 30, cache_enabled: true, cache_min_tokens: 32768 }
        config-06c-cache-create-live.toml: { operation: cache, api_timeout_seconds: 60, cache_enabled: true, cache_min_tokens: 1024, expand_synthetic_cache_document: true }
    - { path: .env, format: dotenv, purpose: "Synthetic client catalogue", keys: [GENAI_COST_TEST_INPUT, GENAI_COST_TEST_OUTPUT], structure: { GENAI_COST_TEST_INPUT: "<redacted-test-data>", GENAI_COST_TEST_OUTPUT: "<redacted-test-data; unused>" } }
