How database do the data synchronization between its different nodes?:

MongoDB Eventual Consistency (Change Data Capture)
  Leader Nodes- write/read
  Follower Nodes- read
step1: maintain a journel (OpsLogs), leader node write on OpsLogs-short TTL
step2: CDC component reads the log from OpsLog, and converts those changes into the Event ChangeStream Event, and publish to the follower node as a ChangeStream Event.
step3: This ChangeStreamEvent is what we are going to make use of.
step4: In our use case we are going to reuse these ChangeStreamEvents

our solution: same as other follower node receive the ChangeStreamEvent


