SAGA: Distributed Transaction
Local Transaction:
     In Single DB (Atomicity-either all or none)- Transaction (executing group of Database operations as a one single logical operation) ACID
Distributed Transaction:
  2-phase commit
         1) Prepare Phase: Transaction mgr will ask the participant nodes whether they are ready to commit their individual local transactions
         2) Commit Phase: If all the participating nodes reply positively then transaction manager will tell the nodes that commit your transactions
              Limitation: SPF (Transaction Manager)
                          Transaction Cordinator has to wait for confirmation from all the nodes     
SAGA: Distributed transaction for microservices using different DB
      Choreography
      Orchestratort
      Choreography:
          Every service participate in its own local transaction.
          If any service transaction fails, responses back to service received the event,so that those services will generate a compensatory transaction that roll back
       Orchestrator:
         There will be an orchestrator that manages entire transaction among the services.
         Orchestrator call services sequentially, if it receives success response from service, it call another service. If one of the service fail then orchestrator will rollback all previous service transactions.
         Camunda/Apache Camel (mini ESB)


Design and Implementation of Microservices?:
