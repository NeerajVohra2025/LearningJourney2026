  The implementation of microservice will be developed using spring boot framework:
  
Microservices 12 factor principles:
  Single Code base per microservices for all environments (dev,test,prod)-Git
  All application should bundle their dependencies along with application bundle - Maven
  Externalize configuration using Configuration Server - Springboot (GitHub)
  All backing services should be accessible through an addressable URL
  Strong Isolation between build, release and run ,e.g. DevOps, CI/CD
  The application should be stateless for high fault tolerance (JWT-session data at client side)
  A service able to tolerate fault (Replication)
  Expose service using port bindings
  Services should be scale out with concurrency
  Building applications with minimal startup and shutdown times
  Keeping all environment Identical as Identical as possible possible
  Centarlized logging for the microservices (splunk, ELK,EFL(FluentBit))
    LogStash- parser, agent
    ElasticSearch- Storage
    Kibana- Visualization
  Admin tasks to be bundled with admin code and be packaged with application code
   Master data, User Data
