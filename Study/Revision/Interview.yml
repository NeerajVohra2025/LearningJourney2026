How to ensure the connectivity between the on-prem and Cloud?:
   Direct Connect #Direct connect can access VPC as well as Cloud Native Services.
   Virtual Private Gateway*  # private virtual Interface, public virtual interface
   Transit Gateway
Site-to-Site VPN Connectivity: If you want temporary connectivity and data is less than 500 GB, then go with VPN. If want to operate on Hybrid mode for too long then go for 
Direct Connect.   
Virtual Private Gateway (Direct Connect): connects your VPC to the on-premises. Is secure but not encrypted.
Virtual Private Gateway is only to access your VPC level services, not to access cloud native services.
Enable VPN on top of Direct Connect. Direct Connect data flow through the third-party connectivity.
VPN Server: Bastion Host (Pritunl)

Storage Gateway:
Cloud Coming to your on-prime, connect to the drives (D:/, E:/) in backend it stores in S3, translating of file-storage to object storage done through the s/w appliance
