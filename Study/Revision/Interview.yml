Migration Phases:
  Pre-Migration: 
    Assessment:
      What application do we have ?
      Which applications be migrated to cloud?
      People, Process and Technologies
         Gaps in existing setup
         Changes required for Migration and Post Migration
      TCO - current and post migration  (storage,networking and computing)        
    Readiness and Planning:
      Address the Gaps Identified in the assessment phase
      Build your baseline environment -technology and process
      Develop Cloud Skills-People
      Creating a Strong Migration Plan
         Migrating application priorities
         Use 7 R's as migration strategy for each application
             Relocate: Move vSphere-based application to AWS without application changes
             Rehosting: Lift and Shift
             Re-Platform:
             Re-Purchase:
             Re-Factor:
             Retire:
             Retain:
      Identify tools for migrating different application components
      Evaluate direct connection options to AWS cloud for initial migration or ongoing operations      
  Migration:
    Application Designed ,Migrated and Validated as per 7R's Strategy
    Pre-Migration Preparation:
      Logistics arround data collection
      Encryption/Decryption of existing data
         Exsisting encrypted data need to be decrypted before presenting it to migrating-tool, re-encrypted post migration
      Checklist for Migration tracking
    Post-Migration Activity:
      Validation in context of completeness, correctness and Integrity of the migrated component.    
  Operation (Post-migration):
      Plan to turn off Old systems
      Establish two way sync process to hybrid setup
      Identify opportunities to automate
      Continuous Improvement mindset

