@EnableAutoConfiguration:
    wil create the bean automatically if it sees the lobrarires in the class path, for example if we include spring-boot-starter-web in the pom.xml,automatically 
    serverlet dispatcher,handler mapping,default view resolver are automatically created.  
    will looks for librarires in the class path and creates beans automatically
