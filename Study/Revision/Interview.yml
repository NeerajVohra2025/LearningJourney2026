NAT Gateway: EC2 instance inside private subnet access internet through the NAT.
DHCP: issues private IP for EC2 .
SG (EC2 level): Deny all traffic by default (Statefull).
NACL (subnet level): Allows all traffic by default (Sateless). Rule are evaluated sequentially.
ports?:
entry point, without port can’t run more than one application on the same server.
BYOIP: Bring your own IP,all public IP are paid, by default AWS assigns public ip address from its owned pool of public ip addrsses.
