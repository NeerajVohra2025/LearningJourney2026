Ingress: 1  #3 (Create/Ingress)
  #k apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/controller-v1.3.1/deploy/static/provider/baremetal/deploy.yaml
  #k get ingressClass
  #kubectl create ingress catch-all --class=otheringress --rule="/path=svc:port,tls=secret1" --annotation ingress.annotation2=bla
  #nginx.ingress.kubernetes.io/rewrite-target: /      
  step1: create deployment
  k create deploy ing-deploy --image =httpd --port=80 # serviceAccount
  step2: create service
  k expose deploy ing-deploy --name=ing-svc 
  step3: create Ingress
  k get ingressClass
  k create ing <simple-ingress> --class=<nginx> --rule="/path=ing-svc:port" --annotation="nginx.ingress.kubernetes.io/rewrite-target= / "
 Secure Ingress:   #openssl  , create (secret-tls, Ingress), ingress  
  step1: create key 
  openssl genrsa -out ingress.key 2048
  step2: generate cert
  #openssl req -x509 -new -nodes -key ca.key -subj "/CN=${MASTER_IP}" -days 10000 -out ca.crt 
  openssl req -x509 -new -nodes -key ingress.key -subj "/CN=demo.mycompany.com" -days 10000 -out ingress.crt
  step3: create secure secrets
  k create secret tls <ing-secret> --key=ingress.key --cert=ingress.crt
  step4: create secure Ingress
  k create ing <secure-ingress> --class=<nginx> --rule="/path=ing-svc:port,tls=ing-secret" --annotation="nginx.ingress.kubernetes.io/rewrite-target= / "
  


