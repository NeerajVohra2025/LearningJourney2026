Auditing: 1  /etc/kubernetes/audit/policy.yaml `1 # 14 (Audit)
    /etc/kubernetes/manifest/
    --audit-policy-file=/etc/kubernetes/audit/policy.yaml
    --audit-log-path specifies the log file path that log backend uses to write audit events. Not specifying this flag disables log backend. - means standard out
    --audit-log-maxage defined the maximum number of days to retain old audit log files
    --audit-log-maxbackup defines the maximum number of audit log files to retain
    --audit-log-maxsize defines the maximum size in megabytes of the audit log file before it gets rotated
    apiVersion: audit.k8s.io/v1 # This is required.
    kind: Policy
    # Don't generate audit events for all requests in RequestReceived stage.
    omitStages:
      - "RequestReceived"
    rules: 
      - level: Metadata
      # verbs:
      # users
      # namespaces:      
        resources:
          - group: ""
            resources: ["pods/log", "pods/status"]
            
Falco(Worker Node): rules to find out malicious process inside the container   /etc/falco/falco_rules.local.yaml  # 1 # 15  
# intercepts all system calls, that can be logged have rule file In worker node 
    /etc/falco/falco-rules.yaml
    falco --help
    falco -r <rule_file>     
    falco service status
    falco --list # list of rules
    falco -M 30 > falco-output.log
    tail -f /var/log/syslog | grep falco
    service falco restart  # systemctl start falco
    
    strace intercepts the syscall logs
    ps -aux | grep etcd # process id
    starce --list
    strace -p <pid> -f 
    starce kill -9 <pid>
    starce kill -9 <pid> 2>&1 | grep <pid>
    scp /root/gvisor-install.sh node01:/root/
    
