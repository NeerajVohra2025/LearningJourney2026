Open Policy Agent or Gatekeeper: Gatekeeper is a customizable admission webhook for k8s that enforce policies executed by  OPA kind: ConstrintTemplate # 1 20
    UC1: Pods must have team and Env label
    kind: ConstraintTemplate   # rego language
        kind: <custom> # name of the constarinttemplete
        spec:
         match: 
           kinds:
             - apiGroups: [""]
               kind: ["Pod"]
           parameters: ["team","dev"]    
    UC2: Deployment must have min 3 replicas      
      kind: ["Deployment"]  
           parameters:  
             min: 3  
    UC3: All Image must come from trusted registry      
      kind: ["Pod"]  
            parameters: 
              registry: 
               - "docker.io" 

Secrets: # 1 21
  Extract Secrets and Safe into file:
  k create ns <demo>  
  k create secret generic <demo-secret> --from-literal=username=admin --from-literal=password=adcd1234
  k get secret <demo-secret> -n <demo> -o yaml # data tag
  k get secret <demo-secret> -n <demo> -o jsonpath='{.data.username}' | base64 -d > user.log # first dot is root element
  k get secret <demo-secret> -n <demo> --template {{.data.username}} # using template   
  
  Automount ServiceAccount:
   spec:
     serviceAccountName: demo-sa
     automountServiceAccountToken: false # delete existing volume and volumemount
   
  Read secrets from ETCD:
  cat /etc/kubernetes/manifests/kube-apiserver.yaml | grep etcd 
  ETCDCTL_API=3 etcdctl --cacert= --cert=  --key= get /registry/secrets/<ns>/<secretname>
  
