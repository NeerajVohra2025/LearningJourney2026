          - identity: {} # this fallback allows reading unencrypted secrets;
                         # for example, during initial migration
    replace existing secrets:
    k get secrets -n <ns> -o json | k replace -f -                      
   
    
RuntimeClass (Master Node) : # 1 gvisor  19 # RuntimeClass  Layer sits between application and host kernel interpret all calls in worker node 
           
    apiVersion: node.k8s.io/v1
    kind: RuntimeClass
    metadata:
      name: gvisor
    handler: runsc

    apiVersion: v1
    kind: Pod
    metadata:
      name: mypod
    spec:
      runtimeClassName: gvisor  #RuntimeClass name
    k exec <gvisor-pod> -n <ns> -- dmesg     #check gvisor working fine 
  
  Use in Deployment
