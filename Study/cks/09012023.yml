Kernel Level Hardening tools: 2  # 11
 AppArmor:  /etc/apparmor.d/<profile> in worker node # security kernel module ,allow to prevent any system call (apparmor)

 profile k8s-apparmor-example-deny-write flags=(attach_disconnected) {  # profile name matter, file name can be anything
  #include <abstractions/base>
  file,
  # Deny all file writes.
  deny /** w,
 }
  aa-status | grep <k8s-apparmor-example-deny-write> # profile name
  apparmor_parser <profile> # file name activate the profile
  k run pod --image=nginx --dry-run=client -o yaml > pod.yaml --command -- sh -c 'sleep 1d'
  k lable node wnode01 key=value
  metadata:
    name:
    annotations:
      container.apparmor.security.beta.kubernetes.io/<nginx container name>: localhost/<k8s-apparmor-example-allow-write profile name>    
  spec:
    nodeName: worker # static way to assign a pod to node
    nodeSelector: #dynamic way to assign a pod to node
      key: value
 AppArmor in deployment       
 
 

