   /etc/kubernetes/manifests/kube-apiserver.yaml  
   --admission-control-config-file=/etc/kubernetes/admission/config.yaml
   --enable-admission-plugins=ImagePolicyWebhook      
   cat admision-control.conf #    path of ImagePolicyWebhook
   cat imagepolicy.conf   # path of kubeconfig-file
   vim kube-config-file   # server path
   watch kubectl get nodes  
   
   apiVersion: apiserver.config.k8s.io/v1
    kind: AdmissionConfiguration
    plugins:
      - name: ImagePolicyWebhook
        configuration:
          imagePolicy:
            kubeConfigFile: <path-to-kubeconfig-file>
            allowTTL: 50 # 1000
            denyTTL: 50
            retryBackoff: 500
            defaultAllow: true  # false 

    
EncryptionConfiguration: 1 # 18      /etc/kubernetes/etcd/ec.yaml 
    --encryption-provider-config= /etc/kubernetes/etcd/ec.yaml
 
    apiVersion: apiserver.config.k8s.io/v1
    kind: EncryptionConfiguration
    resources:
      - resources:
          - secrets
          - configmaps
          - pandas.awesome.bears.example
        providers:
          - aescbc:
              keys:
                - name: key1
                  # See the following text for more details about the secret value
