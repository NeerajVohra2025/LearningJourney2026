################---Authorization---################################################################################
Role/ClusterRole   # verb and resource
RoleBinding/ClusterRoleBinding (Mapping of Role/ClusterRole with user/serviceaccount)
kubectl api-resources
kubectl api-resources --namespaced=true
#Role (What action on Which resource - namespace specific)
$ kubectl create role NAME --verb=verb --resource=resource.group/subresource [--resource-name=resourcename] [--dry-run=server|client|none] --namespace=<name/default> :
Create a role named "pod-reader" that allows user to perform "get", "watch" and "list" on pods:
kubectl create role pod-reader --verb=get --verb=list --verb=watch --resource=pods -n <NAMESPACE>  # --verb=get,list,watch
Create a role named "pod-reader" with ResourceName specified:
kubectl create role pod-reader --verb=get --resource=pods --resource-name=readablepod --resource-name=anotherpod
Create a role named "foo" with API Group specified:
kubectl create role foo --verb=get,list,watch --resource=rs.extensions
Create a role named "foo" with SubResource specified:
kubectl create role foo --verb=get,list,watch --resource=pods,pods/status
kubectl describe role <NAME>

#RoleBinding ( Who can do the Role -> user/<namespace>:sa)
$ kubectl create rolebinding NAME --clusterrole=NAME|--role=NAME [--user=username] [--group=groupname] [--serviceaccount=namespace:serviceaccountname] [--dry-run=server|client|none]
Create a role binding for user1, user2, and group1 using the admin cluster role:
kubectl create rolebinding admin --clusterrole=admin --user=user1 --user=user2 --group=group1
kubectl describe rolebinding <NAME>

#ClusterRole
$ kubectl create clusterrole NAME --verb=verb --resource=resource.group [--resource-name=resourcename] [--dry-run=server|client|none]   :
kubectl get clusterrole   # by dafault there are existing cluster roles
kubectl describe clusterrole admin
Create a cluster role named "pod-reader" that allows user to perform "get", "watch" and "list" on pods:
kubectl create clusterrole pod-reader --verb=get,list,watch --resource=pods
Create a cluster role named "pod-reader" with ResourceName specified:
kubectl create clusterrole pod-reader --verb=get --resource=pods --resource-name=readablepod --resource-name=anotherpod
Create a cluster role named "foo" with API Group specified:
kubectl create clusterrole foo --verb=get,list,watch --resource=rs.extensions
Create a cluster role named "foo" with SubResource specified:
kubectl create clusterrole foo --verb=get,list,watch --resource=pods,pods/status
Create a cluster role name "foo" with NonResourceURL specified:
kubectl create clusterrole "foo" --verb=get --non-resource-url=/logs/*
Create a cluster role name "monitoring" with AggregationRule specified:
kubectl create clusterrole monitoring --aggregation-rule="rbac.example.com/aggregate-to-monitoring=true"
kc clusterrole clust-admin --verb=get,list,watch,create,delete,update --resource=pod,deployment,persistentvolume,node
kg clusterrole <clust-admin>
ki clusterrole clust-admin>

#ClusterRoleBinding
$ kubectl create clusterrolebinding NAME --clusterrole=NAME [--user=username] [--group=groupname] [--serviceaccount=namespace:serviceaccountname] [--dry-run=server|client|none]
kubectl create clusterrolebinding cluster-admin --clusterrole=cluster-admin --user=user1 --user=user2 --group=group1
kc clusterrolebinding admin-binding --user=admin clusterrole=clust-admin
kc clusterrolebinding pvviewer-role-binding --serviceaccount=default:pvviewer --clusterrole=pvviewer-role
