What are admission webhooks?

 Admission webhooks are HTTP callbacks that receives admission requests and do something with them. You can define two types of admission webhooks, validating admission webhook and mutating admission webhook. Mutating admissionwebhooks are invoked first, and can modify objects sent to the API server to enforce custom defaults.After all object modifications are complete, and after the incoming object is validated by API server, validating webhooks are invoked and can reject requests to enforce custom policies.

Note: Admission webhooks that need guarantee they see the final state of the Object in order to enforce polocy should use a validating admission webhook, since objects can be modified after being seen by mutating webhooks
