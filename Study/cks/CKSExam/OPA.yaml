################---Authentication---################################################################################
How to create user, certificate and pass certificate info in config object?
K8s does not have any User Object
# step1 create user
mkdir -p /home/devops/certs
cd /home/devops/certs
# step2 generate Key/Pair/Certificate
step2.1: generate private key
openssl genrsa -out devops.key 2048
step2.2: create .csr using .key
openssl req -new -key devops.key -out devops.csr # common name (username) , organization name
step2.3: base64 of .csr
cat devops.csr | base64 -w 0   # used in creating CertificateSiginingRequest 
#step3 create CertificateSigningRequest CSR (Certificate Signing request)
nano devops.yaml
apiVersion: certificates.k8s.io/v1
kind: CertificateSigningRequest
metadata:
  name: devops
spec:
  request: <output of 2.3>
  signerName: kubernetes.io/kube-apiserver-client
  expirationSeconds: 86400  # one day
  usages:
  - client auth
kc -f devops.yaml
#step4 sign the request
step4.1: Get the list of CSRs:
kg csr  # pending approval
step4.2: Approve the CSR:
kubectl certificate approve devops # csr approved 

#How user use this certificate
k config -h
kubectl config view
kubectl config view --raw
kubectl config set-credentials devops --client-key=devops.key --client-cert=devops.cert --embed-certs
kubectl config set-context devops --user=devops --cluster=kubernetes
kubectl config get-contexts
kubectl config use-contexts devops
kubctl auth can-i delete pod  # not authorized till now
#kubectl auth can-i delete pods --as system:seviceaccount:<namespaces>:<serviceaccountname>
