#UC1: 
You want to have an external database cluster in production, but in your test environment you use your own databases.
You want to point your Service to a Service in a different Namespace or on another cluster,You are migrating a workload to Kubernetes.
While evaluating the approach,you run only a portion of your backends in Kubernetes.In any of these scenarios you can define a Service without a Pod selector. For example:
apiVersion: v1
kind: Service
metadata:
  name: my-service
spec:
  ports:
    - protocol: TCP
      port: 80
      targetPort: 9376
This Service has no selector, the corresponding Endpoints object is not created automatically. You can manually map the Service to the network address and port where it's running,
by adding an Endpoints object manually:
kind: Endpoints
apiVersion: v1
metadata:
  name: my-service
subsets:
  - addresses:
      - ip: 192.0.2.42
    ports:
      - port: 9376
Accessing a Service without a selector works the same as if it had a selector. In the example above, traffic is routed to the single endpoint defined in the YAML: 192.0.2.42:9376 (TCP).

#UC2 
An ExternalName Service is a special case of Service that does not have selectors and uses DNS names instead Services of type ExternalName map a Service to a DNS name, not to a 
typical selector such as my-service or cassandra. You specify these Services with the spec.externalName parameter.This Service definition, for example, maps the my-service Service in
the prod namespace to my.database.example.com
kind: Service
apiVersion: v1
metadata:
  name: my-service
  namespace: prod
spec:
  type: ExternalName
  externalName: my.database.example.com
  
#UC3 (External IP)
If there are external IPs that route to one or more cluster nodes, Kubernetes Services can be exposed on those externalIPs. Traffic that ingresses into the cluster with the external
IP (as destination IP), on the Service port, will be routed to one of the Service endpoints.externalIPs are not managed by Kubernetes and are the responsibility of the cluster 
administrator.
apiVersion: v1
kind: Service
metadata:
  name: my-service
spec:
  selector:
    app: MyApp
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 9376
  externalIPs:
    - 80.11.12.10
