#step1: PersistentVolume
#hostPath
kind: PersistentVolume
apiVersion: v1
metadata:
   name: 
spec:
  persistentVolumeClaimPolicy:  Recycle # Retain| Delete 
  accessModes:
  storageClassName:
  capacity:
  hostPath:
  
kind: PersistentVolume
apiVersion: v1
metadata:
   name: my-pv
spec:
  persistentVolumeClaimPolicy:  Recycle # Retain| Delete
  accessModes:
     - readWriteMany
     - readWriteOnce
     - readOnlyMany
  storageClassName: standard
  capacity:
    storage: 100Mi
  hostPath:
     path: /tmp/pvdata
/*
ReadWriteOnce- The volume can be mounted as read-write by a single node (RWO): access by only pods running on same node.
ReadOnlyMany- The volume can be mounted as read-only by a many node (ROX): all pods running on any node can read data from volume.
ReadWriteMany- The volume can be mounted as read-write by a many node (RWX):access by any pods running on any node.

Recycle- If you delete the PVC, data will be erased and can be assigned to others (first delete pod, only after that PVC can be deleted)
Retain- If you delete the PVC, PV still can't be assigned to others.(first delete pod, only after that PVC can be deleted)
Delete-If you delete the PVC, data will be erased and PV also deleted (first delete pod, only after that PVC can be deleted)
*/
#nfs
kind: PersistentVolume
apiVersion: v1
spec:
  name: my-pv
spec:
  accessModes:
    - ReadWriteMany
    - ReadWriteOnce
    - ReadOnlyMany 
  storageClassName:   
  capacity:
     storage: 100Mi
  nfs:
     path:  
     server: 10.10.0.1  
     
#step2: PersistentVolumeClaim
kind: PersistentVolumeClaim
apiVersion: v1
metadata:
   name: my-pvc
spec:
  storageClass: standard
  accessModes:
    - ReadWriteOnce
    - ReadWriteMany
  resources:
     requests:
        storage: 100Mi  
#step3: Create POD to claim the volume 
kind: Pod
apiVersion: v1
metadata:
spec:
  volume:
    persistentVolumeClaim:
        claimName: my-pvc    
#edit pvc
k edit pvc <my-pvc> --record
ki pvc my-pvc | grep -i record > /tmp/pvc.txt
kg pvc
Once underlying volume has been expanded by the storage provider, then the PersistentVolume object will reflect the updated size and the PVC will have the FileSystemResizePending  
condition.
Once the PVC has the condition FileSystemResizePending then pod that uses the PVC can be restarted to finish file system resizing on the node. Restart can be achieved by deleting
and recreating the pod or by scaling down the deployment and then scaling it up again. Once file system resizing is done, the PVC will automatically be updated to reflect new size

