#include <tunables/global>

profile k8s-apparmor-example-deny-write flags=(attach_disconnected) {  # profile name matter, file name can be anything
  #include <abstractions/base>

  file,

  # Deny all file writes.
  deny /** w,
}

apparmor_parser <k8s-apparmor-example-deny-write> # file name
