k run pod --image=nginx --dry-run=client -o yaml > pod.yaml --command -- sh -c 'sleep 1d'
apiVersion: v1
kind: Pod
metadata:
  name: hello-apparmor
  annotations:
    # Tell Kubernetes to apply the AppArmor profile "k8s-apparmor-example-deny-write".
    # Note that this is ignored if the Kubernetes node is not running version 1.4 or greater.
    container.apparmor.security.beta.kubernetes.io/<name of container hello>: localhost/k8s-apparmor-example-deny-write  # profile name
spec:
  nodeName: worker # static way of assiging a pod to a node
  nodeSelector:  # dynamic way of assiging a pod to a node
    type: worker # k label nodes worker type=worker
  containers:
  - name: hello
    image: busybox:1.28
    command: [ "sh", "-c", "echo 'Hello AppArmor!' && sleep 1h" ]
    

