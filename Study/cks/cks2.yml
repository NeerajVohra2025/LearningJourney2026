Runtime security audit:

Why Audit Logs?

Did someone access an important secret while it was not protected?

When was the last time that user X did access cluster Y?

Does my CRD work properly?

 

Audit Policy Different Stages?

Each request can be recorded with an assocaited "stage"

RequestReceived:

The stage for events generated as soon as the audit handler receives the request, and before it is delegated down the handler chain.

ResponseStarted:

Once the resonse headers are sent, but before the response body is sent. This stage is only generated for long-running requests (e.g. watch)

ResponseComplete:

The respone body has been completed and no more bytes will be sent.

Panic:

Events generated when a panin occurred.

 

Audit Policy Rule LEVELS?

None: don't log event that match this rule.

Metadata: log request metadata (requesting user,timestamp,resource,verb,etc.) but not request and response body.

Requst: log event metadata and request body but not the response body. This does not apply for non-resource requests.

RequstResponse: log event metadata and request and response bodies. This does not apply for non-resource requests.

 

Where to store all data?

Log (JSON)

Webhook (external API)

Dynamic backend (AuditSink API)

 

