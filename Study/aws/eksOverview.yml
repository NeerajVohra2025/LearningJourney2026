Classic Load Balancer:   # 78  
apiVersion: v1
kind: Service
metadata:
  name: clb-usermgmt-restapp
  labels:
    app: usermgmt-restapp
spec:
  type: LoadBalancer                        # Regular k8s Service manifest with type as LoadBalancer  NodePort->LoadBalancer, Default CLB
  selector:
    app: usermgmt-restapp     
  ports:
  - port: 80
    targetPort: 8095
user will access endpoint of CLB

Network Load Balancer:   # 79
apiVersion: v1
kind: Service
metadata:
  name: nlb-usermgmt-restapp
  labels:
    app: usermgmt-restapp
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: nlb    # To create Network Load Balancer
spec:
  type: LoadBalancer # Regular k8s Service manifest with type as LoadBalancer
  selector:
    app: usermgmt-restapp     
  ports:
  - port: 80
    targetPort: 8095
