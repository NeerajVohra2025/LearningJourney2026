EKS Cluster:
Step1:Create EKS Cluster:
# Create Cluster Will take 15-20 minutes
eksctl create cluster --name=eksdemo1 --region=us-east-1 --zones=us-east-1a,us-east-1b --without-nodegroup 

# Get List of clusters
eksctl get cluster 

Step2: Create & Associate IAM OIDC Provider for our EKS Cluster 
To enable and use AWS IAM roles for Kubernetes service accounts on our EKS cluster, we must create & associate OIDC identity provider.
To do so using eksctl we can use the below command.

# Template
eksctl utils associate-iam-oidc-provider \
    --region region-code \
    --cluster <cluter-name> \
    --approve

# Replace with region & cluster name
eksctl utils associate-iam-oidc-provider --region us-east-1 --cluster eksdemo1 --approve
Step3: Create EC2 Keypair
  Create a new EC2 Keypair with name as kube-demo
  This keypair we will use it when creating the EKS NodeGroup.
  This will help us to login to the EKS Worker Nodes using Terminal. 

Step4:Create Node Group with additional Add-Ons in Public Subnets:
These add-ons will create the respective IAM policies for us automatically within our Node Group role.

