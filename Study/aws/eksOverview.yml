EKS Storage:
  Drawbacks of EBS CSI for MySQL DE:
    Complex setup to achieve HA
    Complex Multi-AZ support for EBS (AZ level resource)
    Complex Master-Master MySQL setup
    Complex Master-Slave MySQL setup
    No Automatic Backup and Recovery
    No Auto-Upgrade MySQL
  Advantage of RDS Database:
    High Availability
    Backup and Recovery
    Read Replicas
    Metrics and Monitoring available out of the box
    Automatic Upgrades
    Multi-AZ Support
    
  
