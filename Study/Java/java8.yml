Streams:length of code reduced

java.io  # FileInputStream     #purpose write some text/binary data to/from file w.r.t file(sequence of character)

java.util.streams streams related to Collection ( to perform actions on Collection) # process objects from collection

 

Collection Vs Stream:

Collection: group of Objects as a single entity

Stream: Want to process Objects from the Collection (all the Objects)

UC: list out all the students from the collection whose marks is greater than 80

ArrayList<Integer> l=new ArrayList<Integer>();

 

filter(): Listout

UC1: Listout(filter) all even numbers from a collection

List<Integer> l1=l.stream().filter(I->I%2==0).collect(Collectors.toList());

 

map(): each element of the collection perform some action

UC2: performAction(map) docuble each numbers from a collection

List<Integer> l1=l.stream().map(I->I*2).collect(Collectors.toList());

                            

Stream s=<Collection object>.stream();  # stream() present in Collection(I) as default method

Stream is an Interface present java.util.stream package, used to process objects from the collection

processing contains two steps:

step1: configuring

              filter ( based on some boolean condition) # less number of objects

              map (based on some function)   # equal number of object

filter:

If you want to filter elements from the collection based on some boolean condition then we go for filtering

We can configure filter by using filter() method of Stream(I)

public Stream filter(Predicate<T> t)     # parameter can be boolean valued function or lambda-expression

Stream s=c.stream().filter(i->i%2==0)

 

map:

If you want to create a seperate new object for every object present in collection,based on some function.

We can configure map by using map() method of Stream(I)

public Stream map(Function<T,R> t)     # parameter can be boolean valued function or lambda-expression

Stream s=c.stream().map(i->i*2)

 

 

step2: processing

collect():

This method collects the elements from the stream and adding to the specified Collection

 

count():

This method returns the number of elements present in Stream.

public long count()      

long count=l.stream().filter(s->s.length()>=9).count();

 

sorted():

we can use sorted() method to sort elements stream

sorted(): default sorting order

sorted(Coparator c): customized sorting order


min(Comparator c)/max(Comparator c) # list must be sorted

min(Comparator c):

returns min value according to specified Comparator

 

max(Comparator c):

returns max value according to specified Comparator

 

Integer min=l.stream().min((i1,i2)->i1.compareTo(i2)).get()

 

forEach() method:

This method can't return anything

This method can take lambda-expression as an argument and apply that lambda-expression for each element present in stream.

l.stream().forEach(s->System.out.println(s));

l.stream().forEach(System.out::println);   # replace lambda-expression with method reference

 

toArray():

we can use toArray() method to copy elements present in the stream into specifies Array

Integer[] array=l.stream().toArray(Integer[]::new);

 

Stream.Of() Method:

Stream concept not only applicatble on collection, it also applicable on group of values and arrays

9,99,999,9999,99999   # group of values

Double[] d={10.0,10.1,10.2}

For Group of Values

Stream<Integer> s=Stream.of(9,99,999,9999,99999)

s.forEach(System.out::println);

 

For Arrays:

Double[] d={10.0,10.1,10.2}

Stream<Integer> s=Stream.of(d)