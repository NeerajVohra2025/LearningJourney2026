Runnable(I)-> run()  Is a functional Interface # job of Thread

 

Class ThreadDemo{

public static void main(String[] str){

              Runnable r=new MyRunabale();  # MyRunnable Implements Runnable (I)

        Thread t= new Thread(r);  # only one main thread

        t.start();                   # one main and one child thred (Its job is run method)

        for(int i=0;i<10;i++) {System.out.println("main thread")}  # executed by main thread

}

 

Class ThreadDemo2{

public static void main(String[] str){

              Runnable r=()->{

                             for (inti=0;i<10;i++){System.out.println("child thread")}          

              }

        Thread t= new Thread(r);  # only one main thread

        t.start();                   # one main and one child thred (Its job is run method)

        for(int i=0;i<10;i++) {System.out.println("main thread")}  # executed by main thread

}

 

