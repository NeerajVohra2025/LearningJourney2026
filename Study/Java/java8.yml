Comparator(I) and compare(obj1,obj2): Customized Sorting Order

  If +ve means obj1>obj2 and obj1 will come after obj2

  if -ve if obj1 <obj2 ,obj1 has to come before obj2

 

Sorting Elements of ArrayList without Lambda expressions:

ArrayList<Integer> al=new ArrayList<Integer>();

Collections.sort(al,Comparator obj);  # customized sorting order e.g. descending order

Collections.sort(al); # default Natural Sorting Order

 

How to sort as descending order-> customized sorting order

class myComparator implements Comparator<Integer>{

              public int compare(Integer I1,Integer I2){

              If (I1>I2){

              return -1;#obj1 has to come after obj2

              elseIf (I1<I2)

              return 1;#obj1 has to come before obj2

              }

              else

              return 0;

              }

# return (I1>I2>?-1:(I1<I2)?1:0    # ternary operator

Collections.sort(al,new myComparator()); 

 

Sorting Elements of ArrayList with Lambda expressions:

Collections.sort(al,(I1,I2)->(I1>I2>?-1:(I1<I2)?1:0);

 

 

